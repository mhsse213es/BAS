# BAS Platform — Helm values
# Override with: helm upgrade --install bas-platform ./helm/bas-platform -f values-prod.yaml

global:
  imageRegistry: ""      # set to your private registry, e.g. registry.internal/bas
  imagePullPolicy: IfNotPresent
  namespace: bas-platform

# ── Orchestrator (Go) ─────────────────────────────────────────────────────────
orchestrator:
  image: bas-orchestrator
  tag: "1.0.5"
  replicas: 1
  port: 9000
  nodePort: 32090
  config:
    httpPort: 9000
    scenariosDir: /scenarios
    jwtSecret: ""          # REQUIRED — set via --set or values-prod.yaml
  caldera:
    url: "http://caldera:8888"   # ClusterIP service — same namespace
    apiKey: "ADMIN123"           # Caldera default red API key (local.yml override not applied at runtime)
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ── Python API ────────────────────────────────────────────────────────────────
api:
  image: bas-api
  tag: "1.0.0"
  replicas: 2
  port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ── PostgreSQL (External — runs on the Ubuntu host, not in k3s) ───────────────
postgres:
  host: postgres.bas-data.svc.cluster.local   # headless service DNS name (do not change)
  externalIP: "10.128.0.2"                    # actual host IP postgres is running on
  port: 5432
  database: bas_platform
  user: bas_user
  password: ""     # REQUIRED — set via --set or sealed secret

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  host: bas.internal          # change to your FQDN
  tlsEnabled: false           # set true with cert-manager in production
  tlsSecretName: bas-tls
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"

# ── Caldera (MITRE ATT&CK Simulation Engine) ──────────────────────────────────
caldera:
  enabled: true
  image: ghcr.io/mitre/caldera
  tag: "latest"
  port: 8888
  nodePort: 32088              # external access: http://<vm-ip>:32088
  apiKey: "BASPlatform2024"    # red-team API key — must match orchestrator.caldera.apiKey
  apiKeyBlue: "BASBlue2024"    # blue-team API key
  adminPassword: "BASAdmin2024"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi

# ── Network Policy ────────────────────────────────────────────────────────────
networkPolicy:
  enabled: true               # default-deny with explicit allow rules
