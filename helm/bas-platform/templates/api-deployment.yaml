apiVersion: apps/v1
kind: Deployment
metadata:
  name: bas-api
  namespace: {{ .Values.global.namespace }}
  labels:
    app: bas-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: bas-api
  template:
    metadata:
      labels:
        app: bas-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: api
          image: "{{ .Values.global.imageRegistry }}{{ .Values.api.image }}:{{ .Values.api.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bas-secrets
                  key: DATABASE_URL
            - name: ORCHESTRATOR_URL
              value: "http://bas-orchestrator:{{ .Values.orchestrator.port }}"
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: bas-api
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    app: bas-api
  ports:
    - port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
  type: ClusterIP
