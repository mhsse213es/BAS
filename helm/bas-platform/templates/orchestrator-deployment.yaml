apiVersion: apps/v1
kind: Deployment
metadata:
  name: bas-orchestrator
  namespace: {{ .Values.global.namespace }}
  labels:
    app: bas-orchestrator
spec:
  replicas: {{ .Values.orchestrator.replicas }}
  selector:
    matchLabels:
      app: bas-orchestrator
  template:
    metadata:
      labels:
        app: bas-orchestrator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: orchestrator
          image: "{{ .Values.global.imageRegistry }}{{ .Values.orchestrator.image }}:{{ .Values.orchestrator.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.orchestrator.port }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bas-secrets
                  key: POSTGRES_DSN
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bas-secrets
                  key: JWT_SECRET
            {{- if .Values.orchestrator.caldera.url }}
            - name: CALDERA_URL
              value: {{ .Values.orchestrator.caldera.url | quote }}
            - name: CALDERA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bas-secrets
                  key: CALDERA_API_KEY
                  optional: true
            {{- end }}
          command: ["/orchestrator", "/etc/bas/config.json"]
          volumeMounts:
            - name: config
              mountPath: /etc/bas/config.json
              subPath: config.json
            - name: dashboard
              mountPath: /wwwroot
            {{- if .Values.license.content }}
            - name: license
              mountPath: /etc/bas/bas.lic
              subPath: bas.lic
            {{- end }}
          resources:
            {{- toYaml .Values.orchestrator.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.orchestrator.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.orchestrator.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: bas-orchestrator-config
        - name: dashboard
          configMap:
            name: bas-dashboard
        {{- if .Values.license.content }}
        - name: license
          secret:
            secretName: bas-license
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: bas-orchestrator
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    app: bas-orchestrator
  ports:
    - port: {{ .Values.orchestrator.port }}
      targetPort: {{ .Values.orchestrator.port }}
      nodePort: {{ .Values.orchestrator.nodePort }}
  type: NodePort
