apiVersion: v1
kind: ConfigMap
metadata:
  name: bas-orchestrator-config
  namespace: {{ .Values.global.namespace }}
data:
  config.json: |
    {
      "database_url": "postgres://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.database }}",
      "jwt_secret": "{{ .Values.orchestrator.config.jwtSecret }}",
      "http_port": {{ .Values.orchestrator.config.httpPort }},
      "scenarios_dir": "{{ .Values.orchestrator.config.scenariosDir }}"
    }
