# Headless Service + Endpoints pointing directly to the PostgreSQL host IP.
# ExternalName services don't support IPs — Endpoints do.
apiVersion: v1
kind: Namespace
metadata:
  name: bas-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: bas-data
spec:
  clusterIP: None
  ports:
    - port: {{ .Values.postgres.port }}
      targetPort: {{ .Values.postgres.port }}
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: postgres
  namespace: bas-data
subsets:
  - addresses:
      - ip: {{ .Values.postgres.externalIP }}
    ports:
      - port: {{ .Values.postgres.port }}
