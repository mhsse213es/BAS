{{- if .Values.networkPolicy.enabled }}
# Default deny — only explicitly allowed traffic is permitted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Orchestrator: inbound from anywhere (NodePort agents + API + health probes)
# Outbound: postgres (host IP), caldera (pod), DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-orchestrator
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector:
    matchLabels:
      app: bas-orchestrator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {}
  egress:
    - to:
        - ipBlock:
            cidr: {{ .Values.postgres.externalIP }}/32
      ports:
        - port: {{ .Values.postgres.port }}
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: caldera
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# API: inbound from anywhere (ingress-nginx + health probes)
# Outbound: orchestrator (pod), postgres (host IP), DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector:
    matchLabels:
      app: bas-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: bas-orchestrator
    - to:
        - ipBlock:
            cidr: {{ .Values.postgres.externalIP }}/32
      ports:
        - port: {{ .Values.postgres.port }}
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
