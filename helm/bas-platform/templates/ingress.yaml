{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bas-ingress
  namespace: {{ .Values.global.namespace }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  {{- if .Values.ingress.tlsEnabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  {{- end }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host }}
      {{- end }}
      http:
        paths:
          # Analytics-only endpoints → Python API
          - path: /api/scenarios/runs
            pathType: Prefix
            backend:
              service:
                name: bas-api
                port:
                  number: {{ .Values.api.port }}
          # Everything else (auth, agents, scenarios, ws, static) → Go orchestrator
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bas-orchestrator
                port:
                  number: {{ .Values.orchestrator.port }}
{{- end }}
