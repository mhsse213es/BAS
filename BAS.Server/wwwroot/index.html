        certin: { ref: 'CERT-In/2022 §6.2', clause: 'MFA mandatory on all critical and internet-facing systems.', action: 'Enforce MFA using TOTP or hardware token; disable SMS OTP; audit exemptions quarterly.' },
      },
      // ── LATERAL MOVEMENT ──────────────────────────────────────────────────
      {
        match: /lateral movement|pass.the.hash|smb lateral|remote.*service.*exec/i,
        pci: { ref: 'Req 1.3.2', clause: 'Restrict inbound and outbound traffic to only necessary communication.', action: 'Enable SMB signing on all endpoints; block NTLM where possible; implement micro-segmentation between CDE tiers.' },
        iso: { ref: 'A.8.22', clause: 'Networks shall be segregated to limit impact of lateral breach.', action: 'Enforce SMB signing via GPO; disable NTLM v1; implement VLAN isolation for critical banking segments.' },
        rbi: { ref: 'RBI/2015-16/418 §7', clause: 'Network segmentation is mandatory for banking system environments.', action: 'Deploy network segmentation with firewall ACLs between user, server, and payment network tiers.' },
        dpdp: { ref: 'Sec 8(2)', clause: 'Contain breach propagation to protect personal data stores.', action: 'Segment personal data stores on isolated VLAN; restrict SMB access to authorised admin systems only.' },
        itact: { ref: 'Sec 43(a)', clause: 'Unauthorized lateral access between systems is an IT Act offence.', action: 'Enable lateral movement detection via UEBA; alert on unusual admin share access or wmiexec patterns.' },
        certin: { ref: 'CERT-In/2022 §5.3', clause: 'T1021: Remote service lateral movement is a notifiable tracked technique.', action: 'Enable SMB signing; block NTLM relay; configure SIEM to alert on pass-the-hash authentication events.' },
      },

        pci: { ref: 'Req 1.4.1', clause: 'Restrict and inspect outbound traffic from CDE systems.', action: 'Deploy egress filtering; whitelist DNS resolvers; alert on high-frequency periodic outbound connections via SIEM.' },
        iso: { ref: 'A.8.20', clause: 'Network controls shall include monitoring of outbound communications.', action: 'Implement DNS sinkholing for known C2 domains; deploy NDR to detect beaconing by periodicity analysis.' },
        rbi: { ref: 'RBI/2021-22/112 §8.1', clause: 'Inspect and control all outbound traffic from banking systems.', action: 'Block direct internet access from servers; route all traffic via authenticated proxy with SSL inspection.' },
        dpdp: { ref: 'Sec 8(2)', clause: 'Prevent unauthorised exfiltration of personal data via C2 channels.', action: 'Deploy DNS RPZ to block C2 domains; alert on HTTPS connections to newly-registered or low-reputation domains.' },
        itact: { ref: 'Sec 43', clause: 'Remote control of systems via C2 constitutes unauthorized access.', action: 'Enable full packet capture for incident response; correlate outbound flows with threat intelligence feeds.' },
        certin: { ref: 'CERT-In/2022 §4(h)', clause: 'C2 beaconing activity must be reported within 6 hours of detection.', action: 'Deploy NDR (Network Detection & Response); configure CERT-In incident report template for C2 events.' },
      },

        iso: { ref: 'A.8.24', clause: 'Information transfer policies shall prevent unauthorised data movement.', action: 'Configure DLP to inspect outbound web traffic and email for sensitive data patterns; block unapproved cloud services.' },
        rbi: { ref: 'DPSS.CO.PD.No.267 §8', clause: 'Customer financial data shall not be transmitted to unauthorised external parties.', action: 'Implement CASB to control cloud storage access; alert on bulk file uploads above threshold.' },
        dpdp: { ref: 'Sec 8(6)', clause: 'Personal data shall not be transferred without lawful authority.', action: 'Enable Purview DLP or equivalent; block data transfer to uncategorised domains; alert on bulk file access events.' },
        itact: { ref: 'Sec 43A', clause: 'Data exfiltration due to inadequate controls constitutes negligence.', action: 'Monitor large outbound data transfers (>50MB); alert on archiving tools (7zip, rar) compressing sensitive paths.' },
        certin: { ref: 'CERT-In/2022 §4(i)', clause: 'Data exfiltration incidents must be reported to CERT-In within 6 hours.', action: 'Deploy NetFlow monitoring; create SIEM rule for large outbound transfers outside business hours.' },
      },
      // ── IMPACT: Ransomware / shadow copies ────────────────────────────────
      {
        match: /ransomware|shadow copy|vssadmin delete|file.*encrypt.*impact/i,
        pci: { ref: 'Req 12.10.1', clause: 'An incident response plan must address ransomware and destructive attacks.', action: 'Enable Controlled Folder Access in Defender; maintain offline immutable backups; test recovery quarterly.' },
        iso: { ref: 'A.8.13', clause: 'Information backup procedures shall protect against ransomware destruction.', action: 'Implement 3-2-1 backup strategy; enable VSS shadow copy protection; block vssadmin.exe for non-admin users.' },
        rbi: { ref: 'RBI/2021-22/112 §9', clause: 'Banks must maintain tested BCP/DR plans against ransomware scenarios.', action: 'Segment backups on isolated network; test bare-metal restore quarterly; disable SMBv1 across environment.' },
        dpdp: { ref: 'Sec 8(2)', clause: 'Ensure availability and recoverability of personal data systems.', action: 'Deploy ransomware-resilient backup with air-gap; enable Controlled Folder Access for personal data directories.' },
        itact: { ref: 'Sec 43', clause: 'Ransomware deployment is destruction of data — a serious IT Act offence.', action: 'Implement honeypot files in critical folders; alert on mass file extension changes or shadow copy deletion.' },
        certin: { ref: 'CERT-In/2022 §4(j)', clause: 'Ransomware attacks must be reported to CERT-In within 6 hours of detection.', action: 'Block vssadmin.exe and wmic shadowcopy delete for non-admins; test IR ransomware playbook bi-annually.' },
      },
      // ── PATCHING / VULNERABILITY MANAGEMENT ───────────────────────────────
      {
        match: /patch|windows update|missing.*patch|critical.*update/i,
        pci: { ref: 'Req 6.3.3', clause: 'Security patches must be applied within defined risk-based timelines.', action: 'Apply critical patches within 1 month; critical CVE (CVSS≥9) within 15 days. Automate via WSUS or Intune.' },
        iso: { ref: 'A.8.8', clause: 'Technical vulnerabilities shall be managed through timely patching.', action: 'Run monthly vulnerability scans; patch within SLA; track remediation via vulnerability management platform.' },
        rbi: { ref: 'RBI/2015-16/418 §6.6', clause: 'Critical patches must be applied within prescribed timelines for banking systems.', action: 'Patch Windows critical vulnerabilities within 30 days; emergency patches (0-day) within 72 hours.' },
        dpdp: { ref: 'Sec 8(2)', clause: 'Systems processing personal data must be kept free of known vulnerabilities.', action: 'Enable automatic updates for OS and critical applications on personal data systems; track with CMDB.' },
        itact: { ref: 'Sec 43A', clause: 'Failure to patch known vulnerabilities constitutes negligence under IT Act.', action: 'Maintain patch compliance >95%; report critical unpatched systems to CISO weekly.' },
        certin: { ref: 'CERT-In/2022 §6.5', clause: 'Critical vulnerabilities must be reported and patched within 6 hours per CERT-In.', action: 'Subscribe to CERT-In vulnerability notifications; trigger emergency change control for CVSS≥9 vulnerabilities.' },
      },
      // ── AUDIT LOGGING / SIEM ──────────────────────────────────────────────
      {
        match: /audit log|event log|siem|log monitoring|security.*event.*log/i,
        pci: { ref: 'Req 10.2.1', clause: 'Implement audit logs capturing user activities, admin actions, and security events.', action: 'Enable Windows security auditing (logon, privilege use, object access); forward to SIEM within 60 seconds.' },
        iso: { ref: 'A.8.15', clause: 'Event logs shall be produced, stored, protected and regularly reviewed.', action: 'Configure Windows Event Forwarding to centralised SIEM; set retention to 365 days minimum.' },
        rbi: { ref: 'RBI/2021-22/112 §8.3', clause: 'Transaction and access logs must be retained for minimum 5 years by banks.', action: 'Implement centralised SIEM with 5-year log retention; enable real-time correlation rules for critical events.' },
        dpdp: { ref: 'Sec 8(5)', clause: 'Audit trails of personal data access must be retained per statutory timelines.', action: 'Log all access to personal data fields; retain access logs per DPDP retention schedule; enable tamper alerting.' },
        itact: { ref: 'Sec 67C', clause: 'Intermediaries must preserve information in the manner and format prescribed.', action: 'Implement immutable log storage (WORM); configure 180-day hot retention + 5-year cold archive.' },
        certin: { ref: 'CERT-In/2022 §5.4', clause: '180-day log retention is mandatory; logs must be available for CERT-In investigations.', action: 'Configure SIEM retention to 180 days active; archive to S3 with AES-256 for 5 years; audit log integrity monthly.' },
      },
      // ── POST-COMPROMISE / INCIDENT RESPONSE ───────────────────────────────
      {
        match: /post.compromise|kill.chain|auto.response|alert.*generation|incident.*detect/i,
        pci: { ref: 'Req 12.10.2', clause: 'Test the incident response plan at least annually.', action: 'Run tabletop exercise covering ransomware and data breach scenarios; update IR runbook after each incident.' },
        iso: { ref: 'A.5.26', clause: 'Respond to information security incidents in a structured and effective manner.', action: 'Implement SOAR platform for automated containment; define RTO/RPO for critical banking systems.' },
        rbi: { ref: 'RBI/2021-22/112 §10', clause: 'Cybersecurity incidents must be reported to RBI and CERT-In per prescribed timelines.', action: 'Establish 24×7 SOC; define escalation matrix; test incident response against RBI cyber drill scenarios.' },
        dpdp: { ref: 'Sec 8(6)', clause: 'Data principals and board must be notified within prescribed timelines after personal data breach.', action: 'Implement breach notification workflow; designate DPO; test notification process quarterly.' },
        itact: { ref: 'Sec 43A', clause: 'Timely incident response and notification are reasonable security practices.', action: 'Maintain documented IR plan; test recovery procedures; train Security team on IT Act notification requirements.' },
        certin: { ref: 'CERT-In/2022 §4', clause: 'All cybersecurity incidents must be reported to CERT-In within 6 hours of detection.', action: 'Maintain CERT-In incident reporting portal credentials; deploy automated alert-to-ticket pipeline for P1 events.' },
      },
    ];


    function getComplianceForCheck(checkName) {
      const entry = COMPLIANCE_MAP.find(e => e.match.test(checkName));
      return entry || null;
    }

    function renderComplianceSection(agentId) {
      const r = reports[agentId];
      if (!r) return;

      const cats = r.categories || r.Categories || [];
      const contentArea = document.getElementById('contentArea');

      // Gather all failing checks
      const failingChecks = [];
      cats.forEach(cat => {
        const checks = cat.checks || cat.Checks || [];
        checks.forEach(ch => {
          const res = ch.result || ch.Result;
          if (res === 'Fail') {
            failingChecks.push({ checkName: ch.name || ch.Name, category: cat.name || cat.Name });
          }
        });
      });

      // Build per-framework violation list
      const fwViolations = {};
      FRAMEWORKS.forEach(fw => { fwViolations[fw.id] = []; });

      failingChecks.forEach(({ checkName, category }) => {
        const entry = getComplianceForCheck(checkName);
        if (entry) {
          FRAMEWORKS.forEach(fw => {
            if (entry[fw.id]) {
              fwViolations[fw.id].push({ checkName, category, ...entry[fw.id] });
            }
          });
        }
      });

      const totalViolations = Object.values(fwViolations).reduce((s, arr) => s + arr.length, 0);

      // Build HTML
      let html = `<div class="compliance-section" id="complianceSection">`;
      html += `<div class="compliance-section-title">Compliance Report</div>`;

      if (totalViolations === 0) {
        html += `<div class="compliance-clean-banner">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
          All checks passed — no compliance violations detected across all 6 frameworks.
        </div>`;
      } else {
        // Summary pill bar
        html += `<div class="compliance-summary-bar">`;
        FRAMEWORKS.forEach(fw => {
          const count = fwViolations[fw.id].length;
          html += `<div class="compliance-fw-pill ${fw.cls}" onclick="document.getElementById('cfw-${fw.id}').scrollIntoView({behavior:'smooth',block:'start'})">
            ${fw.label} <span class="fw-count">${count} finding${count !== 1 ? 's' : ''}</span>
          </div>`;
        });
        html += `</div>`;

        // Per-framework cards
        html += `<div class="compliance-grid">`;
        FRAMEWORKS.forEach((fw, fi) => {
          const violations = fwViolations[fw.id];
          const rowsHtml = violations.map(v => `
            <div class="compliance-row">
              <div class="compliance-check-icon">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#ff4f5a" stroke-width="3">
                  <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
              </div>
              <div class="compliance-row-body">
                <div class="compliance-check-name">${esc(v.checkName)}</div>
                <div class="compliance-req">
                  <span class="compliance-req-ref ${fw.refCls}" style="background:rgba(0,0,0,.2);">${esc(v.ref)}</span>
                  ${esc(v.clause)}
                </div>
                <div class="compliance-action">${esc(v.action)}</div>
              </div>
            </div>`).join('');

          html += `
          <div class="compliance-card" id="cfw-${fw.id}">
            <div class="compliance-card-header" onclick="toggleComplianceCard('cfw-${fw.id}')">
              <span class="compliance-fw-badge ${fw.cls}">${esc(fw.label)}</span>
              <span class="compliance-card-title">${esc(fw.label)} Compliance Findings</span>
              <span class="compliance-violation-count">${violations.length} violation${violations.length !== 1 ? 's' : ''}</span>
              <svg class="compliance-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4l4 4-4 4"/></svg>
            </div>
            <div class="compliance-card-body">${rowsHtml}</div>
          </div>`;
        });
        html += `</div>`;
      }

      html += `</div>`;
      contentArea.insertAdjacentHTML('beforeend', html);
    }

    function toggleComplianceCard(cardId) {
      const card = document.getElementById(cardId);
      card.classList.toggle('expanded');
    }

    // ═══════════════════════════════════════════════════
    // EMPTY STATE (initial)
    // ═══════════════════════════════════════════════════
    function showEmpty() {
      document.getElementById("pageTitle").innerHTML = `Dashboard <span>— Overview</span>`;
      document.getElementById("contentArea").innerHTML = `
    <div class="empty-state" style="height:calc(100vh - 120px);">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <h3>No endpoints connected</h3>
      <p>Deploy <b>BASAgent.exe</b> on one or more Windows endpoints.  The agent will register here automatically and begin running simulations.</p>
    </div>`;
    }
    showEmpty();

    // ═══════════════════════════════════════════════════
    // TOAST
    // ═══════════════════════════════════════════════════
    let toastId = 0;
    function toast(type, msg) {
      const id = ++toastId;
      const el = document.getElementById("toasts");
      el.insertAdjacentHTML("beforeend", `<div class="toast ${type}" id="toast-${id}">${msg}</div>`);
      setTimeout(() => { const t = document.getElementById(`toast-${id}`); if (t) t.remove(); }, 4000);
    }

    // ═══════════════════════════════════════════════════
    // UTIL
    // ═══════════════════════════════════════════════════
    function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }
    async function downloadPDF(agentId) {
      const report = reports[agentId];
      if (!report) return;

      const host = report.hostname || report.Hostname || "Endpoint";
      const element = document.getElementById('contentArea');

      toast("info", "Preparing PDF report...");

      // 1. Temporarily expand all categories so they are visible in the PDF
      const catCards = element.querySelectorAll('.cat-card');
      const originalStates = []; // Store which ones were actually closed

      catCards.forEach((card, i) => {
        const checks = card.querySelector('.cat-checks');
        originalStates[i] = checks.style.display;
        card.classList.add('expanded');
        checks.style.display = 'flex';
      });

      // 2. Setup PDF options (Dark mode friendly)
      const opt = {
        margin: [0.4, 0.4],
        filename: `BAS_Report_${host}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: {
          scale: 2,
          useCORS: true,
          backgroundColor: '#0a0c0f', // Match your --bg-base
          ignoreElements: (el) => el.classList.contains('no-pdf')
        },
        jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
      };

      try {
        // 3. Generate and Save
        await html2pdf().set(opt).from(element).save();
        toast("ok", "Report saved as PDF");
      } catch (err) {
        console.error("PDF Export Error:", err);
        toast("warn", "PDF generation failed.");
      } finally {
        // 4. Restore the UI to how it was before the print
        catCards.forEach((card, i) => {
          const checks = card.querySelector('.cat-checks');
          if (originalStates[i] === 'none') {
            card.classList.remove('expanded');
            checks.style.display = 'none';
          }
        });
      }
    }
    async function triggerRemoteScan(agentId) {
      if (!connection || connection.state !== "Connected") {
        const state = connection ? connection.state : "Null";
        toast("warn", `SignalR is ${state}. Please wait...`);
        return;
      }

      try {
        await connection.invoke("RequestAgentScan", agentId);
        toast("ok", "Scan command sent to agent!");
      } catch (err) {
        console.error("SignalR Invoke Error:", err);
        toast("warn", "Failed to reach server.");
      }
    }
    initApp();

  </script>
