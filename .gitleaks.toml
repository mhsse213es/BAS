# Gitleaks configuration. Extends the default rule set; no default rule is disabled.
# The path allowlist covers files the first CI run flagged. On inspection of the flagged lines,
# they are test fixtures and synthetic values (e.g. "synthetic-op1", test keys, scrubber inputs).
# Values were partly masked during that inspection, so a full line-by-line review is still open.
# Findings outside these paths still fail CI.

[extend]
useDefault = true

[allowlist]
description = "Reviewed fixtures and sample data"
paths = [
  '''docs/carbanak-bfsi-lab-runbook\.md''',
  '''orchestrator/internal/aisink/.*_test\.go''',
  '''orchestrator/internal/api/detection_handlers_test\.go''',
  '''orchestrator/internal/api/secrets_test\.go''',
  '''orchestrator/internal/apibas/catalog/API-BAS-AUTHN-011\.yaml''',
  '''orchestrator/internal/apibas/fixture/fixture\.go''',
  '''orchestrator/internal/carbanakledger/server_test\.go''',
  '''orchestrator/internal/models/secret_scrub_test\.go''',
  '''orchestrator/internal/secretbackfill/scrub_test\.go''',
  '''packaging/compose/tests/install_config_test\.sh''',
]
regexes = [
  '''\$\$ELASTIC_PASSWORD''',
]
