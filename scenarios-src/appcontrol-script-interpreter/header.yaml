id: appcontrol-script-interpreter
product_line: av
name: "Application Control Mastery - Script and Interpreter Enforcement"
description: >
  Eight controlled, benign tests of whether application control stops script hosts and
  interpreters from running code from user-writable locations: wscript VBScript, cmd batch
  files, Windows Script Files, JScript, unsigned PowerShell scripts, PowerShell language
  mode, WMI process creation and any already-installed alternate interpreter (ATT&CK
  T1059.x, T1047). Each step runs one benign artifact that writes a single marker file and
  resolves the result against both AppLocker Script rules and WDAC, using the same rules as
  the other Application Control Mastery scenarios: an audit-mode event is audited_only, never
  prevention; unreadable logs and unattributable results are inconclusive; missing mechanisms
  are not_applicable. PowerShell execution policy is recorded as context only and is never
  treated as a security boundary. Nothing is installed and every artifact is deleted by the step.
  Block outcomes are verified only against stubbed fixtures; the executed path was run on a
  host with no enforcement.
author: Audspect Research
executable: true
supported_os: [windows]
tags:
  - application-control
  - appcontrol-mastery
  - script-interpreter
  - behavioral
mitre_phases:
  - execution
  - defense-evasion

