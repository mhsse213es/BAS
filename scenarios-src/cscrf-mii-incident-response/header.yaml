id: "cscrf-mii-incident-response"
product_line: common
name: "CSCRF-MII Incident Detection, Containment and Evidence Checks (P1)"
description: >
  Internal control-validation checks for incident response. Verdicts are internal control references
  (CSCRF-IR-*), not SEBI clause identifiers. Read-only checks run anywhere. The malware-detection check uses
  the standard EICAR test string (harmless) and the account-disablement check uses a synthetic account; both
  require BAS_CONFIRM_IR_TEST=true and clean up in undo. Deferred until an EDR, SOC or SOAR is named:
  suspicious-process containment, endpoint isolation and alert escalation. A PASS shows a control is
  configured or works in isolation; it does not show the SOC responded.
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - cscrf-mii
  - incident-response
  - p1
mitre_phases:
  - execution
  - impact

steps:
