id: apt36-initial-execution
product_line: killchain
name: "APT36 Mastery - Initial Access and Execution"
description: >
  Five execution behaviors attributed to APT36 (Transparent Tribe) tradecraft: a .lnk shortcut opened the way a
  user would, a VBScript run by wscript.exe (a document-to-script chain), encoded PowerShell run as a hidden
  child, WMI process creation as an alternate execution path, and a .chm opened by hh.exe whose embedded
  Shortcut object runs a command (if the HTML Help compiler is present; otherwise it reports not_applicable
  rather than faking a build). No real document, ISO or disk-image execution/MOTW-bypass step is included: that
  path was reviewed and withheld rather than shipped as an evasion technique.
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
