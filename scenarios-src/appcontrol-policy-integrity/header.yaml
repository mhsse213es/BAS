id: appcontrol-policy-integrity
product_line: av
name: "Application Control Mastery - Policy Integrity and Tamper Resistance"
description: >
  Seven tests of whether the application control mechanism itself is reliable: service tamper
  resistance, local AppLocker policy modification, audit-mode or missing-collection downgrade,
  the WDAC active policy directory trust boundary, Managed Installer rules that trust
  user-writable paths, evidence that enforcement survives a reboot, and policy drift against an
  approved baseline (ATT&CK T1562.001, T1553). Unlike the execution tests these steps observe the
  denial or the exposure directly instead of counting block events, so each reports its own
  reason. Everything is read-only by default. The only state-changing paths are behind exact-match
  lab gates: BAS_CONFIRM_APPCONTROL_SERVICE_STOP (stops and restores AppIDSvc),
  BAS_CONFIRM_APPCONTROL_POLICY_TAMPER (re-applies the identical local AppLocker policy and
  creates then removes one non-policy canary file in the WDAC active directory). No policy file
  is ever written, no policy is weakened and no reboot is performed. A host with no policy
  configured reports not_applicable, never a pass. Logic is verified against stubbed fixtures; the
  gated paths have not been run.
author: Audspect Research
executable: true
supported_os: [windows]
tags:
  - application-control
  - appcontrol-mastery
  - policy-integrity
  - behavioral
mitre_phases:
