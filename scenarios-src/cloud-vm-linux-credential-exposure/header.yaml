id: "cloud-vm-linux-credential-exposure"
product_line: cloud
name: "Cloud VM Mastery - Cloud Credential Exposure at Rest (Linux)"
description: >
  Local, read-only checks for cloud credential material left at rest on a workload VM: shared AWS credentials
  file, Azure CLI token cache, cloud credential environment variables, Terraform state files, and cloud SDK
  configuration. Only presence and counts are recorded; key values, tokens and secret attributes are matched but
  never printed. These checks describe this host only and need no cloud access. A PASS means this host was
  checked and no exposure was found, not that the fleet is clean.
author: Audspect Research
executable: true
local_check: false
supported_os: [linux]
tags:
  - cloud
  - credentials
  - aws
  - azure
  - terraform
  - cloud-vm-mastery
  - t1552
  - t1552.001
mitre_phases:
  - credential-access

