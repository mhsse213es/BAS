id: "cobalt-group-bfsi-credential-access"
product_line: killchain
name: "Cobalt Group BFSI - Credential Access (P0)"
description: >
  Enterprise credential-access detection validation for BFSI environments. Eight scenarios covering
  LSASS/SAM simulation, Credential Manager discovery, browser credential discovery, Kerberos ticket-cache check (not a live Kerberoast),
  AS-REP roasting, password spraying, and unsecured credential file discovery. All scenarios use
  synthetic test accounts and non-extracting simulations; no real credentials are captured or logged.
  Each scenario includes verified cleanup and undo-record rollback.
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
