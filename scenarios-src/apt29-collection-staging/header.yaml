id: apt29-collection-staging
product_line: killchain
name: "APT29 Mastery - Collection and Staging"
description: >
  Three collection behaviors attributed to APT29 on MITRE ATT&CK group G0016, on synthetic data only: locating
  documents by extension across a synthetic user profile and copying them to a collection folder, staging the
  files on a remote share (here the loopback administrative share), and archiving them with a command-line
  utility with a hash-verified extraction. Exfiltration over a channel is not part of this pack: sink-verified
  exfiltration lives in the DLP exfiltration scenarios. The staging step is gated by an exact flag and
  administrator only and removes what it creates.
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
