id: appcontrol-advanced-loading
product_line: av
name: "Application Control Mastery - Advanced Loading Paths"
description: >
  Four tests of execution paths that are not a direct user launch: a DLL resolved by bare name
  from the application directory (search-order loading), a COM class that activates a scriptlet
  through scrobj.dll, a program launched by a scheduled task and a program launched by the
  service manager (ATT&CK T1574.001, T1546.015, T1053.005, T1543.003). The DLL test needs no
  registration. The other three register something on the host, so each is skipped unless its
  exact-match lab flag is set, and each removes everything it created and reports that removal.
  Results use the shared AppLocker and WDAC oracle: audit-mode events are audited_only, never
  prevention, and an unreadable log or unattributable absence is inconclusive.
author: Audspect Research
executable: true
supported_os: [windows]
