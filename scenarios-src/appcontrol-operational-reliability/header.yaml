id: appcontrol-operational-reliability
product_line: av
name: "Application Control Mastery - Operational Reliability"
description: >
  Three read-only checks that enforcement can be relied on and observed: the log channels that
  record blocks are enabled and large enough, the application identity service is present and
  running whenever AppLocker rules are enforced, and no allow rule open to Everyone or Users covers
  a whole drive, a user-writable location or a network path (ATT&CK T1562.001, T1562.002).
  Nothing is changed. Hosts that enforce nothing report not_applicable. Policy update latency and
  audit-to-enforce transition timing need a real policy apply and are not tested here.
author: Audspect Research
executable: true
supported_os: [windows]
