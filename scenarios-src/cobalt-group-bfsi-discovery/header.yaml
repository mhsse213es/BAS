id: "cobalt-group-bfsi-discovery"
product_line: killchain
name: "Cobalt Group BFSI - Service Discovery (P0)"
description: >
  BFSI-specific reconnaissance and service discovery detection validation. Four read-only scenarios
  covering core banking application discovery, payment gateway enumeration, ATM switch discovery,
  and cardholder data location discovery. Scenarios query a deterministic banking-service simulator
  stub; no live APIs or production infrastructure accessed. Validates detection of unauthorized
  reconnaissance against banking infrastructure.
