id: windows-persistence-posture
product_line: av
name: Windows Persistence Exposure Posture Audit
description: >
  Read-only posture audit of the Windows locations an attacker commonly uses for
  persistence: enabled non-Microsoft scheduled tasks, running services whose binaries
  sit outside the system folders, Run-key autostart entries, and the write permission
  on the machine Run key. Nothing is created, changed or executed. A FAIL is a review
  trigger against the client's approved baseline, not a proof of compromise.
local_check: true
executable: false
supported_os: [windows]
tags:
  - persistence
  - posture
  - windows
  - read-only
contract:
  objective: Surface persistence exposure that an unprivileged or unapproved change could use, for review against the approved baseline.
  prerequisites:
    os: Windows Server 2019 or later, Windows 10 or later
    product: built-in task scheduler, service control manager, registry
    permissions: local read access; administrator rights to read all scheduled task paths
    telemetry: none required for the posture result; Security event log 4698 and 7045 for change detection
  variants:
    baseline: current state compared against the client's approved baseline
    variation: not applicable; this is a single-state read
    negative_controls: Microsoft-provided tasks and services are excluded by path, so they do not raise findings
  expected_prevention:
    control: non-administrator accounts cannot write to the machine Run key
    authoritative_proof: the ACL read in step 4 showing no Users or Everyone write rights
  expected_detection:
    observables: unapproved autostart or service entries
    telemetry_sources: this scenario's own output; SIEM for 4698 and 7045 if the client collects them
  response_validation:
    alert_to_incident: not evaluated by this scenario; the FAIL result must be routed to the server team by the client's process
    containment_check: not evaluated; removal is a manual review step
  evidence_contract:
    required: step outputs with names of the items found, timestamp, host identifier, baseline version
    identifiers: task path, service name, registry value name
    missing_data_is: an unreadable location produces SKIP for that step, never PASS
  cleanup_recovery:
    artifacts_removed: none; the scenario writes nothing
    access_revocation_verified: not applicable
  remediation_retest:
    change: client removes or justifies each listed item, or tightens the Run-key ACL
    retest: the same scenario must return PASS for the changed step
  limitations:
    - a FAIL lists every non-Microsoft task and out-of-folder service; many are legitimate third-party software and need baseline review
    - WMI event subscriptions and COM hijacking are not inventoried
    - the Linux equivalent is the linux-persistence scenario
steps:
  - name: "Enabled non-Microsoft scheduled tasks"
    check_id: windows-persistence-scheduled-tasks
    technique_id: T1053.005
    framework: custom
    executor: local
    command: >-
      $t = @(Get-ScheduledTask | Where-Object { $_.TaskPath -notlike '\Microsoft\*' -and $_.State -ne 'Disabled' });
      if ($t.Count -eq 0) { Write-Output 'PASS: no enabled non-Microsoft scheduled tasks' }
      else { Write-Output ('FAIL: ' + $t.Count + ' enabled non-Microsoft scheduled tasks need baseline review: ' + (($t | ForEach-Object { $_.TaskPath + $_.TaskName }) -join '; ')) }
    timeout_sec: 30

  - name: "Running services with binaries outside system folders"
    check_id: windows-persistence-services
    technique_id: T1543.003
    framework: custom
    executor: local
    command: >-
      $s = @(Get-CimInstance Win32_Service | Where-Object { $_.State -eq 'Running' -and $_.PathName -and $_.PathName -notmatch 'System32|Program Files' });
      if ($s.Count -eq 0) { Write-Output 'PASS: all running services use system-folder binaries' }
      else { Write-Output ('FAIL: ' + $s.Count + ' running services outside system folders need baseline review: ' + (($s | ForEach-Object { $_.Name }) -join '; ')) }
    timeout_sec: 30

  - name: "Run-key autostart entries pointing outside system folders"
    check_id: windows-persistence-run-keys
    technique_id: T1547.001
    framework: custom
    executor: local
    command: >-
      $out = @();
      foreach ($r in @('HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run','HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run')) {
        $p = Get-ItemProperty -Path $r -ErrorAction SilentlyContinue;
        if ($p) { $p.PSObject.Properties | Where-Object { $_.Name -notlike 'PS*' -and [string]$_.Value -notmatch 'System32|Program Files' } | ForEach-Object { $out += ($r + ' ' + $_.Name) } }
      };
      if ($out.Count -eq 0) { Write-Output 'PASS: all Run-key entries point to system or program folders' }
      else { Write-Output ('FAIL: ' + $out.Count + ' Run-key entries outside system folders need baseline review: ' + ($out -join '; ')) }
    timeout_sec: 30

  - name: "Write permission on the machine Run key for non-administrators"
    check_id: windows-persistence-run-key-acl
    technique_id: T1547.001
    framework: custom
    executor: local
    command: >-
      $acl = Get-Acl 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run';
      $w = @($acl.Access | Where-Object { $_.IdentityReference -match 'Users|Everyone' -and $_.RegistryRights -match 'Write|FullControl' });
      if ($w.Count -eq 0) { Write-Output 'PASS: non-administrators have no write access to the machine Run key' }
      else { Write-Output ('FAIL: ' + $w.Count + ' non-administrator write grants on the machine Run key') }
    timeout_sec: 30
