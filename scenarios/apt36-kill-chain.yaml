      $c = Invoke-A36Proc -File $st -ArgLine ('/create /tn "' + $name + '" /tr "' + $tr.Replace('"', [string][char]92 + '"') + '" /sc once /st 23:59 /f') -TimeoutSec 20 -NoShell
