# =============================================================================
# Akira ESXi and Virtual Infrastructure Ransomware Assessment (network and API, from a Windows agent)
# =============================================================================
id: akira-esxi-assessment
version: "1.0.0"
product_line: ransomware
name: Akira ESXi and Virtual Infrastructure Ransomware Assessment
description: >
  Eight-step, hypervisor-side assessment of the Akira ESXi variant path (CISA AA24-109A:
  management access, VM discovery, datastore access, VM shutdown, snapshot deletion and
  datastore encryption), run from a Windows agent against lab ESXi hosts listed in
  BAS_ESXI_HOSTS (host or host:port, comma or semicolon separated). No agent runs on ESXi:
  evidence is API facts (services, lockdown mode, inventory counts, privileges), not endpoint
  telemetry. E1 checks unauthenticated management exposure; E2 logs in with an operator
  read-only account from BAS_ESXI_CRED_FILE; E3 and E4 count VMs and datastores; E5 to E7
  assess power-off, snapshot-removal and datastore-write rights through privilege queries
  without performing the attacks; E8 correlates the chain, checks the AD ESX Admins path
  (CVE-2024-37085) and cleans up. The only writes are two gated canaries (a snapshot on
  BAS_ESXI_LAB_VM and a tiny file on BAS_ESXI_LAB_DATASTORE) behind
  BAS_CONFIRM_ESXI_LAB_WRITE=true (exact lowercase). VM power-off, deletion of existing
  snapshots and VM disk encryption are never performed. Premise: the agent is outside the
  ESXi management network, so reachability or a successful login is exposure. The protocol
  code was verified only against a local stub of hand-written vSphere replies, not a real
  ESXi host.

author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
severity: critical
estimated_duration_sec: 240
abort_conditions:
  - "PowerShell major version < 5"
tags:
  - akira
  - ransomware
  - esxi
  - vmware
  - hypervisor
  - t1133
  - t1078
  - t1485
  - mitre
  - bas
mitre_phases:
  - initial-access
  - discovery
  - impact
attck_tactics:
  - TA0001  # Initial Access
  - TA0007  # Discovery
  - TA0040  # Impact
references:
  - "CISA AA24-109A - #StopRansomware: Akira Ransomware (Akira v2 targets VMware ESXi)"
  - "MITRE ATT&CK T1133, T1078, T1018, T1083, T1529, T1485"
  - "VMware: CVE-2024-37085 (AD ESX Admins group), CVE-2021-21974 (SLP)"

live_policy:
  block_on_domain_controller: false
  require_dc_reachable: false
  max_spray_attempts: 0
  spray_account_allowlist: []
  execution_window: ""
  require_run_id: false
  require_temp_disk_mb: 32
  min_powershell_major: 5

variables:
  run_id: "{{env.BAS_RUN_ID | default(random_hex8)}}"
  sim_tag: "[BAS-SIM-ESX]"

steps:
  # ---------------------------------------------------------------------------
  - id: esx-e1-management-exposure
    name: "ESXi E1 - Management Plane Exposure (T1133)"
    technique_id: T1133
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 120
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    severity: high
    confidence: medium
    reversible: true
    blast_radius: "Unauthenticated. TCP connects to ports 22, the HTTPS port (443 or the host:port given), 902, 427 and 5989 on each host in BAS_ESXI_HOSTS, reads the SSH banner and the /sdk ServiceContent (product, version, build). No login."
    preconditions: ["Windows agent that can reach the lab ESXi hosts.", "BAS_ESXI_HOSTS lists hosts the operator owns.", "Steps E1-E8 run in order within one run."]
    postconditions: ["PASS, FAIL or SKIP with a stated reason; any canary created on a host is removed and removal verified; E8 removes the work directory."]
    abort_on: []
    telemetry:
      - "ESXi hostd.log and vpxa/auth logs: login events and API calls from the agent address"
    detection:
      - "SIEM/ESXi syslog: logins from a non-management network, SSH enablement, snapshot and datastore file operations outside change windows"
    expected_telemetry_count: 1
    false_positive_notes: "vCenter, backup and monitoring systems use the same APIs; correlate with source address and account."
    mitigations:
      - "Lockdown mode, management network isolation and disabled SSH/ESXi Shell/SLP."
      - "Least-privilege read-only service roles; no AD ESX Admins group exposure; patched builds."
      - "Immutable backups and snapshot-removal alerting."
    references: ["CISA AA24-109A"]
    evidence: ["Emit ports reachable and product/build per host."]
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $runId = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0,[Math]::Min(8,$env:BAS_RUN_ID.Length)) } else { 'norun' }
      $work = Join-Path $env:TEMP "bas_esx_$runId"
      $ledger = Join-Path $work 'ledger.jsonl'
      try { [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 } catch { }
      [Net.ServicePointManager]::ServerCertificateValidationCallback = { $true }
      $hosts = @(); $badHosts = 0
      foreach ($h in @($env:BAS_ESXI_HOSTS -split '[;,]' | ForEach-Object { $_.Trim() } | Where-Object { $_ })) { if ($h -match '^[A-Za-z0-9._-]{1,253}(:\d{1,5})?$') { $hosts += $h } else { $badHosts++ } }
      function Split-HostPort($h, $def) { if ($h -match '^(.+):(\d+)$') { return @($Matches[1], [int]$Matches[2]) } else { return @($h, $def) } }
      function Add-Ledger($step, $target, $result, $facts) {
        if (-not (Test-Path $work)) { New-Item -ItemType Directory -Path $work -Force | Out-Null }
        $o = [ordered]@{ step=$step; target=$target; ts=(Get-Date).ToUniversalTime().ToString('o'); result=$result; facts=$facts }
        Add-Content -Path $ledger -Value ($o | ConvertTo-Json -Compress -Depth 4) -Encoding UTF8
      }
      function Read-Ledger { if (Test-Path $ledger) { @(Get-Content $ledger | Where-Object { $_ } | ForEach-Object { $_ | ConvertFrom-Json }) } else { @() } }
      function Get-EsxCred { $f = $env:BAS_ESXI_CRED_FILE; if (-not $f -or -not (Test-Path $f)) { return $null }; try { $j = Get-Content $f -Raw | ConvertFrom-Json; if ($j.user -and $j.password) { return $j } } catch { }; return $null }
      function Test-TcpPort($h, $p) { try { $c = New-Object Net.Sockets.TcpClient; $a = $c.BeginConnect($h, $p, $null, $null); $ok = $a.AsyncWaitHandle.WaitOne(3000) -and $c.Connected; $c.Close(); return [bool]$ok } catch { return $false } }
      function Invoke-Vim($h, $inner, $cookie) {
        $body = '<?xml version="1.0" encoding="UTF-8"?><soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><soapenv:Body>' + $inner + '</soapenv:Body></soapenv:Envelope>'
        $res = [pscustomobject]@{ Ok = $false; Xml = $null; Cookie = $null; Fault = $null; Status = 0 }
        try {
          $req = [Net.HttpWebRequest]::Create("https://$h/sdk"); $req.Method = 'POST'; $req.ContentType = 'text/xml; charset=UTF-8'; $req.Timeout = 15000
          $req.Headers.Add('SOAPAction', '"urn:vim25/6.7"'); if ($cookie) { $req.Headers.Add('Cookie', $cookie) }
          $bytes = [Text.Encoding]::UTF8.GetBytes($body); $req.ContentLength = $bytes.Length
          $s = $req.GetRequestStream(); $s.Write($bytes, 0, $bytes.Length); $s.Close()
          $resp = $req.GetResponse(); $res.Status = [int]$resp.StatusCode; $res.Cookie = $resp.Headers['Set-Cookie']
          $txt = (New-Object IO.StreamReader($resp.GetResponseStream())).ReadToEnd(); $resp.Close()
          $res.Xml = [xml]$txt; $res.Ok = $true
        } catch [Net.WebException] {
          try { $r = $_.Exception.Response; if ($r) { $res.Status = [int]$r.StatusCode; $t = (New-Object IO.StreamReader($r.GetResponseStream())).ReadToEnd(); $x = [xml]$t; $res.Xml = $x; $res.Fault = ($x.SelectNodes("//*[local-name()='faultstring']") | Select-Object -First 1).InnerText } } catch { }
        } catch { }
        return $res
      }
      function Xt($xml, $name) { if (-not $xml) { return $null }; $n = $xml.SelectNodes("//*[local-name()='$name']") | Select-Object -First 1; if ($n) { return $n.InnerText } else { return $null } }
      function Get-EsxContent($h) {
        $r = Invoke-Vim $h '<RetrieveServiceContent xmlns="urn:vim25"><_this type="ServiceInstance">ServiceInstance</_this></RetrieveServiceContent>' $null
        if (-not $r.Ok) { return $null }
        [pscustomobject]@{ FullName=(Xt $r.Xml 'fullName'); Version=(Xt $r.Xml 'version'); Build=(Xt $r.Xml 'build'); ApiType=(Xt $r.Xml 'apiType'); Root=(Xt $r.Xml 'rootFolder'); Pc=(Xt $r.Xml 'propertyCollector'); Sm=(Xt $r.Xml 'sessionManager'); Am=(Xt $r.Xml 'authorizationManager'); Vm=(Xt $r.Xml 'viewManager') }
      }
      function Connect-Esx($h, $cred) {
        $c = Get-EsxContent $h; if (-not $c -or -not $c.Sm) { return $null }
        $u = [Security.SecurityElement]::Escape([string]$cred.user); $p = [Security.SecurityElement]::Escape([string]$cred.password)
        $r = Invoke-Vim $h ('<Login xmlns="urn:vim25"><_this type="SessionManager">' + $c.Sm + '</_this><userName>' + $u + '</userName><password>' + $p + '</password></Login>') $null
        if (-not $r.Ok -or -not $r.Cookie) { return [pscustomobject]@{ Ok = $false; Fault = $r.Fault } }
        [pscustomobject]@{ Ok = $true; Cookie = ($r.Cookie -split ';')[0]; SessionId = (Xt $r.Xml 'key'); Content = $c; Host = $h }
      }
      function Get-EsxProps($s, $type, $paths) {
        $c = $s.Content
        $v = Invoke-Vim $s.Host ('<CreateContainerView xmlns="urn:vim25"><_this type="ViewManager">' + $c.Vm + '</_this><container type="Folder">' + $c.Root + '</container><type>' + $type + '</type><recursive>true</recursive></CreateContainerView>') $s.Cookie
        $view = Xt $v.Xml 'returnval'; if (-not $view) { return $null }
        $ps = ($paths | ForEach-Object { '<pathSet>' + $_ + '</pathSet>' }) -join ''
        $r = Invoke-Vim $s.Host ('<RetrieveProperties xmlns="urn:vim25"><_this type="PropertyCollector">' + $c.Pc + '</_this><specSet><propSet><type>' + $type + '</type>' + $ps + '</propSet><objectSet><obj type="ContainerView">' + $view + '</obj><skip>true</skip><selectSet xsi:type="TraversalSpec"><name>view</name><type>ContainerView</type><path>view</path><skip>false</skip></selectSet></objectSet></specSet></RetrieveProperties>') $s.Cookie
        if (-not $r.Ok) { return $null }
        $out = @()
        foreach ($rv in @($r.Xml.SelectNodes("//*[local-name()='returnval']"))) {
          $obj = $rv.SelectSingleNode("*[local-name()='obj']"); if (-not $obj) { continue }
          $props = @{}; foreach ($p in @($rv.SelectNodes("*[local-name()='propSet']"))) { $nm = $p.SelectSingleNode("*[local-name()='name']").InnerText; $val = $p.SelectSingleNode("*[local-name()='val']"); $props[$nm] = if ($val) { $val.InnerText } else { $null } }
          $out += [pscustomobject]@{ Id = $obj.InnerText; Props = $props; Node = $rv }
        }
        return ,$out
      }
      function Get-EsxPriv($s, $type, $ids, $priv) {
        if (@($ids).Count -eq 0) { return 0 }
        $ents = ($ids | ForEach-Object { '<entity type="' + $type + '">' + $_ + '</entity>' }) -join ''
        $r = Invoke-Vim $s.Host ('<HasPrivilegeOnEntities xmlns="urn:vim25"><_this type="AuthorizationManager">' + $s.Content.Am + '</_this>' + $ents + '<sessionId>' + $s.SessionId + '</sessionId><privId>' + $priv + '</privId></HasPrivilegeOnEntities>') $s.Cookie
        if (-not $r.Ok) { return $null }
        $g = 0; foreach ($n in @($r.Xml.SelectNodes("//*[local-name()='privAvailability']"))) { $isg = $n.SelectSingleNode("*[local-name()='isGranted']"); if ($isg -and $isg.InnerText -eq 'true') { $g++ } }
        return $g
      }
      if ($hosts.Count -eq 0) { Write-Output "SKIP: prerequisite missing (BAS_ESXI_HOSTS not set or no valid host; invalid entries: $badHosts). Lab ESXi hosts only. [BAS-SIM-ESX-E1]"; return }
      if (Test-Path $work) { Remove-Item $work -Recurse -Force }
      New-Item -ItemType Directory -Path $work -Force | Out-Null
      $ports = [ordered]@{ ssh=22; https=443; vmk=902; slp=427; cim=5989 }
      $exposed = 0; $findings = @(); $lines = @()
      foreach ($h in $hosts) {
        $hp = Split-HostPort $h 443; $name = $hp[0]
        $open = [ordered]@{}; foreach ($k in $ports.Keys) { $port = $ports[$k]; if ($k -eq 'https') { $port = $hp[1] }; $open[$k] = (Test-TcpPort $name $port) }
        $ban = $null
        if ($open.ssh) { try { $c = New-Object Net.Sockets.TcpClient($name, 22); $c.ReceiveTimeout = 3000; $st = $c.GetStream(); $buf = New-Object byte[] 128; $n = $st.Read($buf, 0, 128); $ban = ([Text.Encoding]::ASCII.GetString($buf, 0, $n)).Trim(); $c.Close() } catch { } }
        $ct = if ($open.https) { Get-EsxContent $h } else { $null }
        $any = ($open.ssh -or $open.https -or $open.vmk -or $open.slp -or $open.cim)
        if ($any) { $exposed++ }
        if ($open.ssh) { $findings += "$h SSH (22) reachable from this network" }
        if ($open.slp) { $findings += "$h SLP (427) reachable - disable the SLP service (ESXiArgs/CVE-2021-21974 vector)" }
        Add-Ledger 'E1' $h $(if ($any) { 'reachable' } else { 'blocked' }) @{ ports=$open; ssh_banner=$ban; version=$ct.Version; build=$ct.Build; api_type=$ct.ApiType }
        $lines += "$h ports=[$((($open.Keys | Where-Object { $open[$_] }) -join ','))] ssh_banner=[$ban] product=[$($ct.FullName)] version=$($ct.Version) build=$($ct.Build) api=$($ct.ApiType)"
      }
      Write-Output "EVIDENCE T1133: hosts=$($hosts.Count) invalid_ignored=$badHosts hosts_with_management_ports_reachable=$exposed. Premise: this agent is NOT on the ESXi management network, so reachability is exposure. Version and build are reported as read, with no vulnerability lookup. [BAS-SIM-ESX-E1]"
      foreach ($l in $lines) { Write-Output "EVIDENCE T1133: $l [BAS-SIM-ESX-E1]" }
      foreach ($x in $findings) { Write-Output "FINDING: $x [BAS-SIM-ESX-E1]" }
      if ($exposed -gt 0) { Write-Output "FAIL: $exposed of $($hosts.Count) ESXi host(s) expose management services (SSH/HTTPS/902/SLP/CIM) to this network - the hypervisor management plane is reachable from an endpoint segment. [BAS-SIM-ESX-E1]" }
      else { Write-Output "PASS: none of the $($hosts.Count) ESXi host(s) answered on any management port from this network. [BAS-SIM-ESX-E1]" }
    cleanup: ""

  # ---------------------------------------------------------------------------
  - id: esx-e2-administrative-access
    name: "ESXi E2 - Administrative Access Validation (T1078)"
    technique_id: T1078
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 180
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    severity: high
    confidence: medium
    reversible: true
    blast_radius: "Logs in with the operator-supplied account in BAS_ESXI_CRED_FILE (JSON user and password; never printed) and reads lockdown mode, the SSH and ESXi Shell services and AD join state. Read-only API calls."
    preconditions: ["Windows agent that can reach the lab ESXi hosts.", "BAS_ESXI_HOSTS lists hosts the operator owns.", "Steps E1-E8 run in order within one run."]
    postconditions: ["PASS, FAIL or SKIP with a stated reason; any canary created on a host is removed and removal verified; E8 removes the work directory."]
    abort_on: []
    telemetry:
      - "ESXi hostd.log and vpxa/auth logs: login events and API calls from the agent address"
    detection:
