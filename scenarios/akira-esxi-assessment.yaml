            $plain = [Text.Encoding]::UTF8.GetBytes("[BAS-SIM-ESX] canary $runId"); $xor = New-Object byte[] $plain.Length; for ($i = 0; $i -lt $plain.Length; $i++) { $xor[$i] = $plain[$i] -bxor 0x41 }
