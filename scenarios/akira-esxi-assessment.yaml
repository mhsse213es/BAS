        [pscustomobject]@{ FullName=(Xt $r.Xml 'fullName'); Version=(Xt $r.Xml 'version'); Build=(Xt $r.Xml 'build'); ApiType=(Xt $r.Xml 'apiType'); Root=(Xt $r.Xml 'rootFolder'); Pc=(Xt $r.Xml 'propertyCollector'); Sm=(Xt $r.Xml 'sessionManager'); Am=(Xt $r.Xml 'authorizationManager'); Vm=(Xt $r.Xml 'viewManager') }
