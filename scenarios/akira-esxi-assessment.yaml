      foreach ($l in $lines) { Write-Output "EVIDENCE T1018: $l [BAS-SIM-ESX-E3]" }
      if ($tot -gt 0) { Write-Output "FAIL: the account enumerated $tot VM(s) ($on powered on) from this network - an attacker with these rights can map every workload to encrypt. [BAS-SIM-ESX-E3]" }
      else { Write-Output "PASS: no VM could be enumerated with the supplied account (empty inventory or denied). [BAS-SIM-ESX-E3]" }
    cleanup: ""

