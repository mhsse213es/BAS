        $cred = Get-EsxCred
        if (-not $cred) { $script:esxSkipMsg = 'prerequisite missing (BAS_ESXI_CRED_FILE not set, unreadable, or lacks user and password); no authentication was attempted.'; return $false }
        foreach ($h in $hosts) { $s = Connect-Esx $h $cred; if ($s -and $s.Ok) { $script:esxSessions += $s } }
