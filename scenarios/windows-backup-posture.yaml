id: windows-backup-posture
product_line: ransomware
name: Windows Backup and Shadow Copy Posture
description: >
  Read-only posture audit of the host-level recovery prerequisites: the Volume Shadow
  Copy service start mode, the presence of shadow copies, and the Windows Server Backup
  policy where that feature is installed. Nothing is created, deleted or restored. It
  does not test backup immutability, offsite copies or restore integrity; those need a
  connector and a restore drill.
local_check: true
executable: false
supported_os: [windows]
tags:
  - backup
  - recovery
  - posture
  - windows
  - read-only
contract:
  objective: Verify that the host keeps the recovery prerequisites that a ransomware recovery depends on.
  prerequisites:
    os: Windows Server 2019 or later
    product: Volume Shadow Copy service, vssadmin; Windows Server Backup where installed
    permissions: local administrator read access
    telemetry: none required for the posture result
  variants:
    baseline: current VSS start mode, shadow copy count and backup policy
    variation: not applicable; single-state read
    negative_controls: a host without Windows Server Backup reports SKIP for that step, not FAIL
  expected_prevention:
    control: the VSS service is available to create recovery points
    authoritative_proof: VSS start mode read in step 1
  expected_detection:
    observables: not applicable; this scenario reads state
    telemetry_sources: none
  response_validation:
    alert_to_incident: not evaluated by this scenario
    containment_check: not evaluated
  evidence_contract:
    required: VSS start mode, shadow copy count, backup policy state, host identifier, timestamp
    identifiers: shadow copy ID, backup policy target
    missing_data_is: a command that cannot run is SKIP, never PASS
  cleanup_recovery:
    artifacts_removed: none; the scenario writes nothing
    access_revocation_verified: not applicable
  remediation_retest:
    change: client sets VSS to manual or automatic, creates recovery points, or configures a backup policy
    retest: the same scenario must return PASS
  limitations:
    - does not prove that shadow copies are isolated from the ransomware path; isolation is tested by the immutability scenario, which needs a connector
    - does not prove a restore works; that needs a restore drill
    - vssadmin output is read in English; localised systems may report SKIP
steps:
  - name: "Volume Shadow Copy service start mode"
    check_id: windows-backup-vss-start
    technique_id: T1490
    framework: custom
    executor: local
    command: >-
      $s = Get-Service -Name VSS -ErrorAction Stop;
      if ($s.StartType -ne 'Disabled') { Write-Output ('PASS: VSS start mode is ' + $s.StartType) }
      else { Write-Output 'FAIL: VSS is disabled; recovery points cannot be created' }
    timeout_sec: 30

  - name: "Shadow copies present"
    check_id: windows-backup-shadow-copies
    technique_id: T1490
    framework: custom
    executor: local
    command: >-
      $n = @(vssadmin list shadows 2>$null | Select-String -Pattern 'Shadow Copy ID').Count;
      if ($n -gt 0) { Write-Output ('PASS: ' + $n + ' shadow copies present') }
      else { Write-Output 'FAIL: no shadow copies present on this host' }
    timeout_sec: 60

  - name: "Windows Server Backup policy"
    check_id: windows-backup-policy
    technique_id: T1490
    framework: custom
    executor: local
    command: >-
      if (-not (Get-Command Get-WBPolicy -ErrorAction SilentlyContinue)) { Write-Output 'SKIP: Windows Server Backup is not installed' }
      else {
        $p = Get-WBPolicy -ErrorAction SilentlyContinue;
        if ($p -and $p.Schedule) { Write-Output 'PASS: a Windows Server Backup schedule is configured' }
        else { Write-Output 'FAIL: Windows Server Backup is installed but no schedule is configured' }
      }
    timeout_sec: 60
