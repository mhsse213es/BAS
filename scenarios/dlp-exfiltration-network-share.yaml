id: dlp-exfiltration-network-share
name: DLP Exfiltration Validation — Network Share Transfer (SMB, Writable and Read-Only)
description: >
  Copies the synthetic multi-type sensitive record to SMB/CIFS shares on the
  network: a writable share and a read-only share. Both are configured by the
  operator, not by this platform, because no lab share is provisioned with
  this repository. The shares are referenced through environment variables
  set on the agent host:

    BAS_DLP_SMB_SHARE      UNC path to a share the agent may write to
    BAS_DLP_SMB_RO_SHARE   UNC path to a share that should refuse writes

  If a share is not set, or is not reachable, the step records no DLP
  observation and is graded Untested. It is never recorded as a block. A
  reachable share whose copy fails is recorded as blocked, and a copy that
  succeeds as succeeded.

  Evidence level: L1 only. The verdict comes from the endpoint's own
  observation (a copy succeeded or failed, confirmed by a Test-Path on the
  share). No destination sink is involved, so a success is not independent
  proof. The step also cannot tell which control refused the copy: NTFS
  permissions, a share permission, or an endpoint DLP product. That
  attribution needs product evidence.

  Not covered: lateral movement between hosts, mapped drive letters, and
  share-exception or per-user variants. Those need a second host or a
  policy to test against.

  Safety: all synthetic data is fabricated and tagged [BAS-SIM-DLP]. Files
  written to a share are named with the run identifier and removed in a finally
  block when the copy succeeds. Windows only.
author: Audspect Research
executable: true
supported_os: [windows]
tags:
  - dlp
  - data-protection-validation
  - exfiltration
  - network-share
  - windows
  - mitre-attack
mitre_phases:
  - collection
  - exfiltration

steps:
  - name: "DLP Validation — Copy to Writable SMB Share (T1039)"
    technique_id: T1039
    detection_profiles:
      - windows_dlp_exfiltration
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    blast_radius: "Writes one small synthetic CSV to the operator-configured writable SMB share and removes it afterwards. Nothing is written if BAS_DLP_SMB_SHARE is not set."
    reversible: true
    telemetry:
      - "Sysmon EID 11: file created on a network share (SMB)"
      - "SMB audit: file write to a share"
    detection:
      - "DLP/file server: sensitive content written to a network share outside an approved path"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $share = $env:BAS_DLP_SMB_SHARE
      if (-not $share) {
        Write-Output "SKIP: BAS_DLP_SMB_SHARE is not set on this agent -- SMB share validation requires an operator-configured writable share."
      } elseif (-not (Test-Path -LiteralPath $share)) {
        Write-Output "SKIP: writable SMB share is not reachable from this agent ($share)."
      } else {
        $csvContent = "[BAS-SIM-DLP] CustomerID,PAN,Aadhaar,SWIFT,UPI,CreditCard`nBAS-SIM-SINK,ABCDE1234F,123456789012,SBININBBXXX,fake.user@upi,4111111111111111"
        $name = "bas_sim_share_rw_" + [guid]::NewGuid().ToString('N') + ".csv"
        $localSrc = Join-Path $env:TEMP $name
        $dest = Join-Path $share $name
        Set-Content -Path $localSrc -Value $csvContent -Encoding utf8
        if ($env:BAS_TASK_ID) { Write-Output "DLP_EVENT_START: $env:BAS_TASK_ID $((Get-Date).ToUniversalTime().ToString('o'))" }
        Copy-Item -Path $localSrc -Destination $dest -ErrorAction SilentlyContinue
        if (Test-Path -LiteralPath $dest) {
          Write-Output "EXEC T1039: sensitive record file written to the writable SMB share unimpeded. [BAS-SIM-DLP-SMB-RW]"
          Write-Output "FAIL: sensitive record file (PAN/Aadhaar/SWIFT/UPI/credit-card patterns) written to a network share without being blocked."
          Write-Output "DLP_OBSERVATION: OperationSucceeded"
          Remove-Item -LiteralPath $dest -Force -ErrorAction SilentlyContinue
        } else {
          $reason = if ($Error.Count -gt 0) { $Error[0].Exception.Message } else { '' }
          Write-Output "EXEC T1039: write to the writable SMB share failed ($reason). [BAS-SIM-DLP-SMB-RW]"
          # Only an access refusal is a block. Any other failure (network, disk full) is unknown.
          if ($reason -match 'Access|denied|Unauthorized|read-only|refused') { Write-Output "DLP_OBSERVATION: OperationBlocked" } else { Write-Output "DLP_OBSERVATION: OperationUnknown" }
        }
        Remove-Item -LiteralPath $localSrc -Force -ErrorAction SilentlyContinue
      }
    cleanup: ""

  - name: "DLP Validation — Copy to Read-Only SMB Share (T1039)"
    technique_id: T1039
    detection_profiles:
      - windows_dlp_exfiltration
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    blast_radius: "Attempts one write of a small synthetic CSV to an operator-configured read-only SMB share. The share is expected to refuse the write; if it accepts, the file is removed. Nothing is written if BAS_DLP_SMB_RO_SHARE is not set."
    reversible: true
    telemetry:
      - "Sysmon EID 11: file create attempt on a network share (SMB)"
      - "SMB audit: refused or allowed write to a read-only share"
    detection:
      - "DLP/file server: sensitive content written to a read-only share outside an approved path"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $share = $env:BAS_DLP_SMB_RO_SHARE
      if (-not $share) {
        Write-Output "SKIP: BAS_DLP_SMB_RO_SHARE is not set on this agent -- read-only SMB share validation requires an operator-configured read-only share."
      } elseif (-not (Test-Path -LiteralPath $share)) {
        Write-Output "SKIP: read-only SMB share is not reachable from this agent ($share)."
      } else {
        $csvContent = "[BAS-SIM-DLP] CustomerID,PAN,Aadhaar,SWIFT,UPI,CreditCard`nBAS-SIM-SINK,ABCDE1234F,123456789012,SBININBBXXX,fake.user@upi,4111111111111111"
        $name = "bas_sim_share_ro_" + [guid]::NewGuid().ToString('N') + ".csv"
        $localSrc = Join-Path $env:TEMP $name
        $dest = Join-Path $share $name
        Set-Content -Path $localSrc -Value $csvContent -Encoding utf8
        if ($env:BAS_TASK_ID) { Write-Output "DLP_EVENT_START: $env:BAS_TASK_ID $((Get-Date).ToUniversalTime().ToString('o'))" }
        Copy-Item -Path $localSrc -Destination $dest -ErrorAction SilentlyContinue
        if (Test-Path -LiteralPath $dest) {
          Write-Output "EXEC T1039: sensitive record file written to the read-only SMB share unimpeded. [BAS-SIM-DLP-SMB-RO]"
          Write-Output "FAIL: sensitive record file written to a share that should refuse writes."
          Write-Output "DLP_OBSERVATION: OperationSucceeded"
          Remove-Item -LiteralPath $dest -Force -ErrorAction SilentlyContinue
        } else {
          $reason = if ($Error.Count -gt 0) { $Error[0].Exception.Message } else { '' }
          Write-Output "EXEC T1039: write to the read-only SMB share failed ($reason). [BAS-SIM-DLP-SMB-RO]"
          # Only an access refusal is a block. Any other failure (network, disk full) is unknown.
          if ($reason -match 'Access|denied|Unauthorized|read-only|refused') { Write-Output "DLP_OBSERVATION: OperationBlocked" } else { Write-Output "DLP_OBSERVATION: OperationUnknown" }
        }
        Remove-Item -LiteralPath $localSrc -Force -ErrorAction SilentlyContinue
      }
    cleanup: ""
