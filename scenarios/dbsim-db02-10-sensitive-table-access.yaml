id: dbsim-db02-10-sensitive-table-access
product_line: dbsim
name: Database Security Simulation DB-02-10 - Sensitive Table Permission Abuse
description: >
  Lists the table privileges held by the application role bas_dbsim_app and
  compares them with a policy that denies access to the sensitive table
  bas_dbsim.restricted. A grant on that table is a violation. Graded only when a
  policy is configured for the target; without one the step is ERROR.
  ATT&CK T1087 Account Discovery.
author: Audspect Research
executable: true
tags:
  - dbsim
  - database
  - privileges
  - sensitive-data
  - read-only
  - mitre-attack
mitre_phases:
  - discovery

steps:
  - name: "DB-02-10 Sensitive table grants (T1087)"
    technique_id: T1087
    executor: dbprobe
    db_target: lab-db
    db_probe: read_grants
    db_params:
      role: bas_dbsim_app
    risk: low
    blast_radius: "read-only privilege catalog query for one role; no state changed"
    telemetry:
      - "PostgreSQL pg_log: the BAS-marked privilege catalog read for role bas_dbsim_app"
    detection:
      - "SIEM: privilege catalog read for an application role, a discovery signal"
    reversible: true
