id: adcs-esc8-web-enrollment-probe
product_line: ad
name: ADCS ESC8 Web Enrollment HTTP Probe
description: 'Read-only ESC8 probe, one step (T1557.001).

  For each CA in the Configuration partition, one unauthenticated HTTP GET to /certsrv/ with redirects off. FAIL if the endpoint answers 401 offering NTLM or Negotiate over plain HTTP.

  Not assessed: HTTPS enrollment, Extended Protection for Authentication (needs IIS configuration, which an unprivileged account cannot read), and whether a relay would succeed.

  SAFETY: sends one unauthenticated request per CA. Sends no credentials, attempts no authentication and requests no certificate. A FAIL shows configuration exposure, not exploitability. Windows domain members only; requires the approved outbound HTTP probe for the customer CA hosts.'
author: Audspect Research
executable: true
local_check: false
supported_os:
- windows
tags:
- active-directory
- adcs
- esc8
- web-enrollment
- relay
- t1557
- mitre
mitre_phases:
- discovery
- credential-access
steps:
- name: ADCS ESC8 - web enrollment reachable over HTTP with NTLM/Negotiate (T1557.001)
  technique_id: T1557.001
  executor: powershell
  requires_priv: user
  timeout_sec: 120
  production_safe: true
  fidelity: telemetry-safe
  risk: low
  reversible: true
  blast_radius: One unauthenticated HTTP GET per CA web enrollment endpoint. No credentials, no authentication attempt, no certificate request.
  telemetry:
  - 'CA: IIS request log entry for GET /certsrv/ from a non-CA host'
  detection:
  - 'SIEM: unauthenticated GET /certsrv/ from a workstation over HTTP'
  command: "$ErrorActionPreference = 'SilentlyContinue'\n$findings = @()\n$probed = 0\n$answered = 0\n$ok = $false\ntry {\n  $cfgDN = ([ADSI]\"LDAP://RootDSE\").configurationNamingContext\n  if (-not $cfgDN) { throw \"no configuration partition\" }\n  $cs = New-Object System.DirectoryServices.DirectorySearcher\n  $cs.SearchRoot = New-Object System.DirectoryServices.DirectoryEntry(\"LDAP://CN=Enrollment Services,CN=Public Key Services,CN=Services,$cfgDN\")\n  $cs.Filter = \"(objectClass=pKIEnrollmentService)\"\n  [void]$cs.PropertiesToLoad.Add('cn')\n  [void]$cs.PropertiesToLoad.Add('dNSHostName')\n  $cas = @($cs.FindAll())\n  foreach ($res in $cas) {\n    $caHost = [string]$res.Properties['dnshostname'][0]\n    if (-not $caHost) { continue }\n    $probed++\n    # Unauthenticated request only. No credentials, no Authorization header, no redirects followed.\n    $req = [System.Net.WebRequest]::Create(\"http://$caHost/certsrv/\")\n    $req.Method = 'GET'\n    $req.Timeout = 10000\n    $req.AllowAutoRedirect = $false\n    $req.UseDefaultCredentials = $false\n    $code = $null\n    $auth = ''\n    try {\n      $resp = $req.GetResponse()\n      $code = [int]$resp.StatusCode\n      $auth = [string]$resp.Headers['WWW-Authenticate']\n      $resp.Close()\n    } catch [System.Net.WebException] {\n      if ($_.Exception.Response) {\n        $r = $_.Exception.Response\n        $code = [int]$r.StatusCode\n        $auth = [string]$r.Headers['WWW-Authenticate']\n        $r.Close()\n      }\n    }\n    if ($code -ne $null) {\n      $answered++\n      if ($code -eq 401 -and $auth -match '(?i)NTLM|Negotiate') { $findings += \"$caHost (HTTP 401, $auth)\" }\n    }\n  }\n  $ok = ($probed -gt 0 -and $answered -eq $probed)\n} catch { $ok = $false }\nif ($findings.Count -gt 0) {\n  Write-Output \"EXEC T1557.001: $($findings.Count) CA web enrollment endpoint(s) answer over plain HTTP with integrated authentication. One unauthenticated GET per CA; no credentials sent. [BAS-SIM-ADCS-ESC8]\"\n  foreach ($f in $findings) { Write-Output \"HTTP $f\" }\n  Write-Output \"FAIL: AD CS web enrollment is reachable over HTTP and offers NTLM or Negotiate authentication (ESC8). An attacker on the network can relay a domain-controller or user NTLM authentication to the CA and obtain a certificate. Configuration exposure only; relay was not attempted. Remediation: require HTTPS, enable Extended Protection for Authentication, or disable Web Enrollment if unused. [BAS-SIM-ADCS-ESC8]\"\n} elseif (-not $ok) {\n  Write-Output \"SKIP: ESC8 probe could not reach any CA web enrollment endpoint (no CA found, host not domain-joined, or no CA answered). Not scored; an unreachable endpoint is not treated as PASS. Extended Protection state is not assessed. [BAS-SIM-ADCS-ESC8]\"\n} else {\n  Write-Output \"PASS: $answered of $probed CA host(s) answered; none offers NTLM or Negotiate over plain HTTP to an unauthenticated request. This step assesses the HTTP endpoint only; HTTPS and Extended Protection are not assessed. [BAS-SIM-ADCS-ESC8]\"\n}\n"
  cleanup: ''
