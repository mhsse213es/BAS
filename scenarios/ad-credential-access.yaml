id: ad-credential-access
name: Active Directory Credential Access Drill (PurpleSharp)
description: >
  Simulates Active Directory credential theft and lateral movement TTPs
  relevant to BFSI environments. Based on PurpleSharp simulation methodology.
  Tests controls against LSASS dumping, Kerberoasting, Pass-the-Hash, and
  DCSync â€” the four most common AD-based attack paths observed in Indian
  banking sector incidents. Requires domain-joined endpoint for full coverage.

  Per-OS local checks - Windows: LSA Protection / WDigest / Credential Guard /
  LSASS audit / Kerberos AES, NTLM and Pass-the-Hash mitigations, SMB signing,
  UAC and privilege-escalation controls. Linux: ptrace scope, core dumps,
  /etc/shadow and /etc/passwd permissions, unexpected SUID binaries, SSH
  lateral-movement controls. macOS: Keychain lock, FileVault, SSH and Screen
  Sharing.
author: Audspect Research
local_check: true
tags:
  - ad
  - credential-access
  - purplesharp
  - bfsi
  - lateral-movement
  - privilege-escalation
  - india
mitre_phases:
  - privilege-escalation
  - credential-access
  - lateral-movement

steps:
  - name: "Credential Access â€” LSASS memory dump via ProcDump"
    technique_id: T1003.001
    framework: art
    test_index: 0
    executor: powershell
    timeout_sec: 45

  - name: "Credential Access â€” LSASS dump via comsvcs.dll MiniDump"
    technique_id: T1003.001
    framework: art
    test_index: 2
    executor: powershell
    timeout_sec: 45

  - name: "Credential Access â€” Kerberoasting (SPN enumeration + ticket request)"
    technique_id: T1558.003
    framework: art
    test_index: 0
    executor: powershell
    timeout_sec: 45

  - name: "Credential Access â€” AS-REP Roasting (accounts without pre-auth)"
    technique_id: T1558.004
    framework: art
    test_index: 0
    executor: powershell
    timeout_sec: 45

  - name: "Lateral Movement â€” Pass-the-Hash via Mimikatz"
    technique_id: T1550.002
    framework: art
    test_index: 0
    executor: powershell
    timeout_sec: 45

  - name: "Credential Access â€” DCSync (domain replication of password hashes)"
    technique_id: T1003.006
    framework: art
    test_index: 0
    executor: powershell
    timeout_sec: 45

  - name: "Privilege Escalation â€” Token impersonation via Invoke-TokenManipulation"
    technique_id: T1134.001
    framework: art
    test_index: 0
    executor: powershell
    timeout_sec: 30
