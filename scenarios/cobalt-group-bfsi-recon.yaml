id: "cobalt-group-bfsi-recon"
product_line: killchain
name: "Cobalt Group BFSI - Reconnaissance Gap (P3)"
description: >
  Closes the two reconnaissance techniques from the campaign's Phase 1 that had no executable
  scenario: subdomain enumeration (T1590.001) and employee/identity discovery (T1589.003). Subdomain
  queries use a synthetic wordlist under the reserved .test TLD (RFC 6761) and cannot reach a real
  domain. Identity discovery queries only the lab simulator's synthetic directory. No real domain
  or directory is queried.
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - cobalt-group
  - bfsi
  - reconnaissance
  - p3
mitre_phases:
  - reconnaissance

steps:

  # -------------------------------------------------------------------------
  - id: recon-01
    name: "Reconnaissance - Subdomain Enumeration (Custom)"
    technique_id: T1590.001
    action_key: recon_subdomain_enumeration
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: telemetry-safe
    production_safe: false
    risk: low
    reversible: true
    blast_radius: "Issues eight DNS A-record queries for names under bas-sim.test, a reserved TLD that never resolves on the public internet. No state is created on the host."
    telemetry:
      - "DNS A-record queries for bas-sim.test subdomains"
    detection:
      - "Subdomain enumeration detection (burst of DNS queries for sequential service names)"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $script:CgRun = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0, [Math]::Min(8, $env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 2147483647) }
      function Write-CgVerdict { param([string]$Outcome, [string]$Reason, [string]$Id)
      $p = 'SKIP'
      if ($Outcome -eq 'pass') { $p = 'PASS' } elseif ($Outcome -eq 'fail') { $p = 'FAIL' } elseif ($Outcome -eq 'error') { $p = 'ERROR' }
      Write-Output ($p + ': ' + $Reason + ' [BAS-RECON-' + $Id + ']')
      }
      function Complete-CgStep { param($Res, [string]$Id) Write-CgVerdict $Res.Outcome $Res.Reason $Id; exit 0 }
      function Get-BfsiSimulatorHost { $h = $env:BFSI_SIMULATOR_HOST; if ($h) { return $h }; return 'localhost' }
      function Get-BfsiSimulatorPort { $p = $env:BFSI_SIMULATOR_PORT; if ($p) { return [int]$p }; return 9999 }
      function Test-BfsiSimulatorConnectivity {
      $simHost = Get-BfsiSimulatorHost
      $port = Get-BfsiSimulatorPort
      try { $tcp = New-Object Net.Sockets.TcpClient; $tcp.Connect($simHost, $port); $tcp.Close(); return $true } catch { return $false }
      }
      $domain = 'bas-sim.test'
      $names = @('www', 'mail', 'api', 'vpn', 'portal', 'intranet', 'sso', 'dev')
      $attempted = 0
      $answered = 0
      $nxdomain = 0
      $unclassifiable = 0
      foreach ($n in $names) {
      $fqdn = "$n.$domain"
      if (-not $fqdn.EndsWith('.test')) { Complete-CgStep @{ Outcome = 'error'; Reason = "Refusing to query non-.test name $fqdn" } 'RECON-01' }
      $attempted++
      try {
      $r = Resolve-DnsName -Name $fqdn -Type A -DnsOnly -ErrorAction Stop
      if ($r) { $answered++ } else { $nxdomain++ }
      } catch {
      if ($_.Exception.Message -match 'not exist|DNS name does not exist|NameError|NXDOMAIN') { $nxdomain++ } else { $unclassifiable++ }
      }
      }
      if ($attempted -eq $names.Count -and $unclassifiable -eq 0) {
      $res = @{ Outcome = 'pass'; Reason = "Attempted $attempted subdomain queries under $domain ($answered answered, $nxdomain NXDOMAIN)" }
      } elseif ($unclassifiable -gt 0) {
      $res = @{ Outcome = 'error'; Reason = "$unclassifiable of $attempted subdomain queries returned an unclassifiable error" }
      } else {
      $res = @{ Outcome = 'fail'; Reason = "Only $attempted of $($names.Count) subdomain queries were attempted" }
      }
      Complete-CgStep $res 'RECON-01'
    cleanup: |
      $ErrorActionPreference = 'SilentlyContinue'
      $script:CgRun = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0, [Math]::Min(8, $env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 2147483647) }
      function Write-CgVerdict { param([string]$Outcome, [string]$Reason, [string]$Id)
      $p = 'SKIP'
      if ($Outcome -eq 'pass') { $p = 'PASS' } elseif ($Outcome -eq 'fail') { $p = 'FAIL' } elseif ($Outcome -eq 'error') { $p = 'ERROR' }
      Write-Output ($p + ': ' + $Reason + ' [BAS-RECON-' + $Id + ']')
      }
      function Complete-CgStep { param($Res, [string]$Id) Write-CgVerdict $Res.Outcome $Res.Reason $Id; exit 0 }
      function Get-BfsiSimulatorHost { $h = $env:BFSI_SIMULATOR_HOST; if ($h) { return $h }; return 'localhost' }
      function Get-BfsiSimulatorPort { $p = $env:BFSI_SIMULATOR_PORT; if ($p) { return [int]$p }; return 9999 }
      function Test-BfsiSimulatorConnectivity {
      $simHost = Get-BfsiSimulatorHost
      $port = Get-BfsiSimulatorPort
      try { $tcp = New-Object Net.Sockets.TcpClient; $tcp.Connect($simHost, $port); $tcp.Close(); return $true } catch { return $false }
      }
      Write-Output 'PASS: Cleanup complete'
      exit 0

  # -------------------------------------------------------------------------
  - id: recon-02
    name: "Reconnaissance - Employee and Identity Discovery (Custom)"
    technique_id: T1589.003
    action_key: recon_employee_discovery
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: telemetry-safe
    production_safe: false
    risk: low
    reversible: true
    blast_radius: "Reads the synthetic identity directory from the lab simulator. No real directory is queried. SKIP when the simulator is unreachable."
    telemetry:
      - "HTTP GET to lab-local simulator identity directory"
    detection:
      - "Directory enumeration detection"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $script:CgRun = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0, [Math]::Min(8, $env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 2147483647) }
      function Write-CgVerdict { param([string]$Outcome, [string]$Reason, [string]$Id)
      $p = 'SKIP'
      if ($Outcome -eq 'pass') { $p = 'PASS' } elseif ($Outcome -eq 'fail') { $p = 'FAIL' } elseif ($Outcome -eq 'error') { $p = 'ERROR' }
      Write-Output ($p + ': ' + $Reason + ' [BAS-RECON-' + $Id + ']')
      }
      function Complete-CgStep { param($Res, [string]$Id) Write-CgVerdict $Res.Outcome $Res.Reason $Id; exit 0 }
      function Get-BfsiSimulatorHost { $h = $env:BFSI_SIMULATOR_HOST; if ($h) { return $h }; return 'localhost' }
      function Get-BfsiSimulatorPort { $p = $env:BFSI_SIMULATOR_PORT; if ($p) { return [int]$p }; return 9999 }
      function Test-BfsiSimulatorConnectivity {
      $simHost = Get-BfsiSimulatorHost
      $port = Get-BfsiSimulatorPort
      try { $tcp = New-Object Net.Sockets.TcpClient; $tcp.Connect($simHost, $port); $tcp.Close(); return $true } catch { return $false }
      }
      if (-not (Test-BfsiSimulatorConnectivity)) {
      Complete-CgStep @{ Outcome = 'skip'; Reason = 'BFSI simulator not reachable - prerequisite not met' } 'RECON-02'
      }
      $simHost = Get-BfsiSimulatorHost
      $port = Get-BfsiSimulatorPort
      try {
      $ids = Invoke-RestMethod -Method GET -Uri ("http://${simHost}:${port}/api/directory/identities") -TimeoutSec 5 -ErrorAction Stop
      } catch {
      Complete-CgStep @{ Outcome = 'error'; Reason = "Identity directory request failed: $($_.Exception.Message)" } 'RECON-02'
      }
      if ($ids.Count -eq 0) {
      $res = @{ Outcome = 'fail'; Reason = 'Identity directory returned no identities (a silent empty directory would hide a broken lab)' }
      } elseif (($ids | Where-Object { -not ([string]$_.sam).StartsWith('bas-sim-') }).Count -gt 0) {
      $res = @{ Outcome = 'fail'; Reason = 'Identity directory returned an entry that is not clearly synthetic' }
      } elseif ($ids.Count -lt 5) {
      $res = @{ Outcome = 'fail'; Reason = "Identity directory returned only $($ids.Count) identities, expected at least 5" }
      } else {
      $res = @{ Outcome = 'pass'; Reason = "Enumerated $($ids.Count) synthetic identities from the lab directory" }
      }
      Complete-CgStep $res 'RECON-02'
    cleanup: |
      $ErrorActionPreference = 'SilentlyContinue'
      $script:CgRun = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0, [Math]::Min(8, $env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 2147483647) }
      function Write-CgVerdict { param([string]$Outcome, [string]$Reason, [string]$Id)
      $p = 'SKIP'
      if ($Outcome -eq 'pass') { $p = 'PASS' } elseif ($Outcome -eq 'fail') { $p = 'FAIL' } elseif ($Outcome -eq 'error') { $p = 'ERROR' }
      Write-Output ($p + ': ' + $Reason + ' [BAS-RECON-' + $Id + ']')
      }
      function Complete-CgStep { param($Res, [string]$Id) Write-CgVerdict $Res.Outcome $Res.Reason $Id; exit 0 }
      function Get-BfsiSimulatorHost { $h = $env:BFSI_SIMULATOR_HOST; if ($h) { return $h }; return 'localhost' }
      function Get-BfsiSimulatorPort { $p = $env:BFSI_SIMULATOR_PORT; if ($p) { return [int]$p }; return 9999 }
      function Test-BfsiSimulatorConnectivity {
      $simHost = Get-BfsiSimulatorHost
      $port = Get-BfsiSimulatorPort
      try { $tcp = New-Object Net.Sockets.TcpClient; $tcp.Connect($simHost, $port); $tcp.Close(); return $true } catch { return $false }
      }
      Write-Output 'PASS: Cleanup complete'
      exit 0
