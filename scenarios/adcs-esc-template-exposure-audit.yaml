        foreach ($r in @($rules)) {
          $o += [pscustomobject]@{ sid = $r.IdentityReference.Value; mask = [int64]$r.ActiveDirectoryRights; objectType = [string]$r.ObjectType; type = [string]$r.AccessControlType }
