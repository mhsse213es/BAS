      }
      $script:AdcsCaFields = @('web')
      Invoke-AdcsStage '8' @('cas') 'ESC8 (web enrollment relay)' 'no CA web enrollment endpoint offers NTLM or Negotiate over plain HTTP. HTTPS and Extended Protection are not assessed.' 'ESC8: CA web enrollment accepts integrated authentication over HTTP, which can be relayed.' $true
    cleanup: ""

