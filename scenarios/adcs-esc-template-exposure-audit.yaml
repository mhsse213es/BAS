      }
      $script:AdcsCaFields = @('caAces')
      Invoke-AdcsStage '7' @('cas') 'ESC7 (CA administrative rights)' 'no non-tier-0 principal holds ManageCA or ManageCertificates on any CA. This step assesses CA permissions only.' 'ESC7: a non-tier-0 principal holds ManageCA or ManageCertificates on a CA.' $true
    cleanup: ""

