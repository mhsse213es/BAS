      }
      $oids = @()
      $oidOk = $false
      try {
        $ipSearcher = New-Object System.DirectoryServices.DirectorySearcher
        $ipSearcher.SearchRoot = New-Object System.DirectoryServices.DirectoryEntry("LDAP://$configDN")
        $ipSearcher.Filter = "(objectClass=msPKI-Enterprise-Oid)"
        $ipSearcher.PropertiesToLoad.Add("msPKI-Cert-Template-OID") | Out-Null
        $ipSearcher.PageSize = 100
        foreach ($ip in $ipSearcher.FindAll()) {
          $oid = [string]$ip.Properties['mspki-cert-template-oid'][0]
          if ($oid) { $oids += $oid }
        }
        $oidOk = $true
      } catch {
        $oidOk = $false
      }
      if (-not ($ok -and $oidOk)) {
        Write-Output "SKIP: ESC13 check unavailable: template or issuance-policy objects could not be read. Not scored. [BAS-SIM-ADCS-ESC13]"
      } elseif ($findings.Count -gt 0 -or $oids.Count -gt 0) {
        Write-Output "EXEC T1649: ESC13 precondition present: $($findings.Count) template(s) with issuance-policy application policies and low-privilege enrollment, $($oids.Count) issuance-policy OID object(s). Group linkage is NOT evaluated. [BAS-SIM-ADCS-ESC13]"
        foreach ($f in $findings) { Write-Output $f }
        foreach ($o in $oids) { Write-Output "OID $o" }
        Write-Output "SKIP: ESC13 cannot be scored by this step. Linking an issuance-policy OID to a group with non-tier-0 members requires manual correlation. Not scored as FAIL. [BAS-SIM-ADCS-ESC13]"
      } else {
        Write-Output "PASS: no template or issuance-policy OID shows the ESC13 precondition. This step assesses ESC13 only. [BAS-SIM-ADCS-ESC13]"
      }
    cleanup: ""
