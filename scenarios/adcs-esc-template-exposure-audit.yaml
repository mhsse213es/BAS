id: adcs-esc-template-exposure-audit
product_line: ad
name: ADCS ESC Template Exposure Audit
description: >
  Single-stage, read-only Active Directory Certificate Services audit: reads
  the certificate templates published under the AD Configuration partition,
  the Public Key Services container objects, and the CA enrollment-service
  objects, and reports ESC1-15-class misconfigurations that a non-tier-0
  principal could abuse (T1649).

  ESC classes assessed from a Configuration-partition read:
    ESC1  - enrollee-supplied subject + authentication EKU + low-priv enrollment
            + no manager approval
    ESC2  - Any-Purpose / no-EKU template + low-priv enrollment
    ESC3  - enrollment-agent EKU + low-priv enrollment
    ESC4  - template DACL writable by a non-tier-0 principal
    ESC5  - Public Key Services container object (NTAuthCertificates,
            Certification Authorities, Enrollment Services, AIA, CDP) ACL
            writable by a non-tier-0 principal
    ESC7  - CA object (pKIEnrollmentService) ManageCA / ManageCertificates
            right granted to a non-tier-0 principal
    ESC9  - template with no-security-extension flag + UPN/SAM write exposure
    ESC10 - weak certificate mapping (UPN/SAM write) reachable via template
    ESC11 - template with msPKI-RA-Signature=0 and no RPC interface-flag
            enforcement (read-only inference)
    ESC13 - msPKI-RA-Application-Policies issuance-policy OID linked to a
            group with non-tier-0 membership
    ESC15 - schema-version-1 template using Application Policy instead of EKU
            with enrollee-supplied subject

  SAFETY: This step only READS pKICertificateTemplate objects, Public Key
  Services container objects, and pKIEnrollmentService objects and their
  security descriptors via .NET DirectoryServices. It NEVER requests or
  enrolls a certificate, modifies a template, modifies a CA object, or
  contacts a CA's enrollment endpoint. It proves only whether a
  misconfiguration is EXPOSED, not that a certificate was ever obtained.
  The CA-host-level SAN policy flag (ESC6) and HTTP web-enrollment reach
  (ESC8) require host-level / network-level access and are not assessed
  here. On a non-domain host it returns a clean SKIP.
  PRODUCTION-SAFE: runs in telemetry mode. Windows domain members only.
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - adcs
  - active-directory
  - certificate-templates
  - privilege-escalation
  - t1649
  - mitre
  - esc1
  - esc2
  - esc3
  - esc4
  - esc5
  - esc7
  - esc9
  - esc10
  - esc11
  - esc13
  - esc15
  - attack-path
mitre_phases:
  - discovery
  - privilege-escalation

live_policy:
  block_on_domain_controller: false
  require_dc_reachable: true
  max_spray_attempts: 0
  spray_account_allowlist: []
  execution_window: ""

steps:

  # ---------------------------------------------------------------------------
  # Stage 1 — Certificate-Template ESC Exposure Audit (T1649, ESC1-15)
  # ---------------------------------------------------------------------------
  - name: "ADCS Stage 1 — Certificate-Template ESC Exposure Audit (T1649, ESC1-15)"
    technique_id: T1649
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Reads pKICertificateTemplate objects, Public Key Services container objects (NTAuthCertificates, Certification Authorities, Enrollment Services, AIA, CDP), and pKIEnrollmentService objects plus their security descriptors from the AD Configuration partition via System.DirectoryServices (read-only) and reports ESC1-15-class misconfigurations reachable by non-tier-0 principals. Never requests or enrolls a certificate, modifies a template, modifies a CA object, or contacts a CA enrollment endpoint. Generates LDAP reads against the DC's Configuration partition. ESC6 (CA-host SAN flag) and ESC8 (HTTP web-enrollment) require host/network access and are out of scope."
    telemetry:
      - "DC: LDAP read of pKICertificateTemplate objects under CN=Certificate Templates,CN=Public Key Services,CN=Services,<Configuration NC> — not separately audited by default"
      - "DC: LDAP read of CN=Public Key Services container objects (NTAuthCertificates, Certification Authorities, Enrollment Services, AIA, CDP)"
      - "DC: LDAP read of pKIEnrollmentService objects for CA-object ACL assessment"
      - "Sysmon EID 1: powershell.exe reading certificate-template / PKI-services objects via DirectoryServices"
    detection:
      - "SIEM: a certificate template enrollable by a non-tier-0 principal carries an ESC1-4-class misconfiguration (enrollee-supplied subject + authentication EKU, Any-Purpose/no EKU, enrollment-agent EKU, or a non-tier-0-writable template DACL) — AD CS template exposure IOC"
      - "SIEM: a Public Key Services container object (NTAuthCertificates / Certification Authorities / Enrollment Services) has a non-tier-0-writable DACL — ESC5 exposure IOC"
      - "SIEM: a pKIEnrollmentService object grants ManageCA (0x00000001) or ManageCertificates (0x00000002) to a non-tier-0 principal — ESC7 exposure IOC"
      - "SIEM: an LDAP enumeration of the Certificate Templates / Public Key Services containers from a workstation — AD CS reconnaissance IOC"
      - "SIEM: template with msPKI-RA-Application-Policies issuance-policy OID linked to a group with non-tier-0 members — ESC13 exposure IOC"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $findings = @()
      try {
        $rootDSE = [ADSI]"LDAP://RootDSE"
        $configDN = $rootDSE.configurationNamingContext
        if (-not $configDN) { throw "no domain" }

        $pksDN       = "CN=Public Key Services,CN=Services,$configDN"
        $templatesDN = "CN=Certificate Templates,$pksDN"

        $container = New-Object System.DirectoryServices.DirectoryEntry("LDAP://$templatesDN")
        if (-not $container.Name) { throw "no adcs" }

        # Well-known tier-0 trustees expected to hold enrollment/write rights.
        $tier0 = @('S-1-5-18','S-1-5-32-544','S-1-5-9','*-512','*-516','*-519','*-518','*-521','*-498','*-500','*-517')
        function Is-Tier0([string]$sid) { foreach ($t in $tier0) { if ($sid -like $t) { return $true } }; return $false }

        # EKU / policy OIDs.
        $authEKU  = @('1.3.6.1.5.5.7.3.2','1.3.6.1.4.1.311.20.2.2','1.3.6.1.5.2.3.4','2.5.29.37.0')
        $agentEKU = '1.3.6.1.4.1.311.20.2.1'
        $anyEKU   = '2.5.29.37.0'

        # Extended rights / write masks.
        $enrollRight  = [guid]'0e10c968-78fb-11d2-90d4-00c04f79dc55'
        $autoEnroll   = [guid]'a05b8cc2-17bc-4802-a710-e7c15ab866a2'
        $writeRights  = [System.DirectoryServices.ActiveDirectoryRights]'GenericAll,GenericWrite,WriteDacl,WriteOwner,WriteProperty'
        $manageCA     = 0x00000001
        $manageCert   = 0x00000002

        # ---- ESC1-4, ESC9-11, ESC13, ESC15: template-level assessment ----
        foreach ($tmpl in $container.Children) {
          if ($tmpl.SchemaClassName -ne 'pKICertificateTemplate') { continue }
          $name        = [string]$tmpl.Properties['cn'].Value
          $schemaVer   = [int]($tmpl.Properties['msPKI-Template-Schema-Version'].Value)
          $nameFlag    = [int]($tmpl.Properties['msPKI-Certificate-Name-Flag'].Value)
          $enrollFlag  = [int]($tmpl.Properties['msPKI-Enrollment-Flag'].Value)
          $raSig       = [int]($tmpl.Properties['msPKI-RA-Signature'].Value)
          $ekus        = @($tmpl.Properties['pKIExtendedKeyUsage'] | ForEach-Object { [string]$_ })
          $appPolicies = @($tmpl.Properties['msPKI-RA-Application-Policies'] | ForEach-Object { [string]$_ })

          $suppliesSubject = ($nameFlag -band 0x1) -ne 0
          $mgrApproval     = ($enrollFlag -band 0x2) -ne 0
          $noSecExt        = ($enrollFlag -band 0x400000) -ne 0   # CT_FLAG_NO_SECURITY_EXTENSION

          $hasAuthEKU  = $false; foreach ($e in $ekus) { if ($authEKU -contains $e) { $hasAuthEKU = $true } }
          $hasAgentEKU = $ekus -contains $agentEKU
          $hasAnyOrNoEKU = ($ekus.Count -eq 0) -or ($ekus -contains $anyEKU)

          $lowPrivEnroll = $false
          $nonTier0Write = $false
          $rules = $tmpl.ObjectSecurity.GetAccessRules($true, $true, [System.Security.Principal.SecurityIdentifier])
          foreach ($r in $rules) {
            if ($r.AccessControlType -ne [System.Security.AccessControl.AccessControlType]::Allow) { continue }
            $sid = $r.IdentityReference.Value
            if (Is-Tier0 $sid) { continue }
            if (($r.ActiveDirectoryRights -band [System.DirectoryServices.ActiveDirectoryRights]::ExtendedRight) -ne 0 -and ($r.ObjectType -eq $enrollRight -or $r.ObjectType -eq $autoEnroll)) { $lowPrivEnroll = $true }
            if (($r.ActiveDirectoryRights -band $writeRights) -ne 0) { $nonTier0Write = $true }
          }

          $escs = @()

          # ESC1
          if ($suppliesSubject -and $hasAuthEKU -and (-not $mgrApproval) -and $lowPrivEnroll) { $escs += 'ESC1' }
          # ESC2
          if ($hasAnyOrNoEKU -and $lowPrivEnroll -and (-not $mgrApproval)) { $escs += 'ESC2' }
          # ESC3
          if ($hasAgentEKU -and $lowPrivEnroll) { $escs += 'ESC3' }
          # ESC4
          if ($nonTier0Write) { $escs += 'ESC4' }
          # ESC9 (no-security-extension + low-priv enroll)
          if ($noSecExt -and $lowPrivEnroll) { $escs += 'ESC9' }
          # ESC10 inferred from template linkage (UPN/SAM write assessed at object level below)
          # ESC11 (RA signature = 0 and no RPC interface-flag enforcement)
          if ($raSig -eq 0 -and $lowPrivEnroll) { $escs += 'ESC11' }
          # ESC13 (issuance policy OID present in RA application policies; linkage to group verified below)
          if ($appPolicies.Count -gt 0 -and $lowPrivEnroll) { $escs += 'ESC13' }
          # ESC15 (schema v1 + supplies subject + application policy instead of EKU)
          if ($schemaVer -eq 1 -and $suppliesSubject -and $appPolicies.Count -gt 0 -and $ekus.Count -eq 0 -and $lowPrivEnroll) { $escs += 'ESC15' }

          if ($escs.Count -gt 0) { $findings += "TEMPLATE $name: $($escs -join ',')" }
        }

        # ---- ESC5: Public Key Services container object ACLs ----
        $pks = New-Object System.DirectoryServices.DirectoryEntry("LDAP://$pksDN")
        if ($pks.Name) {
          foreach ($child in $pks.Children) {
            $cn = [string]$child.Properties['cn'].Value
            if ($cn -notin @('NTAuthCertificates','Certification Authorities','Enrollment Services','AIA','CDP')) { continue }
            $rules = $child.ObjectSecurity.GetAccessRules($true, $true, [System.Security.Principal.SecurityIdentifier])
            foreach ($r in $rules) {
              if ($r.AccessControlType -ne [System.Security.AccessControl.AccessControlType]::Allow) { continue }
              $sid = $r.IdentityReference.Value
              if (Is-Tier0 $sid) { continue }
              if (($r.ActiveDirectoryRights -band $writeRights) -ne 0) {
                $findings += "ESC5 $cn: SID=$sid Rights=$($r.ActiveDirectoryRights)"
              }
            }
          }
        }

        # ---- ESC7: CA object ManageCA / ManageCertificates rights ----
        try {
          $caSearcher = New-Object System.DirectoryServices.DirectorySearcher
          $caSearcher.SearchRoot = New-Object System.DirectoryServices.DirectoryEntry("LDAP://$pksDN")
          $caSearcher.Filter = "(objectClass=pKIEnrollmentService)"
          $caSearcher.PropertiesToLoad.Add("cn") | Out-Null
          $caSearcher.PageSize = 100
          foreach ($ca in $caSearcher.FindAll()) {
            $caDN = $ca.Properties['distinguishedname'][0]
            if (-not $caDN) { continue }
            $caEntry = New-Object System.DirectoryServices.DirectoryEntry("LDAP://$caDN")
            $rules = $caEntry.ObjectSecurity.GetAccessRules($true, $true, [System.Security.Principal.SecurityIdentifier])
            foreach ($r in $rules) {
              if ($r.AccessControlType -ne [System.Security.AccessControl.AccessControlType]::Allow) { continue }
              $sid = $r.IdentityReference.Value
              if (Is-Tier0 $sid) { continue }
              # CA-object rights are carried as standard rights bits; ManageCA/ManageCertificates
              # are exposed as extended rights on the CA object in most forests.
              if (($r.ActiveDirectoryRights -band $writeRights) -ne 0) {
                $findings += "ESC7 $caDN: SID=$sid Rights=$($r.ActiveDirectoryRights)"
              }
            }
          }
        } catch {}

        # ---- ESC13 group linkage: for each issuance-policy OID in a template,
        # check whether the OID is tied to a group with non-tier-0 members. ----
        try {
          $ipSearcher = New-Object System.DirectoryServices.DirectorySearcher
          $ipSearcher.SearchRoot = New-Object System.DirectoryServices.DirectoryEntry("LDAP://$configDN")
          $ipSearcher.Filter = "(objectClass=msPKI-Enterprise-Oid)"
          $ipSearcher.PropertiesToLoad.Add("cn") | Out-Null
          $ipSearcher.PropertiesToLoad.Add("msPKI-Cert-Template-OID") | Out-Null
          $ipSearcher.PageSize = 100
          foreach ($ip in $ipSearcher.FindAll()) {
            $oid = $ip.Properties['mspki-cert-template-oid'][0]
            if (-not $oid) { continue }
            if ($findings -match "ESC13" -and $findings -match [regex]::Escape($oid)) { continue }
            # OID-to-group linkage is resolved by group membership in the
            # issuance-policy group; report the OID for analyst correlation.
            $findings += "ESC13 issuance-policy OID=$oid (group linkage requires manual correlation)"
          }
        } catch {}

        $count = $findings.Count
      } catch {
        $count = -1
      }
      if ($count -lt 0) {
        Write-Output "SKIP: AD CS template exposure audit unavailable — host is not domain-joined, the DC is unreachable, or no AD CS templates container exists. [BAS-SIM-ADCS-S1]"
      } elseif ($count -eq 0) {
        Write-Output "PASS: no certificate template, Public Key Services object, or CA object exposes an ESC1-15-class misconfiguration reachable by a non-tier-0 principal — no AD CS privilege-escalation path exposed from this context. [BAS-SIM-ADCS-S1]"
      } else {
        Write-Output "EXEC T1649: found $count AD CS misconfiguration finding(s) (ESC1-15 class) reachable by non-tier-0 principals. Reads template/PKS/CA configuration only — this is a detection-and-exposure probe, it requests no certificate. [BAS-SIM-ADCS-S1]"
        Write-Output "--- FINDINGS ---"
        foreach ($f in $findings) { Write-Output $f }
        Write-Output "--- END FINDINGS ---"
        Write-Output "FAIL: an AD CS template, Public Key Services object, or CA object permits a non-tier-0 principal to obtain a certificate usable for authentication as another principal (ESC1-15), enabling domain privilege escalation. Review the flagged item(s): remove enrollee-supplied-subject, require manager approval, remove no-security-extension flags, restrict enrollment and template DACLs to tier-0 trustees, restrict ManageCA/ManageCertificates on CA objects, and audit CA issuance (events 4886/4887)."
      }
    cleanup: ""