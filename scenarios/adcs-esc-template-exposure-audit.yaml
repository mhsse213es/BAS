        if ($script:AdcsBroad.ContainsKey($sid)) { return "$sid ($($script:AdcsBroad[$sid]))" }
        if ($sid -like '*-513') { return "$sid (Domain Users)" }
        if ($sid -like '*-515') { return "$sid (Domain Computers)" }
        return $sid
      }
