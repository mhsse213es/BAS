  - name: "ADCS ESC5 - Public Key Services container objects writable by non-tier-0 (T1649)"
    technique_id: T1649
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Reads pKICertificateTemplate objects, Public Key Services container objects (NTAuthCertificates, Certification Authorities, Enrollment Services, AIA, CDP), and pKIEnrollmentService objects plus their security descriptors from the AD Configuration partition via System.DirectoryServices (read-only) and reports ESC1-15-class misconfigurations reachable by non-tier-0 principals. Never requests or enrolls a certificate, modifies a template, modifies a CA object, or contacts a CA enrollment endpoint. Generates LDAP reads against the DC's Configuration partition. ESC6 (CA-host SAN flag) and ESC8 (HTTP web-enrollment) require host/network access and are out of scope."
    telemetry:
      - "DC: LDAP read of pKICertificateTemplate objects under CN=Certificate Templates,CN=Public Key Services,CN=Services,<Configuration NC> \u2014 not separately audited by default"
      - "DC: LDAP read of CN=Public Key Services container objects (NTAuthCertificates, Certification Authorities, Enrollment Services, AIA, CDP)"
      - "DC: LDAP read of pKIEnrollmentService objects for CA-object ACL assessment"
      - "Sysmon EID 1: powershell.exe reading certificate-template / PKI-services objects via DirectoryServices"
    detection:
      - "SIEM: a certificate template enrollable by a non-tier-0 principal carries an ESC1-4-class misconfiguration (enrollee-supplied subject + authentication EKU, Any-Purpose/no EKU, enrollment-agent EKU, or a non-tier-0-writable template DACL) \u2014 AD CS template exposure IOC"
      - "SIEM: a Public Key Services container object (NTAuthCertificates / Certification Authorities / Enrollment Services) has a non-tier-0-writable DACL \u2014 ESC5 exposure IOC"
      - "SIEM: a pKIEnrollmentService object grants ManageCA (0x00000001) or ManageCertificates (0x00000002) to a non-tier-0 principal \u2014 ESC7 exposure IOC"
      - "SIEM: an LDAP enumeration of the Certificate Templates / Public Key Services containers from a workstation \u2014 AD CS reconnaissance IOC"
      - "SIEM: template with msPKI-RA-Application-Policies issuance-policy OID linked to a group with non-tier-0 members \u2014 ESC13 exposure IOC"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $findings = @()
      $ok = $false
      try {
        $rootDSE = [ADSI]"LDAP://RootDSE"
        $configDN = $rootDSE.configurationNamingContext
        if (-not $configDN) { throw "no configuration naming context" }
        $pksDN = "CN=Public Key Services,CN=Services,$configDN"
        $pks = New-Object System.DirectoryServices.DirectoryEntry("LDAP://$pksDN")
        if (-not $pks.Name) { throw "no Public Key Services container" }
        $tier0 = @('S-1-5-18','S-1-5-32-544','S-1-5-9','*-512','*-516','*-519','*-518','*-521','*-498','*-500','*-517')
        function Is-Tier0([string]$sid) { foreach ($t in $tier0) { if ($sid -like $t) { return $true } }; return $false }
        $writeRights = [System.DirectoryServices.ActiveDirectoryRights]'GenericAll,GenericWrite,WriteDacl,WriteOwner,WriteProperty'
        foreach ($child in $pks.Children) {
          $cn = [string]$child.Properties['cn'].Value
          if ($cn -notin @('NTAuthCertificates','Certification Authorities','Enrollment Services','AIA','CDP')) { continue }
          $rules = $child.ObjectSecurity.GetAccessRules($true, $true, [System.Security.Principal.SecurityIdentifier])
          foreach ($r in $rules) {
            if ($r.AccessControlType -ne [System.Security.AccessControl.AccessControlType]::Allow) { continue }
            $sid = $r.IdentityReference.Value
            if (Is-Tier0 $sid) { continue }
            if (($r.ActiveDirectoryRights -band $writeRights) -ne 0) { $findings += "${cn}: SID=$sid Rights=$($r.ActiveDirectoryRights)" }
          }
        }
        $ok = $true
      } catch {
        $ok = $false
      }
      if (-not $ok) {
        Write-Output "SKIP: ESC5 check unavailable: the Public Key Services container could not be read. Not scored. [BAS-SIM-ADCS-ESC5]"
      } elseif ($findings.Count -eq 0) {
        Write-Output "PASS: no Public Key Services container object grants write rights to a non-tier-0 principal. This step assesses ESC5 only. [BAS-SIM-ADCS-ESC5]"
      } else {
        Write-Output "EXEC T1649: ESC5 write exposure found on $($findings.Count) PKS object ACE(s). Reads ACLs only. [BAS-SIM-ADCS-ESC5]"
        foreach ($f in $findings) { Write-Output $f }
        Write-Output "FAIL: a non-tier-0 principal can modify a Public Key Services object (NTAuthCertificates, CA, Enrollment Services, AIA or CDP). Remediation: restrict these ACLs to tier-0 trustees. [BAS-SIM-ADCS-ESC5]"
      }
    cleanup: ""

