      $script:AdcsEscKind = @{ '1' = 't'; '2' = 't'; '3' = 'tt'; '4' = 't'; '9' = 't'; '15' = 'tc'; '13' = 'to'; '5' = 'p'; '6' = 'c'; '7' = 'c'; '11' = 'c'; '12' = 'c'; '8' = 'cl'; '10' = 'd'; '14' = 'a' }
