  # Stage 5
  # -------------------------------------------------------------------------
  - name: "ADCS Stage 5 — ESC5 — PKI Object ACL Exposure (T1649)"
    technique_id: T1649
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 120
    fidelity: telemetry-safe
    production_safe: true
    risk: low
