id: adcs-esc-template-exposure-audit
product_line: ad
name: ADCS ESC Template Exposure Audit
description: >
  Read-only Active Directory Certificate Services audit, one independent step per escalation class (T1649). Each step reads certificate template, Public Key Services and CA objects from the Configuration partition, and reports whether a configuration for that one class is reachable by a non-tier-0 principal.
  Classes assessed (each its own step):
    ESC1  enrollee-supplied subject, client-auth EKU, low-priv enrollment, no manager approval
    ESC2  Any-Purpose or empty EKU, low-priv enrollment, no manager approval
    ESC3  enrollment-agent EKU with low-priv enrollment
    ESC4  template ACL grants write rights to a non-tier-0 principal
    ESC5  Public Key Services container objects writable by a non-tier-0 principal
    ESC7  CA object standard write rights granted to a non-tier-0 principal (ManageCA and ManageCertificates NOT evaluated)
    ESC9  no-security-extension flag with low-priv enrollment (UPN/SAM write-exposure NOT evaluated)
    ESC11 RA signature count 0 with low-priv enrollment (inferred from configuration)
    ESC13 issuance-policy precondition; reported as SKIP, never FAIL, because group linkage needs manual correlation
    ESC15 schema-version-1 template, enrollee-supplied subject, Application Policy in place of EKU
  Not assessed by this scenario: ESC6 and ESC8 (CA host and network properties), ESC10 (no evaluation implemented), ESC12 and ESC14.
  SAFETY: reads configuration only. Never requests or enrols a certificate, never modifies a template or CA, never contacts an enrollment endpoint. A FAIL shows configuration exposure, not that a certificate was obtained. Windows domain members only. PRODUCTION-SAFE: telemetry mode.
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - adcs
  - active-directory
  - certificate-templates
  - privilege-escalation
  - t1649
  - mitre
  - esc1
  - esc2
  - esc3
  - esc4
  - esc5
  - esc7
  - esc9
  - esc10
  - esc11
  - esc13
  - esc15
  - attack-path
mitre_phases:
  - discovery
  - privilege-escalation

live_policy:
  block_on_domain_controller: false
  require_dc_reachable: true
  max_spray_attempts: 0
  spray_account_allowlist: []
  execution_window: ""

steps:
  - name: "ADCS ESC1 - enrollee-supplied subject with a client-auth EKU and low-privilege enrollment, no manager approval (T1649)"
    technique_id: T1649
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Reads pKICertificateTemplate objects, Public Key Services container objects (NTAuthCertificates, Certification Authorities, Enrollment Services, AIA, CDP), and pKIEnrollmentService objects plus their security descriptors from the AD Configuration partition via System.DirectoryServices (read-only) and reports ESC1-15-class misconfigurations reachable by non-tier-0 principals. Never requests or enrolls a certificate, modifies a template, modifies a CA object, or contacts a CA enrollment endpoint. Generates LDAP reads against the DC's Configuration partition. ESC6 (CA-host SAN flag) and ESC8 (HTTP web-enrollment) require host/network access and are out of scope."
    telemetry:
      - "DC: LDAP read of pKICertificateTemplate objects under CN=Certificate Templates,CN=Public Key Services,CN=Services,<Configuration NC> \u2014 not separately audited by default"
      - "DC: LDAP read of CN=Public Key Services container objects (NTAuthCertificates, Certification Authorities, Enrollment Services, AIA, CDP)"
      - "DC: LDAP read of pKIEnrollmentService objects for CA-object ACL assessment"
      - "Sysmon EID 1: powershell.exe reading certificate-template / PKI-services objects via DirectoryServices"
    detection:
      - "SIEM: a certificate template enrollable by a non-tier-0 principal carries an ESC1-4-class misconfiguration (enrollee-supplied subject + authentication EKU, Any-Purpose/no EKU, enrollment-agent EKU, or a non-tier-0-writable template DACL) \u2014 AD CS template exposure IOC"
      - "SIEM: a Public Key Services container object (NTAuthCertificates / Certification Authorities / Enrollment Services) has a non-tier-0-writable DACL \u2014 ESC5 exposure IOC"
      - "SIEM: a pKIEnrollmentService object grants ManageCA (0x00000001) or ManageCertificates (0x00000002) to a non-tier-0 principal \u2014 ESC7 exposure IOC"
      - "SIEM: an LDAP enumeration of the Certificate Templates / Public Key Services containers from a workstation \u2014 AD CS reconnaissance IOC"
      - "SIEM: template with msPKI-RA-Application-Policies issuance-policy OID linked to a group with non-tier-0 members \u2014 ESC13 exposure IOC"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $findings = @()
      $ok = $false
      try {
        $rootDSE = [ADSI]"LDAP://RootDSE"
        $configDN = $rootDSE.configurationNamingContext
        if (-not $configDN) { throw "no configuration naming context" }
        $pksDN = "CN=Public Key Services,CN=Services,$configDN"
        $templatesDN = "CN=Certificate Templates,$pksDN"
        $container = New-Object System.DirectoryServices.DirectoryEntry("LDAP://$templatesDN")
        if (-not $container.Name) { throw "no AD CS templates container" }
        $tier0 = @('S-1-5-18','S-1-5-32-544','S-1-5-9','*-512','*-516','*-519','*-518','*-521','*-498','*-500','*-517')
        function Is-Tier0([string]$sid) { foreach ($t in $tier0) { if ($sid -like $t) { return $true } }; return $false }
        $authEKU  = @('1.3.6.1.5.5.7.3.2','1.3.6.1.4.1.311.20.2.2','1.3.6.1.5.2.3.4','2.5.29.37.0')
        $clientAuthEKU = @('1.3.6.1.5.5.7.3.2','1.3.6.1.4.1.311.20.2.2','1.3.6.1.5.2.3.4')
        $agentEKU = '1.3.6.1.4.1.311.20.2.1'
        $anyEKU   = '2.5.29.37.0'
        $enrollRight = [guid]'0e10c968-78fb-11d2-90d4-00c04f79dc55'
        $autoEnroll  = [guid]'a05b8cc2-17bc-4802-a710-e7c15ab866a2'
        $writeRights = [System.DirectoryServices.ActiveDirectoryRights]'GenericAll,GenericWrite,WriteDacl,WriteOwner,WriteProperty'
        foreach ($tmpl in $container.Children) {
          if ($tmpl.SchemaClassName -ne 'pKICertificateTemplate') { continue }
          $name        = [string]$tmpl.Properties['cn'].Value
          $schemaVer   = [int]($tmpl.Properties['msPKI-Template-Schema-Version'].Value)
          $nameFlag    = [int]($tmpl.Properties['msPKI-Certificate-Name-Flag'].Value)
          $enrollFlag  = [int]($tmpl.Properties['msPKI-Enrollment-Flag'].Value)
          $raSig       = [int]($tmpl.Properties['msPKI-RA-Signature'].Value)
          $ekus        = @($tmpl.Properties['pKIExtendedKeyUsage'] | ForEach-Object { [string]$_ })
          $appPolicies = @($tmpl.Properties['msPKI-RA-Application-Policies'] | ForEach-Object { [string]$_ })
          $suppliesSubject = ($nameFlag -band 0x1) -ne 0
          $mgrApproval     = ($enrollFlag -band 0x2) -ne 0
          $noSecExt        = ($enrollFlag -band 0x80000) -ne 0
          $hasAuthEKU  = $false; foreach ($e in $ekus) { if ($authEKU -contains $e) { $hasAuthEKU = $true } }
          $hasAgentEKU = $ekus -contains $agentEKU
          $hasAnyOrNoEKU = ($ekus.Count -eq 0) -or ($ekus -contains $anyEKU)
          $lowPrivEnroll = $false
          $nonTier0Write = $false
          $rules = $tmpl.ObjectSecurity.GetAccessRules($true, $true, [System.Security.Principal.SecurityIdentifier])
          foreach ($r in $rules) {
            if ($r.AccessControlType -ne [System.Security.AccessControl.AccessControlType]::Allow) { continue }
            $sid = $r.IdentityReference.Value
            if (Is-Tier0 $sid) { continue }
            if (($r.ActiveDirectoryRights -band [System.DirectoryServices.ActiveDirectoryRights]::ExtendedRight) -ne 0 -and ($r.ObjectType -eq $enrollRight -or $r.ObjectType -eq $autoEnroll)) { $lowPrivEnroll = $true }
            if (($r.ActiveDirectoryRights -band $writeRights) -ne 0) { $nonTier0Write = $true }
          }
          if ($suppliesSubject -and $hasAuthEKU -and (-not $mgrApproval) -and $lowPrivEnroll) { $findings += "TEMPLATE $name" }
        }
        $ok = $true
      } catch {
        $ok = $false
      }
      if (-not $ok) {
        Write-Output "SKIP: ESC1 check unavailable: host is not domain-joined, the DC is unreachable, or no AD CS templates container exists. Not scored. [BAS-SIM-ADCS-ESC1]"
      } elseif ($findings.Count -eq 0) {
        Write-Output "PASS: no certificate template exposes the ESC1 configuration to a non-tier-0 enrollee. This step assesses ESC1 only. [BAS-SIM-ADCS-ESC1]"
      } else {
        Write-Output "EXEC T1649: ESC1 configuration found on $($findings.Count) template(s). Reads template configuration only; no certificate is requested. [BAS-SIM-ADCS-ESC1]"
        foreach ($f in $findings) { Write-Output $f }
        Write-Output "FAIL: ESC1 (enrollee-supplied subject with a client-auth EKU and low-privilege enrollment, no manager approval) is configured on the listed template(s). Configuration exposure only; exploitability was not tested. Remediation: remove enrollee-supplied subject, or require manager approval, and restrict enrollment rights to tier-0 trustees. [BAS-SIM-ADCS-ESC1]"
      }
    cleanup: ""

