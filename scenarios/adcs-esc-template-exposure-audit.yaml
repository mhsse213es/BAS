      function Invoke-AdcsStage([string]$esc, $needs, [string]$label, [string]$passText, [string]$failText, [bool]$collect) {
        $ctx = $script:AdcsCtx
        if ($collect) { $ctx = Read-AdcsContext $needs }
        $why = ''
        $complete = $true
        foreach ($n in $needs) {
          $err = $ctx.Errors[$n]
