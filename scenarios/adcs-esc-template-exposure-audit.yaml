  - name: "ADCS Stage 3 — ESC3 — Enrollment Agent (T1649)"
    technique_id: T1649
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 120
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Reads enrollment-agent templates and the templates that accept agent-signed requests, with their ACLs. CA enrollment-agent restrictions are not readable from AD and are reported as needing live verification. Read-only: never requests a certificate, modifies a template or CA object, or changes CA settings."
