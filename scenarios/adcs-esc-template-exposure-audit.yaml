      function Get-AdcsEscFindings([string]$esc, $ctx) {
        $fn = 'Test-AdcsEsc' + $esc
        $kind = $script:AdcsEscKind[$esc]
        $tf = @()
        if ($kind -like 't*' -and $null -ne $ctx.Templates) { $tf = @($ctx.Templates | ForEach-Object { Get-AdcsTemplateFacts $_ }) }
