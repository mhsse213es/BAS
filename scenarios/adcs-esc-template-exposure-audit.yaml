          foreach ($f in $fields) {
            $fn = 'Read-AdcsCaField_' + $f
            if (Get-Command $fn -ErrorAction SilentlyContinue) { $o[$f] = & $fn $ca $conf $ctx }
          }
          $cas += [pscustomobject]$o
        }
