      $script:AdcsBroad = @{ 'S-1-1-0' = 'Everyone'; 'S-1-5-11' = 'Authenticated Users'; 'S-1-5-32-545' = 'BUILTIN\Users' }
      function Test-AdcsTier0([string]$sid) { foreach ($t in $script:AdcsTier0) { if ($sid -like $t) { return $true } }; return $false }
