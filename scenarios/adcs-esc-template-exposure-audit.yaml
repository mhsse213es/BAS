          'tc' { foreach ($f in $tf) { $out += & $fn $f $ctx.CAs } }
          'p' { $out += & $fn $ctx.PkiObjects }
          'c' { $out += & $fn $ctx.CAs }
          'cl' { $out += & $fn $ctx.CAs ([bool]$ctx.LiveProbe) }
