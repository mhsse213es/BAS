      function New-AdcsContext { [pscustomobject]@{ Templates = $null; CAs = $null; PkiObjects = $null; Oids = $null; DCs = $null; Accounts = $null; NtAuth = $null; LiveProbe = $false; Errors = @{} } }
      function ConvertTo-AdcsAces($rules) {
