        Write-Output "FAIL: ESC15 (schema-version-1 template with enrollee-supplied subject and Application Policy in place of EKU) is configured on the listed template(s). Configuration exposure only; exploitability was not tested. Remediation: move to schema version 2 templates with explicit EKUs and remove enrollee-supplied subject. [BAS-SIM-ADCS-ESC15]"
