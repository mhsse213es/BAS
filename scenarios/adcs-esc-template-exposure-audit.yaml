          try { $own = $entry.ObjectSecurity.GetOwner([System.Security.Principal.SecurityIdentifier]); if ($own) { $aces += [pscustomobject]@{ sid = $own.Value; mask = [int64]0x40000; objectType = ''; type = 'Allow' } } } catch { }
