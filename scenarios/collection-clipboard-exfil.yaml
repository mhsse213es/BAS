  - name: "Clipboard 3.1 — Synthetic capture round trip with compare-before-clear (T1115)"
    technique_id: T1115
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    section: "Synthetic clipboard capture"
    blast_radius: "Writes one synthetic marker only when the clipboard is empty. Clears only if no later clipboard change occurred (sequence number check). No user content is read."
    telemetry:
      - "PowerShell EID 4104: Set-Clipboard style calls"
    detection:
      - "Monitoring evidence is queried in section 2"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $tag = '[BAS-SIM-CLP]'
      function Out-Verdict([string]$v, [string]$state, [string]$detail) {
        Write-Output ("{0}: state={1} {2} {3}" -f $v, $state, $detail, $tag)
      }
      function Get-PolicyValue([string]$path, [string]$name) {
        try { return (Get-ItemProperty -LiteralPath $path -Name $name -ErrorAction Stop).$name } catch { return $null }
      }
      Add-Type -AssemblyName System.Windows.Forms
      $runId = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0,[Math]::Min(8,$env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 0x7FFFFFFF) }

      Add-Type -TypeDefinition @"
      using System.Runtime.InteropServices;
      public static class BasClipSeq { [DllImport("user32.dll")] public static extern uint GetClipboardSequenceNumber(); }
      "@
      if ([System.Windows.Forms.Clipboard]::ContainsText()) {
        Out-Verdict 'SKIP' 'USER_CONTENT_PRESENT' 'clipboard holds content; nothing was read, written or cleared'
        return
      }
      $marker = "[BAS-SIM-CLP] synthetic run=$runId"
      [System.Windows.Forms.Clipboard]::SetText($marker)
      $seqAfterSet = [BasClipSeq]::GetClipboardSequenceNumber()
      $roundTrip = ([System.Windows.Forms.Clipboard]::GetText() -eq $marker)
      $seqNow = [BasClipSeq]::GetClipboardSequenceNumber()
      if ($seqNow -ne $seqAfterSet) {
        Out-Verdict 'SKIP' 'CHANGED_SINCE_START' 'clipboard changed during the test; not cleared, the user change is kept'
        return
      }
      [System.Windows.Forms.Clipboard]::Clear()
      $cleanedEmpty = -not [System.Windows.Forms.Clipboard]::ContainsText()
      if (-not $cleanedEmpty) { Out-Verdict 'ERROR' 'CLEANUP_FAILED' 'clipboard still holds text after clear'; return }
      if ($roundTrip) { Out-Verdict 'SKIP' 'UNVERIFIED' 'synthetic write and read-back completed and the clipboard was cleared; detection was not verified' }
      else { Out-Verdict 'SKIP' 'UNVERIFIED' 'synthetic read-back did not match; capture not confirmed' }
    cleanup: ""

