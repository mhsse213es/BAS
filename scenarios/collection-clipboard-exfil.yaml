      }
      Out-Verdict 'SKIP' 'NOT_CONFIGURED' 'no supported Windows policy restricts script clipboard access in this release' 
    cleanup: ""

  - name: "Clipboard 1.6 — Non-interactive clipboard access monitored (T1115)"
    technique_id: T1115
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    section: "Clipboard collection and access"
    blast_radius: "Queries an integration only when configured."
    telemetry:
      - "Integration query, when configured"
    detection:
      - "Defender for Endpoint"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $tag = '[BAS-SIM-CLP]'
      function Out-Verdict([string]$v, [string]$state, [string]$detail) {
        Write-Output ("{0}: state={1} {2} {3}" -f $v, $state, $detail, $tag)
      }
      function Get-PolicyValue([string]$path, [string]$name) {
        try { return (Get-ItemProperty -LiteralPath $path -Name $name -ErrorAction Stop).$name } catch { return $null }
      }
      function Get-AdapterResult([string]$flag) {
        # Evidence-file adapter. Configuring an integration (BAS_CLP_ADAPTER_<NAME>=1) is not enough to score.
        # The operator also points BAS_CLP_EVIDENCE_<NAME> at a JSON export of that vendor's events. Nothing here
        # calls the vendor, reads a credential or changes a control.
        if ([Environment]::GetEnvironmentVariable($flag) -ne '1') { return @{ State = 'NOT_CONFIGURED' } }
        $name = $flag -replace '^BAS_CLP_ADAPTER_', ''
        $key = $null
        if ($env:BAS_RUN_ID) { $key = $env:BAS_RUN_ID.Substring(0, [Math]::Min(8, $env:BAS_RUN_ID.Length)) }
        if (-not $key) { return @{ State = 'UNVERIFIED'; Reason = 'has no run id to correlate events with' } }
        $evPath = [Environment]::GetEnvironmentVariable(($flag -replace '_ADAPTER_', '_EVIDENCE_'))
        if (-not $evPath -or -not (Test-Path -LiteralPath $evPath)) { return @{ State = 'UNVERIFIED'; Reason = 'has no evidence export (BAS_CLP_EVIDENCE_' + $name + ' not set)' } }
        try { $events = @(Get-Content -LiteralPath $evPath -Raw -Encoding UTF8 | ConvertFrom-Json) } catch { return @{ State = 'ERROR'; Reason = 'evidence export is not valid JSON' } }
        $cutoff = (Get-Date).ToUniversalTime().AddMinutes(-15)
        $fresh = @($events | Where-Object { $_.time -and ([datetime]$_.time).ToUniversalTime() -ge $cutoff })
        $mine = @($fresh | Where-Object { $_.run_id -eq $key })
        if (@($mine | Where-Object { $_.event -eq 'transfer' }).Count -gt 0) { return @{ State = 'FAIL'; Detail = 'correlated transfer event for run ' + $key } }
        $ctl = @($mine | Where-Object { $_.event -eq 'block' -or $_.event -eq 'alert' })
        if ($ctl.Count -gt 0) { return @{ State = 'PASS'; Detail = 'correlated ' + $ctl[0].event + ' event for run ' + $key } }
        if ($fresh.Count -eq 0) { return @{ State = 'UNVERIFIED'; Reason = 'has no fresh evidence (none within 15 minutes)' } }
        return @{ State = 'UNVERIFIED'; Reason = 'has no correlated event for run ' + $key + ' in fresh evidence' }
      }
      function Out-AdapterVerdict($r, [string]$desc, [string]$name) {
        switch ($r.State) {
          'NOT_CONFIGURED' { Out-Verdict 'SKIP' 'NOT_CONFIGURED' ($desc + ': integration ' + $name + ' is not configured') }
          'UNVERIFIED'     { Out-Verdict 'SKIP' 'UNVERIFIED' ($desc + ': integration ' + $name + ' ' + $r.Reason) }
          'ERROR'          { Out-Verdict 'ERROR' 'ERROR' ($desc + ': integration ' + $name + ' ' + $r.Reason) }
          'FAIL'           { Out-Verdict 'FAIL' 'CORRELATED_TRANSFER' ($desc + ': ' + $r.Detail) }
          'PASS'           { Out-Verdict 'PASS' 'CORRELATED_EVENT' ($desc + ': ' + $r.Detail) }
        }
      }
      $r = Get-AdapterResult 'BAS_CLP_ADAPTER_DEFENDER'
      Out-AdapterVerdict $r 'non-interactive clipboard access monitoring' 'defender'
    cleanup: ""

