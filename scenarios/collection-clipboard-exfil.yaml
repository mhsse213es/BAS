id: collection-clipboard-exfil
product_line: dlp
name: Clipboard Collection Probe
description: >
  Telemetry-safe emulation of an adversary collecting clipboard contents and
  sending them out. Clipboards often hold credentials and copied records, so this
  scenario never reads what the user has copied. It runs only when the clipboard
  is empty. In that case it puts a synthetic [BAS-SIM] marker on the clipboard,
  reads back only that marker, and clears the clipboard, so the user is left with
  the empty clipboard they started with. If the user has content on the clipboard,
  the scenario skips without reading it.

  KILL CHAIN STAGES:
    1. Clipboard Presence Check — test whether the clipboard holds text, without reading it (T1115)
    2. Synthetic Clipboard Capture — with the clipboard empty, write a synthetic marker, read it back, clear (T1115)
    3. Clipboard Upload Attempt — POST the captured synthetic marker to an RFC-6761 .invalid host (T1048.003)

  SAFETY: The scenario reads the user's clipboard only to test whether it is empty,
  and reads its own marker otherwise. It never reads user content. It clears the
  clipboard only after its own marker was written into an empty clipboard, which
  restores the starting state. Clipboard history (Win+V) may still record the
  marker; the scenario does not disable it. Windows only.
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - collection
  - clipboard
  - credentials
  - exfiltration
  - dlp
  - t1115
  - t1048
  - mitre
mitre_phases:
  - collection
  - exfiltration

live_policy:
  block_on_domain_controller: true
  require_dc_reachable: false
  max_spray_attempts: 0
  spray_account_allowlist: []
  execution_window: ""

steps:

  # ---------------------------------------------------------------------------
  # Stage 1 — Clipboard Presence Check (T1115)
  # ---------------------------------------------------------------------------
  - name: "Clipboard 1 — Clipboard Presence Check, No Content Read (T1115)"
    technique_id: T1115
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 20
    fidelity: telemetry-safe
    production_safe: false
    risk: medium
    reversible: true
    blast_radius: "Tests whether the clipboard currently holds text, using ContainsText. This does not read the content. Nothing is written in this stage."
    telemetry:
      - "PowerShell EID 4104: System.Windows.Forms.Clipboard call"
    detection:
      - "EDR: clipboard access from a non-interactive script — collection IOC"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      Add-Type -AssemblyName System.Windows.Forms
      $hasText = [System.Windows.Forms.Clipboard]::ContainsText()
      if ($hasText) {
        Write-Output "SKIP: The clipboard holds user content. It was not read and nothing was written. Clipboard Stage 1. [BAS-SIM-CLP-S1]"
      } else {
        Write-Output "EXEC T1115: the clipboard is empty, so Stage 2 can run safely. Clipboard Stage 1. [BAS-SIM-CLP-S1]"
      }
    cleanup: ""

  # ---------------------------------------------------------------------------
  # Stage 2 — Synthetic Clipboard Capture (T1115)
  # ---------------------------------------------------------------------------
  - name: "Clipboard 2 — Synthetic Capture With Empty Clipboard (T1115)"
    technique_id: T1115
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 20
    fidelity: telemetry-safe
    production_safe: false
    risk: medium
    reversible: true
    blast_radius: "Only when Stage 1 found the clipboard empty: writes a synthetic [BAS-SIM] marker, reads it back, and clears the clipboard. The clipboard is returned to empty. If the clipboard has content, the step skips without reading or changing it."
    telemetry:
      - "PowerShell EID 4104: Set-Clipboard and Get-Clipboard calls"
      - "Clipboard history: the synthetic marker may be recorded if history is enabled"
    detection:
      - "EDR: clipboard written and read back by a script — clipboard collection IOC"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      Add-Type -AssemblyName System.Windows.Forms
      $runId = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0,[Math]::Min(8,$env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 0x7FFFFFFF) }
      if ([System.Windows.Forms.Clipboard]::ContainsText()) {
        Write-Output "SKIP: The clipboard holds user content, so no synthetic capture was done. [BAS-SIM-CLP-S2]"
        exit 0
      }
      $marker = "[BAS-SIM] synthetic clipboard marker run=$runId"
      [System.Windows.Forms.Clipboard]::SetText($marker)
      $back = [System.Windows.Forms.Clipboard]::GetText()
      [System.Windows.Forms.Clipboard]::Clear()
      $captured = $back -eq $marker
      $empty = -not [System.Windows.Forms.Clipboard]::ContainsText()
      Write-Output "EXEC T1115: wrote a synthetic marker to the empty clipboard, read it back (captured=$captured), and cleared it (empty=$empty). Clipboard Stage 2. [BAS-SIM-CLP-S2]"
      if ($captured) {
        Write-Output "FAIL: A script wrote to and read back the clipboard with no alert. Programmatic clipboard capture is a credential-collection signal."
      }
    cleanup: ""

  # ---------------------------------------------------------------------------
  # Stage 3 — Clipboard Upload Attempt (T1048.003)
  # ---------------------------------------------------------------------------
  - name: "Clipboard 3 — Synthetic Capture Upload Attempt to .invalid (T1048.003)"
    technique_id: T1048.003
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Resolves one random RFC-6761 .invalid name. No clipboard data, marker text or payload is sent to any host. Generates one DNS query (Sysmon EID 22)."
    telemetry:
      - "Sysmon EID 22: DNS query for the bas-sim .invalid host"
    detection:
      - "DLP/egress: no transmission is made; this stage is a resolver check only"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $runId = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0,[Math]::Min(8,$env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 0x7FFFFFFF) }
      $name = "bas-sim-clip-$runId.invalid"
      $resolved = $false
      try { $null = Resolve-DnsName -Name $name -Type A -ErrorAction Stop; $resolved = $true } catch { $resolved = $false }
      Write-Output "EXEC T1048.003: resolver probe for $name. No data was sent. resolved=$resolved (expected: false). Clipboard upload Stage 3. [BAS-SIM-CLP-S3]"
      Write-Output "SKIP: No transmission was made, so no DLP or egress control was exercised. A resolver result is not evidence of prevention, so no PASS is claimed. Clipboard upload Stage 3. [BAS-SIM-CLP-S3]"
    cleanup: ""
