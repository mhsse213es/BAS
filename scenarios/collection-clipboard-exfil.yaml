id: collection-clipboard-exfil
product_line: dlp
name: Clipboard Collection Probe
description: >
  Validation of clipboard data protection, access monitoring and exfiltration prevention. It never collects
  user clipboard data. Clipboard collection is a sensitive technique, so every test is read-only apart from one
  synthetic marker that exists only when the clipboard was empty at the start.
  SECTIONS: clipboard collection and access; monitoring and protection; synthetic capture; history and
  synchronization; Remote Desktop redirection; DLP enforcement; exfiltration prevention.
  VERDICTS: PASS = effective enforcement verified. FAIL = enforcement contradicted. SKIP = not assessable, with a
  state (CONFIGURED, NOT_CONFIGURED, UNVERIFIED, CANNOT_VERIFY, PRECONDITION, USER_CONTENT_PRESENT and others).
  A registry value alone is CONFIGURED and never scores. Missing or unverified integrations are NOT_CONFIGURED
  or UNVERIFIED, never PASS. A DNS result is never proof of prevention.
  INTEGRATIONS (opt-in by environment flag, modular adapters): Defender for Endpoint, Purview Endpoint DLP,
  Trellix DLP, firewall or proxy egress telemetry. This release has no operational probes, so a configured
  integration reports UNVERIFIED.
  SAFETY: no clipboard content is read, stored or sent. No connection is made to any host. No browser,
  session or policy is changed. Windows only.
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - collection
  - clipboard
  - exfiltration
  - dlp
  - t1115
  - t1048
  - mitre
mitre_phases:
  - collection
  - exfiltration

live_policy:
  block_on_domain_controller: true
  require_dc_reachable: false
  max_spray_attempts: 0
  spray_account_allowlist: []
  execution_window: ""

steps:
  - name: "Clipboard 1.1 — Clipboard API available (T1115)"
    technique_id: T1115
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    section: "Clipboard collection and access"
    blast_radius: "Loads the Windows Forms clipboard type. No clipboard content is read or written."
    telemetry:
      - "PowerShell EID 4104"
    detection:
      - "Informational only"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $tag = '[BAS-SIM-CLP]'
      function Out-Verdict([string]$v, [string]$state, [string]$detail) {
        Write-Output ("{0}: state={1} {2} {3}" -f $v, $state, $detail, $tag)
      }
      function Get-PolicyValue([string]$path, [string]$name) {
        try { return (Get-ItemProperty -LiteralPath $path -Name $name -ErrorAction Stop).$name } catch { return $null }
      }
      function Get-AdapterState([string]$flag) {
        # An integration counts only when it is explicitly configured. Configured is not operational:
        # no adapter in this release returns PASS, so a configured adapter reports UNVERIFIED.
        if ([Environment]::GetEnvironmentVariable($flag) -ne '1') { return 'NOT_CONFIGURED' }
        return 'UNVERIFIED'
      }
      Add-Type -AssemblyName System.Windows.Forms

      try { [void][System.Windows.Forms.Clipboard]; Out-Verdict 'SKIP' 'CONFIGURED' 'clipboard API loads; precondition only, no protection claimed' }
      catch { Out-Verdict 'SKIP' 'NOT_CONFIGURED' 'clipboard API did not load' }
    cleanup: ""

