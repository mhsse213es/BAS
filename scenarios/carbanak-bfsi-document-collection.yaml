id: carbanak-bfsi-document-collection
product_line: killchain
name: Carbanak BFSI Financial Document Collection (Item 29)
description: >
  Writes two SYNTHETIC financial-named documents to a run-specific temp
  folder, copies them to a staging folder, and removes both in a finally
  block. No real document is read. [BAS-SIM-CARBANAK-S29] tagged. Grounded in
  MITRE ATT&CK T1005 (Data from Local System).
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - carbanak
  - bfsi
  - exfiltration
  - t1005
mitre_phases:
  - collection

live_policy:
  block_on_domain_controller: false
  require_dc_reachable: false
  max_spray_attempts: 0
  spray_account_allowlist: []
  execution_window: ""

steps:
  - name: "Carbanak Item 29 -- Financial Document Collection (T1005)"
    technique_id: T1005
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: lab-only
    production_safe: true
    risk: low
    blast_radius: "Writes and removes two synthetic files and a run-specific temp folder. No real document is read."
    reversible: true
    telemetry:
      - "Sysmon EID 11 for the synthetic files in the temp staging folder"
    detection:
      - "EDR: collection of financial-named documents into a temp folder by a non-administrative process"
    threat_intel_sources:
      - reference: "MITRE ATT&CK -- T1005"
        url: "https://attack.mitre.org/techniques/T1005/"
    last_reviewed: "2026-11-21"
    family_attribution_confidence: reported
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $work = Join-Path $env:TEMP ('bas_carb_collect_' + [guid]::NewGuid().ToString('N').Substring(0, 8))
      $src = Join-Path $work 'src'
      $stage = Join-Path $work 'stage'
      try {
        New-Item -ItemType Directory -Path $src, $stage -Force | Out-Null
        'Synthetic invoice register - BAS test data, not real.' | Set-Content -Path (Join-Path $src 'invoices_synthetic.txt')
        'Synthetic wire confirmation list - BAS test data, not real.' | Set-Content -Path (Join-Path $src 'wires_synthetic.txt')
        Copy-Item -Path (Join-Path $src '*') -Destination $stage
        $n = @(Get-ChildItem -Path $stage -File).Count
        Write-Output "EXEC 29: collected $n synthetic financial document(s) into a staging folder. [BAS-SIM-CARBANAK-S29]"
      } finally {
        Remove-Item -Path $work -Recurse -Force
      }
      Write-Output "EXEC 29 cleanup: temp folder removed=$(-not (Test-Path -LiteralPath $work))"
    cleanup: ""
