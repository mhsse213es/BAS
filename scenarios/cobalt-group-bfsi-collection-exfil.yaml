id: "cobalt-group-bfsi-collection-exfil"
product_line: killchain
name: "Cobalt Group BFSI - Collection and Exfiltration (P1)"
description: >
  Enterprise collection-and-exfiltration detection validation extending the Cobalt Group BFSI campaign.
  Six scenarios covering local data collection, network share collection, email-client presence checks,
  archive creation, simulated exfiltration-over-C2, and DNS exfiltration probing. All synthetic
  [BAS-SIM] data only; exfiltration destinations use RFC 6761 .invalid hostnames and never leave the
  lab. Each write scenario includes verified cleanup and undo-record rollback.
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - cobalt-group
  - bfsi
  - collection
  - exfiltration
  - p1
  - t1005
  - t1039
  - t1114.001
  - t1560.001
  - t1041
  - t1048.003
mitre_phases:
  - collection
  - exfiltration

steps:

  # -------------------------------------------------------------------------
  - id: coll-01
    name: "Collection/Exfil - Local Data Collection from Test Directories (T1005)"
    technique_id: T1005
    action_key: collection_local_data
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 120
    fidelity: telemetry-safe
    production_safe: false
    risk: medium
    reversible: false
    blast_radius: "Searches a designated test directory for files matching a synthetic bas_sim_* pattern; counts matches only. Never reads contents of any file it did not create itself."
    telemetry:
      - "File search / enumeration patterns"
      - "Process execution: Get-ChildItem recursive search"
    detection:
      - "EDR: bulk file enumeration patterns"
      - "SIEM: anomalous file-access volume"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $script:CgRun = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0, [Math]::Min(8, $env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 2147483647) }
      $script:CgTag = 'bas_sim_coll_' + $script:CgRun
      function Test-CgGate { param([string]$Name) return ([string](Get-Item -Path ('env:' + $Name) -ErrorAction SilentlyContinue).Value -ceq 'true') }
      function Write-CgVerdict { param([string]$Outcome, [string]$Reason, [string]$Id)
      $p = 'SKIP'
      if ($Outcome -eq 'pass') { $p = 'PASS' } elseif ($Outcome -eq 'fail') { $p = 'FAIL' } elseif ($Outcome -eq 'error') { $p = 'ERROR' }
      Write-Output ($p + ': ' + $Reason + ' [BAS-COLL-' + $Id + ']')
      }
      function Complete-CgStep { param($Res, [string]$Id) Write-CgVerdict $Res.Outcome $Res.Reason $Id; exit 0 }
      function Get-CgUndoPath { param([string]$Id) return (Join-Path $env:TEMP ('bas-cg-undo\' + $Id + '.json')) }
      function New-CgUndoRecord { param([string]$Id, $Data)
      $p = Get-CgUndoPath $Id
      New-Item -ItemType Directory -Force -Path (Split-Path -Parent $p) | Out-Null
      $fs = [IO.File]::Open($p, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write)
      try { $b = [Text.Encoding]::ASCII.GetBytes(($Data | ConvertTo-Json -Depth 6 -Compress)); $fs.Write($b, 0, $b.Length) } finally { $fs.Close() }
      }
      function Set-CgUndoRecord { param([string]$Id, $Data)
      [IO.File]::WriteAllText((Get-CgUndoPath $Id), ($Data | ConvertTo-Json -Depth 6 -Compress), [Text.Encoding]::ASCII)
      }
      function Read-CgUndoRecord { param([string]$Id)
      $p = Get-CgUndoPath $Id
      if (-not (Test-Path -LiteralPath $p)) { return $null }
      try { return (Get-Content -LiteralPath $p -Raw | ConvertFrom-Json) } catch { return 'unreadable' }
      }
      function Remove-CgUndoRecord { param([string]$Id) Remove-Item -LiteralPath (Get-CgUndoPath $Id) -Force -ErrorAction SilentlyContinue }
      function Invoke-DnsExfilProbe { param([string]$Subdomain)
      $res = @{ Resolved = $false }
      try { Resolve-DnsName -Name $Subdomain -ErrorAction Stop | Out-Null; $res.Resolved = $true } catch {}
      return $res
      }
      function Get-BfsiSimulatorHost { $h = $env:BFSI_SIMULATOR_HOST; if ($h) { return $h }; return 'localhost' }
      function Get-BfsiSimulatorPort { $p = $env:BFSI_SIMULATOR_PORT; if ($p) { return [int]$p }; return 9999 }
      function Test-BfsiSimulatorConnectivity {
      $simHost = Get-BfsiSimulatorHost
      $port = Get-BfsiSimulatorPort
      try { $tcp = New-Object Net.Sockets.TcpClient; $tcp.Connect($simHost, $port); $tcp.Close(); return $true } catch { return $false }
      }
      function Invoke-LedgerExfilPost { param([string]$Id, [double]$Amount, [string]$Account)
      $simHost = Get-BfsiSimulatorHost
      $port = Get-BfsiSimulatorPort
      $res = @{ Code = 0; Error = '' }
      try {
      $body = @{ id = $Id; amount = $Amount; account = $Account } | ConvertTo-Json -Compress
      $uri = "http://${simHost}:${port}/api/ledger/transactions"
      $r = Invoke-WebRequest -Method POST -Uri $uri -Body $body -ContentType 'application/json' -TimeoutSec 5 -ErrorAction Stop
      $res.Code = [int]$r.StatusCode
      } catch {
      try { $res.Code = [int]$_.Exception.Response.StatusCode } catch {}
      $res.Error = $_.Exception.Message
      }
      return $res
      }
      function Remove-LedgerTransaction { param([string]$Id)
      $simHost = Get-BfsiSimulatorHost
      $port = Get-BfsiSimulatorPort
      try { Invoke-WebRequest -Method DELETE -Uri ("http://${simHost}:${port}/api/ledger/transactions/" + $Id) -TimeoutSec 5 -ErrorAction Stop | Out-Null } catch {}
      }
      $testDir = Join-Path $env:TEMP ('bas_sim_coll01_' + $script:CgRun)
      $undo_data = @{ scenario = 'coll-01'; testDir = $testDir }
      try { New-CgUndoRecord 'coll-01' $undo_data } catch { Complete-CgStep @{ Outcome = 'error'; Reason = 'Undo record creation failed' } 'coll-01' }
      New-Item -ItemType Directory -Force -Path $testDir | Out-Null
      1..3 | ForEach-Object { Set-Content -LiteralPath (Join-Path $testDir "bas_sim_file_$_.txt") -Value 'BAS-SIM synthetic test data' }
      $found = @(Get-ChildItem -Path $testDir -Filter 'bas_sim_*' -File -ErrorAction SilentlyContinue)
      Remove-Item -LiteralPath $testDir -Recurse -Force -ErrorAction SilentlyContinue
      if ($found.Count -eq 3) {
      $res = @{ Outcome = 'fail'; Reason = "Local data collection enumerated $($found.Count) synthetic test files successfully" }
      } else {
      $res = @{ Outcome = 'error'; Reason = "Local data collection found $($found.Count) files, expected 3" }
      }
      Complete-CgStep $res 'COLL-01'
    cleanup: |
      $ErrorActionPreference = 'SilentlyContinue'
      $script:CgRun = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0, [Math]::Min(8, $env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 2147483647) }
      $script:CgTag = 'bas_sim_coll_' + $script:CgRun
      function Test-CgGate { param([string]$Name) return ([string](Get-Item -Path ('env:' + $Name) -ErrorAction SilentlyContinue).Value -ceq 'true') }
      function Write-CgVerdict { param([string]$Outcome, [string]$Reason, [string]$Id)
      $p = 'SKIP'
      if ($Outcome -eq 'pass') { $p = 'PASS' } elseif ($Outcome -eq 'fail') { $p = 'FAIL' } elseif ($Outcome -eq 'error') { $p = 'ERROR' }
      Write-Output ($p + ': ' + $Reason + ' [BAS-COLL-' + $Id + ']')
      }
      function Complete-CgStep { param($Res, [string]$Id) Write-CgVerdict $Res.Outcome $Res.Reason $Id; exit 0 }
      function Get-CgUndoPath { param([string]$Id) return (Join-Path $env:TEMP ('bas-cg-undo\' + $Id + '.json')) }
      function New-CgUndoRecord { param([string]$Id, $Data)
      $p = Get-CgUndoPath $Id
      New-Item -ItemType Directory -Force -Path (Split-Path -Parent $p) | Out-Null
      $fs = [IO.File]::Open($p, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write)
      try { $b = [Text.Encoding]::ASCII.GetBytes(($Data | ConvertTo-Json -Depth 6 -Compress)); $fs.Write($b, 0, $b.Length) } finally { $fs.Close() }
      }
      function Set-CgUndoRecord { param([string]$Id, $Data)
      [IO.File]::WriteAllText((Get-CgUndoPath $Id), ($Data | ConvertTo-Json -Depth 6 -Compress), [Text.Encoding]::ASCII)
      }
      function Read-CgUndoRecord { param([string]$Id)
      $p = Get-CgUndoPath $Id
      if (-not (Test-Path -LiteralPath $p)) { return $null }
      try { return (Get-Content -LiteralPath $p -Raw | ConvertFrom-Json) } catch { return 'unreadable' }
      }
      function Remove-CgUndoRecord { param([string]$Id) Remove-Item -LiteralPath (Get-CgUndoPath $Id) -Force -ErrorAction SilentlyContinue }
      function Invoke-DnsExfilProbe { param([string]$Subdomain)
      $res = @{ Resolved = $false }
      try { Resolve-DnsName -Name $Subdomain -ErrorAction Stop | Out-Null; $res.Resolved = $true } catch {}
      return $res
      }
      function Get-BfsiSimulatorHost { $h = $env:BFSI_SIMULATOR_HOST; if ($h) { return $h }; return 'localhost' }
      function Get-BfsiSimulatorPort { $p = $env:BFSI_SIMULATOR_PORT; if ($p) { return [int]$p }; return 9999 }
      function Test-BfsiSimulatorConnectivity {
      $simHost = Get-BfsiSimulatorHost
      $port = Get-BfsiSimulatorPort
      try { $tcp = New-Object Net.Sockets.TcpClient; $tcp.Connect($simHost, $port); $tcp.Close(); return $true } catch { return $false }
      }
      function Invoke-LedgerExfilPost { param([string]$Id, [double]$Amount, [string]$Account)
      $simHost = Get-BfsiSimulatorHost
      $port = Get-BfsiSimulatorPort
      $res = @{ Code = 0; Error = '' }
      try {
      $body = @{ id = $Id; amount = $Amount; account = $Account } | ConvertTo-Json -Compress
      $uri = "http://${simHost}:${port}/api/ledger/transactions"
      $r = Invoke-WebRequest -Method POST -Uri $uri -Body $body -ContentType 'application/json' -TimeoutSec 5 -ErrorAction Stop
      $res.Code = [int]$r.StatusCode
      } catch {
      try { $res.Code = [int]$_.Exception.Response.StatusCode } catch {}
      $res.Error = $_.Exception.Message
      }
      return $res
      }
      function Remove-LedgerTransaction { param([string]$Id)
      $simHost = Get-BfsiSimulatorHost
      $port = Get-BfsiSimulatorPort
      try { Invoke-WebRequest -Method DELETE -Uri ("http://${simHost}:${port}/api/ledger/transactions/" + $Id) -TimeoutSec 5 -ErrorAction Stop | Out-Null } catch {}
      }
      $rec = Read-CgUndoRecord 'coll-01'
      if ($rec -eq $null -or $rec -eq 'unreadable') { Write-Output 'SKIP: Undo record not found or unreadable'; exit 0 }
      if ($rec.testDir -and (Test-Path -LiteralPath $rec.testDir)) {
      Remove-Item -LiteralPath $rec.testDir -Recurse -Force -ErrorAction SilentlyContinue
      }
      Remove-CgUndoRecord 'coll-01'
      Write-Output 'PASS: Cleanup complete'
      exit 0

