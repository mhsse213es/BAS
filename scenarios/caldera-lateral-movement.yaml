id: caldera-lateral-movement
name: Caldera Lateral Movement Scenario
description: >
  Executes Caldera adversary abilities to test lateral movement controls
  in BFSI environments. When CALDERA_URL is configured, dynamically loads
  ALL abilities from the specified adversary profile — up to the full
  Caldera library (2000+ abilities). Falls back to 5 inline steps if
  Caldera is not reachable.
author: Audspect Research
tags:
  - caldera
  - lateral-movement
  - bfsi
  - smb
  - wmi
  - network
mitre_phases:
  - lateral-movement
  - execution
  - credential-access

# When CALDERA_URL is set, this adversary's full atomic_ordering is fetched
# at run time — no steps are hardcoded. Replace with any adversary_id from
# your Caldera instance (GET /api/v2/adversaries to list all).
# Common built-ins:
#   de07f52d-9928-4071-9142-cb1d3bd851e7  Discovery
#   529a6c5f-89a1-4bf2-88a5-ea7c6e4bfc1c  Enterprise
#   0f4c3c67-845e-49a0-927e-90ed33c044e0  Lateral Movement
caldera_adversary_id: "0f4c3c67-845e-49a0-927e-90ed33c044e0"

# Fallback steps — used only when Caldera is NOT configured (no CALDERA_URL).
steps:
  - name: "Lateral Movement — SMB admin share enumeration"
    technique_id: T1021.002
    framework: caldera
    ability_id: 800b17b4-a45b-476f-b3b0-73b21d7f4cef
    command: |
      net view \\127.0.0.1 2>&1
      net share 2>&1
    executor: psh
    timeout_sec: 30

  - name: "Lateral Movement — Remote service creation via sc.exe"
    technique_id: T1543.003
    framework: caldera
    ability_id: 6469befa-748a-4b9c-aaa8-a5b0bd9b8104
    command: |
      sc.exe query type= all state= all 2>&1 | Select-String -Pattern "RUNNING" | Measure-Object | Select-Object -ExpandProperty Count
    executor: psh
    timeout_sec: 30

  - name: "Execution — WMI remote command execution test"
    technique_id: T1047
    framework: caldera
    ability_id: 0f3e8b98-d1e0-4d5c-9e25-3b0e30123456
    command: |
      $result = Get-WmiObject -Class Win32_OperatingSystem -ComputerName localhost 2>&1
      if ($result) { Write-Output "WMI access to localhost: ALLOWED" }
      else { Write-Output "WMI access to localhost: BLOCKED" }
    executor: psh
    timeout_sec: 30

  - name: "Lateral Movement — Pass-the-hash detection (NTLM over network)"
    technique_id: T1550.002
    framework: caldera
    ability_id: c3d03db3-e491-4b07-8e93-4c6c6b3cbcfe
    command: |
      $val = (Get-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Lsa" -Name "RestrictNTLM" -ErrorAction SilentlyContinue).RestrictNTLM
      if ($val -ge 2) { Write-Output "NTLM outbound restricted — PtH lateral movement blocked" }
      else { Write-Output "NTLM outbound NOT restricted — PtH lateral movement possible (RestrictNTLM=$val)" }
    executor: psh
    timeout_sec: 15

  - name: "Credential Access — LSASS memory access via task manager simulation"
    technique_id: T1003.001
    framework: caldera
    ability_id: 4d9b079c-9ede-4116-8b14-72ad3a5533af
    command: |
      $lsass = Get-Process -Name lsass -ErrorAction SilentlyContinue
      if ($lsass) {
        try {
          $handle = [System.Diagnostics.Process]::GetProcessById($lsass.Id)
          Write-Output "LSASS process accessible (PID $($lsass.Id)) — PPL may not be active"
        } catch {
          Write-Output "LSASS access denied — RunAsPPL is protecting the process"
        }
      }
    executor: psh
    timeout_sec: 15
