      $dir = Join-Path $env:TEMP ('bas-ir-ev-' + $script:CgRun)
      New-CgUndoRecord 'ir-06' @{ scenario = 'ir-06'; dir = $dir }
      New-Item -ItemType Directory -Force -Path $dir | Out-Null
      $out = Join-Path $dir 'security-export.evtx'
