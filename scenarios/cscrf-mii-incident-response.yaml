id: "cscrf-mii-incident-response"
product_line: common
name: "CSCRF-MII Incident Detection, Containment and Evidence Checks (P1)"
description: >
  Internal control-validation checks for incident response. Verdicts are internal control references
  (CSCRF-IR-*), not SEBI clause identifiers. Read-only checks run anywhere. The malware-detection check uses
  the standard EICAR test string (harmless) and the account-disablement check uses a synthetic account; both
  require BAS_CONFIRM_IR_TEST=true and clean up in undo. Deferred until an EDR, SOC or SOAR is named:
  suspicious-process containment, endpoint isolation and alert escalation. A PASS shows a control is
  configured or works in isolation; it does not show the SOC responded.
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - cscrf-mii
  - incident-response
  - p1
mitre_phases:
  - execution
  - impact

steps:

  # -------------------------------------------------------------------------
  - id: ir-01
    name: "Malware Detection with EICAR Test File (T1204.002, internal ref CSCRF-IR-01)"
    technique_id: T1204.002
    action_key: cscrf_ir_malware_detect
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 90
    fidelity: telemetry-safe
    production_safe: false
    risk: low
    reversible: true
    blast_radius: "Writes the standard EICAR test string to a per-run temp folder and checks whether endpoint protection removes or flags it. The folder is deleted in undo. Runs only with BAS_CONFIRM_IR_TEST=true."
    telemetry:
      - "File creation in temp"
      - "Endpoint detection"
    detection:
      - "EICAR detection event"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $script:CgRun = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0, [Math]::Min(8, $env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 2147483647) }
      function Write-CgVerdict { param([string]$Outcome, [string]$Reason, [string]$Id)
      $p = 'SKIP'
      if ($Outcome -eq 'pass') { $p = 'PASS' } elseif ($Outcome -eq 'fail') { $p = 'FAIL' } elseif ($Outcome -eq 'error') { $p = 'ERROR' }
      Write-Output ($p + ': ' + $Reason + ' [BAS-IR-' + $Id + ']')
      }
      function Complete-CgStep { param($Res, [string]$Id) Write-CgVerdict $Res.Outcome $Res.Reason $Id; exit 0 }
      function Test-CgIrGate { return ($env:BAS_CONFIRM_IR_TEST -eq 'true') }
      function Get-CgUndoPath { param([string]$Id) return (Join-Path $env:TEMP ('bas-cg-undo\' + $Id + '.json')) }
      function New-CgUndoRecord { param([string]$Id, $Data)
      $p = Get-CgUndoPath $Id
      New-Item -ItemType Directory -Force -Path (Split-Path -Parent $p) | Out-Null
      $fs = [IO.File]::Open($p, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write)
      try { $b = [Text.Encoding]::ASCII.GetBytes(($Data | ConvertTo-Json -Depth 6 -Compress)); $fs.Write($b, 0, $b.Length) } finally { $fs.Close() }
      }
      function Read-CgUndoRecord { param([string]$Id)
      $p = Get-CgUndoPath $Id
      if (-not (Test-Path -LiteralPath $p)) { return $null }
      try { return (Get-Content -LiteralPath $p -Raw | ConvertFrom-Json) } catch { return 'unreadable' }
      }
      function Remove-CgUndoRecord { param([string]$Id) Remove-Item -LiteralPath (Get-CgUndoPath $Id) -Force -ErrorAction SilentlyContinue }
      if (-not (Test-CgIrGate)) { Complete-CgStep @{ Outcome = 'skip'; Reason = 'BAS_CONFIRM_IR_TEST not true; no test file written [CSCRF-IR-01]' } 'ir-01' }
      $dir = Join-Path $env:TEMP ('bas-ir-' + $script:CgRun)
      New-CgUndoRecord 'ir-01' @{ scenario = 'ir-01'; dir = $dir }
      New-Item -ItemType Directory -Force -Path $dir | Out-Null
      $f = Join-Path $dir 'eicar-test.txt'
      $eicar = 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*'
      Set-Content -LiteralPath $f -Value $eicar -NoNewline -Encoding ASCII
      Start-Sleep -Seconds 10
      if (-not (Test-Path -LiteralPath $f)) { Complete-CgStep @{ Outcome = 'pass'; Reason = 'EICAR test file was removed by endpoint protection [CSCRF-IR-01]' } 'ir-01' }
      $st = Get-MpComputerStatus -ErrorAction SilentlyContinue
      if ($st -and -not $st.RealTimeProtectionEnabled) { Complete-CgStep @{ Outcome = 'fail'; Reason = 'EICAR test file was not removed; real-time protection is off [CSCRF-IR-01]' } 'ir-01' }
      Complete-CgStep @{ Outcome = 'fail'; Reason = 'EICAR test file was not removed although real-time protection reports on [CSCRF-IR-01]' } 'ir-01'
    cleanup: |
      $ErrorActionPreference = 'SilentlyContinue'
      $script:CgRun = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0, [Math]::Min(8, $env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 2147483647) }
      function Write-CgVerdict { param([string]$Outcome, [string]$Reason, [string]$Id)
      $p = 'SKIP'
      if ($Outcome -eq 'pass') { $p = 'PASS' } elseif ($Outcome -eq 'fail') { $p = 'FAIL' } elseif ($Outcome -eq 'error') { $p = 'ERROR' }
      Write-Output ($p + ': ' + $Reason + ' [BAS-IR-' + $Id + ']')
      }
      function Complete-CgStep { param($Res, [string]$Id) Write-CgVerdict $Res.Outcome $Res.Reason $Id; exit 0 }
      function Test-CgIrGate { return ($env:BAS_CONFIRM_IR_TEST -eq 'true') }
      function Get-CgUndoPath { param([string]$Id) return (Join-Path $env:TEMP ('bas-cg-undo\' + $Id + '.json')) }
      function New-CgUndoRecord { param([string]$Id, $Data)
      $p = Get-CgUndoPath $Id
      New-Item -ItemType Directory -Force -Path (Split-Path -Parent $p) | Out-Null
      $fs = [IO.File]::Open($p, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write)
      try { $b = [Text.Encoding]::ASCII.GetBytes(($Data | ConvertTo-Json -Depth 6 -Compress)); $fs.Write($b, 0, $b.Length) } finally { $fs.Close() }
      }
      function Read-CgUndoRecord { param([string]$Id)
      $p = Get-CgUndoPath $Id
      if (-not (Test-Path -LiteralPath $p)) { return $null }
      try { return (Get-Content -LiteralPath $p -Raw | ConvertFrom-Json) } catch { return 'unreadable' }
      }
      function Remove-CgUndoRecord { param([string]$Id) Remove-Item -LiteralPath (Get-CgUndoPath $Id) -Force -ErrorAction SilentlyContinue }
      $rec = Read-CgUndoRecord 'ir-01'
      if ($rec -eq $null -or $rec -eq 'unreadable') { Write-Output 'PASS: Cleanup complete (no record)'; exit 0 }
      Remove-Item -LiteralPath $rec.dir -Recurse -Force -ErrorAction SilentlyContinue
      if (Test-Path -LiteralPath $rec.dir) { Write-Output "FAIL: residue folder $($rec.dir) survived undo"; exit 0 }
      Remove-CgUndoRecord 'ir-01'
      Write-Output 'PASS: Cleanup complete'
      exit 0

