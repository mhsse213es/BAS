      function Invoke-AppCtlExeAt {
      param([string]$Dir, [string]$Name, [switch]$MarkOfTheWeb)
      New-Item -ItemType Directory -Path $Dir -Force | Out-Null
      $exe = Join-Path $Dir $Name
