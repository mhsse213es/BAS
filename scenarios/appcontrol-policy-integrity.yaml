      $script:AppCtlExtra = @()
      foreach ($o in $out) { if ($o -is [hashtable]) { $res = $o } else { $script:AppCtlExtra += [string]$o } }
      if (-not $res) { $res = @{ Ran = $false; Exit = -1; Note = 'attempt_returned_no_result'; NotApplicable = '' } }
      return $res
      }
      function Get-AppCtlAceSid {
      param($Ace)
