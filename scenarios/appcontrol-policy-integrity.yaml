      foreach ($q in $sql) { $v = $db.OpenView($q); $v.Execute(); $v.Close() }
      $si = $db.SummaryInformation(20)
      $si.Property(2) = 'BAS SIM'
      $si.Property(4) = 'BAS SIM'
      $si.Property(7) = 'Intel;1033'
      $si.Property(9) = ('{' + [guid]::NewGuid().ToString().ToUpper() + '}')
      $si.Property(14) = 200
      $si.Property(15) = 2
      $si.Persist()
      $db.Commit()
