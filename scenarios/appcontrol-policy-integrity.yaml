      if ($MarkOfTheWeb) { try { Set-Content -Path "$exe`:Zone.Identifier" -Value "[ZoneTransfer]`r`nZoneId=3" -ErrorAction Stop } catch {} }
      $mk = Join-Path $Dir "$Name.marker.txt"
      $p = Invoke-AppCtlProc -File $exe -ArgLine "`"$mk`"" -NoShell
