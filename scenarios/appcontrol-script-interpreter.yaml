    requires_priv: user
    timeout_sec: 90
    fidelity: telemetry-safe
    production_safe: false
    risk: medium
    reversible: true
    blast_radius: "Writes a benign .bat that writes one marker file and runs it through cmd.exe /c. Files are in a private temp directory deleted by the step."
    telemetry:
      - "AppLocker MSI and Script event 8007 naming the file, if AppLocker Script rules enforced"
      - "Sysmon EID 1: cmd.exe /c with a user-writable .bat"
    detection:
