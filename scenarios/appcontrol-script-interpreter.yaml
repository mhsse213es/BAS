      $script:AppCtlMarker = "BAS-SIM-APPCTL-$($script:AppCtlTid)"
      $script:AppCtlWork = Join-Path $env:TEMP "bas-appctl-$($script:AppCtlTid)"
      function Get-AppCtlState {
