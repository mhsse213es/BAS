      $map = @{ 0 = 'NotConfigured'; 1 = 'AuditOnly'; 2 = 'Enabled' }
      $u = [int]@($dg)[0].UsermodeCodeIntegrityPolicyEnforcementStatus
      $k = [int]@($dg)[0].CodeIntegrityPolicyEnforcementStatus
      $st.WdReadable = $true
