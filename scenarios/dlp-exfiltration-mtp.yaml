id: dlp-exfiltration-mtp
name: DLP Exfiltration Validation — Mobile Device Over MTP (Media Transfer Protocol)
description: >
  Copies the synthetic multi-type sensitive record from this endpoint to a phone
  or other MTP device connected over USB, using the Windows Shell namespace that
  Explorer uses for MTP devices. MTP is how most phones expose storage to a PC,
  so it is a common route for file exfiltration that does not look like a disk.

  The device is operator-supplied:

    BAS_DLP_MTP_DEVICE_NAME   the name Explorer shows for the connected device (for example "Pixel 8")

  If the variable is not set, or no device with that name is listed, the step
  records no observation and grades Untested.

  Shell copies to MTP devices are asynchronous, and Windows does not say why a
  transfer did not complete. So this step never records a block. A file that
  appears on the device within the wait is recorded as succeeded. A file that
  does not is recorded as unknown. That distinction is the honest limit of
  this channel, not a weakness to fix by guessing.

  Cleanup gap: if the file reaches the device and cannot be deleted through the
  Shell, the scenario reports it as left on the device. It does not claim it was
  removed.

  Evidence level: L1. No sink is involved. Device restriction policies for MTP
  and mobile DLP agents are not tested here, and DLP-MOB remains unbuilt
  (see QA item 3).

  Safety: all synthetic data is fabricated and tagged [BAS-SIM-DLP]. Only one
  file is copied, named with the run identifier. Windows only.
author: Audspect Research
executable: true
supported_os: [windows]
tags:
  - dlp
  - data-protection-validation
  - exfiltration
  - mtp
  - mobile
  - windows
  - mitre-attack
mitre_phases:
  - collection
  - exfiltration

steps:
  - name: "DLP Validation — Copy to Connected Phone Over MTP (T1052)"
    technique_id: T1052
    detection_profiles:
      - windows_dlp_exfiltration
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 90
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    blast_radius: "Copies one small synthetic CSV to an operator-connected MTP device through the Windows Shell, waits up to 20 seconds, and tries to remove it. Nothing is copied if BAS_DLP_MTP_DEVICE_NAME is not set or no matching device is listed."
    reversible: true
    telemetry:
      - "Windows Shell/MTP activity: file copy to a portable device"
      - "Windows PnP event: MTP device connection"
    detection:
      - "Device control/mobile DLP: regulated data copied to a connected phone over MTP"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $deviceName = $env:BAS_DLP_MTP_DEVICE_NAME
      if (-not $deviceName) {
        Write-Output "SKIP: BAS_DLP_MTP_DEVICE_NAME is not set on this agent -- MTP validation requires an operator-connected device."
      } else {
        $shell = New-Object -ComObject Shell.Application
        $computer = $shell.NameSpace(17)
        $device = $computer.Items() | Where-Object { $_.Name -eq $deviceName } | Select-Object -First 1
        if (-not $device) {
          Write-Output "SKIP: no MTP device named '$deviceName' is listed under This PC."
        } else {
          $target = $device.GetFolder
          $csvContent = "[BAS-SIM-DLP] CustomerID,PAN,Aadhaar,SWIFT,UPI,CreditCard`nBAS-SIM-SINK,ABCDE1234F,123456789012,SBININBBXXX,fake.user@upi,4111111111111111"
          $fileName = "bas_sim_mtp_" + [guid]::NewGuid().ToString('N') + ".csv"
          $srcFile = Join-Path $env:TEMP $fileName
          Set-Content -Path $srcFile -Value $csvContent -Encoding utf8
          if ($env:BAS_TASK_ID) { Write-Output "DLP_EVENT_START: $env:BAS_TASK_ID $((Get-Date).ToUniversalTime().ToString('o'))" }
          if ($target) { $target.CopyHere($srcFile, 20) }
          $appeared = $false
          for ($i = 0; $i -lt 20 -and -not $appeared; $i++) {
            Start-Sleep -Seconds 1
            if ($target -and ($target.Items() | Where-Object { $_.Name -eq $fileName })) { $appeared = $true }
          }
          if ($appeared) {
            Write-Output "EXEC T1052: sensitive record file copied to the connected MTP device unimpeded. [BAS-SIM-DLP-MTP]"
            Write-Output "DLP_OBSERVATION: OperationSucceeded"
            $copied = $target.Items() | Where-Object { $_.Name -eq $fileName } | Select-Object -First 1
            if ($copied) { $copied.InvokeVerb('delete') }
            Start-Sleep -Seconds 2
            if ($target.Items() | Where-Object { $_.Name -eq $fileName }) {
              Write-Output "CLEANUP GAP: $fileName is still on the MTP device and could not be deleted through the Shell."
            }
          } else {
            Write-Output "EXEC T1052: no file appeared on the MTP device within 20 seconds. Cause is not known from the Shell. [BAS-SIM-DLP-MTP]"
            Write-Output "DLP_OBSERVATION: OperationUnknown"
          }
          Remove-Item -LiteralPath $srcFile -Force -ErrorAction SilentlyContinue
        }
      }
    cleanup: ""
