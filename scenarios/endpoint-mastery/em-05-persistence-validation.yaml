id: em-05-persistence-validation
product_line: av
name: "Endpoint Mastery 05 — Persistence Mechanism Validation"
description: >
  ENDPOINT MASTERY — Layer 5. Assesses whether unauthorized persistence can be established on a
  Windows endpoint and whether controls prevent or detect it. Covers registry Run and RunOnce keys,
  Startup folders, Windows services, scheduled tasks, WMI permanent event subscriptions, Winlogon,
  AppInit_DLLs, Image File Execution Options, boot execution, autorun policy and detection telemetry.
  VERDICTS: PASS = the write was blocked, or it succeeded and was detected. FAIL = the write succeeded
  and was not detected, or a configuration is unsafe. SKIP = not applicable or not assessable here,
  with a reason; SKIP is not scored. ERROR = the check could not complete, or cleanup failed.
  WRITE PROBES: disabled unless BAS_EM05_ALLOW_WRITE_PROBES=1 is set on an isolated lab host.
  Each probe creates one uniquely named synthetic item, checks for telemetry, removes it, and verifies
  removal. Synthetic values never launch: they run cmd.exe /c exit 0, point at a missing binary, or sit
  on a task scheduled in the future. Files are .txt and not executable.
  READ-ONLY: inventory, ACL and configuration checks. Nothing is launched and no value is read beyond
  its presence or configured state.
author: Audspect Research
executable: true
supported_os: [windows]
tags:
  - endpoint-mastery
  - em-layer-5
  - persistence
  - autorun
mitre_phases:
  - persistence
live_policy:
  block_on_domain_controller: true
  require_dc_reachable: false

steps:
  - name: "Registry Run Key Modification attempt (HKCU)"
    technique_id: T1547.001
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: synthetic-gated
    production_safe: false
    risk: medium
    reversible: true
    blast_radius: "Writes one synthetic value to HKCU Run and removes it; verifies removal."
    telemetry:
      - "Synthetic write (gated) or read-only evaluation; EDR and Sysmon see the operation"
    detection:
      - "Sysmon, Security, System or WMI-Activity events for the synthetic item, where the source is enabled"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      if ($env:BAS_EM05_ALLOW_WRITE_PROBES -ne '1') { Write-Output 'SKIP: write probe disabled; set BAS_EM05_ALLOW_WRITE_PROBES=1 on an isolated lab host to run.'; return }
      function Find-Ev([string]$log, [int[]]$ids, [string]$needle, [datetime]$since) {
        try { return @(Get-WinEvent -FilterHashtable @{LogName=$log; Id=$ids; StartTime=$since} -ErrorAction Stop | Where-Object { $_.Message -like "*$needle*" }).Count }
        catch { if ($_.Exception.Message -match 'No events') { return 0 } else { return -1 } }
      }
      $sfx = [guid]::NewGuid().ToString('N').Substring(0, 10); $n = 'AudspectEM05_' + $sfx
      $p = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
      $since = Get-Date
      $wrote = $false; $werr = ''
      try { New-ItemProperty -Path $p -Name $n -Value 'cmd.exe /c exit 0' -PropertyType String -ErrorAction Stop | Out-Null; $wrote = $true } catch { $werr = $_.Exception.Message }
      Start-Sleep -Seconds 4
      $d = Find-Ev 'Microsoft-Windows-Sysmon/Operational' @(13) $n $since
      $cleanOk = $true
      if ($wrote) {
        try { Remove-ItemProperty -Path $p -Name $n -ErrorAction Stop } catch { $cleanOk = $false }
        if (Get-ItemProperty -Path $p -Name $n -ErrorAction SilentlyContinue) { $cleanOk = $false }
      }
      $tail = if ($cleanOk) { 'Cleanup verified.' } else { "CLEANUP FAILED: remove $p\$n manually; the value is an executable autorun." }
      if (-not $wrote) { if ($werr -match 'denied|access|unauthori|privilege|0x80070005|0x80041003') { Write-Output "PASS: write to $p was blocked ($werr). $tail" } else { Write-Output "ERROR: write to $p could not be tested ($werr). $tail" } }
      elseif ($d -gt 0) { Write-Output "PASS: write to $p succeeded but was detected ($d Sysmon EID 13 event(s) for the synthetic value). $tail" }
      elseif ($d -lt 0) { Write-Output "FAIL: write to $p succeeded and no detection telemetry source was readable (Sysmon not present).  $tail" }
      else { Write-Output "FAIL: write to $p succeeded and no detection event was recorded. $tail" }
    cleanup: ""

