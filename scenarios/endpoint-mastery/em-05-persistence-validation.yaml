  - name: "Permanent subscription write probe (never-firing filter, event-log consumer)"
    technique_id: T1546.003
    framework: custom
    executor: powershell
    requires_priv: admin
    timeout_sec: 60
    fidelity: synthetic-gated
    production_safe: false
    risk: medium
    reversible: true
    blast_radius: "Creates a filter that never fires, an event-log consumer and a binding, then removes all three; verifies removal."
    telemetry:
      - "Synthetic write (gated) or read-only evaluation; EDR and Sysmon see the operation"
    detection:
      - "Sysmon, Security, System or WMI-Activity events for the synthetic item, where the source is enabled"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      if ($env:BAS_EM05_ALLOW_WRITE_PROBES -ne '1') { Write-Output 'SKIP: write probe disabled; set BAS_EM05_ALLOW_WRITE_PROBES=1 on an isolated lab host to run.'; return }
      $id = [Security.Principal.WindowsIdentity]::GetCurrent()
      if (-not (New-Object Security.Principal.WindowsPrincipal $id).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { Write-Output 'SKIP: requires an elevated context.'; return }
      function Find-Ev([string]$log, [int[]]$ids, [string]$needle, [datetime]$since) {
        try { return @(Get-WinEvent -FilterHashtable @{LogName=$log; Id=$ids; StartTime=$since} -ErrorAction Stop | Where-Object { $_.Message -like "*$needle*" }).Count }
        catch { if ($_.Exception.Message -match 'No events') { return 0 } else { return -1 } }
      }
      $sfx = [guid]::NewGuid().ToString('N').Substring(0, 10); $n = 'AudspectEM05_' + $sfx
      $ns = 'root\subscription'
      $fn = 'AudspectEM05F_' + $sfx; $cn = 'AudspectEM05C_' + $sfx
      $since = Get-Date
      $made = $false; $werr = ''
      try {
        $flt = Set-WmiInstance -Namespace $ns -Class __EventFilter -Arguments @{Name=$fn; EventNamespace='root\cimv2'; QueryLanguage='WQL'; Query="SELECT * FROM __InstanceCreationEvent WITHIN 10 WHERE TargetInstance ISA 'Audspect_EM05_NeverExists'"} -ErrorAction Stop
        $con = Set-WmiInstance -Namespace $ns -Class NTEventLogEventConsumer -Arguments @{Name=$cn; SourceName='Application'; EventID=1; EventType=4} -ErrorAction Stop
        $null = Set-WmiInstance -Namespace $ns -Class __FilterToConsumerBinding -Arguments @{Filter=('__EventFilter.Name="' + $fn + '"'); Consumer=('NTEventLogEventConsumer.Name="' + $cn + '"')} -ErrorAction Stop
        $made = $true
      } catch { $werr = $_.Exception.Message }
      Start-Sleep -Seconds 4
      $d = Find-Ev 'Microsoft-Windows-WMI-Activity/Operational' @(5861) $fn $since
      $cleanOk = $true
      Get-WmiObject -Namespace $ns -Class __FilterToConsumerBinding -ErrorAction SilentlyContinue | Where-Object { "$($_.Filter)" -match [regex]::Escape($fn) } | ForEach-Object { $_.Delete() }
      Get-WmiObject -Namespace $ns -Class NTEventLogEventConsumer -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq $cn } | ForEach-Object { $_.Delete() }
      Get-WmiObject -Namespace $ns -Class __EventFilter -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq $fn } | ForEach-Object { $_.Delete() }
      if (Get-WmiObject -Namespace $ns -Class __EventFilter -Filter "Name='$fn'" -ErrorAction SilentlyContinue) { $cleanOk = $false }
      if (Get-WmiObject -Namespace $ns -Class NTEventLogEventConsumer -Filter "Name='$cn'" -ErrorAction SilentlyContinue) { $cleanOk = $false }
      $tail = if ($cleanOk) { 'Cleanup verified.' } else { "CLEANUP FAILED: remove WMI objects $fn and $cn from root\subscription manually." }
      if (-not $made) { if ($werr -match 'denied|access|unauthori|privilege|0x80070005|0x80041003') { Write-Output "PASS: permanent subscription creation was blocked ($werr). $tail" } else { Write-Output "ERROR: permanent subscription could not be created ($werr). $tail" } }
      elseif ($d -gt 0) { Write-Output "PASS: permanent subscription created and recorded ($d WMI-Activity EID 5861 event(s)). $tail" }
      elseif ($d -lt 0) { Write-Output "FAIL: subscription created and the WMI-Activity log was not readable. $tail" }
      else { Write-Output "FAIL: subscription created and no WMI-Activity EID 5861 event was recorded. $tail" }
    cleanup: ""

