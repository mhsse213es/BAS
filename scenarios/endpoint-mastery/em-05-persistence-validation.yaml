  - name: "HKLM Run key ACL denies write to standard users"
    technique_id: T1547.001
    framework: custom
    executor: powershell
    requires_priv: admin
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Reads the ACL of HKLM Run. Read-only."
    telemetry:
      - "Synthetic write (gated) or read-only evaluation; EDR and Sysmon see the operation"
    detection:
      - "Sysmon, Security, System or WMI-Activity events for the synthetic item, where the source is enabled"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $id = [Security.Principal.WindowsIdentity]::GetCurrent()
      if (-not (New-Object Security.Principal.WindowsPrincipal $id).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { Write-Output 'SKIP: requires an elevated context.'; return }
      try { $acl = Get-Acl -Path 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction Stop } catch { Write-Output "SKIP: the HKLM Run ACL cannot be read ($($_.Exception.Message))."; return }
      $bad = @($acl.Access | Where-Object { "$($_.IdentityReference)" -match 'Users|Everyone|Authenticated Users' -and $_.AccessControlType -eq 'Allow' -and "$($_.RegistryRights)" -match 'SetValue|FullControl|WriteKey|CreateSubKey' } | ForEach-Object { "$($_.IdentityReference)" } | Select-Object -Unique)
      if ($bad.Count -eq 0) { Write-Output 'PASS: standard users cannot write to HKLM Run.' } else { Write-Output "FAIL: standard principals can write to HKLM Run: $($bad -join ', ')." }
    cleanup: ""

