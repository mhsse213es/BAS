      $bad = @($acl.Access | Where-Object { "$($_.IdentityReference)" -match 'Everyone|Authenticated Users' -and $_.AccessControlType -eq 'Allow' -and "$($_.RegistryRights)" -match 'SetValue|FullControl|WriteKey' } | ForEach-Object { "$($_.IdentityReference)" } | Select-Object -Unique)
      if ($bad.Count -eq 0) { Write-Output 'PASS: the HKCU Run ACL grants no write to Everyone or Authenticated Users.' } else { Write-Output "FAIL: the HKCU Run ACL grants write to: $($bad -join ', ')." }
    cleanup: ""

  - name: "Run and RunOnce entries do not point at user-writable locations"
    technique_id: T1547.001
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Reads Run and RunOnce values and checks target folders. Read-only; values are compared, not executed."
    telemetry:
      - "Synthetic write (gated) or read-only evaluation; EDR and Sysmon see the operation"
    detection:
      - "Sysmon, Security, System or WMI-Activity events for the synthetic item, where the source is enabled"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $keys = @('HKCU:\Software\Microsoft\Windows\CurrentVersion\Run','HKCU:\Software\Microsoft\Windows\CurrentVersion\RunOnce','HKLM:\Software\Microsoft\Windows\CurrentVersion\Run','HKLM:\Software\Microsoft\Windows\CurrentVersion\RunOnce')
      $hits = @()
      foreach ($k in $keys) {
        $item = Get-Item -Path $k -ErrorAction SilentlyContinue
        if (-not $item) { continue }
        foreach ($n in $item.Property) {
          $v = "$((Get-ItemProperty -Path $k -Name $n).$n)"
          if ($v -match '(?i)\\Users\\|\\Temp\\|\\AppData\\') { $hits += "$k\$n" }
        }
      }
      if ($hits.Count -eq 0) { Write-Output 'PASS: no Run or RunOnce entry targets a user-writable folder (Users, Temp, AppData).' }
      else { Write-Output "FAIL: $($hits.Count) Run or RunOnce entr$(if ($hits.Count -eq 1) {'y'} else {'ies'}) target user-writable folders: $($hits -join '; ')." }
    cleanup: ""

  - name: "Run key modification is audited (registry SACL present)"
    technique_id: T1547.001
    framework: custom
    executor: powershell
    requires_priv: admin
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Reads the audit rules (SACL) of HKLM Run. Read-only."
    telemetry:
      - "Synthetic write (gated) or read-only evaluation; EDR and Sysmon see the operation"
    detection:
      - "Sysmon, Security, System or WMI-Activity events for the synthetic item, where the source is enabled"
    command: |
      $id = [Security.Principal.WindowsIdentity]::GetCurrent()
      if (-not (New-Object Security.Principal.WindowsPrincipal $id).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { Write-Output 'SKIP: requires an elevated context.'; return }
      try { $acl = Get-Acl -Path 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run' -Audit -ErrorAction Stop } catch { Write-Output "SKIP: the HKLM Run audit rules cannot be read ($($_.Exception.Message))."; return }
      $n = @($acl.Audit | Where-Object { $_.AuditFlags -match 'Success' }).Count
      if ($n -gt 0) { Write-Output "PASS: HKLM Run has $n success audit rule(s)." } else { Write-Output 'FAIL: HKLM Run has no success audit rule; modifications are not audited at the registry level.' }
    cleanup: ""

  - name: "User Startup Folder File Drop"
    technique_id: T1547.001
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: synthetic-gated
    production_safe: false
    risk: medium
    reversible: true
    blast_radius: "Creates one synthetic .txt file in the user Startup folder and removes it; verifies removal. Not executable."
    telemetry:
      - "Synthetic write (gated) or read-only evaluation; EDR and Sysmon see the operation"
    detection:
      - "Sysmon, Security, System or WMI-Activity events for the synthetic item, where the source is enabled"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      if ($env:BAS_EM05_ALLOW_WRITE_PROBES -ne '1') { Write-Output 'SKIP: write probe disabled; set BAS_EM05_ALLOW_WRITE_PROBES=1 on an isolated lab host to run.'; return }
      function Find-Ev([string]$log, [int[]]$ids, [string]$needle, [datetime]$since) {
        try { return @(Get-WinEvent -FilterHashtable @{LogName=$log; Id=$ids; StartTime=$since} -ErrorAction Stop | Where-Object { $_.Message -like "*$needle*" }).Count }
        catch { if ($_.Exception.Message -match 'No events') { return 0 } else { return -1 } }
      }
      $sfx = [guid]::NewGuid().ToString('N').Substring(0, 10); $n = 'AudspectEM05_' + $sfx
      $dir = [Environment]::GetFolderPath('Startup')
      $f = Join-Path $dir ($n + '.txt')
      $since = Get-Date
      $wrote = $false; $werr = ''
      try { [IO.File]::WriteAllText($f, 'Synthetic BAS marker; not executable.'); $wrote = $true } catch { $werr = $_.Exception.Message }
      Start-Sleep -Seconds 4
      $d = Find-Ev 'Microsoft-Windows-Sysmon/Operational' @(11) $n $since
      $cleanOk = $true
      if ($wrote) {
        try { Remove-Item -LiteralPath $f -Force -ErrorAction Stop } catch { $cleanOk = $false }
        if (Test-Path -LiteralPath $f) { $cleanOk = $false }
      }
      $tail = if ($cleanOk) { 'Cleanup verified.' } else { "CLEANUP FAILED: remove $f manually." }
      if (-not $wrote) { if ($werr -match 'denied|access|unauthori|privilege|0x80070005|0x80041003') { Write-Output "PASS: file creation in the user Startup folder was blocked ($werr). $tail" } else { Write-Output "ERROR: file creation in the user Startup folder could not be tested ($werr). $tail" } }
      elseif ($d -gt 0) { Write-Output "PASS: file created in the user Startup folder was detected ($d Sysmon EID 11 event(s)). $tail" }
      elseif ($d -lt 0) { Write-Output "FAIL: file created in the user Startup folder and no detection telemetry source was readable (Sysmon not present). $tail" }
      else { Write-Output "FAIL: file created in the user Startup folder and no detection event was recorded. $tail" }
    cleanup: ""

