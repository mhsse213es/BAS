  - name: "Sysmon configuration records registry value sets on Run keys"
    technique_id: T1547.001
    framework: custom
    executor: powershell
    requires_priv: admin
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Reads the installed Sysmon configuration for registry rules. Read-only."
    telemetry:
      - "Synthetic write (gated) or read-only evaluation; EDR and Sysmon see the operation"
    detection:
      - "Sysmon, Security, System or WMI-Activity events for the synthetic item, where the source is enabled"
    command: |
      $id = [Security.Principal.WindowsIdentity]::GetCurrent()
      if (-not (New-Object Security.Principal.WindowsPrincipal $id).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { Write-Output 'SKIP: requires an elevated context.'; return }
      $svc = Get-CimInstance Win32_Service -Filter "Name='Sysmon64' OR Name='Sysmon'" | Select-Object -First 1
      if (-not $svc) { Write-Output 'SKIP: Sysmon is not installed.'; return }
      $exe = "$($svc.PathName)" -replace '^"?([^"]+?\.exe).*$', '$1'
      $cfg = (& $exe -c 2>$null) | Out-String
      if (-not $cfg) { Write-Output 'SKIP: the Sysmon configuration cannot be dumped from this context.'; return }
      if ($cfg -match '(?i)CurrentVersion\\Run') { Write-Output 'PASS: the Sysmon configuration covers the CurrentVersion\Run registry keys.' }
      else { Write-Output 'FAIL: the Sysmon configuration does not cover CurrentVersion\Run; Run-key writes may not be recorded.' }
    cleanup: ""

