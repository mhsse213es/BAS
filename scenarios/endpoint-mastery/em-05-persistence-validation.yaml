  - name: "Logon script inventory"
    technique_id: T1037.001
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Lists logon script entries for the user and the machine (paths only). Read-only."
    telemetry:
      - "Synthetic write (gated) or read-only evaluation; EDR and Sysmon see the operation"
    detection:
      - "Sysmon, Security, System or WMI-Activity events for the synthetic item, where the source is enabled"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $u = (Get-ItemProperty -Path 'HKCU:\Environment' -Name UserInitMprLogonScript).UserInitMprLogonScript
      $m = @(Get-ChildItem -Path 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Group Policy\Scripts\Logon' -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -eq 'Script' } | ForEach-Object { (Get-ItemProperty -LiteralPath $_.PSPath -Name Script).Script })
      $found = @(); if ($u) { $found += "user:$u" }; $found += @($m | ForEach-Object { "machine:$_" })
      if ($found.Count -eq 0) { Write-Output 'PASS: no user or machine logon script is configured.' }
      else { Write-Output "FAIL: $($found.Count) logon script(s) configured; review: $($found -join '; ')." }
    cleanup: ""

  - name: "AutoAdminLogon does not keep a stored password"
    technique_id: T1547.001
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Checks whether AutoAdminLogon=1 is combined with a stored DefaultPassword (existence only; value is never read)."
    telemetry:
      - "Synthetic write (gated) or read-only evaluation; EDR and Sysmon see the operation"
    detection:
      - "Sysmon, Security, System or WMI-Activity events for the synthetic item, where the source is enabled"
    command: |
      $k = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
      $auto = (Get-ItemProperty -Path $k -Name AutoAdminLogon -ErrorAction SilentlyContinue).AutoAdminLogon
      $hasPw = $null -ne (Get-ItemProperty -Path $k -Name DefaultPassword -ErrorAction SilentlyContinue).DefaultPassword
      if ("$auto" -ne '1') { Write-Output 'PASS: AutoAdminLogon is not enabled.' }
      elseif ($hasPw) { Write-Output 'FAIL: AutoAdminLogon is enabled and a DefaultPassword value is stored in plain text. The value was not read.' }
      else { Write-Output 'PASS: AutoAdminLogon is enabled but no DefaultPassword value is stored.' }
    cleanup: ""

  - name: "Active Setup StubPath entries do not point at user-writable folders"
    technique_id: T1547.014
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Reads Active Setup StubPath values and checks their folder. Read-only."
    telemetry:
      - "Synthetic write (gated) or read-only evaluation; EDR and Sysmon see the operation"
    detection:
      - "Sysmon, Security, System or WMI-Activity events for the synthetic item, where the source is enabled"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $hits = @()
      foreach ($root in @('HKLM:\SOFTWARE\Microsoft\Active Setup\Installed Components', 'HKCU:\Software\Microsoft\Active Setup\Installed Components')) {
        foreach ($c in @(Get-ChildItem -Path $root)) {
          $s = "$((Get-ItemProperty -LiteralPath $c.PSPath -Name StubPath).StubPath)"
          if ($s -match '(?i)\\Users\\|\\Temp\\|\\AppData\\') { $hits += $c.PSChildName }
        }
      }
      if ($hits.Count -eq 0) { Write-Output 'PASS: no Active Setup StubPath points at a user-writable folder.' }
      else { Write-Output "FAIL: $($hits.Count) Active Setup StubPath(s) point at user-writable folders: $($hits -join ', ')." }
    cleanup: ""

