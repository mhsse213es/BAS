  - name: "Service creation probe (demand start, missing binary, deleted)"
    technique_id: T1543.003
    framework: custom
    executor: powershell
    requires_priv: admin
    timeout_sec: 60
    fidelity: synthetic-gated
    production_safe: false
    risk: medium
    reversible: true
    blast_radius: "Creates one service with a nonexistent binary and start=demand (it cannot run), then deletes it; verifies removal."
    telemetry:
      - "Synthetic write (gated) or read-only evaluation; EDR and Sysmon see the operation"
    detection:
      - "Sysmon, Security, System or WMI-Activity events for the synthetic item, where the source is enabled"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      if ($env:BAS_EM05_ALLOW_WRITE_PROBES -ne '1') { Write-Output 'SKIP: write probe disabled; set BAS_EM05_ALLOW_WRITE_PROBES=1 on an isolated lab host to run.'; return }
      $id = [Security.Principal.WindowsIdentity]::GetCurrent()
      if (-not (New-Object Security.Principal.WindowsPrincipal $id).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { Write-Output 'SKIP: requires an elevated context.'; return }
      function Find-Ev([string]$log, [int[]]$ids, [string]$needle, [datetime]$since) {
        try { return @(Get-WinEvent -FilterHashtable @{LogName=$log; Id=$ids; StartTime=$since} -ErrorAction Stop | Where-Object { $_.Message -like "*$needle*" }).Count }
        catch { if ($_.Exception.Message -match 'No events') { return 0 } else { return -1 } }
      }
      $sfx = [guid]::NewGuid().ToString('N').Substring(0, 10); $n = 'AudspectEM05_' + $sfx
      $svc = 'AudspectEM05_' + $sfx
      $since = Get-Date
      $created = $false; $cerr = ''
      $scOut = (& sc.exe create $svc 'binPath=' 'C:\AudspectEM05_missing\probe.exe' 'start=' 'demand' 'DisplayName=' 'AudspectEM05 probe' 2>&1) | Out-String
      if ($LASTEXITCODE -eq 0) { $created = $true } else { $cerr = "sc.exe exit $($LASTEXITCODE): " + ($scOut -replace "\s+", " ").Trim() }
      Start-Sleep -Seconds 4
      $d = Find-Ev 'System' @(7045) $svc $since
      $cleanOk = $true
      if ($created) {
        & sc.exe delete $svc | Out-Null
        if (Get-Service -Name $svc -ErrorAction SilentlyContinue) { $cleanOk = $false }
      }
      $tail = if ($cleanOk) { 'Cleanup verified.' } else { "CLEANUP FAILED: run sc.exe delete $svc manually." }
      if (-not $created) { if ($cerr -match 'ACCESS_DENIED|Access is denied') { Write-Output "PASS: service creation was blocked ($cerr). $tail" } else { Write-Output "ERROR: service creation could not be tested ($cerr). $tail" } }
      elseif ($d -gt 0) { Write-Output "PASS: service creation succeeded but was recorded ($d System EID 7045 event(s)). $tail" }
      elseif ($d -lt 0) { Write-Output "FAIL: service created and System log was not readable for EID 7045. $tail" }
      else { Write-Output "FAIL: service created and no EID 7045 event was recorded. $tail" }
    cleanup: ""

