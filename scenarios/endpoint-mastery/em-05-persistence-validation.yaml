  - name: "Security log size supports persistence telemetry retention"
    technique_id: T1547.001
    framework: custom
    executor: powershell
    requires_priv: admin
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Reads the Security log maximum size. Read-only."
    telemetry:
      - "Synthetic write (gated) or read-only evaluation; EDR and Sysmon see the operation"
    detection:
      - "Sysmon, Security, System or WMI-Activity events for the synthetic item, where the source is enabled"
    command: |
      $id = [Security.Principal.WindowsIdentity]::GetCurrent()
      if (-not (New-Object Security.Principal.WindowsPrincipal $id).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { Write-Output 'SKIP: requires an elevated context.'; return }
      $l = Get-WinEvent -ListLog Security -ErrorAction SilentlyContinue
      if (-not $l) { Write-Output 'FAIL: the Security log cannot be read.'; return }
      $mb = [math]::Round($l.MaximumSizeInBytes / 1MB)
      if ($mb -ge 192) { Write-Output "PASS: Security log maximum size is $mb MB (at least 192 MB recommended)." }
      else { Write-Output "FAIL: Security log maximum size is $mb MB; below the 192 MB recommendation for persistence events." }
    cleanup: ""
