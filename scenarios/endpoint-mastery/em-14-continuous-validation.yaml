id: em-14-continuous-validation
name: "Endpoint Mastery 14 — Posture Drift Metric Engine"
description: >
  ENDPOINT MASTERY — Layer 14. Programmatic configuration assurance scoring. Runs continuous
  differential validation against an established control baseline to report real-time policy drift[cite: 4, 5].

  VERDICTS: PASS = drift limits within acceptable parameters (< 15%). FAIL = significant drift detected.
author: Audspect Research
executable: true
supported_os: [windows]
tags:
  - endpoint-mastery
  - em-layer-14
  - continuous-validation
mitre_phases:
  - defense-evasion
live_policy:
  block_on_domain_controller: false
  require_dc_reachable: false

steps:
  - name: "Calculate control integrity delta score index"
    technique_id: T1562
    framework: custom
    executor: powershell
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Computes metric variance over active firewall, real-time scanning, and registry locks[cite: 5]."
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      # Define baseline checks to evaluate state metrics
      $expectedControls = 5
      $activeControls = 0
      
      if ((Get-MpComputerStatus).RealTimeProtectionEnabled -eq $true) { $activeControls++ }
      if ((Get-MpComputerStatus).IsTamperProtected -eq $true) { $activeControls++ }
      if ((Get-NetFirewallProfile -Profile Domain).Enabled -eq $true) { $activeControls++ }
      if ((Get-NetFirewallProfile -Profile Public).Enabled -eq $true) { $activeControls++ }
      
      $hasAppLocker = $false
      try { $pol = Get-AppLockerPolicy -Effective -ErrorAction SilentlyContinue; if ($pol.RuleCollections.Count -gt 0) { $hasAppLocker = $true } } catch {}
      if ($hasAppLocker) { $activeControls++ }
      
      $drift = (($expectedControls - $activeControls) / $expectedControls) * 100
      
      if ($drift -ge 40) {
        Write-Output "FAIL: Critical control drift detected on host! Drift Index: $drift %. Multiple baseline metrics are offline."
      } elseif ($drift -gt 0) {
        Write-Output "PASS: Minor configuration variance observed. Drift Index: $drift %. Host remains mostly secure. [BAS-SIM][cite: 5]"
      } else {
        Write-Output "PASS: Perfect compliance alignment maintained. Drift Index: 0 % drift. [BAS-SIM]"
      }
    cleanup: ""