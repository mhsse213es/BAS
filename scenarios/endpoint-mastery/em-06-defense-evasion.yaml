id: em-06-defense-evasion
product_line: av
name: "Endpoint Mastery 06 — Defense Evasion & LOLBin Execution"
description: >
  ENDPOINT MASTERY — Layer 6. Exercises attacker-like command-line and process behaviour that
  uses trusted Windows binaries (LOLBins), and checks whether process telemetry records it and
  whether endpoint security detects or blocks it. Sixteen tests, each with harmless targets.
  THREE OUTCOMES, REPORTED SEPARATELY: EXECUTED (the simulated process started), DETECTED (process
  telemetry recorded the synthetic marker), BLOCKED (policy prevented the process from starting).
  COLLECTED (Audspect received the evidence) is not assessed by this scenario.
  VERDICTS: PASS = blocked, or executed and detected. FAIL = executed and not detected. SKIP = not
  assessable (no process telemetry source), with a reason; SKIP is not scored. ERROR = the test could
  not run, or cleanup failed.
  SAFETY: loopback targets only (127.0.0.1 on a port with nothing listening). No payload is downloaded
  or executed. Temporary files live in a unique %TEMP% folder that is removed. Side-effect probes
  (files, copies, compiled helpers) run only with BAS_EM06_ALLOW_EXEC_PROBES=1 on an isolated lab host.
author: Audspect Research
executable: true
supported_os: [windows]
tags:
  - endpoint-mastery
  - em-layer-6
  - evasion
  - lolbins
mitre_phases:
  - defense-evasion
live_policy:
  block_on_domain_controller: true
  require_dc_reachable: false

steps:
  - name: "EM-06-01 Regsvr32 Squiblydoo proxy execution pattern"
    technique_id: T1218.010
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 45
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Runs regsvr32 against a loopback URL with nothing listening. Connection refused; no code is fetched or run."
    telemetry:
      - "Sysmon EID 1 and Security 4688 for the simulated process, where those sources are enabled"
    detection:
      - "EDR or Defender events for the simulated behaviour, read after the step"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      function Find-Ev([string]$log, [int[]]$ids, [string]$needle, [datetime]$since) {
        try { return @(Get-WinEvent -FilterHashtable @{LogName=$log; Id=$ids; StartTime=$since} -ErrorAction Stop | Where-Object { $_.Message -like "*$needle*" }).Count }
        catch { if ($_.Exception.Message -match 'No events') { return 0 } else { return -1 } }
      }
      $sfx = [guid]::NewGuid().ToString('N').Substring(0, 10)
      $work = Join-Path $env:TEMP ('AudspectEM06_' + $sfx)
      New-Item -ItemType Directory -Path $work -Force | Out-Null
      $exe = 'regsvr32.exe'
      $argList = "/s /i:http://127.0.0.1:9/bas_$sfx.sct scrobj.dll"
      $needle = $sfx
      $sysmon = [bool](Get-Service -Name Sysmon64, Sysmon -ErrorAction SilentlyContinue | Where-Object { $_.Status -eq 'Running' })
      $p4688 = ((auditpol.exe /get /subcategory:'{0CCE922B-69AE-11D9-BED3-505054503030}' /r 2>$null) | Out-String) -match 'Success'
      $src = if ($sysmon) { 'sysmon' } elseif ($p4688) { '4688' } else { 'none' }
      $since = Get-Date
      $executed = $false; $blocked = $false; $err = ''
      try {
        $p = Start-Process -FilePath $exe -ArgumentList $argList -WorkingDirectory $work -PassThru -WindowStyle Hidden -ErrorAction Stop
        $executed = $true
        if (-not $p.WaitForExit(10000)) { try { $p.Kill() } catch {} }
      } catch { $err = $_.Exception.Message; if ($err -match 'blocked|policy|denied|Access is denied|0x800704EC') { $blocked = $true } }
      Start-Sleep -Seconds 4
      $hits = 0
      if ($sysmon) { $hits += [Math]::Max(0, (Find-Ev 'Microsoft-Windows-Sysmon/Operational' @(1) $needle $since)) }
      if ($p4688) { $hits += [Math]::Max(0, (Find-Ev 'Security' @(4688) $needle $since)) }
      $telemetry = if ($src -eq 'none') { 'not assessable' } elseif ($hits -gt 0) { 'yes' } else { 'no' }
      $leaf = Split-Path -Leaf $exe
      $secReadable = [bool](Get-WinEvent -ListLog 'Microsoft-Windows-Windows Defender/Operational' -ErrorAction SilentlyContinue)
      $sec = 0
      foreach ($spec in @(@('Microsoft-Windows-Windows Defender/Operational', @(1116, 1117, 1121, 1122)), @('Microsoft-Windows-AppLocker/EXE and DLL', @(8003, 8004)), @('Microsoft-Windows-CodeIntegrity/Operational', @(3076, 3077)))) { $n = Find-Ev $spec[0] $spec[1] $leaf $since; if ($n -gt 0) { $sec += $n } }
      $extraFail = ''

      Remove-Item -LiteralPath $work -Recurse -Force -ErrorAction SilentlyContinue
      $clean = -not (Test-Path -LiteralPath $work)
      $ev = 'EXECUTED=' + $(if ($executed) { 'yes' } else { 'no' }) + '; TELEMETRY=' + $telemetry + '; SECURITY_DETECTED_OR_BLOCKED=' + $(if ($sec -gt 0) { 'yes' } elseif ($secReadable) { 'no' } else { 'not assessable' }) + '; BLOCKED=' + $(if ($blocked) { 'yes' } else { 'no' }) + '; COLLECTED=NOT_ASSESSED (requires Audspect query).'
      if (-not $clean) { Write-Output ('ERROR: cleanup failed; remove ' + $work + ' manually. ' + $ev) }
      if ($extraFail) { Write-Output ('FAIL: ' + $extraFail + ' ' + $ev) }
      elseif ($blocked) { Write-Output ('PASS: BLOCKED by policy (' + $err + '). ' + $ev) }
      elseif (-not $executed) { Write-Output ('ERROR: the simulated process could not be started (' + $err + '). ' + $ev) }
      elseif ($sec -gt 0) { Write-Output ('PASS: endpoint security detected or blocked the behaviour (' + $sec + ' event(s) naming ' + $leaf + '). ' + $ev) }
      elseif (-not $secReadable) { Write-Output ('SKIP: NOT_ASSESSED - the Defender operational log is not readable; the security outcome cannot be assessed. ' + $ev) }
      else { Write-Output ('FAIL: EXECUTED and no endpoint security detection or block was recorded. ' + $ev) }
    cleanup: ""

