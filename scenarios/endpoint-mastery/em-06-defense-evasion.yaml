      $src = Join-Path $work 'bas.cs'
      Set-Content -LiteralPath $src -Value 'using System.Collections; using System.Configuration.Install; public class BasNoop : Installer { public override void Uninstall(IDictionary s) { } }' -Encoding ASCII
      & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:library /r:System.Configuration.Install.dll /out:"$work\bas.exe" $src | Out-Null
      $exe = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\InstallUtil.exe"
      $argList = "/LogFile= /U $work\bas.exe"
      $needle = $sfx
      $sysmon = [bool](Get-Service -Name Sysmon64, Sysmon -ErrorAction SilentlyContinue | Where-Object { $_.Status -eq 'Running' })
      $p4688 = ((auditpol.exe /get /subcategory:'{0CCE922B-69AE-11D9-BED3-505054503030}' /r 2>$null) | Out-String) -match 'Success'
