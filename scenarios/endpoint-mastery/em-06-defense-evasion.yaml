      if (-not $sysmon -and -not $p4688) { Write-Output "SKIP: NOT_ASSESSED - no process telemetry source (Sysmon not running; process auditing off). $ev" }
      elseif ($hits -gt 0) { Write-Output "PASS: the query was recorded by process telemetry. $ev" }
      else { Write-Output "FAIL: the query was not recorded by process telemetry; tamper-type activity would not be visible here. $ev" }
    cleanup: ""
