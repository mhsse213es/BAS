  - name: "EM-06-05 InstallUtil proxy execution pattern"
    technique_id: T1218.004
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: synthetic-gated
    production_safe: false
    risk: medium
    reversible: true
    blast_radius: "Compiles a no-op installer assembly in a temp folder and runs InstallUtil /U on it. Uninstall does nothing. The temp folder is removed."
    telemetry:
      - "Sysmon EID 1 and Security 4688 for the simulated process, where those sources are enabled"
    detection:
      - "EDR or Defender events for the simulated behaviour, read after the step"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      if ($env:BAS_EM06_ALLOW_EXEC_PROBES -ne '1') { Write-Output 'SKIP: side-effect probe disabled; set BAS_EM06_ALLOW_EXEC_PROBES=1 on an isolated lab host to run.'; return }
      function Find-Ev([string]$log, [int[]]$ids, [string]$needle, [datetime]$since) {
        try { return @(Get-WinEvent -FilterHashtable @{LogName=$log; Id=$ids; StartTime=$since} -ErrorAction Stop | Where-Object { $_.Message -like "*$needle*" }).Count }
