      try { $vol = Get-BitLockerVolume -MountPoint $env:SystemDrive } catch { Write-Output "ERROR: Get-BitLockerVolume failed: $($_.Exception.Message)"; return }
      if ([string]$vol.VolumeStatus -eq 'FullyEncrypted') { Write-Output "PASS: System volume $env:SystemDrive is FullyEncrypted (observed VolumeStatus=FullyEncrypted)." }
      else { Write-Output "FAIL: System volume $env:SystemDrive is not fully encrypted (observed VolumeStatus=$($vol.VolumeStatus))." }
