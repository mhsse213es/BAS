  - name: "Firewall outbound policy validated against the selected baseline"
    technique_id: T1562.004
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Read-only: Get-NetFirewallProfile -PolicyStore ActiveStore. No change."
    telemetry:
      - "No attack telemetry — posture query only"
    detection:
      - "Baseline-dependent: outbound Deny is validated only when the selected baseline requires it; Windows default Allow is reported, not failed"
    command: |
      $ErrorActionPreference = 'Stop'
      # Override: BAS_EM01_OUTBOUND_BASELINE = 'block' when the selected security baseline requires outbound Deny.
      # Unset or 'none': no outbound baseline is configured, so the result is NOT_ASSESSED (SKIP, informational).
      $req = [string]$env:BAS_EM01_OUTBOUND_BASELINE
      if ([string]::IsNullOrWhiteSpace($req)) { $req = 'none' }
      $req = $req.Trim().ToLower()
      if ($req -notin @('none', 'block')) { Write-Output "ERROR: BAS_EM01_OUTBOUND_BASELINE must be 'none' or 'block' (got '$req')."; return }
      try { $pr = @(Get-NetFirewallProfile -PolicyStore ActiveStore) } catch { Write-Output "ERROR: Get-NetFirewallProfile failed: $($_.Exception.Message)"; return }
      $obs = ($pr | ForEach-Object { "$($_.Name)=$($_.DefaultOutboundAction)" }) -join ' '
      if ($req -eq 'none') { Write-Output "SKIP: NOT_ASSESSED - no outbound baseline is configured (BAS_EM01_OUTBOUND_BASELINE unset). Observed outbound default: $obs. Informational; not scored."; return }
      $open = @($pr | Where-Object { [string]$_.DefaultOutboundAction -ne 'Block' } | ForEach-Object { $_.Name })
      if ($open.Count -eq 0) { Write-Output "PASS: The configured baseline requires outbound Deny and it is in force on all profiles (observed $obs; baseline=block)." }
      else { Write-Output "FAIL: The configured baseline requires outbound Deny; it is violated on: $($open -join ', ') (observed $obs; baseline=block)." }
    cleanup: ""

