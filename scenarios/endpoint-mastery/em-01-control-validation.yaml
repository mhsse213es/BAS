  - name: "AppLocker Windows Installer (MSI) collection enforced"
    technique_id: T1218.007
    framework: custom
    executor: powershell
    requires_priv: admin
    timeout_sec: 30
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Read-only: Get-AppLockerPolicy -Effective. No change."
    telemetry:
      - "No attack telemetry — posture query only"
    detection:
      - "Config assurance: unsigned MSI packages are a common LOLBin install vector"
    command: |
      $ErrorActionPreference = 'Stop'
      try { $pol = Get-AppLockerPolicy -Effective } catch { Write-Output "ERROR: Get-AppLockerPolicy failed: $($_.Exception.Message)"; return }
      $m = @{}; foreach ($rc in @($pol.RuleCollections)) { $m[[string]$rc.RuleCollectionType] = [string]$rc.EnforcementMode }
      $v = 'NotConfigured'; if ($m.ContainsKey('Msi')) { $v = $m['Msi'] }
      if ($v -eq 'Enabled') { Write-Output "PASS: AppLocker enforces the Windows Installer (MSI) collection (observed EnforcementMode=Enabled)." }
      else { Write-Output "FAIL: AppLocker MSI collection is not enforced (observed $v; Enabled required). Unapproved installers can run." }
    cleanup: ""

