      $live = @($rules | Where-Object { [string]$_.Enabled -eq 'True' -and [string]$_.Direction -eq 'Inbound' -and [string]$_.Action -eq 'Allow' })
      if ($live.Count -eq 0) { Write-Output "PASS: No enabled Remote Desktop inbound allow rule exists; RDP is not reachable through the host firewall."; return }
      $pub = @($live | Where-Object { [string]$_.Profile -match 'Public|Any' } | ForEach-Object { $_.Name })
