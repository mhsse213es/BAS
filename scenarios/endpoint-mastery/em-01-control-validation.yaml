id: em-01-control-validation
product_line: av
name: "Endpoint Mastery 01 — Endpoint Security Control Validation"
description: >
  ENDPOINT MASTERY — Layer 1. Validates that the endpoint's preventive controls
  are present, configured, and actually enforcing — the question most BAS tools
  skip. Read-only posture probes only: no attack is executed, nothing is changed.

  Coverage (69 independent checks, grouped by control area in the file):
    - EDR/AV engine: real-time, behavior, on-access, active mode, script scanning,
      cloud protection, PUA, network protection, controlled folder access
    - Signatures and scans: signature freshness (AV and NIS), scheduled scans
    - Tamper and policy integrity: Tamper Protection, policy-disabled AV, disable
      flags, broad exclusions
    - Windows Firewall: profiles, default inbound/outbound policy, service,
      allow-all rules, RDP exposure, logging and log size
    - ASR: per-rule Block checks for ten baseline rules, plus ASR exclusions
    - Application control: AppLocker per collection, AppIDSvc, WDAC enforcement
    - BitLocker and TPM: system and data volumes, XTS-AES, recovery protector, TPM
    - Windows Security Center and endpoint services: Defender, Sense (MDE),
      Network Inspection, Security Center, Event Log, Sysmon, log retention
    - Security policy: UAC, SMBv1, LSA protection, PowerShell logging, process
      auditing, LLMNR, Secure Boot, VBS/HVCI, RDP NLA

  VERDICTS: PASS = control present and enforcing. FAIL = control absent, disabled,
  or weak (a real exposure). SKIP = control not applicable on this host/SKU.
  SAFETY: every step is read-only (Get-* / query APIs). Production-safe anywhere.

  CONFIGURATION (agent environment variables; unset = default):
    BAS_EM01_OUTBOUND_BASELINE  none (default) | block. 'block' makes outbound Deny a
                                 required baseline; unset reports NOT_ASSESSED (SKIP).
    BAS_EM01_FW_LOG_MB          firewall log threshold, MB. Default 16 (Audspect recommended).
    BAS_EM01_SECLOG_MB          Security event log threshold, MB. Default 192 (Audspect recommended).
    BAS_EM01_AV_DEF_HOURS       AV definitions freshness, hours. Default 24 (Audspect recommended).
  Thresholds are Audspect recommended defaults, not Microsoft or CIS requirements.
  Each PASS/FAIL reports the observed value and the threshold used.
author: Audspect Research
executable: true
supported_os: [windows]
tags:
  - endpoint-mastery
  - em-layer-1
  - control-validation
  - posture
  - edr
  - hardening
mitre_phases:
  - defense-evasion
live_policy:
  block_on_domain_controller: false
  require_dc_reachable: false

steps:
  - name: "EDR/AV real-time protection enforcing (Defender or 3rd-party AV)"
    technique_id: T1562.001
    framework: custom
    executor: powershell
    requires_priv: admin
    timeout_sec: 30
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Read-only: queries Get-MpComputerStatus / SecurityCenter2 AntiVirusProduct. No change."
    telemetry:
      - "No attack telemetry — posture query only"
    detection:
      - "Config assurance: real-time protection must be ON"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $rtp = $null
      try { $rtp = (Get-MpComputerStatus).RealTimeProtectionEnabled } catch {}
      if ($rtp -eq $true) { Write-Output "PASS: Microsoft Defender real-time protection is ENABLED and enforcing. [BAS-SIM]"; return }
      # Fall back to any registered 3rd-party AV reporting "enabled" via SecurityCenter2.
      $av = Get-CimInstance -Namespace 'root/SecurityCenter2' -ClassName AntiVirusProduct -ErrorAction SilentlyContinue
      # Defender itself is excluded here: its state was already judged above, and it must not stand in for a 3rd-party engine.
      foreach ($p in $av) { if (($p.productState -band 0x1000) -ne 0 -and $p.displayName -notmatch 'Defender') { Write-Output "PASS: 3rd-party AV '$($p.displayName)' reports real-time protection ENABLED. [BAS-SIM]"; return } }
      if ($rtp -eq $false) { Write-Output "FAIL: Defender real-time protection is DISABLED — endpoint is unprotected against on-access threats."; return }
      Write-Output "FAIL: No active real-time AV/EDR protection detected on this endpoint."
    cleanup: ""

  - name: "Antivirus signature freshness (definitions not stale)"
    technique_id: T1562.001
    framework: custom
    executor: powershell
    requires_priv: admin
    timeout_sec: 30
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Read-only: Get-MpComputerStatus signature age. No change."
    telemetry:
      - "No attack telemetry — posture query only"
    detection:
      - "Config assurance: AV signatures should be <= 3 days old"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $age = $null
      try { $age = (Get-MpComputerStatus).AntivirusSignatureAge } catch {}
      if ($age -eq $null) { Write-Output "SKIP: signature age unavailable — Defender not the active AV (check 3rd-party AV console)."; return }
      if ($age -le 3) { Write-Output "PASS: AV signatures are $age day(s) old — within freshness window. [BAS-SIM]" }
      else { Write-Output "FAIL: AV signatures are $age days old — stale definitions miss recent threats. Force an update." }
    cleanup: ""

  - name: "Defender Tamper Protection enabled"
    technique_id: T1562.001
    framework: custom
    executor: powershell
    requires_priv: admin
    timeout_sec: 30
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Read-only: Get-MpComputerStatus IsTamperProtected. No change."
    telemetry:
      - "No attack telemetry — posture query only"
    detection:
      - "Config assurance: Tamper Protection stops attackers disabling the AV"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $tp = $null
      try { $tp = (Get-MpComputerStatus).IsTamperProtected } catch {}
      if ($tp -eq $null) { Write-Output "SKIP: Tamper Protection state unavailable — not a Defender-managed endpoint."; return }
      if ($tp -eq $true) { Write-Output "PASS: Defender Tamper Protection is ENABLED — AV settings are locked against attacker tampering. [BAS-SIM]" }
      else { Write-Output "FAIL: Tamper Protection is OFF — an attacker with admin can silently disable the AV before attacking." }
    cleanup: ""

  - name: "Host firewall enabled on all profiles (Domain/Private/Public)"
    technique_id: T1562.004
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Read-only: Get-NetFirewallProfile. No rule change."
    telemetry:
      - "No attack telemetry — posture query only"
    detection:
      - "Config assurance: all three firewall profiles must be enabled"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $profiles = Get-NetFirewallProfile -ErrorAction SilentlyContinue
      if (-not $profiles) { Write-Output "SKIP: Windows Firewall service not queryable (3rd-party firewall may be in use)."; return }
      $off = $profiles | Where-Object { -not $_.Enabled } | Select-Object -ExpandProperty Name
      if (-not $off) { Write-Output "PASS: Host firewall is ENABLED on all profiles (Domain/Private/Public). [BAS-SIM]" }
      else { Write-Output "FAIL: Host firewall is DISABLED on profile(s): $($off -join ', ') — lateral movement and C2 face no host-level filtering." }
    cleanup: ""

  - name: "Attack Surface Reduction (ASR) rules configured"
    technique_id: T1562.001
    framework: custom
    executor: powershell
    requires_priv: admin
    timeout_sec: 30
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Read-only: Get-MpPreference ASR rule ids/actions. No change."
    telemetry:
      - "No attack telemetry — posture query only"
    detection:
      - "Config assurance: ASR rules in Block mode blunt Office/script abuse"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $pref = Get-MpPreference -ErrorAction SilentlyContinue
      if (-not $pref) { Write-Output "SKIP: ASR state unavailable — Defender not the active engine."; return }
      # Filter nulls: @($null) has Count 1 and would report a phantom rule on a host with no ASR configuration.
      $ids = @($pref.AttackSurfaceReductionRules_Ids | Where-Object { $_ })
      $acts = @($pref.AttackSurfaceReductionRules_Actions)
      $blocking = 0; for ($i=0; $i -lt $acts.Count; $i++) { if ($acts[$i] -eq 1) { $blocking++ } }
      if ($ids.Count -eq 0) { Write-Output "FAIL: No ASR rules configured — Office/script/LOLBin abuse has no surface-reduction control."; return }
      if ($blocking -gt 0) { Write-Output "PASS: $blocking of $($ids.Count) ASR rule(s) in Block mode. [BAS-SIM]" }
      else { Write-Output "FAIL: $($ids.Count) ASR rule(s) present but NONE in Block mode (audit-only) — they observe but do not stop attacks." }
    cleanup: ""

  - name: "Application control present (AppLocker or WDAC)"
    technique_id: T1059.001
    framework: custom
    executor: powershell
    requires_priv: admin
    timeout_sec: 30
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Read-only: AppLocker policy + CI/WDAC status query. No change."
    telemetry:
      - "No attack telemetry — posture query only"
    detection:
      - "Config assurance: allowlisting is the strongest execution control"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      # Effective coverage, not presence: a rule collection enforces only when its
      # EnforcementMode is Enabled. AuditOnly observes and NotConfigured covers nothing.
      $modes = @{}
      try {
        $pol = Get-AppLockerPolicy -Effective -ErrorAction Stop
        foreach ($rc in @($pol.RuleCollections)) { $modes[[string]$rc.RuleCollectionType] = [string]$rc.EnforcementMode }
      } catch {}
      $types = 'Exe','Script','Dll','Msi','Appx'
      foreach ($t in $types) { if (-not $modes.ContainsKey($t)) { $modes[$t] = 'NotConfigured' } }
      $detail = ($types | ForEach-Object { "$_=$($modes[$_])" }) -join ' '
      Write-Output "APPCTL_COVERAGE: $detail"
      # CodeIntegrityPolicyEnforcementStatus: 0 = off, 1 = audit only (observes, does not block), 2 = enforced.
      $wdacStatus = 0
      try { $ci = Get-CimInstance -ClassName Win32_DeviceGuard -Namespace 'root\Microsoft\Windows\DeviceGuard' -ErrorAction Stop; $wdacStatus = [int]$ci.CodeIntegrityPolicyEnforcementStatus } catch {}
      if ($modes['Exe'] -eq 'Enabled' -and $modes['Script'] -eq 'Enabled') {
        Write-Output "PASS: AppLocker enforces executables and scripts ($detail). Coverage is limited to the collections listed. [BAS-SIM]"
      } elseif ($wdacStatus -eq 2) {
        Write-Output "PASS: WDAC code-integrity policy is ENFORCED (CodeIntegrityPolicyEnforcementStatus=2); AppLocker does not cover executables and scripts ($detail). Policy scope is not evaluated by this check. [BAS-SIM]"
      } else {
        Write-Output "FAIL: AppLocker does not enforce both executables and scripts ($detail). Audit-only or unconfigured collections observe or cover nothing. [BAS-SIM]"
      }
    cleanup: ""

  - name: "BitLocker drive encryption on the system volume"
    technique_id: T1486
    framework: custom
    executor: powershell
    requires_priv: admin
    timeout_sec: 30
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Read-only: Get-BitLockerVolume on the system drive. No change."
    telemetry:
      - "No attack telemetry — posture query only"
    detection:
      - "Config assurance: system drive must be encrypted (data-at-rest)"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $sys = $env:SystemDrive
      $vol = $null
      try { $vol = Get-BitLockerVolume -MountPoint $sys -ErrorAction Stop } catch {}
      if (-not $vol) { Write-Output "SKIP: BitLocker not queryable on $sys (feature absent or 3rd-party FDE in use)."; return }
      if ($vol.ProtectionStatus -eq 'On' -or $vol.VolumeStatus -eq 'FullyEncrypted') { Write-Output "PASS: BitLocker is ON for system drive $sys (status=$($vol.VolumeStatus)). [BAS-SIM]" }
      else { Write-Output "FAIL: System drive $sys is NOT encrypted (protection=$($vol.ProtectionStatus)) — data-at-rest is exposed on theft/loss." }
    cleanup: ""

  # ───────────────────────── EDR / AV engine (E1–E8) ─────────────────────────

  - name: "Defender behavior monitoring enabled"
    technique_id: T1562.001
    framework: custom
    executor: powershell
    requires_priv: admin
    timeout_sec: 30
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Read-only: Get-MpComputerStatus BehaviorMonitorEnabled. No change."
    telemetry:
      - "No attack telemetry — posture query only"
    detection:
      - "Config assurance: behavior monitoring detects malicious process behaviour, not just known files"
    command: |
      $ErrorActionPreference = 'Stop'
      if (-not (Get-Service -Name WinDefend -ErrorAction SilentlyContinue)) { Write-Output "SKIP: Microsoft Defender (WinDefend) is not installed; third-party engine in use."; return }
      try { $s = Get-MpComputerStatus } catch { Write-Output "ERROR: Get-MpComputerStatus failed: $($_.Exception.Message)"; return }
      if ([bool]$s.BehaviorMonitorEnabled) { Write-Output "PASS: Defender behavior monitoring is ENABLED (observed BehaviorMonitorEnabled=True)." }
      else { Write-Output "FAIL: Defender behavior monitoring is DISABLED (observed BehaviorMonitorEnabled=False); process-behaviour detection is off." }
    cleanup: ""

