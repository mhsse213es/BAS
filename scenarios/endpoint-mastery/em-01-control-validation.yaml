  - name: "No effective allow-all inbound firewall rule"
    technique_id: T1562.004
    framework: custom
    executor: powershell
    requires_priv: admin
    timeout_sec: 120
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Read-only: enumerates enabled inbound allow rules and their filters. No change."
    telemetry:
      - "No attack telemetry — posture query only"
    detection:
      - "Config assurance: an enabled rule allowing any program on any port defeats the firewall"
    command: |
      $ErrorActionPreference = 'Stop'
      try {
        # Packaged (UWP) app rules carry a Package SID on the application filter; they are scoped, not host-wide.
        $appAny  = @(Get-NetFirewallApplicationFilter -All | Where-Object { [string]$_.Program -eq 'Any' -and [string]::IsNullOrEmpty([string]$_.Package) } | ForEach-Object { $_.InstanceID })
        $portAny = @(Get-NetFirewallPortFilter -All | Where-Object { [string]$_.LocalPort -eq 'Any' -and [string]$_.Protocol -eq 'Any' } | ForEach-Object { $_.InstanceID })
        $inbound = @(Get-NetFirewallRule -Direction Inbound -Enabled True -Action Allow)
      } catch { Write-Output "ERROR: firewall rule enumeration failed: $($_.Exception.Message)"; return }
      $hits = @($inbound | Where-Object { ($appAny -contains $_.InstanceID) -and ($portAny -contains $_.InstanceID) } | ForEach-Object { $_.DisplayName })
      if ($hits.Count -eq 0) { Write-Output "PASS: No enabled inbound allow rule applies to any program on any port (inbound allow rules reviewed: $($inbound.Count))." }
      else { Write-Output "FAIL: Enabled inbound allow rule(s) apply to any program on any port: $($hits -join '; ')." }
    cleanup: ""

