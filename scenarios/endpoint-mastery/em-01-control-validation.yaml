  - name: "Firewall log size meets configured threshold (Audspect default 16 MB)"
    technique_id: T1562.004
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Read-only: Get-NetFirewallProfile -PolicyStore ActiveStore LogMaxSizeKilobytes. No change."
    telemetry:
      - "No attack telemetry — posture query only"
    detection:
      - "Config assurance: the default 4 MB firewall log rolls over and loses blocked-connection history quickly"
    command: |
      $ErrorActionPreference = 'Stop'
      try { $pr = @(Get-NetFirewallProfile -PolicyStore ActiveStore) } catch { Write-Output "ERROR: Get-NetFirewallProfile failed: $($_.Exception.Message)"; return }
      # Audspect recommended default, not a Microsoft or CIS requirement. Override with BAS_EM01_FW_LOG_MB (whole MB, >= 1).
      $thr = 16; $src = 'Audspect recommended default'
      $raw = [string]$env:BAS_EM01_FW_LOG_MB
      if ($raw.Trim() -ne '') { $n = 0; if (-not [int]::TryParse($raw.Trim(), [ref]$n) -or $n -lt 1) { Write-Output "ERROR: BAS_EM01_FW_LOG_MB must be a positive whole number of MB (got '$raw')."; return }; $thr = $n; $src = 'organization override BAS_EM01_FW_LOG_MB' }
      $obs = ($pr | ForEach-Object { "$($_.Name)=$([math]::Round([int]$_.LogMaxSizeKilobytes / 1024, 1))MB" }) -join ' '
      $small = @($pr | Where-Object { [int]$_.LogMaxSizeKilobytes -lt ($thr * 1024) } | ForEach-Object { $_.Name })
      $tt = "threshold=$thr MB ($src)"
      if ($small.Count -eq 0) { Write-Output "PASS: Firewall log size meets the threshold on all profiles (observed $obs; $tt)." }
      else { Write-Output "FAIL: Firewall log size is below the threshold on: $($small -join ', ') (observed $obs; $tt)." }
    cleanup: ""

