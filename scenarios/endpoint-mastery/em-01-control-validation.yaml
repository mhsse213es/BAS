      $rp = @($vol.KeyProtector | Where-Object { [string]$_.KeyProtectorType -eq 'RecoveryPassword' })
      if ($rp.Count -gt 0) { Write-Output "PASS: $($rp.Count) recovery password protector(s) present on $env:SystemDrive. Escrow to AD or Entra is verified in the directory, not on the endpoint." }
      else { Write-Output "FAIL: No recovery password protector on $env:SystemDrive (protectors=$(@($vol.KeyProtector | ForEach-Object { [string]$_.KeyProtectorType }) -join ',')); the volume cannot be recovered if the TPM state changes." }
