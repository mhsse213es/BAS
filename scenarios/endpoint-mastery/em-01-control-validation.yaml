  - name: "BitLocker system volume uses XTS-AES"
    technique_id: T1486
    framework: custom
    executor: powershell
    requires_priv: admin
    timeout_sec: 30
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Read-only: Get-BitLockerVolume EncryptionMethod on the system drive. No change."
    telemetry:
      - "No attack telemetry — posture query only"
    detection:
      - "Config assurance: XTS-AES is the required algorithm; CBC modes lack integrity protection"
    command: |
      $ErrorActionPreference = 'Stop'
      if (-not (Get-Command Get-BitLockerVolume -ErrorAction SilentlyContinue)) { Write-Output "SKIP: BitLocker cmdlets are not available on this endpoint."; return }
      try { $vol = Get-BitLockerVolume -MountPoint $env:SystemDrive } catch { Write-Output "ERROR: Get-BitLockerVolume failed: $($_.Exception.Message)"; return }
      $m = [string]$vol.EncryptionMethod
      if ($m -like 'XtsAes*') { Write-Output "PASS: System volume uses $m (XTS-AES)." }
      elseif ([string]::IsNullOrEmpty($m) -or $m -eq 'None') { Write-Output "FAIL: System volume has no encryption method applied (observed EncryptionMethod=$m)." }
      else { Write-Output "FAIL: System volume uses legacy $m; XTS-AES is required." }
    cleanup: ""

