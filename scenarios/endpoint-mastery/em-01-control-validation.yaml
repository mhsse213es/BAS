  - name: "Security Center reports an enabled antivirus provider"
    technique_id: T1562.001
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Read-only: root/SecurityCenter2 AntiVirusProduct query. No change."
