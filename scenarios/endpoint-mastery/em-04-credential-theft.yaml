      if (($props -contains 1) -and ($props -contains 2)) { Write-Output "PASS: the platform reports base virtualization and Secure Boot as available." }
      else { Write-Output "FAIL: the platform does not report both base virtualization and Secure Boot as available (observed: $($props -join ','))." }
    cleanup: ""

  - name: "No unexpected LSA authentication packages"
    technique_id: T1003.001
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Reads the Authentication Packages registry value. Read-only."
    telemetry:
      - "Read-only configuration or access-control evaluation; EDR and SIEM see the PowerShell or registry read"
    detection:
      - "Audit and EDR telemetry for the registry, service or process access this check makes"
    command: |
      $ap = @((Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name 'Authentication Packages' -ErrorAction SilentlyContinue).'Authentication Packages' | Where-Object { $_ })
      $extra = @($ap | Where-Object { @('msv1_0') -notcontains $_ })
      if ($extra.Count -eq 0) { Write-Output "PASS: no unexpected LSA authentication packages (observed: $($ap -join ','))." }
      else { Write-Output "FAIL: unexpected LSA authentication package(s) load into LSASS: $($extra -join ', ')." }
    cleanup: ""

  - name: "No unexpected LSA security packages"
    technique_id: T1003.001
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Reads the Security Packages registry value. Read-only."
