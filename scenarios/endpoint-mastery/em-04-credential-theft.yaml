id: em-04-credential-theft
name: "Endpoint Mastery 04 — Credential Theft Simulation"
description: >
  ENDPOINT MASTERY — Layer 4. Validates OS credential isolation architectures and
  EDR memory handle monitoring. Tests LSASS handle harvesting, SAM hive backup exposure,
  and DPAPI master key path accessibility to find credential harvesting gaps[cite: 4, 5].

  VERDICTS: PASS = access denied or protected by the OS/EDR. FAIL = access allowed
  unblocked (credentials exposed). SKIP = insufficient privilege or missing compiler.
  SAFETY: Telemetry-safe read-only handle queries and path checks. No memory dumps written.
author: Audspect Research
executable: true
supported_os: [windows]
tags:
  - endpoint-mastery
  - em-layer-4
  - credential-access
  - lsass
mitre_phases:
  - credential-access
live_policy:
  block_on_domain_controller: true
  require_dc_reachable: false

steps:
  - name: "LSASS handle access (PROCESS_VM_READ) — RunAsPPL / Credential Guard test"
    technique_id: T1003.001
    framework: custom
    executor: powershell
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: medium
    reversible: true
    blast_radius: "Opens a read handle to lsass.exe with PROCESS_VM_READ, then immediately closes it. No memory is read or dumped[cite: 3]."
    telemetry:
      - "Sysmon EID 10: SourceImage=powershell.exe TargetImage=lsass.exe GrantedAccess=0x1010[cite: 3]"
    detection:
      - "EDR: handle to LSASS with VM_READ — Sigma sysmon_lsass_memdump.yml family[cite: 3]"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $sig = @'
      using System;
      using System.Runtime.InteropServices;
      public static class BasMem {
        [DllImport("kernel32.dll", SetLastError=true)] public static extern IntPtr OpenProcess(uint a, bool i, int pid);
        [DllImport("kernel32.dll", SetLastError=true)] public static extern bool CloseHandle(IntPtr h);
      }
      '@
      try { Add-Type -TypeDefinition $sig -ErrorAction Stop } catch { Write-Output "SKIP: could not compile P/Invoke probe."; return }
      $lsass = Get-Process lsass -ErrorAction SilentlyContinue | Select-Object -First 1
      if (-not $lsass) { Write-Output "SKIP: lsass.exe not found.[cite: 3]"; return }
      $h = [BasMem]::OpenProcess(0x1010, $false, $lsass.Id)
      if ($h -ne [IntPtr]::Zero) {
        [void][BasMem]::CloseHandle($h)
        Write-Output "FAIL: opened a PROCESS_VM_READ handle to LSASS unblocked — credential memory is reachable. Enable RunAsPPL/Credential Guard[cite: 3]."
      } else {
        $err = [System.Runtime.InteropServices.Marshal]::GetLastWin32Error()
        Write-Output "PASS: access to LSASS was DENIED (Win32 error $err) — RunAsPPL/Credential Guard/EDR protected LSASS memory. [BAS-SIM][cite: 3]"
      }
    cleanup: ""

  - name: "SAM and SECURITY hive registry accessibility check"
    technique_id: T1003.002
    framework: custom
    executor: powershell
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Attempts to test standard token privileges against the local registry paths for SAM and SECURITY[cite: 5]."
    telemetry:
      - "PowerShell EID 4104: registry path inspection"
    detection:
      - "SIEM/EDR: Direct non-SYSTEM queries to security/sam registry structures"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $canReadSam = $false
      $canReadSec = $false
      try { if (Get-Item -Path "HKLM:\SAM\SAM" -ErrorAction Stop) { $canReadSam = $true } } catch {}
      try { if (Get-Item -Path "HKLM:\SECURITY" -ErrorAction Stop) { $canReadSec = $true } } catch {}
      if ($canReadSam -or $canReadSec) {
        Write-Output "FAIL: Local registry hives (SAM/SECURITY) are readable under current user context — credential hashes can be extracted."
      } else {
        Write-Output "PASS: Local registry secret hives are secure against current user token permissions. [BAS-SIM]"
      }
    cleanup: ""

  - name: "DPAPI User Master Key folder enumeration"
    technique_id: T1003
    framework: custom
    executor: powershell
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Queries the presence of DPAPI master key paths under the user profile. Read-only."
    telemetry:
      - "PowerShell EID 4104: file system path discovery"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $dpapiPath = "$env:APPDATA\Microsoft\Protect"
      if (Test-Path $dpapiPath) {
        $keys = Get-ChildItem -Path $dpapiPath -Recurced -File -ErrorAction SilentlyContinue
        if ($keys.Count -gt 0) {
          Write-Output "PASS: DPAPI Master Key paths discovered ($($keys.Count) files) — verified folder structures exist. EDR did not kill session. [BAS-SIM]"
        } else {
          Write-Output "SKIP: DPAPI folder exists but no master keys found in this user context."
        }
      } else {
        Write-Output "FAIL: DPAPI user protection storage path is unreadable or missing entirely."
      }
    cleanup: ""