  - name: "Defender operational log is readable (detection telemetry source)"
    technique_id: T1003
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Opens the Defender operational log for one event. Read-only."
    telemetry:
      - "Read-only configuration or access-control evaluation; EDR and SIEM see the PowerShell or registry read"
    detection:
