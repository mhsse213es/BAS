  - name: "Cached domain logons within the configured threshold"
    technique_id: T1003.005
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Reads CachedLogonsCount. Read-only."
    telemetry:
      - "Read-only configuration or access-control evaluation; EDR and SIEM see the PowerShell or registry read"
    detection:
      - "Audit and EDR telemetry for the registry, service or process access this check makes"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      if (-not (Get-CimInstance Win32_ComputerSystem).PartOfDomain) { Write-Output "SKIP: the host is not domain-joined; no domain cached logons are expected."; return }
      $max = 2; $src = 'Audspect recommended default'
      $raw = [string]$env:BAS_EM04_CACHED_LOGONS_MAX
      if ($raw.Trim() -ne '') { $n = 0; if (-not [int]::TryParse($raw.Trim(), [ref]$n) -or $n -lt 0) { Write-Output "ERROR: BAS_EM04_CACHED_LOGONS_MAX must be a whole number of 0 or more (got '$raw')."; return }; $max = $n; $src = 'organization override BAS_EM04_CACHED_LOGONS_MAX' }
      $c = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon' -Name CachedLogonsCount -ErrorAction SilentlyContinue).CachedLogonsCount
      $absent = ($null -eq $c)
      if ($absent) { $c = 10 }
      if ([int]$c -le $max) { Write-Output "PASS: cached domain logons = $c$(if ($absent) {' (value absent; Windows default 10 applies)'}) (threshold $max, $src)." }
      else { Write-Output "FAIL: cached domain logons = $c, above the threshold of $max ($src); domain credential hashes are retained on the endpoint." }
    cleanup: ""

