    detection:
      - "Audit and EDR telemetry for the registry, service or process access this check makes"
    command: |
      $sp = @((Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name 'Security Packages' -ErrorAction SilentlyContinue).'Security Packages' | ForEach-Object { "$_".Trim('"').Trim() } | Where-Object { $_ })
      $known = @('kerberos','msv1_0','schannel','wdigest','tspkg','pku2u','cloudAP','negoexts','livessp')
      $extra = @($sp | Where-Object { $known -notcontains $_ })
      if ($extra.Count -eq 0) { Write-Output "PASS: no unexpected LSA security packages (observed: $($sp -join ','))." }
      else { Write-Output "FAIL: unexpected LSA security package(s) are configured: $($extra -join ', ')." }
    cleanup: ""

