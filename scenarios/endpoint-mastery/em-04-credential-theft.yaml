    command: |
      $f = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name LsaCfgFlags -ErrorAction SilentlyContinue).LsaCfgFlags
      if ($f -eq 1 -or $f -eq 2) { Write-Output "PASS: Credential Guard is configured (LsaCfgFlags=$f; $(if ($f -eq 1) {'UEFI-locked'} else {'without UEFI lock'}))." }
      else { Write-Output "FAIL: Credential Guard is not configured (LsaCfgFlags=$(if ($null -eq $f) {'absent'} else {$f}))." }
    cleanup: ""

  - name: "Credential Guard configuration and runtime agree"
    technique_id: T1003.001
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Compares LsaCfgFlags with Win32_DeviceGuard. Read-only."
    telemetry:
      - "Read-only configuration or access-control evaluation; EDR and SIEM see the PowerShell or registry read"
    detection:
      - "Audit and EDR telemetry for the registry, service or process access this check makes"
    command: |
      $f = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name LsaCfgFlags -ErrorAction SilentlyContinue).LsaCfgFlags
      try { $dg = Get-CimInstance -ClassName Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard -ErrorAction Stop } catch { Write-Output "SKIP: Win32_DeviceGuard is not available on this host."; return }
      $run = (@($dg.SecurityServicesRunning) -contains 1)
      $cfg = ($f -eq 1 -or $f -eq 2)
      if ($cfg -and $run) { Write-Output "PASS: Credential Guard is configured and running; configuration and runtime agree." }
      elseif ($cfg -and -not $run) { Write-Output "FAIL: Credential Guard is configured (LsaCfgFlags=$f) but not running; configuration and runtime disagree." }
      elseif (-not $cfg -and -not $run) { Write-Output "SKIP: NOT_ASSESSED - Credential Guard is neither configured nor running on this host; see the configuration and runtime checks. Not scored here." }
      else { Write-Output "FAIL: Credential Guard is running but not configured in LsaCfgFlags; the configuration source is unexplained." }
    cleanup: ""

  - name: "Defender ASR rule blocks credential stealing from LSASS"
    technique_id: T1003.001
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Reads Defender ASR preferences. Read-only."
    telemetry:
      - "Read-only configuration or access-control evaluation; EDR and SIEM see the PowerShell or registry read"
    detection:
      - "Audit and EDR telemetry for the registry, service or process access this check makes"
    command: |
      try { $p = Get-MpPreference -ErrorAction Stop } catch { Write-Output "SKIP: Defender preferences are not available on this host."; return }
      $ids = @($p.AttackSurfaceReductionRules_Ids | Where-Object { $_ } | ForEach-Object { $_.ToString().ToLower() })
      $acts = @($p.AttackSurfaceReductionRules_Actions)
      $i = [Array]::IndexOf($ids, '9e6c4e1f-7d60-472f-ba1a-a39ef669e4b2')
      if ($i -lt 0) { Write-Output "FAIL: ASR rule 'Block credential stealing from LSASS' is not configured." }
      elseif ([int]$acts[$i] -eq 1) { Write-Output "PASS: ASR rule 'Block credential stealing from LSASS' is in BLOCK mode." }
      else { Write-Output "FAIL: ASR rule 'Block credential stealing from LSASS' is configured but not in BLOCK mode (action=$($acts[$i]))." }
    cleanup: ""

  - name: "Sysmon records LSASS process-access events (EID 10)"
    technique_id: T1003.001
    framework: custom
    executor: powershell
    requires_priv: admin
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Reads the Sysmon operational log. Read-only."
    telemetry:
      - "Read-only configuration or access-control evaluation; EDR and SIEM see the PowerShell or registry read"
    detection:
      - "Audit and EDR telemetry for the registry, service or process access this check makes"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $id = [Security.Principal.WindowsIdentity]::GetCurrent()
      $isAdmin = (New-Object Security.Principal.WindowsPrincipal $id).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
      $svc = Get-Service -Name Sysmon64,Sysmon -ErrorAction SilentlyContinue | Where-Object { $_.Status -eq 'Running' } | Select-Object -First 1
      if (-not $svc) { Write-Output "SKIP: Sysmon is not running on this host; process-access telemetry is not collected here."; return }
      try { $ev = @(Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-Sysmon/Operational'; Id=10; StartTime=(Get-Date).AddDays(-7)} -MaxEvents 1 -ErrorAction Stop) } catch { $ev = @() }
      if ($ev.Count -gt 0) { Write-Output "PASS: Sysmon ($($svc.Name)) is running and has recorded process-access events (EID 10) in the last 7 days." }
      else { Write-Output "FAIL: Sysmon ($($svc.Name)) is running but has recorded no process-access events (EID 10) in the last 7 days; LSASS access may be unrecorded." }
    cleanup: ""

