      try { $sb = Confirm-SecureBootUEFI -ErrorAction Stop } catch { Write-Output "SKIP: Secure Boot state is not available (legacy BIOS or unsupported cmdlet)."; return }
      if ($sb) { Write-Output "PASS: Secure Boot is enabled." } else { Write-Output "FAIL: Secure Boot is disabled; VBS and Credential Guard cannot be fully enforced." }
    cleanup: ""

  - name: "Hypervisor launch type permits VBS"
    technique_id: T1003.001
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Reads the current boot configuration (bcdedit /enum). Read-only."
    telemetry:
      - "Read-only configuration or access-control evaluation; EDR and SIEM see the PowerShell or registry read"
    detection:
      - "Audit and EDR telemetry for the registry, service or process access this check makes"
    command: |
      $t = (bcdedit /enum '{current}' 2>$null | Select-String 'hypervisorlaunchtype' | ForEach-Object { ($_ -split '\s+')[-1] } | Select-Object -First 1)
      if ($t -eq 'Auto' -or $t -eq 'On') { Write-Output "PASS: hypervisor launch type is $t." }
      elseif ($t -eq 'Off') { Write-Output "FAIL: hypervisor launch type is Off; VBS cannot run." }
      else { Write-Output "SKIP: hypervisor launch type is not set (default applies; not assessed here)." }
    cleanup: ""

