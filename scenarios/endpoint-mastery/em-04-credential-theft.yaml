    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      try { $e = Get-WinEvent -LogName 'Microsoft-Windows-Windows Defender/Operational' -MaxEvents 1 -ErrorAction Stop; Write-Output "PASS: the Defender operational log is readable (latest event $($e.TimeCreated))." }
