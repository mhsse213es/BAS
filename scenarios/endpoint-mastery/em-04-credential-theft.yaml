  - name: "SAM hive ACL grants no read to broad principals"
    technique_id: T1003.002
    framework: custom
    executor: powershell
    requires_priv: admin
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Reads the ACL of HKLM:\\SAM. Read-only; no values read."
    telemetry:
      - "Read-only configuration or access-control evaluation; EDR and SIEM see the PowerShell or registry read"
    detection:
      - "Audit and EDR telemetry for the registry, service or process access this check makes"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $id = [Security.Principal.WindowsIdentity]::GetCurrent()
      $isAdmin = (New-Object Security.Principal.WindowsPrincipal $id).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
      try { $acl = Get-Acl -Path 'HKLM:\SAM\SAM' -ErrorAction Stop } catch { Write-Output "SKIP: NOT_ASSESSED - the ACL of the SAM account database (HKLM:\SAM\SAM) is not readable from this context; access is restricted to SYSTEM. Not scored."; return }
      $broad = @($acl.Access | Where-Object { "$($_.IdentityReference)" -match 'Users|Everyone|Authenticated Users' -and $_.AccessControlType -eq 'Allow' -and "$($_.RegistryRights)" -match 'Read|FullControl|WriteKey' } | ForEach-Object { "$($_.IdentityReference)" } | Select-Object -Unique)
      if ($broad.Count -eq 0) { Write-Output "PASS: the SAM account database ACL grants no read to broad principals." }
      else { Write-Output "FAIL: the SAM account database ACL grants read to broad principals: $($broad -join ', ')." }
    cleanup: ""

