id: em-04-credential-theft
product_line: av
name: "Endpoint Mastery 04 — Credential Theft Simulation"
description: >
  ENDPOINT MASTERY — Layer 4. Assesses whether endpoint controls prevent, detect or expose
  credential-theft techniques. Covers LSASS protection, Credential Guard and VBS, LSA protected
  process and packages, SAM and SECURITY hive protection, DPAPI, Windows Credential Manager,
  cached domain credentials, Kerberos credential protection, credential delegation and
  authentication settings, and security tooling coverage.
  VERDICTS: PASS = the control is effective or the access is denied. FAIL = the control is
  missing, misconfigured, or access is granted. SKIP = not applicable or not assessable here,
  with an explicit reason; SKIP is not scored. ERROR = the check could not complete.
  SAFETY: read-only configuration checks and access-control probes. No credential is read,
  dumped, extracted or displayed. Process probes request rights only and close the handle.
  Registry and DPAPI checks read ACLs and counts, never values or contents. Credential Manager
  reports counts only. A denied probe is not proof of a specific control; the cause is assessed
  by the separate protection checks.
author: Audspect Research
executable: true
supported_os: [windows]
tags:
  - endpoint-mastery
  - em-layer-4
  - credential-access
  - lsass
mitre_phases:
  - credential-access
live_policy:
  block_on_domain_controller: true
  require_dc_reachable: false

steps:
  - name: "LSASS PROCESS_VM_READ access probe (handle only, no memory read)"
    technique_id: T1003.001
    framework: custom
    executor: powershell
    requires_priv: admin
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Requests a PROCESS_VM_READ handle to lsass.exe, then closes it. No memory is read, written or dumped."
    telemetry:
      - "Read-only configuration or access-control evaluation; EDR and SIEM see the PowerShell or registry read"
    detection:
      - "Audit and EDR telemetry for the registry, service or process access this check makes"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $id = [Security.Principal.WindowsIdentity]::GetCurrent()
      $isAdmin = (New-Object Security.Principal.WindowsPrincipal $id).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
      if (-not $isAdmin) { Write-Output "SKIP: insufficient privilege; the handle probe needs an elevated context and is not meaningful without one."; return }
      $sig = @'
      using System;
      using System.Runtime.InteropServices;
      public static class BasAcc {
        [StructLayout(LayoutKind.Sequential, Pack=1)] public struct TP { public int Count; public long Luid; public int Attr; }
        [DllImport("kernel32.dll", SetLastError=true)] public static extern IntPtr OpenProcess(uint a, bool i, int pid);
        [DllImport("kernel32.dll", SetLastError=true)] public static extern bool CloseHandle(IntPtr h);
        [DllImport("kernel32.dll")] public static extern IntPtr GetCurrentProcess();
        [DllImport("advapi32.dll", SetLastError=true)] public static extern bool OpenProcessToken(IntPtr p, uint a, ref IntPtr t);
        [DllImport("advapi32.dll", SetLastError=true, CharSet=CharSet.Unicode)] public static extern bool LookupPrivilegeValue(string s, string n, ref long l);
        [DllImport("advapi32.dll", SetLastError=true)] public static extern bool AdjustTokenPrivileges(IntPtr t, bool d, ref TP n, int l, IntPtr p, IntPtr r);
      }
      '@
      try { Add-Type -TypeDefinition $sig -ErrorAction Stop } catch { Write-Output "SKIP: could not compile the access probe on this host."; return }
      $tok = [IntPtr]::Zero; $luid = [long]0
      if (-not [BasAcc]::OpenProcessToken([BasAcc]::GetCurrentProcess(), 0x0028, [ref]$tok)) { Write-Output "SKIP: the process token cannot be opened, so SeDebugPrivilege cannot be enabled; the handle result would not be comparable."; return }
      [void][BasAcc]::LookupPrivilegeValue($null, 'SeDebugPrivilege', [ref]$luid)
      $tp = New-Object -TypeName 'BasAcc+TP'
      $tp.Count = 1; $tp.Luid = $luid; $tp.Attr = 2
      $adj = [BasAcc]::AdjustTokenPrivileges($tok, $false, [ref]$tp, 0, [IntPtr]::Zero, [IntPtr]::Zero)
      $adjErr = [Runtime.InteropServices.Marshal]::GetLastWin32Error()
      [void][BasAcc]::CloseHandle($tok)
      if (-not $adj -or $adjErr -ne 0) { Write-Output "SKIP: SeDebugPrivilege could not be enabled for this context (Win32 error $adjErr); the handle result would not be comparable."; return }
      $lsass = Get-Process lsass -ErrorAction SilentlyContinue | Select-Object -First 1
      if (-not $lsass) { Write-Output "SKIP: lsass.exe is not running."; return }
      $h = [BasAcc]::OpenProcess(0x0010, $false, $lsass.Id)
      if ($h -ne [IntPtr]::Zero) { [void][BasAcc]::CloseHandle($h); Write-Output "FAIL: a PROCESS_VM_READ handle to lsass.exe was GRANTED with SeDebugPrivilege enabled. LSASS memory is reachable at this privilege. No memory was read." }
      else { $err = [Runtime.InteropServices.Marshal]::GetLastWin32Error(); Write-Output "PASS: PROCESS_VM_READ to lsass.exe was DENIED with SeDebugPrivilege enabled (Win32 error $err). This is an access-control result only; the cause is not attributed here (see the protection checks)." }
    cleanup: ""

  - name: "LSASS process is a single running instance"
    technique_id: T1003.001
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Counts lsass.exe processes. Read-only."
    telemetry:
      - "Read-only configuration or access-control evaluation; EDR and SIEM see the PowerShell or registry read"
    detection:
      - "Audit and EDR telemetry for the registry, service or process access this check makes"
    command: |
      $p = @(Get-Process lsass -ErrorAction SilentlyContinue)
      if ($p.Count -eq 1) { Write-Output "PASS: exactly one lsass.exe process is running (PID $($p[0].Id))." }
      elseif ($p.Count -eq 0) { Write-Output "FAIL: lsass.exe is not running." }
      else { Write-Output "FAIL: $($p.Count) lsass.exe processes are running; a second instance is anomalous." }
    cleanup: ""

  - name: "LSA protected process (RunAsPPL) configured"
    technique_id: T1003.001
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Reads the RunAsPPL registry value. Read-only."
    telemetry:
      - "Read-only configuration or access-control evaluation; EDR and SIEM see the PowerShell or registry read"
    detection:
      - "Audit and EDR telemetry for the registry, service or process access this check makes"
    command: |
      $v = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name RunAsPPL -ErrorAction SilentlyContinue).RunAsPPL
      if ($v -eq 1 -or $v -eq 2) { Write-Output "PASS: LSA protected process is configured (RunAsPPL=$v; $(if ($v -eq 2) {'UEFI-locked'} else {'registry-configured, not UEFI-locked'}))." }
      else { Write-Output "FAIL: LSA protected process is not configured (RunAsPPL=$(if ($null -eq $v) {'absent'} else {$v}))." }
    cleanup: ""

  - name: "Credential Guard is running"
    technique_id: T1003.001
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Reads Win32_DeviceGuard. Read-only."
    telemetry:
      - "Read-only configuration or access-control evaluation; EDR and SIEM see the PowerShell or registry read"
    detection:
      - "Audit and EDR telemetry for the registry, service or process access this check makes"
    command: |
      try { $dg = Get-CimInstance -ClassName Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard -ErrorAction Stop } catch { Write-Output "SKIP: Win32_DeviceGuard is not available on this host."; return }
      $run = @($dg.SecurityServicesRunning)
      if ($run -contains 1) { Write-Output "PASS: Credential Guard is RUNNING (SecurityServicesRunning=$($run -join ','))." }
      else { Write-Output "FAIL: Credential Guard is not running (SecurityServicesRunning=$(if ($run.Count) {$run -join ','} else {'none'}))." }
    cleanup: ""

  - name: "Credential Guard is configured (LsaCfgFlags)"
    technique_id: T1003.001
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
