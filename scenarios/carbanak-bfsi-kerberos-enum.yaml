id: carbanak-bfsi-kerberos-enum
product_line: killchain
name: Carbanak BFSI Kerberos Service Account Enumeration (Item 17)
description: >
  Lists accounts that have a service principal name (the Kerberoasting target
  set). Only the LDAP query is performed; no service ticket is requested and
  no hash is obtained. Skips when the host is not domain-joined. [BAS-SIM-
  CARBANAK-S17] tagged. Grounded in MITRE ATT&CK T1558.003 (Steal or Forge
  Kerberos Tickets: Kerberoasting).
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - carbanak
  - bfsi
  - discovery
  - t1558
mitre_phases:
  - credential-access

live_policy:
  block_on_domain_controller: false
  require_dc_reachable: false
  max_spray_attempts: 0
  spray_account_allowlist: []
  execution_window: ""

steps:
  - name: "Carbanak Item 17 -- Kerberos Service Account Enumeration (T1558.003)"
    technique_id: T1558.003
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: lab-only
    production_safe: true
    risk: low
    blast_radius: "One read-only LDAP query for accounts with SPNs. No ticket is requested."
    reversible: true
    telemetry:
      - "Directory service LDAP query logging (EID 1644 where enabled)"
    detection:
      - "EDR/SIEM: LDAP enumeration of accounts with service principal names by a non-administrative process"
    threat_intel_sources:
      - reference: "MITRE ATT&CK -- T1558.003"
        url: "https://attack.mitre.org/techniques/T1558/003/"
    last_reviewed: "2026-11-21"
    family_attribution_confidence: reported
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $cs = Get-CimInstance Win32_ComputerSystem
      if (-not $cs.PartOfDomain) { Write-Output "EXEC 17: SKIPPED -- host is not domain-joined. [BAS-SIM-CARBANAK-S17]"; exit 0 }
      $searcher = [adsisearcher]'(&(objectCategory=user)(servicePrincipalName=*))'
      $searcher.PropertiesToLoad.Add('samaccountname') | Out-Null
      $accounts = @($searcher.FindAll())
      Write-Output "EXEC 17: $($accounts.Count) account(s) with an SPN found. LDAP query only; no ticket requested. [BAS-SIM-CARBANAK-S17]"
    cleanup: ""
