        Add-Content -Path $ledger -Value ($o | ConvertTo-Json -Compress -Depth 4) -Encoding UTF8
      }
      function Read-Ledger { if (Test-Path $ledger) { @(Get-Content $ledger | Where-Object { $_ } | ForEach-Object { $_ | ConvertFrom-Json }) } else { @() } }
      function Test-Port($h, $p) { try { $c = New-Object Net.Sockets.TcpClient; $a = $c.BeginConnect($h, $p, $null, $null); $ok = $a.AsyncWaitHandle.WaitOne(3000) -and $c.Connected; $c.Close(); return [bool]$ok } catch { return $false } }
      function Test-Channels($t) {
        $r = [ordered]@{ smb445=(Test-Port $t 445); admin=$false; winrm=$false; wmi=$false; scm=$false }
        if ($r.smb445) { $r.admin = [bool](Test-Path "\\$t\ADMIN`$") }
        try { Test-WSMan -ComputerName $t -ErrorAction Stop | Out-Null; $r.winrm = $true } catch { }
        $j = Start-Job -ScriptBlock { param($h) try { (Get-WmiObject Win32_OperatingSystem -ComputerName $h -ErrorAction Stop) -ne $null } catch { $false } } -ArgumentList $t
        if (Wait-Job $j -Timeout 15) { $r.wmi = [bool](Receive-Job $j) } else { Stop-Job $j }
        Remove-Job $j -Force
        $o = (& sc.exe "\\$t" query bas_probe_nonexistent 2>&1 | Out-String)
        if ($o -match '1060') { $r.scm = $true }
        return $r
      }
      $rows = Read-Ledger
      if ($rows.Count -eq 0) { Write-Output "SKIP: prerequisite missing (no L1 ledger for this run; L1 recorded nothing). [BAS-SIM-LAT-L4]"; return }
      $tg = @($rows | Where-Object { $_.step -eq 'L1' } | ForEach-Object { $_.target } | Sort-Object -Unique)
      $reach = @($rows | Where-Object { $_.step -eq 'L1' -and $_.result -eq 'reachable' } | ForEach-Object { $_.target } | Sort-Object -Unique)
      $exec = @($rows | Where-Object { $_.step -in 'L2','L3' -and $_.result -eq 'executed' } | ForEach-Object { $_.target } | Sort-Object -Unique)
      $gated = 0; foreach ($st in 'L2','L3') { $stRows = @($rows | Where-Object { $_.step -eq $st }); if ($stRows.Count -gt 0 -and @($stRows | Where-Object { $_.result -ne 'skipped_gate' }).Count -eq 0) { $gated++ } }
      $byChan = @{}; foreach ($r in @($rows | Where-Object { $_.step -eq 'L1' })) { foreach ($k in 'admin','winrm','wmi','scm') { if ($r.facts.$k) { $byChan[$k] = 1 + [int]$byChan[$k] } } }
      $chan = (($byChan.Keys | Sort-Object | ForEach-Object { "$_=$($byChan[$_])" }) -join ' ')
      Write-Output "EVIDENCE T1021.002: targets=$($tg.Count) reachable=$($reach.Count) executed_on=$($exec.Count) [$(($exec -join ','))] channels_open=[$chan] execution_steps_skipped_by_gate=$gated. Propagation is assessed from reachability and benign execution markers only; nothing was encrypted. [BAS-SIM-LAT-L4]"
      if ($exec.Count -ge 2) { Write-Output "FAIL: benign execution succeeded on $($exec.Count) targets - an attacker with this identity could propagate across at least that many hosts (blast radius $($exec.Count) of $($tg.Count)). [BAS-SIM-LAT-L4]" }
      elseif ($exec.Count -eq 1) { Write-Output "FAIL: benign execution succeeded on 1 target - lateral movement is possible; propagation to several hosts was not demonstrated with this target list. [BAS-SIM-LAT-L4]" }
      elseif ($reach.Count -gt 0 -and $gated -gt 0) { Write-Output "SKIP: $($reach.Count) target(s) are reachable but execution was not tested (gates not confirmed); blast radius is reachability-only. [BAS-SIM-LAT-L4]" }
      elseif ($reach.Count -gt 0) { Write-Output "PASS: $($reach.Count) target(s) were reachable but benign execution was blocked on all of them. [BAS-SIM-LAT-L4]" }
      else { Write-Output "PASS: no target accepted a remote administrative channel; propagation was not possible from this identity. [BAS-SIM-LAT-L4]" }
    cleanup: ""

  # ---------------------------------------------------------------------------
  - id: lat-l5-containment-response
    name: "Lateral Containment L5 - Containment and Response Validation (T1021.002)"
    technique_id: T1021.002
    detection_profiles:
      - windows_smb_lateral_probe
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 720
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    severity: high
    confidence: medium
    reversible: true
    blast_radius: "Waits BAS_CONTAINMENT_WAIT_SEC (default 60, max 600), re-probes the previously reachable targets and reads local isolation signals (firewall profiles, isolation-named rules, disabled adapters, EDR service state). Removes the BAS work directory and verifies removal."
    preconditions: ["Windows host.", "BAS_LATERAL_TARGETS lists lab hosts the operator owns.", "Steps L1-L5 run in order within one run."]
    postconditions: ["PASS, FAIL or SKIP with a stated reason; anything created on a target is removed and removal verified; L5 removes the work directory."]
    abort_on: []
    telemetry:
      - "Security EID 4624 type 3 and 5140/5145 on the target (admin share access)"
      - "System EID 7045 on the target (L3 transient service)"
    detection:
      - "EDR/SIEM: remote admin-share write, remote service creation and cross-host fan-out from one source within minutes"
    expected_telemetry_count: 1
    false_positive_notes: "Patching, software deployment and remote administration use the same channels; correlate with change windows and account."
    mitigations:
      - "Block SMB/WinRM/WMI between workstations; segment servers."
      - "LAPS / tiered administration so one identity is not admin everywhere."
      - "EDR network isolation and automated containment on lateral-movement detections."
    references: ["CISA #StopRansomware Guide"]
    evidence: ["Emit still_reachable, no_longer_reachable and cleanup_verified."]
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $runId = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0,[Math]::Min(8,$env:BAS_RUN_ID.Length)) } else { 'norun' }
      $work = Join-Path $env:TEMP "bas_lat_$runId"
      $ledger = Join-Path $work 'ledger.jsonl'
      $targets = @(); $badTargets = @()
      foreach ($t in @($env:BAS_LATERAL_TARGETS -split '[;,]' | ForEach-Object { $_.Trim() } | Where-Object { $_ })) { if ($t -match '^[A-Za-z0-9._-]{1,253}$') { $targets += $t } else { $badTargets += $t } }
      function Add-Ledger($step, $target, $result, $facts) {
        if (-not (Test-Path $work)) { return }
        $o = [ordered]@{ step=$step; target=$target; ts=(Get-Date).ToUniversalTime().ToString('o'); result=$result; facts=$facts }
        Add-Content -Path $ledger -Value ($o | ConvertTo-Json -Compress -Depth 4) -Encoding UTF8
      }
      function Read-Ledger { if (Test-Path $ledger) { @(Get-Content $ledger | Where-Object { $_ } | ForEach-Object { $_ | ConvertFrom-Json }) } else { @() } }
      function Test-Port($h, $p) { try { $c = New-Object Net.Sockets.TcpClient; $a = $c.BeginConnect($h, $p, $null, $null); $ok = $a.AsyncWaitHandle.WaitOne(3000) -and $c.Connected; $c.Close(); return [bool]$ok } catch { return $false } }
      function Test-Channels($t) {
        $r = [ordered]@{ smb445=(Test-Port $t 445); admin=$false; winrm=$false; wmi=$false; scm=$false }
        if ($r.smb445) { $r.admin = [bool](Test-Path "\\$t\ADMIN`$") }
        try { Test-WSMan -ComputerName $t -ErrorAction Stop | Out-Null; $r.winrm = $true } catch { }
        $j = Start-Job -ScriptBlock { param($h) try { (Get-WmiObject Win32_OperatingSystem -ComputerName $h -ErrorAction Stop) -ne $null } catch { $false } } -ArgumentList $t
        if (Wait-Job $j -Timeout 15) { $r.wmi = [bool](Receive-Job $j) } else { Stop-Job $j }
        Remove-Job $j -Force
        $o = (& sc.exe "\\$t" query bas_probe_nonexistent 2>&1 | Out-String)
        if ($o -match '1060') { $r.scm = $true }
        return $r
      }
      $rows = Read-Ledger
      if ($rows.Count -eq 0) { Write-Output "SKIP: prerequisite missing (no ledger for this run). [BAS-SIM-LAT-L5]"; if (Test-Path $work) { Remove-Item $work -Recurse -Force }; return }
      $reach = @($rows | Where-Object { $_.step -eq 'L1' -and $_.result -eq 'reachable' } | ForEach-Object { $_.target } | Sort-Object -Unique)
      $wait = 60; if ($env:BAS_CONTAINMENT_WAIT_SEC) { $w = 0; if ([int]::TryParse($env:BAS_CONTAINMENT_WAIT_SEC, [ref]$w) -and $w -ge 0) { $wait = [Math]::Min($w, 600) } }
      if ($reach.Count -eq 0) { Remove-Item $work -Recurse -Force; Write-Output "SKIP: nothing was reachable in L1, so there is nothing to contain (cleanup_verified=$(-not (Test-Path $work))). [BAS-SIM-LAT-L5]"; return }
      Start-Sleep -Seconds $wait
      $still = @(); $dropped = @()
      foreach ($t in $reach) { $r = Test-Channels $t; if ($r.admin -or $r.wmi -or $r.scm -or $r.winrm) { $still += $t } else { $dropped += $t } }
      $fw = @(Get-NetFirewallProfile -ErrorAction SilentlyContinue | Where-Object { $_.Enabled -eq 'True' }).Count
      $isoRules = @(Get-NetFirewallRule -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -match '(?i)isolat|quarantin' -and $_.DisplayName -notmatch '(?i)HNS|Container|Hyper-V|Sandbox|Application Guard' -and $_.Enabled -eq 'True' }).Count
      $adaptersDown = @(Get-NetAdapter -ErrorAction SilentlyContinue | Where-Object { $_.Status -eq 'Disabled' }).Count
      $edr = @(Get-Service -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^(CSFalconService|SentinelAgent|MsSense|CylanceSvc|CbDefense|xagt|CarbonBlack|elastic-endpoint|TaniumClient)' } | ForEach-Object { "$($_.Name)=$($_.Status)" })
      Remove-Item $work -Recurse -Force
      $clean = -not (Test-Path $work)
      Write-Output "EVIDENCE T1021.002: waited_sec=$wait previously_reachable=$($reach.Count) still_reachable=$($still.Count) [$(($still -join ','))] no_longer_reachable=$($dropped.Count) [$(($dropped -join ','))] firewall_profiles_on=$fw isolation_named_firewall_rules=$isoRules adapters_disabled=$adaptersDown edr_services=[$(($edr -join ','))] cleanup_verified=$clean. These are endpoint-visible signals only; a drop in reachability cannot be attributed to containment versus other causes, and EDR-side status is not queried. [BAS-SIM-LAT-L5]"
      if (-not $clean) { Write-Output "WARNING: work directory $work remains; remove it manually. [BAS-SIM-LAT-L5]" }
      if ($dropped.Count -gt 0 -and $still.Count -eq 0) { Write-Output "PASS: all $($dropped.Count) previously reachable target(s) were no longer reachable after $wait s - consistent with containment or isolation (cause not attributable from the endpoint). [BAS-SIM-LAT-L5]" }
      elseif ($dropped.Count -gt 0) { Write-Output "FAIL: only $($dropped.Count) of $($reach.Count) previously reachable target(s) dropped; $($still.Count) remained reachable after $wait s - containment was partial or absent. [BAS-SIM-LAT-L5]" }
      else { Write-Output "FAIL: every previously reachable target ($($reach.Count)) was still reachable $wait s after the lateral-movement attempts - no containment was observed. [BAS-SIM-LAT-L5]" }
    cleanup: |
      $id = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0,[Math]::Min(8,$env:BAS_RUN_ID.Length)) } else { 'norun' }
      Remove-Item (Join-Path $env:TEMP "bas_lat_$id") -Recurse -Force -ErrorAction SilentlyContinue
