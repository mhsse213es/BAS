id: ad-pass-the-ticket-telemetry
product_line: ad
name: Pass-the-Ticket Detection Telemetry Probe
description: >
  Read-only visibility probe for Pass-the-Ticket detection. It does NOT export, forge,
  request, or reuse any Kerberos ticket, and it carries no attack tooling. It checks two
  things that a pass-the-ticket detection depends on:
    1. Kerberos ticket-lifetime policy on the host (observation only).
    2. Kerberos events on the domain controller in the last 30 minutes: ticket grants
       (4768), service-ticket requests (4769), and Kerberos network logons (4624, type 3,
       Kerberos package).
  A policy observation is never PASS. The telemetry stage reports PASS only when the
  events are visible, which proves logging, not that a ticket reuse would be alerted on.

  KILL CHAIN STAGES:
    1. Kerberos ticket-lifetime posture (T1550.003)
    2. Kerberos ticket event visibility on the DC (T1550.003)

  SAFETY: Read-only. No ticket is read, exported, requested for another identity, or used.
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - pass-the-ticket
  - kerberos
  - active-directory
  - detection
  - t1550
  - mitre
mitre_phases:
  - lateral-movement
  - defense-evasion

live_policy:
  block_on_domain_controller: false
  require_dc_reachable: true
  max_spray_attempts: 0
  spray_account_allowlist: []
  execution_window: ""

steps:

  # ---------------------------------------------------------------------------
  # Stage 1 — Kerberos ticket-lifetime posture (T1550.003)
  # ---------------------------------------------------------------------------
  - name: "PtT 1 — Kerberos Ticket-Lifetime Posture (T1550.003)"
    technique_id: T1550.003
    framework: custom
    executor: powershell
    requires_priv: domain_admin
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Reads MaxTicketAge and MaxRenewAge under HKLM\\SYSTEM\\CurrentControlSet\\Services\\Kerberos\\Parameters and the domain Kerberos policy values if present. Changes nothing."
    telemetry:
      - "PowerShell EID 4104 for the registry reads"
    detection:
      - "Config-audit: reads of Kerberos lifetime policy — not an attack indicator on its own"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $kp = 'HKLM:\SYSTEM\CurrentControlSet\Services\Kerberos\Parameters'
      $maxTicket = (Get-ItemProperty -Path $kp -Name 'MaxTicketAge').MaxTicketAge
      $maxRenew  = (Get-ItemProperty -Path $kp -Name 'MaxRenewAge').MaxRenewAge
      Write-Output "EXEC T1550.003: Kerberos lifetime values (hours, blank = not defined, default applies): MaxTicketAge=$maxTicket; MaxRenewAge=$maxRenew. Values read only. [BAS-SIM-PTT-S1]"
      Write-Output "SKIP: policy observation only. A lifetime setting does not prove ticket reuse was blocked or detected, so no verdict on detection is claimed. [BAS-SIM-PTT-S1]"
    cleanup: ""

  # ---------------------------------------------------------------------------
  # Stage 2 — Kerberos event visibility on the DC (T1550.003)
  # ---------------------------------------------------------------------------
  - name: "PtT 2 — Kerberos Ticket and Logon Events Visible on the DC (T1550.003)"
    technique_id: T1550.003
    framework: custom
    executor: powershell
    requires_priv: domain_admin
    timeout_sec: 90
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Reads Security log events 4768, 4769 and 4624 from the last 30 minutes and counts them. Changes nothing."
    telemetry:
      - "Security EID 4768, 4769, and 4624 (LogonType 3, Kerberos package) on the DC: the events this stage counts"
    detection:
      - "SIEM: one ticket used from several hosts, or a ticket reused from an unexpected source — pass-the-ticket indicator"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      if ((Get-CimInstance Win32_ComputerSystem).DomainRole -lt 4) {
        Write-Output "SKIP: not a domain controller. Events not read. [BAS-SIM-PTT-S2]"
        exit 0
      }
      $since = (Get-Date).AddMinutes(-30)
      $tgt = @(Get-WinEvent -FilterHashtable @{ LogName='Security'; Id=4768; StartTime=$since } -MaxEvents 5000 -ErrorAction SilentlyContinue).Count
      $svc = @(Get-WinEvent -FilterHashtable @{ LogName='Security'; Id=4769; StartTime=$since } -MaxEvents 5000 -ErrorAction SilentlyContinue).Count
      $krbLogon = 0
      foreach ($e in @(Get-WinEvent -FilterHashtable @{ LogName='Security'; Id=4624; StartTime=$since } -MaxEvents 5000 -ErrorAction SilentlyContinue)) {
        $x = [xml]$e.ToXml()
        $type = ($x.Event.EventData.Data | Where-Object { $_.Name -eq 'LogonType' }).'#text'
        $pkg  = ($x.Event.EventData.Data | Where-Object { $_.Name -eq 'AuthenticationPackageName' }).'#text'
        if ($type -eq '3' -and $pkg -eq 'Kerberos') { $krbLogon++ }
      }
      Write-Output "EXEC T1550.003: in last 30 minutes: TGT requests (4768)=$tgt; service-ticket requests (4769)=$svc; Kerberos network logons (4624, type 3)=$krbLogon. Counts only. [BAS-SIM-PTT-S2]"
      if (($tgt + $svc + $krbLogon) -gt 0) {
        Write-Output "PASS: Kerberos ticket and logon events are visible on the DC. Logging only; a ticket-reuse alert needs a SIEM rule and is not checked here."
      } else {
        Write-Output "SKIP: no Kerberos events in the last 30 minutes. Inconclusive. [BAS-SIM-PTT-S2]"
      }
    cleanup: ""
