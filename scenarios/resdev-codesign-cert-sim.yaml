id: resdev-codesign-cert-sim
product_line: killchain
name: Resource Development -- Self-Signed Code-Signing Certificate Simulation (T1588.003)
description: >
  Simulates an operator preparing a code-signing certificate for a lookalike publisher name. The step
  creates a self-signed certificate in the current user's store, for a synthetic publisher, and removes
  it in cleanup. The certificate is not issued by any certificate authority and is not trusted by any
  system beyond this host.

  SAFETY: self-signed only; synthetic subject ("CN=Examplebank Synthetic Publisher"); current user store;
  removed by cleanup. No CA request, no signing of any file.

  Grounded in MITRE ATT&CK T1588.003 (Obtain Capabilities: Code Signing Certificates).
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - resource-development
  - t1588
mitre_phases:
  - resource-development
live_policy:
  block_on_domain_controller: false
  require_dc_reachable: false
  max_spray_attempts: 0
  spray_account_allowlist: []
  execution_window: ""
steps:
  - name: "Resource Development -- Self-Signed Code-Signing Certificate (T1588.003)"
    technique_id: T1588.003
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: lab-only
    production_safe: true
    risk: low
    blast_radius: "Adds one self-signed certificate to the current user's certificate store. Removed in cleanup."
    reversible: true
    telemetry:
      - "Windows security event for certificate store changes, if auditing is enabled"
      - "Sysmon EID 1 for the PowerShell process"
    detection:
      - "EDR: code-signing certificate created by a non-administrative process"
    last_reviewed: "2026-11-23"
    command: |
      $ErrorActionPreference = 'Stop'
      $cert = New-SelfSignedCertificate -Subject 'CN=Examplebank Synthetic Publisher' `
        -Type CodeSigningCert -CertStoreLocation 'Cert:\CurrentUser\My' -NotAfter (Get-Date).AddDays(1)
      $thumb = $cert.Thumbprint
      Set-Content -LiteralPath (Join-Path $env:TEMP 'bas_resdev_cert_thumb.txt') -Value $thumb
      Write-Output "EXEC resdev T1588.003: self-signed code-signing certificate created in CurrentUser store (thumbprint $thumb). [BAS-SIM-RESDEV-CERT]"
    cleanup: |
      $f = Join-Path $env:TEMP 'bas_resdev_cert_thumb.txt'
      if (Test-Path -LiteralPath $f) {
        $t = (Get-Content -LiteralPath $f -Raw).Trim()
        Get-ChildItem -Path 'Cert:\CurrentUser\My' | Where-Object { $_.Thumbprint -eq $t } | Remove-Item -Force -ErrorAction SilentlyContinue
        Remove-Item -LiteralPath $f -Force -ErrorAction SilentlyContinue
      }
