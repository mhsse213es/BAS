id: linux-discovery
name: Linux Discovery  -  Host, Network, User, Process Enumeration
description: >
  Linux post-compromise discovery simulation using Atomic Red Team atomics.
  Covers the reconnaissance techniques an adversary runs immediately after
  landing on a Linux system: host identification, network topology mapping,
  user and group enumeration, process listing, and service discovery.

  Each technique runs ALL available Linux atomics (depth mode).

  Expected verdicts:
    PASS  = auditd/SIEM detected the discovery activity
    FAIL  = enumeration completed without generating an alert
    SKIP  = atomic requires a tool not installed on the test host

  Note: discovery techniques are almost always FAIL in an unconfigured SIEM.
  Use this scenario to tune your detection rules (process ancestry, command
  argument matching on id/uname/ip/netstat/ss/ps/find patterns).
author: Audspect Research
executable: true
supported_os: [linux]
tags:
  - discovery
  - linux
  - art
  - atomic-red-team
  - t1016
  - t1049
  - t1057
  - t1082
  - t1083
  - mitre-attack
mitre_phases:
  - discovery

art_techniques:
  - T1082       # System Information Discovery (uname, hostname, lscpu)
  - T1016       # System Network Configuration Discovery (ip, ifconfig, route)
  - T1049       # System Network Connections Discovery (ss, netstat, lsof)
  - T1057       # Process Discovery (ps, top, /proc enumeration)
  - T1083       # File and Directory Discovery (find, ls -la, locate)
  - T1087.001   # Local Account Discovery (/etc/passwd, getent, id)
  - T1087.002   # Domain Account Discovery (getent group, ldapsearch)
  - T1018       # Remote System Discovery (ping sweep, arp -a)
