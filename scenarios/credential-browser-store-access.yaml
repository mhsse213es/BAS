id: credential-browser-store-access
product_line: dlp
name: Browser Credential Store Access Probe
description: >
  Telemetry-safe emulation of an adversary trying to open a browser's saved-login
  database. The scenario checks for the Chrome, Edge and Firefox login stores and
  attempts to open each one for read with shared access, then closes it at once.
  No byte is read, nothing is copied, and nothing is decrypted. The open attempt is
  the signal: a real collector reads these files, and the scenario tests whether
  the attempt is noticed. Browser profile discovery is covered separately by
  collection-browser-cloud-email-discovery.

  KILL CHAIN STAGES:
    1. Login Store Access Attempt — open each browser login store read-only and close it, reading no bytes (T1555.003)

  SAFETY: No byte is read from any store. Each file is opened with shared read and
  closed immediately. Nothing is copied, decrypted, or sent. Stores that are locked
  by a running browser are reported as locked. Windows only. Telemetry mode.
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - credentials
  - browser
  - credential-store
  - detection
  - t1555
  - mitre
mitre_phases:
  - credential-access

live_policy:
  block_on_domain_controller: true
  require_dc_reachable: false
  max_spray_attempts: 0
  spray_account_allowlist: []
  execution_window: ""

steps:

  # ---------------------------------------------------------------------------
  # Stage 1 — Login Store Access Attempt (T1555.003)
  # ---------------------------------------------------------------------------
  - name: "Browser Store 1 — Read-Only Open Attempt on Login Stores (T1555.003)"
    technique_id: T1555.003
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "For each present login store (Chrome and Edge 'Login Data', Firefox 'logins.json'), opens the file with FileShare.ReadWrite and closes it at once. No byte is read. A file locked by a running browser is reported as locked, not forced open."
    telemetry:
      - "Security EID 4663: file access on login stores, when auditing is enabled"
      - "Sysmon EID 1: powershell.exe with access to browser profile paths"
    detection:
      - "EDR: a non-browser process opened a browser login store — credential-theft IOC"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $stores = @(
        (Join-Path $env:LOCALAPPDATA 'Google\Chrome\User Data\Default\Login Data'),
        (Join-Path $env:LOCALAPPDATA 'Microsoft\Edge\User Data\Default\Login Data'),
        (Join-Path $env:APPDATA 'Mozilla\Firefox\Profiles')
      )
      $present = 0; $opened = 0; $locked = 0
      foreach ($s in $stores) {
        if ($s -like '*Firefox*') {
          $files = @(Get-ChildItem -Path $s -Recurse -Filter 'logins.json' -Depth 2 -ErrorAction SilentlyContinue)
        } elseif (Test-Path $s) {
          $files = @(Get-Item $s)
        } else {
          $files = @()
        }
        foreach ($f in $files) {
          $present++
          try {
            $fs = [System.IO.File]::Open($f.FullName, 'Open', 'Read', 'ReadWrite')
            $opened++
            $fs.Close()
          } catch {
            $locked++
          }
        }
      }
      Write-Output "EXEC T1555.003: login stores present=$present, opened read-only=$opened, locked=$locked. No byte was read. Browser store Stage 1. [BAS-SIM-BRS-S1]"
      if ($opened -gt 0) {
        Write-Output "FAIL: A non-browser process opened a browser login store with no alert. This is an active credential-theft precursor."
      } elseif ($present -gt 0) {
        Write-Output "SKIP: Login stores are present but every open attempt was locked, so the access was not established either way. Inconclusive. [BAS-SIM-BRS-S1]"
      } else {
        Write-Output "PASS: No browser login store was present on this host."
      }
    cleanup: ""
