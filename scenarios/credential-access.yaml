id: credential-access
name: Credential Access — LSA Secrets, Credential Manager, Kerberos, NTLM (Phase 4)
description: >
  Phase 4 — Credential Access validation. Five production-safe steps covering
  credential attack surfaces not addressed by em-04-credential-theft:

    1. T1003.004  LSA Secrets registry access — attempts to open
       HKLM\SECURITY\Policy\Secrets (requires SYSTEM; expected to FAIL on a
       hardened host). Generates Security EID 4663 audit event regardless.
    2. T1555.004  Windows Credential Manager enumeration — cmdkey /list
       reveals stored generic/domain/certificate credentials visible to the
       current user context. High-value for lateral movement enumeration.
    3. T1003.005  Cached domain credentials check — probes HKLM\SECURITY\Cache
       key count to determine how many domain logon caches are stored
       (DomainCachedCredentials2, NL$x). BFSI compliance requires Cache=0.
    4. T1558      Kerberos ticket inventory — klist + WindowsIdentity Kerberos
       ticket enumeration. Checks TGT expiry window, RC4 vs AES encryption
       type (RC4 = Kerberoastable), and SPN exposure via setspn.
    5. T1550.002  NTLM authentication posture — tests whether NTLMv1/LM
       authentication is enabled (registry probe) and whether loopback SMB
       negotiates NTLM (triggers Security EID 4624 Type 3 from 127.0.0.1).

  SAFETY: no hashes extracted, no memory dumped, no creds written to disk.
  All steps are read-only posture checks or intentionally failing access
  attempts that generate telemetry. Windows only. [BAS-SIM] tagged.
  VERDICTS: FAIL = a control weakness is exposed (e.g. RC4 enabled, NTLMv1
  allowed, LSA Secrets accessible). PASS = the control blocks or restricts.
author: Audspect Research
executable: true
local_check: true
supported_os: [windows]
tags:
  - credential-access
  - lsa-secrets
  - credential-manager
  - kerberos
  - ntlm
  - phase4
  - t1003
  - t1550
  - t1555
  - t1558
  - mitre
mitre_phases:
  - credential-access

live_policy:
  block_on_domain_controller: false
  require_dc_reachable: false
  max_spray_attempts: 0
  spray_account_allowlist: []
  execution_window: ""

steps:

  # ---------------------------------------------------------------------------
  # 1. LSA Secrets registry access attempt (T1003.004)
  # ---------------------------------------------------------------------------
  - name: "LSA Secrets Registry Access — HKLM\\SECURITY\\Policy\\Secrets (T1003.004)"
    technique_id: T1003.004
    framework: custom
    executor: powershell
    timeout_sec: 20
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    blast_radius: "Attempts to open HKLM\\SECURITY\\Policy\\Secrets via .NET Registry API. Will be denied on any non-SYSTEM context (ACCESS_DENIED). Generates Security EID 4663 (object access audit) and Sysmon EID 13 (registry value set, if auditing is on). No data read even if allowed."
    reversible: true
    telemetry:
      - "Security EID 4663: Object Access audit on SECURITY\\Policy\\Secrets (if SACL audit is enabled)"
      - "Sysmon EID 12/13: registry key open attempt on HKLM\\SECURITY\\Policy\\Secrets"
    detection:
      - "SIEM: registry access to HKLM\\SECURITY\\Policy\\Secrets from non-SYSTEM process  -  Sigma rule win_security_lsa_secrets_dump.yml"
      - "EDR: PowerShell opening SECURITY hive keys  -  T1003.004 canonical access pattern"
      - "Defender: LSA secret path accessed by non-privileged process"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $target = 'HKLM:\SECURITY\Policy\Secrets'
      $accessible = $false
      $keyCount = 0
      try {
        $key = [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey('SECURITY\Policy\Secrets', $false)
        if ($key) {
          $accessible = $true
          $keyCount = $key.SubKeyCount
          $key.Close()
        }
      } catch { $accessible = $false }
      # Also test via PowerShell provider (generates different audit event path)
      $psAccessible = $false
      try { if (Get-Item -Path $target -ErrorAction Stop) { $psAccessible = $true } } catch {}
      if ($accessible -or $psAccessible) {
        Write-Output "FAIL: HKLM\SECURITY\Policy\Secrets is READABLE from current context ($keyCount sub-keys). LSA secrets are exposed. This requires SYSTEM or SeSecurityPrivilege — investigate token elevation path. [BAS-SIM-LSA]"
      } else {
        Write-Output "PASS: HKLM\SECURITY\Policy\Secrets ACCESS DENIED  -  current token lacks required privilege. Security EID 4663 audit expected. [BAS-SIM-LSA]"
      }
    cleanup: ""

  # ---------------------------------------------------------------------------
  # 2. Windows Credential Manager vault enumeration (T1555.004)
  # ---------------------------------------------------------------------------
  - name: "Credential Manager Vault Enumeration — cmdkey /list (T1555.004)"
    technique_id: T1555.004
    framework: custom
    executor: powershell
    timeout_sec: 20
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    blast_radius: "Runs cmdkey /list to enumerate stored Windows Credentials visible to the current user. Lists credential types (generic/domain/certificate), target names, and usernames. No passwords retrieved. Generates Sysmon EID 1: cmdkey.exe process create."
    reversible: true
    telemetry:
      - "Sysmon EID 1: cmdkey.exe with /list argument"
      - "Security EID 4688: cmdkey.exe spawned by powershell.exe"
    detection:
      - "EDR: cmdkey.exe /list invoked by non-admin outside password-manager context  -  Sigma rule proc_creation_win_cmdkey_recon.yml"
      - "SIEM: cmdkey.exe invoked by PowerShell parent  -  credential enumeration recon IOC"
      - "EDR: cmdkey.exe at unusual time-of-day or from unexpected process ancestry"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $output = & cmdkey.exe /list 2>&1
      $lines = ($output | Out-String).Trim() -split '\r?\n'
      # Parse out credential targets (not passwords — cmdkey /list never shows passwords)
      $targets = $lines | Where-Object { $_ -match 'Target:|Benutzer:|User:|Typ:|Type:' }
      $credCount = ($lines | Where-Object { $_ -match 'Target:' }).Count
      if ($credCount -gt 0) {
        Write-Output "EXEC T1555.004: cmdkey /list found $credCount stored credential(s)."
        $targets | ForEach-Object { Write-Output "  $_" }
        Write-Output "FAIL: Credential Manager contains stored credentials visible to current user — review each target for lateral-movement value. Stored domain creds are high-value. Sysmon EID 1 cmdkey.exe logged. [BAS-SIM-CREDMGR]"
      } else {
        Write-Output "PASS: No stored credentials found in Windows Credential Manager for current user context. [BAS-SIM-CREDMGR]"
      }
    cleanup: ""

  # ---------------------------------------------------------------------------
  # 3. Cached domain credentials check (T1003.005)
  # ---------------------------------------------------------------------------
  - name: "Cached Domain Credentials Count — HKLM\\SECURITY\\Cache (T1003.005)"
    technique_id: T1003.005
    framework: custom
    executor: powershell
    timeout_sec: 20
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    blast_radius: "Reads HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\CachedLogonsCount (public, user-readable) to determine how many domain logon caches are configured. Cross-checks whether HKLM\\SECURITY\\Cache sub-keys are accessible (requires SYSTEM; expected denied). Generates Sysmon EID 13 for the LSA registry read."
    reversible: true
    telemetry:
      - "Sysmon EID 13: HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa value read"
      - "Sysmon EID 12: HKLM\\SECURITY\\Cache open attempt"
    detection:
      - "SIEM: CachedLogonsCount > 0 combined with domain-joined host  -  offline crack surface exposed"
      - "EDR: SECURITY\\Cache access attempt from non-SYSTEM process  -  cached-credential enumeration IOC"
      - "Sigma: registry access to HKLM\\SECURITY\\Cache"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      # CachedLogonsCount is world-readable from SYSTEM hive (not SECURITY hive)
      $cachedCount = 0
      try {
        $val = Get-ItemPropertyValue -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name 'CachedLogonsCount' -ErrorAction Stop
        $cachedCount = [int]$val
      } catch { $cachedCount = -1 }
      # Attempt SECURITY\Cache access — will be denied on hardened host
      $cacheAccessible = $false
      $nlEntries = 0
      try {
        $cacheKey = [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey('SECURITY\Cache', $false)
        if ($cacheKey) {
          $cacheAccessible = $true
          $nlEntries = ($cacheKey.GetValueNames() | Where-Object { $_ -match '^NL\$' }).Count
          $cacheKey.Close()
        }
      } catch {}
      $isDomainJoined = (Get-WmiObject Win32_ComputerSystem -ErrorAction SilentlyContinue).PartOfDomain
      if ($cachedCount -gt 0) {
        Write-Output "FAIL: CachedLogonsCount=$cachedCount — domain credential hashes are cached on disk. Offline extraction possible if disk is accessed without EDR. BFSI/compliance requires CachedLogonsCount=0 for high-security workstations. [BAS-SIM-CACHE]"
      } elseif ($cachedCount -eq 0) {
        Write-Output "PASS: CachedLogonsCount=0 — no domain credential caches stored. [BAS-SIM-CACHE]"
      } else {
        Write-Output "SKIP: CachedLogonsCount registry value not readable."
      }
      if ($cacheAccessible) {
        Write-Output "FAIL: HKLM\\SECURITY\\Cache accessible ($nlEntries NL entries) — SYSTEM-level access detected or misconfigured DACL. Investigate immediately."
      } else {
        Write-Output "PASS: HKLM\\SECURITY\\Cache access denied from current token. [BAS-SIM-CACHE]"
      }
      Write-Output "Context: DomainJoined=$isDomainJoined CachedLogonsCount=$cachedCount"
    cleanup: ""

  # ---------------------------------------------------------------------------
  # 4. Kerberos ticket inventory (T1558)
  # ---------------------------------------------------------------------------
  - name: "Kerberos Ticket Inventory — TGT expiry, RC4 exposure, SPN surface (T1558)"
    technique_id: T1558
    framework: custom
    executor: powershell
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    blast_radius: "Runs klist to enumerate Kerberos tickets and checks encryption type (RC4-HMAC = 0x17 = Kerberoastable). Checks WindowsIdentity.GetCurrent() for Kerberos context. No ticket export, no memory read, no cracking. Generates Sysmon EID 1: klist.exe."
    reversible: true
    telemetry:
      - "Sysmon EID 1: klist.exe spawned by powershell.exe"
      - "Security EID 4688: klist.exe"
    detection:
      - "EDR: klist.exe invoked from PowerShell  -  Kerberos enumeration reconnaissance"
      - "SIEM: klist.exe at unusual time or from unusual parent  -  pre-pass-the-ticket recon IOC"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      # klist: lists Kerberos tickets for current logon session
      $klistOut = & klist 2>&1 | Out-String
      $hasKerberos = $klistOut -match 'Cached Tickets|#\d+>'
      $rc4Tickets = ($klistOut | Select-String 'RC4|0x17' -AllMatches).Matches.Count
      $aesTickets = ($klistOut | Select-String 'AES256|0x12' -AllMatches).Matches.Count
      # WindowsIdentity check for Kerberos vs NTLM auth
      $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent()
      $authType = $identity.AuthenticationType  # "Kerberos" / "NTLM" / "Negotiate"
      $isKerberos = $authType -eq 'Kerberos'
      if (-not $hasKerberos) {
        Write-Output "SKIP: No Kerberos tickets found (host may not be domain-joined or klist unavailable). Auth type: $authType [BAS-SIM-KERB]"
        return
      }
      Write-Output "EXEC T1558: Kerberos ticket inventory complete. Auth=$authType RC4_tickets=$rc4Tickets AES256_tickets=$aesTickets. Sysmon EID 1 klist.exe. [BAS-SIM-KERB]"
      if ($rc4Tickets -gt 0) {
        Write-Output "FAIL: $rc4Tickets RC4-HMAC (0x17) ticket(s) found — RC4 encryption is enabled on one or more SPNs. These accounts are vulnerable to Kerberoasting (offline hash crack). Enforce AES256 on all service accounts via msDS-SupportedEncryptionTypes=24."
      } else {
        Write-Output "PASS: No RC4-HMAC tickets  -  all Kerberos tickets use AES (Kerberoasting surface minimised). [BAS-SIM-KERB]"
      }
      if (-not $isKerberos) {
        Write-Output "WARN: Current session uses $authType authentication (not Kerberos). On a domain host this may indicate Kerberos fallback or NTLMv2 forced by misconfiguration."
      }
    cleanup: ""

  # ---------------------------------------------------------------------------
  # 5. NTLM authentication posture (T1550.002)
  # ---------------------------------------------------------------------------
  - name: "NTLM Authentication Posture — NTLMv1/LM enabled? + loopback SMB probe (T1550.002)"
    technique_id: T1550.002
    framework: custom
    executor: powershell
    timeout_sec: 25
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    blast_radius: "Reads HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\LmCompatibilityLevel (world-readable) to check if NTLMv1/LM is enabled. Attempts a loopback net use to \\\\127.0.0.1\\IPC$ to observe which authentication method is negotiated (Kerberos vs NTLM). Connection is immediately disconnected. Generates Security EID 4624 Type 3 from 127.0.0.1."
    reversible: true
    telemetry:
      - "Sysmon EID 1: net.exe with use \\\\127.0.0.1\\IPC$ argument"
      - "Security EID 4624: Logon Type 3 (network) from 127.0.0.1 — NTLM or Kerberos"
      - "Security EID 4776: NTLM credential validation event (if NTLM negotiated)"
    detection:
      - "SIEM: Security EID 4624 Type 3 from 127.0.0.1 — loopback SMB authentication anomaly"
      - "SIEM: LmCompatibilityLevel < 3 — NTLMv1 or LM enabled (critical finding for PtH exposure)"
      - "Sigma: win_security_ntlm_loopback.yml"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      # Read LmCompatibilityLevel (0-5)
      # 0=LM+NTLMv1, 1=LM+NTLMv1 with session security, 2=NTLMv2 only send
      # 3=NTLMv2 only, 4=refuse LM, 5=refuse LM+NTLMv1 (MOST SECURE)
      $lmLevel = $null
      try {
        $lmLevel = Get-ItemPropertyValue -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name 'LmCompatibilityLevel' -ErrorAction Stop
      } catch { $lmLevel = $null }
      $lmDesc = switch ($lmLevel) {
        0 { 'LM+NTLMv1 (CRITICAL — pass-the-hash and relay trivially possible)' }
        1 { 'LM+NTLMv1 with session security (HIGH — still vulnerable to PtH)' }
        2 { 'NTLMv2 send only; accepts LM/NTLMv1 (MEDIUM — relay risk remains)' }
        3 { 'NTLMv2 only (ACCEPTABLE — PtH harder but still possible)' }
        4 { 'NTLMv2 only, refuse LM from clients (GOOD)' }
        5 { 'NTLMv2 only, refuse LM+NTLMv1 from clients (BEST — PtH surface minimised)' }
        default { "Unknown or not set (treat as level 0 — CRITICAL)" }
      }
      if ($lmLevel -eq $null) {
        Write-Output "WARN: LmCompatibilityLevel not found in registry (default OS behavior = level 0 on older Windows). Treat as vulnerable. [BAS-SIM-NTLM]"
      } elseif ($lmLevel -lt 3) {
        Write-Output "FAIL: LmCompatibilityLevel=$lmLevel — $lmDesc. Pass-the-Hash attacks are viable. Set LmCompatibilityLevel=5 via GPO (Network security: LAN Manager authentication level). [BAS-SIM-NTLM]"
      } else {
        Write-Output "PASS: LmCompatibilityLevel=$lmLevel — $lmDesc. [BAS-SIM-NTLM]"
      }
      # Loopback SMB probe — uses current token, not a hash; just tests negotiation type
      $netOut = & net use '\\127.0.0.1\IPC$' /user:'' '' 2>&1 | Out-String
      $disconn = & net use '\\127.0.0.1\IPC$' /delete 2>&1 | Out-Null
      $negotiatedNTLM = $netOut -match 'NTLM|System error 1326|System error 5'
      if ($negotiatedNTLM -or ($netOut -match 'command completed')) {
        Write-Output "EXEC T1550.002: Loopback SMB to \\\\127.0.0.1\\IPC$ negotiated (NTLM observed or succeeded). Security EID 4624 Type 3 from 127.0.0.1 expected. Verify Kerberos is preferred for intra-host auth. [BAS-SIM-NTLM]"
      } else {
        Write-Output "INFO: Loopback SMB probe result: $($netOut.Trim()). [BAS-SIM-NTLM]"
      }
    cleanup: |
      & net use '\\127.0.0.1\IPC$' /delete 2>&1 | Out-Null
