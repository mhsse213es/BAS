id: carbanak-bfsi-db-discovery
product_line: killchain
name: Carbanak BFSI Database Service Discovery (Item 11)
description: >
  Lists which well-known database ports are LISTENING on THIS host only. No
  remote host is probed. [BAS-SIM-CARBANAK-S11] tagged. Grounded in MITRE
  ATT&CK T1046 (Network Service Discovery).
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - carbanak
  - bfsi
  - discovery
  - t1046
mitre_phases:
  - discovery

live_policy:
  block_on_domain_controller: false
  require_dc_reachable: false
  max_spray_attempts: 0
  spray_account_allowlist: []
  execution_window: ""

steps:
  - name: "Carbanak Item 11 -- Database Service Discovery (T1046)"
    technique_id: T1046
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: lab-only
    production_safe: true
    risk: low
    blast_radius: "Reads the local listener table. No packet is sent to any other host."
    reversible: true
    telemetry:
      - "Sysmon EID 3 or the network-stack listener query"
    detection:
      - "EDR: enumeration of local listening database ports by a non-administrative process"
    threat_intel_sources:
      - reference: "MITRE ATT&CK -- T1046"
        url: "https://attack.mitre.org/techniques/T1046/"
    last_reviewed: "2026-11-21"
    family_attribution_confidence: reported
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $dbPorts = 1433,1521,3306,5432
      $listening = Get-NetTCPConnection -State Listen | Where-Object { $dbPorts -contains $_.LocalPort } | Select-Object -ExpandProperty LocalPort -Unique
      Write-Output "EXEC 11: database listener port(s) on this host: [$($listening -join ', ')]. Local only, no remote probe. [BAS-SIM-CARBANAK-S11]"
    cleanup: ""
