id: cis-ubuntu-l1
product_line: common
name: CIS Ubuntu 26.04 L1 Baseline Hardening Check
local_check: true
description: >
  Validates CIS Benchmark Level 1 controls for Ubuntu 26.04 LTS.
  All checks run on the Linux agent as built-in posture assessments  - 
  no external commands are sent. Results are scored against 38 controls
  across kernel hardening, filesystem security, network configuration,
  SSH hardening, service inventory, access control, and password policy.
supported_os: [linux]
tags:
  - cis
  - linux
  - ubuntu
  - hardening
  - compliance

steps:
  # -- Kernel Hardening --------------------------------------------------------
  - name: "ASLR Enabled (kernel.randomize_va_space)"
    technique_id: T1055
    framework: custom
    executor: local
    command: "sysctl kernel.randomize_va_space"
    timeout_sec: 10

  - name: "Core Dumps Restricted (fs.suid_dumpable)"
    technique_id: T1003
    framework: custom
    executor: local
    command: "sysctl fs.suid_dumpable"
    timeout_sec: 10

  - name: "Ptrace Scope (kernel.yama.ptrace_scope)"
    technique_id: T1055
    framework: custom
    executor: local
    command: "sysctl kernel.yama.ptrace_scope"
    timeout_sec: 10

  - name: "NX/Execute Disable Bit"
    technique_id: T1055
    framework: custom
    executor: local
    command: "grep -m1 ' nx ' /proc/cpuinfo"
    timeout_sec: 10

  # -- Filesystem Hardening ----------------------------------------------------
  - name: "/tmp Mounted noexec"
    technique_id: T1059
    framework: custom
    executor: local
    command: "grep -E '\\s/tmp\\s' /proc/mounts"
    timeout_sec: 10

  - name: "/tmp Mounted nosuid"
    technique_id: T1548
    framework: custom
    executor: local
    command: "grep -E '\\s/tmp\\s' /proc/mounts"
    timeout_sec: 10

  - name: "/tmp Mounted nodev"
    technique_id: T1083
    framework: custom
    executor: local
    command: "grep -E '\\s/tmp\\s' /proc/mounts"
    timeout_sec: 10

  - name: "/dev/shm Mounted noexec"
    technique_id: T1059
    framework: custom
    executor: local
    command: "grep -E '\\s/dev/shm\\s' /proc/mounts"
    timeout_sec: 10

  - name: "/dev/shm Mounted nosuid"
    technique_id: T1548
    framework: custom
    executor: local
    command: "grep -E '\\s/dev/shm\\s' /proc/mounts"
    timeout_sec: 10

  - name: "Sticky Bit on World-Writable Directories"
    technique_id: T1083
    framework: custom
    executor: local
    command: "find / -xdev -type d -perm -0002 ! -perm -1000"
    timeout_sec: 30

  # -- Network Hardening -------------------------------------------------------
  - name: "IP Forwarding Disabled (net.ipv4.ip_forward)"
    technique_id: T1090
    framework: custom
    executor: local
    command: "sysctl net.ipv4.ip_forward"
    timeout_sec: 10

  - name: "ICMP Redirects Not Accepted"
    technique_id: T1562
    framework: custom
    executor: local
    command: "sysctl net.ipv4.conf.all.accept_redirects net.ipv4.conf.default.accept_redirects"
    timeout_sec: 10

  - name: "ICMP Redirects Not Sent"
    technique_id: T1562
    framework: custom
    executor: local
    command: "sysctl net.ipv4.conf.all.send_redirects net.ipv4.conf.default.send_redirects"
    timeout_sec: 10

  - name: "Martian Packet Logging Enabled"
    technique_id: T1562
    framework: custom
    executor: local
    command: "sysctl net.ipv4.conf.all.log_martians net.ipv4.conf.default.log_martians"
    timeout_sec: 10

  - name: "TCP SYN Cookies Enabled (net.ipv4.tcp_syncookies)"
    technique_id: T1046
    framework: custom
    executor: local
    command: "sysctl net.ipv4.tcp_syncookies"
    timeout_sec: 10

  - name: "IPv6 Router Advertisements Ignored"
    technique_id: T1090
    framework: custom
    executor: local
    command: "sysctl net.ipv6.conf.all.accept_ra net.ipv6.conf.default.accept_ra"
    timeout_sec: 10

  # -- SSH Hardening -----------------------------------------------------------
  - name: "SSH Root Login Disabled (PermitRootLogin no)"
    check_id: linux-ssh-root-login-disabled
    technique_id: T1078
    framework: custom
    executor: local
    command: "sshd -T 2>/dev/null | grep -i permitrootlogin"
    timeout_sec: 10

  - name: "SSH MaxAuthTries <= 4"
    technique_id: T1110
    framework: custom
    executor: local
    command: "sshd -T 2>/dev/null | grep -i maxauthtries"
    timeout_sec: 10

  - name: "SSH Empty Passwords Forbidden (PermitEmptyPasswords no)"
    check_id: linux-ssh-empty-passwords-forbidden
    technique_id: T1110
    framework: custom
    executor: local
    command: "sshd -T 2>/dev/null | grep -i permitemptypasswords"
    timeout_sec: 10

  - name: "SSH Ignores .rhosts Files (IgnoreRhosts yes)"
    technique_id: T1078
    framework: custom
    executor: local
    command: "sshd -T 2>/dev/null | grep -i ignorerhosts"
    timeout_sec: 10

  - name: "SSH Host-Based Authentication Disabled"
    technique_id: T1078
    framework: custom
    executor: local
    command: "sshd -T 2>/dev/null | grep -i hostbasedauthentication"
    timeout_sec: 10

  - name: "SSH User Environment Variables Forbidden"
    technique_id: T1548
    framework: custom
    executor: local
    command: "sshd -T 2>/dev/null | grep -i permituserenvironment"
    timeout_sec: 10

  - name: "SSH Protocol 2 Only"
    technique_id: T1110
    framework: custom
    executor: local
    command: |
      if [ ! -r /etc/ssh/sshd_config ]; then echo "SKIP: /etc/ssh/sshd_config not readable; not scored"; exit 0; fi
      v=$(grep -i '^Protocol' /etc/ssh/sshd_config | tail -1 | awk '{print $2}')
      case "$v" in
        "") echo "PASS: no Protocol directive; OpenSSH defaults to protocol 2" ;;
        2) echo "PASS: Protocol 2 only" ;;
        *1*) echo "FAIL: Protocol $v permits SSH protocol 1" ;;
        *) echo "SKIP: unrecognised Protocol value '$v'; not scored" ;;
      esac
    timeout_sec: 10

  # -- Services ----------------------------------------------------------------
  - name: "Telnet Not Installed/Running"
    technique_id: T1078
    framework: custom
    executor: local
    command: |
      if ! command -v dpkg >/dev/null 2>&1; then echo "SKIP: dpkg not available; package state not checked"; exit 0; fi
      if dpkg -s telnetd 2>/dev/null | grep -q '^Status: install ok installed'; then echo "FAIL: telnetd is installed"; else echo "PASS: telnetd is not installed"; fi
    timeout_sec: 10

  - name: "rsh/rlogin Services Not Installed"
    technique_id: T1078
    framework: custom
    executor: local
    command: |
      if ! command -v dpkg >/dev/null 2>&1; then echo "SKIP: dpkg not available; package state not checked"; exit 0; fi
      if dpkg -s rsh-server 2>/dev/null | grep -q '^Status: install ok installed'; then echo "FAIL: rsh-server is installed"; else echo "PASS: rsh-server is not installed"; fi
    timeout_sec: 10

  - name: "TFTP Not Running"
    technique_id: T1105
    framework: custom
    executor: local
    command: |
      if ! command -v systemctl >/dev/null 2>&1; then echo "SKIP: systemctl not available; service state not checked"; exit 0; fi
      s=$(systemctl is-active tftpd-hpa 2>/dev/null)
      case "$s" in
        active|activating|reloading) echo "FAIL: tftpd-hpa is $s" ;;
        *) echo "PASS: tftpd-hpa is not active ($s)" ;;
      esac
    timeout_sec: 10

  - name: "SSH Daemon Running (sshd)"
    technique_id: T1078
    framework: custom
    executor: local
    command: "systemctl is-active ssh"
    timeout_sec: 10

  # -- Access Control ----------------------------------------------------------
  - name: "Cron Access Restricted to Authorised Users"
    technique_id: T1053
    framework: custom
    executor: local
    command: "ls /etc/cron.allow /etc/cron.deny 2>&1"
    timeout_sec: 10

  - name: "Auditd Running and Enabled"
    technique_id: T1070
    framework: custom
    executor: local
    command: "systemctl is-active auditd && systemctl is-enabled auditd"
    timeout_sec: 10

  - name: "Rsyslog Running and Enabled"
    technique_id: T1070
    framework: custom
    executor: local
    command: "systemctl is-active rsyslog && systemctl is-enabled rsyslog"
    timeout_sec: 10

  - name: "Journald Persistent Storage Enabled"
    technique_id: T1070
    framework: custom
    executor: local
    command: "grep -i 'storage' /etc/systemd/journald.conf || ls /var/log/journal 2>&1"
    timeout_sec: 10

  - name: "Log Files Not World-Readable (/var/log)"
    technique_id: T1070
    framework: custom
    executor: local
    command: "find /var/log -type f -perm /o+r ! -name '*.gz' -maxdepth 4"
    timeout_sec: 15

  # -- Security Tools ----------------------------------------------------------
  - name: "UFW Firewall Enabled"
    check_id: linux-firewall-enabled
    technique_id: T1046
    framework: custom
    executor: local
    command: "ufw status 2>&1"
    timeout_sec: 10

  - name: "AppArmor Enabled and Enforcing"
    check_id: linux-apparmor-enabled
    technique_id: T1068
    framework: custom
    executor: local
    command: "aa-status 2>/dev/null || apparmor_status 2>&1"
    timeout_sec: 10

  # -- Password Policy ---------------------------------------------------------
  - name: "Password Minimum Length >= 12 (PASS_MIN_LEN)"
    check_id: linux-password-min-length
    technique_id: T1110
    framework: custom
    executor: local
    command: "grep PASS_MIN_LEN /etc/login.defs"
    timeout_sec: 10

  - name: "Password Maximum Age <= 365 Days (PASS_MAX_DAYS)"
    check_id: linux-password-max-age
    technique_id: T1110
    framework: custom
    executor: local
    command: "grep PASS_MAX_DAYS /etc/login.defs"
    timeout_sec: 10

  - name: "Sudo Usage Logged"
    technique_id: T1548
    framework: custom
    executor: local
    command: |
      if [ ! -r /etc/sudoers ]; then echo "SKIP: /etc/sudoers not readable (requires root); not scored"; exit 0; fi
      if grep -rqsE '^[[:space:]]*Defaults[^#]*logfile' /etc/sudoers /etc/sudoers.d/ 2>/dev/null; then echo "PASS: sudo logfile is configured"; else echo "FAIL: no sudo logfile configured (CIS requires Defaults logfile)"; fi
    timeout_sec: 10

  - name: "No Accounts with Empty Passwords (/etc/shadow)"
    check_id: linux-no-empty-password-accounts
    technique_id: T1110
    framework: custom
    executor: local
    command: |
      if [ ! -r /etc/shadow ]; then echo "SKIP: /etc/shadow not readable (requires root); not scored"; exit 0; fi
      e=$(awk -F: '($2==""){print $1}' /etc/shadow)
      if [ -n "$e" ]; then echo "FAIL: accounts with empty password: $(echo $e | tr '\n' ' ')"; else echo "PASS: no accounts with empty passwords"; fi
    timeout_sec: 10
