id: carbanak-bfsi-remote-service
product_line: killchain
name: Carbanak BFSI Remote Service Creation (Item 21)
description: >
  Creates a uniquely named demand-start service on the lab target whose binary
  exits immediately, never starts it, then deletes it in a finally block and
  verifies the deletion. Skips without a configured second host. [BAS-SIM-
  CARBANAK-S21] tagged. Grounded in MITRE ATT&CK T1569.002 (System Services:
  Service Execution).
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - carbanak
  - bfsi
  - lateral-movement
  - t1569
mitre_phases:
  - lateral-movement

live_policy:
  block_on_domain_controller: false
  require_dc_reachable: false
  max_spray_attempts: 0
  spray_account_allowlist: []
  execution_window: ""

steps:
  - name: "Carbanak Item 21 -- Remote Service Creation (T1569.002)"
    technique_id: T1569.002
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: lab-only
    production_safe: false
    risk: medium
    blast_radius: "Creates and then removes one demand-start service on a single lab host. The service's binary exits at once and is never started."
    reversible: true
    telemetry:
      - "Windows System EID 7045 on the target for the created service"
    detection:
      - "SIEM: service created on a lab host by a remote, non-administrative account"
    threat_intel_sources:
      - reference: "MITRE ATT&CK -- T1569.002"
        url: "https://attack.mitre.org/techniques/T1569/002/"
    last_reviewed: "2026-11-21"
    family_attribution_confidence: reported
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $target = $env:BAS_CARBANAK_TARGET_HOST
      if (-not $target) { Write-Output "SKIP: Carbanak Item 21 not run -- BAS_CARBANAK_TARGET_HOST unset. This step needs a second lab host."; exit 0 }
      if ($target -notmatch '\.(lab|test)$') { Write-Output "REFUSED: target must be a .lab or .test host label."; exit 1 }
      $svc = 'basprobe' + ([guid]::NewGuid().ToString('N').Substring(0, 8))
      $created = $false
      try {
        sc.exe "\\$target" create $svc binPath= "cmd.exe /c exit 0" start= demand | Out-Null
        $created = ($LASTEXITCODE -eq 0)
      } finally {
        sc.exe "\\$target" delete $svc | Out-Null
      }
      $gone = ((sc.exe "\\$target" query $svc 2>&1 | Out-String) -match '1060')
      Write-Output "EXEC 21: service created=$created; removed and verified absent=$gone. [BAS-SIM-CARBANAK-S21]"
    cleanup: ""
