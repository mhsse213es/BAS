id: ubuntu-hardening-validation
name: Ubuntu Hardening Validation — Attack Resistance Check
description: >
  Attempts real attack techniques that Ubuntu hardening baselines (CIS
  Ubuntu L1/L2, Ubuntu STIG, DISA STIG, or an internal baseline) are
  supposed to block or detect. Complements scenarios/cis-ubuntu-l1.yaml,
  which only reads configuration state — this scenario tests whether that
  configuration actually holds up under attack. Compliance answers "is the
  control configured?"; this scenario answers "does it actually resist an
  attack?"

  Covers: kernel module loading, process-injection resistance, core-dump
  credential exposure, auditd tamper resistance, protected-binary
  integrity, SSH authentication hardening, network service discovery /
  firewall egress control, removable-media policy, filesystem permission
  hardening, /tmp noexec enforcement, SUID/GTFOBins abuse resistance, and
  sudo/pkexec escalation resistance.

  Expected verdicts:
    PASS = the hardening control held; the attack was blocked or alerted
    FAIL = the attack succeeded despite the hardening control
    SKIP = the atomic/check requires a precondition not present on this host

  Safety: uses Atomic Red Team's benign demonstration commands (for the
  ART-covered techniques below) or hand-authored, self-contained, reversible
  checks that only ever touch throwaway files/processes of their own
  creation (never a real system binary or existing data). Two checks
  (auditd stop, removable-media mount simulation) are lab-only in effect —
  expect brief service disruption if run outside an isolated test endpoint.
  Run only on dedicated test endpoints.

  Status: scenario complete. Verified 2026-08-20 against production
  (audspecterver): of the 12 techniques below, only 4 (T1046, T1547.006,
  T1548.001, T1548.003) had real Linux Atomic Red Team coverage — the
  other 8 had zero. Rather than silently running a partial scenario (the
  previous art_techniques: shorthand form dropped uncovered techniques
  with no trace at all — see orchestrator's builder.go composability/
  skip-visibility fix, same date), this scenario now declares every
  technique explicitly: the 4 ART-covered ones as framework: art steps
  (one per real atomic, preserving full depth-mode coverage), and the
  other 8 as hand-authored framework: custom checks that exercise the
  same underlying security behavior ART has no Linux atomic for yet.
author: Audspect Research
executable: true
supported_os: [linux]
tags:
  - hardening
  - attack-validation
  - linux
  - ubuntu
  - art
  - atomic-red-team
  - cis
  - cis-ubuntu-l1
  - mitre-attack
mitre_phases:
  - initial-access
  - execution
  - persistence
  - privilege-escalation
  - defense-evasion
  - credential-access
  - discovery

