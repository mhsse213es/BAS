  # ── T1055 — Process Injection (no Linux ART atomic; hand-authored) ────────
  # Reads another process's memory via /proc/PID/mem, gated by the exact
  # same kernel ptrace_may_access() check as PTRACE_ATTACH -- Yama's
  # ptrace_scope hardening (the same control cis-ubuntu-l1 reads as
  # kernel.yama.ptrace_scope) governs both. PID 1 is always present and
  # never a descendant of this process, so the "tracing my own child" Yama
  # exemption can never apply. Pure 1-byte read attempt; nothing created.
  - name: "Process memory read via /proc/1/mem (ptrace_scope resistance)"
    technique_id: T1055
    framework: custom
    executor: bash
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Attempts a single 1-byte read from /proc/1/mem (PID 1's memory). No writes, no process creation, no state change of any kind."
    telemetry:
      - "auditd: SYSCALL ptrace/openat on /proc/1/mem"
      - "AppArmor/SELinux: ptrace denial, if a MAC policy also gates this"
    detection:
      - "EDR: unprivileged process reading another process's memory via /proc/<pid>/mem"
    command: |
      set -u
      if dd if=/proc/1/mem of=/dev/null bs=1 count=1 skip=0 2>/dev/null; then
        echo "FAIL: read access to another process's memory (/proc/1/mem) succeeded — Yama ptrace_scope hardening did not prevent it"
      else
        echo "PASS: read access to another process's memory (/proc/1/mem) was denied — Yama ptrace_scope hardening is effective"
      fi

  # ── T1003 — OS Credential Dumping (no Linux ART atomic; hand-authored) ────
  # Spawns a throwaway process holding a synthetic (clearly-fake) secret,
  # crashes it, and checks whether a locally-readable core dump results --
  # pairs directly with cis-ubuntu-l1's fs.suid_dumpable check by exercising
  # whether that setting (or a crash-handler like apport/systemd-coredump)
  # actually prevents credential exposure via core dump.
  - name: "Core-dump credential exposure (suid_dumpable resistance)"
    technique_id: T1003
    framework: custom
    executor: bash
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Spawns one throwaway child process (bash sleep) holding a synthetic [BAS-SIM] secret, sends it SIGSEGV, and checks for a resulting core file. The process and any core file are removed by this step's own cleanup."
    telemetry:
      - "Kernel: SIGSEGV core-dump event for a child process"
      - "auditd: ANOM_ABEND record, if audit is configured to log crashes"
    detection:
      - "EDR: process crash followed by a readable core file containing credential-like strings"
    command: |
      set -u
      WORK=$(mktemp -d /tmp/bas_coredump_XXXXXX) || { echo "SKIP: could not create a scratch directory"; exit 0; }
      cd "$WORK" || { echo "SKIP: could not enter scratch directory"; exit 0; }
      ulimit -c unlimited
      BAS_SYNTHETIC_SECRET="BAS-SIM-PASSWORD-do-not-use-1234" bash -c 'sleep 30' &
      TARGET_PID=$!
      sleep 0.2
      kill -SEGV "$TARGET_PID" 2>/dev/null
      wait "$TARGET_PID" 2>/dev/null
      sleep 0.3
      CORE=$(find "$WORK" -maxdepth 1 -iname "*core*" 2>/dev/null | head -1)
      if [ -n "$CORE" ] && [ -r "$CORE" ]; then
        echo "FAIL: a readable core dump was produced for a crashed process — core-dump hardening did not prevent it"
      else
        echo "PASS: no locally-readable core dump was produced — core-dump hardening (suid_dumpable, or a crash handler restricting access) is effective"
      fi
      rm -rf "$WORK"
    cleanup: "rm -rf /tmp/bas_coredump_* 2>/dev/null || true"

  # ── T1562.001 — Disable or Modify Tools (no Linux ART atomic; hand-authored, lab-only) ──
  - name: "Stop auditd (audit tamper resistance)"
    technique_id: T1562.001
    action_key: stop_auditd
    framework: custom
    executor: bash
    requires_priv: admin
    timeout_sec: 30
    fidelity: lab-only
    risk: low
    reversible: true
    blast_radius: "Attempts to stop the auditd service via systemctl. If it succeeds, this step's cleanup always restarts it. Brief loss of audit logging is possible while the attempt is in effect — run only on an isolated test endpoint."
    telemetry:
      - "auditd: SERVICE_STOP record (if the stop is logged before auditd itself stops)"
      - "systemd: auditd.service inactive"
    detection:
      - "EDR/SIEM: audit service stop/tamper alert"
    command: |
      set -u
      BEFORE=$(systemctl is-active auditd 2>/dev/null || echo "unknown")
      if [ "$BEFORE" != "active" ]; then
        echo "SKIP: auditd is not running on this host, cannot test tamper resistance"
        exit 0
      fi
      systemctl stop auditd >/dev/null 2>&1
      RC=$?
      sleep 0.5
      AFTER=$(systemctl is-active auditd 2>/dev/null || echo "unknown")
      if [ "$AFTER" != "active" ]; then
        echo "FAIL: auditd was stopped — audit tamper hardening did not prevent it (stop exit code $RC)"
      else
        echo "PASS: auditd could not be stopped — immutable audit config, PAM/sudo restriction, or another control blocked it"
      fi
    cleanup: "systemctl start auditd >/dev/null 2>&1 || true"

  # ── T1554 — Compromise Client Software Binary (no Linux ART atomic; hand-authored) ──
  # Plants a throwaway executable in a trusted PATH location (the real
  # technique: replace/plant a binary somewhere the system or an operator
  # would trust and execute) and checks whether an audit watch rule exists
  # on that location -- never touches a real system binary.
  - name: "Plant executable in a trusted PATH location (binary integrity monitoring)"
    technique_id: T1554
    framework: custom
    executor: bash
    requires_priv: admin
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Writes one throwaway, non-functional executable into /usr/local/bin, checks for an auditd watch rule on that path, then deletes the file. Never reads, modifies, or replaces any existing binary."
    telemetry:
      - "auditd: PATH/SYSCALL record for a new file under /usr/local/bin, if a watch rule is configured"
      - "Sysmon-equivalent (auditd/AIDE): file-create event under a PATH-search directory"
    detection:
      - "FIM (AIDE/Tripwire): new executable detected under a trusted PATH location"
    command: |
      set -u
      TARGET="/usr/local/bin/bas-hardening-test-$$"
      printf '#!/bin/sh\necho test\n' > "$TARGET" 2>/dev/null
      WRITE_RC=$?
      if [ $WRITE_RC -ne 0 ]; then
        echo "PASS: writing an unauthorized executable into a trusted PATH location (/usr/local/bin) was denied by filesystem permissions"
        exit 0
      fi
      chmod +x "$TARGET" 2>/dev/null
      AUDITED="no"
      if command -v auditctl >/dev/null 2>&1 && auditctl -l 2>/dev/null | grep -q "/usr/local/bin"; then
        AUDITED="yes"
      fi
      rm -f "$TARGET"
      if [ "$AUDITED" = "yes" ]; then
        echo "PASS: an audit rule watches /usr/local/bin — a planted/replaced binary here would be logged"
      else
        echo "FAIL: an executable was planted in a trusted PATH location (/usr/local/bin) with no audit watch to detect it"
      fi
    cleanup: "rm -f /usr/local/bin/bas-hardening-test-* 2>/dev/null || true"

  # ── T1078 — Valid Accounts (no Linux ART atomic; hand-authored) ───────────
  # Reads sshd's EFFECTIVE configuration (sshd -T), not just the on-disk
  # file cis-ubuntu-l1 parses -- catches drift between a configured file and
  # what sshd actually loaded. Purely read-only, no login attempt is made.
  - name: "sshd effective PermitRootLogin (SSH root-login hardening)"
    technique_id: T1078
    framework: custom
    executor: bash
    requires_priv: admin
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Runs 'sshd -T' to print sshd's effective configuration and greps one line. Read-only; no SSH connection or login attempt is made."
    telemetry:
      - "None — this is a local configuration read, not a network action"
    detection:
      - "N/A — read-only local check, no detection signal expected"
    command: |
      set -u
      if ! command -v sshd >/dev/null 2>&1; then
        echo "SKIP: sshd not installed on this host"
        exit 0
      fi
      EFFECTIVE=$(sshd -T 2>/dev/null | grep -i '^permitrootlogin' | awk '{print tolower($2)}')
      if [ -z "$EFFECTIVE" ]; then
        echo "SKIP: could not determine sshd's effective PermitRootLogin setting"
        exit 0
      fi
      case "$EFFECTIVE" in
        no)
          echo "PASS: sshd's effective PermitRootLogin is 'no' — root SSH login is disabled" ;;
        prohibit-password|without-password)
          echo "PASS: sshd's effective PermitRootLogin is '$EFFECTIVE' — password-based root SSH login is disabled" ;;
        *)
          echo "FAIL: sshd's effective PermitRootLogin is '$EFFECTIVE' — root SSH login is permitted" ;;
      esac

  # ── T1200 — Hardware Additions (no Linux ART atomic; hand-authored, lab-only) ──
  # Best-effort proxy: simulates a removable-media mount via a loopback disk
  # image, since real USB hardware can't be attached in an automated run.
  # This exercises generic mount policy, not literal udev/USB-subsystem
  # rules specifically keyed on USB insertion -- documented limitation.
  - name: "Removable-media mount simulation (USB/mount policy)"
    technique_id: T1200
    framework: custom
    executor: bash
    requires_priv: admin
    timeout_sec: 30
    fidelity: lab-only
    risk: low
    reversible: true
    blast_radius: "Creates an 8MB throwaway loopback disk image under /tmp, attempts to mount it, then unmounts/detaches/deletes everything it created. No real device or existing data is touched."
    telemetry:
      - "Kernel: loop device attach (losetup) and mount events"
      - "udev: block device add/mount, if a removable-media policy watches loop devices too"
    detection:
      - "EDR/DLP: new mount of a removable-media-style filesystem"
    command: |
      set -u
      if ! command -v losetup >/dev/null 2>&1 || ! command -v mkfs.vfat >/dev/null 2>&1; then
        echo "SKIP: losetup/mkfs.vfat not available, cannot simulate a removable-media mount"
        exit 0
      fi
      IMG=$(mktemp /tmp/bas_usbsim_XXXXXX.img)
      MNT=$(mktemp -d /tmp/bas_usbsim_mnt_XXXXXX)
      dd if=/dev/zero of="$IMG" bs=1M count=8 status=none 2>/dev/null
      mkfs.vfat -n BASSIM "$IMG" >/dev/null 2>&1
      LOOPDEV=$(losetup --show -f "$IMG" 2>/dev/null)
      if [ -z "$LOOPDEV" ]; then
        echo "SKIP: could not attach a loopback device on this host"
        rm -f "$IMG"; rmdir "$MNT" 2>/dev/null
        exit 0
      fi
      mount "$LOOPDEV" "$MNT" 2>/dev/null
      RC=$?
      if [ $RC -eq 0 ]; then
        echo "FAIL: a removable-media-style filesystem mounted without restriction"
        umount "$MNT" 2>/dev/null
      else
        echo "PASS: mounting a removable-media-style filesystem was blocked"
      fi
      losetup -d "$LOOPDEV" 2>/dev/null
      rm -f "$IMG"
      rmdir "$MNT" 2>/dev/null
    cleanup: "losetup -D 2>/dev/null; rm -f /tmp/bas_usbsim_*.img 2>/dev/null; rm -rf /tmp/bas_usbsim_mnt_* 2>/dev/null || true"

  # ── T1222 — File and Directory Permissions Modification (no Linux ART atomic; hand-authored) ──
  - name: "Unauthorized write into /etc (filesystem permission hardening)"
    technique_id: T1222
    framework: custom
    executor: bash
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Attempts to write one throwaway file directly into /etc as a non-elevated user; removes it immediately if the write succeeds. Never modifies any existing file under /etc."
    telemetry:
      - "auditd: PATH/SYSCALL write-denied record for /etc, if a watch rule is configured"
    detection:
      - "EDR: unprivileged process attempting to write into /etc"
    command: |
      set -u
      TARGET="/etc/bas-hardening-test-$$"
      echo "test" > "$TARGET" 2>/dev/null
      RC=$?
      if [ $RC -eq 0 ] && [ -f "$TARGET" ]; then
        echo "FAIL: an unauthorized file was written into /etc — filesystem permission hardening did not prevent it"
        rm -f "$TARGET"
      else
        echo "PASS: writing an unauthorized file into /etc was denied"
      fi
    cleanup: "rm -f /etc/bas-hardening-test-* 2>/dev/null || true"

  # ── T1059 — Command and Scripting Interpreter (no Linux ART atomic; hand-authored) ──
  - name: "Execute a script from /tmp (noexec enforcement)"
    technique_id: T1059
    framework: custom
    executor: bash
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Writes one throwaway, benign shell script into /tmp, attempts to execute it, then deletes it regardless of outcome."
    telemetry:
      - "auditd/Sysmon-equivalent: exec attempt from /tmp"
    detection:
      - "EDR: process execution from a world-writable temp directory"
    command: |
      set -u
      SCRIPT="/tmp/bas-hardening-test-$$.sh"
      printf '#!/bin/sh\necho BAS_EXEC_FROM_TMP_OK\n' > "$SCRIPT"
      chmod +x "$SCRIPT"
      OUT=$("$SCRIPT" 2>&1)
      RC=$?
      rm -f "$SCRIPT"
      if [ $RC -eq 0 ] && echo "$OUT" | grep -q "BAS_EXEC_FROM_TMP_OK"; then
        echo "FAIL: a script executed directly from /tmp — noexec is not enforced on /tmp"
      else
        echo "PASS: executing a script directly from /tmp was blocked — noexec is enforced"
      fi
    cleanup: "rm -f /tmp/bas-hardening-test-*.sh 2>/dev/null || true"
