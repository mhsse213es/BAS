id: "cobalt-group-bfsi-financial-impact"
product_line: killchain
name: "Cobalt Group BFSI - Financial Impact Simulator (P1)"
description: >
  Custom BFSI-specific scenarios validating financial-system controls beyond generic ATT&CK
  technique coverage: transaction-record manipulation, payment-instruction manipulation, ATM
  dispense-workflow manipulation, fraudulent transaction patterns, transaction-limit bypass, and
  financial-reconciliation manipulation, plus a resilience smoke check. All scenarios mutate only
  the lab bfsisim transaction ledger (internal/bfsisim); no real payment, ATM or core-banking system
  is ever touched. Each write scenario includes verified cleanup and undo-record rollback.
  Not all stages here map to documented Cobalt Group tradecraft -- these extend the campaign's
  BFSI attack-path coverage beyond the group's historically observed techniques.
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - cobalt-group
  - bfsi
  - financial-impact
  - p1
  - custom
mitre_phases:
  - impact

steps:

  # -------------------------------------------------------------------------
  - id: fin-01
    name: "Financial Impact - Transaction Record Manipulation Attempt (Custom)"
    technique_id: T1565.001
    action_key: financial_transaction_manipulation
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 120
    fidelity: telemetry-safe
    production_safe: false
    risk: high
    reversible: false
    blast_radius: "Creates one synthetic baseline transaction in the lab bfsisim ledger, then attempts to overwrite it with a tampered amount. SKIP when the simulator is unreachable."
    telemetry:
      - "HTTP POST to lab-local ledger (duplicate-id attempt)"
    detection:
      - "Transaction-integrity control: rejection of in-place amount changes"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $script:CgRun = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0, [Math]::Min(8, $env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 2147483647) }
      $script:CgTag = 'bas_sim_fin_' + $script:CgRun
      $script:FinTxLimit = 50000
      function Write-CgVerdict { param([string]$Outcome, [string]$Reason, [string]$Id)
      $p = 'SKIP'
      if ($Outcome -eq 'pass') { $p = 'PASS' } elseif ($Outcome -eq 'fail') { $p = 'FAIL' } elseif ($Outcome -eq 'error') { $p = 'ERROR' }
      Write-Output ($p + ': ' + $Reason + ' [BAS-FIN-' + $Id + ']')
      }
      function Complete-CgStep { param($Res, [string]$Id) Write-CgVerdict $Res.Outcome $Res.Reason $Id; exit 0 }
      function Get-CgUndoPath { param([string]$Id) return (Join-Path $env:TEMP ('bas-cg-undo\' + $Id + '.json')) }
      function New-CgUndoRecord { param([string]$Id, $Data)
      $p = Get-CgUndoPath $Id
      New-Item -ItemType Directory -Force -Path (Split-Path -Parent $p) | Out-Null
      $fs = [IO.File]::Open($p, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write)
      try { $b = [Text.Encoding]::ASCII.GetBytes(($Data | ConvertTo-Json -Depth 6 -Compress)); $fs.Write($b, 0, $b.Length) } finally { $fs.Close() }
      }
      function Read-CgUndoRecord { param([string]$Id)
      $p = Get-CgUndoPath $Id
      if (-not (Test-Path -LiteralPath $p)) { return $null }
      try { return (Get-Content -LiteralPath $p -Raw | ConvertFrom-Json) } catch { return 'unreadable' }
      }
      function Remove-CgUndoRecord { param([string]$Id) Remove-Item -LiteralPath (Get-CgUndoPath $Id) -Force -ErrorAction SilentlyContinue }
      function Get-BfsiSimulatorHost { $h = $env:BFSI_SIMULATOR_HOST; if ($h) { return $h }; return 'localhost' }
      function Get-BfsiSimulatorPort { $p = $env:BFSI_SIMULATOR_PORT; if ($p) { return [int]$p }; return 9999 }
      function Test-BfsiSimulatorConnectivity {
      $simHost = Get-BfsiSimulatorHost
      $port = Get-BfsiSimulatorPort
      try { $tcp = New-Object Net.Sockets.TcpClient; $tcp.Connect($simHost, $port); $tcp.Close(); return $true } catch { return $false }
      }
      function New-CgLedgerTransaction { param([string]$Id, [double]$Amount, [string]$Account)
      $simHost = Get-BfsiSimulatorHost
      $port = Get-BfsiSimulatorPort
      $res = @{ Code = 0; Error = '' }
      try {
      $body = @{ id = $Id; amount = $Amount; account = $Account } | ConvertTo-Json -Compress
      $uri = "http://${simHost}:${port}/api/ledger/transactions"
      $r = Invoke-WebRequest -Method POST -Uri $uri -Body $body -ContentType 'application/json' -TimeoutSec 5 -ErrorAction Stop
      $res.Code = [int]$r.StatusCode
      } catch {
      try { $res.Code = [int]$_.Exception.Response.StatusCode } catch {}
      $res.Error = $_.Exception.Message
      }
      return $res
      }
      function Remove-CgLedgerTransaction { param([string]$Id)
      $simHost = Get-BfsiSimulatorHost
      $port = Get-BfsiSimulatorPort
      try { Invoke-WebRequest -Method DELETE -Uri ("http://${simHost}:${port}/api/ledger/transactions/" + $Id) -TimeoutSec 5 -ErrorAction Stop | Out-Null } catch {}
      }
      function Get-CgLedgerTransactions {
      $simHost = Get-BfsiSimulatorHost
      $port = Get-BfsiSimulatorPort
      $res = @{ Code = 0; List = @() }
      try {
      $r = Invoke-RestMethod -Method GET -Uri ("http://${simHost}:${port}/api/ledger/transactions") -TimeoutSec 5 -ErrorAction Stop
      $res.Code = 200
      $res.List = @($r)
      } catch { try { $res.Code = [int]$_.Exception.Response.StatusCode } catch {} }
      return $res
      }
      function Invoke-CgLedgerReconcile { param([double]$ExpectedTotal)
      $simHost = Get-BfsiSimulatorHost
      $port = Get-BfsiSimulatorPort
      $res = @{ Code = 0; Balanced = $false; ActualTotal = 0.0 }
      try {
      $body = @{ expectedTotal = $ExpectedTotal } | ConvertTo-Json -Compress
      $r = Invoke-RestMethod -Method POST -Uri ("http://${simHost}:${port}/api/ledger/reconcile") -Body $body -ContentType 'application/json' -TimeoutSec 5 -ErrorAction Stop
      $res.Code = 200
      $res.Balanced = [bool]$r.balanced
      $res.ActualTotal = [double]$r.actualTotal
      } catch { try { $res.Code = [int]$_.Exception.Response.StatusCode } catch {} }
      return $res
      }
      if (-not (Test-BfsiSimulatorConnectivity)) {
      Complete-CgStep @{ Outcome = 'skip'; Reason = 'BFSI simulator not reachable - prerequisite not met' } 'FIN-01'
      }
      $txId = 'bas-sim-fin01-' + $script:CgRun
      $undo_data = @{ scenario = 'fin-01'; txIds = @($txId) }
      try { New-CgUndoRecord 'fin-01' $undo_data } catch { Complete-CgStep @{ Outcome = 'error'; Reason = 'Undo record creation failed' } 'fin-01' }
      $baseline = New-CgLedgerTransaction -Id $txId -Amount 500.00 -Account 'bas-sim-acct-fin01'
      if ($baseline.Code -ne 201) {
      Complete-CgStep @{ Outcome = 'error'; Reason = "Could not create baseline transaction, HTTP $($baseline.Code)" } 'FIN-01'
      }
      $tamper = New-CgLedgerTransaction -Id $txId -Amount 999999.00 -Account 'bas-sim-acct-fin01'
      if ($tamper.Code -eq 409) {
      $res = @{ Outcome = 'pass'; Reason = 'In-place amount change on an existing transaction record was rejected' }
      } elseif ($tamper.Code -eq 200 -or $tamper.Code -eq 201) {
      $res = @{ Outcome = 'fail'; Reason = 'In-place amount change on an existing transaction record succeeded' }
      } else {
      $res = @{ Outcome = 'error'; Reason = "Transaction manipulation attempt returned unclassifiable HTTP $($tamper.Code)" }
      }
      Complete-CgStep $res 'FIN-01'
    cleanup: |
      $ErrorActionPreference = 'SilentlyContinue'
      $script:CgRun = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0, [Math]::Min(8, $env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 2147483647) }
      $script:CgTag = 'bas_sim_fin_' + $script:CgRun
