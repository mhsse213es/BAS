      } catch { try { $res.Code = [int]$_.Exception.Response.StatusCode } catch {} }
      return $res
      }
      $rec = Read-CgUndoRecord 'fin-01'
      if ($rec -eq $null -or $rec -eq 'unreadable') { Write-Output 'SKIP: Undo record not found'; exit 0 }
