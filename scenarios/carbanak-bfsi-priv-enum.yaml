id: carbanak-bfsi-priv-enum
product_line: killchain
name: Carbanak BFSI Domain Privileged Account Enumeration (Item 12)
description: >
  Queries membership of the Domain Admins group. Read-only LDAP-backed query.
  Skips when the host is not domain-joined. [BAS-SIM-CARBANAK-S12] tagged.
  Grounded in MITRE ATT&CK T1069.002 (Permission Groups Discovery: Domain
  Groups).
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - carbanak
  - bfsi
  - discovery
  - t1069
mitre_phases:
  - discovery

live_policy:
  block_on_domain_controller: false
  require_dc_reachable: false
  max_spray_attempts: 0
  spray_account_allowlist: []
  execution_window: ""

steps:
  - name: "Carbanak Item 12 -- Domain Privileged Account Enumeration (T1069.002)"
    technique_id: T1069.002
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: lab-only
    production_safe: true
    risk: low
    blast_radius: "One read-only group membership query against the domain. No account is changed."
    reversible: true
    telemetry:
      - "Sysmon EID 1 for the net group process"
    detection:
      - "EDR: domain group membership query for privileged groups by a non-administrative process"
    threat_intel_sources:
      - reference: "MITRE ATT&CK -- T1069.002"
        url: "https://attack.mitre.org/techniques/T1069/002/"
    last_reviewed: "2026-11-21"
    family_attribution_confidence: reported
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $cs = Get-CimInstance Win32_ComputerSystem
      if (-not $cs.PartOfDomain) { Write-Output "EXEC 12: SKIPPED -- host is not domain-joined. [BAS-SIM-CARBANAK-S12]"; exit 0 }
      $members = net group "Domain Admins" /domain 2>$null | Where-Object { $_ -and $_ -notmatch '^(The |Group name|Comment|Members|----|Command completed)' }
      Write-Output "EXEC 12: Domain Admins membership query returned $(@($members).Count) line(s). Read-only. [BAS-SIM-CARBANAK-S12]"
    cleanup: ""
