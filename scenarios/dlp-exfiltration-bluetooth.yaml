id: dlp-exfiltration-bluetooth
name: DLP Exfiltration Validation — Bluetooth Storage Peripheral
description: >
  Writes the synthetic multi-type sensitive record to a Bluetooth storage
  peripheral that the operator has mounted as a folder on this endpoint, and
  records the Bluetooth adapter state for context. Bluetooth transfers include
  paired-device file sending and storage peripherals. This step covers the
  storage case only.

  Scope limit, stated plainly: Windows offers no scripted way to send a file to a
  paired device over the OBEX object-push profile from PowerShell. This scenario
  therefore does not test OBEX sends. It does not test Bluetooth file sending,
  and no result from it should be read as evidence about that path.

  The peripheral is operator-supplied:

    BAS_DLP_BT_STORAGE_PATH   folder on a mounted Bluetooth storage peripheral

  If the variable is not set, or the folder is not reachable, the step records no
  observation and grades Untested.

  Evidence level: L1. The verdict comes from the endpoint's own check of the
  write. A refusal cannot be attributed to a Bluetooth policy, a device control,
  or an endpoint DLP product. Only product evidence can attribute it.

  Safety: all synthetic data is fabricated and tagged [BAS-SIM-DLP]. The adapter
  state is read with Get-PnpDevice and never changed. The written file is removed
  when the copy succeeds. Windows only.
author: Audspect Research
executable: true
supported_os: [windows]
tags:
  - dlp
  - data-protection-validation
  - exfiltration
  - bluetooth
  - windows
  - mitre-attack
mitre_phases:
  - collection
  - exfiltration

steps:
  - name: "DLP Validation — Write to Bluetooth Storage Peripheral (T1052)"
    technique_id: T1052
    detection_profiles:
      - windows_dlp_exfiltration
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    blast_radius: "Reads Bluetooth adapter status (read only), then writes one small synthetic CSV to an operator-mounted Bluetooth storage folder and removes it. Nothing is written if BAS_DLP_BT_STORAGE_PATH is not set."
    reversible: true
    telemetry:
      - "Sysmon EID 11: file created on a Bluetooth-mounted folder"
      - "Windows PnP event: Bluetooth adapter state"
    detection:
      - "Device control/Bluetooth: regulated data written to a Bluetooth storage peripheral"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $folder = $env:BAS_DLP_BT_STORAGE_PATH
      if (-not $folder) {
        Write-Output "SKIP: BAS_DLP_BT_STORAGE_PATH is not set on this agent -- Bluetooth storage validation requires an operator-mounted peripheral."
      } elseif (-not (Test-Path -LiteralPath $folder)) {
        Write-Output "SKIP: Bluetooth storage folder is not reachable from this agent ($folder)."
      } else {
        $bt = Get-PnpDevice -Class Bluetooth -ErrorAction SilentlyContinue | Select-Object -First 10
        foreach ($b in $bt) { Write-Output "BT: $($b.FriendlyName) status=$($b.Status) (read only, not changed)" }
        $csvContent = "[BAS-SIM-DLP] CustomerID,PAN,Aadhaar,SWIFT,UPI,CreditCard`nBAS-SIM-SINK,ABCDE1234F,123456789012,SBININBBXXX,fake.user@upi,4111111111111111"
        $name = "bas_sim_bt_" + [guid]::NewGuid().ToString('N') + ".csv"
        $localSrc = Join-Path $env:TEMP $name
        $dest = Join-Path $folder $name
        Set-Content -Path $localSrc -Value $csvContent -Encoding utf8
        if ($env:BAS_TASK_ID) { Write-Output "DLP_EVENT_START: $env:BAS_TASK_ID $((Get-Date).ToUniversalTime().ToString('o'))" }
        Copy-Item -Path $localSrc -Destination $dest -ErrorAction SilentlyContinue
        if (Test-Path -LiteralPath $dest) {
          Write-Output "EXEC T1052: sensitive record file written to the Bluetooth storage folder unimpeded. [BAS-SIM-DLP-BT]"
          Write-Output "DLP_OBSERVATION: OperationSucceeded"
          Remove-Item -LiteralPath $dest -Force -ErrorAction SilentlyContinue
        } else {
          $reason = if ($Error.Count -gt 0) { $Error[0].Exception.Message } else { '' }
          Write-Output "EXEC T1052: write to the Bluetooth storage folder failed ($reason). [BAS-SIM-DLP-BT]"
          if ($reason -match 'Access|denied|Unauthorized|read-only|refused') { Write-Output "DLP_OBSERVATION: OperationBlocked" } else { Write-Output "DLP_OBSERVATION: OperationUnknown" }
        }
        Remove-Item -LiteralPath $localSrc -Force -ErrorAction SilentlyContinue
      }
    cleanup: ""
