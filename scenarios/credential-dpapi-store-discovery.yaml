id: credential-dpapi-store-discovery
product_line: dlp
name: DPAPI Credential Store Discovery Probe
description: >
  Telemetry-safe emulation of an adversary surveying the DPAPI credential stores
  for the current user: the master key folder and the Credentials and Vault
  folders that hold DPAPI-protected blobs. The scenario counts the files in those
  folders and lists nothing else. It opens no file and does not decrypt, read, or
  export any blob or master key. It tests whether reaching these stores from a
  non-credential process is noticed.

  KILL CHAIN STAGES:
    1. DPAPI Folder Survey — count master-key and credential-blob files by folder (T1555)

  SAFETY: Read-only and name-level. No file is opened, copied, or decrypted. No
  master key is exported. Windows only. Telemetry mode.
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - credentials
  - dpapi
  - credential-store
  - detection
  - t1555
  - mitre
mitre_phases:
  - credential-access

live_policy:
  block_on_domain_controller: true
  require_dc_reachable: false
  max_spray_attempts: 0
  spray_account_allowlist: []
  execution_window: ""

steps:

  # ---------------------------------------------------------------------------
  # Stage 1 — DPAPI Folder Survey (T1555)
  # ---------------------------------------------------------------------------
  - name: "DPAPI Store 1 — Master-Key and Credential-Blob Folder Survey (T1555)"
    technique_id: T1555
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Counts the files in the current user's DPAPI master-key folder (AppData\\Roaming\\Microsoft\\Protect) and its Credentials and Vault folders. Only the counts are recorded. No file is opened or decrypted, and no key is exported."
    telemetry:
      - "Security EID 4663: object access on the DPAPI folders, when auditing is enabled"
      - "PowerShell EID 4104: Get-ChildItem against DPAPI paths"
    detection:
      - "EDR: DPAPI store enumeration from a non-credential process — credential-theft precursor"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $folders = @(
        (Join-Path $env:APPDATA 'Microsoft\Protect'),
        (Join-Path $env:APPDATA 'Microsoft\Credentials'),
        (Join-Path $env:LOCALAPPDATA 'Microsoft\Credentials'),
        (Join-Path $env:LOCALAPPDATA 'Microsoft\Vault')
      )
      $total = 0
      $detail = @()
      foreach ($f in $folders) {
        $n = @(Get-ChildItem -Path $f -File -Force -ErrorAction SilentlyContinue).Count
        $total += $n
        $detail += "$(Split-Path $f -Leaf)=$n"
      }
      Write-Output "EXEC T1555: DPAPI folders surveyed; file counts: $($detail -join ', '). Nothing was opened or decrypted. DPAPI Stage 1. [BAS-SIM-DPP-S1]"
      if ($total -gt 0) {
        Write-Output "FAIL: DPAPI credential stores were enumerated from a non-credential context with no alert. Surveying these folders precedes credential decryption and should be detected."
      } else {
        Write-Output "PASS: No DPAPI master-key or credential-blob files were present to survey."
      }
    cleanup: ""
