  - name: "Carbanak Stage 10 -- Payment Gateway Configuration Discovery (T1083)"
    technique_id: T1083
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: lab-only
    production_safe: false
    risk: low
    blast_radius: "Lists paths of files whose names look like payment gateway configuration. Contents are never opened."
    reversible: true
    telemetry:
      - "Security EID 4663 on directory enumeration (if object auditing enabled)"
    detection:
      - "EDR: enumeration of payment-related configuration paths"
    threat_intel_sources:
      - reference: "Europol -- Mastermind Behind EUR 1 Billion Cyber Bank Robbery Arrested in Spain (2018)"
        url: "https://www.europol.europa.eu/newsroom/news/mastermind-behind-eur-1-billion-cyber-bank-robbery-arrested-in-spain"
    last_reviewed: "2026-11-17"
    family_attribution_confidence: reported
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $roots = @($env:ProgramData, $env:ProgramFiles) | Where-Object { $_ }
      $hits = foreach ($r in $roots) {
