    timeout_sec: 60
    fidelity: lab-only
    production_safe: false
    risk: high
    blast_radius: "Creates a service named BAS-SIM-<guid> on BAS_CARBANAK_TARGET_HOST (lab host only), queries it, then deletes it. The service never starts a payload."
    reversible: true
    telemetry:
      - "Security EID 7045 on the target"
      - "System EID 7036"
    detection:
      - "EDR: remote service creation with a non-admin-looking name"
