      }
      $n = @($hits).Count
      Write-Output "EXEC 10: $n payment-configuration path(s) located. Contents not read. [BAS-SIM-CARBANAK-S10]"
      $hits | Select-Object -First 25 | ForEach-Object { Write-Output "PATH: $_" }
