        $exists = $false
        if ($rc -eq 0) { schtasks /query /tn "AVTestMarkerTask" 2>$null | Out-Null; $exists = ($LASTEXITCODE -eq 0) }
        if ($exists) { Write-Output "FAIL: suspicious scheduled task was created and retained; the scheduled-task control did not intercept it." }
        elseif ($out -match 'Access is denied|blocked|denied|policy') { Write-Output "PASS: scheduled task creation explicitly blocked by a security control." }
        else { Write-Output "SKIP: scheduled task outcome ambiguous (exit=$rc); not scored." }
      test_index: 0
      executor: cmd
      timeout_sec: 30
      cleanup: schtasks /delete /tn "AVTestMarkerTask" /f
      blast_radius: create a disposable test scheduled task that runs at logon, whose action is a no-op exit
