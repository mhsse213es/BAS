    - name: 'AV-FP-002: High-I/O legitimate workload during active scanning (primary)'
      technique_id: T1499.003
      framework: custom
      command: |
        $dir = "$env:TEMP\avtest-highio"
        $sw = [Diagnostics.Stopwatch]::StartNew(); $loops = 0; $denied = 0
        try {
          while ($sw.Elapsed.TotalSeconds -lt 60) {
            New-Item -ItemType Directory -Path $dir -Force -ErrorAction Stop | Out-Null
            1..50 | ForEach-Object {
              try { Set-Content -Path "$dir\f$_.tmp" -Value ([guid]::NewGuid().ToString()) -ErrorAction Stop }
              catch { if ($_.Exception.Message -match 'virus|malicious|blocked|denied|policy') { $denied++ } }
            }
            Get-ChildItem $dir -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
            $loops++
          }
        } catch { }
        Remove-Item -LiteralPath $dir -Recurse -Force -ErrorAction SilentlyContinue
        if ($denied -gt 0) { Write-Output "FAIL: legitimate high-I/O workload had $denied write(s) blocked; this is a false positive during active scanning." }
        elseif ($loops -ge 1) { Write-Output "PASS: legitimate high-I/O workload completed $loops cycle(s) with no blocked writes (no false positive)." }
        else { Write-Output "SKIP: high-I/O workload did not start; not scored." }
      test_index: 0
      executor: powershell
      timeout_sec: 30
      cleanup: Remove-Item -Path "$env:TEMP\avtest-highio" -Recurse -Force -ErrorAction SilentlyContinue
      blast_radius: run a 60-second high-I/O loop writing and deleting many small disposable files in a temp directory while on-access scanning is active, to measure whether the workload is blocked, throttled past an acceptable threshold, or allowed to complete
      reversible: true
      production_safe: true
      threat_intel_sources:
        - reference: manually authored from av.txt §2.H
