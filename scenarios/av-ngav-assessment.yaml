id: av-ngav-assessment
product_line: av
name: AV/NGAV Assessment
description: 'Antivirus and next-gen AV assessment: concretely dispatchable file-based, script/fileless, behavioral, network-delivered, persistence, and false-positive-resilience vectors from internal/avcatalog''s seed catalog. Every step is a harmless, disposable, purpose-built simulation with its own cleanup -- never a real attack payload.'
author: Audspect Research
tags:
    - av-ngav-mastery
    - antivirus
    - ngav
    - endpoint-protection
mitre_phases:
    - execution
    - defense-evasion
    - persistence
steps:
    - name: 'AV-FILE-001: Known test artifact via a user-writable download/temp directory (primary)'
      technique_id: T1204.002
      framework: custom
      command: |
        $p = "$env:TEMP\avtest-eicar.txt"
        $written = $false; $denied = $false
        try {
          Set-Content -Path $p -Value 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' -ErrorAction Stop
          $written = $true
        } catch {
          $denied = $_.Exception.Message -match 'virus|malicious|blocked|denied|policy|did not complete'
        }
        if (-not $written) {
          if ($denied) { Write-Output "PASS: EICAR test artifact write explicitly blocked by a security control." }
          else { Write-Output "SKIP: EICAR test artifact write failed without an explicit block; not scored." }
        } else {
          Start-Sleep -Seconds 3
          if (Test-Path -LiteralPath $p) { Write-Output "FAIL: EICAR test artifact retained on disk; the security control did not intercept it." }
          else {
            $det = $null
            try { $det = @(Get-MpThreatDetection -ErrorAction Stop | Where-Object { $_.Resources -match [regex]::Escape($p) }) } catch { $det = $null }
            if ($det -and $det.Count -gt 0) { Write-Output "PASS: EICAR test artifact removed after write; Defender detection record confirms intervention." }
            else { Write-Output "SKIP: EICAR test artifact no longer present, but no detection record confirmed a control acted; not scored." }
          }
        }
      test_index: 0
      executor: powershell
      timeout_sec: 30
      cleanup: Remove-Item -Path "$env:TEMP\avtest-eicar.txt" -Force -ErrorAction SilentlyContinue
      blast_radius: write the industry-standard EICAR anti-malware test string to a user-writable temp path, using an approved test artifact rather than live malware
      reversible: true
      production_safe: true
      threat_intel_sources:
        - reference: manually authored from av.txt §2.A
    - name: 'AV-FILE-001: Known test artifact via a user-writable download/temp directory (counterpart)'
      technique_id: T1204.002
      framework: custom
      command: |
        $p = "$env:TEMP\avtest-benign.txt"
        $written = $false; $denied = $false
        try {
          Set-Content -Path $p -Value 'This is an ordinary harmless test file.' -ErrorAction Stop
          $written = $true
        } catch {
          $denied = $_.Exception.Message -match 'virus|malicious|blocked|denied|policy|did not complete'
        }
        if ($denied) { Write-Output "FAIL: benign text file was blocked; this is a false positive on benign activity." }
        elseif (-not $written) { Write-Output "SKIP: benign text file write failed without an explicit block; not scored." }
        else {
          Start-Sleep -Seconds 3
          if (Test-Path -LiteralPath $p) { Write-Output "PASS: benign text file was not blocked (no false positive)." }
          else { Write-Output "FAIL: benign text file was removed after write; this is a false positive on benign activity." }
        }
      test_index: 0
      executor: powershell
      timeout_sec: 30
      cleanup: Remove-Item -Path "$env:TEMP\avtest-benign.txt" -Force -ErrorAction SilentlyContinue
      blast_radius: write an ordinary harmless text file to the same directory, proving the AV is not merely blocking by location
      reversible: true
      production_safe: true
      threat_intel_sources:
        - reference: manually authored from av.txt §2.A
    - name: 'AV-FILE-002: Nested archive containing a known test artifact (primary)'
      technique_id: T1027.002
      framework: custom
      command: |
        $p = "$env:TEMP\avtest-archive.zip"
        $written = $false; $denied = $false
        try {
          Set-Content -Path "$env:TEMP\avtest-eicar-nested.txt" -Value 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' -ErrorAction Stop; Compress-Archive -Path "$env:TEMP\avtest-eicar-nested.txt" -DestinationPath $p -Force -ErrorAction Stop
          $written = $true
        } catch {
          $denied = $_.Exception.Message -match 'virus|malicious|blocked|denied|policy|did not complete'
        }
        if (-not $written) {
          if ($denied) { Write-Output "PASS: nested archive with test artifact write explicitly blocked by a security control." }
          else { Write-Output "SKIP: nested archive with test artifact write failed without an explicit block; not scored." }
        } else {
          Start-Sleep -Seconds 3
          if (Test-Path -LiteralPath $p) { Write-Output "FAIL: nested archive with test artifact retained on disk; the security control did not intercept it." }
          else {
            $det = $null
            try { $det = @(Get-MpThreatDetection -ErrorAction Stop | Where-Object { $_.Resources -match [regex]::Escape($p) }) } catch { $det = $null }
            if ($det -and $det.Count -gt 0) { Write-Output "PASS: nested archive with test artifact removed after write; Defender detection record confirms intervention." }
            else { Write-Output "SKIP: nested archive with test artifact no longer present, but no detection record confirmed a control acted; not scored." }
          }
        }
      test_index: 0
      executor: powershell
      timeout_sec: 30
      cleanup: Remove-Item -Path "$env:TEMP\avtest-eicar-nested.txt","$env:TEMP\avtest-archive.zip" -Force -ErrorAction SilentlyContinue
      blast_radius: write the EICAR test string to a temp file, then compress it into a zip archive in a user-writable temp path, to exercise extraction-time (not just at-rest) scanning
      reversible: true
      production_safe: true
      threat_intel_sources:
        - reference: manually authored from av.txt §2.A
    - name: 'AV-SCRIPT-001: Encoded PowerShell command execution (primary)'
      technique_id: T1059.001
      framework: custom
      command: |
        $marker = "$env:TEMP\avtest-script-marker.txt"
        Remove-Item -LiteralPath $marker -Force -ErrorAction SilentlyContinue
        $inner = 'Set-Content -Path "$env:TEMP\avtest-script-marker.txt" -Value marker'
        $enc = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($inner))
        $out = (powershell.exe -NoProfile -EncodedCommand $enc 2>&1) | Out-String
        if (Test-Path -LiteralPath $marker) { Write-Output "FAIL: encoded PowerShell command ran and wrote its marker; the script control did not intercept it." }
        elseif ($out -match 'virus|malicious|blocked|denied|policy') { Write-Output "PASS: encoded PowerShell command explicitly blocked by a security control." }
        else { Write-Output "SKIP: encoded command produced no marker and no explicit block; not scored." }
      test_index: 0
      executor: powershell
      timeout_sec: 30
      cleanup: Remove-Item -Path "$env:TEMP\avtest-script-marker.txt" -Force -ErrorAction SilentlyContinue
      blast_radius: run a base64-encoded PowerShell one-liner mimicking a common encoded-command evasion pattern, whose actual payload only writes a harmless marker file
      reversible: true
      production_safe: true
      threat_intel_sources:
        - reference: manually authored from av.txt §2.B
