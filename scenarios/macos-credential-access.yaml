id: macos-credential-access
name: macOS Credential Access  -  Keychain, SSH Keys, Bash History
description: >
  macOS credential theft simulation using Atomic Red Team atomics.
  Covers the primary attack surfaces on a macOS endpoint: Keychain database
  access, SSH private key discovery, bash/zsh history credential leakage,
  browser credential stores, and /etc/passwd enumeration.

  Each technique runs ALL available macOS/darwin atomics (depth mode).

  Expected verdicts:
    PASS  = EDR/XProtect/TCC blocked or alerted on the access attempt
    FAIL  = credential material was accessible / command completed undetected
    SKIP  = atomic requires SIP bypass or entitlement not present on the host

  Safety: no network egress, no password cracking. Keychain prompts may
  appear if TCC is enforced — these will cause a FAIL verdict (access blocked).
  Run only on authorised macOS test endpoints.
author: Audspect Research
executable: true
supported_os: [darwin]
tags:
  - credential-access
  - macos
  - darwin
  - art
  - atomic-red-team
  - t1555
  - t1552
  - t1003
  - mitre-attack
mitre_phases:
  - credential-access

art_techniques:
  - T1555.001   # Keychain (security find-generic-password, security dump)
  - T1555.003   # Credentials from Web Browsers (Safari/Chrome cookie access)
  - T1552.001   # Credentials In Files (grep for passwords in config files)
  - T1552.003   # Bash History (cat ~/.bash_history, ~/.zsh_history)
  - T1552.004   # Private Keys (find ~/.ssh -name 'id_*' -not -name '*.pub')
  - T1087.001   # Local Account Discovery (dscl . list /Users, id)
