      function Remove-CgUndoRecord { param([string]$Id) Remove-Item -LiteralPath (Get-CgUndoPath $Id) -Force -ErrorAction SilentlyContinue }
      if (-not (Test-CgDpGate)) { Complete-CgStep @{ Outcome = 'skip'; Reason = 'BAS_CONFIRM_DP_TEST not true; no marker written [CSCRF-DP-05]' } 'dp-05' }
      $share = $env:BAS_DP_SHARE
      if (-not $share) { Complete-CgStep @{ Outcome = 'skip'; Reason = 'BAS_DP_SHARE not set; no marker written [CSCRF-DP-05]' } 'dp-05' }
      $f = Join-Path $share ('bas-dp-marker-' + $script:CgRun + '.txt')
      New-CgUndoRecord 'dp-05' @{ scenario = 'dp-05'; file = $f }
      $marker = 'BAS-SYNTHETIC-MARKER-' + $script:CgRun + ' (no real data)'
      try { Set-Content -LiteralPath $f -Value $marker -Encoding ASCII -ErrorAction Stop } catch { Complete-CgStep @{ Outcome = 'fail'; Reason = 'marker could not be written to BAS_DP_SHARE [CSCRF-DP-05]' } 'dp-05' }
      $back = Get-Content -LiteralPath $f -Raw -ErrorAction SilentlyContinue
      if ($back -and $back.Trim() -eq $marker) { Complete-CgStep @{ Outcome = 'pass'; Reason = 'synthetic marker written and read back. No DLP block was tested; see CSCRF-DP-06 [CSCRF-DP-05]' } 'dp-05' }
      Complete-CgStep @{ Outcome = 'fail'; Reason = 'marker read back differently from what was written [CSCRF-DP-05]' } 'dp-05'
    cleanup: |
      $ErrorActionPreference = 'SilentlyContinue'
      $script:CgRun = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0, [Math]::Min(8, $env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 2147483647) }
      function Write-CgVerdict { param([string]$Outcome, [string]$Reason, [string]$Id)
      $p = 'SKIP'
      if ($Outcome -eq 'pass') { $p = 'PASS' } elseif ($Outcome -eq 'fail') { $p = 'FAIL' } elseif ($Outcome -eq 'error') { $p = 'ERROR' }
      Write-Output ($p + ': ' + $Reason + ' [BAS-DP-' + $Id + ']')
      }
      function Complete-CgStep { param($Res, [string]$Id) Write-CgVerdict $Res.Outcome $Res.Reason $Id; exit 0 }
      function Test-CgDpGate { return ($env:BAS_CONFIRM_DP_TEST -eq 'true') }
      function Get-CgUndoPath { param([string]$Id) return (Join-Path $env:TEMP ('bas-cg-undo\' + $Id + '.json')) }
      function New-CgUndoRecord { param([string]$Id, $Data)
      $p = Get-CgUndoPath $Id
      New-Item -ItemType Directory -Force -Path (Split-Path -Parent $p) | Out-Null
      $fs = [IO.File]::Open($p, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write)
      try { $b = [Text.Encoding]::ASCII.GetBytes(($Data | ConvertTo-Json -Depth 6 -Compress)); $fs.Write($b, 0, $b.Length) } finally { $fs.Close() }
      }
      function Read-CgUndoRecord { param([string]$Id)
      $p = Get-CgUndoPath $Id
      if (-not (Test-Path -LiteralPath $p)) { return $null }
      try { return (Get-Content -LiteralPath $p -Raw | ConvertFrom-Json) } catch { return 'unreadable' }
      }
      function Remove-CgUndoRecord { param([string]$Id) Remove-Item -LiteralPath (Get-CgUndoPath $Id) -Force -ErrorAction SilentlyContinue }
      $rec = Read-CgUndoRecord 'dp-05'
      if ($rec -eq $null -or $rec -eq 'unreadable') { Write-Output 'PASS: Cleanup complete (no record)'; exit 0 }
      Remove-Item -LiteralPath $rec.file -Force -ErrorAction SilentlyContinue
      if (Test-Path -LiteralPath $rec.file) { Write-Output "FAIL: marker $($rec.file) survived undo"; exit 0 }
      Remove-CgUndoRecord 'dp-05'
      Write-Output 'PASS: Cleanup complete'
      exit 0
