    blast_radius: "Writes one synthetic marker file (no real data) to BAS_DP_SHARE, reads it back, and deletes it in undo. Requires BAS_CONFIRM_DP_TEST=true."
    telemetry:
      - "File write to share"
    detection:
      - "Share write event"
      - "DLP alert (deferred, see CSCRF-DP-06)"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $script:CgRun = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0, [Math]::Min(8, $env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 2147483647) }
