    technique_id: T1562.001
    action_key: cscrf_dp_dlp_service
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Read-only service lookup for the name in BAS_DLP_SERVICE; skipped when unset."
    telemetry:
      - "Service query"
    detection:
