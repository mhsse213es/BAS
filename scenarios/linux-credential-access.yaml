id: linux-credential-access
name: Linux Credential Access  -  /etc/shadow, SSH Keys, Bash History
description: >
  Linux credential theft simulation using Atomic Red Team atomics.
  Covers the primary attack surfaces an adversary exploits after gaining
  initial access to a Linux endpoint: /etc/shadow hash extraction,
  /etc/passwd enumeration, SSH private key discovery, bash history
  credential leakage, and credentials in files.

  Technique depth: runs EVERY available Linux atomic for each technique
  (unlike the full sweep which takes one representative per technique).

  Expected verdicts:
    PASS  = EDR/auditd blocked or alerted on the access attempt
    FAIL  = credential material was accessible / command completed undetected
    SKIP  = atomic not applicable in current OS version or privilege context

  Safety: no network egress, no password cracking, no pivoting to other hosts.
  Run only on authorised test endpoints.
author: Audspect Research
executable: true
supported_os: [linux]
tags:
  - credential-access
  - linux
  - art
  - atomic-red-team
  - t1003
  - t1552
  - t1555
  - t1040
  - mitre-attack
mitre_phases:
  - credential-access

art_techniques:
  - T1003.008   # /etc/passwd and /etc/shadow
  - T1552.001   # Credentials In Files
  - T1552.003   # Bash History
  - T1552.004   # Private Keys (SSH key discovery)
  - T1555       # Credentials from Password Stores
  - T1040       # Network Sniffing (tcpdump/pcap credential capture)
