id: "cscrf-mii-siem"
product_line: common
name: "CSCRF-MII SIEM Telemetry Pipeline Configuration Checks (P0)"
description: >
  Internal control-validation configuration checks for the telemetry pipeline on an endpoint: time source,
  Windows Event Forwarding subscription manager, and Security log retention. Verdicts are internal control
  references (CSCRF-SIEM-*), not SEBI clause identifiers. All checks are read only. Ingestion verification
  (an event generated here arriving at the SIEM) is deferred until a collector endpoint is named. A PASS
  here shows only that the endpoint is configured; it does not show the SOC received or acted on anything.
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - cscrf-mii
  - siem
  - telemetry
  - p0
mitre_phases:
  - defense-evasion

steps:

  # -------------------------------------------------------------------------
  - id: siem-01
    name: "Time Source Configuration (T1070.006, internal ref CSCRF-SIEM-01)"
    technique_id: T1070.006
    action_key: cscrf_siem_time_sync
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Read-only query of the Windows time service status."
    telemetry:
      - "w32tm status query"
    detection:
      - "Time source drift review"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      function Write-CgVerdict { param([string]$Outcome, [string]$Reason, [string]$Id)
      $p = 'SKIP'
      if ($Outcome -eq 'pass') { $p = 'PASS' } elseif ($Outcome -eq 'fail') { $p = 'FAIL' } elseif ($Outcome -eq 'error') { $p = 'ERROR' }
      Write-Output ($p + ': ' + $Reason + ' [BAS-SIEM-' + $Id + ']')
      }
      function Complete-CgStep { param($Res, [string]$Id) Write-CgVerdict $Res.Outcome $Res.Reason $Id; exit 0 }
      $out = (& w32tm.exe /query /status 2>&1) -join "`n"
      if ($LASTEXITCODE -ne 0 -or $out -notmatch 'Source:') { Complete-CgStep @{ Outcome = 'error'; Reason = 'time service status could not be read [CSCRF-SIEM-01]' } 'siem-01' }
      $src = [regex]::Match($out, 'Source:\s*(.+)').Groups[1].Value.Trim()
      if ($src -match 'Local CMOS Clock|Free-running|VM IC') { Complete-CgStep @{ Outcome = 'fail'; Reason = "time source is '$src'; not a network time source; event timestamps may drift from the SIEM [CSCRF-SIEM-01]" } 'siem-01' }
      Complete-CgStep @{ Outcome = 'pass'; Reason = "time source '$src' [CSCRF-SIEM-01]" } 'siem-01'
    cleanup: |
      $ErrorActionPreference = 'SilentlyContinue'
      function Write-CgVerdict { param([string]$Outcome, [string]$Reason, [string]$Id)
      $p = 'SKIP'
      if ($Outcome -eq 'pass') { $p = 'PASS' } elseif ($Outcome -eq 'fail') { $p = 'FAIL' } elseif ($Outcome -eq 'error') { $p = 'ERROR' }
      Write-Output ($p + ': ' + $Reason + ' [BAS-SIEM-' + $Id + ']')
      }
      function Complete-CgStep { param($Res, [string]$Id) Write-CgVerdict $Res.Outcome $Res.Reason $Id; exit 0 }
      Write-Output 'PASS: Cleanup complete'
      exit 0

  # -------------------------------------------------------------------------
  - id: siem-02
    name: "Windows Event Forwarding Subscription Manager (T1562.002, internal ref CSCRF-SIEM-02)"
    technique_id: T1562.002
    action_key: cscrf_siem_forwarding_config
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Read-only registry query."
    telemetry:
      - "Registry read"
    detection:
      - "Event forwarding configuration review"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      function Write-CgVerdict { param([string]$Outcome, [string]$Reason, [string]$Id)
      $p = 'SKIP'
      if ($Outcome -eq 'pass') { $p = 'PASS' } elseif ($Outcome -eq 'fail') { $p = 'FAIL' } elseif ($Outcome -eq 'error') { $p = 'ERROR' }
      Write-Output ($p + ': ' + $Reason + ' [BAS-SIEM-' + $Id + ']')
      }
      function Complete-CgStep { param($Res, [string]$Id) Write-CgVerdict $Res.Outcome $Res.Reason $Id; exit 0 }
      $k = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\EventForwarding\SubscriptionManager'
      $v = (Get-ItemProperty -Path $k -ErrorAction SilentlyContinue)
      $values = @()
      if ($v) { $values = @($v.PSObject.Properties | Where-Object { $_.Name -like '1*' } | ForEach-Object { $_.Value }) }
      if ($values.Count -gt 0) { Complete-CgStep @{ Outcome = 'pass'; Reason = "subscription manager configured ($($values.Count) entry/entries) [CSCRF-SIEM-02]" } 'siem-02' }
      Complete-CgStep @{ Outcome = 'fail'; Reason = 'no Windows Event Forwarding subscription manager configured; events are not forwarded by policy [CSCRF-SIEM-02]' } 'siem-02'
    cleanup: |
      $ErrorActionPreference = 'SilentlyContinue'
      function Write-CgVerdict { param([string]$Outcome, [string]$Reason, [string]$Id)
      $p = 'SKIP'
      if ($Outcome -eq 'pass') { $p = 'PASS' } elseif ($Outcome -eq 'fail') { $p = 'FAIL' } elseif ($Outcome -eq 'error') { $p = 'ERROR' }
      Write-Output ($p + ': ' + $Reason + ' [BAS-SIEM-' + $Id + ']')
      }
      function Complete-CgStep { param($Res, [string]$Id) Write-CgVerdict $Res.Outcome $Res.Reason $Id; exit 0 }
      Write-Output 'PASS: Cleanup complete'
      exit 0

  # -------------------------------------------------------------------------
  - id: siem-04
    name: "Security Log Retention Configuration (T1070.001, internal ref CSCRF-SIEM-04)"
    technique_id: T1070.001
    action_key: cscrf_siem_log_retention
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Read-only query of the Security log size and retention mode."
    telemetry:
      - "Event log configuration query"
    detection:
      - "Log retention review"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      function Write-CgVerdict { param([string]$Outcome, [string]$Reason, [string]$Id)
      $p = 'SKIP'
      if ($Outcome -eq 'pass') { $p = 'PASS' } elseif ($Outcome -eq 'fail') { $p = 'FAIL' } elseif ($Outcome -eq 'error') { $p = 'ERROR' }
      Write-Output ($p + ': ' + $Reason + ' [BAS-SIEM-' + $Id + ']')
      }
      function Complete-CgStep { param($Res, [string]$Id) Write-CgVerdict $Res.Outcome $Res.Reason $Id; exit 0 }
      try { $log = Get-WinEvent -ListLog Security -ErrorAction Stop } catch { Complete-CgStep @{ Outcome = 'error'; Reason = 'Security log configuration could not be read [CSCRF-SIEM-04]' } 'siem-04' }
      $gb = [math]::Round($log.MaximumSizeInBytes / 1GB, 2)
      $problems = @()
      if ($log.LogMode -eq 'Circular') { $problems += 'circular mode overwrites old events' }
      if ($log.MaximumSizeInBytes -lt 1GB) { $problems += "size $gb GB below 1 GB baseline" }
      if ($problems.Count -gt 0) { Complete-CgStep @{ Outcome = 'fail'; Reason = ('Security log: ' + ($problems -join '; ') + ' [CSCRF-SIEM-04]') } 'siem-04' }
      Complete-CgStep @{ Outcome = 'pass'; Reason = "Security log $gb GB, mode $($log.LogMode) [CSCRF-SIEM-04]" } 'siem-04'
    cleanup: |
      $ErrorActionPreference = 'SilentlyContinue'
      function Write-CgVerdict { param([string]$Outcome, [string]$Reason, [string]$Id)
      $p = 'SKIP'
      if ($Outcome -eq 'pass') { $p = 'PASS' } elseif ($Outcome -eq 'fail') { $p = 'FAIL' } elseif ($Outcome -eq 'error') { $p = 'ERROR' }
      Write-Output ($p + ': ' + $Reason + ' [BAS-SIEM-' + $Id + ']')
      }
      function Complete-CgStep { param($Res, [string]$Id) Write-CgVerdict $Res.Outcome $Res.Reason $Id; exit 0 }
      Write-Output 'PASS: Cleanup complete'
      exit 0
