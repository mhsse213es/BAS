id: "cscrf-mii-siem"
product_line: common
name: "CSCRF-MII SIEM Telemetry Pipeline Configuration Checks (P0)"
description: >
  Internal control-validation configuration checks for the telemetry pipeline on an endpoint: time source,
  Windows Event Forwarding subscription manager, and Security log retention. Verdicts are internal control
  references (CSCRF-SIEM-*), not SEBI clause identifiers. All checks are read only. Ingestion verification
  (an event generated here arriving at the SIEM) is deferred until a collector endpoint is named. A PASS
  here shows only that the endpoint is configured; it does not show the SOC received or acted on anything.
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - cscrf-mii
  - siem
  - telemetry
  - p0
mitre_phases:
  - defense-evasion

steps:

  # -------------------------------------------------------------------------
  - id: siem-01
    name: "Time Source Configuration (T1070.006, internal ref CSCRF-SIEM-01)"
    technique_id: T1070.006
    action_key: cscrf_siem_time_sync
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Read-only query of the Windows time service status."
    telemetry:
      - "w32tm status query"
    detection:
      - "Time source drift review"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      function Write-CgVerdict { param([string]$Outcome, [string]$Reason, [string]$Id)
      $p = 'SKIP'
      if ($Outcome -eq 'pass') { $p = 'PASS' } elseif ($Outcome -eq 'fail') { $p = 'FAIL' } elseif ($Outcome -eq 'error') { $p = 'ERROR' }
      Write-Output ($p + ': ' + $Reason + ' [BAS-SIEM-' + $Id + ']')
      }
      function Complete-CgStep { param($Res, [string]$Id) Write-CgVerdict $Res.Outcome $Res.Reason $Id; exit 0 }
      $script:CgRun = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0, [Math]::Min(8, $env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 2147483647) }
      function Test-CgSiemGate { return ($env:BAS_CONFIRM_SIEM_TEST -eq 'true') }
      function Get-CgUndoPath { param([string]$Id) return (Join-Path $env:TEMP ('bas-cg-undo\' + $Id + '.json')) }
      function New-CgUndoRecord { param([string]$Id, $Data)
      $p = Get-CgUndoPath $Id
      New-Item -ItemType Directory -Force -Path (Split-Path -Parent $p) | Out-Null
      $fs = [IO.File]::Open($p, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write)
      try { $b = [Text.Encoding]::ASCII.GetBytes(($Data | ConvertTo-Json -Depth 6 -Compress)); $fs.Write($b, 0, $b.Length) } finally { $fs.Close() }
      }
      function Read-CgUndoRecord { param([string]$Id)
      $p = Get-CgUndoPath $Id
      if (-not (Test-Path -LiteralPath $p)) { return $null }
      try { return (Get-Content -LiteralPath $p -Raw | ConvertFrom-Json) } catch { return 'unreadable' }
      }
      function Remove-CgUndoRecord { param([string]$Id) Remove-Item -LiteralPath (Get-CgUndoPath $Id) -Force -ErrorAction SilentlyContinue }
      $out = (& w32tm.exe /query /status 2>&1) -join "`n"
      if ($LASTEXITCODE -ne 0 -or $out -notmatch 'Source:') { Complete-CgStep @{ Outcome = 'error'; Reason = 'time service status could not be read [CSCRF-SIEM-01]' } 'siem-01' }
      $src = [regex]::Match($out, 'Source:\s*(.+)').Groups[1].Value.Trim()
      if ($src -match 'Local CMOS Clock|Free-running|VM IC') { Complete-CgStep @{ Outcome = 'fail'; Reason = "time source is '$src'; not a network time source; event timestamps may drift from the SIEM [CSCRF-SIEM-01]" } 'siem-01' }
      Complete-CgStep @{ Outcome = 'pass'; Reason = "time source '$src' [CSCRF-SIEM-01]" } 'siem-01'
    cleanup: |
      $ErrorActionPreference = 'SilentlyContinue'
      function Write-CgVerdict { param([string]$Outcome, [string]$Reason, [string]$Id)
      $p = 'SKIP'
      if ($Outcome -eq 'pass') { $p = 'PASS' } elseif ($Outcome -eq 'fail') { $p = 'FAIL' } elseif ($Outcome -eq 'error') { $p = 'ERROR' }
      Write-Output ($p + ': ' + $Reason + ' [BAS-SIEM-' + $Id + ']')
      }
      function Complete-CgStep { param($Res, [string]$Id) Write-CgVerdict $Res.Outcome $Res.Reason $Id; exit 0 }
      $script:CgRun = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0, [Math]::Min(8, $env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 2147483647) }
      function Test-CgSiemGate { return ($env:BAS_CONFIRM_SIEM_TEST -eq 'true') }
      function Get-CgUndoPath { param([string]$Id) return (Join-Path $env:TEMP ('bas-cg-undo\' + $Id + '.json')) }
      function New-CgUndoRecord { param([string]$Id, $Data)
      $p = Get-CgUndoPath $Id
      New-Item -ItemType Directory -Force -Path (Split-Path -Parent $p) | Out-Null
      $fs = [IO.File]::Open($p, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write)
      try { $b = [Text.Encoding]::ASCII.GetBytes(($Data | ConvertTo-Json -Depth 6 -Compress)); $fs.Write($b, 0, $b.Length) } finally { $fs.Close() }
      }
      function Read-CgUndoRecord { param([string]$Id)
      $p = Get-CgUndoPath $Id
      if (-not (Test-Path -LiteralPath $p)) { return $null }
      try { return (Get-Content -LiteralPath $p -Raw | ConvertFrom-Json) } catch { return 'unreadable' }
      }
      function Remove-CgUndoRecord { param([string]$Id) Remove-Item -LiteralPath (Get-CgUndoPath $Id) -Force -ErrorAction SilentlyContinue }
      Write-Output 'PASS: Cleanup complete'
      exit 0

