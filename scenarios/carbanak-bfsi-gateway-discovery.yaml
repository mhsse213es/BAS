id: carbanak-bfsi-gateway-discovery
product_line: killchain
name: Carbanak BFSI Payment Gateway Configuration Discovery (Item 10)
description: >
  Lists the NAMES of files in fixed configuration folders that match payment-
  gateway patterns. File contents are never opened. [BAS-SIM-CARBANAK-S10]
  tagged. Grounded in MITRE ATT&CK T1083 (File and Directory Discovery).
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - carbanak
  - bfsi
  - discovery
  - t1083
mitre_phases:
  - discovery

live_policy:
  block_on_domain_controller: false
  require_dc_reachable: false
  max_spray_attempts: 0
  spray_account_allowlist: []
  execution_window: ""

steps:
  - name: "Carbanak Item 10 -- Payment Gateway Configuration Discovery (T1083)"
    technique_id: T1083
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: lab-only
    production_safe: true
    risk: low
    blast_radius: "Lists file names in a fixed set of configuration folders. No file is opened or read."
    reversible: true
    telemetry:
      - "Sysmon EID 1 for the directory listing process"
    detection:
      - "EDR: directory enumeration of payment-gateway configuration folders by a non-administrative process"
    threat_intel_sources:
      - reference: "MITRE ATT&CK -- T1083"
        url: "https://attack.mitre.org/techniques/T1083/"
    last_reviewed: "2026-11-21"
    family_attribution_confidence: reported
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $roots = @("$env:ProgramData", "$env:ProgramFiles", "$env:ProgramFiles(x86)") | Where-Object { $_ }
      $hits = foreach ($r in $roots) { Get-ChildItem -Path $r -Recurse -Depth 3 -File -Include '*gateway*','*payment*' | Select-Object -ExpandProperty Name }
      $names = @($hits | Select-Object -Unique)
      Write-Output "EXEC 10: $($names.Count) gateway-config file name(s) matched. Names only. [BAS-SIM-CARBANAK-S10]"
    cleanup: ""
