id: ad-password-spray-lab
product_line: ad
name: Password Spraying Against Synthetic Lab Accounts
description: >
  Telemetry-safe emulation of password spraying, limited to three synthetic accounts
  created for this lab (bassim1, bassim2, bassim3). Each run makes exactly one
  wrong-password attempt per account. The guess is a fixed, obviously fake string, so
  no real credential is ever tested. The scenario refuses to run unless every guardrail
  holds, and it reports whether the attempts were visible in domain-controller logs.

  Guardrails, all enforced in the script:
    - Accounts are hard-coded to bassim1..3. No other account can be named.
    - The DC must appear in C:\bas-lab\allowed-targets.txt.
    - The domain lockout threshold must be between 1 and 5. "Never" is refused.
    - One attempt per account per run.
    - Refused if any of these accounts already failed in the last 30 minutes, so runs
      cannot stack past the lockout window.

  KILL CHAIN STAGES:
    1. Preflight: check the target, the lockout policy, and the accounts (T1110.003)
    2. Spray: one wrong-password attempt per synthetic account (T1110.003)
    3. Telemetry: count the resulting Kerberos or NTLM failure events on the DC (T1110.003)

  SAFETY: Lab domain only. Synthetic accounts only. No real password is guessed, and
  no account is locked, because each account gets one failure per run.
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - password-spraying
  - authentication
  - active-directory
  - detection
  - t1110
  - mitre
mitre_phases:
  - credential-access

live_policy:
  block_on_domain_controller: false
  require_dc_reachable: true
  max_spray_attempts: 3
  spray_account_allowlist: [bassim1, bassim2, bassim3]
  execution_window: ""

steps:

  # ---------------------------------------------------------------------------
  # Stage 1 — Preflight (T1110.003)
  # ---------------------------------------------------------------------------
  - name: "Spray 1 — Preflight: Target, Lockout Policy, Synthetic Accounts (T1110.003)"
    technique_id: T1110.003
    framework: custom
    executor: powershell
    requires_priv: domain_admin
    timeout_sec: 60
    fidelity: telemetry-safe
    production_safe: false
    risk: medium
    reversible: true
    blast_radius: "Reads the target list, the domain lockout policy, and the three synthetic accounts. Changes nothing. Sets no state for Stage 2 except the in-memory preflight result."
    telemetry:
      - "Security EID 4662 on the accounts, when DS Access auditing is on"
    detection:
      - "SIEM: enumeration of a named account set from a non-admin process — spray precursor"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $accounts = @('bassim1','bassim2','bassim3')
      $dom = (Get-CimInstance Win32_ComputerSystem).Domain
      if (-not $dom) { Write-Output "SKIP: host is not domain-joined. No attempt made. [BAS-SIM-SPR-S1]"; exit 0 }
      $dcLine = nltest /dsgetdc:$dom | Select-String 'DC:' | Select-Object -First 1
      $dc = if ($dcLine) { ($dcLine.ToString() -split '\\')[-1].Trim() } else { '' }
      $allowed = @(Get-Content 'C:\bas-lab\allowed-targets.txt' -ErrorAction SilentlyContinue | ForEach-Object { $_.Trim() })
      if (-not $dc -or ($allowed -notcontains $dc)) {
        Write-Output "SKIP: DC '$dc' is not in allowed-targets.txt. Refusing. [BAS-SIM-SPR-S1]"
        exit 0
      }
      $lockLine = net accounts /domain | Select-String 'Lockout threshold' | Select-Object -First 1
      $threshold = if ($lockLine) { ($lockLine.ToString() -split '\s+')[-1] } else { '' }
      if ($threshold -notmatch '^\d+$' -or [int]$threshold -lt 1 -or [int]$threshold -gt 5) {
        Write-Output "SKIP: lockout threshold is '$threshold'. Needs 1 to 5, not Never. Refusing. [BAS-SIM-SPR-S1]"
        exit 0
      }
      Import-Module ActiveDirectory
      $found = @(Get-ADUser -Filter "SamAccountName -eq 'bassim1' -or SamAccountName -eq 'bassim2' -or SamAccountName -eq 'bassim3'" -SearchBase "OU=BAS-Sim,$((Get-ADDomain).DistinguishedName)" -ErrorAction SilentlyContinue)
      if ($found.Count -ne 3) {
        Write-Output "SKIP: expected 3 synthetic accounts in OU=BAS-Sim, found $($found.Count). Refusing. [BAS-SIM-SPR-S1]"
        exit 0
      }
      $since = (Get-Date).AddMinutes(-30)
      $recent = @(Get-WinEvent -FilterHashtable @{ LogName = 'Security'; Id = 4625, 4771; StartTime = $since } -ErrorAction SilentlyContinue | Where-Object { $_.Message -match 'bassim[123]' })
      if ($recent.Count -gt 0) {
        Write-Output "SKIP: $($recent.Count) failure event(s) for the synthetic accounts in the last 30 minutes. Waiting for the lockout window to clear. [BAS-SIM-SPR-S1]"
        exit 0
      }
      Write-Output "EXEC T1110.003: preflight passed. DC=$dc, lockout threshold=$threshold, accounts=3, no failures in the last 30 minutes. [BAS-SIM-SPR-S1]"
    cleanup: ""

  # ---------------------------------------------------------------------------
  # Stage 2 — Spray (T1110.003)
  # ---------------------------------------------------------------------------
  - name: "Spray 2 — One Wrong-Password Attempt per Synthetic Account (T1110.003)"
    technique_id: T1110.003
    framework: custom
    executor: powershell
    requires_priv: domain_admin
    timeout_sec: 90
    fidelity: telemetry-safe
    production_safe: false
    risk: medium
    reversible: true
    blast_radius: "Exactly one wrong-password validation per account (bassim1..3). The guess is the fixed string BAS-SIM-Spray-Wrong-1!, which is not a credential. Each account gets one failure, under the lockout threshold."
    telemetry:
      - "Security EID 4625 (NTLM/logon failure) or 4771 (Kerberos pre-auth failure) on the DC"
    detection:
      - "SIEM: a burst of failed authentications across several accounts in one minute — password-spray IOC"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      Add-Type -AssemblyName System.DirectoryServices.AccountManagement
      $dom = (Get-CimInstance Win32_ComputerSystem).Domain
      $guess = 'BAS-SIM-Spray-Wrong-1!'
      $ctx = New-Object System.DirectoryServices.AccountManagement.PrincipalContext('Domain', $dom)
      $results = @()
      foreach ($sam in @('bassim1','bassim2','bassim3')) {
        $ok = $ctx.ValidateCredentials($sam, $guess)
        $results += "$sam=$(if ($ok) { 'valid(unexpected)' } else { 'rejected' })"
      }
      $ctx.Dispose()
      Write-Output "EXEC T1110.003: one attempt per synthetic account: $($results -join ', '). Fixed fake guess; no real credential tested. [BAS-SIM-SPR-S2]"
      if ($results -match 'valid\(unexpected\)') {
        Write-Output "FAIL: a synthetic account accepted the fake guess. Investigate the account before continuing."
      }
    cleanup: ""

  # ---------------------------------------------------------------------------
  # Stage 3 — Telemetry visibility (T1110.003)
  # ---------------------------------------------------------------------------
  - name: "Spray 3 — Failure Events for the Attempts Visible on the DC (T1110.003)"
    technique_id: T1110.003
    framework: custom
    executor: powershell
    requires_priv: domain_admin
    timeout_sec: 90
    fidelity: telemetry-safe
    production_safe: false
    risk: low
    reversible: true
    blast_radius: "Reads Security log events 4625 and 4771 from the last 10 minutes and counts those for the synthetic accounts. Changes nothing."
    telemetry:
      - "Security EID 4625 and 4771 on the DC: the events this stage counts"
    detection:
      - "SIEM: spray alert should fire on the same burst. This stage checks logging only, not alerting."
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $events = @(Get-WinEvent -FilterHashtable @{ LogName = 'Security'; Id = 4625, 4771; StartTime = (Get-Date).AddMinutes(-10) } -MaxEvents 2000 -ErrorAction SilentlyContinue)
      $hits = @($events | Where-Object { $_.Message -match 'bassim[123]' })
      Write-Output "EXEC T1110.003: failure events for synthetic accounts in the last 10 minutes = $($hits.Count) (expected at least 3 from Stage 2). [BAS-SIM-SPR-S3]"
      if ($hits.Count -ge 3) {
        Write-Output "PASS: the DC logged the spray attempts. This proves logging only; alerting needs a separate check in the SIEM."
      } else {
        Write-Output "SKIP: fewer than 3 matching failure events. Either auditing is off for logon failures or Stage 2 did not run. Inconclusive. [BAS-SIM-SPR-S3]"
      }
    cleanup: ""
