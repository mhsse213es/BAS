id: windows-credential-protection-posture
product_line: av
name: Windows Credential Protection and Privilege Exposure Posture
description: >
  Read-only posture audit of how a Windows host protects credentials and limits privilege:
  LSA protection, WDigest caching, local Administrators exposure, SMB security, NTLM and
  delegation settings, privileged group and user-rights exposure, account policy and
  security auditing. Nothing is changed. Each check reports PASS, FAIL, ERROR or SKIP with
  the observed value, the expected baseline, the evidence source and, for a SKIP, the reason.

  Checks that need an organizational baseline read it from
  C:\ProgramData\Audspect\posture-baseline.json (admin_allowlist, min_password_length,
  max_lockout_threshold, max_password_age_days). Without a value for a check, that check
  reports NOT_ASSESSED (SKIP), never PASS. This scenario never creates the baseline file.

  Credential-theft checks (LSASS access, Credential Guard, LSA packages, DPAPI, Credential
  Manager, cached logons, Kerberos AES, NTLM level 5, delegation wildcards, RestrictAnonymous)
  belong to Endpoint Mastery 04 and are not repeated here. The first four checks are the
  original posture checks, kept with clearer evidence.
local_check: true
executable: false
supported_os: [windows]
tags:
  - credential-access
  - privilege
  - posture
  - windows
  - read-only
contract:
  objective: Confirm the host limits credential exposure, carries no unexplained administrators, and keeps SMB, NTLM, delegation, group, account and audit settings at a defensible level.
  prerequisites:
    os: Windows Server 2019 or later, Windows 10 or later
    product: LSA, WDigest, SMB, NTLM, delegation, local groups, auditpol, secedit, Active Directory module (optional)
    permissions: local administrator read access; auditpol and secedit need elevation
    telemetry: none required for the posture result
  variants:
    baseline: current configuration against the Microsoft-recommended value or the organizational baseline file
    variation: not applicable; single-state read
    negative_controls: an unavailable cmdlet, an unreadable value, a missing AD module or a missing baseline value reports SKIP for that check
  expected_prevention:
    control: LSA protected, WDigest off, SMBv1 off on server and client, SMB signing and encryption required, no broad principal in privileged groups or dangerous user rights, delegation not unconstrained, account policy at baseline, security auditing on
    authoritative_proof: the registry, configuration, policy export, auditpol output or directory attribute read in each step
  expected_detection:
    observables: not applicable; this scenario reads configuration
    telemetry_sources: none
  response_validation:
    alert_to_incident: not evaluated by this scenario
    containment_check: not evaluated
  evidence_contract:
    required: observed value, expected baseline, evidence source (registry path, cmdlet, policy section or attribute), host identifier, timestamp
    identifiers: registry value path, account name and SID, group name, service name
    missing_data_is: an unreadable value is SKIP for that check, never PASS
  cleanup_recovery:
    artifacts_removed: the secedit export written to %TEMP% is deleted in the same step that writes it
    access_revocation_verified: not applicable
  remediation_retest:
    change: enable RunAsPPL, disable WDigest, remove unexpected administrators, disable SMBv1 on server and client, require SMB signing, set account policy to baseline, enable the audit subcategories
    retest: the same scenario must return PASS for each changed check
  limitations:
    - does not test Credential Guard runtime state or LSASS access; those are Endpoint Mastery 04
    - the administrator allowlist and account policy thresholds are organizational decisions; without them those checks are NOT_ASSESSED
    - RunAsPPL configured does not prove LSASS runs protected at runtime
    - SMBv1 server and SMBv1 client are separate checks; neither result implies the other
    - a large Administrators group is not a finding by itself; membership is reported and compared with the allowlist
    - NTLM being available is not a finding by itself; only restriction and auditing are checked
    - nested membership is reported as not expanded; expanding domain groups needs a directory query
    - unconstrained and protocol-transition delegation need the Active Directory module and a domain-joined host; otherwise SKIP
    - auditpol subcategory names are English; on a localized Windows the audit checks report SKIP
steps:
  - name: "LSA protected process mode (RunAsPPL) configured"
    check_id: windows-credprot-lsa-ppl
    technique_id: T1003.001
    framework: custom
    executor: local
    timeout_sec: 30
    command: |
      $v = (Get-ItemProperty -LiteralPath 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -ErrorAction SilentlyContinue).RunAsPPL
      $src = 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa\RunAsPPL'
      if ($v -eq 1 -or $v -eq 2) { Write-Output "PASS: LSA is configured as a protected process | observed=RunAsPPL=$v | expected=1 or 2 | source=$src" }
      elseif ($null -eq $v) { Write-Output "FAIL: LSA is not configured as a protected process | observed=RunAsPPL absent | expected=1 or 2 | source=$src" }
      else { Write-Output "FAIL: LSA is not configured as a protected process | observed=RunAsPPL=$v | expected=1 or 2 | source=$src" }

  - name: "WDigest cleartext credential caching disabled"
    check_id: windows-credprot-wdigest
    technique_id: T1003.001
    framework: custom
    executor: local
    timeout_sec: 30
    command: |
      $p = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest'
      $v = (Get-ItemProperty -LiteralPath $p -ErrorAction SilentlyContinue).UseLogonCredential
      $src = 'HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest\UseLogonCredential'
      if ($v -eq 1) { Write-Output "FAIL: WDigest caches cleartext credentials | observed=UseLogonCredential=1 | expected=0 or absent | source=$src" }
      else { $o = if ($null -eq $v) { 'absent (OS default, disabled on current Windows)' } else { "UseLogonCredential=$v" }; Write-Output "PASS: WDigest does not cache cleartext credentials | observed=$o | expected=0 or absent | source=$src" }

  - name: "Local Administrators membership compared with the organizational allowlist"
    check_id: windows-credprot-local-admins
    technique_id: T1078.003
    framework: custom
    executor: local
    timeout_sec: 60
    command: |
      $bp = 'C:\ProgramData\Audspect\posture-baseline.json'
      $allow = $null
      if (Test-Path -LiteralPath $bp) { try { $allow = @((Get-Content -LiteralPath $bp -Raw | ConvertFrom-Json).admin_allowlist) } catch { $allow = $null } }
      $m = @(Get-LocalGroupMember -Group 'Administrators' -ErrorAction Stop)
      $list = (@($m | ForEach-Object { "$($_.Name)|SID=$($_.SID.Value)|source=$($_.PrincipalSource)|class=$($_.ObjectClass)|path=Administrators (direct)" })) -join '; '
      $obs = "total=$($m.Count) members=[$list] nested=not expanded"
      if ($null -eq $allow -or $allow.Count -eq 0) { Write-Output "SKIP: not assessed; no organizational allowlist configured in $bp | observed=$obs | source=Get-LocalGroupMember Administrators"; exit 0 }
      $unexp = @($m | Where-Object { ($allow -notcontains $_.Name) -and ($allow -notcontains $_.SID.Value) })
      if ($unexp.Count -eq 0) { Write-Output "PASS: every Administrators member is on the organizational allowlist | observed=$obs | expected=allowlist from $bp | source=Get-LocalGroupMember Administrators" }
      else { Write-Output "FAIL: members not on the organizational allowlist: $((@($unexp | ForEach-Object { $_.Name })) -join '; ') | observed=$obs | expected=allowlist from $bp | source=Get-LocalGroupMember Administrators" }

  - name: "Built-in Administrator account (SID -500) is disabled"
    check_id: windows-credprot-builtin-admin
    technique_id: T1078.003
    framework: custom
    executor: local
    timeout_sec: 30
    command: |
      $u = @(Get-LocalUser -ErrorAction Stop | Where-Object { $_.SID.Value -like '*-500' })
      if ($u.Count -eq 0) { Write-Output 'SKIP: not assessed; built-in administrator account not found on this host | source=Get-LocalUser'; exit 0 }
      $a = $u[0]
      $obs = "name=$($a.Name) enabled=$($a.Enabled) sid=$($a.SID.Value)"
      if (-not $a.Enabled) { Write-Output "PASS: built-in administrator account is disabled | observed=$obs | expected=disabled | source=Get-LocalUser" }
      else { Write-Output "FAIL: built-in administrator account is enabled | observed=$obs | expected=disabled | source=Get-LocalUser" }

  - name: "Local user accounts holding Administrators membership are enabled"
    check_id: windows-credprot-disabled-admins
    technique_id: T1078.003
    framework: custom
    executor: local
    timeout_sec: 60
    command: |
      $m = @(Get-LocalGroupMember -Group 'Administrators' -ErrorAction Stop | Where-Object { $_.ObjectClass -eq 'User' -and $_.PrincipalSource -eq 'Local' })
      if ($m.Count -eq 0) { Write-Output 'PASS: no local user accounts hold Administrators membership | observed=0 local user members | expected=no disabled local administrators | source=Get-LocalGroupMember Administrators'; exit 0 }
      $rows = @()
      foreach ($x in $m) {
        try { $lu = Get-LocalUser -SID $x.SID -ErrorAction Stop; $rows += "$($x.Name)|enabled=$($lu.Enabled)|lastLogon=$($lu.LastLogon)" }
        catch { $rows += "$($x.Name)|unreadable" }
      }
      $dis = @($rows | Where-Object { $_ -match '\|enabled=False\|' })
      $unread = @($rows | Where-Object { $_ -match 'unreadable' })
      $obs = "local user admins=[$($rows -join '; ')]"
      if ($dis.Count -gt 0) { Write-Output "FAIL: disabled local accounts retain Administrators membership | observed=$obs | expected=no disabled local administrators | source=Get-LocalUser -SID" }
      elseif ($unread.Count -gt 0) { Write-Output "SKIP: some local administrator accounts could not be read | observed=$obs | source=Get-LocalUser -SID" }
      else { Write-Output "PASS: every local administrator account is enabled | observed=$obs | expected=no disabled local administrators | source=Get-LocalUser -SID" }

  - name: "SMBv1 server protocol disabled"
    check_id: windows-credprot-smb1
    technique_id: T1210
    framework: custom
    executor: local
    timeout_sec: 30
    command: |
      try { $c = Get-SmbServerConfiguration -ErrorAction Stop } catch { Write-Output 'SKIP: SMB server configuration unreadable | source=Get-SmbServerConfiguration'; exit 0 }
      if (-not $c.EnableSMB1Protocol) { Write-Output "PASS: SMBv1 server protocol is disabled | observed=EnableSMB1Protocol=False | expected=False | source=Get-SmbServerConfiguration" }
      else { Write-Output "FAIL: SMBv1 server protocol is enabled | observed=EnableSMB1Protocol=True | expected=False | source=Get-SmbServerConfiguration" }

  - name: "SMBv1 client driver disabled (mrxsmb10 start type)"
    check_id: windows-credprot-smb1-client
    technique_id: T1210
    framework: custom
    executor: local
    timeout_sec: 30
    command: |
      $p = 'HKLM:\SYSTEM\CurrentControlSet\Services\mrxsmb10'
      $s = (Get-ItemProperty -LiteralPath $p -ErrorAction SilentlyContinue).Start
      $src = 'HKLM\SYSTEM\CurrentControlSet\Services\mrxsmb10\Start'
      if ($null -eq $s) { Write-Output "SKIP: SMBv1 client driver key not present; client state not determined | observed=absent | expected=Start=4 | source=$src" }
      elseif ($s -eq 4) { Write-Output "PASS: SMBv1 client driver is disabled | observed=Start=4 | expected=Start=4 | source=$src" }
      else { Write-Output "FAIL: SMBv1 client driver is not disabled | observed=Start=$s | expected=Start=4 | source=$src" }

  - name: "SMB server requires signing"
    check_id: windows-credprot-smb-server-signing
    technique_id: T1557.001
    framework: custom
    executor: local
    timeout_sec: 30
    command: |
      try { $c = Get-SmbServerConfiguration -ErrorAction Stop } catch { Write-Output 'SKIP: SMB server configuration unreadable | source=Get-SmbServerConfiguration'; exit 0 }
      if ($c.RequireSecuritySignature) { Write-Output "PASS: SMB server requires signing | observed=RequireSecuritySignature=True | expected=True | source=Get-SmbServerConfiguration" }
      else { Write-Output "FAIL: SMB server does not require signing | observed=RequireSecuritySignature=False | expected=True | source=Get-SmbServerConfiguration" }

  - name: "SMB server encryption is enabled server-wide"
    check_id: windows-credprot-smb-encryption
    technique_id: T1021.002
    framework: custom
    executor: local
    timeout_sec: 30
    command: |
      try { $c = Get-SmbServerConfiguration -ErrorAction Stop } catch { Write-Output 'SKIP: SMB server configuration unreadable | source=Get-SmbServerConfiguration'; exit 0 }
      $shares = @(Get-SmbShare -ErrorAction SilentlyContinue | Where-Object { -not $_.Special })
      $unenc = @($shares | Where-Object { -not $_.EncryptData }).Count
      $obs = "EncryptData=$($c.EncryptData) non-special shares without encryption=$unenc of $($shares.Count)"
      if ($c.EncryptData) { Write-Output "PASS: SMB server encryption is enabled server-wide | observed=$obs | expected=EncryptData=True | source=Get-SmbServerConfiguration, Get-SmbShare" }
      else { Write-Output "FAIL: SMB server encryption is not enabled server-wide | observed=$obs | expected=EncryptData=True | source=Get-SmbServerConfiguration, Get-SmbShare" }

  - name: "Insecure guest logons to SMB shares are not allowed"
    check_id: windows-credprot-smb-guest
    technique_id: T1021.002
    framework: custom
    executor: local
    timeout_sec: 30
    command: |
      $p = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters'
      $v = (Get-ItemProperty -LiteralPath $p -ErrorAction SilentlyContinue).AllowInsecureGuestAuth
      $src = 'HKLM\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters\AllowInsecureGuestAuth'
      if ($v -eq 1) { Write-Output "FAIL: insecure guest logons are allowed | observed=AllowInsecureGuestAuth=1 | expected=0 or absent | source=$src" }
      else { $o = if ($null -eq $v) { 'absent (default 0)' } else { "AllowInsecureGuestAuth=$v" }; Write-Output "PASS: insecure guest logons are not allowed | observed=$o | expected=0 or absent | source=$src" }

  - name: "SMB client requires signing"
    check_id: windows-credprot-smb-client-signing
    technique_id: T1557.001
    framework: custom
    executor: local
    timeout_sec: 30
    command: |
      $p = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters'
      $v = (Get-ItemProperty -LiteralPath $p -ErrorAction SilentlyContinue).RequireSecuritySignature
      $src = 'HKLM\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters\RequireSecuritySignature'
      if ($v -eq 1) { Write-Output "PASS: SMB client requires signing | observed=RequireSecuritySignature=1 | expected=1 | source=$src" }
      else { $o = if ($null -eq $v) { 'absent (default 0)' } else { "RequireSecuritySignature=$v" }; Write-Output "FAIL: SMB client does not require signing | observed=$o | expected=1 | source=$src" }

  - name: "Outbound NTLM traffic is restricted"
    check_id: windows-credprot-ntlm-outbound
    technique_id: T1550.002
    framework: custom
    executor: local
    timeout_sec: 30
    command: |
      $p = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
      $v = (Get-ItemProperty -LiteralPath $p -ErrorAction SilentlyContinue).RestrictSendingNTLMTraffic
      $src = 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0\RestrictSendingNTLMTraffic'
      if ($v -eq 1 -or $v -eq 2) { Write-Output "PASS: outbound NTLM is restricted | observed=RestrictSendingNTLMTraffic=$v | expected=1 or 2 | source=$src" }
      else { $o = if ($null -eq $v) { 'absent' } else { "RestrictSendingNTLMTraffic=$v" }; Write-Output "SKIP: not assessed; outbound NTLM restriction is an organizational decision, and NTLM availability is not a finding by itself | observed=$o | expected=organizational policy | source=$src" }

  - name: "Incoming NTLM authentication is audited"
    check_id: windows-credprot-ntlm-audit
    technique_id: T1550.002
    framework: custom
    executor: local
    timeout_sec: 30
    command: |
      $p = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
      $v = (Get-ItemProperty -LiteralPath $p -ErrorAction SilentlyContinue).AuditReceivingNTLMTraffic
      $src = 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0\AuditReceivingNTLMTraffic'
      if ($v -eq 2) { Write-Output "PASS: incoming NTLM authentication is audited | observed=AuditReceivingNTLMTraffic=2 | expected=2 | source=$src" }
      else { $o = if ($null -eq $v) { 'absent (not audited)' } else { "AuditReceivingNTLMTraffic=$v" }; Write-Output "FAIL: incoming NTLM authentication is not audited | observed=$o | expected=2 | source=$src" }

  - name: "Remote Desktop Users contain no broad principals"
    check_id: windows-credprot-group-rdp
    technique_id: T1078.003
    framework: custom
    executor: local
    timeout_sec: 30
    command: |
      $g = 'Remote Desktop Users'
      try { $m = @(Get-LocalGroupMember -Group $g -ErrorAction Stop) } catch { Write-Output "SKIP: group $g unreadable | source=Get-LocalGroupMember"; exit 0 }
      $broad = @('S-1-1-0','S-1-5-11','S-1-5-32-545','S-1-5-32-546')
      $bad = @($m | Where-Object { $broad -contains $_.SID.Value -or $_.SID.Value -like '*-513' })
      $obs = "total=$($m.Count) members=[$((@($m | ForEach-Object { $_.Name })) -join '; ')]"
      if ($bad.Count -eq 0) { Write-Output "PASS: no broad principal in $g | observed=$obs | expected=no Everyone, Authenticated Users, Users, Guests or Domain Users | source=Get-LocalGroupMember" }
      else { Write-Output "FAIL: broad principal in ${g}: $((@($bad | ForEach-Object { $_.Name })) -join '; ') | observed=$obs | expected=no broad principals | source=Get-LocalGroupMember" }

  - name: "Backup Operators contain no broad principals"
    check_id: windows-credprot-group-backup
    technique_id: T1078.003
    framework: custom
    executor: local
    timeout_sec: 30
    command: |
      $g = 'Backup Operators'
      try { $m = @(Get-LocalGroupMember -Group $g -ErrorAction Stop) } catch { Write-Output "SKIP: group $g unreadable | source=Get-LocalGroupMember"; exit 0 }
      $broad = @('S-1-1-0','S-1-5-11','S-1-5-32-545','S-1-5-32-546')
      $bad = @($m | Where-Object { $broad -contains $_.SID.Value -or $_.SID.Value -like '*-513' })
      $obs = "total=$($m.Count) members=[$((@($m | ForEach-Object { $_.Name })) -join '; ')]"
      if ($bad.Count -eq 0) { Write-Output "PASS: no broad principal in $g | observed=$obs | expected=no Everyone, Authenticated Users, Users, Guests or Domain Users | source=Get-LocalGroupMember" }
      else { Write-Output "FAIL: broad principal in ${g}: $((@($bad | ForEach-Object { $_.Name })) -join '; ') | observed=$obs | expected=no broad principals | source=Get-LocalGroupMember" }

  - name: "Remote Management Users contain no broad principals"
    check_id: windows-credprot-group-winrm
    technique_id: T1078.003
    framework: custom
    executor: local
    timeout_sec: 30
    command: |
      $g = 'Remote Management Users'
      try { $m = @(Get-LocalGroupMember -Group $g -ErrorAction Stop) } catch { Write-Output "SKIP: group $g unreadable | source=Get-LocalGroupMember"; exit 0 }
      $broad = @('S-1-1-0','S-1-5-11','S-1-5-32-545','S-1-5-32-546')
      $bad = @($m | Where-Object { $broad -contains $_.SID.Value -or $_.SID.Value -like '*-513' })
      $obs = "total=$($m.Count) members=[$((@($m | ForEach-Object { $_.Name })) -join '; ')]"
      if ($bad.Count -eq 0) { Write-Output "PASS: no broad principal in $g | observed=$obs | expected=no Everyone, Authenticated Users, Users, Guests or Domain Users | source=Get-LocalGroupMember" }
      else { Write-Output "FAIL: broad principal in ${g}: $((@($bad | ForEach-Object { $_.Name })) -join '; ') | observed=$obs | expected=no broad principals | source=Get-LocalGroupMember" }

  - name: "Dangerous user rights are not granted to broad principals"
    check_id: windows-credprot-user-rights
    technique_id: T1134
    framework: custom
    executor: local
    timeout_sec: 60
    command: |
      $t = Join-Path $env:TEMP ('bas_userrights_' + [guid]::NewGuid().ToString('N') + '.cfg')
      try {
        secedit /export /cfg $t /areas USER_RIGHTS | Out-Null
        $txt = Get-Content -LiteralPath $t -ErrorAction Stop
      } catch { Write-Output 'SKIP: user rights policy unreadable (secedit needs elevation) | source=secedit USER_RIGHTS'; exit 0 }
      finally { Remove-Item -LiteralPath $t -ErrorAction SilentlyContinue }
      $rights = 'SeDebugPrivilege','SeBackupPrivilege','SeRestorePrivilege','SeTakeOwnershipPrivilege','SeLoadDriverPrivilege'
      $broad = '*S-1-1-0','*S-1-5-11','*S-1-5-32-545','*S-1-5-32-546'
      $hits = @()
      foreach ($line in $txt) {
        foreach ($r in $rights) {
          if ($line -match "^$r\s*=") {
            $vals = ($line -split '=', 2)[1].Split(',') | ForEach-Object { $_.Trim() }
            foreach ($b in $broad) { if ($vals -contains $b) { $hits += "$r -> $b" } }
          }
        }
      }
      $obs = "rights checked=$($rights.Count) broad grants=[$($hits -join '; ')]"
      if ($hits.Count -eq 0) { Write-Output "PASS: dangerous user rights are not granted to broad principals | observed=$obs | expected=no broad principal holds these rights | source=secedit USER_RIGHTS" }
      else { Write-Output "FAIL: dangerous user rights granted to broad principals | observed=$obs | expected=no broad principal holds these rights | source=secedit USER_RIGHTS" }

  - name: "No service runs as a local administrator"
    check_id: windows-credprot-service-admin
    technique_id: T1078.003
    framework: custom
    executor: local
    timeout_sec: 60
    command: |
      try { $adm = @(Get-LocalGroupMember -Group 'Administrators' -ErrorAction Stop | ForEach-Object { ($_.Name -split '\\')[-1].ToLower() }) } catch { Write-Output 'SKIP: Administrators membership unreadable | source=Get-LocalGroupMember'; exit 0 }
      $svc = @(Get-CimInstance -ClassName Win32_Service -ErrorAction Stop | Where-Object { $_.StartName -and $_.StartName -notmatch '^(LocalSystem|LocalService|NetworkService)$' -and $_.StartName -notmatch '^NT (AUTHORITY|SERVICE)\\' })
      $hits = @($svc | Where-Object { $adm -contains (($_.StartName -split '\\')[-1].ToLower()) })
      $obs = "non-builtin service accounts=$($svc.Count) administrator service accounts=[$((@($hits | ForEach-Object { "$($_.Name) as $($_.StartName)" })) -join '; ')]"
      if ($hits.Count -eq 0) { Write-Output "PASS: no service runs as a local administrator | observed=$obs | expected=no service account in Administrators | source=Win32_Service StartName, Get-LocalGroupMember" }
      else { Write-Output "FAIL: services run as local administrators | observed=$obs | expected=no service account in Administrators | source=Win32_Service StartName, Get-LocalGroupMember" }

  - name: "Computer account is not trusted for unconstrained delegation"
    check_id: windows-credprot-unconstrained-delegation
    technique_id: T1558
    framework: custom
    executor: local
    timeout_sec: 60
    command: |
      if (-not (Get-Module -ListAvailable -Name ActiveDirectory)) { Write-Output 'SKIP: not assessed; ActiveDirectory module not available on this host | source=Get-ADComputer'; exit 0 }
      try { $c = Get-ADComputer -Identity $env:COMPUTERNAME -Properties TrustedForDelegation -ErrorAction Stop } catch { Write-Output 'SKIP: computer object unreadable (not domain-joined or no directory access) | source=Get-ADComputer'; exit 0 }
      $obs = "TrustedForDelegation=$($c.TrustedForDelegation)"
      if (-not $c.TrustedForDelegation) { Write-Output "PASS: computer account is not trusted for unconstrained delegation | observed=$obs | expected=False | source=Get-ADComputer" }
      else { Write-Output "FAIL: computer account is trusted for unconstrained delegation | observed=$obs | expected=False | source=Get-ADComputer" }

  - name: "Computer account does not use protocol transition delegation"
    check_id: windows-credprot-protocol-transition
    technique_id: T1558
    framework: custom
    executor: local
    timeout_sec: 60
    command: |
      if (-not (Get-Module -ListAvailable -Name ActiveDirectory)) { Write-Output 'SKIP: not assessed; ActiveDirectory module not available on this host | source=Get-ADComputer'; exit 0 }
      try { $c = Get-ADComputer -Identity $env:COMPUTERNAME -Properties TrustedToAuthForDelegation,'msDS-AllowedToDelegateTo' -ErrorAction Stop } catch { Write-Output 'SKIP: computer object unreadable | source=Get-ADComputer'; exit 0 }
      $tgts = @($c.'msDS-AllowedToDelegateTo')
      $obs = "TrustedToAuthForDelegation=$($c.TrustedToAuthForDelegation) delegation targets=$($tgts.Count)"
      if (-not $c.TrustedToAuthForDelegation) { Write-Output "PASS: computer account does not use protocol transition | observed=$obs | expected=False | source=Get-ADComputer" }
      else { Write-Output "FAIL: computer account uses protocol transition delegation | observed=$obs | expected=False | source=Get-ADComputer" }

  - name: "CredSSP encryption oracle remediation applied"
    check_id: windows-credprot-credssp-oracle
    technique_id: T1557
    framework: custom
    executor: local
    timeout_sec: 30
    command: |
      $p = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\CredSSP\Parameters'
      $v = (Get-ItemProperty -LiteralPath $p -ErrorAction SilentlyContinue).AllowEncryptionOracle
      $src = 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\CredSSP\Parameters\AllowEncryptionOracle'
      if ($v -eq 0) { Write-Output "PASS: CredSSP requires updated clients | observed=AllowEncryptionOracle=0 | expected=0 | source=$src" }
      elseif ($null -eq $v) { Write-Output "SKIP: not assessed; CredSSP encryption oracle policy not set, default not determined here | observed=absent | expected=0 | source=$src" }
      else { Write-Output "FAIL: CredSSP allows vulnerable or mitigated clients | observed=AllowEncryptionOracle=$v | expected=0 | source=$src" }

  - name: "Restricted Admin logon is not disabled"
    check_id: windows-credprot-restricted-admin
    technique_id: T1550.002
    framework: custom
    executor: local
    timeout_sec: 30
    command: |
      $p = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $v = (Get-ItemProperty -LiteralPath $p -ErrorAction SilentlyContinue).DisableRestrictedAdmin
      $src = 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa\DisableRestrictedAdmin'
      if ($v -eq 0) { Write-Output "PASS: Restricted Admin logon is available | observed=DisableRestrictedAdmin=0 | expected=0 | source=$src" }
      elseif ($null -eq $v) { Write-Output "SKIP: not assessed; DisableRestrictedAdmin not set, default not determined here | observed=absent | expected=0 | source=$src" }
      else { Write-Output "FAIL: Restricted Admin logon is disabled | observed=DisableRestrictedAdmin=$v | expected=0 | source=$src" }

  - name: "Guest account is disabled"
    check_id: windows-credprot-guest-account
    technique_id: T1078.001
    framework: custom
    executor: local
    timeout_sec: 30
    command: |
      $g = @(Get-LocalUser -ErrorAction Stop | Where-Object { $_.SID.Value -like '*-501' })
      if ($g.Count -eq 0) { Write-Output 'SKIP: Guest account not found | source=Get-LocalUser'; exit 0 }
      $obs = "name=$($g[0].Name) enabled=$($g[0].Enabled)"
      if (-not $g[0].Enabled) { Write-Output "PASS: Guest account is disabled | observed=$obs | expected=disabled | source=Get-LocalUser" }
      else { Write-Output "FAIL: Guest account is enabled | observed=$obs | expected=disabled | source=Get-LocalUser" }

  - name: "Minimum password length meets the organizational baseline"
    check_id: windows-credprot-min-password
    technique_id: T1110
    framework: custom
    executor: local
    timeout_sec: 60
    command: |
      $bp = 'C:\ProgramData\Audspect\posture-baseline.json'
      $bl = $null; if (Test-Path -LiteralPath $bp) { try { $bl = Get-Content -LiteralPath $bp -Raw | ConvertFrom-Json } catch { $bl = $null } }
      $t = Join-Path $env:TEMP ('bas_accpol_' + [guid]::NewGuid().ToString('N') + '.cfg')
      try { secedit /export /cfg $t /areas SECURITYPOLICY | Out-Null; $txt = Get-Content -LiteralPath $t -ErrorAction Stop }
      catch { Write-Output 'SKIP: account policy unreadable (secedit needs elevation) | source=secedit SECURITYPOLICY'; exit 0 }
      finally { Remove-Item -LiteralPath $t -ErrorAction SilentlyContinue }
      $line = $txt | Where-Object { $_ -match '^MinimumPasswordLength\s*=' } | Select-Object -First 1
      if (-not $line) { Write-Output 'SKIP: MinimumPasswordLength not present in the policy export | source=secedit SECURITYPOLICY'; exit 0 }
      $v = [int]($line -replace '.*=\s*', '')
      $obs = "MinimumPasswordLength=$v"
      if ($null -eq $bl -or $null -eq $bl.min_password_length) { Write-Output "SKIP: not assessed; no password length baseline in $bp | observed=$obs | source=secedit SECURITYPOLICY"; exit 0 }
      if ($v -ge [int]$bl.min_password_length) { Write-Output "PASS: minimum password length meets the baseline | observed=$obs | expected=>= $($bl.min_password_length) | source=secedit SECURITYPOLICY" }
      else { Write-Output "FAIL: minimum password length is below the baseline | observed=$obs | expected=>= $($bl.min_password_length) | source=secedit SECURITYPOLICY" }

