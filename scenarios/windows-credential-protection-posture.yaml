  - name: "Special Logon auditing records success"
    check_id: windows-credprot-audit-special-logon
    technique_id: T1562.002
    framework: custom
    executor: local
    timeout_sec: 60
    command: |
      $out = auditpol /get /subcategory:"Special Logon" /r 2>$null
      if ($LASTEXITCODE -ne 0 -or -not $out) { Write-Output 'SKIP: auditpol unreadable (needs elevation or a localized Windows) | source=auditpol Special Logon'; exit 0 }
      $row = @($out | ConvertFrom-Csv) | Select-Object -First 1
      $s = $row.'Inclusion Setting'
      $obs = "Special Logon=$s"
      if ($s -match 'Success') { Write-Output "PASS: privileged logon success is audited | observed=$obs | expected=Success or Success and Failure | source=auditpol Special Logon" }
      else { Write-Output "FAIL: privileged logon success is not audited | observed=$obs | expected=Success or Success and Failure | source=auditpol Special Logon" }

