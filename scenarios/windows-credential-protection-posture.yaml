  - name: "Security event log is enabled and readable"
    check_id: windows-credprot-security-log
    technique_id: T1070.001
    framework: custom
    executor: local
    timeout_sec: 30
    command: |
      try { $l = Get-WinEvent -ListLog Security -ErrorAction Stop } catch { Write-Output 'SKIP: Security log unreadable | source=Get-WinEvent -ListLog Security'; exit 0 }
      $obs = "IsEnabled=$($l.IsEnabled) LogMode=$($l.LogMode) MaximumSizeInBytes=$($l.MaximumSizeInBytes) RecordCount=$($l.RecordCount)"
      if ($l.IsEnabled) { Write-Output "PASS: Security event log is enabled and readable | observed=$obs | expected=IsEnabled=True | source=Get-WinEvent -ListLog Security" }
      else { Write-Output "FAIL: Security event log is disabled | observed=$obs | expected=IsEnabled=True | source=Get-WinEvent -ListLog Security" }

  - name: "Logon events (4624/4625) are being collected"
    check_id: windows-credprot-logon-events
    technique_id: T1070.001
    framework: custom
    executor: local
    timeout_sec: 60
    command: |
      try { $e = @(Get-WinEvent -FilterHashtable @{ LogName = 'Security'; Id = 4624, 4625; StartTime = (Get-Date).AddHours(-24) } -MaxEvents 1 -ErrorAction Stop) }
      catch { $e = @() }
      if ($e.Count -gt 0) { Write-Output "PASS: logon events (4624/4625) are in the Security log for the last 24 hours | observed=at least one event found | expected=events present | source=Get-WinEvent Security 4624,4625" }
      else { Write-Output "SKIP: not assessed; no logon events in the last 24 hours, so an idle host cannot be told apart from disabled auditing | observed=0 events | source=Get-WinEvent Security 4624,4625" }
