id: windows-credential-protection-posture
product_line: av
name: Windows Credential Protection and Privilege Exposure Posture
description: >
  Read-only posture audit of the controls that limit credential theft from a Windows
  host: LSA protected process mode, WDigest cleartext credential caching, the size of
  the local Administrators group, and the SMBv1 server protocol. Nothing is changed. A
  FAIL is a review trigger, not proof that credentials are exposed.
local_check: true
executable: false
supported_os: [windows]
tags:
  - credential-access
  - privilege
  - posture
  - windows
  - read-only
contract:
  objective: Confirm the host blocks the common credential-theft paths and does not carry unnecessary local administrators.
  prerequisites:
    os: Windows Server 2019 or later, Windows 10 or later
    product: LSA, WDigest, SMB server configuration
    permissions: local administrator read access
    telemetry: none required for the posture result
  variants:
    baseline: current LSA, WDigest, SMB and local administrator state
    variation: not applicable; single-state read
    negative_controls: a host where the SMB server cmdlet is unavailable reports SKIP for that check
  expected_prevention:
    control: LSA runs as a protected process, WDigest does not cache cleartext credentials, SMBv1 is disabled
    authoritative_proof: the registry and configuration values read in each step
  expected_detection:
    observables: not applicable; this scenario reads configuration
    telemetry_sources: none
  response_validation:
    alert_to_incident: not evaluated by this scenario
    containment_check: not evaluated
  evidence_contract:
    required: registry values, SMB configuration value, administrator group member names, host identifier, timestamp
    identifiers: registry value path, administrator account name
    missing_data_is: an unreadable value is SKIP for that check, never PASS
  cleanup_recovery:
    artifacts_removed: none; the scenario writes nothing
    access_revocation_verified: not applicable
  remediation_retest:
    change: client enables RunAsPPL, disables WDigest, removes unneeded administrators, or disables SMBv1
    retest: the same scenario must return PASS for the changed check
  limitations:
    - does not test Credential Guard virtualisation state
    - the administrator count threshold is a review trigger, not a policy; the baseline decides
    - reads configuration only; it does not attempt credential access
steps:
  - name: "LSA protected process mode (RunAsPPL)"
    check_id: windows-credprot-lsa-ppl
    technique_id: T1003.001
    framework: custom
    executor: local
    command: >-
      $v = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -ErrorAction SilentlyContinue).RunAsPPL;
      if ($v -eq 1 -or $v -eq 2) { Write-Output ('PASS: LSA runs as a protected process (RunAsPPL=' + $v + ')') }
      else { Write-Output 'FAIL: LSA is not running as a protected process' }
    timeout_sec: 30

  - name: "WDigest cleartext credential caching disabled"
    check_id: windows-credprot-wdigest
    technique_id: T1003.001
    framework: custom
    executor: local
    command: >-
      $v = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest' -ErrorAction SilentlyContinue).UseLogonCredential;
      if ($v -ne 1) { Write-Output 'PASS: WDigest does not cache cleartext credentials' }
      else { Write-Output 'FAIL: WDigest caches cleartext credentials (UseLogonCredential=1)' }
    timeout_sec: 30

  - name: "Local Administrators group size"
    check_id: windows-credprot-local-admins
    technique_id: T1078.003
    framework: custom
    executor: local
    command: >-
      $m = @(Get-LocalGroupMember -Group 'Administrators' -ErrorAction Stop);
      if ($m.Count -le 2) { Write-Output ('PASS: ' + $m.Count + ' members in local Administrators') }
      else { Write-Output ('FAIL: ' + $m.Count + ' members in local Administrators need baseline review: ' + (($m | ForEach-Object { $_.Name }) -join '; ')) }
    timeout_sec: 30

  - name: "SMBv1 server protocol disabled"
    check_id: windows-credprot-smb1
    technique_id: T1210
    framework: custom
    executor: local
    command: >-
      $c = Get-SmbServerConfiguration -ErrorAction Stop;
      if (-not $c.EnableSMB1Protocol) { Write-Output 'PASS: SMBv1 server protocol is disabled' }
      else { Write-Output 'FAIL: SMBv1 server protocol is enabled' }
    timeout_sec: 30
