id: "cscrf-mii-backup-dr"
product_line: common
name: "CSCRF-MII Backup, Recovery and DR Configuration Checks (P1)"
description: >
  Internal control-validation checks for backup and recovery. Verdicts are internal control references
  (CSCRF-BDR-*), not SEBI clause identifiers. The backup and RPO checks are read only. The restore drill and
  RTO measurement use synthetic files in a per-run temp folder with BAS_CONFIRM_BACKUP_TEST=true; they test
  the file-level restore path, not a full system restore. DR connectivity runs only when BAS_DR_TARGET is
  set. Deferred: DR SOC monitoring and recovery after a simulated incident. A PASS does not show that the
  business can recover within its real targets.
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - cscrf-mii
  - backup
  - recovery
  - p1
mitre_phases:
  - impact

steps:

  # -------------------------------------------------------------------------
  - id: bdr-01
    name: "Backup Availability (CSCRF-BDR-01)"
    technique_id: T1490
    action_key: cscrf_bdr_backup_available
    framework: custom
    executor: powershell
    requires_priv: admin
    timeout_sec: 60
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Read-only query of backup versions."
    telemetry:
      - "wbadmin query"
    detection:
      - "Backup presence review"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $script:CgRun = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0, [Math]::Min(8, $env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 2147483647) }
      function Write-CgVerdict { param([string]$Outcome, [string]$Reason, [string]$Id)
      $p = 'SKIP'
      if ($Outcome -eq 'pass') { $p = 'PASS' } elseif ($Outcome -eq 'fail') { $p = 'FAIL' } elseif ($Outcome -eq 'error') { $p = 'ERROR' }
      Write-Output ($p + ': ' + $Reason + ' [BAS-BDR-' + $Id + ']')
      }
      function Complete-CgStep { param($Res, [string]$Id) Write-CgVerdict $Res.Outcome $Res.Reason $Id; exit 0 }
      function Test-CgBackupGate { return ($env:BAS_CONFIRM_BACKUP_TEST -eq 'true') }
      function Get-CgLatestBackupTime {
      $out = (& wbadmin.exe get versions 2>&1) -join "`n"
      if ($out -match 'No backup was found') { return 'none' }
      $m = [regex]::Matches($out, 'Backup time:\s*(.+)')
      if ($m.Count -eq 0) { return $null }
      $latest = $null
      foreach ($x in $m) { $t = $null; if ([datetime]::TryParse($x.Groups[1].Value.Trim(), [ref]$t) -and ($latest -eq $null -or $t -gt $latest)) { $latest = $t } }
      return $latest
      }
      function Get-CgDrTcp { param([string]$Ip, [int]$Port, [int]$TimeoutMs = 3000)
      $c = New-Object System.Net.Sockets.TcpClient
      try { $ar = $c.BeginConnect($Ip, $Port, $null, $null); if ($ar.AsyncWaitHandle.WaitOne($TimeoutMs) -and $c.Connected) { return 'open' }; return 'closed' } catch { return 'closed' } finally { $c.Close() }
      }
      function Get-CgUndoPath { param([string]$Id) return (Join-Path $env:TEMP ('bas-cg-undo\' + $Id + '.json')) }
      function New-CgUndoRecord { param([string]$Id, $Data)
      $p = Get-CgUndoPath $Id
      New-Item -ItemType Directory -Force -Path (Split-Path -Parent $p) | Out-Null
      $fs = [IO.File]::Open($p, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write)
      try { $b = [Text.Encoding]::ASCII.GetBytes(($Data | ConvertTo-Json -Depth 6 -Compress)); $fs.Write($b, 0, $b.Length) } finally { $fs.Close() }
      }
      function Read-CgUndoRecord { param([string]$Id)
      $p = Get-CgUndoPath $Id
      if (-not (Test-Path -LiteralPath $p)) { return $null }
      try { return (Get-Content -LiteralPath $p -Raw | ConvertFrom-Json) } catch { return 'unreadable' }
      }
      function Remove-CgUndoRecord { param([string]$Id) Remove-Item -LiteralPath (Get-CgUndoPath $Id) -Force -ErrorAction SilentlyContinue }
      $t = Get-CgLatestBackupTime
      if ($t -eq 'none') { Complete-CgStep @{ Outcome = 'fail'; Reason = 'no backup version exists on this host (wbadmin: No backup was found) [CSCRF-BDR-01]' } 'bdr-01' }
      if ($t -eq $null) { Complete-CgStep @{ Outcome = 'error'; Reason = 'backup versions could not be parsed [CSCRF-BDR-01]' } 'bdr-01' }
      Complete-CgStep @{ Outcome = 'pass'; Reason = "backup version present, latest $t [CSCRF-BDR-01]" } 'bdr-01'
    cleanup: |
      $ErrorActionPreference = 'SilentlyContinue'
      $script:CgRun = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0, [Math]::Min(8, $env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 2147483647) }
      function Write-CgVerdict { param([string]$Outcome, [string]$Reason, [string]$Id)
      $p = 'SKIP'
      if ($Outcome -eq 'pass') { $p = 'PASS' } elseif ($Outcome -eq 'fail') { $p = 'FAIL' } elseif ($Outcome -eq 'error') { $p = 'ERROR' }
      Write-Output ($p + ': ' + $Reason + ' [BAS-BDR-' + $Id + ']')
      }
      function Complete-CgStep { param($Res, [string]$Id) Write-CgVerdict $Res.Outcome $Res.Reason $Id; exit 0 }
      function Test-CgBackupGate { return ($env:BAS_CONFIRM_BACKUP_TEST -eq 'true') }
      function Get-CgLatestBackupTime {
      $out = (& wbadmin.exe get versions 2>&1) -join "`n"
      if ($out -match 'No backup was found') { return 'none' }
      $m = [regex]::Matches($out, 'Backup time:\s*(.+)')
      if ($m.Count -eq 0) { return $null }
      $latest = $null
      foreach ($x in $m) { $t = $null; if ([datetime]::TryParse($x.Groups[1].Value.Trim(), [ref]$t) -and ($latest -eq $null -or $t -gt $latest)) { $latest = $t } }
      return $latest
      }
      function Get-CgDrTcp { param([string]$Ip, [int]$Port, [int]$TimeoutMs = 3000)
      $c = New-Object System.Net.Sockets.TcpClient
      try { $ar = $c.BeginConnect($Ip, $Port, $null, $null); if ($ar.AsyncWaitHandle.WaitOne($TimeoutMs) -and $c.Connected) { return 'open' }; return 'closed' } catch { return 'closed' } finally { $c.Close() }
      }
      function Get-CgUndoPath { param([string]$Id) return (Join-Path $env:TEMP ('bas-cg-undo\' + $Id + '.json')) }
      function New-CgUndoRecord { param([string]$Id, $Data)
      $p = Get-CgUndoPath $Id
      New-Item -ItemType Directory -Force -Path (Split-Path -Parent $p) | Out-Null
      $fs = [IO.File]::Open($p, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write)
      try { $b = [Text.Encoding]::ASCII.GetBytes(($Data | ConvertTo-Json -Depth 6 -Compress)); $fs.Write($b, 0, $b.Length) } finally { $fs.Close() }
      }
      function Read-CgUndoRecord { param([string]$Id)
      $p = Get-CgUndoPath $Id
      if (-not (Test-Path -LiteralPath $p)) { return $null }
      try { return (Get-Content -LiteralPath $p -Raw | ConvertFrom-Json) } catch { return 'unreadable' }
      }
      function Remove-CgUndoRecord { param([string]$Id) Remove-Item -LiteralPath (Get-CgUndoPath $Id) -Force -ErrorAction SilentlyContinue }
      Write-Output 'PASS: Cleanup complete'
      exit 0

