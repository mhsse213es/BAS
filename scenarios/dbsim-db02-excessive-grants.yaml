id: dbsim-db02-excessive-grants
product_line: dbsim
name: Database Security Simulation DB-02 - Excessive Grants Against Policy
description: >
  Enumerates database roles and the privilege grants held by the BAS lab
  application role, read-only, so the orchestrator can diff the observed grants
  against a stated grant policy (dbsim.Diff). The diff includes role
  inheritance and reports the policy Source with every deviation. It is a
  report only: no deviation carries a revoke or any executable remediation.

  ATT&CK mapping: T1087 Account Discovery (roles and grants are read to learn
  what each account can do).

  The read_grants probe takes a role name; this scenario uses the role
  bas_dbsim_app, which the lab fixture or client onboarding runbook must
  provision. A role that does not exist, or grants the test account cannot
  see, yield an empty grant set; that is unobservable and must not be treated
  as a pass (grading enforcement is tracked for the correlator/grading work).
  Target details come from the server-side registry by id.
author: Audspect Research
executable: true
tags:
  - dbsim
  - database
  - privileges
  - grants
  - read-only
  - mitre-attack
mitre_phases:
  - discovery

steps:
  - name: "DB-02 Role enumeration (T1087)"
    technique_id: T1087
    executor: dbprobe
    db_target: lab-db
    db_probe: read_roles
    risk: low
    blast_radius: "read-only role catalog query; no state changed"
    reversible: true

  - name: "DB-02 Application role grant read (T1087)"
    technique_id: T1087
    executor: dbprobe
    db_target: lab-db
    db_probe: read_grants
    db_params:
      role: bas_dbsim_app
    risk: low
    blast_radius: "read-only privilege catalog query for one role; no state changed"
    reversible: true
