    requires_priv: user
    timeout_sec: 120
    fidelity: telemetry-safe
    production_safe: false
    risk: high
    reversible: true
    blast_radius: "Gated (BAS_CONFIRM_CLOUD_IAM_WRITE). Creates one access key for a designated test user, deletes it, and verifies deletion. The secret is never recorded."
    telemetry:
      - "CloudTrail: CreateAccessKey / DeleteAccessKey (cloud side)"
    detection:
      - "Cloud-side audit (Azure Activity Log / Entra / CloudTrail) must be collected separately; this endpoint step is not proof of cloud detection"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $script:CvRun = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0, [Math]::Min(8, $env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 2147483647) }
