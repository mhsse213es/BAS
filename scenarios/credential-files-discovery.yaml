id: credential-files-discovery
product_line: dlp
name: Credentials-in-Files Discovery Probe
description: >
  Telemetry-safe emulation of an adversary searching the user's profile for files
  named as if they hold credentials: password lists, secret notes, keepass
  databases, and connection files. The scenario matches file names only, to depth
  two, capped at 2,000 files. It opens no file and reads no content. Matching by
  name is distinct from the extension-based search in collection-sensitive-discovery.

  KILL CHAIN STAGES:
    1. Credential-Named File Search — count names that suggest stored credentials (T1552.001)

  SAFETY: Read-only. File names are matched and counted; nothing is opened, copied,
  or read. The search is limited to Documents, Desktop and the profile root. Windows
  only. Telemetry mode.
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - credentials
  - files
  - discovery
  - detection
  - t1552
  - mitre
mitre_phases:
  - credential-access
  - discovery

live_policy:
  block_on_domain_controller: true
  require_dc_reachable: false
  max_spray_attempts: 0
  spray_account_allowlist: []
  execution_window: ""

steps:

  # ---------------------------------------------------------------------------
  # Stage 1 — Credential-Named File Search (T1552.001)
  # ---------------------------------------------------------------------------
  - name: "Credential Files 1 — Credential-Named File Name Search (T1552.001)"
    technique_id: T1552.001
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Matches file names in the user's Documents, Desktop and profile root, to depth two and 2,000 files, against patterns such as *password*, *credential*, *secret*, *.kdbx and *.rdp. Only the count is recorded. No file is opened or read."
    telemetry:
      - "Sysmon EID 1: powershell.exe with a recursive name search"
      - "PowerShell EID 4104: Get-ChildItem with credential-like name filters"
    detection:
      - "DLP/EDR: a search for credential-named files from a user context — credential-hunting IOC"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $patterns = @('*password*','*credential*','*secret*','*.kdbx','*.rdp')
      $roots = @($env:USERPROFILE, (Join-Path $env:USERPROFILE 'Documents'), (Join-Path $env:USERPROFILE 'Desktop')) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
      $hits = @()
      foreach ($r in $roots) {
        foreach ($p in $patterns) {
          $hits += Get-ChildItem -Path $r -File -Filter $p -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 2000
        }
      }
      $count = @($hits | Select-Object -ExpandProperty FullName -Unique).Count
      Write-Output "EXEC T1552.001: found $count credential-named file(s) across $($roots.Count) location(s). Names only; nothing was opened. Credential files Stage 1. [BAS-SIM-CRF-S1]"
      if ($count -gt 0) {
        Write-Output "FAIL: Credential-named files were searched for and found with no alert. A name search of this kind precedes credential theft and should be detected."
      } else {
        Write-Output "PASS: No credential-named files were present in the searched locations."
      }
    cleanup: ""
