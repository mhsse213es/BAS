id: art-selective-windows
name: Atomic Red Team  -  Selective Windows Capabilities
description: >
  Same full-depth ATT&CK sweep as "Full Windows Sweep"  -  every Windows
  atomic test for every technique across the entire seeded Atomic Red Team
  library, resolved live from the platform database at run time. The only
  difference is Customize: use it to narrow the run down to a chosen subset
  of techniques (every atomic for each one you pick still runs). Leave
  Customize untouched and this runs the exact same full breadth as Full
  Windows Sweep.
  Note: an unmodified run is a large run  -  substantially more steps than a
  one-per-technique sweep, so expect a correspondingly longer runtime on a
  single endpoint. An agent runs one scenario at a time; starting another

  ⚠️  TIMEOUT ADVISORY: Several techniques legitimately require >120s on real
  systems. Consider using custom timeouts for slow-running techniques:
    - T1083 (File Discovery): 300s recommended
    - T1087.002 (Domain Account Discovery): 300s recommended
    - T1018 (Remote System Discovery): 300s recommended
    - T1526 (Cloud Infrastructure Discovery): 300s recommended
  Without custom timeouts, these may timeout and be incorrectly scored.
  mid-run is rejected.
author: Audspect Research
executable: true
supported_os: [windows]
tags:
  - art
  - atomic-red-team
  - selective
  - windows
  - mitre-attack
mitre_phases:
  - initial-access
  - execution
  - persistence
  - privilege-escalation
  - defense-evasion
  - credential-access
  - discovery
  - lateral-movement
  - collection
  - exfiltration
  - impact

# Defaults to every Windows atomic for every technique (same builder as
# art_all_windows) -- Customize lets an operator narrow this to a subset.
art_selective_windows: true
