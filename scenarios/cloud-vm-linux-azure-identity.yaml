    requires_priv: user
    timeout_sec: 120
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Requests managed-identity tokens for four resources from IMDS. Tokens are held in memory only and never printed or stored."
    telemetry:
      - "Azure Entra sign-in / managed identity token issuance (cloud side)"
      - "Sysmon EID 3: IMDS token requests"
    detection:
      - "Cloud-side audit (Azure Activity Log / Entra / CloudTrail) must be collected separately; this endpoint step is not proof of cloud detection"
    command: |
      CV_RUN="${BAS_RUN_ID:-}"
