id: windows-discovery
name: Windows Discovery  -  Host, Network, User, Process Enumeration
description: >
  Windows post-compromise discovery simulation using Atomic Red Team atomics.
  Covers the reconnaissance techniques an adversary runs immediately after
  landing on a Windows system: host identification, network topology
  mapping, user/group/domain enumeration, process and service listing,
  installed and security software discovery, and registry querying.

  Each technique runs ALL available Windows atomics (depth mode).

  Expected verdicts:
    PASS  = EDR/SIEM detected the discovery activity
    FAIL  = enumeration completed without generating an alert
    SKIP  = atomic requires a tool not installed on the test host

  Note: discovery techniques are almost always FAIL in an unconfigured SIEM.
  Use this scenario to tune your detection rules (process ancestry, command
  argument matching on systeminfo/whoami/net/tasklist/reg/wmic patterns).

  T1083 (File and Directory Discovery) is deliberately excluded: its real
  Windows atomics are full recursive scans (dir /s c:\, Get-ChildItem
  -Recurse) that risk running past a reasonable timeout and producing false
  TIMEOUT verdicts instead of real PASS/FAIL.
author: Audspect Research
executable: true
supported_os: [windows]
tags:
  - discovery
  - windows
  - art
  - atomic-red-team
  - t1082
  - t1016
  - t1049
  - t1057
  - t1087
  - t1018
