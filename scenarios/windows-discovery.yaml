  - t1010
  - t1033
  - t1124
  - t1069
  - t1012
  - mitre-attack
mitre_phases:
  - discovery

art_techniques:
  - T1082       # System Information Discovery (systeminfo, Get-ComputerInfo)
  - T1016       # System Network Configuration Discovery (ipconfig, route print)
  - T1049       # System Network Connections Discovery (netstat, Get-NetTCPConnection)
  - T1057       # Process Discovery (tasklist, Get-Process)
  - T1087.001   # Local Account Discovery (net user, Get-LocalUser)
  - T1087.002   # Domain Account Discovery (net user /domain, Get-ADUser)
  - T1018       # Remote System Discovery (net view, ping sweep)
  - T1007       # System Service Discovery (net start, Get-Service)
  - T1518       # Software Discovery (Get-WmiObject Win32_Product)
  - T1518.001   # Security Software Discovery (AV/EDR product enumeration)
  - T1010       # Application Window Discovery (Get-Process with MainWindowTitle)
  - T1033       # System Owner/User Discovery (whoami, query user)
  - T1124       # System Time Discovery (net time, w32tm)
  - T1069.001   # Local Permission Groups Discovery (net localgroup)
  - T1069.002   # Domain Permission Groups Discovery (net group /domain)
  - T1012       # Query Registry (reg query)
