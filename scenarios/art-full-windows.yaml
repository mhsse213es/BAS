id: art-full-windows
name: Atomic Red Team â€” Full Windows Sweep
description: >
  Broad ATT&CK breadth sweep — runs ONE representative Windows atomic per
  technique across the entire seeded Atomic Red Team library. Content is served
  from the platform database (seeded offline at install), so no GitHub access is
  needed at run time. The orchestrator resolves one PowerShell/cmd atomic for each
  technique and dispatches them as individual steps to the agent.
  Coverage: every technique with a Windows atomic (~one step each). Use the
  Selective scenario to run EVERY atomic for a chosen set of techniques (depth).
  Note: this is a large run — expect tens of minutes on a single endpoint. An
  agent runs one scenario at a time; starting another mid-run is rejected.
author: Audspect Research
supported_os: [windows]
tags:
  - art
  - atomic-red-team
  - full-sweep
  - windows
  - mitre-attack
mitre_phases:
  - initial-access
  - execution
  - persistence
  - privilege-escalation
  - defense-evasion
  - credential-access
  - discovery
  - lateral-movement
  - collection
  - exfiltration
  - impact

# One flag â€” fetches live ART index from GitHub and runs everything.
art_all_windows: true
