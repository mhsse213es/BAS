id: art-full-windows
name: Atomic Red Team  -  Full Windows Sweep
description: >
  Full-depth ATT&CK sweep  -  runs EVERY Windows atomic test for every
  technique across the entire seeded Atomic Red Team library (some
  techniques have multiple distinct atomics; all of them run, not just one
  representative per technique). Content is served from the platform
  database (seeded offline at install), so no GitHub access is needed at
  run time. The orchestrator resolves every PowerShell/cmd atomic for each
  technique and dispatches them as individual steps to the agent.
  Coverage: every Windows atomic test across every Windows-runnable
  technique. Use the Selective scenario to run this same full-depth
  expansion against a chosen subset of techniques instead of the whole
  library.
  Note: this is a large run  -  substantially more steps than a
  one-per-technique sweep, so expect a correspondingly longer runtime on a
  single endpoint. An agent runs one scenario at a time; starting another
  mid-run is rejected.

  ⚠️  TIMEOUT ADVISORY: Several techniques legitimately require >120s on real
  systems. Consider using custom timeouts for slow-running techniques:
    - T1083 (File Discovery): 300s recommended
    - T1087.002 (Domain Account Discovery): 300s recommended
    - T1018 (Remote System Discovery): 300s recommended
    - T1526 (Cloud Infrastructure Discovery): 300s recommended
  Without custom timeouts, these may timeout and be incorrectly scored.

author: Audspect Research
executable: true
supported_os: [windows]
tags:
  - art
  - atomic-red-team
  - full-sweep
  - windows
  - mitre-attack
mitre_phases:
  - initial-access
  - execution
  - persistence
  - privilege-escalation
  - defense-evasion
  - credential-access
  - discovery
  - lateral-movement
  - collection
  - exfiltration
  - impact

# One flag  -  fetches live ART index from GitHub and runs everything.
art_all_windows: true
