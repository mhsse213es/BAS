id: art-full-windows
name: Atomic Red Team â€” Full Windows Sweep
description: >
  Runs EVERY Windows atomic test in the Atomic Red Team library.
  The orchestrator fetches the ART index from GitHub at run time,
  finds all techniques with PowerShell or cmd executors, and sends
  one step per technique to the agent. Each step runs ALL atomic tests
  for that technique via Invoke-AtomicTest (no -TestNumbers = all tests).
  Coverage: ~500-600 techniques, ~1500-2000 individual atomic tests.
  Requires Invoke-AtomicRedTeam module on the endpoint:
    Install-Module -Name invoke-atomicredteam -Scope CurrentUser -Force
author: Audspect Research
supported_os: [windows]
tags:
  - art
  - atomic-red-team
  - full-sweep
  - windows
  - mitre-attack
mitre_phases:
  - initial-access
  - execution
  - persistence
  - privilege-escalation
  - defense-evasion
  - credential-access
  - discovery
  - lateral-movement
  - collection
  - exfiltration
  - impact

# One flag â€” fetches live ART index from GitHub and runs everything.
art_all_windows: true
