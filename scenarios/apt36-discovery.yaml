      elseif (@('allowed_unexpectedly', 'not_enforced', 'telemetry_not_visible') -contains $r.Outcome) { $v = 'FAIL' }
      Write-Output "$($v): $($r.Reason). [BAS-SIM-APT36-$Id]"
