id: "cscrf-mii-identity"
product_line: common
name: "CSCRF-MII Identity and Privileged Access Control Validation (P0)"
description: >
  Internal control-validation checks for identity and privileged access. Verdicts are internal control
  references (CSCRF-ID-*), not SEBI clause identifiers. Read-only checks run anywhere. Steps that create
  or change accounts or group membership run only with BAS_CONFIRM_IDENTITY_CHANGE=true, use synthetic
  accounts only, and remove them in undo with a residue check. id-09 (remote privileged login) is not in
  this pack: it needs a second lab host. Passing a check does not establish CSCRF compliance.
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - cscrf-mii
  - identity
  - privileged-access
  - p0
mitre_phases:
  - persistence
  - privilege-escalation
  - credential-access

steps:

  # -------------------------------------------------------------------------
  - id: id-01
    name: "Privileged Group Membership Change (T1098, internal ref CSCRF-ID-01)"
    technique_id: T1098
    action_key: cscrf_id_priv_group_change
    framework: custom
    executor: powershell
    requires_priv: admin
    timeout_sec: 120
    fidelity: telemetry-safe
    production_safe: false
    risk: medium
    reversible: true
    blast_radius: "Creates one synthetic local account, adds it to and removes it from Administrators, and deletes it in undo. Runs only with BAS_CONFIRM_IDENTITY_CHANGE=true."
    telemetry:
      - "Group membership change"
      - "Account creation"
    detection:
      - "Privileged group change alert (EID 4732)"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $script:CgRun = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0, [Math]::Min(8, $env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 2147483647) }
      $script:AdminSid = 'S-1-5-32-544'
      function Write-CgVerdict { param([string]$Outcome, [string]$Reason, [string]$Id)
      $p = 'SKIP'
      if ($Outcome -eq 'pass') { $p = 'PASS' } elseif ($Outcome -eq 'fail') { $p = 'FAIL' } elseif ($Outcome -eq 'error') { $p = 'ERROR' }
      Write-Output ($p + ': ' + $Reason + ' [BAS-ID-' + $Id + ']')
      }
      function Complete-CgStep { param($Res, [string]$Id) Write-CgVerdict $Res.Outcome $Res.Reason $Id; exit 0 }
      function Test-CgIdentityGate { return ($env:BAS_CONFIRM_IDENTITY_CHANGE -eq 'true') }
      function New-CgIdName { return 'bas-id-' + $script:CgRun }
      function New-CgSynthPassword { return ([Guid]::NewGuid().ToString('N') + 'Aa1!') }
      function Get-CgUndoPath { param([string]$Id) return (Join-Path $env:TEMP ('bas-cg-undo\' + $Id + '.json')) }
      function New-CgUndoRecord { param([string]$Id, $Data)
      $p = Get-CgUndoPath $Id
      New-Item -ItemType Directory -Force -Path (Split-Path -Parent $p) | Out-Null
      $fs = [IO.File]::Open($p, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write)
      try { $b = [Text.Encoding]::ASCII.GetBytes(($Data | ConvertTo-Json -Depth 6 -Compress)); $fs.Write($b, 0, $b.Length) } finally { $fs.Close() }
      }
      function Read-CgUndoRecord { param([string]$Id)
      $p = Get-CgUndoPath $Id
      if (-not (Test-Path -LiteralPath $p)) { return $null }
      try { return (Get-Content -LiteralPath $p -Raw | ConvertFrom-Json) } catch { return 'unreadable' }
      }
      function Remove-CgUndoRecord { param([string]$Id) Remove-Item -LiteralPath (Get-CgUndoPath $Id) -Force -ErrorAction SilentlyContinue }
      function Get-CgAdminMemberShortNames {
      $names = @()
      foreach ($m in (Get-LocalGroupMember -SID $script:AdminSid -ErrorAction Stop)) { $names += (($m.Name -split '\\')[-1]) }
      return $names
      }
      Add-Type -Namespace BasId -Name Logon -MemberDefinition @'
      [System.Runtime.InteropServices.DllImport("advapi32.dll", SetLastError = true, CharSet = System.Runtime.InteropServices.CharSet.Unicode)]
      public static extern bool LogonUser(string user, string domain, string password, int logonType, int logonProvider, out System.IntPtr token);
      [System.Runtime.InteropServices.DllImport("kernel32.dll", SetLastError = true)]
      public static extern bool CloseHandle(System.IntPtr handle);
      '@
      if (-not (Test-CgIdentityGate)) { Complete-CgStep @{ Outcome = 'skip'; Reason = 'BAS_CONFIRM_IDENTITY_CHANGE not true; no account or group changed [CSCRF-ID-01]' } 'id-01' }
      $name = New-CgIdName
      New-CgUndoRecord 'id-01' @{ scenario = 'id-01'; accountName = $name }
      try {
      New-LocalUser -Name $name -Password (ConvertTo-SecureString (New-CgSynthPassword) -AsPlainText -Force) -AccountNeverExpires -ErrorAction Stop | Out-Null
      } catch { Complete-CgStep @{ Outcome = 'error'; Reason = "could not create synthetic account: $($_.Exception.Message) [CSCRF-ID-01]" } 'id-01' }
      try {
      Add-LocalGroupMember -SID $script:AdminSid -Member $name -ErrorAction Stop
      } catch {
      Complete-CgStep @{ Outcome = 'pass'; Reason = "privileged group add refused: $($_.Exception.Message) [CSCRF-ID-01]" } 'id-01'
      }
      Remove-LocalGroupMember -SID $script:AdminSid -Member $name -ErrorAction SilentlyContinue
      Complete-CgStep @{ Outcome = 'fail'; Reason = "privileged group add succeeded and was reverted; verify the EID 4732 alert in the SIEM [CSCRF-ID-01]" } 'id-01'
    cleanup: |
      $ErrorActionPreference = 'SilentlyContinue'
      $script:CgRun = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0, [Math]::Min(8, $env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 2147483647) }
      $script:AdminSid = 'S-1-5-32-544'
      function Write-CgVerdict { param([string]$Outcome, [string]$Reason, [string]$Id)
      $p = 'SKIP'
      if ($Outcome -eq 'pass') { $p = 'PASS' } elseif ($Outcome -eq 'fail') { $p = 'FAIL' } elseif ($Outcome -eq 'error') { $p = 'ERROR' }
      Write-Output ($p + ': ' + $Reason + ' [BAS-ID-' + $Id + ']')
      }
      function Complete-CgStep { param($Res, [string]$Id) Write-CgVerdict $Res.Outcome $Res.Reason $Id; exit 0 }
      function Test-CgIdentityGate { return ($env:BAS_CONFIRM_IDENTITY_CHANGE -eq 'true') }
      function New-CgIdName { return 'bas-id-' + $script:CgRun }
      function New-CgSynthPassword { return ([Guid]::NewGuid().ToString('N') + 'Aa1!') }
      function Get-CgUndoPath { param([string]$Id) return (Join-Path $env:TEMP ('bas-cg-undo\' + $Id + '.json')) }
      function New-CgUndoRecord { param([string]$Id, $Data)
      $p = Get-CgUndoPath $Id
      New-Item -ItemType Directory -Force -Path (Split-Path -Parent $p) | Out-Null
      $fs = [IO.File]::Open($p, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write)
      try { $b = [Text.Encoding]::ASCII.GetBytes(($Data | ConvertTo-Json -Depth 6 -Compress)); $fs.Write($b, 0, $b.Length) } finally { $fs.Close() }
      }
      function Read-CgUndoRecord { param([string]$Id)
      $p = Get-CgUndoPath $Id
      if (-not (Test-Path -LiteralPath $p)) { return $null }
      try { return (Get-Content -LiteralPath $p -Raw | ConvertFrom-Json) } catch { return 'unreadable' }
      }
      function Remove-CgUndoRecord { param([string]$Id) Remove-Item -LiteralPath (Get-CgUndoPath $Id) -Force -ErrorAction SilentlyContinue }
      function Get-CgAdminMemberShortNames {
      $names = @()
      foreach ($m in (Get-LocalGroupMember -SID $script:AdminSid -ErrorAction Stop)) { $names += (($m.Name -split '\\')[-1]) }
      return $names
      }
      Add-Type -Namespace BasId -Name Logon -MemberDefinition @'
      [System.Runtime.InteropServices.DllImport("advapi32.dll", SetLastError = true, CharSet = System.Runtime.InteropServices.CharSet.Unicode)]
      public static extern bool LogonUser(string user, string domain, string password, int logonType, int logonProvider, out System.IntPtr token);
      [System.Runtime.InteropServices.DllImport("kernel32.dll", SetLastError = true)]
      public static extern bool CloseHandle(System.IntPtr handle);
      '@
      $rec = Read-CgUndoRecord 'id-01'
      if ($rec -eq $null -or $rec -eq 'unreadable') { Write-Output 'PASS: Cleanup complete (no record)'; exit 0 }
      Remove-LocalGroupMember -SID 'S-1-5-32-544' -Member $rec.accountName -ErrorAction SilentlyContinue
      Remove-LocalUser -Name $rec.accountName -ErrorAction SilentlyContinue
      if (Get-LocalUser -Name $rec.accountName -ErrorAction SilentlyContinue) { Write-Output "FAIL: residue account $($rec.accountName) survived undo"; exit 0 }
      Remove-CgUndoRecord 'id-01'
      Write-Output 'PASS: Cleanup complete'
      exit 0

