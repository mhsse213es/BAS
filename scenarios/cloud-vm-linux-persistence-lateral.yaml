    action_key: cloud_client_secret_add
    framework: custom
    executor: bash
    requires_priv: user
    timeout_sec: 120
    fidelity: telemetry-safe
    production_safe: false
    risk: high
    reversible: true
    blast_radius: "Gated (BAS_CONFIRM_CLOUD_IAM_WRITE). Adds one client secret to a designated test application, removes it, and verifies removal. The secret text is never recorded."
    telemetry:
      - "Entra audit: Update application - Certificates and secrets (cloud side)"
    detection:
      - "Cloud-side audit (Azure Activity Log / Entra / CloudTrail) must be collected separately; this endpoint step is not proof of cloud detection"
    command: |
      CV_RUN="${BAS_RUN_ID:-}"
