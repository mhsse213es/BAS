      if [ "$ufw_allow" -eq 1 ] || [ "$ipt_accept" -eq 1 ] || [ "$ufw_default_allow" -eq 1 ] || { [ "$ipt_policy_accept" -eq 1 ] && [ "$ipt_block" -eq 0 ]; }; then
