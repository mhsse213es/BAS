      printf '%s' "$ipt" | grep -Eq -- '-P INPUT (DROP|REJECT)' && ipt_policy_drop=1
      printf '%s' "$ipt" | grep -Eq -- '--dport (22|5985|5986) .*-j ACCEPT' && ipt_accept=1
      printf '%s' "$ipt" | grep -Eq -- '--dport (22|5985|5986) .*-j (DROP|REJECT)' && ipt_block=1
      fi
