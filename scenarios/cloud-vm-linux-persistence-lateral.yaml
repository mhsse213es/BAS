      out=$(printf 'header = "Authorization: Bearer %s"\n' "$3" | curl -K - "${args[@]}" "$2" 2>/dev/null)
      CV_HCODE=$(printf '%s' "$out" | tail -n1)
      CV_HBODY=$(printf '%s' "$out" | sed '$d')
