        local args out
        args=(-s -m 15 -w '\n%{http_code}' -X "$1")
        [ -n "${5:-}" ] && args+=(-H "x-ms-version: $5")
        if [ -n "${4:-}" ]; then args+=(-H 'Content-Type: application/json' --data "$4"); fi
