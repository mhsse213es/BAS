      }
      }
      return $res
      }
      function Invoke-ToolTransferSimulation { param([string]$SourcePath, [string]$DestHost, [string]$DestPath)
      $res = @{ Outcome = 'error'; Reason = "Tool transfer simulation to \\$DestHost\$DestPath failed"; Transferred = $false }
