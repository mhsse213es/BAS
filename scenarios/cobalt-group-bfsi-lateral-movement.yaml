      if ($Direct) { $m.Block = 0; $m.Audit = 0; $m.Readable = $true; continue }
      $ev = Get-AppCtlEvents -Mechanism $m.Name -Collection $Collection -Start $start.AddSeconds(-1) -Needle $Needle
