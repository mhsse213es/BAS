  - id: bra-b7-rpo-rto-measurement
    name: "Backup Assurance B7 - RPO and RTO Measurement (T1007)"
    technique_id: T1007
    detection_profiles:
      - windows_recovery_inhibition
    framework: custom
    executor: powershell
    requires_priv: admin
    timeout_sec: 120
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    severity: high
    confidence: medium
    reversible: true
    blast_radius: "Reads the newest C: recovery point age (RPO) and samples up to 64 MB of sequential read from it into a BAS-owned scratch folder to estimate throughput. The full-restore time is an ESTIMATE. Targets: BAS_RPO_TARGET_HOURS (default 24), BAS_RTO_TARGET_MINUTES (default 240)."
    preconditions: ["Windows host."]
    postconditions: ["PASS, FAIL or SKIP with a stated reason; anything created is removed and removal verified where applicable."]
    abort_on: []
    telemetry:
      - "Sysmon EID 1: PowerShell, vssadmin.exe, wbadmin.exe, net.exe, cmdkey.exe"
    detection:
      - "EDR: enumeration of backup services and shadow copies followed by deletion or modification attempts"
    expected_telemetry_count: 1
    false_positive_notes: "Backup administrators and monitoring agents perform the same enumeration; correlate with process and account."
    mitigations:
      - "Immutable or offline backup copies with retention locks."
      - "Dedicated, least-privilege backup service accounts; no Backup Operators sprawl."
      - "Regularly tested restores against RPO and RTO targets."
    references: ["CISA #StopRansomware Guide"]
    evidence: ["Emit rpo_hours, throughput_mb_per_s, full_restore_minutes_ESTIMATE."]
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $isAdmin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
      $vol = Get-WmiObject Win32_Volume -Filter "DriveLetter='C:'" -ErrorAction SilentlyContinue
      $cShadows = @()
      if ($vol.DeviceID) { $cShadows = @(Get-WmiObject Win32_ShadowCopy -ErrorAction SilentlyContinue | Where-Object { $_.VolumeName -eq $vol.DeviceID } | Sort-Object InstallDate -Descending) }
      $newest = $cShadows | Select-Object -First 1
      $newestTime = $null; if ($newest) { $newestTime = [Management.ManagementDateTimeConverter]::ToDateTime($newest.InstallDate) }
      if (-not $isAdmin) { Write-Output "SKIP: prerequisite missing (administrator rights required to read shadow copies). [BAS-SIM-BRA-B7]"; return }
      $rpoT = 24.0; $rtoT = 240.0; $notes = @()
      if ($env:BAS_RPO_TARGET_HOURS) { $t = 0.0; if ([double]::TryParse($env:BAS_RPO_TARGET_HOURS, [ref]$t) -and $t -gt 0) { $rpoT = $t } else { $notes += 'invalid BAS_RPO_TARGET_HOURS ignored (default 24)' } }
      if ($env:BAS_RTO_TARGET_MINUTES) { $t = 0.0; if ([double]::TryParse($env:BAS_RTO_TARGET_MINUTES, [ref]$t) -and $t -gt 0) { $rtoT = $t } else { $notes += 'invalid BAS_RTO_TARGET_MINUTES ignored (default 240)' } }
      if (-not $newest) { Write-Output "FAIL: no recovery point exists for C: - RPO is unbounded and RTO cannot be measured. targets rpo_hours=$rpoT rto_minutes=$rtoT. [BAS-SIM-BRA-B7]"; return }
      $rpo = [Math]::Round(((Get-Date) - $newestTime).TotalHours, 2)
      $runId = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0,[Math]::Min(8,$env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 0x7FFFFFFF) }
      $dir = Join-Path $env:TEMP "bas_bra_rto_$runId"
      if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
      New-Item -ItemType Directory -Path $dir -Force | Out-Null
      $sysRoot = $newest.DeviceObject + '\Windows\System32\'
      $files = @(); try { $files = @((New-Object System.IO.DirectoryInfo($sysRoot)).GetFiles('*.dll') | Where-Object { $_.Length -gt 1MB -and $_.Length -lt 30MB } | Select-Object -First 40) } catch { }
      $bytes = 0L; $sw = [Diagnostics.Stopwatch]::StartNew()
      foreach ($f in $files) { if ($bytes -ge 64MB) { break }; try { [System.IO.File]::Copy($f.FullName, (Join-Path $dir $f.Name), $true); $bytes += $f.Length } catch { } }
      $sw.Stop()
      Remove-Item $dir -Recurse -Force
      $clean = -not (Test-Path $dir)
      $mbps = $null; $estMin = $null
      $cDrive = Get-PSDrive -Name C -ErrorAction SilentlyContinue
      if ($bytes -gt 0 -and $sw.Elapsed.TotalSeconds -gt 0) {
        $mbps = [Math]::Round(($bytes / 1MB) / $sw.Elapsed.TotalSeconds, 1)
        if ($cDrive) { $estMin = [Math]::Round((($cDrive.Used / 1MB) / $mbps) / 60, 0) }
      }
      Write-Output "EVIDENCE T1007: rpo_hours=$rpo target_rpo_hours=$rpoT sampled_mb=$([Math]::Round($bytes/1MB,1)) throughput_mb_per_s=$mbps full_restore_minutes_ESTIMATE=$estMin target_rto_minutes=$rtoT cleanup_verified=$clean $(($notes -join '; ')). The full-restore time is an ESTIMATE extrapolated from a sampled sequential copy out of a local snapshot, not a measured full restore, and ignores product overhead and network. [BAS-SIM-BRA-B7]"
      if ($rpo -gt $rpoT) { Write-Output "FAIL: newest recovery point is $rpo hours old, beyond the $rpoT hour RPO target - data written since then would be lost. [BAS-SIM-BRA-B7]" }
      elseif ($null -eq $estMin) { Write-Output "SKIP: RPO is within target ($rpo h) but throughput could not be sampled, so RTO was not evaluated. [BAS-SIM-BRA-B7]" }
      elseif ($estMin -gt $rtoT) { Write-Output "FAIL: estimated full-restore time $estMin min (ESTIMATE) exceeds the $rtoT minute RTO target. [BAS-SIM-BRA-B7]" }
      else { Write-Output "PASS: RPO $rpo h is within $rpoT h and the estimated restore time $estMin min (ESTIMATE) is within $rtoT min. [BAS-SIM-BRA-B7]" }
    cleanup: |
      Remove-Item (Join-Path $env:TEMP 'bas_bra_rto_*') -Recurse -Force -ErrorAction SilentlyContinue
      Remove-Item (Join-Path $env:TEMP 'bas_bra_state_*.json') -Force -ErrorAction SilentlyContinue
