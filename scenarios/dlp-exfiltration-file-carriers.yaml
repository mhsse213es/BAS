  - name: "DLP Validation — Password-Protected Archive of Regulated Data (T1560.001)"
    technique_id: T1560.001
    detection_profiles:
      - windows_dlp_exfiltration
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 40
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    blast_radius: "Stages a synthetic DOCX carrier and, only if 7-Zip is already installed on the endpoint, creates a password-protected archive of it in %TEMP%, then deletes everything. Without 7-Zip the step reports OperationUnknown and creates no archive. No real data, no network."
    reversible: true
    telemetry:
      - "Sysmon EID 1: 7z.exe with a password switch over a temp directory"
      - "Sysmon EID 11: .7z archive created in %TEMP%"
    detection:
      - "DLP: password-protected archive creation over regulated data (contents not inspectable)"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $runId = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0,[Math]::Min(8,$env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 0x7FFFFFFF) }
      $work = Join-Path $env:TEMP "bas_dlpcarrier_$runId"
      $expected = '[BAS-SIM-DLP-CARRIER] ABCDE1234F 123456789012'
      $docxBytes = [Convert]::FromBase64String('')
      $staged = Join-Path $work 'staged'
      $archivePath = Join-Path $work 'exfil_protected.7z'
      try {
        New-Item -ItemType Directory -Path $staged -Force | Out-Null
        [System.IO.File]::WriteAllBytes((Join-Path $staged 'carrier.docx'), $docxBytes)
        $sevenZip = Get-Command 7z.exe -ErrorAction SilentlyContinue
        if (-not $sevenZip) { $sevenZip = Get-Item "$env:ProgramFiles\7-Zip\7z.exe" -ErrorAction SilentlyContinue }
        if ($sevenZip) {
          & $sevenZip.Source a -pBAS-SIM-PW $archivePath (Join-Path $staged 'carrier.docx') 2>&1 | Out-Null
          if (Test-Path $archivePath) {
            Write-Output "EXEC T1560.001: 7-Zip created a PASSWORD-PROTECTED archive over a regulated-data DOCX carrier. [BAS-SIM-DLP-CARRIER-ARCHIVE]"
            Write-Output "FAIL: encrypted archive of regulated data was created without being blocked. Its contents were not inspected by this scenario."
            Write-Output "DLP_OBSERVATION: OperationSucceeded"
          } else {
            Write-Output "EXEC T1560.001: 7-Zip ran but produced no archive. [BAS-SIM-DLP-CARRIER-ARCHIVE]"
            Write-Output "DLP_OBSERVATION: OperationBlocked"
          }
        } else {
          Write-Output "COVERAGE_LIMITATION: 7-Zip not installed on endpoint; password-protected archive creation and inspection not evaluated. [BAS-SIM-DLP-CARRIER-ARCHIVE]"
          Write-Output "DLP_OBSERVATION: OperationUnknown"
        }
      } catch {
        Write-Output "EXEC T1560.001: archive staging was blocked or failed. [BAS-SIM-DLP-CARRIER-ARCHIVE]"
        Write-Output "DLP_OBSERVATION: OperationBlocked"
      } finally {
        Remove-Item -Path $work -Recurse -Force -ErrorAction SilentlyContinue
      }
    cleanup: ""
