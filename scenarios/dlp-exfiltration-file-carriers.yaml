id: dlp-exfiltration-file-carriers
product_line: dlp
name: DLP Exfiltration Validation — Document and Image File Carriers
description: >
  Stages synthetic regulated-data records inside real, parseable file-format
  carriers (Word DOCX, Excel XLSX, PDF, PNG image, PowerPoint PPTX, plain ZIP) and a
  password-protected archive, in the endpoint's own temporary workspace. Tests whether the
  endpoint's local file operation for each carrier format is blocked or
  allowed. Each carrier is a deterministic template embedded as base64 in this
  file; each step decodes its carrier, verifies the bytes by SHA-256, and
  deletes its workspace in a finally block.

  Carrier validity is verified at authoring time by parsing each template with
  a real library (python-docx, openpyxl, pypdf, Pillow, python-pptx; the plain ZIP is opened with zipfile) and confirming the
  expected text. Carrier validity proves generation and parser compatibility
  only: it does NOT prove that any DLP product detects the sensitive content
  inside a carrier. This scenario reports local file-operation outcomes only.

  Known coverage limitations: (1) the image carrier holds text as pixels, so
  content detection needs OCR, which this scenario does not exercise; (2) the
  password-protected archive step uses 7-Zip only if already installed on the
  endpoint, and otherwise reports OperationUnknown (not evaluated), so no
  archive-content inspection is claimed in either case.

  Safety: all content is fabricated ([BAS-SIM-DLP-CARRIER] tagged), never real
  data. Windows only. Writes only inside %TEMP%.
author: Audspect Research
executable: true
supported_os: [windows]
tags:
  - dlp
  - data-protection-validation
  - exfiltration
  - file-carriers
  - windows
  - mitre-attack
  - bfsi
  - india
mitre_phases:
  - collection
  - exfiltration

steps:
  - name: "DLP Validation — DOCX Carrier Staging of Regulated Data (T1074.001)"
    technique_id: T1074.001
    detection_profiles:
      - windows_dlp_exfiltration
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 20
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    blast_radius: "Writes a deterministic synthetic Word document of fabricated regulated-data patterns into the endpoint's %TEMP% workspace, verifies it by SHA-256, then deletes the workspace. No real data, no network."
    reversible: true
    telemetry:
      - "Sysmon EID 11: DOCX file created in %TEMP%"
    detection:
      - "DLP: file-content inspection of DOCX carrier matching regulated-data patterns"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $runId = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0,[Math]::Min(8,$env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 0x7FFFFFFF) }
      $work = Join-Path $env:TEMP "bas_dlpcarrier_$runId"
      $expected = '[BAS-SIM-DLP-CARRIER] ABCDE1234F 123456789012'
      $bytes = [Convert]::FromBase64String('')
      $sha = 'b430dfeb318abbf59b7243555aad4741c520ff0a8889fe202d1983366264af50'
      $path = Join-Path $work 'carrier.docx'
      try {
        New-Item -ItemType Directory -Path $work -Force | Out-Null
        [System.IO.File]::WriteAllBytes($path, $bytes)
        $actual = (Get-FileHash -Algorithm SHA256 -Path $path).Hash.ToLower()
        if ($actual -eq $sha) {
          Write-Output "EXEC T1074.001: DOCX carrier written to $path unimpeded. [BAS-SIM-DLP-CARRIER-DOCX]"
          Write-Output "FAIL: DOCX carrier containing regulated-data patterns was created without being blocked."
          Write-Output "DLP_OBSERVATION: OperationSucceeded"
        } else {
          Write-Output "EXEC T1074.001: DOCX carrier integrity check failed after write. [BAS-SIM-DLP-CARRIER-DOCX]"
          Write-Output "DLP_OBSERVATION: OperationUnknown"
        }
      } catch {
        Write-Output "EXEC T1074.001: DOCX carrier write was blocked or failed. [BAS-SIM-DLP-CARRIER-DOCX]"
        Write-Output "DLP_OBSERVATION: OperationBlocked"
      } finally {
        Remove-Item -Path $work -Recurse -Force -ErrorAction SilentlyContinue
      }
    cleanup: ""

