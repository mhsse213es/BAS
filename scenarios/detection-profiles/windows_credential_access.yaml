# Detection Validation Profile — base behavioural profile for Windows
# credential-access activity. Child profiles (SAM theft, Kerberoasting,
# AS-REP roasting) inherit its SIEM correlation expectation via `extends`,
# then add the behaviour-specific endpoint control they each require.
#
# Behavioural, not per-ATT&CK: it captures the SOC's baseline expectation that
# ANY credential-access behaviour is correlated centrally, independent of the
# exact technique that produced it.
profile: windows_credential_access
version: 1
expected_detection:
  - id: ca-siem-correlation
    provider: microsoft_sentinel
    type: siem
    confidence: recommended
    finding:
      severity: Medium
      title: "No central credential-access correlation rule"
      remediation: >-
        Deploy a SIEM analytic that correlates process-creation and
        sensitive-handle events (Sysmon EID 1/10, Security 4688/4663) against
        credential stores (SAM, LSASS, NTDS, Kerberos tickets) and routes the
        result to the SOC triage queue.
      reference: "MITRE ATT&CK TA0006 — Credential Access"
