id: carbanak-bfsi-db-staging
product_line: killchain
name: Carbanak BFSI Payment Database Staging Simulation (Item 30)
description: >
  Writes a SYNTHETIC payment extract to a run-specific temp staging folder and
  removes it in a finally block. No database is queried. [BAS-SIM-
  CARBANAK-S30] tagged. Grounded in MITRE ATT&CK T1074.001 (Data Staged: Local
  Data Staging).
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - carbanak
  - bfsi
  - exfiltration
  - t1074
mitre_phases:
  - collection

live_policy:
  block_on_domain_controller: false
  require_dc_reachable: false
  max_spray_attempts: 0
  spray_account_allowlist: []
  execution_window: ""

steps:
  - name: "Carbanak Item 30 -- Payment Database Staging Simulation (T1074.001)"
    technique_id: T1074.001
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: lab-only
    production_safe: true
    risk: low
    blast_radius: "Writes and removes one synthetic extract in a run-specific temp folder. No database is queried."
    reversible: true
    telemetry:
      - "Sysmon EID 11 for the synthetic extract in the temp staging folder"
    detection:
      - "EDR: staging of a payment-named extract into a temp folder by a non-administrative process"
    threat_intel_sources:
      - reference: "MITRE ATT&CK -- T1074.001"
        url: "https://attack.mitre.org/techniques/T1074/001/"
    last_reviewed: "2026-11-21"
    family_attribution_confidence: reported
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $stage = Join-Path $env:TEMP ('bas_carb_stage_' + [guid]::NewGuid().ToString('N').Substring(0, 8))
      try {
        New-Item -ItemType Directory -Path $stage -Force | Out-Null
        @('payment_id,amount_minor,currency', 'SYN-0001,1000,XXX', 'SYN-0002,2500,XXX') | Set-Content -Path (Join-Path $stage 'payments_synthetic.csv')
        $n = @(Get-ChildItem -Path $stage -File).Count
        Write-Output "EXEC 30: staged $n file(s) of Synthetic payment extract data (BAS test data, not real). No database queried. [BAS-SIM-CARBANAK-S30]"
      } finally {
        Remove-Item -Path $stage -Recurse -Force
      }
      Write-Output "EXEC 30 cleanup: staging folder removed=$(-not (Test-Path -LiteralPath $stage))"
    cleanup: ""
