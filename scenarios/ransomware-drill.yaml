id: ransomware-drill
name: Ransomware Drill  -  Enterprise Resilience Validation (Three-Tier)
description: >
  Campaign-grade ransomware resilience validation for Indian BFSI, aligned with
  RBI BCP/DR guidelines (RBI/2019-20/105) and SEBI CSCRF. Covers modern
  human-operated ransomware tradecraft: LockBit, BlackCat/ALPHV, Akira.

  TIERS:
  - Posture (default, safe anywhere): six categories across the full resilience
    stack  -  prevention, detection, backup, identity, lateral-movement surface,
    and recovery. Split so BFSI customers see both "Can we block?" (prevention)
    and "Can we recover?" (recovery-posture) independently.
  - Telemetry (opt-in, production-safe): real, data-safe technique execution  - 
    controlled file enumeration with BFSI-relevant filename markers, Defender
    exclusion command invocation (no actual state change), event-log clear probe
    on a non-existent log (process telemetry only, no log deleted), VSS+wbadmin
    enumeration, and benign .bas_locked file rename with execution-ID tagging.
  - Lab (opt-in, isolated range only): full-fidelity impact simulation  -  XOR
    encryption on isolated temp directory (configurable file cap + forced cleanup
    verification), VSS deletion (default disabled, requires explicit env flag +
    snapshot pre-check), Defender RTP disable with mandatory restoration, and
    malicious service probe with full execution-lineage logging.

  GUARDRAILS: no domain-controller interlock (workstation-targeted); execution
  window optional; BAS_CONFIRM_VSS_DELETE required for VSS lab step; all steps
  tagged [BAS-SIM] with execution ID for SOC differentiation.

  Per-OS: Windows only. Linux/macOS report "not applicable".
  BFSI NOTE: posture recovery-posture category directly maps to RBI BCP
  continuity metrics. backup-resilience and identity-hardening address the two
  most common ransomware pre-conditions in BFSI incidents.
author: Audspect Research
executable: true
local_check: true
supported_os: [windows]
tags:
  - ransomware
  - bfsi
  - dr-test
  - bcp
  - rbi
  - lockbit
  - alphv
  - impact
  - hybrid
  - campaign
mitre_phases:
  - defense-evasion
  - discovery
  - lateral-movement
  - impact

live_policy:
  block_on_domain_controller: false
  require_dc_reachable: false
  max_spray_attempts: 0
  spray_account_allowlist: []
  execution_window: ""   # optional "HH:MM-HH:MM" gate for live runs

# Lab steps (Portion 3) to follow.
steps:
  - name: "File Enumeration (BFSI high-value filename markers)"
    technique_id: T1083
    framework: custom
    executor: powershell
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    blast_radius: "Read-only traversal of allowlisted paths (Desktop, Documents, Downloads). No file opened or modified. Depth capped at 2 levels."
    reversible: true
    telemetry:
      - "Security EID 4688 (powershell.exe with file-enumeration command line)"
      - "File access events if SACL/object access auditing enabled on monitored paths"
    detection:
      - "UEBA: bulk file enumeration from a single process  -  pre-encryption staging signal"
      - "DLP: enumeration of filenames matching financial/PII patterns"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $bfsiPatterns = @('*finance*','*customer*','*swift*','*payment*','*account*','*salary*','*export*','*backup*','*password*','*.xlsx','*.csv','*.docx','*.pdf','*.db','*.bak')
      $scanPaths = @(
        [Environment]::GetFolderPath('Desktop'),
        [Environment]::GetFolderPath('MyDocuments'),
        (Join-Path $env:USERPROFILE 'Downloads')
      )
      $found = @()
      foreach ($root in $scanPaths) {
        if (-not (Test-Path $root)) { continue }
        Get-ChildItem -Path $root -Depth 2 -File -ErrorAction SilentlyContinue | ForEach-Object {
          foreach ($p in $bfsiPatterns) { if ($_.Name -like $p) { $found += $_.FullName; break } }
        }
      }
      $markerNames = @('finance_q4.xlsx','customer_export.csv','swift_ops.docx')
      Write-Output "EXEC: file enumeration across Desktop/Documents/Downloads (depth=2). Found $($found.Count) BFSI-pattern file(s). UEBA/DLP marker filenames targeted: $($markerNames -join ', '). Read-only  -  no files opened. [BAS-SIM]"
    cleanup: ""

  - name: "Defender Exclusion Invocation (cmdline probe  -  no state change)"
    technique_id: T1562.001
    framework: custom
    executor: powershell
    timeout_sec: 20
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    blast_radius: "Invokes Add-MpPreference cmdline in a dry-run context that exits before modifying any exclusion. Security state is NOT changed."
    reversible: true
    telemetry:
      - "Security EID 4688 (powershell.exe with Add-MpPreference -ExclusionPath in command line)"
      - "PowerShell EID 4104 (script block: Add-MpPreference invocation) if ScriptBlock logging enabled"
    detection:
      - "EDR: PowerShell invoking Add-MpPreference  -  primary Defender tampering signal"
      - "SIEM: cmdline containing Add-MpPreference and ExclusionPath from a non-management process"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $cmdLine = 'Add-MpPreference -ExclusionPath $env:TEMP'
      Write-Output "EXEC: Defender exclusion invocation probe  -  cmdline '$cmdLine' logged to EID 4104/4688. Security state NOT modified (dry-run). [BAS-SIM]"
      Write-Output "TELEMETRY: if ScriptBlock logging (EID 4104) captured this block, the control is detecting Defender tampering attempts correctly."
    cleanup: ""

  - name: "Event Log Clear Probe (nonexistent log  -  process telemetry only)"
    technique_id: T1070.001
    framework: custom
    executor: powershell
    timeout_sec: 20
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    blast_radius: "Attempts Clear-EventLog against a nonexistent log name. No real log is cleared. Generates process and cmdline telemetry only."
    reversible: true
    telemetry:
      - "Security EID 4688 (powershell.exe with Clear-EventLog command line)"
      - "PowerShell EID 4104 (script block: Clear-EventLog invocation) if ScriptBlock logging enabled"
    detection:
      - "EDR/SIEM: Clear-EventLog cmdline from a non-admin/non-maintenance process  -  ransomware anti-forensics signal"
      - "Alert: EID 1102 must NOT fire (no real log cleared = correct)"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $fakeLog = 'BAS-SIM-NonExistent-Log'
      Clear-EventLog -LogName $fakeLog -ErrorAction SilentlyContinue
      Write-Output "EXEC: Clear-EventLog invoked against nonexistent log '$fakeLog' (always fails safely). EID 4688 + EID 4104 generated. NO real log cleared  -  EID 1102 must NOT appear. [BAS-SIM]"
    cleanup: ""

  - name: "VSS + Backup Catalog Enumeration"
    technique_id: T1490
    framework: custom
    executor: powershell
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    blast_radius: "Read-only enumeration of VSS shadow copies and wbadmin backup catalog. No shadows deleted; no backup jobs modified."
    reversible: true
    telemetry:
      - "Security EID 4688 (vssadmin.exe + wbadmin.exe invocations)"
    detection:
      - "SIEM: vssadmin list shadows from a non-backup process  -  ransomware pre-deletion recon"
      - "EDR: wbadmin get versions invocation  -  backup catalog discovery before destruction"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $vssOut   = & vssadmin list shadows 2>&1
      $shadowCount = ([regex]::Matches(($vssOut -join "`n"), 'Shadow Copy ID')).Count
      $wbaOut   = & wbadmin get versions 2>&1
      $backupCount = ([regex]::Matches(($wbaOut -join "`n"), 'Backup time')).Count
      Write-Output "EXEC: VSS enumeration  -  $shadowCount shadow copy/copies found. Backup catalog: $backupCount version(s) via wbadmin. Ransomware operators enumerate these before deletion. No copies removed. [BAS-SIM]"
    cleanup: ""

  - name: "Benign File Rename Probe (.bas_locked extension)"
    technique_id: T1486
    framework: custom
    executor: powershell
    timeout_sec: 20
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    blast_radius: "Creates a single marker file in %TEMP%, renames to .bas_locked, renames back, then deletes. No real data files touched."
    reversible: true
    telemetry:
      - "Sysmon EID 11 (file create): bas_ransom_probe_<id>.txt in %TEMP%"
      - "Sysmon EID 11 (file renamed to .bas_locked extension)"
      - "Security EID 4663 (file rename) if object access auditing enabled"
    detection:
      - "EDR: file renamed to known ransomware extension (.bas_locked)  -  extension-change detection rule"
      - "SIEM: rapid file rename to uncommon extension from powershell.exe"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $runId  = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0,[Math]::Min(8,$env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 0x7FFFFFFF) }
      $orig   = Join-Path $env:TEMP "bas_ransom_probe_$runId.txt"
      $locked = Join-Path $env:TEMP "bas_ransom_probe_$runId.bas_locked"
      Set-Content -Path $orig -Value "BAS-SIM T1486 rename probe run-id=$runId" -Encoding UTF8
      Rename-Item -Path $orig -NewName $locked -ErrorAction SilentlyContinue
      $renamed = Test-Path $locked
      Rename-Item -Path $locked -NewName $orig -ErrorAction SilentlyContinue
      Remove-Item $orig -Force -ErrorAction SilentlyContinue
      $cleaned = -not (Test-Path $orig) -and -not (Test-Path $locked)
      if ($renamed) {
        Write-Output "EXEC: file renamed to .bas_locked extension (run-id=$runId, cleanup=$cleaned)  -  expect Sysmon EID 11 rename event. [BAS-SIM]"
      } else {
        Write-Output "PASS: file rename blocked  -  Controlled Folder Access or WDAC/EDR prevented .bas_locked extension rename."
      }
    cleanup: |
      Remove-Item (Join-Path $env:TEMP "bas_ransom_probe_*.txt")      -Force -ErrorAction SilentlyContinue
      Remove-Item (Join-Path $env:TEMP "bas_ransom_probe_*.bas_locked") -Force -ErrorAction SilentlyContinue

  # -- Lab-only steps ---------------------------------------------------------
  # fidelity: lab-only  -  isolated range + snapshot required before execution

  - name: "XOR Encryption Simulation (lab  -  isolated temp dir, forced cleanup)"
    technique_id: T1486
    framework: custom
    executor: powershell
    timeout_sec: 60
    fidelity: lab-only
    production_safe: false
    risk: high
    blast_radius: "Creates isolated %TEMP%\\bas_range_<id>\\ with <=3 benign dummy files, XOR-encrypts in-place, drops marker ransom note, XOR-decrypts to restore, deletes entire directory. File cap + size cap + cleanup verification enforced."
    reversible: true
    telemetry:
      - "Sysmon EID 11 (file create/modify): bas_range_<id>\\ directory + .bas_locked files"
      - "Security EID 4663 (file write) if object access auditing enabled"
    detection:
      - "EDR: rapid sequential file modification pattern across multiple files  -  encryption behaviour"
      - "SIEM: high file-modify rate from powershell.exe on %TEMP% path  -  ransomware staging signal"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $runId   = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0,[Math]::Min(8,$env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 0x7FFFFFFF) }
      $maxFiles = 3
      $maxBytes = 10240
      $rangeDir = Join-Path $env:TEMP "bas_range_$runId"
      New-Item -ItemType Directory -Path $rangeDir -Force | Out-Null
      $dummies = @('finance_q4.txt','customer_export.txt','swift_ops.txt')
      foreach ($f in $dummies[0..($maxFiles-1)]) {
        $content = "BAS-SIM DUMMY DATA run-id=$runId file=$f" * 10
        if ([System.Text.Encoding]::UTF8.GetByteCount($content) -gt $maxBytes) { $content = $content.Substring(0,$maxBytes/2) }
        Set-Content -Path (Join-Path $rangeDir $f) -Value $content -Encoding UTF8
      }
      $key = 0xAB
      $encFiles = @()
      Get-ChildItem -Path $rangeDir -File | ForEach-Object {
        $bytes  = [System.IO.File]::ReadAllBytes($_.FullName)
        $xored  = $bytes | ForEach-Object { $_ -bxor $key }
        $locked = $_.FullName + '.bas_locked'
        [System.IO.File]::WriteAllBytes($locked, [byte[]]$xored)
        Remove-Item $_.FullName -Force
        $encFiles += $locked
      }
      $noteFile = Join-Path $rangeDir 'README_RESTORE_BAS_SIM.txt'
      Set-Content -Path $noteFile -Value "BAS-SIM RANSOM NOTE  -  run-id=$runId  -  THIS IS A CONTROLLED DRILL" -Encoding UTF8
      Write-Output "EXEC: $($encFiles.Count) file(s) XOR-encrypted in $rangeDir  -  expect EDR encryption-behaviour alert. Restoring now. [BAS-SIM]"
      foreach ($enc in $encFiles) {
        $bytes  = [System.IO.File]::ReadAllBytes($enc)
        $plain  = $bytes | ForEach-Object { $_ -bxor $key }
        $orig   = $enc -replace '\.bas_locked$',''
        [System.IO.File]::WriteAllBytes($orig, [byte[]]$plain)
        Remove-Item $enc -Force
      }
      Remove-Item $noteFile -Force -ErrorAction SilentlyContinue
      Remove-Item $rangeDir -Recurse -Force -ErrorAction SilentlyContinue
      $cleaned = -not (Test-Path $rangeDir)
      Write-Output "CLEANUP: range directory removed=$cleaned. No encrypted data remains. [BAS-SIM]"
    cleanup: |
      Remove-Item (Join-Path $env:TEMP "bas_range_*") -Recurse -Force -ErrorAction SilentlyContinue

  - name: "VSS Shadow Copy Deletion (lab  -  requires BAS_CONFIRM_VSS_DELETE=true)"
    technique_id: T1490
    framework: custom
    executor: powershell
    timeout_sec: 60
    fidelity: lab-only
    production_safe: false
    risk: high
    blast_radius: "Deletes ONE oldest VSS shadow copy of C:. Requires explicit BAS_CONFIRM_VSS_DELETE=true env var and verifies a snapshot exists first. Default-disabled without the flag."
    reversible: false
    telemetry:
      - "Security EID 8224 (VSS service shutdown) + EID 524 (shadow copy deletion)"
      - "Security EID 4688 (vssadmin.exe with delete command)"
    detection:
      - "EDR: vssadmin.exe with 'delete shadows' argument  -  #1 ransomware pre-encryption technique"
      - "SIEM: shadow copy count decrease; alert if count drops to 0"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $confirm = $env:BAS_CONFIRM_VSS_DELETE
      if (-not $confirm -or $confirm -ne 'true') {
        Write-Output "SKIP: BAS_CONFIRM_VSS_DELETE not set to 'true'  -  VSS deletion skipped (default-disabled per ransm safety policy). Set env var explicitly in isolated lab to enable. [BAS-SIM]"
        return
      }
      $shadows = Get-WmiObject Win32_ShadowCopy -ErrorAction SilentlyContinue | Where-Object { $_.VolumeName -match 'C:' }
      if (-not $shadows -or @($shadows).Count -eq 0) {
        Write-Output "SKIP: no C: VSS shadow copies exist  -  nothing to delete. Create a snapshot first with: vssadmin create shadow /for=C:"
        return
      }
      $oldest = @($shadows | Sort-Object InstallDate)[0]
      $id = $oldest.ID
      & vssadmin delete shadows /Shadow=$id /Quiet 2>&1 | Out-Null
      $remaining = @(Get-WmiObject Win32_ShadowCopy -ErrorAction SilentlyContinue | Where-Object { $_.VolumeName -match 'C:' }).Count
      Write-Output "FAIL: VSS shadow copy $id deleted  -  expect EID 8224/524. $remaining shadow copy/copies remaining on C:. Create a new snapshot to restore recovery capability. [BAS-SIM]"
    cleanup: ""

  - name: "Defender RTP Disable (lab  -  mandatory restoration + health check)"
    technique_id: T1562.001
    framework: custom
    executor: powershell
    timeout_sec: 45
    fidelity: lab-only
    production_safe: false
    risk: high
    blast_radius: "Attempts to disable Defender Real-Time Protection via Set-MpPreference. Immediately re-enables. Post-test health verification confirms restoration. EDR will alert."
    reversible: true
    telemetry:
      - "Security EID 4657 (registry value modified): HKLM\\...\\Windows Defender\\DisableRealtimeMonitoring"
      - "Defender event log: EID 5001 (RTP disabled) + EID 5000 (re-enabled)"
    detection:
      - "EDR: Defender RTP disabled  -  immediate P1 alert in any mature SOC"
      - "SIEM: WMI/registry change to Defender configuration from non-management process"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $before = (Get-MpComputerStatus -ErrorAction SilentlyContinue).RealTimeProtectionEnabled
      Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
      $disabled = -not (Get-MpComputerStatus -ErrorAction SilentlyContinue).RealTimeProtectionEnabled
      Set-MpPreference -DisableRealtimeMonitoring $false -ErrorAction SilentlyContinue
      $restored = (Get-MpComputerStatus -ErrorAction SilentlyContinue).RealTimeProtectionEnabled
      $tamperBlocked = (Get-MpComputerStatus -ErrorAction SilentlyContinue).IsTamperProtected
      if (-not $disabled) {
        Write-Output "PASS: Defender RTP disable attempt failed  -  Tamper Protection or EDR blocked the change (tamperProtected=$tamperBlocked). [BAS-SIM]"
      } elseif ($restored) {
        Write-Output "FAIL: Defender RTP was disabled then re-enabled (restoration verified=true). HEALTH: RTP now $restored, tamperProtected=$tamperBlocked. Expect Defender EID 5001+5000. [BAS-SIM]"
      } else {
        Set-MpPreference -DisableRealtimeMonitoring $false -Force -ErrorAction SilentlyContinue
        Write-Output "CRITICAL: Defender RTP disabled and re-enable failed  -  manual restoration required. Run: Set-MpPreference -DisableRealtimeMonitoring $false [BAS-SIM]"
      }
    cleanup: |
      Set-MpPreference -DisableRealtimeMonitoring $false -ErrorAction SilentlyContinue

  - name: "Malicious Service Probe (lab  -  creation + lineage logging)"
    technique_id: T1543.003
    framework: custom
    executor: powershell
    timeout_sec: 45
    fidelity: lab-only
    production_safe: false
    risk: medium
    blast_radius: "Creates a benign service (cmd.exe /c echo) via sc.exe, logs binary path + parent process + execution lineage, starts, stops, deletes. Used by LockBit/ALPHV for lateral spread via PsExec-style service deployment."
    reversible: true
    telemetry:
      - "Security EID 4697 (service installed) + EID 7045 (new service installed in system)"
      - "Security EID 4688 (sc.exe create + start + stop + delete)"
    detection:
      - "SIEM: new service installed with binary path in non-standard directory  -  LockBit/PsExec lateral-spread signal"
      - "EDR: service binary path pointing to cmd.exe or user-writable path"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $svcName   = 'BAS-SIM-RansomSvc'
      $svcBin    = "$env:SystemRoot\System32\cmd.exe /c echo BAS-SIM-T1543"
      $parentPid = $PID
      $parentImg = (Get-Process -Id $parentPid -ErrorAction SilentlyContinue).MainModule.FileName
      sc.exe create $svcName binPath= "`"$svcBin`"" start= demand 2>&1 | Out-Null
      $created = (Get-Service -Name $svcName -ErrorAction SilentlyContinue) -ne $null
      if ($created) {
        sc.exe start $svcName 2>&1 | Out-Null
        Start-Sleep -Milliseconds 500
        sc.exe stop  $svcName 2>&1 | Out-Null
        sc.exe delete $svcName 2>&1 | Out-Null
        $gone = (Get-Service -Name $svcName -ErrorAction SilentlyContinue) -eq $null
        Write-Output "FAIL: service '$svcName' created+started+deleted (removed=$gone). BinaryPath='$svcBin'. Parent=$parentImg (PID=$parentPid). Expect EID 4697+7045. LockBit/PsExec service deployment vector confirmed. [BAS-SIM]"
      } else {
        Write-Output "PASS: sc.exe service creation blocked  -  AppLocker / restricted token / policy prevented malicious service deployment."
      }
    cleanup: |
      sc.exe stop   BAS-SIM-RansomSvc 2>&1 | Out-Null
      sc.exe delete BAS-SIM-RansomSvc 2>&1 | Out-Null
