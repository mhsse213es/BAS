id: dlp-exfiltration-lateral-movement
name: DLP Exfiltration Validation — Lateral Data Movement (Internal Server and Peer Endpoint)
description: >
  Copies the synthetic multi-type sensitive record from this endpoint to two
  internal destinations on a second host: an internal file server share, which
  is an authorized destination for this kind of data, and a peer workstation
  share, which is not. Lateral data movement is distinct from internet-bound
  exfiltration. Controls designed for outbound traffic often do not inspect
  internal transfers, so the two destinations test whether the control tells
  them apart.

  The destinations are operator-configured. Nothing in this repository
  provisions a second host:

    BAS_DLP_LATERAL_SERVER_SHARE   UNC path to an internal file server share
    BAS_DLP_LATERAL_PEER_SHARE     UNC path to a peer workstation share

  If a destination is not set or not reachable, the step records no observation
  and grades Untested. It is never recorded as a block. Only an access refusal
  is recorded as blocked. Any other failure is recorded as unknown.

  Evidence level: L1. The verdict comes from the endpoint's own check that the
  file arrived on the destination. No sink is involved. A refusal cannot be
  attributed to a specific control: share permissions, NTFS, a DLP product, or
  network policy could each cause it.

  The authorized and unauthorized distinction is a label, not a policy. The
  scenario does not know what a given organisation authorizes. The operator
  decides which destination is authorized and records that in the run notes.

  Not covered: lateral movement by remote execution, credential use, or
  transfers over protocols other than SMB.

  Safety: all synthetic data is fabricated and tagged [BAS-SIM-DLP]. Files are
  named with the run identifier and removed from the destination and from the
  endpoint afterwards. Windows only.
author: Audspect Research
executable: true
supported_os: [windows]
tags:
  - dlp
  - data-protection-validation
  - exfiltration
  - lateral-movement
  - windows
  - mitre-attack
mitre_phases:
  - collection
  - lateral-movement

steps:
  - name: "DLP Validation — Lateral Copy to Internal File Server Share (T1039)"
    technique_id: T1039
    detection_profiles:
      - windows_dlp_exfiltration
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    blast_radius: "Writes one small synthetic CSV to an operator-configured internal file server share and removes it afterwards. Nothing is written if BAS_DLP_LATERAL_SERVER_SHARE is not set."
    reversible: true
    telemetry:
      - "Sysmon EID 11: file created on a remote share"
      - "SMB audit: file write from this endpoint to an internal server"
    detection:
      - "DLP/file server: internal transfer of regulated data outside an approved path"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $share = $env:BAS_DLP_LATERAL_SERVER_SHARE
      if (-not $share) {
        Write-Output "SKIP: BAS_DLP_LATERAL_SERVER_SHARE is not set on this agent -- lateral validation requires an operator-configured internal server share."
      } elseif (-not (Test-Path -LiteralPath $share)) {
        Write-Output "SKIP: internal server share is not reachable from this agent ($share)."
      } else {
        $csvContent = "[BAS-SIM-DLP] CustomerID,PAN,Aadhaar,SWIFT,UPI,CreditCard`nBAS-SIM-SINK,ABCDE1234F,123456789012,SBININBBXXX,fake.user@upi,4111111111111111"
        $name = "bas_sim_lateral_srv_" + [guid]::NewGuid().ToString('N') + ".csv"
        $localSrc = Join-Path $env:TEMP $name
        $dest = Join-Path $share $name
        Set-Content -Path $localSrc -Value $csvContent -Encoding utf8
        if ($env:BAS_TASK_ID) { Write-Output "DLP_EVENT_START: $env:BAS_TASK_ID $((Get-Date).ToUniversalTime().ToString('o'))" }
        Copy-Item -Path $localSrc -Destination $dest -ErrorAction SilentlyContinue
        if (Test-Path -LiteralPath $dest) {
          Write-Output "EXEC T1039: sensitive record file copied to the internal file server share unimpeded. [BAS-SIM-DLP-LAT-SRV]"
          Write-Output "DLP_OBSERVATION: OperationSucceeded"
          Remove-Item -LiteralPath $dest -Force -ErrorAction SilentlyContinue
        } else {
          $reason = if ($Error.Count -gt 0) { $Error[0].Exception.Message } else { '' }
          Write-Output "EXEC T1039: copy to the internal file server share failed ($reason). [BAS-SIM-DLP-LAT-SRV]"
          if ($reason -match 'Access|denied|Unauthorized|read-only|refused') { Write-Output "DLP_OBSERVATION: OperationBlocked" } else { Write-Output "DLP_OBSERVATION: OperationUnknown" }
        }
        Remove-Item -LiteralPath $localSrc -Force -ErrorAction SilentlyContinue
      }
    cleanup: ""

  - name: "DLP Validation — Lateral Copy to Peer Workstation Share (T1039)"
    technique_id: T1039
    detection_profiles:
      - windows_dlp_exfiltration
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    blast_radius: "Writes one small synthetic CSV to an operator-configured peer workstation share and removes it afterwards. Nothing is written if BAS_DLP_LATERAL_PEER_SHARE is not set."
    reversible: true
    telemetry:
      - "Sysmon EID 11: file created on a remote peer share"
      - "SMB audit: file write from this endpoint to a peer workstation"
    detection:
      - "DLP/endpoint: regulated data copied to another endpoint outside an approved destination"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $share = $env:BAS_DLP_LATERAL_PEER_SHARE
      if (-not $share) {
        Write-Output "SKIP: BAS_DLP_LATERAL_PEER_SHARE is not set on this agent -- lateral validation requires an operator-configured peer workstation share."
      } elseif (-not (Test-Path -LiteralPath $share)) {
        Write-Output "SKIP: peer workstation share is not reachable from this agent ($share)."
      } else {
        $csvContent = "[BAS-SIM-DLP] CustomerID,PAN,Aadhaar,SWIFT,UPI,CreditCard`nBAS-SIM-SINK,ABCDE1234F,123456789012,SBININBBXXX,fake.user@upi,4111111111111111"
        $name = "bas_sim_lateral_peer_" + [guid]::NewGuid().ToString('N') + ".csv"
        $localSrc = Join-Path $env:TEMP $name
        $dest = Join-Path $share $name
        Set-Content -Path $localSrc -Value $csvContent -Encoding utf8
        if ($env:BAS_TASK_ID) { Write-Output "DLP_EVENT_START: $env:BAS_TASK_ID $((Get-Date).ToUniversalTime().ToString('o'))" }
        Copy-Item -Path $localSrc -Destination $dest -ErrorAction SilentlyContinue
        if (Test-Path -LiteralPath $dest) {
          Write-Output "EXEC T1039: sensitive record file copied to the peer workstation share unimpeded. [BAS-SIM-DLP-LAT-PEER]"
          Write-Output "DLP_OBSERVATION: OperationSucceeded"
          Remove-Item -LiteralPath $dest -Force -ErrorAction SilentlyContinue
        } else {
          $reason = if ($Error.Count -gt 0) { $Error[0].Exception.Message } else { '' }
          Write-Output "EXEC T1039: copy to the peer workstation share failed ($reason). [BAS-SIM-DLP-LAT-PEER]"
          if ($reason -match 'Access|denied|Unauthorized|read-only|refused') { Write-Output "DLP_OBSERVATION: OperationBlocked" } else { Write-Output "DLP_OBSERVATION: OperationUnknown" }
        }
        Remove-Item -LiteralPath $localSrc -Force -ErrorAction SilentlyContinue
      }
    cleanup: ""
