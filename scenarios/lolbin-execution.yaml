id: lolbin-execution
name: LOLBin Execution Coverage (Hybrid)
description: >
  Validates Living-off-the-Land Binary (LOLBin) abuse across distinct execution
  vectors (WMI, MSHTA, regsvr32/Squiblydoo, certutil, schtasks).

  HYBRID scenario. Posture mode (default, safe anywhere) validates the defences
  against LOLBin abuse (AppLocker, PowerShell execution policy / language mode,
  ScriptBlock logging, Sysmon, WinRM). Live execution mode (opt-in, lab-only)
  actually runs each LOLBin with a BENIGN, self-cleaning payload to generate
  genuine parent-child process telemetry for EDR/Sysmon/SIEM detection
  validation — detection over payload realism.

  Per-OS coverage: Windows only. Linux/macOS report "not applicable".

  SAFETY: live mode triggers EDR/Defender by design, needs admin/SYSTEM, and
  must only target an isolated lab / test VM with a snapshot. Every step is
  reversible (self-cleaning), uses no destructive payload, and leaves no
  persistence except the schtasks step which explicitly tests persistence and
  deletes its own task.
author: Audspect Research
executable: true
local_check: true
tags:
  - lolbin
  - defense-evasion
  - execution
  - t1218
  - hybrid
  - mitre
mitre_phases:
  - execution
  - defense-evasion
  - persistence

steps:
  - name: "WMI Process Creation (T1047)"
    technique_id: T1047
    framework: custom
    executor: wmi
    timeout_sec: 45
    risk: low
    blast_radius: "Spawns one benign child process under WmiPrvSE.exe; no files, no persistence."
    reversible: true
    telemetry:
      - "Security EID 4688 (process creation, ParentProcessName=WmiPrvSE.exe)"
      - "Sysmon EID 1 (process create)"
    detection:
      - "EDR: powershell.exe spawned by WmiPrvSE.exe (WMI process creation)"
    command: |
      Write-Output "BAS-WMI-TELEMETRY: process spawned via Win32_Process.Create under WmiPrvSE.exe (T1047)."
    cleanup: ""

  - name: "MSHTA Script Execution (T1218.005)"
    technique_id: T1218.005
    framework: custom
    executor: mshta
    timeout_sec: 20
    risk: medium
    blast_radius: "Launches mshta.exe which immediately self-closes; no payload, no file written."
    reversible: true
    telemetry:
      - "Security EID 4688 (mshta.exe process creation)"
      - "Sysmon EID 1 (mshta.exe)"
    detection:
      - "EDR/Sysmon: mshta.exe executing an inline vbscript: URI"
    command: |
      vbscript:window.close
    cleanup: ""

  - name: "Regsvr32 Squiblydoo (T1218.010)"
    technique_id: T1218.010
    framework: custom
    executor: powershell
    timeout_sec: 30
    risk: medium
    blast_radius: "Creates+deletes a temp scriptlet and loads scrobj.dll with an EMPTY payload; nothing is executed from the scriptlet."
    reversible: true
    telemetry:
      - "Sysmon EID 7 (scrobj.dll image load by regsvr32.exe)"
      - "Security EID 4688 (regsvr32.exe), parent powershell.exe"
    detection:
      - "EDR: regsvr32.exe /i:*.sct scrobj.dll (Squiblydoo AppLocker/WDAC bypass)"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $sct = Join-Path $env:TEMP ("bas_squiblydoo_{0}.sct" -f (Get-Random))
      Set-Content -Path $sct -Encoding ascii -Value '<?XML version="1.0"?><scriptlet><registration progid="BASProbe" classid="{10001111-0000-0000-0000-00000000FEED}"><script language="JScript"><![CDATA[]]></script></registration></scriptlet>'
      & regsvr32.exe /s /n /u /i:$sct scrobj.dll
      Remove-Item $sct -Force -ErrorAction SilentlyContinue
      Write-Output "EXEC: regsvr32 Squiblydoo (/i with scrobj.dll) ran against a benign empty local scriptlet — expect regsvr32.exe -> scrobj.dll telemetry (T1218.010). AppLocker/WDAC bypass path is unrestricted if this ran."
    cleanup: |
      Remove-Item (Join-Path $env:TEMP 'bas_squiblydoo_*.sct') -Force -ErrorAction SilentlyContinue

  - name: "Certutil Encode (T1140)"
    technique_id: T1140
    framework: custom
    executor: powershell
    timeout_sec: 30
    risk: low
    blast_radius: "Creates+deletes two temp files; no network connection made."
    reversible: true
    telemetry:
      - "Security EID 4688 (certutil.exe), parent powershell.exe"
      - "Sysmon EID 1 (certutil.exe with -encode)"
    detection:
      - "EDR/SIEM: certutil.exe with -encode/-decode/-urlcache arguments"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $in  = Join-Path $env:TEMP ("bas_certutil_{0}.txt" -f (Get-Random))
      $enc = "$in.b64"
      "BAS certutil LOLBin telemetry probe" | Set-Content -Path $in -Encoding ascii
      & certutil.exe -encode $in $enc | Out-Null
      $ran = Test-Path $enc
      Remove-Item $in, $enc -Force -ErrorAction SilentlyContinue
      if ($ran) { Write-Output "EXEC: certutil.exe -encode ran locally (no network) — expect certutil execution telemetry (T1140/T1027). certutil is widely abused for payload encode/decode and download." }
      else { Write-Output "PASS: certutil produced no output — execution may be restricted (WDAC/AppLocker)." }
    cleanup: |
      Remove-Item (Join-Path $env:TEMP 'bas_certutil_*.txt*') -Force -ErrorAction SilentlyContinue

  - name: "Scheduled Task Persistence (T1053.005)"
    technique_id: T1053.005
    framework: custom
    executor: powershell
    timeout_sec: 30
    risk: medium
    blast_radius: "Creates a scheduled task that is immediately deleted; the task runs no payload. EXPLICIT persistence test."
    reversible: true
    telemetry:
      - "Security EID 4698 (scheduled task created)"
      - "Security EID 4699 (scheduled task deleted)"
    detection:
      - "SIEM: 4698 task creation by an unexpected actor/process"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $tn = "BAS_LOLBin_Probe_$(Get-Random)"
      & schtasks.exe /Create /TN $tn /TR "cmd.exe /c echo bas" /SC ONCE /ST 23:59 /F | Out-Null
      $exists = & schtasks.exe /Query /TN $tn 2>$null
      & schtasks.exe /Delete /TN $tn /F | Out-Null
      if ($exists) { Write-Output "FAIL: scheduled task '$tn' was created via schtasks.exe then deleted — expect Event ID 4698 (created) + 4699 (deleted). Task-based persistence (T1053.005) is unrestricted." }
      else { Write-Output "PASS: scheduled task creation did not succeed — task persistence may be restricted." }
    cleanup: |
      Get-ScheduledTask -TaskName 'BAS_LOLBin_Probe_*' -ErrorAction SilentlyContinue | Unregister-ScheduledTask -Confirm:$false -ErrorAction SilentlyContinue
