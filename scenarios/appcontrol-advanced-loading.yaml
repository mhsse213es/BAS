      }
      $left = [bool](Get-ScheduledTask -TaskName $name -ErrorAction SilentlyContinue)
      return @{ Ran = (Test-AppCtlMarker $mk); Exit = 0; Note = "task_registered=$reg task_state=$state task_removed=$(-not $left)"; NotApplicable = '' }
      }
