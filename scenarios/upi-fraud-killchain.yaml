id: upi-fraud-killchain
name: UPI Fraud Kill Chain — BFSI Financial Fraud Simulation (Three-Tier)
description: >
  Financial-fraud-focused adversary emulation of UPI (Unified Payments Interface)
  attack chains targeting Indian BFSI institutions. Aligned with RBI Circular
  RBI/2021-22/112 (Cyber Security Framework) and NPCI security guidelines.

  Covers the full fraud kill chain: credential harvesting → OTP/clipboard
  interception → VPA substitution → data exfiltration. Evolving from generic
  ATT&CK simulation toward UPI fraud kill-chain orchestration.

  TIERS:
  - Posture (default, safe anywhere): six categories — prevention, detection,
    payment-security, collection-exposure, browser-isolation, and mobile-linkage.
    Covers the browser and mobile attack surfaces unique to UPI fraud (SmartScreen,
    extension allowlisting, Phone Link OTP relay, cloud clipboard sync).
  - Telemetry (opt-in, production-safe): real, privacy-safe techniques — clipboard
    VPA probe with UPI address variants and restoration, 1×1 screen capture with
    blank overwrite + cleanup verification, browser Login Data accessibility probe
    (header-only, read-only, no decryption), DNS exfil beacon with multi-tenant
    naming, HTTP exfil probe to RFC5737 address with versioned JSON schema.
  - Lab (opt-in, isolated range only): full-fidelity collection — clipboard
    monitor (AddClipboardFormatListener with guaranteed unregister), single-monitor
    screen capture with secure wipe, keyboard hook (SetWindowsHookEx
    WH_KEYBOARD_LL capturing zero keystrokes + UnhookWindowsHookEx in finally),
    HTTP exfil POST with bas-upi-v1 schema payload to BAS listener.

  GUARDRAILS: workstation-targeted (no DC interlock); execution window optional;
  [BAS-SIM] markers on all output; execution IDs for SIEM correlation.

  Per-OS: Windows only for live modes. Linux/macOS run existing CIS-based checks.
  FUTURE: UPI transaction manipulation layer (VPA substitution, QR-code
  replacement, clipboard overwrite race, OTP overlay) — next expansion phase.
author: Audspect Research
executable: true
local_check: true
