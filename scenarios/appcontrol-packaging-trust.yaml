      elseif ($att.NotApplicable) { $r = @{ Outcome = 'not_applicable'; Reason = [string]$att.NotApplicable } }
      elseif ($att.Verdict -and ($okOut -contains [string]$att.Verdict.Outcome)) { $r = @{ Outcome = [string]$att.Verdict.Outcome; Reason = [string]$att.Verdict.Reason } }
      else { $r = @{ Outcome = 'inconclusive'; Reason = 'the test did not reach a verdict' } }
      } else {
      $r = Resolve-AppCtlOutcome -Expected $Expected -Ran ([bool]$att.Ran) -Mechs $mechs -BuildOk $buildOk -Constrained ([bool]$att.Constrained)
      }
      Remove-Item -Path $script:AppCtlWork -Recurse -Force -ErrorAction SilentlyContinue
      foreach ($x in $ExtraCleanup) { Remove-Item -Path $x -Recurse -Force -ErrorAction SilentlyContinue }
      $cleanOk = -not (Test-Path $script:AppCtlWork)
      foreach ($x in $ExtraCleanup) { if (Test-Path $x) { $cleanOk = $false } }
      foreach ($x in @($script:AppCtlExtra)) { if ($x) { Write-Output $x } }
      Write-Output "APPCTL_FAMILY: $Family"
      Write-Output "APPCTL_HOST: os_build=$($state.Build) technique=$Technique"
      Write-Output "APPCTL_COVERAGE: applocker_$Collection=$($state.Al[$Collection]) applocker_svc_running=$($state.AlSvc) wdac_umci=$($state.Wd) wdac_readable=$($state.WdReadable)"
      Write-Output "APPCTL_EVIDENCE: test_id=$($script:AppCtlTid) expected=$Expected ran=$([bool]$att.Ran) exit=$($att.Exit) note=$($att.Note) block_events=[$((@($mechs | ForEach-Object { "$($_.Name)=$($_.Block)" })) -join ',')] audit_events=[$((@($mechs | ForEach-Object { "$($_.Name)=$($_.Audit)" })) -join ',')] cleanup_verified=$cleanOk capture=$((Get-Date).ToString('o'))"
      $det = 'unknown'
      try {
      $sy = @(Get-WinEvent -FilterHashtable @{ LogName = 'Microsoft-Windows-Sysmon/Operational'; Id = 1; StartTime = $start } -ErrorAction Stop)
      $det = if (@($sy | Where-Object { $_.Message -like "*$($script:AppCtlTid)*" }).Count -gt 0) { 'visible' } else { 'not_visible' }
      } catch {}
      Write-Output "APPCTL_DETECTION: source=sysmon_process_create result=$det"
      Write-Output "APPCTL_OUTCOME: $($r.Outcome)"
      $reason = $r.Reason; if ($att.NotApplicable -and -not $Direct) { $reason = $att.NotApplicable }
      switch ($r.Outcome) {
      'blocked_as_expected'  { Write-Output "PASS: $reason. [BAS-SIM]" }
      'allowed_by_policy'    { Write-Output "PASS: $reason. [BAS-SIM]" }
      'allowed_unexpectedly' { Write-Output "FAIL: $reason. [BAS-SIM]" }
      'not_enforced'         { Write-Output "FAIL: $reason. [BAS-SIM]" }
      'audited_only'         { Write-Output "FAIL: $reason. [BAS-SIM]" }
      default                { Write-Output "SKIP: $reason. [BAS-SIM]" }
      }
      }
      Invoke-AppCtlTest -Family 'writable_allowed_paths' -Collection 'Exe' -Needle 'WindowsWritable' -Technique 'T1553' -Direct -Attempt {
      $st = Get-AppCtlState
      if (-not $st.AlReadable) { return @{ NotApplicable = 'the effective AppLocker policy is not readable on this host'; Note = 'policy_unreadable' } }
      if (@('Exe', 'Script', 'Dll', 'Msi' | Where-Object { $st.Al[$_] -eq 'Enabled' }).Count -eq 0) { return @{ NotApplicable = 'no AppLocker collection is enforced, so writable allow-listed paths are not a bypass here'; Note = 'applocker_not_enforced' } }
      $win = $env:SystemRoot
      $cands = @("$win\Tasks", "$win\Temp", "$win\tracing", "$win\System32\spool\drivers\color", "$win\System32\Tasks", "$win\Registration\CRMLog")
      $found = 0; $checked = 0
      foreach ($d in $cands) {
      if (-not (Test-Path -LiteralPath $d)) { continue }
      $checked++
      $acl = Get-Acl -LiteralPath $d -ErrorAction SilentlyContinue
      if (-not $acl) { continue }
      foreach ($r in $acl.Access) {
      if ($r.AccessControlType -ne 'Allow') { continue }
      $id = Get-AppCtlAceSid $r
      if ($id -notin 'S-1-1-0', 'S-1-5-32-545', 'S-1-5-11') { continue }
      if ($r.FileSystemRights.ToString() -match 'FullControl|Modify|Write|CreateFiles') { $found++; break }
      }
      }
      $trusted = $false
      try {
      $x = [xml](Get-AppLockerPolicy -Effective -Xml -ErrorAction Stop)
      foreach ($pc in @($x.SelectNodes('//FilePathRule[@Action="Allow"]/Conditions/FilePathCondition'))) {
      $pp = [string]$pc.Path
      if ($pp -eq '*' -or $pp -like '%WINDIR%*' -or $pp -like '%SYSTEM32%*' -or $pp -like '%OSDRIVE%'+[string][char]92+'*') { $trusted = $true; break }
      }
      } catch {}
      $note = "directories_checked=$checked user_writable_under_windows=$found windows_directory_trusted_by_path_rule=$trusted. ACLs only; nothing is written."
      if ($found -gt 0 -and -not $trusted) { return @{ Verdict = @{ Outcome = 'blocked_as_expected'; Reason = "$found directory(ies) under the Windows directory are user-writable, but the effective policy has no path allow rule covering the Windows directory, so they are not a bypass under this policy" }; Note = $note } }
      if ($found -gt 0) { return @{ Verdict = @{ Outcome = 'allowed_unexpectedly'; Reason = "$found directory(ies) under the Windows directory are writable by ordinary users; the default path rule trusts the Windows directory, so code placed there would run" }; Note = $note } }
      return @{ Verdict = @{ Outcome = 'blocked_as_expected'; Reason = 'none of the checked Windows subdirectories is writable by ordinary users' }; Note = $note }
      }
    cleanup: |
      foreach ($root in @($env:TEMP, $env:APPDATA, (Join-Path $env:USERPROFILE 'Downloads'))) {
        Get-ChildItem -Path $root -Filter 'bas-appctl-*' -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
      }
      Get-ChildItem -Path $env:TEMP -Filter 'bas_????????.exe*' -Force -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
      Get-ChildItem Cert:\CurrentUser\My -ErrorAction SilentlyContinue | Where-Object { $_.Subject -like 'CN=BAS-SIM-UNTRUSTED-*' } | Remove-Item -Force -ErrorAction SilentlyContinue
