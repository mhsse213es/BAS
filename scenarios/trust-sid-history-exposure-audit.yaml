id: trust-sid-history-exposure-audit
name: Trust / SID-History Exposure Audit
description: >
  Single-stage, read-only Active Directory audit: reads the directory for
  trust and SID-history abuse conditions (T1134.005) -- a cross-forest
  trustedDomain whose SID filtering / quarantine is disabled
  (trustAttributes), and any account carrying a populated sIDHistory
  attribute (a common privilege-escalation and persistence indicator).

  SAFETY: This step only READS trustedDomain objects and account sIDHistory
  via .NET DirectoryServices / LDAP. It NEVER forges an inter-realm ticket,
  injects SID history, or modifies any trust configuration. It proves only
  whether the condition is EXPOSED. On a non-domain host it returns a clean
  SKIP.
  PRODUCTION-SAFE: runs in telemetry mode. Windows domain members only.
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - active-directory
  - trust
  - sid-history
  - privilege-escalation
  - t1134
  - mitre
mitre_phases:
  - discovery
  - privilege-escalation

live_policy:
  block_on_domain_controller: false
  require_dc_reachable: true
  max_spray_attempts: 0
  spray_account_allowlist: []
  execution_window: ""

steps:

  # ---------------------------------------------------------------------------
  # Stage 1 — Trust / SID-History Exposure Audit (T1134.005)
  # ---------------------------------------------------------------------------
  - name: "Trust Stage 1 — Trust / SID-History Exposure Audit (T1134.005)"
    technique_id: T1134.005
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Reads trustedDomain trustAttributes and account sIDHistory from the directory via System.DirectoryServices (read-only) and reports cross-forest trusts with SID filtering disabled and accounts carrying SID history. Never forges an inter-realm ticket, injects SID history, or modifies a trust. Generates LDAP searches against the DC."
    telemetry:
      - "DC: LDAP read of trustedDomain trustAttributes and accounts' sIDHistory — not separately audited by default"
      - "Sysmon EID 1: powershell.exe performing an LDAP trust / sIDHistory enumeration"
    detection:
      - "SIEM: a cross-forest trust with SID filtering disabled, or an account carrying a populated sIDHistory, is present in the directory — trust / SID-history exposure IOC"
      - "SIEM: an LDAP enumeration of trustedDomain objects or sIDHistory from a workstation — trust reconnaissance IOC"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $findings = @()
      try {
        $rootDSE = [ADSI]"LDAP://RootDSE"
        $domainDN = $rootDSE.defaultNamingContext
        if (-not $domainDN) { throw "no domain" }

        # 1) Cross-forest trusts with SID filtering / quarantine disabled.
        #    trustAttributes bits: FOREST_TRANSITIVE 0x8, QUARANTINED_DOMAIN 0x4
        #    (SID filtering). A forest-transitive trust WITHOUT quarantine is
        #    the SID-filtering-disabled condition of interest.
        $ts = New-Object System.DirectoryServices.DirectorySearcher
        $ts.SearchRoot = New-Object System.DirectoryServices.DirectoryEntry("LDAP://CN=System,$domainDN")
        $ts.Filter = "(objectClass=trustedDomain)"
        [void]$ts.PropertiesToLoad.Add('trustPartner')
        [void]$ts.PropertiesToLoad.Add('trustAttributes')
        foreach ($res in $ts.FindAll()) {
          $p = $res.Properties
          $partner = [string]$p['trustpartner'][0]
          $attr = 0; if ($p['trustattributes'].Count -gt 0) { $attr = [int]$p['trustattributes'][0] }
          $forestTransitive = ($attr -band 0x8) -ne 0
          $quarantined = ($attr -band 0x4) -ne 0
          if ($forestTransitive -and -not $quarantined) { $findings += "trust:$partner (forest-transitive, SID filtering not enforced)" }
        }

        # 2) Accounts carrying a populated sIDHistory.
        $ss = New-Object System.DirectoryServices.DirectorySearcher
        $ss.SearchRoot = New-Object System.DirectoryServices.DirectoryEntry("LDAP://$domainDN")
        $ss.PageSize = 500
        $ss.Filter = "(sIDHistory=*)"
        [void]$ss.PropertiesToLoad.Add('samAccountName')
        foreach ($res in $ss.FindAll()) {
          $name = [string]$res.Properties['samaccountname'][0]
          $findings += "sidhistory:$name (populated sIDHistory)"
        }
        $count = $findings.Count
      } catch {
        $count = -1
      }
      if ($count -lt 0) {
        Write-Output "SKIP: trust / SID-history exposure audit unavailable — host is not domain-joined or the DC is unreachable. [BAS-SIM-TRUST-S1]"
      } elseif ($count -eq 0) {
        Write-Output "PASS: no cross-forest trust has SID filtering disabled and no account carries SID history — no trust / SID-history privilege-escalation path exposed from this context. [BAS-SIM-TRUST-S1]"
      } else {
        Write-Output "EXEC T1134.005: found $count trust / SID-history exposure condition(s). Reads trust and sIDHistory attributes only — this is a detection-and-exposure probe, it forges no inter-realm ticket. [BAS-SIM-TRUST-S1]"
        Write-Output "FAIL: a trust lacks SID filtering or an account carries SID history, letting an attacker with domain credential material present an extra privileged SID across the boundary (SID-history injection), enabling privilege escalation. Review the flagged item(s): enable SID filtering / quarantine on external trusts (netdom trust /quarantine:yes), remove unexpected sIDHistory, and audit cross-realm TGS with unexpected SIDs (event 4769)."
      }
    cleanup: ""
