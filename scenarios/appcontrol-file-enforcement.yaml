      $certSubject = "CN=BAS-SIM-UNTRUSTED-$($script:AppCtlTid.Substring(0,8))"
      Invoke-AppCtlTest -Family 'publisher_trust' -Collection 'Exe' -Needle $exeName -Technique 'T1553.002' -ExtraCleanup @() -Attempt {
      $cert = $null
