      $state = Get-AppCtlState
      $mechs = @(Get-AppCtlMechanisms -State $state -Collection $Collection -Allow $Mechanisms)
      $buildOk = ($state.Build -ge $MinBuild)
      $script:AppCtlExtra = @()
      $att = @{ Ran = $false; Exit = -1; Note = ''; NotApplicable = ''; Constrained = $false }
      $start = Get-Date
