      param(
      [Parameter(Mandatory)][string]$Family,
      [Parameter(Mandatory)][string]$Collection,
      [Parameter(Mandatory)][string]$Needle,
      [Parameter(Mandatory)][scriptblock]$Attempt,
      [string]$Expected = 'blocked',
      [string[]]$Mechanisms = @('applocker', 'wdac'),
      [int]$MinBuild = 17763,
      [string]$Technique = '',
      [string[]]$ExtraCleanup = @(),
