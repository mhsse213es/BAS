id: full-scan
name: Full Security Posture Scan
description: >
  Comprehensive security posture assessment across all MITRE ATT&CK control domains.
  Each step is a PowerShell check that outputs PASS:/FAIL:/SKIP: as the first line.
  The server interprets results â€” the agent only executes commands.
  Covers: credential access, defense evasion, execution controls, persistence,
  privilege escalation, and lateral movement.
author: Audspect Research
supported_os: [windows]
tags:
  - full-scan
  - posture
  - bfsi
  - cis
  - mitre
mitre_phases:
  - credential-access
  - defense-evasion
  - execution
  - persistence
  - privilege-escalation
  - lateral-movement

steps:
  # â”€â”€ Credential Access â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  - name: "LSA Protection (RunAsPPL)"
    technique_id: T1003.001
    framework: custom
    executor: powershell
    timeout_sec: 10
    command: |
      $val = (Get-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Lsa" -Name "RunAsPPL" -ErrorAction SilentlyContinue).RunAsPPL
      if ($val -eq 1 -or $val -eq 2) { Write-Output "PASS: RunAsPPL=$val â€” LSASS protected against credential dumping" }
      else { Write-Output "FAIL: RunAsPPL not set â€” LSASS unprotected, Mimikatz can dump credentials" }

  - name: "WDigest Plaintext Credentials"
    technique_id: T1003.001
    framework: custom
    executor: powershell
    timeout_sec: 10
    command: |
      $val = (Get-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest" -Name "UseLogonCredential" -ErrorAction SilentlyContinue).UseLogonCredential
      if ($null -eq $val -or $val -eq 0) { Write-Output "PASS: WDigest disabled â€” no plaintext credentials in LSASS memory" }
      else { Write-Output "FAIL: WDigest UseLogonCredential=$val â€” plaintext credentials cached in LSASS" }

  - name: "Credential Guard (VBS)"
    technique_id: T1003.001
    framework: custom
    executor: powershell
    timeout_sec: 10
    command: |
      $val = (Get-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard" -Name "EnableVirtualizationBasedSecurity" -ErrorAction SilentlyContinue).EnableVirtualizationBasedSecurity
      if ($val -eq 1) { Write-Output "PASS: VBS enabled â€” Credential Guard available" }
      else { Write-Output "FAIL: VBS not enabled â€” Credential Guard unavailable, domain credentials exposed to LSASS dumps" }

  - name: "AutoLogon Credentials in Registry"
    technique_id: T1552.002
    framework: custom
    executor: powershell
    timeout_sec: 10
    command: |
      $val = (Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon" -Name "AutoAdminLogon" -ErrorAction SilentlyContinue).AutoAdminLogon
      if ($null -eq $val -or $val -eq "0") { Write-Output "PASS: AutoLogon disabled â€” no plaintext credentials in registry" }
      else { Write-Output "FAIL: AutoAdminLogon enabled â€” plaintext credentials stored in Winlogon registry key" }

  - name: "NTLM Relay Restrictions"
    technique_id: T1558.004
    framework: custom
    executor: powershell
    timeout_sec: 10
    command: |
      $val = (Get-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Lsa" -Name "RestrictNTLM" -ErrorAction SilentlyContinue).RestrictNTLM
      if ($val -eq 2) { Write-Output "PASS: RestrictNTLM=2 â€” outbound NTLM denied, relay attacks blocked" }
      else { Write-Output "FAIL: RestrictNTLM=$val (need 2) â€” NTLM relay attacks not blocked" }

  # â”€â”€ Defense Evasion â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  - name: "Windows Defender Real-Time Protection"
    technique_id: T1562.001
    framework: custom
    executor: powershell
    timeout_sec: 15
    command: |
      $status = (Get-MpComputerStatus -ErrorAction SilentlyContinue).RealTimeProtectionEnabled
      if ($status -eq $true) { Write-Output "PASS: Defender Real-Time Protection enabled" }
      elseif ($null -eq $status) { Write-Output "SKIP: Cannot query Defender status â€” requires admin or WMI" }
      else { Write-Output "FAIL: Defender Real-Time Protection DISABLED â€” endpoint unprotected" }

  - name: "Defender Tamper Protection"
    technique_id: T1562.001
    framework: custom
    executor: powershell
    timeout_sec: 15
    command: |
      $tp = (Get-MpComputerStatus -ErrorAction SilentlyContinue).IsTamperProtected
      if ($tp -eq $true) { Write-Output "PASS: Tamper Protection enabled â€” AV settings locked" }
      elseif ($null -eq $tp) { Write-Output "SKIP: Cannot query tamper protection status" }
      else { Write-Output "FAIL: Tamper Protection DISABLED â€” attackers can disable Defender via registry" }

  - name: "Windows Event Log Service"
    technique_id: T1070.001
    framework: custom
    executor: powershell
    timeout_sec: 10
    command: |
      $svc = Get-Service -Name eventlog -ErrorAction SilentlyContinue
      if ($svc.Status -eq "Running") { Write-Output "PASS: EventLog service running â€” audit trail active" }
      else { Write-Output "FAIL: EventLog service NOT running â€” logging inactive, no audit trail" }

  - name: "PowerShell Script Block Logging"
    technique_id: T1059.001
    framework: custom
    executor: powershell
    timeout_sec: 10
    command: |
      $val = (Get-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging" -Name "EnableScriptBlockLogging" -ErrorAction SilentlyContinue).EnableScriptBlockLogging
      if ($val -eq 1) { Write-Output "PASS: Script Block Logging enabled â€” PS activity logged to Event ID 4104" }
      else { Write-Output "FAIL: Script Block Logging not configured â€” malicious PowerShell activity not logged" }

  - name: "Sysmon Endpoint Monitoring"
    technique_id: T1562.001
    framework: custom
    executor: powershell
    timeout_sec: 10
    command: |
      $s64 = Get-Service -Name Sysmon64 -ErrorAction SilentlyContinue
      $s32 = Get-Service -Name Sysmon -ErrorAction SilentlyContinue
      if ($s64.Status -eq "Running") { Write-Output "PASS: Sysmon64 running â€” advanced endpoint telemetry active" }
      elseif ($s32.Status -eq "Running") { Write-Output "PASS: Sysmon running â€” endpoint telemetry active" }
      else { Write-Output "FAIL: Sysmon not installed â€” limited visibility for threat hunting" }

  # â”€â”€ Execution Controls â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  - name: "PowerShell Execution Policy"
    technique_id: T1059.001
    framework: custom
    executor: powershell
    timeout_sec: 10
    command: |
      $pol = (Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\PowerShell\1\ShellIds\Microsoft.PowerShell" -Name "ExecutionPolicy" -ErrorAction SilentlyContinue).ExecutionPolicy
      if ($null -eq $pol) {
        $pol = (Get-ItemProperty -Path "HKCU:\SOFTWARE\Microsoft\PowerShell\1\ShellIds\Microsoft.PowerShell" -Name "ExecutionPolicy" -ErrorAction SilentlyContinue).ExecutionPolicy
      }
      $safe = @("AllSigned","RemoteSigned","Restricted")
      if ($pol -in $safe) { Write-Output "PASS: ExecutionPolicy=$pol â€” unsigned scripts restricted" }
      else { Write-Output "FAIL: ExecutionPolicy=$pol â€” unsigned scripts can run freely" }

  - name: "PowerShell v2 Disabled"
    technique_id: T1059.001
    framework: custom
    executor: powershell
    timeout_sec: 20
    command: |
      $f = Get-WindowsOptionalFeature -Online -FeatureName MicrosoftWindowsPowerShellV2 -ErrorAction SilentlyContinue
      if ($null -eq $f) { Write-Output "SKIP: Cannot query PS v2 feature state" }
      elseif ($f.State -like "*Disabled*") { Write-Output "PASS: PowerShell v2 disabled â€” AMSI/logging downgrade blocked" }
      else { Write-Output "FAIL: PowerShell v2 ENABLED â€” 'powershell -version 2' bypasses AMSI and script block logging" }

  - name: "Application Control (AppLocker)"
    technique_id: T1059
    framework: custom
    executor: powershell
    timeout_sec: 10
    command: |
      $svc = Get-Service -Name AppIDSvc -ErrorAction SilentlyContinue
      if ($svc.Status -eq "Running") { Write-Output "PASS: AppLocker (AppIDSvc) running â€” application control active" }
      else { Write-Output "FAIL: No AppLocker/WDAC active â€” arbitrary code execution possible" }

  - name: "WinRM Remote Execution Surface"
    technique_id: T1021.006
    framework: custom
    executor: powershell
    timeout_sec: 10
    command: |
      $svc = Get-Service -Name WinRM -ErrorAction SilentlyContinue
      if ($svc.Status -eq "Running") { Write-Output "FAIL: WinRM RUNNING â€” remote PowerShell execution enabled, lateral movement surface exposed" }
      else { Write-Output "PASS: WinRM not running â€” remote PS execution surface minimised" }

  # â”€â”€ Persistence â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  - name: "Run Registry Key Inspection"
    technique_id: T1547.001
    framework: custom
    executor: powershell
    timeout_sec: 10
    command: |
      $entries = (Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run" -ErrorAction SilentlyContinue).PSObject.Properties | Where-Object { $_.Name -notlike "PS*" }
      $count = ($entries | Measure-Object).Count
      Write-Output "PASS: HKLM Run key has $count entr(ies) â€” review any unknown entries for persistence artefacts"

  - name: "Startup Folder Contents"
    technique_id: T1547.001
    framework: custom
    executor: powershell
    timeout_sec: 10
    command: |
      $count = (Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup" -File -ErrorAction SilentlyContinue | Measure-Object).Count
      if ($count -eq 0) { Write-Output "PASS: Startup folder empty â€” no startup persistence items" }
      else { Write-Output "PASS: Startup folder has $count item(s) â€” verify all are legitimate" }

  - name: "Services Running from Non-System Paths"
    technique_id: T1543.003
    framework: custom
    executor: powershell
    timeout_sec: 15
    command: |
      $count = (Get-WmiObject Win32_Service -ErrorAction SilentlyContinue | Where-Object { $_.PathName -notlike "*system32*" -and $_.PathName -notlike "*SysWOW64*" -and $_.State -eq "Running" } | Measure-Object).Count
      if ($count -eq 0) { Write-Output "PASS: All running services use standard system paths" }
      else { Write-Output "PASS: $count service(s) running from non-system paths â€” verify all are legitimate" }

  # â”€â”€ Privilege Escalation â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  - name: "UAC Enabled"
    technique_id: T1548.002
    framework: custom
    executor: powershell
    timeout_sec: 10
    command: |
      $val = (Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" -Name "EnableLUA" -ErrorAction SilentlyContinue).EnableLUA
      if ($val -eq 1) { Write-Output "PASS: UAC enabled (EnableLUA=1)" }
      else { Write-Output "FAIL: UAC DISABLED â€” silent privilege escalation possible without user consent" }

  - name: "UAC Prompt Level"
    technique_id: T1548.002
    framework: custom
    executor: powershell
    timeout_sec: 10
    command: |
      $val = (Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" -Name "ConsentPromptBehaviorAdmin" -ErrorAction SilentlyContinue).ConsentPromptBehaviorAdmin
      if ($val -eq 2) { Write-Output "PASS: UAC prompts for credentials on secure desktop â€” maximum protection" }
      elseif ($val -eq 5) { Write-Output "PASS: UAC prompts for consent â€” standard protection" }
      elseif ($val -eq 0) { Write-Output "FAIL: UAC set to elevate without prompting â€” silent elevation allowed" }
      else { Write-Output "FAIL: UAC ConsentPromptBehaviorAdmin=$val â€” verify setting is appropriate" }

  - name: "AlwaysInstallElevated MSI Policy"
    technique_id: T1548.002
    framework: custom
    executor: powershell
    timeout_sec: 10
    command: |
      $hklm = (Get-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer" -Name "AlwaysInstallElevated" -ErrorAction SilentlyContinue).AlwaysInstallElevated
      $hkcu = (Get-ItemProperty -Path "HKCU:\SOFTWARE\Policies\Microsoft\Windows\Installer" -Name "AlwaysInstallElevated" -ErrorAction SilentlyContinue).AlwaysInstallElevated
      if ($hklm -eq 1 -and $hkcu -eq 1) { Write-Output "FAIL: AlwaysInstallElevated=1 in both HKLM+HKCU â€” any user can escalate to SYSTEM via MSI" }
      else { Write-Output "PASS: AlwaysInstallElevated not enabled â€” MSI privilege escalation blocked" }

  # â”€â”€ Lateral Movement â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  - name: "SMB Signing Required"
    technique_id: T1021.002
    framework: custom
    executor: powershell
    timeout_sec: 10
    command: |
      $val = (Get-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters" -Name "RequireSecuritySignature" -ErrorAction SilentlyContinue).RequireSecuritySignature
      if ($val -eq 1) { Write-Output "PASS: SMB signing required â€” relay attacks blocked" }
      else { Write-Output "FAIL: SMB RequireSecuritySignature=$val â€” SMB relay attacks (Responder, ntlmrelayx) possible" }

  - name: "RDP Network Level Authentication"
    technique_id: T1021.001
    framework: custom
    executor: powershell
    timeout_sec: 10
    command: |
      $rdpDisabled = (Get-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -ErrorAction SilentlyContinue).fDenyTSConnections
      if ($rdpDisabled -eq 1) { Write-Output "PASS: RDP disabled â€” no RDP attack surface" }
      else {
        $nla = (Get-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -ErrorAction SilentlyContinue).UserAuthentication
        if ($nla -eq 1) { Write-Output "PASS: RDP enabled with NLA â€” pre-auth exploitation blocked" }
        else { Write-Output "FAIL: RDP enabled WITHOUT NLA â€” pre-authentication attack surface exposed" }
      }

  - name: "Windows Firewall (All Profiles)"
    technique_id: T1562.004
    framework: custom
    executor: powershell
    timeout_sec: 10
    command: |
      $off = (Get-NetFirewallProfile -ErrorAction SilentlyContinue | Where-Object { $_.Enabled -eq $false } | Measure-Object).Count
      if ($off -eq 0) { Write-Output "PASS: Windows Firewall enabled on all profiles (Domain, Private, Public)" }
      else { Write-Output "FAIL: $off firewall profile(s) disabled â€” network attack surface exposed" }

  - name: "LLMNR / NetBIOS Poisoning Prevention"
    technique_id: T1557.001
    framework: custom
    executor: powershell
    timeout_sec: 10
    command: |
      $val = (Get-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient" -Name "EnableMulticast" -ErrorAction SilentlyContinue).EnableMulticast
      if ($val -eq 0) { Write-Output "PASS: LLMNR disabled via GPO â€” Responder/Inveigh poisoning blocked" }
      else { Write-Output "FAIL: LLMNR not disabled â€” susceptible to NTLM hash capture via network poisoning" }

  - name: "BitLocker Disk Encryption (C:)"
    technique_id: T1486
    framework: custom
    executor: powershell
    timeout_sec: 15
    command: |
      $bl = Get-BitLockerVolume -MountPoint "C:" -ErrorAction SilentlyContinue
      if ($bl.ProtectionStatus -eq "On") { Write-Output "PASS: BitLocker ON for C: â€” drive encrypted at rest" }
      elseif ($null -eq $bl) { Write-Output "SKIP: BitLocker module not available â€” verify encryption via manage-bde" }
      else { Write-Output "FAIL: BitLocker OFF for C: â€” plaintext disk, double-extortion ransomware risk" }
