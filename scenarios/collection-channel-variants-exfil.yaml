  - name: "Channel 2.2 — TCP 445 outbound egress policy (T1048.003)"
    technique_id: T1048.003
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Reads state or configuration only. Nothing is sent."
