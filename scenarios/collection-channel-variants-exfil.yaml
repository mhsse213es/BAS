id: collection-channel-variants-exfil
product_line: dlp
name: Exfiltration Channel Variants Probe
description: >
  Resolution-only probe of four outbound channels that the main chain does not cover: SFTP over SSH,
  SMB, a C2-shaped beacon, and a cloud-storage API upload. Each step resolves one random RFC-6761 .invalid
  name carrying the run id. No connection is made and no data is sent. Each step then reports SKIP,
  because a resolver result is not evidence that any egress, firewall, proxy, DLP or CASB control acted.
  Prevention and detection are assessed only from correlated telemetry, which this release does not query.

  KILL CHAIN STAGES (resolver probes):
    1. SFTP / SSH         — resolve a .invalid SSH destination (T1048.002)
    2. SMB Outbound       — resolve a .invalid SMB destination (T1048.003)
    3. C2-Shaped Beacon   — resolve a .invalid beacon destination; no beacon body (T1041)
    4. Cloud-Storage API  — resolve a .invalid storage destination; no upload (T1567.002)

  SAFETY: no connection, no POST, no upload, no credential and no file is used. Windows only. Telemetry mode.
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - exfiltration
  - channels
  - sftp
  - smb
  - c2
  - cloud-api
  - dlp
  - t1048
  - t1041
  - t1567
  - mitre
mitre_phases:
  - exfiltration
  - command-and-control

live_policy:
  block_on_domain_controller: true
  require_dc_reachable: false
  max_spray_attempts: 0
  spray_account_allowlist: []
  execution_window: ""

steps:

  # ---------------------------------------------------------------------------
  # Stage 1 — SFTP over SSH (T1048.002)
  # ---------------------------------------------------------------------------
  - name: "Channel 1 — SFTP (SSH) Resolution Probe to .invalid (T1048.002)"
    technique_id: T1048.002
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Resolves one random .invalid name. No connection is made and no data is sent. Generates one DNS query (Sysmon EID 22)."
    telemetry:
      - "Sysmon EID 22: DNS query for the bas-sim .invalid SFTP host"
    detection:
      - "Egress: correlated only when a real SSH event exists; none is generated here"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $runId = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0,[Math]::Min(8,$env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 0x7FFFFFFF) }
      $name = "bas-sim-sftp-$runId.invalid"
      $resolved = $false
      try { $null = Resolve-DnsName -Name $name -Type A -ErrorAction Stop; $resolved = $true } catch { $resolved = $false }
      Write-Output "EXEC T1048.002: resolver probe for $name. No connection was made and no data was sent. resolved=$resolved. Channel 1. [BAS-SIM-CHN-1]"
      Write-Output "SKIP: No connection or transfer was made, so no egress or firewall control was exercised. A resolver result is not evidence of prevention, so no PASS or FAIL is claimed. Channel 1. [BAS-SIM-CHN-1]"
    cleanup: ""

  # ---------------------------------------------------------------------------
  # Stage 2 — SMB Outbound (T1048.003)
  # ---------------------------------------------------------------------------
  - name: "Channel 2 — SMB Outbound Resolution Probe to .invalid (T1048.003)"
    technique_id: T1048.003
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Resolves one random .invalid name. No connection is made and no data is sent. Generates one DNS query (Sysmon EID 22)."
    telemetry:
      - "Sysmon EID 22: DNS query for the bas-sim .invalid SMB host"
    detection:
      - "Egress: correlated only when a real SMB event exists; none is generated here"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $runId = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0,[Math]::Min(8,$env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 0x7FFFFFFF) }
      $name = "bas-sim-smb-$runId.invalid"
      $resolved = $false
      try { $null = Resolve-DnsName -Name $name -Type A -ErrorAction Stop; $resolved = $true } catch { $resolved = $false }
      Write-Output "EXEC T1048.003: resolver probe for $name. No connection was made and no data was sent. resolved=$resolved. Channel 2. [BAS-SIM-CHN-2]"
      Write-Output "SKIP: No connection or transfer was made, so no egress or firewall control was exercised. A resolver result is not evidence of prevention, so no PASS or FAIL is claimed. Channel 2. [BAS-SIM-CHN-2]"
    cleanup: ""

  # ---------------------------------------------------------------------------
  # Stage 3 — C2-Shaped Beacon Resolution Probe (T1041)
  # ---------------------------------------------------------------------------
  - name: "Channel 3 — C2-Shaped Beacon Resolution Probe (T1041)"
    technique_id: T1041
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Resolves one random .invalid name. No beacon is sent and no body is posted. Generates one DNS query (Sysmon EID 22)."
    telemetry:
      - "Sysmon EID 22: DNS query for the bas-sim .invalid beacon host"
      - "Proxy/NDR: none; no beacon is sent in this probe"
    detection:
      - "C2/NDR: correlated only when a real beacon event exists; none is generated here"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $runId = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0,[Math]::Min(8,$env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 0x7FFFFFFF) }
      $name = "bas-sim-beacon-$runId.invalid"
      $resolved = $false
      try { $null = Resolve-DnsName -Name $name -Type A -ErrorAction Stop; $resolved = $true } catch { $resolved = $false }
      Write-Output "EXEC T1041: resolver probe for $name. No connection was made and no data was sent. resolved=$resolved. Channel 3. [BAS-SIM-CHN-3]"
      Write-Output "SKIP: No connection or transfer was made, so no egress or firewall control was exercised. A resolver result is not evidence of prevention, so no PASS or FAIL is claimed. Channel 3. [BAS-SIM-CHN-3]"
    cleanup: ""

  # ---------------------------------------------------------------------------
  # Stage 4 — Cloud-Storage API Upload (T1567.002)
  # ---------------------------------------------------------------------------
  - name: "Channel 4 — Cloud-Storage API Resolution Probe to .invalid (T1567.002)"
    technique_id: T1567.002
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Resolves one random .invalid name. No upload request is sent and no credential is used. Generates one DNS query (Sysmon EID 22)."
    telemetry:
      - "Sysmon EID 22: DNS query for the bas-sim .invalid API host"
      - "CASB/SSE: none; no upload request is sent in this probe"
    detection:
      - "CASB/SSE: correlated only when a real upload event exists; none is generated here"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $runId = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0,[Math]::Min(8,$env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 0x7FFFFFFF) }
      $name = "bas-sim-cloud-$runId.invalid"
      $resolved = $false
      try { $null = Resolve-DnsName -Name $name -Type A -ErrorAction Stop; $resolved = $true } catch { $resolved = $false }
      Write-Output "EXEC T1567.002: resolver probe for $name. No connection was made and no data was sent. resolved=$resolved. Channel 4. [BAS-SIM-CHN-4]"
      Write-Output "SKIP: No connection or transfer was made, so no egress or firewall control was exercised. A resolver result is not evidence of prevention, so no PASS or FAIL is claimed. Channel 4. [BAS-SIM-CHN-4]"
    cleanup: ""
