      $wh = (netsh winhttp show proxy 2>$null) -join ' '
      if ($wh -match 'Direct access') { Out-Verdict 'SKIP' 'NOT_CONFIGURED' 'no WinHTTP proxy is configured; HTTPS egress is not proxied by this setting' }
      else { Out-Verdict 'SKIP' 'CONFIGURED' 'a WinHTTP proxy is configured; configuration only, not enforcement' }
