      $tag = '[BAS-SIM-CHN]'
      function Out-Verdict([string]$v, [string]$state, [string]$detail) {
        Write-Output ("{0}: state={1} {2} {3}" -f $v, $state, $detail, $tag)
      }
      $runId = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0,[Math]::Min(8,$env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 0x7FFFFFFF) }
      $ports = @(Get-NetFirewallRule -Direction Outbound -Action Block -Enabled True -ErrorAction SilentlyContinue | Get-NetFirewallPortFilter -ErrorAction SilentlyContinue | ForEach-Object { "$($_.RemotePort)" })
      if ($ports.Count -eq 0) { Out-Verdict 'SKIP' 'NOT_CONFIGURED' 'no enabled outbound block rules were found' }
      elseif (($ports -join ',') -match '445') { Out-Verdict 'SKIP' 'CONFIGURED' 'an enabled outbound block rule covers TCP 445; configuration only, not enforcement' }
      else { Out-Verdict 'SKIP' 'NOT_CONFIGURED' 'no enabled outbound block rule covers TCP 445' }
    cleanup: ""

