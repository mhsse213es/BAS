id: collection-channel-variants-exfil
product_line: dlp
name: Exfiltration Channel Variants Probe
description: >
  Validates whether endpoint and network controls detect or prevent four exfiltration channel families:
  SFTP over SSH, SMB outbound, C2-style HTTPS traffic, and cloud-storage uploads, plus the egress firewall,
  proxy and DLP controls that should cover them. It never sends data. Each channel is checked by a
  resolution-only probe of a run-id-tagged .invalid name, by read-only configuration reads, and by
  correlation with integrations. DNS resolution never proves that a channel is blocked.
  VERDICTS: PASS = a correlated block event was found. FAIL = a correlated successful unauthorised transfer
  was found. CONFIGURED = policy present, enforcement unverified (reported as SKIP, never scored). NOT_CONFIGURED
  = integration or detector absent. UNVERIFIED = integration configured but no usable or fresh evidence.
  ERROR = a query or execution failed. Prevention and detection are reported on separate lines.
  INTEGRATIONS: Microsoft Defender for Endpoint, Microsoft Purview Endpoint DLP, Trellix DLP, firewall or proxy
  egress telemetry. Opt-in by environment flag. This release has no operational probes, so no integration can PASS.
  SAFETY: no connection is made to any host, no data is sent, no file is uploaded, no credential is used, and no
  firewall, proxy or policy is changed. Windows only.
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - collection
  - exfiltration
  - dlp
  - egress
  - t1048
  - t1041
  - t1567
mitre_phases:
  - exfiltration

live_policy:
  block_on_domain_controller: true
  require_dc_reachable: false
  max_spray_attempts: 0
  spray_account_allowlist: []
  execution_window: ""

steps:
  - name: "Channel 1.1 — SSH destination resolution (T1048.002)"
    technique_id: T1048.002
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Resolves one random .invalid name carrying the run id. No connection is made."
    telemetry:
      - "Sysmon EID 22"
    detection:
      - "None"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $tag = '[BAS-SIM-CHN]'
      function Out-Verdict([string]$v, [string]$state, [string]$detail) {
        Write-Output ("{0}: state={1} {2} {3}" -f $v, $state, $detail, $tag)
      }
      $runId = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0,[Math]::Min(8,$env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 0x7FFFFFFF) }
      $name = "bas-sim-sftp-$runId.invalid"
      $resolved = $false
      try { $null = Resolve-DnsName -Name $name -Type A -ErrorAction Stop; $resolved = $true } catch { $resolved = $false }
      Write-Output ("EXEC T1048.002: resolver probe for {0}. No connection was made and no data was sent. resolved={1}. SSH destination. $tag" -f $name, $resolved)
      Out-Verdict 'SKIP' 'RESOLUTION_ONLY' 'SSH destination: a resolver result is not evidence of prevention or detection'
    cleanup: ""

  - name: "Channel 1.2 — SSH egress policy, default outbound action (T1048.002)"
    technique_id: T1048.002
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Reads state or configuration only. Nothing is sent."
    telemetry:
      - "Firewall profile read"
    detection:
      - "None"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $tag = '[BAS-SIM-CHN]'
      function Out-Verdict([string]$v, [string]$state, [string]$detail) {
        Write-Output ("{0}: state={1} {2} {3}" -f $v, $state, $detail, $tag)
      }
      $runId = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0,[Math]::Min(8,$env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 0x7FFFFFFF) }
      $fw = Get-NetFirewallProfile -All -ErrorAction SilentlyContinue | ForEach-Object { "$($_.Name)=$($_.DefaultOutboundAction)" }
      $unset = @($fw | Where-Object { $_ -match 'NotConfigured$' }).Count
      if (-not $fw) { Out-Verdict 'SKIP' 'NOT_CONFIGURED' 'Windows Firewall profiles could not be read' }
      elseif ($unset -eq $fw.Count) { Out-Verdict 'SKIP' 'NOT_CONFIGURED' 'no outbound default action is set on any firewall profile' }
      else { Out-Verdict 'SKIP' 'CONFIGURED' ('default outbound action: ' + ($fw -join ', ') + ' ; configuration only, not enforcement') }
    cleanup: ""

  - name: "Channel 1.3 — SSH firewall and proxy event correlation (T1048.002)"
    technique_id: T1048.002
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Queries an integration only when configured. Nothing is sent."
    telemetry:
      - "Integration query"
    detection:
      - "Firewall or proxy egress log"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $tag = '[BAS-SIM-CHN]'
      function Out-Verdict([string]$v, [string]$state, [string]$detail) {
        Write-Output ("{0}: state={1} {2} {3}" -f $v, $state, $detail, $tag)
      }
      function Get-AdapterResult([string]$flag) {
        # Evidence-file adapter. Configuring an integration (BAS_CLP_ADAPTER_<NAME>=1) is not enough to score.
        # The operator also points BAS_CLP_EVIDENCE_<NAME> at a JSON export of that vendor's events. Nothing here
        # calls the vendor, reads a credential or changes a control.
        if ([Environment]::GetEnvironmentVariable($flag) -ne '1') { return @{ State = 'NOT_CONFIGURED' } }
        $name = $flag -replace '^BAS_CLP_ADAPTER_', ''
        $key = $null
        if ($env:BAS_RUN_ID) { $key = $env:BAS_RUN_ID.Substring(0, [Math]::Min(8, $env:BAS_RUN_ID.Length)) }
        if (-not $key) { return @{ State = 'UNVERIFIED'; Reason = 'has no run id to correlate events with' } }
        $evPath = [Environment]::GetEnvironmentVariable(($flag -replace '_ADAPTER_', '_EVIDENCE_'))
        if (-not $evPath -or -not (Test-Path -LiteralPath $evPath)) { return @{ State = 'UNVERIFIED'; Reason = 'has no evidence export (BAS_CLP_EVIDENCE_' + $name + ' not set)' } }
        try { $events = @(Get-Content -LiteralPath $evPath -Raw -Encoding UTF8 | ConvertFrom-Json) } catch { return @{ State = 'ERROR'; Reason = 'evidence export is not valid JSON' } }
        $cutoff = (Get-Date).ToUniversalTime().AddMinutes(-15)
        $fresh = @($events | Where-Object { $_.time -and ([datetime]$_.time).ToUniversalTime() -ge $cutoff })
        $mine = @($fresh | Where-Object { $_.run_id -eq $key })
        if (@($mine | Where-Object { $_.event -eq 'transfer' }).Count -gt 0) { return @{ State = 'FAIL'; Detail = 'correlated transfer event for run ' + $key } }
        $ctl = @($mine | Where-Object { $_.event -eq 'block' -or $_.event -eq 'alert' })
        if ($ctl.Count -gt 0) { return @{ State = 'PASS'; Detail = 'correlated ' + $ctl[0].event + ' event for run ' + $key } }
        if ($fresh.Count -eq 0) { return @{ State = 'UNVERIFIED'; Reason = 'has no fresh evidence (none within 15 minutes)' } }
        return @{ State = 'UNVERIFIED'; Reason = 'has no correlated event for run ' + $key + ' in fresh evidence' }
      }
      function Out-AdapterVerdict($r, [string]$desc, [string]$name) {
        switch ($r.State) {
          'NOT_CONFIGURED' { Out-Verdict 'SKIP' 'NOT_CONFIGURED' ($desc + ': integration ' + $name + ' is not configured') }
          'UNVERIFIED'     { Out-Verdict 'SKIP' 'UNVERIFIED' ($desc + ': integration ' + $name + ' ' + $r.Reason) }
          'ERROR'          { Out-Verdict 'ERROR' 'ERROR' ($desc + ': integration ' + $name + ' ' + $r.Reason) }
          'FAIL'           { Out-Verdict 'FAIL' 'CORRELATED_TRANSFER' ($desc + ': ' + $r.Detail) }
          'PASS'           { Out-Verdict 'PASS' 'CORRELATED_EVENT' ($desc + ': ' + $r.Detail) }
        }
      }
      $runId = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0,[Math]::Min(8,$env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 0x7FFFFFFF) }
      $r = Get-AdapterResult 'BAS_CLP_ADAPTER_EGRESS'
      Out-AdapterVerdict $r 'SSH firewall and proxy correlation for the probe run id' 'egress'
    cleanup: ""

