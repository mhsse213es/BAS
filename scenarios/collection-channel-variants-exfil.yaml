    blast_radius: "Reads state or configuration only. Nothing is sent."
    telemetry:
      - "Firewall profile read"
    detection:
      - "None"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $tag = '[BAS-SIM-CHN]'
      function Out-Verdict([string]$v, [string]$state, [string]$detail) {
        Write-Output ("{0}: state={1} {2} {3}" -f $v, $state, $detail, $tag)
