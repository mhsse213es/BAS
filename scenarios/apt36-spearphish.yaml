id: apt36-spearphish
name: APT36 Spear-Phishing Kill Chain
description: >
  Simulates APT36 (Transparent Tribe / PROJECTM) TTPs targeting BFSI sector
  employees in India. APT36 is a Nexus threat actor known for
  targeting Indian government, defence, and financial institutions via
  spear-phishing with weaponised Office documents, HTA droppers, and
  CrimsonRAT/ObliqueRAT C2 implants.

  Per-OS local checks - Windows: Office VBA macro / Protected View / MOTW,
  MSHTA and WScript execution control, scheduled-task and Run-key persistence,
  browser credential storage. Linux: /tmp and /dev/shm execution restrictions,
  cron / shell-init / SSH persistence, AppArmor, host firewall egress. macOS:
  Gatekeeper and assessment policy, XProtect, LaunchAgents, application firewall.
author: Audspect Research
local_check: true
supported_os: [windows]
tags:
  - apt36
  - transparent-tribe
  - spearphish
  - bfsi
  - india
  - initial-access
  - rat
mitre_phases:
  - reconnaissance
  - initial-access
  - execution
  - persistence
  - credential-access
  - command-and-control

