      $m += @{ Name = 'applocker'; Available = ($State.AlSvc -and $State.AlReadable); Mode = [string]$State.Al[$Collection] }
      }
      if ($Allow -contains 'wdac') {
      $m += @{ Name = 'wdac'; Available = $State.WdReadable; Mode = [string]$State.Wd }
      }
      return $m
