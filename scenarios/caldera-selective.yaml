id: caldera-selective
name: Caldera Selective Abilities
description: >
  Admin-curated list of specific Caldera ability IDs to run.
  Replace the ability IDs under caldera_abilities with any IDs from
  your Caldera instance (GET /api/v2/abilities to browse the full library).
  Only abilities with a Windows (psh/powershell/cmd) executor will run;
  others are silently skipped.
author: Audspect Research
supported_os: [windows]
tags:
  - caldera
  - selective
  - custom
mitre_phases:
  - discovery
  - execution
  - lateral-movement
  - credential-access
  - defense-evasion
  - persistence

# Replace these IDs with abilities chosen from your Caldera library.
# To browse: GET http://<caldera-url>/api/v2/abilities
# Each ID runs exactly one Caldera ability on the target endpoint.
caldera_abilities:
  - "4e97e699-93d7-4040-b5a3-2e906a58199e"  # System Owner/User Discovery (T1033)
  - "1f7ff232-ebf8-42bf-a3c4-657855794cfe"  # Network Share Discovery (T1135)
  - "14a21534-350f-4d83-9dd7-3c56b93a0c17"  # Local Groups Enumeration (T1069.001)
  - "6469befa-748a-4b9c-aaa8-a5b0bd9b8104"  # Remote Service Creation (T1543.003)
  - "800b17b4-a45b-476f-b3b0-73b21d7f4cef"  # SMB Admin Share Enumeration (T1021.002)
  - "c3d03db3-e491-4b07-8e93-4c6c6b3cbcfe"  # Pass-the-Hash / NTLM Check (T1550.002)
  - "4d9b079c-9ede-4116-8b14-72ad3a5533af"  # LSASS Memory Access (T1003.001)
  - "0f3e8b98-d1e0-4d5c-9e25-3b0e30123456"  # WMI Remote Execution (T1047)
