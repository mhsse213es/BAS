id: "cscrf-mii-endpoint-audit"
product_line: common
name: "CSCRF-MII Endpoint Hardening and Audit Integrity Validation (P0)"
description: >
  Internal control-validation checks for endpoint hardening and audit integrity. Verdicts are internal
  control references (CSCRF-EA-*), not SEBI clause identifiers. Eight checks are read only. Two steps
  change state (an unauthorised-execution marker and an audit-policy change) and run only with
  BAS_CONFIRM_ENDPOINT_CHANGE=true, with undo that restores the original state. Deferred to a lab VM:
  real-time protection impairment, dedicated log clear, and Sysmon service stop. Passing a check does not
  establish CSCRF compliance.
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - cscrf-mii
  - endpoint
  - audit-integrity
  - p0
mitre_phases:
  - defense-evasion
  - discovery
  - execution

steps:

  # -------------------------------------------------------------------------
  - id: ea-01
    name: "Security Patch Currency (CSCRF-EA-01)"
    technique_id: T1082
    action_key: cscrf_ea_patch_currency
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Read-only query of installed hotfixes."
    telemetry:
      - "Hotfix query"
    detection:
      - "Patch currency review"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $script:CgRun = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0, [Math]::Min(8, $env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 2147483647) }
      $script:ProcessCreationGuid = '{0CCE922B-69AE-11D9-BED3-505054503030}'
      function Write-CgVerdict { param([string]$Outcome, [string]$Reason, [string]$Id)
      $p = 'SKIP'
      if ($Outcome -eq 'pass') { $p = 'PASS' } elseif ($Outcome -eq 'fail') { $p = 'FAIL' } elseif ($Outcome -eq 'error') { $p = 'ERROR' }
      Write-Output ($p + ': ' + $Reason + ' [BAS-EA-' + $Id + ']')
      }
      function Complete-CgStep { param($Res, [string]$Id) Write-CgVerdict $Res.Outcome $Res.Reason $Id; exit 0 }
      function Test-CgEndpointGate { return ($env:BAS_CONFIRM_ENDPOINT_CHANGE -eq 'true') }
      function Get-CgUndoPath { param([string]$Id) return (Join-Path $env:TEMP ('bas-cg-undo\' + $Id + '.json')) }
      function New-CgUndoRecord { param([string]$Id, $Data)
      $p = Get-CgUndoPath $Id
      New-Item -ItemType Directory -Force -Path (Split-Path -Parent $p) | Out-Null
      $fs = [IO.File]::Open($p, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write)
      try { $b = [Text.Encoding]::ASCII.GetBytes(($Data | ConvertTo-Json -Depth 6 -Compress)); $fs.Write($b, 0, $b.Length) } finally { $fs.Close() }
      }
      function Read-CgUndoRecord { param([string]$Id)
      $p = Get-CgUndoPath $Id
      if (-not (Test-Path -LiteralPath $p)) { return $null }
      try { return (Get-Content -LiteralPath $p -Raw | ConvertFrom-Json) } catch { return 'unreadable' }
      }
      function Remove-CgUndoRecord { param([string]$Id) Remove-Item -LiteralPath (Get-CgUndoPath $Id) -Force -ErrorAction SilentlyContinue }
      function Get-CgProcessCreationSetting {
      $csv = & auditpol.exe /get /subcategory:$script:ProcessCreationGuid /r 2>$null
      $row = @($csv | ConvertFrom-Csv)
      if ($row.Count -eq 0) { return $null }
      switch ([string]$row[0].'Inclusion Setting') {
      'No Auditing' { return 0 }
      'Success' { return 1 }
      'Failure' { return 2 }
      'Success and Failure' { return 3 }
      default { return $null }
      }
      }
      try { $hf = Get-HotFix -ErrorAction Stop | Where-Object { $_.InstalledOn } | Sort-Object InstalledOn -Descending | Select-Object -First 1 } catch { $hf = $null }
      if (-not $hf) { Complete-CgStep @{ Outcome = 'error'; Reason = 'no installed update history could be read [CSCRF-EA-01]' } 'ea-01' }
      $age = [int]((Get-Date) - $hf.InstalledOn).TotalDays
      if ($age -gt 60) { Complete-CgStep @{ Outcome = 'fail'; Reason = "newest update $($hf.HotFixID) is $age days old (baseline 60) [CSCRF-EA-01]" } 'ea-01' }
      Complete-CgStep @{ Outcome = 'pass'; Reason = "newest update $($hf.HotFixID) is $age days old [CSCRF-EA-01]" } 'ea-01'
    cleanup: |
      $ErrorActionPreference = 'SilentlyContinue'
      $script:CgRun = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0, [Math]::Min(8, $env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 2147483647) }
      $script:ProcessCreationGuid = '{0CCE922B-69AE-11D9-BED3-505054503030}'
      function Write-CgVerdict { param([string]$Outcome, [string]$Reason, [string]$Id)
      $p = 'SKIP'
      if ($Outcome -eq 'pass') { $p = 'PASS' } elseif ($Outcome -eq 'fail') { $p = 'FAIL' } elseif ($Outcome -eq 'error') { $p = 'ERROR' }
      Write-Output ($p + ': ' + $Reason + ' [BAS-EA-' + $Id + ']')
      }
      function Complete-CgStep { param($Res, [string]$Id) Write-CgVerdict $Res.Outcome $Res.Reason $Id; exit 0 }
      function Test-CgEndpointGate { return ($env:BAS_CONFIRM_ENDPOINT_CHANGE -eq 'true') }
      function Get-CgUndoPath { param([string]$Id) return (Join-Path $env:TEMP ('bas-cg-undo\' + $Id + '.json')) }
      function New-CgUndoRecord { param([string]$Id, $Data)
      $p = Get-CgUndoPath $Id
      New-Item -ItemType Directory -Force -Path (Split-Path -Parent $p) | Out-Null
      $fs = [IO.File]::Open($p, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write)
      try { $b = [Text.Encoding]::ASCII.GetBytes(($Data | ConvertTo-Json -Depth 6 -Compress)); $fs.Write($b, 0, $b.Length) } finally { $fs.Close() }
      }
      function Read-CgUndoRecord { param([string]$Id)
      $p = Get-CgUndoPath $Id
      if (-not (Test-Path -LiteralPath $p)) { return $null }
      try { return (Get-Content -LiteralPath $p -Raw | ConvertFrom-Json) } catch { return 'unreadable' }
      }
      function Remove-CgUndoRecord { param([string]$Id) Remove-Item -LiteralPath (Get-CgUndoPath $Id) -Force -ErrorAction SilentlyContinue }
      function Get-CgProcessCreationSetting {
      $csv = & auditpol.exe /get /subcategory:$script:ProcessCreationGuid /r 2>$null
      $row = @($csv | ConvertFrom-Csv)
      if ($row.Count -eq 0) { return $null }
      switch ([string]$row[0].'Inclusion Setting') {
      'No Auditing' { return 0 }
      'Success' { return 1 }
      'Failure' { return 2 }
      'Success and Failure' { return 3 }
      default { return $null }
      }
      }
      Write-Output 'PASS: Cleanup complete'
      exit 0

