id: collection-browser-cloud-email-discovery
product_line: dlp
name: Browser, Cloud and Mailbox Discovery
description: >
  Discovery of where sensitive data sits outside the file system (browser profiles, cloud-sync
  folders, local mail stores), plus synthetic access probes and a check of whether EDR/DLP telemetry
  saw them. Discovery and detection are scored separately: finding a folder proves discovery, not
  detection. Detection is scored only from an exported EDR/DLP event file (BAS_EDR_EVENTS_FILE).
  Verdicts: PASS detected or evidence recorded; FAIL access confirmed missed; SKIP NOT_CONFIGURED
  (no integration) or UNVERIFIED (integration present but no usable correlated evidence); ERROR
  execution or query failure.

  COVERAGE: T1217 browser discovery; T1539 synthetic cookie-store access; T1619 local sync-folder
  discovery and a synthetic sync-folder access with no sync client running (full cloud object discovery not claimed); T1114 local mail-store discovery and a
  synthetic mailbox access only (email collection not claimed).

  SAFETY: No profile database, cookie, password, token, mailbox or cloud file is opened or read.
  Probes use synthetic files written to a BAS temp folder and deleted. The synced-folder probe is opt-in
  (BAS_SYNC_PROBE=1), runs only when no sync client is running, and writes only a dedicated subfolder it
  deletes at once. Nothing is copied, decrypted or sent. Windows only.
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - discovery
  - browser
  - cloud
  - email
  - dlp
  - t1217
  - t1539
  - t1619
  - t1114
  - mitre
mitre_phases:
  - discovery

live_policy:
  block_on_domain_controller: true
  require_dc_reachable: false
  max_spray_attempts: 0
  spray_account_allowlist: []
  execution_window: ""

steps:
  - name: "Surveyed Data 1 — Browser Profile Discovery (T1217)"
    check_id: discovery-browser-profiles
    technique_id: T1217
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Records which browser profile roots exist and the profile folder names. No profile file is opened or read."
    telemetry:
      - "Sysmon EID 11: none (directory metadata only)"
      - "PowerShell EID 4104: Test-Path and Get-ChildItem -Directory"
    detection:
      - "Discovery is evidence of discovery only; it is not a detection result"
    command: |
      $roots = [ordered]@{
        Chrome  = Join-Path $env:LOCALAPPDATA 'Google\Chrome\User Data'
        Edge    = Join-Path $env:LOCALAPPDATA 'Microsoft\Edge\User Data'
        Firefox = Join-Path $env:APPDATA 'Mozilla\Firefox\Profiles'
      }
      $found = @(); $names = @()
      foreach ($k in $roots.Keys) {
        if (Test-Path -LiteralPath $roots[$k]) {
          $found += $k
          $names += @(Get-ChildItem -LiteralPath $roots[$k] -Directory | ForEach-Object { "$k/$($_.Name)" })
        }
      }
      Write-Output "PASS: browser discovery recorded | observed=installed profile roots=[$($found -join ', ')] of 3 checked; profile folder names=[$($names -join ', ')] | expected=discovery evidence, not a detection result | source=Test-Path and Get-ChildItem -Directory on profile roots. No profile file was opened or read."
    cleanup: ""
  - name: "Surveyed Data 11 — Cloud Object Discovery, local S3 endpoint (T1619)"
    check_id: discovery-cloud-objects-s3
    technique_id: T1619
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 45
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Lists object names in one bucket on a local rclone S3 endpoint and records only the count. No object content is read or copied."
    telemetry:
      - "Process creation: rclone.exe"
      - "Network: connection to the local S3 endpoint"
    detection:
      - "Listing evidence only; detection is not scored by this step"
    command: |
      if (-not $env:BAS_S3_ENDPOINT -or -not $env:BAS_S3_BUCKET) { Write-Output 'SKIP: not configured; set BAS_S3_ENDPOINT and BAS_S3_BUCKET to a local rclone serve s3 instance | observed=unset | expected=object listing | source=environment'; exit 0 }
      if (-not (Get-Command rclone -ErrorAction SilentlyContinue)) { Write-Output 'SKIP: not configured; rclone is not on PATH | observed=missing | expected=object listing | source=PATH'; exit 0 }
      $env:RCLONE_S3_PROVIDER = 'Other'
      $env:RCLONE_S3_ENDPOINT = $env:BAS_S3_ENDPOINT
      $env:RCLONE_S3_ACCESS_KEY_ID = $env:BAS_S3_ACCESS_KEY
      $env:RCLONE_S3_SECRET_ACCESS_KEY = $env:BAS_S3_SECRET_KEY
      $out = @(& rclone lsf -R (':s3:' + $env:BAS_S3_BUCKET))
      if ($LASTEXITCODE -ne 0) { Write-Output "ERROR: object listing failed (rclone exit $LASTEXITCODE) | source=rclone lsf -R" ; exit 0 }
      $count = @($out | Where-Object { $_ -is [string] -and $_ -and -not $_.EndsWith('/') }).Count
      Write-Output "PASS: cloud object discovery recorded | observed=objects listed=$count; object names not recorded | expected=listing evidence, not a detection result | source=rclone lsf -R against the local S3 endpoint. No object content was read."
    cleanup: ""
  - name: "Surveyed Data 12 — Mailbox Discovery, local IMAP (T1114)"
    check_id: discovery-mailbox-imap
    technique_id: T1114
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 45
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Logs in to a local synthetic test mailbox, lists folders, and records the INBOX message count. No header, body or attachment is fetched."
    telemetry:
      - "Network: IMAP connection to the local test mail server"
      - "Authentication event on the mail server"
    detection:
      - "Mailbox listing evidence only; collection of message content is not exercised"
    command: |
      if (-not $env:BAS_IMAP_HOST -or -not $env:BAS_IMAP_USER -or -not $env:BAS_IMAP_PASSWORD) { Write-Output 'SKIP: not configured; set BAS_IMAP_HOST, BAS_IMAP_USER and BAS_IMAP_PASSWORD for a local test mailbox | observed=unset | expected=mailbox listing | source=environment'; exit 0 }
      $port = if ($env:BAS_IMAP_PORT) { [int]$env:BAS_IMAP_PORT } else { 143 }
      $tcp = New-Object System.Net.Sockets.TcpClient
      try { $tcp.Connect($env:BAS_IMAP_HOST, $port) } catch { Write-Output "ERROR: IMAP connect failed to $($env:BAS_IMAP_HOST):$port | source=TCP"; exit 0 }
      $ns = $tcp.GetStream()
      $sw = New-Object IO.StreamWriter($ns); $sw.NewLine = "`r`n"; $sw.AutoFlush = $true
      $sr = New-Object IO.StreamReader($ns)
      function Invoke-ImapCommand([string]$Tag, [string]$Cmd) {
        $sw.WriteLine("$Tag $Cmd")
        $lines = @()
        while ($true) { $l = $sr.ReadLine(); if ($null -eq $l) { break }; $lines += $l; if ($l.StartsWith("$Tag ")) { break } }
        return $lines
      }
      [void]$sr.ReadLine()
      $login = Invoke-ImapCommand 'a1' ('LOGIN "' + $env:BAS_IMAP_USER + '" "' + $env:BAS_IMAP_PASSWORD + '"')
      if (-not (@($login)[-1] -match '^a1 OK')) { Write-Output "ERROR: IMAP login rejected by the test mailbox | source=IMAP LOGIN (password not recorded)"; $tcp.Close(); exit 0 }
      $list = Invoke-ImapCommand 'a2' 'LIST "" "*"'
      $folders = @($list | Where-Object { $_ -match '^\* LIST' } | ForEach-Object { if ($_ -match '"([^"]*)"\s*$') { $matches[1] } else { ($_ -split ' ')[-1] } })
      $exam = Invoke-ImapCommand 'a3' 'EXAMINE "INBOX"'
      $exists = @($exam | Where-Object { $_ -match '^\* (\d+) EXISTS' } | ForEach-Object { $matches[1] })
      $count = if ($exists.Count) { [int]$exists[0] } else { 0 }
      [void](Invoke-ImapCommand 'a4' 'LOGOUT')
      $tcp.Close()
      Write-Output "PASS: mailbox discovery recorded | observed=folders=[$($folders -join ', ')]; INBOX message count=$count; no header or body was fetched | expected=listing evidence, not a detection result | source=IMAP LIST and EXAMINE against the local test mailbox"
    cleanup: ""
  - name: "Surveyed Data 2 — Synthetic Cookie-Store Access Probe (T1539)"
    check_id: probe-browser-cookie-store
    technique_id: T1539
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Creates a synthetic file named Cookies in a BAS temp folder, opens it read-only, and deletes it. No browser database is touched."
    telemetry:
      - "Sysmon EID 11: create of a synthetic Cookies file under %TEMP%\bas-probe"
      - "Sysmon EID 1: powershell.exe process id recorded"
    detection:
      - "EDR/DLP: read of a file named Cookies by a non-browser process, scored separately in the correlation step"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $state = Join-Path $env:TEMP 'bas-discovery-probes.json'
      function Read-Probes {
        if (-not (Test-Path -LiteralPath $state)) { return @() }
        $raw = ConvertFrom-Json -InputObject (Get-Content -LiteralPath $state -Raw)
        return @($raw)
      }
      function Add-ProbeRecord([string]$Name, [string]$Path) {
        $rec = [pscustomobject]@{ probe = $Name; pid = $PID; utc = (Get-Date).ToUniversalTime().ToString('o'); path = $Path }
        $list = New-Object System.Collections.ArrayList
        if (Test-Path -LiteralPath $state) {
          foreach ($x in @(Read-Probes)) { if ($x.probe -ne $Name) { [void]$list.Add($x) } }
        }
        [void]$list.Add($rec)
        ConvertTo-Json -InputObject @($list.ToArray()) -Depth 3 | Set-Content -LiteralPath $state -Encoding utf8
      }
      function Invoke-SyntheticProbe([string]$Name, [string]$FileName) {
        $dir = Join-Path $env:TEMP ('bas-probe\' + [guid]::NewGuid().ToString('N'))
        New-Item -ItemType Directory -Force -Path $dir | Out-Null
        $path = Join-Path $dir $FileName
        [IO.File]::WriteAllText($path, 'SYNTHETIC BAS DISCOVERY PROBE. NOT A REAL DATA STORE.')
        Add-ProbeRecord $Name $path
        $fs = [IO.File]::Open($path, 'Open', 'Read', 'ReadWrite')
        try { $buf = New-Object byte[] 16; [void]$fs.Read($buf, 0, 16) } finally { $fs.Dispose() }
        Remove-Item -LiteralPath $dir -Recurse -Force
        return $path
      }
      try {
        $p = Invoke-SyntheticProbe 'browser-cookie-store' 'Cookies'
        Write-Output "PASS: synthetic cookie-store probe ran | observed=pid=$PID path=$p | expected=probe executed; detection is scored in the correlation step | source=synthetic file under %TEMP%/bas-probe, read-only open"
      } catch { Write-Output "ERROR: synthetic cookie-store probe failed: $($_.Exception.Message)" }
    cleanup: ""
  - name: "Surveyed Data 3 — Browser Cookie-Store Detection Correlation (T1539)"
    check_id: correlate-browser-cookie-store
    technique_id: T1539
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Reads an exported EDR/DLP event file and matches the probe process id, file name and timestamp. Writes nothing to the host."
    telemetry:
      - "none; reads the exported event file only"
    detection:
      - "Scores the detection control: PASS detected, FAIL missed, SKIP not configured or unverified"
    command: |
      $state = Join-Path $env:TEMP 'bas-discovery-probes.json'
      function Read-Probes {
        if (-not (Test-Path -LiteralPath $state)) { return @() }
        $raw = ConvertFrom-Json -InputObject (Get-Content -LiteralPath $state -Raw)
        return @($raw)
      }

      $probeName = 'browser-cookie-store'
      $eventsFile = $env:BAS_EDR_EVENTS_FILE
      if (-not $eventsFile) { Write-Output 'SKIP: not configured; set BAS_EDR_EVENTS_FILE to an exported JSON-lines EDR/DLP event file (fields: timestamp, process_id, file_path) | source=BAS_EDR_EVENTS_FILE'; exit 0 }
      if (-not (Test-Path -LiteralPath $eventsFile)) { Write-Output "SKIP: not configured; BAS_EDR_EVENTS_FILE does not exist | source=$eventsFile"; exit 0 }
      if (-not (Test-Path -LiteralPath $state)) { Write-Output "ERROR: probe record file missing; run the probe step first | source=$state"; exit 0 }
      $rec = @(Read-Probes) | Where-Object { $_.probe -eq $probeName } | Select-Object -First 1
      if (-not $rec) { Write-Output "ERROR: no probe record for browser-cookie-store | source=$state"; exit 0 }
      try {
        $events = @(Get-Content -LiteralPath $eventsFile | Where-Object { $_.Trim() } | ForEach-Object { $_ | ConvertFrom-Json -ErrorAction Stop })
      } catch { Write-Output "ERROR: event file is not readable JSON lines | source=$eventsFile"; exit 0 }
      if ($events.Count -gt 0 -and -not ($events[0].PSObject.Properties['timestamp'] -and $events[0].PSObject.Properties['process_id'] -and $events[0].PSObject.Properties['file_path'])) {
        Write-Output "ERROR: event schema mismatch; expected timestamp, process_id, file_path | source=$eventsFile"; exit 0
      }
      $t0 = [datetimeoffset]::Parse($rec.utc).UtcDateTime
      $leaf = Split-Path $rec.path -Leaf
      $hits = @($events | Where-Object {
        $ts = [datetimeoffset]::Parse($_.timestamp).UtcDateTime
        ([int]$_.process_id -eq [int]$rec.pid) -and ("$($_.file_path)" -like "*$leaf") -and ($ts -ge $t0.AddSeconds(-5)) -and ($ts -le $t0.AddSeconds(60))
      })
      $newest = $null
      if ($events.Count -gt 0) { $newest = ($events | ForEach-Object { [datetimeoffset]::Parse($_.timestamp).UtcDateTime } | Measure-Object -Maximum).Maximum }
      $obs = "probe pid=$($rec.pid) file=$leaf utc=$($rec.utc) correlated events=$($hits.Count) newest export event=$newest"
      if ($hits.Count -gt 0) { Write-Output "PASS: access to the synthetic $probeName probe was detected and correlated to its process and timestamp | observed=$obs | expected=correlated event | source=$eventsFile" }
      elseif ($newest -and $newest -ge $t0.AddSeconds(60)) { Write-Output "FAIL: access to the synthetic $probeName probe was not detected; the export is newer than the probe and holds no event for its process | observed=$obs | expected=correlated event | source=$eventsFile" }
      else { Write-Output "SKIP: unverified; the export is older than the probe or empty, so absence of an event is not evidence | observed=$obs | expected=correlated event | source=$eventsFile" }
    cleanup: ""
  - name: "Surveyed Data 4 — Cloud-Sync Client Discovery (T1619, local folders only)"
    check_id: discovery-cloud-sync
    technique_id: T1619
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Lists sync folder names and sync client process names. Account settings and tokens are not read. This is local discovery only, not full T1619 coverage."
    telemetry:
      - "PowerShell EID 4104: environment and Test-Path reads"
      - "Sysmon EID 1: Get-Process"
    detection:
      - "Local sync-folder discovery is evidence of discovery only"
    command: |
      $cands = [ordered]@{
        OneDrive = $env:OneDrive
        OneDriveCommercial = $env:OneDriveCommercial
        Dropbox = (Join-Path $env:USERPROFILE 'Dropbox')
        GoogleDrive = (Join-Path $env:USERPROFILE 'Google Drive')
      }
      $folders = @()
      foreach ($k in $cands.Keys) { if ($cands[$k] -and (Test-Path -LiteralPath $cands[$k])) { $folders += "$k=$(Split-Path $cands[$k] -Leaf)" } }
      $procs = @(Get-Process -Name OneDrive, Dropbox, GoogleDriveFS -ErrorAction SilentlyContinue | ForEach-Object { $_.ProcessName } | Sort-Object -Unique)
      Write-Output "PASS: cloud-sync discovery recorded | observed=sync folder names=[$($folders -join ', ')]; sync client processes=[$($procs -join ', ')] | expected=discovery evidence, not a detection result | source=environment variables, Test-Path, Get-Process names. Account settings and tokens were not read."
    cleanup: ""
  - name: "Surveyed Data 5 — Synced-Folder Access Probe (T1619)"
    check_id: probe-cloud-sync-folder
    technique_id: T1619
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Opt-in (BAS_SYNC_PROBE=1). Runs only when no sync client process is running. Creates a synthetic file in a dedicated subfolder of a sync root, reads it, and deletes the subfolder at once. Otherwise reports UNVERIFIED."
    telemetry:
      - "Sysmon EID 11: create and delete of a BAS-probe folder under the sync root"
    detection:
      - "Sync-folder access is scored separately in the next step"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $state = Join-Path $env:TEMP 'bas-discovery-probes.json'
      function Read-Probes {
        if (-not (Test-Path -LiteralPath $state)) { return @() }
        $raw = ConvertFrom-Json -InputObject (Get-Content -LiteralPath $state -Raw)
        return @($raw)
      }
      function Add-ProbeRecord([string]$Name, [string]$Path) {
        $rec = [pscustomobject]@{ probe = $Name; pid = $PID; utc = (Get-Date).ToUniversalTime().ToString('o'); path = $Path }
        $list = New-Object System.Collections.ArrayList
        if (Test-Path -LiteralPath $state) {
          foreach ($x in @(Read-Probes)) { if ($x.probe -ne $Name) { [void]$list.Add($x) } }
        }
        [void]$list.Add($rec)
        ConvertTo-Json -InputObject @($list.ToArray()) -Depth 3 | Set-Content -LiteralPath $state -Encoding utf8
      }
      function Invoke-SyntheticProbe([string]$Name, [string]$FileName) {
        $dir = Join-Path $env:TEMP ('bas-probe\' + [guid]::NewGuid().ToString('N'))
        New-Item -ItemType Directory -Force -Path $dir | Out-Null
        $path = Join-Path $dir $FileName
        [IO.File]::WriteAllText($path, 'SYNTHETIC BAS DISCOVERY PROBE. NOT A REAL DATA STORE.')
        Add-ProbeRecord $Name $path
        $fs = [IO.File]::Open($path, 'Open', 'Read', 'ReadWrite')
        try { $buf = New-Object byte[] 16; [void]$fs.Read($buf, 0, 16) } finally { $fs.Dispose() }
        Remove-Item -LiteralPath $dir -Recurse -Force
        return $path
      }
      if ($env:BAS_SYNC_PROBE -ne '1') { Write-Output 'SKIP: unverified; the sync-folder probe is opt-in (set BAS_SYNC_PROBE=1 on a test host only) | observed=not run | expected=access event for a synthetic file in a sync folder | source=policy'; exit 0 }
      $roots = @($env:OneDrive, $env:OneDriveCommercial, (Join-Path $env:USERPROFILE 'Dropbox'), (Join-Path $env:USERPROFILE 'Google Drive')) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
      if (-not $roots) { Write-Output 'SKIP: unverified; no sync folder is present on this host | observed=none | expected=sync folder | source=environment variables and Test-Path'; exit 0 }
      $running = @(Get-Process -Name OneDrive, Dropbox, GoogleDriveFS -ErrorAction SilentlyContinue | ForEach-Object { $_.ProcessName } | Sort-Object -Unique)
      if ($running.Count -gt 0) { Write-Output "SKIP: unverified; a sync client is running ($($running -join ', ')), so a probe file could be uploaded | observed=not run | expected=no running sync client | source=Get-Process"; exit 0 }
      $dir = Join-Path $roots[0] ('BAS-probe-' + [guid]::NewGuid().ToString('N'))
      try {
        New-Item -ItemType Directory -Path $dir | Out-Null
        $path = Join-Path $dir 'synthetic.docx'
        [IO.File]::WriteAllText($path, 'SYNTHETIC BAS SYNC PROBE. NOT USER DATA.')
        Add-ProbeRecord 'cloud-sync-folder' $path
        $fs = [IO.File]::Open($path, 'Open', 'Read', 'ReadWrite')
        try { $buf = New-Object byte[] 16; [void]$fs.Read($buf, 0, 16) } finally { $fs.Dispose() }
        Write-Output "PASS: synthetic sync-folder probe ran | observed=pid=$PID path=$path | expected=probe executed; detection is scored in the correlation step | source=synthetic file in a dedicated subfolder of the sync root, no sync client running"
      } catch { Write-Output "ERROR: synthetic sync-folder probe failed: $($_.Exception.Message)" }
      finally { Remove-Item -LiteralPath $dir -Recurse -Force -ErrorAction SilentlyContinue }
    cleanup: ""
  - name: "Surveyed Data 5b — Sync-Folder Detection Correlation (T1619)"
    check_id: correlate-cloud-sync-folder
    technique_id: T1619
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Reads an exported EDR/DLP event file and matches the sync-probe process id, file name and timestamp. Writes nothing to the host."
    telemetry:
      - "none; reads the exported event file only"
    detection:
      - "Scores the detection control: PASS detected, FAIL missed, SKIP not configured or unverified"
    command: |
      $state = Join-Path $env:TEMP 'bas-discovery-probes.json'
      function Read-Probes {
        if (-not (Test-Path -LiteralPath $state)) { return @() }
        $raw = ConvertFrom-Json -InputObject (Get-Content -LiteralPath $state -Raw)
        return @($raw)
      }

      $probeName = 'cloud-sync-folder'
      $eventsFile = $env:BAS_EDR_EVENTS_FILE
      if (-not $eventsFile) { Write-Output 'SKIP: not configured; set BAS_EDR_EVENTS_FILE to an exported JSON-lines EDR/DLP event file (fields: timestamp, process_id, file_path) | source=BAS_EDR_EVENTS_FILE'; exit 0 }
      if (-not (Test-Path -LiteralPath $eventsFile)) { Write-Output "SKIP: not configured; BAS_EDR_EVENTS_FILE does not exist | source=$eventsFile"; exit 0 }
      if (-not (Test-Path -LiteralPath $state)) { Write-Output "ERROR: probe record file missing; run the probe step first | source=$state"; exit 0 }
      $rec = @(Read-Probes) | Where-Object { $_.probe -eq $probeName } | Select-Object -First 1
      if (-not $rec) { Write-Output "SKIP: unverified; the sync-folder probe did not run, so there is nothing to correlate | observed=no probe record | expected=correlated event | source=$state"; exit 0 }
      try {
        $events = @(Get-Content -LiteralPath $eventsFile | Where-Object { $_.Trim() } | ForEach-Object { $_ | ConvertFrom-Json -ErrorAction Stop })
      } catch { Write-Output "ERROR: event file is not readable JSON lines | source=$eventsFile"; exit 0 }
      if ($events.Count -gt 0 -and -not ($events[0].PSObject.Properties['timestamp'] -and $events[0].PSObject.Properties['process_id'] -and $events[0].PSObject.Properties['file_path'])) {
        Write-Output "ERROR: event schema mismatch; expected timestamp, process_id, file_path | source=$eventsFile"; exit 0
      }
      $t0 = [datetimeoffset]::Parse($rec.utc).UtcDateTime
      $leaf = Split-Path $rec.path -Leaf
      $hits = @($events | Where-Object {
        $ts = [datetimeoffset]::Parse($_.timestamp).UtcDateTime
        ([int]$_.process_id -eq [int]$rec.pid) -and ("$($_.file_path)" -like "*$leaf") -and ($ts -ge $t0.AddSeconds(-5)) -and ($ts -le $t0.AddSeconds(60))
      })
      $newest = $null
      if ($events.Count -gt 0) { $newest = ($events | ForEach-Object { [datetimeoffset]::Parse($_.timestamp).UtcDateTime } | Measure-Object -Maximum).Maximum }
      $obs = "probe pid=$($rec.pid) file=$leaf utc=$($rec.utc) correlated events=$($hits.Count) newest export event=$newest"
      if ($hits.Count -gt 0) { Write-Output "PASS: access to the synthetic $probeName probe was detected and correlated to its process and timestamp | observed=$obs | expected=correlated event | source=$eventsFile" }
      elseif ($newest -and $newest -ge $t0.AddSeconds(60)) { Write-Output "FAIL: access to the synthetic $probeName probe was not detected; the export is newer than the probe and holds no event for its process | observed=$obs | expected=correlated event | source=$eventsFile" }
      else { Write-Output "SKIP: unverified; the export is older than the probe or empty, so absence of an event is not evidence | observed=$obs | expected=correlated event | source=$eventsFile" }
    cleanup: ""
  - name: "Surveyed Data 6 — Local Mail-Store Discovery (T1114, local discovery only)"
    check_id: discovery-mail-stores
    technique_id: T1114
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 45
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Counts and names .pst and .ost files to depth three, scanning at most 1,000 files, and checks the Outlook profile key. No mailbox is opened. This is local discovery only, not full T1114 coverage."
    telemetry:
      - "Sysmon EID 1: powershell.exe with a recursive search for .pst/.ost"
      - "PowerShell EID 4104"
    detection:
      - "Local mail-store discovery is evidence of discovery only"
    command: |
      $roots = @($env:APPDATA, (Join-Path $env:USERPROFILE 'Documents')) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
      $stores = @()
      foreach ($r in $roots) {
        $stores += @(Get-ChildItem -LiteralPath $r -File -Recurse -Force | Select-Object -First 1000 | Where-Object {
          $_.Extension -in @('.pst','.ost') -and ((($_.FullName.Substring($r.Length)) -split '\\').Count -le 4)
        } | ForEach-Object { "$($_.Name) ($([math]::Round($_.Length/1MB,1)) MB)" })
      }
      $outlook = Test-Path -LiteralPath 'HKCU:\Software\Microsoft\Office\16.0\Outlook'
      Write-Output "PASS: mail-store discovery recorded | observed=mail store files=[$($stores -join ', ')]; Outlook profile key present=$outlook | expected=discovery evidence, not a detection result | source=Get-ChildItem .pst/.ost to depth 3 (first 1000 files scanned), Test-Path on the Outlook key. No mailbox was opened or read."
    cleanup: ""
  - name: "Surveyed Data 7 — Synthetic Mailbox Access Probe (T1114)"
    check_id: probe-mailbox-store
    technique_id: T1114
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Creates a synthetic .pst file in a BAS temp folder, opens it read-only, and deletes it. No real mailbox is touched."
    telemetry:
      - "Sysmon EID 11: create of a synthetic .pst under %TEMP%\bas-probe"
    detection:
      - "EDR/DLP: read of a .pst file by a non-mail process, scored separately in the correlation step"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $state = Join-Path $env:TEMP 'bas-discovery-probes.json'
      function Read-Probes {
        if (-not (Test-Path -LiteralPath $state)) { return @() }
        $raw = ConvertFrom-Json -InputObject (Get-Content -LiteralPath $state -Raw)
        return @($raw)
      }
      function Add-ProbeRecord([string]$Name, [string]$Path) {
        $rec = [pscustomobject]@{ probe = $Name; pid = $PID; utc = (Get-Date).ToUniversalTime().ToString('o'); path = $Path }
        $list = New-Object System.Collections.ArrayList
        if (Test-Path -LiteralPath $state) {
          foreach ($x in @(Read-Probes)) { if ($x.probe -ne $Name) { [void]$list.Add($x) } }
        }
        [void]$list.Add($rec)
        ConvertTo-Json -InputObject @($list.ToArray()) -Depth 3 | Set-Content -LiteralPath $state -Encoding utf8
      }
      function Invoke-SyntheticProbe([string]$Name, [string]$FileName) {
        $dir = Join-Path $env:TEMP ('bas-probe\' + [guid]::NewGuid().ToString('N'))
        New-Item -ItemType Directory -Force -Path $dir | Out-Null
        $path = Join-Path $dir $FileName
        [IO.File]::WriteAllText($path, 'SYNTHETIC BAS DISCOVERY PROBE. NOT A REAL DATA STORE.')
        Add-ProbeRecord $Name $path
        $fs = [IO.File]::Open($path, 'Open', 'Read', 'ReadWrite')
        try { $buf = New-Object byte[] 16; [void]$fs.Read($buf, 0, 16) } finally { $fs.Dispose() }
        Remove-Item -LiteralPath $dir -Recurse -Force
        return $path
      }
      try {
        $p = Invoke-SyntheticProbe 'mailbox-pst-store' 'synthetic.pst'
        Write-Output "PASS: synthetic mailbox probe ran | observed=pid=$PID path=$p | expected=probe executed; detection is scored in the correlation step | source=synthetic file under %TEMP%/bas-probe, read-only open"
      } catch { Write-Output "ERROR: synthetic mailbox probe failed: $($_.Exception.Message)" }
    cleanup: ""
  - name: "Surveyed Data 8 — Mailbox Detection Correlation (T1114)"
    check_id: correlate-mailbox-store
    technique_id: T1114
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Reads an exported EDR/DLP event file and matches the probe process id, file name and timestamp. Writes nothing to the host."
    telemetry:
      - "none; reads the exported event file only"
    detection:
      - "Scores the detection control: PASS detected, FAIL missed, SKIP not configured or unverified"
    command: |
      $state = Join-Path $env:TEMP 'bas-discovery-probes.json'
      function Read-Probes {
        if (-not (Test-Path -LiteralPath $state)) { return @() }
        $raw = ConvertFrom-Json -InputObject (Get-Content -LiteralPath $state -Raw)
        return @($raw)
      }

      $probeName = 'mailbox-pst-store'
      $eventsFile = $env:BAS_EDR_EVENTS_FILE
      if (-not $eventsFile) { Write-Output 'SKIP: not configured; set BAS_EDR_EVENTS_FILE to an exported JSON-lines EDR/DLP event file (fields: timestamp, process_id, file_path) | source=BAS_EDR_EVENTS_FILE'; exit 0 }
      if (-not (Test-Path -LiteralPath $eventsFile)) { Write-Output "SKIP: not configured; BAS_EDR_EVENTS_FILE does not exist | source=$eventsFile"; exit 0 }
      if (-not (Test-Path -LiteralPath $state)) { Write-Output "ERROR: probe record file missing; run the probe step first | source=$state"; exit 0 }
      $rec = @(Read-Probes) | Where-Object { $_.probe -eq $probeName } | Select-Object -First 1
      if (-not $rec) { Write-Output "ERROR: no probe record for mailbox-pst-store | source=$state"; exit 0 }
      try {
        $events = @(Get-Content -LiteralPath $eventsFile | Where-Object { $_.Trim() } | ForEach-Object { $_ | ConvertFrom-Json -ErrorAction Stop })
      } catch { Write-Output "ERROR: event file is not readable JSON lines | source=$eventsFile"; exit 0 }
      if ($events.Count -gt 0 -and -not ($events[0].PSObject.Properties['timestamp'] -and $events[0].PSObject.Properties['process_id'] -and $events[0].PSObject.Properties['file_path'])) {
        Write-Output "ERROR: event schema mismatch; expected timestamp, process_id, file_path | source=$eventsFile"; exit 0
      }
      $t0 = [datetimeoffset]::Parse($rec.utc).UtcDateTime
      $leaf = Split-Path $rec.path -Leaf
      $hits = @($events | Where-Object {
        $ts = [datetimeoffset]::Parse($_.timestamp).UtcDateTime
        ([int]$_.process_id -eq [int]$rec.pid) -and ("$($_.file_path)" -like "*$leaf") -and ($ts -ge $t0.AddSeconds(-5)) -and ($ts -le $t0.AddSeconds(60))
      })
      $newest = $null
      if ($events.Count -gt 0) { $newest = ($events | ForEach-Object { [datetimeoffset]::Parse($_.timestamp).UtcDateTime } | Measure-Object -Maximum).Maximum }
      $obs = "probe pid=$($rec.pid) file=$leaf utc=$($rec.utc) correlated events=$($hits.Count) newest export event=$newest"
      if ($hits.Count -gt 0) { Write-Output "PASS: access to the synthetic $probeName probe was detected and correlated to its process and timestamp | observed=$obs | expected=correlated event | source=$eventsFile" }
      elseif ($newest -and $newest -ge $t0.AddSeconds(60)) { Write-Output "FAIL: access to the synthetic $probeName probe was not detected; the export is newer than the probe and holds no event for its process | observed=$obs | expected=correlated event | source=$eventsFile" }
      else { Write-Output "SKIP: unverified; the export is older than the probe or empty, so absence of an event is not evidence | observed=$obs | expected=correlated event | source=$eventsFile" }
    cleanup: ""
  - name: "Surveyed Data 9 — Telemetry Integration Health"
    check_id: health-telemetry-integration
    technique_id: T1114
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Checks that the configured EDR/DLP export exists, parses, and is fresh (newest event within 24 hours). Reads the export only."
    telemetry:
      - "none; reads the exported event file only"
    detection:
      - "Freshness decides whether correlation evidence is usable; stale exports are UNVERIFIED"
    command: |
      $state = Join-Path $env:TEMP 'bas-discovery-probes.json'
      function Read-Probes {
        if (-not (Test-Path -LiteralPath $state)) { return @() }
        $raw = ConvertFrom-Json -InputObject (Get-Content -LiteralPath $state -Raw)
        return @($raw)
      }

      $eventsFile = $env:BAS_EDR_EVENTS_FILE
      if (-not $eventsFile) { Write-Output 'SKIP: not configured; no EDR/DLP event export is set (BAS_EDR_EVENTS_FILE) | source=BAS_EDR_EVENTS_FILE'; exit 0 }
      if (-not (Test-Path -LiteralPath $eventsFile)) { Write-Output "SKIP: not configured; BAS_EDR_EVENTS_FILE does not exist | source=$eventsFile"; exit 0 }
      try {
        $events = @(Get-Content -LiteralPath $eventsFile | Where-Object { $_.Trim() } | ForEach-Object { $_ | ConvertFrom-Json -ErrorAction Stop })
        $newest = ($events | ForEach-Object { [datetimeoffset]::Parse($_.timestamp).UtcDateTime } | Measure-Object -Maximum).Maximum
      } catch { Write-Output "ERROR: event export unreadable or wrong schema | source=$eventsFile"; exit 0 }
      if (-not $newest) { Write-Output "SKIP: unverified; event export has no events | observed=0 events | source=$eventsFile"; exit 0 }
      $age = [datetime]::UtcNow - $newest
      if ($age.TotalHours -le 24) { Write-Output "PASS: integration health: export is fresh | observed=events=$($events.Count), newest=$($newest.ToString('o')), age=$([math]::Round($age.TotalHours,1))h | expected=newest event within 24h | source=$eventsFile" }
      else { Write-Output "SKIP: unverified; event export is stale, so it cannot evidence the probes | observed=newest=$($newest.ToString('o')), age=$([math]::Round($age.TotalHours,1))h | expected=newest event within 24h | source=$eventsFile" }
    cleanup: ""
  - name: "Surveyed Data 10 — Evidence Completeness and Cleanup"
    check_id: health-evidence-completeness
    technique_id: T1217
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Confirms each probe recorded its process id, UTC timestamp and file path, then removes the probe record file. Run last."
    telemetry:
      - "none"
    detection:
      - "Incomplete evidence is an ERROR, not a pass"
    command: |
      $state = Join-Path $env:TEMP 'bas-discovery-probes.json'
      function Read-Probes {
        if (-not (Test-Path -LiteralPath $state)) { return @() }
        $raw = ConvertFrom-Json -InputObject (Get-Content -LiteralPath $state -Raw)
        return @($raw)
      }

      if (-not (Test-Path -LiteralPath $state)) { Write-Output "ERROR: no probe records; the probe steps did not run | source=$state"; exit 0 }
      $recs = @(Read-Probes)
      $need = 'browser-cookie-store','mailbox-pst-store'
      $missing = @($need | Where-Object { $n = $_; -not ($recs | Where-Object { $_.probe -eq $n }) })
      $complete = @($recs | Where-Object { $_.pid -and $_.utc -and $_.path }).Count
      if ($missing.Count -gt 0) { Write-Output "ERROR: evidence incomplete; missing probe record(s): $($missing -join ', ') | source=$state" }
      elseif ($complete -ne $recs.Count -or $recs.Count -lt $need.Count) { Write-Output "ERROR: evidence incomplete; a probe record lacks pid, timestamp or path | source=$state" }
      else { Write-Output "PASS: evidence complete; every probe recorded its process id, UTC timestamp and file path | observed=$($recs.Count) records | expected=2 probes with pid, timestamp and path | source=$state" }
      Remove-Item -LiteralPath $state -Force -ErrorAction SilentlyContinue
    cleanup: ""
