id: dbsim-db02-11-service-account
product_line: dbsim
name: Database Security Simulation DB-02-11 - Privileged Service Account Abuse
description: >
  Lists the table privileges held by the probe's own service account dbsim_test
  and compares them with the stated grant policy. A service account holding more
  than its policy allows is a violation. Graded only when a policy is configured;
  without one the step is ERROR. ATT&CK T1087 Account Discovery.
author: Audspect Research
executable: true
tags:
  - dbsim
  - database
  - privileges
  - service-account
  - read-only
  - mitre-attack
mitre_phases:
  - discovery

steps:
  - name: "DB-02-11 Service account grants (T1087)"
    technique_id: T1087
    executor: dbprobe
    db_target: lab-db
    db_probe: read_grants
    db_params:
      role: dbsim_test
    risk: low
    blast_radius: "read-only privilege catalog query for one service account; no state changed"
    reversible: true
