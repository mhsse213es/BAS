    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: medium
    blast_radius: "SKIPs with an explicit reason when $env:BAS_APT29_TARGET_HOST is unset. When set: creates a Manual-start (never started) benign service on the target via sc.exe \\\\<target> create, confirms it, then deletes it. ERRORs (not SKIP) if the host is reachable but access is denied -- distinguishing 'no target configured' from 'target configured but denied'. APT29/PsExec-style actors use remote service creation for lateral code execution. Generates Security EID 4697 on the target."
    reversible: true
    telemetry:
      - "Security EID 4697 (service installed) on the target host"
    detection:
      - "EDR/SIEM: remote service creation via sc.exe against a domain host  -  Sigma rule service_installation_win_remote.yml"
    command: |
