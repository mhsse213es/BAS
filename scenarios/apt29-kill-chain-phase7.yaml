  # ---------------------------------------------------------------------------
  # Stage 27 — HTTPS C2 Beacon Simulation (T1071.001)
  # ---------------------------------------------------------------------------
  - name: "APT29 Stage 27 — HTTPS C2 Beacon Simulation (T1071.001)"
    technique_id: T1071.001
    detection_profiles: [windows_apt29_c2_exfil]
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 20
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    blast_radius: "Issues a real HTTPS GET to a fixed, BAS-owned, RFC-6761-guaranteed-non-routable .invalid domain (same safety pattern as Stage 5's DNS beacon). DNS resolution fails before any TLS handshake, so no real C2 channel is ever established. Generates Sysmon EID 22 (DNS query) and EID 3 (network connection attempt) if resolution briefly succeeds at the resolver level before NXDOMAIN."
    reversible: true
    telemetry:
      - "Sysmon EID 22: DNS query for bas-sim-apt29-<runid>.invalid"
      - "Sysmon EID 1: powershell.exe issuing Invoke-WebRequest"
    detection:
      - "SIEM: HTTPS requests to a .invalid TLD  -  these should never succeed; flag at SIEM / proxy"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $runId = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0,[Math]::Min(8,$env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 0x7FFFFFFF) }
      $beaconUrl = "https://bas-sim-apt29-$runId.invalid/beacon"
      $succeeded = $false
      try { $null = Invoke-WebRequest -Uri $beaconUrl -TimeoutSec 5 -ErrorAction Stop; $succeeded = $true } catch { $succeeded = $false }
      Write-Output "EXEC T1071.001: HTTPS C2 beacon simulation GET $beaconUrl. succeeded=$succeeded (expected: false  -  RFC6761 .invalid never resolves). No real C2 channel exists. Sysmon EID 22 expected. [BAS-SIM-APT29-S27]"
      if ($succeeded) {
        Write-Output "FAIL: HTTPS request to a .invalid domain succeeded  -  DNS/proxy filtering is NOT in place. A real APT29 C2 domain could succeed the same way."
      } else {
        Write-Output "PASS: .invalid domain request failed to resolve/connect as expected. DNS/network telemetry generated for SIEM verification without a real C2 channel. [BAS-SIM-APT29-S27]"
      }
    cleanup: ""

  # ---------------------------------------------------------------------------
  # Stage 28 — DNS Periodic Beacon Detection (T1071.004)
  # ---------------------------------------------------------------------------
  - name: "APT29 Stage 28 — DNS Periodic Beacon Detection (T1071.004)"
    technique_id: T1071.004
    detection_profiles: [windows_dns_c2]
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    blast_radius: "Distinct from Stage 5's single-shot DNS beacon: issues the same .invalid-domain nslookup pattern 3 times at a fixed 2-second interval to generate a periodicity signal a SIEM beacon-detection rule could alert on. No real C2 channel; RFC 6761 guarantees NXDOMAIN. Generates Sysmon EID 22 x3."
    reversible: true
    telemetry:
      - "Sysmon EID 22 x3: periodic DNS queries to bas-sim-apt29-<runid>-N.invalid at a fixed interval"
    detection:
      - "SIEM: fixed-interval DNS queries to the same base domain from one host  -  beaconing-periodicity detection, distinct from Stage 5's single-query signal"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $runId = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0,[Math]::Min(8,$env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 0x7FFFFFFF) }
      $anyResolved = $false
      $allNx = $true
      $anyTimedOut = $false
      for ($i = 1; $i -le 3; $i++) {
        $beaconDomain = "bas-sim-apt29-$runId-$i.invalid"
        $nsOut = & nslookup.exe $beaconDomain 2>&1 | Out-String
        if ($nsOut -match ('Name:\s+' + [regex]::Escape($beaconDomain))) { $anyResolved = $true }
        if ($nsOut -notmatch "Non-existent domain") { $allNx = $false }
        if ($nsOut -match 'timed out|no servers could be reached') { $anyTimedOut = $true }
        if ($i -lt 3) { Start-Sleep -Seconds 2 }
      }
      Write-Output "EXEC T1071.004: periodic DNS beacon simulation sent 3 nslookup queries at a 2s interval to bas-sim-apt29-$runId-*.invalid. any_resolved=$anyResolved (expected: false). Sysmon EID 22 x3 expected  -  distinct periodicity signal from Stage 5's single query. [BAS-SIM-APT29-S28]"
      if ($anyTimedOut -and -not $anyResolved) {
        Write-Output "ERROR: DNS server timed out during the periodic beacon; NXDOMAIN could not be judged. [BAS-SIM-APT29-S28]"
      } elseif (-not $allNx -and -not $anyResolved) {
        Write-Output "ERROR: at least one periodic query returned neither an answer nor NXDOMAIN, so NXDOMAIN was not observed for every query. [BAS-SIM-APT29-S28]"
      } elseif ($anyResolved) {
        Write-Output "FAIL: A .invalid domain resolved during the periodic beacon  -  DNS RPZ/NXDOMAIN filtering is NOT in place."
      } else {
        Write-Output "PASS: All .invalid domains returned NXDOMAIN as expected. Periodic DNS telemetry generated for SIEM beacon-detection verification. [BAS-SIM-APT29-S28]"
      }
    cleanup: ""

