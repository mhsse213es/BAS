  # ---------------------------------------------------------------------------
  - name: "APT29 Stage 24 — SMB Administrative Share Access (T1021.002)"
    technique_id: T1021.002
    detection_profiles: [windows_apt29_lateral_movement]
    framework: custom
    executor: powershell
    requires_priv: admin
    timeout_sec: 20
    fidelity: telemetry-safe
    production_safe: true
    risk: medium
    blast_radius: "SKIPs with an explicit reason when $env:BAS_APT29_TARGET_HOST is unset -- never silently passes. When set: checks existence of \\\\<target>\\C$ via Test-Path only; never copies a file to or from the share. APT29 uses admin shares for lateral file staging. Generates Security EID 5140/5145 on the target."
    reversible: true
    telemetry:
      - "Security EID 5140 (network share accessed) / 5145 (detailed file share access) on the target host, for \\\\<target>\\C$"
    detection:
      - "EDR/SIEM: C$ admin-share access from a workstation account  -  Sigma rule net_share_access_win_admin_share.yml"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $target = $env:BAS_APT29_TARGET_HOST
      if ([string]::IsNullOrWhiteSpace($target)) {
        Write-Output "SKIP: APT29 Stage 24 (SMB Administrative Share Access) not run  -  no remote target host configured (`$env:BAS_APT29_TARGET_HOST unset). This step requires a second reachable host; configure the env var to run it. [BAS-SIM-APT29-S24]"
      } else {
        $accessible = Test-Path "\\$target\C$"
        $reach445 = Test-NetConnection -ComputerName $target -Port 445 -InformationLevel Quiet -WarningAction SilentlyContinue
        Write-Output "EXEC T1021.002: SMB admin-share existence check against \\$target\C$ ran. accessible=$accessible. No file was copied. Security EID 5140/5145 expected on the target. [BAS-SIM-APT29-S24]"
        if ($accessible) {
          Write-Output "FAIL: Admin-share access succeeded unimpeded. SIEM should alert on C$ access from a workstation account outside normal admin activity."
        } elseif ($reach445) {
          Write-Output "PASS: admin-share access was denied while SMB 445 is reachable. Access control is the likely cause; a misconfiguration would look the same, so this is not independently proven. [BAS-SIM-APT29-S24]"
        } else {
          Write-Output "ERROR: target $target is not reachable on SMB 445, so the admin-share check did not run. [BAS-SIM-APT29-S24]"
        }
      }
    cleanup: ""

