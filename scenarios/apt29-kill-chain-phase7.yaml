      - "Sysmon EID 11: synthetic marker file created under $env:TEMP"
      - "Sysmon EID 1: Get-ChildItem -Recurse scoped to $env:TEMP"
    detection:
      - "EDR: recursive file search for sensitive-sounding filenames from a scripting engine  -  Sigma rule file_event_win_sensitive_file_discovery.yml"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $markerFile = Join-Path $env:TEMP 'BAS-SIM-APT29-S29-marker.txt'
      Set-Content -Path $markerFile -Value '[BAS-SIM] synthetic sensitive-file marker  -  not a real document' -Force
      $found = @(Get-ChildItem -Path $env:TEMP -Recurse -Filter '*BAS-SIM-APT29-S29*' -ErrorAction SilentlyContinue)
      $located = ($found.Count -gt 0)
      Remove-Item $markerFile -Force -ErrorAction SilentlyContinue
      Write-Output "EXEC T1005: synthetic sensitive-file discovery, marker created and located=$located, then deleted. Scoped to `$env:TEMP only  -  no real user file was touched. Sysmon EID 11 expected. [BAS-SIM-APT29-S29]"
      if ($located) {
        Write-Output "FAIL: Sensitive-file discovery/collection pattern ran unimpeded. EDR should flag recursive searches for sensitive-sounding filenames outside normal application behavior."
      } else {
        Write-Output "PASS: File discovery blocked or the marker was not found. [BAS-SIM-APT29-S29]"
      }
    cleanup: |
      Remove-Item (Join-Path $env:TEMP 'BAS-SIM-APT29-S29-marker.txt') -Force -ErrorAction SilentlyContinue

