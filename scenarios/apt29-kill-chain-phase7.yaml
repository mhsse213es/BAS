    blast_radius: "Creates ONE benign synthetic file under $env:TEMP containing only a literal [BAS-SIM] marker string (never touches any real user file), searches for it scoped to $env:TEMP only, confirms it is found, then deletes it. Generates Sysmon EID 11 (file create) + file-search process telemetry."
    reversible: true
