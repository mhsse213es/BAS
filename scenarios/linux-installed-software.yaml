id: linux-installed-software
product_line: common
name: Linux Installed Software Inventory
local_check: true
description: >
  Enumerates installed Debian packages as Name|Version pairs, consumed
  server-side by the Application Risk category to flag known EOL/high-risk
  software.
supported_os: [linux]
tags:
  - application-risk
  - linux
  - inventory

steps:
  - name: "Installed Software Inventory"
    check_id: linux-installed-software
    technique_id: T1082
    framework: custom
    executor: local
    max_output_bytes: 1048576
    command: |
      dpkg-query -W -f='${Package}|${Version}|${Architecture}|${db:Status-Status}\n' 2>/dev/null
      echo "SKIP: software inventory only; it lists packages and has no control outcome to score. Not scored."
    timeout_sec: 30
