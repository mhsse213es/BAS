  - id: apt29-k2
    name: "APT29 C2 2 - Generated Name Burst (T1568)"
    technique_id: T1568
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 120
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Resolves twelve generated base32 names under .invalid in quick succession from the PowerShell process. Queries go to the host resolver and cannot resolve."
    telemetry:
      - "Sysmon EID 22: DNS queries for the generated names"
      - "DNS-Client EID 3008 where enabled"
    detection:
      - "DNS analytics: burst of high-entropy NXDOMAIN lookups from one process"
    command: |
      $script:A29Run = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0, [Math]::Min(8, $env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 2147483647) }
      $script:A29Extra = @()
      function Get-A29Control {
      $r = @{ Build = [Environment]::OSVersion.Version.Build; DefenderReadable = $false; DefenderOn = $false; AsrBlock = 0; AppLocker = 'NotConfigured' }
      try { $s = Get-MpComputerStatus -ErrorAction Stop; $r.DefenderReadable = $true; $r.DefenderOn = ([bool]$s.RealTimeProtectionEnabled -and [bool]$s.AntivirusEnabled) } catch {}
