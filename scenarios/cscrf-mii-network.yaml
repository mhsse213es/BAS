      $legacy = @(21, 23)
      $hit = @($listeners | Where-Object { $legacy -contains $_.LocalPort -and ($_.LocalAddress -eq '0.0.0.0' -or $_.LocalAddress -eq '::') } | ForEach-Object { "$($_.LocalAddress):$($_.LocalPort)" })
