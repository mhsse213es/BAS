id: "cscrf-mii-network"
product_line: common
name: "CSCRF-MII Network and Infrastructure Control Validation (P0)"
description: >
  Internal control-validation checks for network and infrastructure controls. Verdicts are internal
  control references (CSCRF-NET-*), not SEBI clause identifiers. Read-only checks run anywhere. Probes that
  reach another host run only when an explicit lab variable names the target, and SKIP otherwise.
  No firewall rule is changed by this pack. Passing a check does not establish CSCRF compliance.
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - cscrf-mii
  - network
  - p0
mitre_phases:
  - discovery
  - defense-evasion

steps:

  # -------------------------------------------------------------------------
  - id: net-01
    name: "Lab Subnet Management-Port Reachability (T1046, internal ref CSCRF-NET-01)"
    technique_id: T1046
    action_key: cscrf_net_subnet_reachability
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 240
    fidelity: telemetry-safe
    production_safe: false
    risk: low
    reversible: true
    blast_radius: "TCP connection attempts to up to 64 hosts on one lab subnet, three management ports each. Runs only when BAS_LAB_SUBNET is set to a private /26-/30."
    telemetry:
      - "Outbound TCP connection attempts"
    detection:
      - "Port scan detection from the probing host"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $script:CgRun = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0, [Math]::Min(8, $env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 2147483647) }
      function Write-CgVerdict { param([string]$Outcome, [string]$Reason, [string]$Id)
      $p = 'SKIP'
      if ($Outcome -eq 'pass') { $p = 'PASS' } elseif ($Outcome -eq 'fail') { $p = 'FAIL' } elseif ($Outcome -eq 'error') { $p = 'ERROR' }
      Write-Output ($p + ': ' + $Reason + ' [BAS-NET-' + $Id + ']')
      }
      function Complete-CgStep { param($Res, [string]$Id) Write-CgVerdict $Res.Outcome $Res.Reason $Id; exit 0 }
      function Test-CgPrivateIPv4 { param([string]$Ip)
      $addr = $null
      if (-not [System.Net.IPAddress]::TryParse($Ip, [ref]$addr)) { return $false }
      if ($addr.AddressFamily -ne [System.Net.Sockets.AddressFamily]::InterNetwork) { return $false }
      $b = $addr.GetAddressBytes()
      return ($b[0] -eq 10) -or ($b[0] -eq 172 -and $b[1] -ge 16 -and $b[1] -le 31) -or ($b[0] -eq 192 -and $b[1] -eq 168)
      }
      function Test-CgTcpPort { param([string]$Ip, [int]$Port, [int]$TimeoutMs = 1500)
      $c = New-Object System.Net.Sockets.TcpClient
      try {
      $ar = $c.BeginConnect($Ip, $Port, $null, $null)
      if ($ar.AsyncWaitHandle.WaitOne($TimeoutMs) -and $c.Connected) { $c.EndConnect($ar); return 'open' }
      return 'closed'
      } catch { return 'closed' } finally { $c.Close() }
      }
      $cidr = $env:BAS_LAB_SUBNET
      if (-not $cidr) { Complete-CgStep @{ Outcome = 'skip'; Reason = 'BAS_LAB_SUBNET not set; no subnet probed [CSCRF-NET-01]' } 'net-01' }
      $parts = $cidr -split '/'
      $bits = 0
      if ($parts.Count -ne 2 -or -not [int]::TryParse($parts[1], [ref]$bits) -or -not (Test-CgPrivateIPv4 $parts[0]) -or $bits -lt 26 -or $bits -gt 30) {
      Complete-CgStep @{ Outcome = 'skip'; Reason = 'BAS_LAB_SUBNET must be a private IPv4 /26 to /30 (at most 62 hosts) [CSCRF-NET-01]' } 'net-01'
      }
      $base = [System.Net.IPAddress]::Parse($parts[0]).GetAddressBytes()
      $hosts = 1..([int]([Math]::Pow(2, 32 - $bits)) - 2)
      $exposed = @()
      $ports = @(445, 3389, 5985)
      foreach ($h in $hosts) {
      $b = $base.Clone(); $b[3] = [byte](($base[3] -band (256 - [int][Math]::Pow(2, 32 - $bits))) + $h)
      $ip = ($b -join '.')
      foreach ($p in $ports) { if ((Test-CgTcpPort $ip $p 300) -eq 'open') { $exposed += "$ip`:$p" } }
      }
      if ($exposed.Count -gt 0) {
      Complete-CgStep @{ Outcome = 'fail'; Reason = ('management port(s) reachable from lab subnet: ' + ($exposed -join ', ') + ' [CSCRF-NET-01]') } 'net-01'
      }
      Complete-CgStep @{ Outcome = 'pass'; Reason = 'no SMB, RDP or WinRM listener reachable from the lab subnet [CSCRF-NET-01]' } 'net-01'
    cleanup: |
      $ErrorActionPreference = 'SilentlyContinue'
      $script:CgRun = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0, [Math]::Min(8, $env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 2147483647) }
      function Write-CgVerdict { param([string]$Outcome, [string]$Reason, [string]$Id)
      $p = 'SKIP'
      if ($Outcome -eq 'pass') { $p = 'PASS' } elseif ($Outcome -eq 'fail') { $p = 'FAIL' } elseif ($Outcome -eq 'error') { $p = 'ERROR' }
      Write-Output ($p + ': ' + $Reason + ' [BAS-NET-' + $Id + ']')
      }
      function Complete-CgStep { param($Res, [string]$Id) Write-CgVerdict $Res.Outcome $Res.Reason $Id; exit 0 }
      function Test-CgPrivateIPv4 { param([string]$Ip)
      $addr = $null
      if (-not [System.Net.IPAddress]::TryParse($Ip, [ref]$addr)) { return $false }
      if ($addr.AddressFamily -ne [System.Net.Sockets.AddressFamily]::InterNetwork) { return $false }
      $b = $addr.GetAddressBytes()
      return ($b[0] -eq 10) -or ($b[0] -eq 172 -and $b[1] -ge 16 -and $b[1] -le 31) -or ($b[0] -eq 192 -and $b[1] -eq 168)
      }
      function Test-CgTcpPort { param([string]$Ip, [int]$Port, [int]$TimeoutMs = 1500)
      $c = New-Object System.Net.Sockets.TcpClient
      try {
      $ar = $c.BeginConnect($Ip, $Port, $null, $null)
      if ($ar.AsyncWaitHandle.WaitOne($TimeoutMs) -and $c.Connected) { $c.EndConnect($ar); return 'open' }
      return 'closed'
      } catch { return 'closed' } finally { $c.Close() }
      }
      Write-Output 'PASS: Cleanup complete'
      exit 0

