id: recon-dns-enumeration-sim
product_line: killchain
name: Reconnaissance -- DNS Record Enumeration Simulation (T1596.001)
description: >
  Simulates an operator enumerating DNS records for a target's subdomain names. All names are
  synthetic and use the reserved .invalid top-level domain, which never resolves. The queries
  still leave resolver and EDR telemetry, which is what this step tests.

  SAFETY: queries are limited to *.invalid names. No real domain is queried. Read-only.

  Grounded in MITRE ATT&CK T1596.001 (Search Open Technical Databases: DNS/Passive DNS).
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - recon
  - t1596
mitre_phases:
  - reconnaissance
live_policy:
  block_on_domain_controller: false
  require_dc_reachable: false
  max_spray_attempts: 0
  spray_account_allowlist: []
  execution_window: ""
steps:
  - name: "Recon -- DNS Record Enumeration (T1596.001)"
    technique_id: T1596.001
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: lab-only
    production_safe: true
    risk: low
    blast_radius: "Issues DNS lookups for synthetic *.invalid names. Those names cannot resolve, so no real host is contacted."
    reversible: true
    telemetry:
      - "Sysmon EID 22 (DNS query) for each lookup"
      - "Resolver query log, if the resolver logs queries"
    detection:
      - "DNS analytics: burst of queries for sequential subdomain names from one host"
    last_reviewed: "2026-11-23"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $labels = 'www','mail','vpn','portal','api','sftp','swift-gw','ledger'
      $nx = 0
      foreach ($l in $labels) {
        $name = "$l.bas-fixture.invalid"
        if (-not (Resolve-DnsName -Name $name -Type A -QuickTimeout -ErrorAction SilentlyContinue)) { $nx++ }
      }
      Write-Output "EXEC recon T1596.001: $($labels.Count) synthetic name(s) queried, $nx did not resolve. [BAS-SIM-RECON-DNS]"
