id: "cobalt-group-bfsi-access-execution"
product_line: killchain
name: "Cobalt Group BFSI - Initial Access and Execution Gap (Phase 2)"
description: >
  Adds BFSI-specific coverage for two Phase 2 techniques that had only one scenario each in the
  library: valid local account logon (T1078.002) and Windows command shell execution (T1059.003).
  The account logon uses a synthetic local account with a per-run random password, created and
  removed within the step pair. The command shell step runs a harmless echo command and checks its
  output for a marker. No real account or domain is touched.
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - cobalt-group
  - bfsi
  - initial-access
  - execution
  - phase2
mitre_phases:
  - initial-access
  - execution

steps:

  # -------------------------------------------------------------------------
  - id: acc-01
    name: "Initial Access - Valid Local Account Logon (Custom)"
    technique_id: T1078.002
    action_key: access_valid_account_logon
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 90
    fidelity: telemetry-safe
    production_safe: false
    risk: medium
    reversible: true
    blast_radius: "Creates one synthetic local account with a per-run random password, performs one logon attempt with it, and removes the account in undo. Undo tolerates the account already being absent."
    telemetry:
      - "Local account creation"
      - "Logon event for the synthetic account"
    detection:
      - "Valid account use detection (logon by a newly created local account)"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $script:CgRun = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0, [Math]::Min(8, $env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 2147483647) }
      function Write-CgVerdict { param([string]$Outcome, [string]$Reason, [string]$Id)
      $p = 'SKIP'
      if ($Outcome -eq 'pass') { $p = 'PASS' } elseif ($Outcome -eq 'fail') { $p = 'FAIL' } elseif ($Outcome -eq 'error') { $p = 'ERROR' }
      Write-Output ($p + ': ' + $Reason + ' [BAS-ACC-' + $Id + ']')
      }
      function Complete-CgStep { param($Res, [string]$Id) Write-CgVerdict $Res.Outcome $Res.Reason $Id; exit 0 }
      function Get-CgUndoPath { param([string]$Id) return (Join-Path $env:TEMP ('bas-cg-undo\' + $Id + '.json')) }
      function New-CgUndoRecord { param([string]$Id, $Data)
      $p = Get-CgUndoPath $Id
      New-Item -ItemType Directory -Force -Path (Split-Path -Parent $p) | Out-Null
      $fs = [IO.File]::Open($p, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write)
      try { $b = [Text.Encoding]::ASCII.GetBytes(($Data | ConvertTo-Json -Depth 6 -Compress)); $fs.Write($b, 0, $b.Length) } finally { $fs.Close() }
      }
      function Read-CgUndoRecord { param([string]$Id)
      $p = Get-CgUndoPath $Id
      if (-not (Test-Path -LiteralPath $p)) { return $null }
      try { return (Get-Content -LiteralPath $p -Raw | ConvertFrom-Json) } catch { return 'unreadable' }
      }
      function Remove-CgUndoRecord { param([string]$Id) Remove-Item -LiteralPath (Get-CgUndoPath $Id) -Force -ErrorAction SilentlyContinue }
      function New-CgAccessAccountName { return 'bas-acc-' + $script:CgRun }
      $accountName = New-CgAccessAccountName
      $undo_data = @{ scenario = 'acc-01'; accountName = $accountName }
      try { New-CgUndoRecord 'acc-01' $undo_data } catch { Complete-CgStep @{ Outcome = 'error'; Reason = 'Undo record creation failed' } 'acc-01' }
      $plain = [Guid]::NewGuid().ToString('N') + 'Aa1!'
      try {
      $secure = ConvertTo-SecureString -String $plain -AsPlainText -Force
      New-LocalUser -Name $accountName -Password $secure -AccountNeverExpires -PasswordNeverExpires -ErrorAction Stop | Out-Null
      } catch {
      Complete-CgStep @{ Outcome = 'error'; Reason = "Could not create synthetic account: $($_.Exception.Message)" } 'acc-01'
      }
      Add-Type -Namespace BasAcc -Name Logon -MemberDefinition @'
      [System.Runtime.InteropServices.DllImport("advapi32.dll", SetLastError = true, CharSet = System.Runtime.InteropServices.CharSet.Unicode)]
      public static extern bool LogonUser(string user, string domain, string password, int logonType, int logonProvider, out System.IntPtr token);
      [System.Runtime.InteropServices.DllImport("kernel32.dll", SetLastError = true)]
      public static extern bool CloseHandle(System.IntPtr handle);
      '@
      $token = [IntPtr]::Zero
      $ok = [BasAcc.Logon]::LogonUser($accountName, $env:COMPUTERNAME, $plain, 3, 0, [ref]$token)
      if ($ok) { [BasAcc.Logon]::CloseHandle($token) | Out-Null }
      if ($ok) {
      $res = @{ Outcome = 'pass'; Reason = 'Synthetic local account logon succeeded with its own credentials' }
      } else {
      $err = [Runtime.InteropServices.Marshal]::GetLastWin32Error()
      $res = @{ Outcome = 'fail'; Reason = "Logon with the synthetic account was refused (Win32 error $err)" }
      }
      Complete-CgStep $res 'acc-01'
    cleanup: |
      $ErrorActionPreference = 'SilentlyContinue'
      $script:CgRun = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0, [Math]::Min(8, $env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 2147483647) }
      function Write-CgVerdict { param([string]$Outcome, [string]$Reason, [string]$Id)
      $p = 'SKIP'
      if ($Outcome -eq 'pass') { $p = 'PASS' } elseif ($Outcome -eq 'fail') { $p = 'FAIL' } elseif ($Outcome -eq 'error') { $p = 'ERROR' }
      Write-Output ($p + ': ' + $Reason + ' [BAS-ACC-' + $Id + ']')
      }
      function Complete-CgStep { param($Res, [string]$Id) Write-CgVerdict $Res.Outcome $Res.Reason $Id; exit 0 }
      function Get-CgUndoPath { param([string]$Id) return (Join-Path $env:TEMP ('bas-cg-undo\' + $Id + '.json')) }
      function New-CgUndoRecord { param([string]$Id, $Data)
      $p = Get-CgUndoPath $Id
      New-Item -ItemType Directory -Force -Path (Split-Path -Parent $p) | Out-Null
      $fs = [IO.File]::Open($p, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write)
      try { $b = [Text.Encoding]::ASCII.GetBytes(($Data | ConvertTo-Json -Depth 6 -Compress)); $fs.Write($b, 0, $b.Length) } finally { $fs.Close() }
      }
      function Read-CgUndoRecord { param([string]$Id)
      $p = Get-CgUndoPath $Id
      if (-not (Test-Path -LiteralPath $p)) { return $null }
      try { return (Get-Content -LiteralPath $p -Raw | ConvertFrom-Json) } catch { return 'unreadable' }
      }
      function Remove-CgUndoRecord { param([string]$Id) Remove-Item -LiteralPath (Get-CgUndoPath $Id) -Force -ErrorAction SilentlyContinue }
      function New-CgAccessAccountName { return 'bas-acc-' + $script:CgRun }
      $rec = Read-CgUndoRecord 'acc-01'
      if ($rec -eq $null -or $rec -eq 'unreadable') { Write-Output 'SKIP: Undo record not found'; exit 0 }
      Remove-LocalUser -Name $rec.accountName -ErrorAction SilentlyContinue
      Remove-CgUndoRecord 'acc-01'
      Write-Output 'PASS: Cleanup complete'
      exit 0

  # -------------------------------------------------------------------------
  - id: exe-01
    name: "Execution - Windows Command Shell (Custom)"
    technique_id: T1059.003
    action_key: exe_command_shell
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: telemetry-safe
    production_safe: false
    risk: low
    reversible: true
    blast_radius: "Runs one harmless echo command through cmd.exe and checks its output for a marker. No state is created."
    telemetry:
      - "cmd.exe process creation with a benign echo command"
    detection:
      - "Command shell execution monitoring"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $script:CgRun = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0, [Math]::Min(8, $env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 2147483647) }
      function Write-CgVerdict { param([string]$Outcome, [string]$Reason, [string]$Id)
      $p = 'SKIP'
      if ($Outcome -eq 'pass') { $p = 'PASS' } elseif ($Outcome -eq 'fail') { $p = 'FAIL' } elseif ($Outcome -eq 'error') { $p = 'ERROR' }
      Write-Output ($p + ': ' + $Reason + ' [BAS-ACC-' + $Id + ']')
      }
      function Complete-CgStep { param($Res, [string]$Id) Write-CgVerdict $Res.Outcome $Res.Reason $Id; exit 0 }
      function Get-CgUndoPath { param([string]$Id) return (Join-Path $env:TEMP ('bas-cg-undo\' + $Id + '.json')) }
      function New-CgUndoRecord { param([string]$Id, $Data)
      $p = Get-CgUndoPath $Id
      New-Item -ItemType Directory -Force -Path (Split-Path -Parent $p) | Out-Null
      $fs = [IO.File]::Open($p, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write)
      try { $b = [Text.Encoding]::ASCII.GetBytes(($Data | ConvertTo-Json -Depth 6 -Compress)); $fs.Write($b, 0, $b.Length) } finally { $fs.Close() }
      }
      function Read-CgUndoRecord { param([string]$Id)
      $p = Get-CgUndoPath $Id
      if (-not (Test-Path -LiteralPath $p)) { return $null }
      try { return (Get-Content -LiteralPath $p -Raw | ConvertFrom-Json) } catch { return 'unreadable' }
      }
      function Remove-CgUndoRecord { param([string]$Id) Remove-Item -LiteralPath (Get-CgUndoPath $Id) -Force -ErrorAction SilentlyContinue }
      function New-CgAccessAccountName { return 'bas-acc-' + $script:CgRun }
      $marker = 'BAS-SIM-EXE-' + $script:CgRun
      $out = & "$env:SystemRoot\System32\cmd.exe" /c "echo $marker" 2>&1
      if (($out | Out-String) -match [regex]::Escape($marker)) {
      $res = @{ Outcome = 'pass'; Reason = 'cmd.exe executed and returned the expected marker' }
      } else {
      $res = @{ Outcome = 'fail'; Reason = 'cmd.exe did not return the expected marker' }
      }
      Complete-CgStep $res 'exe-01'
    cleanup: |
      $ErrorActionPreference = 'SilentlyContinue'
      $script:CgRun = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0, [Math]::Min(8, $env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 2147483647) }
      function Write-CgVerdict { param([string]$Outcome, [string]$Reason, [string]$Id)
      $p = 'SKIP'
      if ($Outcome -eq 'pass') { $p = 'PASS' } elseif ($Outcome -eq 'fail') { $p = 'FAIL' } elseif ($Outcome -eq 'error') { $p = 'ERROR' }
      Write-Output ($p + ': ' + $Reason + ' [BAS-ACC-' + $Id + ']')
      }
      function Complete-CgStep { param($Res, [string]$Id) Write-CgVerdict $Res.Outcome $Res.Reason $Id; exit 0 }
      function Get-CgUndoPath { param([string]$Id) return (Join-Path $env:TEMP ('bas-cg-undo\' + $Id + '.json')) }
      function New-CgUndoRecord { param([string]$Id, $Data)
      $p = Get-CgUndoPath $Id
      New-Item -ItemType Directory -Force -Path (Split-Path -Parent $p) | Out-Null
      $fs = [IO.File]::Open($p, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write)
      try { $b = [Text.Encoding]::ASCII.GetBytes(($Data | ConvertTo-Json -Depth 6 -Compress)); $fs.Write($b, 0, $b.Length) } finally { $fs.Close() }
      }
      function Read-CgUndoRecord { param([string]$Id)
      $p = Get-CgUndoPath $Id
      if (-not (Test-Path -LiteralPath $p)) { return $null }
      try { return (Get-Content -LiteralPath $p -Raw | ConvertFrom-Json) } catch { return 'unreadable' }
      }
      function Remove-CgUndoRecord { param([string]$Id) Remove-Item -LiteralPath (Get-CgUndoPath $Id) -Force -ErrorAction SilentlyContinue }
      function New-CgAccessAccountName { return 'bas-acc-' + $script:CgRun }
      Write-Output 'PASS: Cleanup complete'
      exit 0
