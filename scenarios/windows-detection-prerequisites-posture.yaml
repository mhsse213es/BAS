id: windows-detection-prerequisites-posture
product_line: common
name: Windows Detection Source Prerequisites Posture
description: >
  Read-only posture audit of whether the host produces the Windows event records that
  detection and execution-evidence depend on: process creation auditing (4688), logon
  auditing (4624, 4625), PowerShell script block logging, and the command-line capture
  policy for process creation. A PASS here means the record can be produced; it does
  not prove that any event was collected or forwarded.
local_check: true
executable: false
supported_os: [windows]
tags:
  - detection
  - audit-policy
  - posture
  - windows
  - read-only
contract:
  objective: Confirm the host records the process and logon events that detection and execution evidence depend on.
  prerequisites:
    os: Windows Server 2019 or later, Windows 10 or later
    product: Windows advanced audit policy (auditpol), PowerShell operational logging
    permissions: local administrator read access to audit policy and policy registry keys
    telemetry: none required; this scenario reads the policy that produces the records
  variants:
    baseline: current audit policy and logging configuration
    variation: not applicable; single-state read
    negative_controls: an unset command-line capture policy is reported as SKIP, not FAIL, because the value name is not confirmed on all builds
  expected_prevention:
    control: not applicable; this scenario measures recording, not prevention
    authoritative_proof: not applicable
  expected_detection:
    observables: the presence of the audit configuration that produces 4688 and 4624 records
    telemetry_sources: this scenario's own output; the Security event log once the policy is applied
  response_validation:
    alert_to_incident: not evaluated by this scenario
    containment_check: not evaluated
  evidence_contract:
    required: auditpol inclusion setting for each subcategory, registry values read, host identifier, timestamp
    identifiers: audit subcategory GUID, registry value path
    missing_data_is: an unreadable policy is SKIP for that check, never PASS; a missing audit setting is FAIL and makes execution evidence from that source NOT_TESTED
  cleanup_recovery:
    artifacts_removed: none; the scenario writes nothing
    access_revocation_verified: not applicable
  remediation_retest:
    change: client enables the audit subcategory or the logging policy through group policy
    retest: the same scenario must return PASS for the changed check
  limitations:
    - does not confirm events reach the SIEM; forwarding is a separate check
    - command-line capture value name is unconfirmed on the build host, so that check is SKIP until confirmed
    - group policy overrides are read as effective state only where auditpol reports them
steps:
  - name: "Process creation auditing (Event 4688) includes success"
    check_id: windows-detection-audit-process-creation
    technique_id: T1059
    framework: custom
    executor: local
    command: >-
      $r = auditpol /get /subcategory:'{0CCE922B-69AE-11D9-BED3-505054503030}' /r | ConvertFrom-Csv;
      $v = [string]$r.'Inclusion Setting';
      if ($v -match 'Success') { Write-Output ('PASS: process creation auditing is ' + $v) }
      else { Write-Output ('FAIL: process creation auditing is ' + $v + '; Event 4688 is not produced for process execution') }
    timeout_sec: 30

  - name: "Logon auditing (Event 4624, 4625) includes success and failure"
    check_id: windows-detection-audit-logon
    technique_id: T1078
    framework: custom
    executor: local
    command: >-
      $r = auditpol /get /subcategory:'{0CCE9215-69AE-11D9-BED3-505054503030}' /r | ConvertFrom-Csv;
      $v = [string]$r.'Inclusion Setting';
      if ($v -match 'Success' -and $v -match 'Failure') { Write-Output ('PASS: logon auditing is ' + $v) }
      else { Write-Output ('FAIL: logon auditing is ' + $v + '; Event 4624 or 4625 is incomplete') }
    timeout_sec: 30

  - name: "PowerShell script block logging enabled"
    check_id: windows-detection-powershell-scriptblock
    technique_id: T1059.001
    framework: custom
    executor: local
    command: >-
      $v = (Get-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging' -ErrorAction SilentlyContinue).EnableScriptBlockLogging;
      if ($v -eq 1) { Write-Output 'PASS: PowerShell script block logging is enabled' }
      else { Write-Output 'FAIL: PowerShell script block logging is not enabled by policy' }
    timeout_sec: 30

  - name: "Command-line capture for process creation"
    check_id: windows-detection-cmdline-capture
    technique_id: T1059
    framework: custom
    executor: local
    command: >-
      $v = (Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Policies\System\Audit' -ErrorAction SilentlyContinue).ProcessCreationIncludeCmdLine_Enabled;
      if ($v -eq 1) { Write-Output 'PASS: command-line capture for process creation is enabled' }
      elseif ($null -eq $v) { Write-Output 'SKIP: command-line capture value is not set; the value name is not confirmed on all builds' }
      else { Write-Output ('FAIL: command-line capture for process creation is set to ' + $v) }
    timeout_sec: 30
