id: dbsim-db02-09-cross-schema-access
product_line: dbsim
name: Database Security Simulation DB-02-09 - Cross-Schema Access Abuse
description: >
  Lists the table privileges held by dbsim_lab across every schema, including the
  audit schema, and compares them with the stated policy. Access to a schema the
  policy does not name is a cross-schema violation. Graded only when a policy is
  configured for the target; without one the step is ERROR. ATT&CK T1087 Account Discovery.
author: Audspect Research
executable: true
tags:
  - dbsim
  - database
  - privileges
  - cross-schema
  - read-only
  - mitre-attack
mitre_phases:
  - discovery

steps:
  - name: "DB-02-09 Cross-schema access (T1087)"
    technique_id: T1087
    executor: dbprobe
    db_target: lab-db
    db_probe: read_grants
    db_params:
      role: dbsim_lab
    risk: low
    blast_radius: "read-only privilege catalog query for one role across schemas; no state changed"
    telemetry:
      - "PostgreSQL pg_log: the BAS-marked privilege catalog read for role dbsim_lab"
    detection:
      - "SIEM: privilege catalog read spanning several schemas, a discovery signal"
    reversible: true
