id: carbanak-bfsi-smb-admin-share
product_line: killchain
name: Carbanak BFSI SMB Administrative Share Access (Item 19)
description: >
  Checks whether the target host's ADMIN$ share can be reached. Test-Path
  only: no file is written, copied or executed. Skips without a configured
  second host. [BAS-SIM-CARBANAK-S19] tagged. Grounded in MITRE ATT&CK
  T1021.002 (Remote Services: SMB/Windows Admin Shares).
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - carbanak
  - bfsi
  - lateral-movement
  - t1021
mitre_phases:
  - lateral-movement

live_policy:
  block_on_domain_controller: false
  require_dc_reachable: false
  max_spray_attempts: 0
  spray_account_allowlist: []
  execution_window: ""

steps:
  - name: "Carbanak Item 19 -- SMB Administrative Share Access (T1021.002)"
    technique_id: T1021.002
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: lab-only
    production_safe: true
    risk: low
    blast_radius: "One existence check on a single lab host's administrative share. No file is written."
    reversible: true
    telemetry:
      - "Sysmon EID 3 for the SMB connection to the target"
    detection:
      - "SIEM: access to an administrative share of a lab host from a non-administrative process"
    threat_intel_sources:
      - reference: "MITRE ATT&CK -- T1021.002"
        url: "https://attack.mitre.org/techniques/T1021/002/"
    last_reviewed: "2026-11-21"
    family_attribution_confidence: reported
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $target = $env:BAS_CARBANAK_TARGET_HOST
      if (-not $target) { Write-Output "SKIP: Carbanak Item 19 not run -- BAS_CARBANAK_TARGET_HOST unset. This step needs a second lab host."; exit 0 }
      if ($target -notmatch '\.(lab|test)$') { Write-Output "REFUSED: target must be a .lab or .test host label."; exit 1 }
      $r = Test-Path -LiteralPath "\\$target\ADMIN$"
      Write-Output "EXEC 19: ADMIN$ share reachable on the lab target: $r. Access check only; nothing written. [BAS-SIM-CARBANAK-S19]"
    cleanup: ""
