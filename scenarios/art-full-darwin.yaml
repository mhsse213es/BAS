id: art-full-darwin
name: Atomic Red Team  -  Full macOS Sweep
description: >
  Full-depth ATT&CK sweep for macOS endpoints  -  runs EVERY macOS atomic
  test for every technique across the entire seeded Atomic Red Team library
  (some techniques have multiple distinct atomics; all of them run, not
  just one representative per technique). Content is served from the
  platform database (seeded at install), so no network access is needed at
  run time. The orchestrator resolves every bash/sh/zsh atomic for each
  technique and dispatches them as individual steps to the agent.
  Coverage: every macOS atomic test across every macOS-runnable technique.
  Use the Selective macOS Capabilities scenario to run this same full-depth
  expansion against a chosen subset of techniques instead of the whole
  library.
  Note: this is a large run  -  substantially more steps than a
  one-per-technique sweep, so expect a correspondingly longer runtime on a
  single endpoint. An agent runs one scenario at a time; starting another

  ⚠️  TIMEOUT ADVISORY: Several techniques legitimately require >120s on real
  systems. Consider using custom timeouts for slow-running techniques:
    - T1083 (File Discovery): 300s recommended
    - T1087.002 (Domain Account Discovery): 300s recommended
    - T1018 (Remote System Discovery): 300s recommended
    - T1526 (Cloud Infrastructure Discovery): 300s recommended
  Without custom timeouts, these may timeout and be incorrectly scored.
  mid-run is rejected.
author: Audspect Research
executable: true
supported_os: [darwin]
tags:
  - art
  - atomic-red-team
  - full-sweep
  - macos
  - darwin
  - mitre-attack
mitre_phases:
  - initial-access
  - execution
  - persistence
  - privilege-escalation
  - defense-evasion
  - credential-access
  - discovery
  - lateral-movement
  - collection
  - exfiltration
  - impact

# Runs every atomic for every technique from the seeded ART library.
art_all_platform: true
