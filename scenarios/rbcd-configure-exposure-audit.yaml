id: rbcd-configure-exposure-audit
name: RBCD Configure-Surface Exposure Audit
description: >
  Single-stage, read-only Active Directory audit: reports the precondition
  surface for Resource-Based Constrained Delegation (RBCD) abuse (T1069) --
  computer objects whose DACL grants write access
  (GenericAll/GenericWrite/WriteProperty/WriteDacl/WriteOwner) to a
  non-tier-0 principal (who could therefore write
  msDS-AllowedToActOnBehalfOfOtherIdentity), together with a non-zero
  ms-DS-MachineAccountQuota (which lets any domain user create the machine
  account used as the impersonation principal).

  SAFETY: This step only READS computer-object security descriptors and the
  domain's ms-DS-MachineAccountQuota via .NET DirectoryServices. It NEVER
  writes the delegation attribute, creates a machine account, or
  impersonates anyone. It proves only whether the RBCD-configure surface is
  EXPOSED. It is narrower than the delegation audit, which reports
  delegation attributes already SET; this reports the write-ability to set
  them. On a non-domain host it returns a clean SKIP.
  PRODUCTION-SAFE: runs in telemetry mode. Windows domain members only.
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - rbcd
  - active-directory
  - delegation
  - privilege-escalation
  - t1069
  - mitre
mitre_phases:
  - discovery
  - privilege-escalation

live_policy:
  block_on_domain_controller: false
  require_dc_reachable: true
  max_spray_attempts: 0
  spray_account_allowlist: []
  execution_window: ""

steps:

  # ---------------------------------------------------------------------------
  # Stage 1 — RBCD Configure-Surface Exposure Audit (T1069)
  # ---------------------------------------------------------------------------
  - name: "RBCD Stage 1 — RBCD Configure-Surface Exposure Audit (T1069)"
    technique_id: T1069
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Reads computer-object security descriptors and the domain's ms-DS-MachineAccountQuota via System.DirectoryServices (read-only) and reports computers writable by a non-tier-0 principal when the quota is non-zero. Never writes the delegation attribute, creates a machine account, or impersonates anyone. Generates LDAP searches against the DC."
    telemetry:
      - "DC: LDAP read of computer-object security descriptors and the domain ms-DS-MachineAccountQuota — not separately audited by default"
      - "Sysmon EID 1: powershell.exe performing an LDAP computer-DACL enumeration"
    detection:
      - "SIEM: a non-tier-0 principal holds write access over a computer object while ms-DS-MachineAccountQuota is non-zero — RBCD configure-surface exposure IOC"
      - "SIEM: an LDAP enumeration of computer-object security descriptors from a workstation — RBCD reconnaissance IOC"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $findings = @()
      try {
        $rootDSE = [ADSI]"LDAP://RootDSE"
        $domainDN = $rootDSE.defaultNamingContext
        if (-not $domainDN) { throw "no domain" }

        $domain = New-Object System.DirectoryServices.DirectoryEntry("LDAP://$domainDN")
        $maq = [int]($domain.Properties['ms-DS-MachineAccountQuota'].Value)
        $quotaOpen = $maq -gt 0

        $tier0 = @('S-1-5-18','S-1-5-32-544','S-1-5-9','*-512','*-516','*-519','*-518','*-521','*-500','*-517','*-520')
        function Is-Tier0([string]$sid) { foreach ($t in $tier0) { if ($sid -like $t) { return $true } }; return $false }
        $writeRights = [System.DirectoryServices.ActiveDirectoryRights]'GenericAll,GenericWrite,WriteDacl,WriteOwner,WriteProperty'

        $cs = New-Object System.DirectoryServices.DirectorySearcher
        $cs.SearchRoot = New-Object System.DirectoryServices.DirectoryEntry("LDAP://$domainDN")
        $cs.PageSize = 500
        $cs.Filter = "(objectClass=computer)"
        [void]$cs.PropertiesToLoad.Add('samAccountName')
        [void]$cs.PropertiesToLoad.Add('nTSecurityDescriptor')
        [void]$cs.SecurityMasks = [System.DirectoryServices.SecurityMasks]'Dacl,Owner'
        foreach ($res in $cs.FindAll()) {
          $entry = $res.GetDirectoryEntry()
          $name = [string]$res.Properties['samaccountname'][0]
          $rules = $entry.ObjectSecurity.GetAccessRules($true, $true, [System.Security.Principal.SecurityIdentifier])
          foreach ($r in $rules) {
            if ($r.AccessControlType -ne [System.Security.AccessControl.AccessControlType]::Allow) { continue }
            if (Is-Tier0 $r.IdentityReference.Value) { continue }
            if (($r.ActiveDirectoryRights -band $writeRights) -ne 0) { $findings += "$name (writable by $($r.IdentityReference.Value))"; break }
          }
        }
        $count = $findings.Count
      } catch {
        $count = -1
      }
      if ($count -lt 0) {
        Write-Output "SKIP: RBCD configure-surface audit unavailable — host is not domain-joined or the DC is unreachable. [BAS-SIM-RBCD-S1]"
      } elseif ($count -eq 0 -or -not $quotaOpen) {
        if (-not $quotaOpen) {
          Write-Output "PASS: ms-DS-MachineAccountQuota is 0 — ordinary users cannot create the machine account RBCD needs as its impersonation principal, so the configure surface is not practically reachable from this context. [BAS-SIM-RBCD-S1]"
        } else {
          Write-Output "PASS: no computer object is writable by a non-tier-0 principal — no RBCD configure surface exposed from this context. [BAS-SIM-RBCD-S1]"
        }
      } else {
        Write-Output "EXEC T1069: found $count computer(s) writable by a non-tier-0 principal with ms-DS-MachineAccountQuota=$maq (>0). Reads DACLs and the quota only — this is a detection-and-exposure probe, it writes no delegation attribute and impersonates no one. [BAS-SIM-RBCD-S1]"
        Write-Output "FAIL: a non-tier-0 principal can write a computer's delegation attribute while ms-DS-MachineAccountQuota permits creating an impersonation principal, letting them configure Resource-Based Constrained Delegation and impersonate any user (including a privileged one) to that computer, enabling privilege escalation. Review the flagged computer(s): remove the unexpected write grant(s), restrict computer-object DACLs to tier-0 trustees, and set ms-DS-MachineAccountQuota to 0."
      }
    cleanup: ""
