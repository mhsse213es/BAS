  - custom
mitre_phases:
  - credential-access
  - defense-evasion
  - execution
  - discovery
  - privilege-escalation
  - lateral-movement
  - persistence

# Replace or add technique IDs below.
# Each runs ALL atomic tests for that technique via Invoke-AtomicTest.
art_techniques:
  - T1003.001   # OS Credential Dumping: LSASS Memory
  - T1003.002   # OS Credential Dumping: Security Account Manager
  - T1055.001   # Process Injection: DLL Injection
  - T1059.001   # Command and Scripting: PowerShell
  - T1059.003   # Command and Scripting: Windows Command Shell
  - T1070.001   # Indicator Removal: Clear Windows Event Logs
  - T1082       # System Information Discovery
  - T1087.001   # Account Discovery: Local Account
  - T1087.002   # Account Discovery: Domain Account
  - T1105       # Ingress Tool Transfer
  - T1112       # Modify Registry
  - T1134.001   # Access Token Manipulation: Token Impersonation/Theft
  - T1218.011   # System Binary Proxy Execution: Rundll32
  - T1547.001   # Boot or Logon Autostart: Registry Run Keys
  - T1548.002   # Abuse Elevation Control Mechanism: Bypass UAC
  - T1562.001   # Impair Defenses: Disable or Modify Tools
  - T1569.002   # System Services: Service Execution
