id: dbsim-db02-05-global-grants
product_line: dbsim
name: Database Security Simulation DB-02-05 - Dangerous Global Grants
description: >
  Lists the cluster-wide privileges (SUPERUSER, CREATEDB, CREATEROLE, BYPASSRLS) of
  each lab role and the database-level privileges (CREATE, CONNECT, TEMPORARY) on the
  lab database, read-only, and compares them with the stated policy. A privilege the
  policy does not grant to the role is reported as global_grant_excessive. On the lab,
  dbsim_lab holds CREATEROLE and CREATE on the dbsim database (confirmed 2026-11-19).
  Graded only when a policy is configured; without one the step is ERROR. PostgreSQL only.
  ATT&CK T1087 Account Discovery.
author: Audspect Research
executable: true
tags:
  - dbsim
  - database
  - privileges
  - read-only
  - mitre-attack
mitre_phases:
  - discovery

steps:
  - name: "DB-02-05 Dangerous Global Grants (T1087)"
    technique_id: T1087
    executor: dbprobe
    db_target: lab-db
    db_probe: read_global_privileges
    risk: low
    blast_radius: "read-only role attribute and database privilege query; no state changed"
    telemetry:
      - "PostgreSQL pg_log: the BAS-marked catalog read by the probe identity"
    detection:
      - "SIEM: catalog read of role attributes or memberships, a discovery signal"
    reversible: true
