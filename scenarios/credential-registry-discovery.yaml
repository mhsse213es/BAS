id: credential-registry-discovery
product_line: dlp
name: Credentials-in-Registry Discovery Probe
description: >
  Telemetry-safe emulation of an adversary checking the registry for stored
  credentials: saved sessions in PuTTY and WinSCP, and the Winlogon autologon
  value. The scenario checks whether each key exists and, for the Winlogon key,
  whether a DefaultPassword value is present. It never reads a value. Only the
  presence of a key or a value name is recorded.

  KILL CHAIN STAGES:
    1. Registry Credential Location Check — key and value-name presence only (T1552.002)

  SAFETY: Read-only. Value data is never read. Only key existence and value
  names are checked. Nothing is written, changed, or exported. Windows only.
  Telemetry mode.
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - credentials
  - registry
  - autologon
  - detection
  - t1552
  - mitre
mitre_phases:
  - credential-access

live_policy:
  block_on_domain_controller: true
  require_dc_reachable: false
  max_spray_attempts: 0
  spray_account_allowlist: []
  execution_window: ""

steps:

  # ---------------------------------------------------------------------------
  # Stage 1 — Registry Credential Location Check (T1552.002)
  # ---------------------------------------------------------------------------
  - name: "Registry Credentials 1 — Credential-Storing Key Presence Check (T1552.002)"
    technique_id: T1552.002
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Tests whether these keys exist: HKCU PuTTY Sessions, HKCU WinSCP 2 Sessions, and the HKLM Winlogon key. For Winlogon, it checks only whether a DefaultPassword value name is present. No value data is read, and nothing is written."
    telemetry:
      - "PowerShell EID 4104: Test-Path and Get-ItemProperty name queries on credential keys"
      - "Sysmon EID 13: none (read-only)"
    detection:
      - "EDR/SIEM: query of autologon and saved-session keys from a non-application process — credential-store IOC"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $keys = @(
        'HKCU:\Software\SimonTatham\PuTTY\Sessions',
        'HKCU:\Software\Martin Prikryl\WinSCP 2\Sessions'
      )
      $present = @($keys | Where-Object { Test-Path $_ }).Count
      $winlogon = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
      $autologonValue = $false
      if (Test-Path $winlogon) {
        # (Get-Item).Property lists value NAMES only. Get-ItemProperty would load every value's data.
        $names = @((Get-Item -Path $winlogon).Property)
        $autologonValue = $names -contains 'DefaultPassword'
      }
      Write-Output "EXEC T1552.002: credential-storing keys present=$present of 2 checked; Winlogon DefaultPassword value name present=$autologonValue. No value data was read. Registry Stage 1. [BAS-SIM-REG-S1]"
      if ($present -gt 0 -or $autologonValue) {
        Write-Output "FAIL: Credential-storing registry locations were queried with no alert. These locations should be monitored for read access by non-application processes."
      } else {
        Write-Output "PASS: No credential-storing registry location was present."
      }
    cleanup: ""
