      foreach ($o in $out) { if ($o -is [hashtable]) { $res = $o } else { $script:A36Extra += [string]$o } }
      if (-not $res) { $res = @{ Ran = $false; Note = 'attempt_returned_no_result'; NotApplicable = '' } }
