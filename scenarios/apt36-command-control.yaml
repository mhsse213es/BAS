  - id: apt36-k2
    name: "APT36 Collection 4 - Archive Staging with a Utility (T1560.001)"
    technique_id: T1560.001
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 90
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Archives five synthetic files with tar.exe into a run-tagged zip, lists it and extracts it to confirm every hash matches. Not encrypted. Removed and verified."
    telemetry:
      - "Sysmon EID 1: tar.exe with a run-tagged archive path"
    detection:
      - "EDR: archive utility run on a collection folder by a script host"
    command: |
      $script:A36Run = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0, [Math]::Min(8, $env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 2147483647) }
      $script:A36Extra = @()
      function Get-A36Control {
      $r = @{ Build = [Environment]::OSVersion.Version.Build; DefenderReadable = $false; DefenderOn = $false; AsrBlock = 0; AppLocker = 'NotConfigured' }
