id: "cobalt-group-bfsi-defense-evasion"
product_line: killchain
name: "Cobalt Group BFSI - Defense Evasion (P1)"
description: >
  Enterprise defense-evasion detection validation extending the Cobalt Group BFSI campaign. Seven
  scenarios covering security-software discovery, a read-only security-tool-impairment permission
  probe, PowerShell obfuscation detection, masquerading-executable detection, registry-modification
  detection, non-destructive event-log-clearing (against a dedicated synthetic test log only), and a
  process-injection detection readiness check. No scenario disables a real security control, clears a
  real event log, or performs an actual injection technique. Each write scenario includes verified
  cleanup and undo-record rollback.
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - cobalt-group
  - bfsi
  - defense-evasion
  - p1
  - t1518.001
  - t1562.001
  - t1027
  - t1036
  - t1112
  - t1070.001
  - t1055
mitre_phases:
  - defense-evasion

steps:

  # -------------------------------------------------------------------------
  - id: eva-01
    name: "Defense Evasion - Security Software Discovery (T1518.001)"
    technique_id: T1518.001
    action_key: evasion_security_software_discovery
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 120
    fidelity: telemetry-safe
    production_safe: false
    risk: medium
    reversible: true
    blast_radius: "Read-only enumeration of running AV/EDR process names. No change to any process or service."
    telemetry:
      - "Process enumeration targeting security-product process names"
    detection:
      - "EDR: security-software discovery / reconnaissance detection"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $script:CgRun = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0, [Math]::Min(8, $env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 2147483647) }
      $script:CgTag = 'bas_sim_eva_' + $script:CgRun
      function Test-CgGate { param([string]$Name) return ([string](Get-Item -Path ('env:' + $Name) -ErrorAction SilentlyContinue).Value -ceq 'true') }
      function Write-CgVerdict { param([string]$Outcome, [string]$Reason, [string]$Id)
      $p = 'SKIP'
      if ($Outcome -eq 'pass') { $p = 'PASS' } elseif ($Outcome -eq 'fail') { $p = 'FAIL' } elseif ($Outcome -eq 'error') { $p = 'ERROR' }
      Write-Output ($p + ': ' + $Reason + ' [BAS-EVA-' + $Id + ']')
      }
      function Complete-CgStep { param($Res, [string]$Id) Write-CgVerdict $Res.Outcome $Res.Reason $Id; exit 0 }
      function Get-CgUndoPath { param([string]$Id) return (Join-Path $env:TEMP ('bas-cg-undo\' + $Id + '.json')) }
      function New-CgUndoRecord { param([string]$Id, $Data)
      $p = Get-CgUndoPath $Id
      New-Item -ItemType Directory -Force -Path (Split-Path -Parent $p) | Out-Null
      $fs = [IO.File]::Open($p, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write)
      try { $b = [Text.Encoding]::ASCII.GetBytes(($Data | ConvertTo-Json -Depth 6 -Compress)); $fs.Write($b, 0, $b.Length) } finally { $fs.Close() }
      }
      function Set-CgUndoRecord { param([string]$Id, $Data)
      [IO.File]::WriteAllText((Get-CgUndoPath $Id), ($Data | ConvertTo-Json -Depth 6 -Compress), [Text.Encoding]::ASCII)
      }
      function Read-CgUndoRecord { param([string]$Id)
      $p = Get-CgUndoPath $Id
      if (-not (Test-Path -LiteralPath $p)) { return $null }
      try { return (Get-Content -LiteralPath $p -Raw | ConvertFrom-Json) } catch { return 'unreadable' }
      }
      function Remove-CgUndoRecord { param([string]$Id) Remove-Item -LiteralPath (Get-CgUndoPath $Id) -Force -ErrorAction SilentlyContinue }
      function Invoke-EncodedCommandProbe { param([string]$PlainText, [string]$ExpectMarker)
      $res = @{ Outcome = 'error'; Reason = 'Encoded-command probe failed to run'; Ran = $false }
      try {
      $bytes = [Text.Encoding]::Unicode.GetBytes($PlainText)
      $encoded = [Convert]::ToBase64String($bytes)
      $out = powershell -NoProfile -NonInteractive -EncodedCommand $encoded 2>&1
      if ("$out" -match [regex]::Escape($ExpectMarker)) { $res.Ran = $true; $res.Outcome = 'fail'; $res.Reason = 'Encoded PowerShell command executed without being blocked or flagged' }
      else { $res.Outcome = 'pass'; $res.Reason = 'Encoded PowerShell command was blocked or did not produce the expected marker' }
      } catch {}
      return $res
      }
      $securityProcs = @('MsMpEng', 'MSASCui', 'SenseIR', 'SenseCncProxy', 'CSFalconService', 'CylanceSvc', 'SentinelAgent')
      $found = @()
      foreach ($name in $securityProcs) {
      if (Get-Process -Name $name -ErrorAction SilentlyContinue) { $found += $name }
      }
      if ($found.Count -gt 0) {
      $res = @{ Outcome = 'fail'; Reason = "Security software discovery enumerated $($found.Count) running security process(es): $($found -join ', ')" }
      } else {
      $res = @{ Outcome = 'pass'; Reason = 'No known security-software processes were discovered on this host' }
      }
      Complete-CgStep $res 'EVA-01'
    cleanup: |
      $ErrorActionPreference = 'SilentlyContinue'
      $script:CgRun = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0, [Math]::Min(8, $env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 2147483647) }
      $script:CgTag = 'bas_sim_eva_' + $script:CgRun
      function Test-CgGate { param([string]$Name) return ([string](Get-Item -Path ('env:' + $Name) -ErrorAction SilentlyContinue).Value -ceq 'true') }
      function Write-CgVerdict { param([string]$Outcome, [string]$Reason, [string]$Id)
      $p = 'SKIP'
