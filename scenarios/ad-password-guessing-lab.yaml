id: ad-password-guessing-lab
product_line: ad
name: Password Guessing and Stuffing Against Synthetic Lab Accounts
description: >
  Telemetry-safe emulation of password guessing (T1110.001) and credential stuffing
  (T1110.004), limited to the three synthetic lab accounts (bassim1, bassim2, bassim3).
  Each run makes two wrong-password attempts per account: one guess and one stuffed
  pair. Both values are fixed, obviously fake strings. No real credential is tested.
  Two attempts per account stay below the lab lockout threshold of 3, and the preflight
  refuses a run within 30 minutes of any failure for these accounts.

  Guardrails, enforced in the script and by the agent:
    - Accounts are hard-coded to bassim1..3.
    - The DC must appear in C:\bas-lab\allowed-targets.txt.
    - The domain lockout threshold must be between 1 and 5 (refuses Never).
    - Two attempts per account per run, total cap 6 (live_policy max_spray_attempts).
    - Refused if any synthetic account failed in the last 30 minutes.

  Platform classes: both attack steps use destructive action keys (credential_password_guess,
  credential_stuffing). The platform vetoes them on every agent by default. The lab exemption
  lifts that veto only on the designated lab agent (is_spray_lab), and only for this scenario's
  two keys.

  KILL CHAIN STAGES:
    1. Preflight: target, lockout policy, accounts, recent failures (T1110.001)
    2. Guessing: one guess per synthetic account (T1110.001)
    3. Stuffing: one stuffed pair per synthetic account (T1110.004)
    4. Telemetry: count the resulting 4625/4771 failures on the DC (T1110.001)

  SAFETY: Lab domain only. Synthetic accounts only. No real password or breach list.
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - password-guessing
  - credential-stuffing
  - authentication
  - active-directory
  - detection
  - t1110
  - mitre
mitre_phases:
  - credential-access

live_policy:
  block_on_domain_controller: false
  require_dc_reachable: true
  max_spray_attempts: 6
  spray_account_allowlist: [bassim1, bassim2, bassim3]
  execution_window: ""

steps:

  # ---------------------------------------------------------------------------
  # Stage 1 — Preflight (T1110.001)
  # ---------------------------------------------------------------------------
  - name: "Guess 1 — Preflight: Target, Lockout Policy, Accounts, Recent Failures (T1110.001)"
    technique_id: T1110.001
    framework: custom
    executor: powershell
    requires_priv: domain_admin
    timeout_sec: 60
    fidelity: telemetry-safe
    production_safe: false
    risk: medium
    reversible: true
    blast_radius: "Reads the target list, the domain lockout policy, the three synthetic accounts, and recent failure events. Changes nothing."
    telemetry:
      - "Security EID 4662 on the accounts, when DS Access auditing is on"
    detection:
      - "SIEM: enumeration of a named account set from a non-admin process — guessing precursor"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $dom = (Get-CimInstance Win32_ComputerSystem).Domain
      if (-not $dom) { Write-Output "SKIP: host is not domain-joined. No attempt made. [BAS-SIM-GUE-S1]"; exit 0 }
      $dcLine = nltest /dsgetdc:$dom | Select-String 'DC:' | Select-Object -First 1
      $dc = if ($dcLine) { ($dcLine.ToString() -split '\\')[-1].Trim() } else { '' }
      $allowed = @(Get-Content 'C:\bas-lab\allowed-targets.txt' -ErrorAction SilentlyContinue | ForEach-Object { $_.Trim() })
      if (-not $dc -or ($allowed -notcontains $dc)) { Write-Output "SKIP: DC '$dc' is not in allowed-targets.txt. Refusing. [BAS-SIM-GUE-S1]"; exit 0 }
      $lockLine = net accounts /domain | Select-String 'Lockout threshold' | Select-Object -First 1
      $threshold = if ($lockLine) { ($lockLine.ToString() -split '\s+')[-1] } else { '' }
      if ($threshold -notmatch '^\d+$' -or [int]$threshold -lt 1 -or [int]$threshold -gt 5) { Write-Output "SKIP: lockout threshold is '$threshold'. Needs 1 to 5, not Never. Refusing. [BAS-SIM-GUE-S1]"; exit 0 }
      Import-Module ActiveDirectory
      $found = @(Get-ADUser -Filter "SamAccountName -eq 'bassim1' -or SamAccountName -eq 'bassim2' -or SamAccountName -eq 'bassim3'" -SearchBase "OU=BAS-Sim,$((Get-ADDomain).DistinguishedName)" -ErrorAction SilentlyContinue)
      if ($found.Count -ne 3) { Write-Output "SKIP: expected 3 synthetic accounts in OU=BAS-Sim, found $($found.Count). Refusing. [BAS-SIM-GUE-S1]"; exit 0 }
      $recent = @(Get-WinEvent -FilterHashtable @{ LogName='Security'; Id=4625,4771; StartTime=(Get-Date).AddMinutes(-30) } -ErrorAction SilentlyContinue | Where-Object { $_.Message -match 'bassim[123]' })
      if ($recent.Count -gt 0) { Write-Output "SKIP: $($recent.Count) failure event(s) for synthetic accounts in the last 30 minutes. Waiting for the lockout window to clear. [BAS-SIM-GUE-S1]"; exit 0 }
      Write-Output "EXEC T1110.001: preflight passed. DC=$dc, lockout threshold=$threshold, accounts=3, no failures in the last 30 minutes. [BAS-SIM-GUE-S1]"
    cleanup: ""

  # ---------------------------------------------------------------------------
  # Stage 2 — Guessing (T1110.001)
  # ---------------------------------------------------------------------------
  - name: "Guess 2 — One Fake Guess per Synthetic Account (T1110.001)"
    technique_id: T1110.001
    action_key: credential_password_guess
    framework: custom
    executor: powershell
    requires_priv: domain_admin
    timeout_sec: 90
    fidelity: telemetry-safe
    production_safe: false
    risk: medium
    reversible: true
    blast_radius: "One wrong-password validation per account (bassim1..3) with the fixed fake guess BAS-SIM-Guess-Wrong-1!. Each account gets one failure, below the lockout threshold."
    telemetry:
      - "Security EID 4625 (NTLM/logon failure) or 4771 (Kerberos pre-auth failure) on the DC"
    detection:
      - "SIEM: repeated failed authentications against a fixed set of accounts — guessing IOC"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      Add-Type -AssemblyName System.DirectoryServices.AccountManagement
      $dom = (Get-CimInstance Win32_ComputerSystem).Domain
      $guess = 'BAS-SIM-Guess-Wrong-1!'
      $ctx = New-Object System.DirectoryServices.AccountManagement.PrincipalContext('Domain', $dom)
      $results = @()
      foreach ($sam in @('bassim1','bassim2','bassim3')) {
        $ok = $ctx.ValidateCredentials($sam, $guess)
        $results += "$sam=$(if ($ok) { 'valid(unexpected)' } else { 'rejected' })"
      }
      $ctx.Dispose()
      Write-Output "EXEC T1110.001: one guess per synthetic account: $($results -join ', '). Fixed fake guess. [BAS-SIM-GUE-S2]"
      if ($results -match 'valid\(unexpected\)') { Write-Output "FAIL: a synthetic account accepted the fake guess. Investigate before continuing." }
    cleanup: ""

  # ---------------------------------------------------------------------------
  # Stage 3 — Stuffing (T1110.004)
  # ---------------------------------------------------------------------------
  - name: "Stuff 3 — One Stuffed Fake Pair per Synthetic Account (T1110.004)"
    technique_id: T1110.004
    action_key: credential_stuffing
    framework: custom
    executor: powershell
    requires_priv: domain_admin
    timeout_sec: 90
    fidelity: telemetry-safe
    production_safe: false
    risk: medium
    reversible: true
    blast_radius: "One wrong-password validation per account with a second fixed fake value, BAS-SIM-Stuff-Wrong-2!. No breach list and no real credential is used. Each account reaches two failures in total, below the lockout threshold of 3."
    telemetry:
      - "Security EID 4625 or 4771 on the DC"
    detection:
      - "SIEM: credential-reuse pattern across several accounts in one window — stuffing IOC"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      Add-Type -AssemblyName System.DirectoryServices.AccountManagement
      $dom = (Get-CimInstance Win32_ComputerSystem).Domain
      $pair = 'BAS-SIM-Stuff-Wrong-2!'
      $ctx = New-Object System.DirectoryServices.AccountManagement.PrincipalContext('Domain', $dom)
      $results = @()
      foreach ($sam in @('bassim1','bassim2','bassim3')) {
        $ok = $ctx.ValidateCredentials($sam, $pair)
        $results += "$sam=$(if ($ok) { 'valid(unexpected)' } else { 'rejected' })"
      }
      $ctx.Dispose()
      Write-Output "EXEC T1110.004: one stuffed fake pair per synthetic account: $($results -join ', '). Fixed fake value. [BAS-SIM-GUE-S3]"
      if ($results -match 'valid\(unexpected\)') { Write-Output "FAIL: a synthetic account accepted the stuffed fake pair. Investigate before continuing." }
    cleanup: ""

  # ---------------------------------------------------------------------------
  # Stage 4 — Telemetry visibility (T1110.001)
  # ---------------------------------------------------------------------------
  - name: "Guess 4 — Failure Events for Both Stages Visible on the DC (T1110.001)"
    technique_id: T1110.001
    framework: custom
    executor: powershell
    requires_priv: domain_admin
    timeout_sec: 90
    fidelity: telemetry-safe
    production_safe: false
    risk: low
    reversible: true
    blast_radius: "Reads Security log events 4625 and 4771 from the last 10 minutes and counts those for the synthetic accounts. Changes nothing."
    telemetry:
      - "Security EID 4625 and 4771 on the DC: the events this stage counts"
    detection:
      - "SIEM: a guessing alert should fire on the same burst. This stage checks logging only, not alerting."
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $events = @(Get-WinEvent -FilterHashtable @{ LogName = 'Security'; Id = 4625, 4771; StartTime = (Get-Date).AddMinutes(-10) } -MaxEvents 2000 -ErrorAction SilentlyContinue)
      $hits = @($events | Where-Object { $_.Message -match 'bassim[123]' })
      Write-Output "EXEC T1110.001: failure events for synthetic accounts in the last 10 minutes = $($hits.Count) (expected at least 6: two per account). [BAS-SIM-GUE-S4]"
      if ($hits.Count -ge 6) {
        Write-Output "PASS: the DC logged both the guessing and stuffing attempts. Logging only; alerting needs a separate SIEM check."
      } else {
        Write-Output "SKIP: fewer than 6 matching failure events. Inconclusive. [BAS-SIM-GUE-S4]"
      }
    cleanup: ""
