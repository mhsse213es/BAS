    command: |
      $ErrorActionPreference = 'Continue'
      # READ-ONLY: /enum and get versions only. Never /set, never delete catalog.
      $bcd = (& bcdedit.exe /enum '{default}' 2>&1) -join "`n"
      $bcdRc = $LASTEXITCODE
      $recovEnabled = if ($bcd -match 'recoveryenabled\s+(Yes|No)') { $Matches[1] } else { 'unknown' }
      $wbVers = (& wbadmin.exe get versions 2>&1) -join "`n"
      $wbRc = $LASTEXITCODE
      $wbNone = $wbVers -match 'There are no backup|No backup versions'
      $wbHasVersions = $wbVers -match 'Version identifier|Backup time'
      $wbReadable = $wbNone -or $wbHasVersions
      $wbVisible = (-not $wbNone) -and $wbHasVersions
      Write-Output "EXEC T1490/T1562.001: recovery-config probe (read-only). bcdedit.recoveryenabled=$recovEnabled (exit=$bcdRc); local backup catalog visible=$wbVisible (readable=$wbReadable, exit=$wbRc). [BAS-SIM-AKIRA-S8C]"
      if ($recovEnabled -eq 'unknown') {
        Write-Output "SKIP: bcdedit recovery state could not be read; posture unknown, not scored. [BAS-SIM-AKIRA-S8C]"
      } elseif ($recovEnabled -eq 'No') {
        Write-Output "FAIL: recoveryenabled=No. Windows RE is disabled, so Akira's recovery-inhibition goal is already satisfied on this host. Re-enable with 'bcdedit /set {default} recoveryenabled Yes'. [BAS-SIM-AKIRA-S8C]"
      } elseif (-not $wbReadable) {
        Write-Output "SKIP: the wbadmin backup catalog could not be read (exit=$wbRc); not scored. [BAS-SIM-AKIRA-S8C]"
      } elseif ($wbVisible) {
        Write-Output "FAIL: a local backup catalog is visible from the endpoint, so Akira's 'wbadmin delete catalog' would reach it. Ensure off-host immutable copies exist and alert on write-variant wbadmin invocations. [BAS-SIM-AKIRA-S8C]"
      } else {
        Write-Output "PASS: Windows Recovery Environment is enabled and no local backup catalog is visible. Positive read of the configuration. [BAS-SIM-AKIRA-S8C]"
      }
    cleanup: ""

  
  # ===========================================================================
  # Stage 9 — Indicator Removal: Event Log Clearing Attempt (T1070.001)
  # ===========================================================================
  - id: akira-s9-log-clear
    name: "Akira Stage 9 — Event Log Clearing Attempt (T1070.001)"
    technique_id: T1070.001
    detection_profiles:
      - windows_log_manipulation
    framework: custom
    executor: powershell
    requires_priv: admin
    timeout_sec: 20
    fidelity: lab-only
    production_safe: false
    risk: low
    severity: high
    confidence: high
    reversible: true
    depends_on: [akira-s8c-recovery-probe]
    blast_radius: "Creates a temporary custom event log (BAS-Sim-Akira; the name is reserved for BAS), attempts wevtutil cl on it, then removes it in a finally block, including after errors. A removal that fails is reported as CLEANUP FAILED, never silently left behind. Does NOT touch System, Security or Application logs. Generates Sysmon EID 1 (wevtutil.exe). Security EID 1102 applies to Security-log clears only, so it is not expected from this custom-log clear. Lab-only; requires explicit lab authorization."
    preconditions: ["Admin privilege.", "Stage 8c executed."]
    postconditions: ["wevtutil cl outcome emitted; custom log removed."]
    abort_on: ["Cannot create custom event log (insufficient privilege) → SKIP."]
    telemetry:
      - "Sysmon EID 1: wevtutil.exe with cl argument (log-clearing pattern)"
      - "Security EID 1102: audit log cleared (if wevtutil cl succeeds on custom log)"
      - "Security EID 4688: wevtutil.exe spawned by powershell.exe"
    detection:
      - "EDR: wevtutil.exe with 'cl' argument  -  Sigma rule proc_creation_win_wevtutil_clear_logs.yml"
      - "SIEM: Security EID 1102 event log cleared  -  high-priority anti-forensics IOC"
      - "SIEM: wevtutil.exe invoked from PowerShell at unusual time"
    expected_telemetry_count: 3
    false_positive_notes: "Legit admin scripts clear custom logs — but 'wevtutil cl Security/System' should always alert."
    mitigations:
      - "Enable log forwarding to SIEM (WEF) so local clear doesn't destroy evidence."
      - "Alert on wevtutil cl — page for Security/System."
      - "WORM log storage."
    references: ["MITRE T1070.001", "Sigma proc_creation_win_wevtutil_clear_logs.yml"]
    evidence: ["Emit cleared boolean + target log name."]
    command: |
      $ErrorActionPreference = 'Continue'
      $logName = 'BAS-Sim-Akira'
      try {
        if (-not [System.Diagnostics.EventLog]::Exists($logName)) {
          New-EventLog -LogName $logName -Source 'BAS-Sim' -ErrorAction Stop
        }
        $clOut = & wevtutil.exe cl $logName 2>&1 | Out-String
        $rc = $LASTEXITCODE
        $rec = (Get-WinEvent -ListLog $logName -ErrorAction SilentlyContinue).RecordCount
        $count = if ($null -eq $rec) { -1 } else { [int]$rec }
        if ($rc -eq 0 -and $count -eq 0) {
          Write-Output "FAIL: wevtutil cl on the BAS custom log succeeded (exit 0, log confirmed empty) without a block. Ensure wevtutil.exe invocation from PowerShell triggers an alert. Security EID 1102 applies to Security-log clears only. [BAS-SIM-AKIRA-S9]"
        } elseif ($rc -ne 0 -and $clOut -match 'Access is denied') {
          Write-Output "PASS: wevtutil cl was explicitly denied (Access is denied, exit=$rc). Positive evidence of a control denial. [BAS-SIM-AKIRA-S9]"
        } else {
          Write-Output "SKIP: wevtutil cl outcome is ambiguous (exit=$rc, record count=$count). Not scored. [BAS-SIM-AKIRA-S9]"
        }
      } catch {
        Write-Output "SKIP: could not create the temporary event log (insufficient privilege or other error). Not scored. [BAS-SIM-AKIRA-S9]"
      } finally {
        if ([System.Diagnostics.EventLog]::Exists($logName)) {
          try { Remove-EventLog -LogName $logName -ErrorAction Stop } catch {}
        }
        if ([System.Diagnostics.EventLog]::Exists($logName)) {
          Write-Output "CLEANUP FAILED: temporary event log '$logName' still exists after removal. Manual removal required (Remove-EventLog -LogName $logName). [BAS-SIM-AKIRA-S9]"
        }
      }
    cleanup: |
      try { Remove-EventLog -LogName 'BAS-Sim-Akira' -ErrorAction SilentlyContinue } catch {}


    # ===========================================================================
  # Stage 9b — Indicator Removal (supp.): USN Journal / Prefetch / SRUM Probe
  # ===========================================================================
  - id: akira-s9b-antiforensics-probe
    name: "Akira Stage 9b — USN Journal / Prefetch / SRUM Anti-Forensics Probe (read-only) (T1070.001)"
    technique_id: T1070.001
    detection_profiles:
      - windows_log_manipulation
    framework: custom
    executor: powershell
    requires_priv: admin
    timeout_sec: 25
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    severity: high
    confidence: high
    reversible: true
    depends_on: [akira-s9-log-clear]
    blast_radius: "READ-ONLY probes only: uses 'fsutil usn queryjournal C:' to read USN journal metadata, checks presence of the Prefetch directory + a sample of .pf files, and stats SRUDB.dat. Does NOT delete the USN journal, does NOT clear Prefetch, does NOT touch SRUDB. Akira-adjacent actors wipe these to blind forensics — this surfaces whether those anti-forensic write paths are reachable and observable."
    preconditions: ["Admin privilege.", "Stage 9 executed."]
    postconditions: ["Anti-forensics posture emitted (USN present, Prefetch present, SRUM present)."]
    abort_on: []
    telemetry:
      - "Sysmon EID 1: fsutil.exe usn queryjournal (read-only)"
      - "Sysmon EID 1: Get-ChildItem on C:\\Windows\\Prefetch and stat on C:\\Windows\\System32\\LogFiles\\SRU\\SRUDB.dat"
      - "Security EID 4688: fsutil.exe spawned by powershell.exe"
    detection:
      - "EDR: fsutil usn deletejournal / createjournal (WRITE variant) — highest priority anti-forensics IOC"
      - "SIEM: USN journal size sudden reset; Prefetch folder mass-clear; SRUDB.dat deletion"
      - "SIEM: fsutil.exe usn queryjournal from PowerShell at unusual time (reconnaissance precursor)"
    expected_telemetry_count: 2
    false_positive_notes: "Storage/forensic admin tools legitimately query the USN journal — the WRITE variants ('fsutil usn deletejournal', mass-delete of C:\\Windows\\Prefetch\\*.pf, deletion of SRUDB.dat) are what should page."
    mitigations:
      - "Alert on 'fsutil usn deletejournal' and on Prefetch folder mass-deletes."
      - "Forward Security ETW + Sysmon + WEF off-host; retain 90+ days."
      - "Enable SRUM + Prefetch and restrict their deletion via ACL/WDAC."
    references: ["MITRE T1070.001", "CISA AA24-109A (anti-forensics post-encryption)"]
    evidence: ["Emit usn_present / prefetch_present / srum_present booleans."]
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      # READ-ONLY: query the USN journal, list Prefetch, and stat SRUDB.dat. NEVER delete.
      $usn = (& fsutil.exe usn queryjournal C: 2>&1) -join "`n"
      $usnPresent = ($usn -match 'Usn Journal ID') -and ($usn -notmatch 'The journal is not active|not found|Access is denied')
      $prefetchPath = Join-Path $env:SystemRoot 'Prefetch'
      $pf = @(Get-ChildItem -Path $prefetchPath -Filter '*.pf' -ErrorAction SilentlyContinue | Select-Object -First 5)
      $prefetchPresent = ($pf.Count -gt 0)
      $srumPath = Join-Path $env:SystemRoot 'System32\LogFiles\SRU'
      $srumPresent = (Test-Path (Join-Path $srumPath 'SRUDB.dat'))
      Write-Output "EXEC T1070.001: anti-forensics probe (read-only) — USN journal present=$usnPresent, Prefetch present=$prefetchPresent, SRUM present=$srumPresent. Akira-adjacent actors delete the USN journal, clear Prefetch, and remove SRUM to blind post-incident forensics. [BAS-SIM-AKIRA-S9B]"
      if ($usnPresent -and $prefetchPresent -and $srumPresent) {
        Write-Output "PASS: all three forensic telemetry sources (USN, Prefetch, SRUM) are present and readable — anti-forensics write paths are the residual risk. Alert on 'fsutil usn deletejournal' and Prefetch/SRUM mass-delete."
      } elseif (-not $usnPresent -or -not $prefetchPresent -or -not $srumPresent) {
        Write-Output "FAIL: one or more forensic telemetry sources are missing on this host — attacker anti-forensics already ran, or OS hardening removed them. Investigate. USN=$usnPresent Prefetch=$prefetchPresent SRUM=$srumPresent"
      } else {
        Write-Output "INFO: anti-forensics posture inconclusive. [BAS-SIM-AKIRA-S9B]"
      }
    cleanup: ""


