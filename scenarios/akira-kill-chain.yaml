  # ===========================================================================
  # Stage 8c — Recovery Inhibition C: bcdedit / wbadmin Recovery-Check Probe
  # ===========================================================================
  - id: akira-s8c-recovery-probe
    name: "Akira Stage 8c — bcdedit/wbadmin Recovery-Check Probe (read-only) (T1490/T1562.001)"
    technique_id: T1490
    detection_profiles:
      - windows_vss_inhibition
      - windows_backup_tampering
    framework: custom
    executor: powershell
    requires_priv: admin
    timeout_sec: 25
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    severity: high
    confidence: high
    reversible: true
    depends_on: [akira-s8b-vss-survival]
    blast_radius: "READ-ONLY probes only: runs 'bcdedit /enum {default}' and 'wbadmin get versions' and 'wbadmin get status' to enumerate boot/recovery config and backup catalog visibility. Does NOT run recoveryenabled/no, does NOT delete backups, does NOT modify BCD. Akira uses 'bcdedit /set {default} recoveryenabled No' and 'wbadmin delete catalog' to inhibit recovery — this surfaces whether those paths are reachable/observable."
    preconditions: ["Admin privilege.", "Stage 8b executed."]
    postconditions: ["Recovery-config posture emitted (recovery enabled? backups visible?)."]
    abort_on: []
    telemetry:
      - "Sysmon EID 1: bcdedit.exe /enum (cmdline captured)"
      - "Sysmon EID 1: wbadmin.exe get versions / get status (cmdline captured)"
      - "Security EID 4688: bcdedit.exe, wbadmin.exe spawned by powershell.exe"
    detection:
      - "EDR: bcdedit.exe and wbadmin.exe from PowerShell — recovery/backup tampering reconnaissance"
      - "SIEM: bcdedit /enum + wbadmin get versions within short window — Akira recovery-inhibition staging"
    expected_telemetry_count: 3
    false_positive_notes: "Backup admins and imaging tools legitimately run bcdedit/wbadmin — correlate with user context and change windows."
    mitigations:
      - "Alert on 'bcdedit /set ... recoveryenabled No' and 'wbadmin delete catalog' (write variants) — highest priority."
      - "Restrict bcdedit/wbadmin to signed management tooling via WDAC."
      - "Off-host immutable backups so 'wbadmin delete catalog' can't destroy the recovery chain."
    references: ["CISA AA24-109A", "MITRE T1490", "MITRE T1562.001"]
    evidence: ["Emit bcdedit_recovery_enabled + wbadmin_versions_visible booleans."]
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      # READ-ONLY: /enum, get versions, get status. Never /set, never delete catalog.
      $bcd = (& bcdedit.exe /enum '{default}' 2>&1) -join "`n"
      $recovEnabled = if ($bcd -match 'recoveryenabled\s+(Yes|No)') { $Matches[1] } else { 'unknown' }
      $wbVers = (& wbadmin.exe get versions 2>&1) -join "`n"
      $wbStatus = (& wbadmin.exe get status 2>&1) -join "`n"
      $wbVisible = ($wbVers -notmatch 'There are no backup|No backup versions') -and ($wbVers -notmatch 'Access is denied|not recognized|ERROR')
      Write-Output "EXEC T1490/T1562.001: recovery-config probe (read-only) — bcdedit.recoveryenabled=$recovEnabled, wbadmin versions visible=$wbVisible. Akira issues 'bcdedit /set {default} recoveryenabled No' and 'wbadmin delete catalog' to kill recovery. [BAS-SIM-AKIRA-S8C]"
      if ($recovEnabled -eq 'Yes' -and -not $wbVisible) {
        Write-Output "PASS: Windows Recovery Environment enabled AND no local backup catalog visible — reduces Akira's recovery-inhibition value."
      } elseif ($recovEnabled -eq 'No') {
        Write-Output "FAIL: recoveryenabled=No — Windows RE is disabled; Akira's recovery-inhibition goal is already satisfied on this host. Re-enable with 'bcdedit /set {default} recoveryenabled Yes'."
      } elseif ($wbVisible) {
        Write-Output "INFO: wbadmin backup catalog is visible from endpoint — Akira would attempt 'wbadmin delete catalog'. Ensure off-host immutable copies exist and alert on any write-variant invocation."
      } else {
        Write-Output "INFO: recovery posture inconclusive (output: $($bcd.Trim())). [BAS-SIM-AKIRA-S8C]"
      }
    cleanup: ""

  
  # ===========================================================================
  # Stage 9 — Indicator Removal: Event Log Clearing Attempt (T1070.001)
  # ===========================================================================
  - id: akira-s9-log-clear
    name: "Akira Stage 9 — Event Log Clearing Attempt (T1070.001)"
    technique_id: T1070.001
    detection_profiles:
      - windows_log_manipulation
    framework: custom
    executor: powershell
    requires_priv: admin
    timeout_sec: 20
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    severity: high
    confidence: high
    reversible: true
    depends_on: [akira-s8c-recovery-probe]
    blast_radius: "Creates a BAS-owned custom event log (BAS-Sim-Akira), attempts wevtutil cl on it, then removes the log. Does NOT touch System/Security/Application logs. Generates Security EID 1102 if the clear succeeds, and Sysmon EID 1 wevtutil.exe."
    preconditions: ["Admin privilege.", "Stage 8c executed."]
    postconditions: ["wevtutil cl outcome emitted; custom log removed."]
    abort_on: ["Cannot create custom event log (insufficient privilege) → SKIP."]
    telemetry:
      - "Sysmon EID 1: wevtutil.exe with cl argument (log-clearing pattern)"
      - "Security EID 1102: audit log cleared (if wevtutil cl succeeds on custom log)"
      - "Security EID 4688: wevtutil.exe spawned by powershell.exe"
    detection:
      - "EDR: wevtutil.exe with 'cl' argument  -  Sigma rule proc_creation_win_wevtutil_clear_logs.yml"
      - "SIEM: Security EID 1102 event log cleared  -  high-priority anti-forensics IOC"
      - "SIEM: wevtutil.exe invoked from PowerShell at unusual time"
    expected_telemetry_count: 3
    false_positive_notes: "Legit admin scripts clear custom logs — but 'wevtutil cl Security/System' should always alert."
    mitigations:
      - "Enable log forwarding to SIEM (WEF) so local clear doesn't destroy evidence."
      - "Alert on wevtutil cl — page for Security/System."
      - "WORM log storage."
    references: ["MITRE T1070.001", "Sigma proc_creation_win_wevtutil_clear_logs.yml"]
    evidence: ["Emit cleared boolean + target log name."]
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $logName = 'BAS-Sim-Akira'
      $exists = [System.Diagnostics.EventLog]::Exists($logName)
      if (-not $exists) {
        try { New-EventLog -LogName $logName -Source 'BAS-Sim' -ErrorAction Stop } catch {}
      }
      $created = [System.Diagnostics.EventLog]::Exists($logName)
      if ($created) {
        $start = Get-Date
        $clOut = & wevtutil.exe cl $logName 2>&1 | Out-String
        $cleared = $clOut -notmatch 'Access is denied|The specified channel could not be found|error'
        $eid104 = $null
        if ($cleared) {
          Start-Sleep -Milliseconds 700
          $ev = @(Get-WinEvent -FilterHashtable @{ LogName = 'System'; Id = 104; StartTime = $start.AddSeconds(-2) } -ErrorAction SilentlyContinue | Where-Object { $_.Message -match [regex]::Escape($logName) })
          $eid104 = ($ev.Count -gt 0)
        }
        $gl = (& wevtutil.exe gl Security 2>&1 | Out-String)
        $maxSize = if ($gl -match 'maxSize:\s*(\d+)') { [int64]$Matches[1] / 1024 } else { 'unknown' }
        $retention = if ($gl -match 'retention:\s*(\w+)') { $Matches[1] } else { 'unknown' }
        try { Remove-EventLog -LogName $logName -ErrorAction SilentlyContinue } catch {}
        $removed = -not [System.Diagnostics.EventLog]::Exists($logName)
        Write-Output "EVIDENCE T1070.001: clear_attempt_succeeded=$cleared system_eid104_recorded=$eid104 security_log_max_kb=$maxSize security_log_retention=$retention test_log_removed=$removed siem_ingestion=unverified (no SIEM sink is visible from the endpoint; confirm EID 104 / 1102 reached the SIEM separately). [BAS-SIM-AKIRA-S9]"
        if ($cleared) {
          Write-Output "EXEC T1070.001: wevtutil cl on BAS custom log succeeded (exit 0). Akira uses 'wevtutil cl System' 'wevtutil cl Security' after ransomware deployment. Sysmon EID 1 wevtutil.exe logged. [BAS-SIM-AKIRA-S9]"
          Write-Output "FAIL: wevtutil cl ran without EDR intervention. Ensure wevtutil.exe invocation from PowerShell triggers an alert. Security EID 1102 should generate a SIEM alert. [BAS-SIM-AKIRA-S9]"
        } else {
          Write-Output "PASS: wevtutil cl was blocked or failed  -  $($clOut.Trim()). [BAS-SIM-AKIRA-S9]"
        }
      } else {
        Write-Output "SKIP: prerequisite missing (could not create the BAS test event log - insufficient privilege). wevtutil cl test skipped. [BAS-SIM-AKIRA-S9]"
      }
    cleanup: |
      try { Remove-EventLog -LogName 'BAS-Sim-Akira' -ErrorAction SilentlyContinue } catch {}


    # ===========================================================================
  # Stage 9b — Indicator Removal (supp.): USN Journal / Prefetch / SRUM Probe
  # ===========================================================================
  - id: akira-s9b-antiforensics-probe
    name: "Akira Stage 9b — USN Journal / Prefetch / SRUM Anti-Forensics Probe (read-only) (T1070.001)"
    technique_id: T1070.001
    detection_profiles:
      - windows_log_manipulation
    framework: custom
    executor: powershell
    requires_priv: admin
    timeout_sec: 25
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    severity: high
    confidence: high
    reversible: true
    depends_on: [akira-s9-log-clear]
    blast_radius: "READ-ONLY probes only: uses 'fsutil usn queryjournal C:' to read USN journal metadata, checks presence of the Prefetch directory + a sample of .pf files, and stats SRUDB.dat. Does NOT delete the USN journal, does NOT clear Prefetch, does NOT touch SRUDB. Akira-adjacent actors wipe these to blind forensics — this surfaces whether those anti-forensic write paths are reachable and observable."
    preconditions: ["Admin privilege.", "Stage 9 executed."]
    postconditions: ["Anti-forensics posture emitted (USN present, Prefetch present, SRUM present)."]
    abort_on: []
    telemetry:
      - "Sysmon EID 1: fsutil.exe usn queryjournal (read-only)"
      - "Sysmon EID 1: Get-ChildItem on C:\\Windows\\Prefetch and stat on C:\\Windows\\System32\\sru\\SRUDB.dat"
      - "Security EID 4688: fsutil.exe spawned by powershell.exe"
    detection:
      - "EDR: fsutil usn deletejournal / createjournal (WRITE variant) — highest priority anti-forensics IOC"
      - "SIEM: USN journal size sudden reset; Prefetch folder mass-clear; SRUDB.dat deletion"
      - "SIEM: fsutil.exe usn queryjournal from PowerShell at unusual time (reconnaissance precursor)"
    expected_telemetry_count: 2
    false_positive_notes: "Storage/forensic admin tools legitimately query the USN journal — the WRITE variants ('fsutil usn deletejournal', mass-delete of C:\\Windows\\Prefetch\\*.pf, deletion of SRUDB.dat) are what should page."
    mitigations:
      - "Alert on 'fsutil usn deletejournal' and on Prefetch folder mass-deletes."
      - "Forward Security ETW + Sysmon + WEF off-host; retain 90+ days."
      - "Enable SRUM + Prefetch and restrict their deletion via ACL/WDAC."
    references: ["MITRE T1070.001", "CISA AA24-109A (anti-forensics post-encryption)"]
    evidence: ["Emit usn_present / prefetch_present / srum_present booleans."]
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      # READ-ONLY posture checks. NEVER deletes anything.
      $usn = (& fsutil.exe usn queryjournal C: 2>&1) -join "`n"
      $usnPresent = ($usn -match 'Usn Journal ID') -and ($usn -notmatch 'The journal is not active|not found|Access is denied')
      $prefetchPath = Join-Path $env:SystemRoot 'Prefetch'
      $pf = @(Get-ChildItem -Path $prefetchPath -Filter '*.pf' -ErrorAction SilentlyContinue | Select-Object -First 5)
      $prefetchPresent = ($pf.Count -gt 0)
      $srumPath = Join-Path $env:SystemRoot 'System32\sru'
      $srumPresent = (Test-Path (Join-Path $srumPath 'SRUDB.dat'))
      $sysmon = @(Get-Service -Name 'Sysmon*' -ErrorAction SilentlyContinue | Where-Object { $_.Status -eq 'Running' })
      $sysmonRunning = ($sysmon.Count -gt 0)
      $auditLogClear = (& auditpol.exe /get /subcategory:"Audit Policy Change" 2>&1 | Out-String)
      $securityAudited = ($auditLogClear -match 'Success')
      $gl = (& wevtutil.exe gl Security 2>&1 | Out-String)
      $maxKb = if ($gl -match 'maxSize:\s*(\d+)') { [int64]$Matches[1] / 1024 } else { 'unknown' }
      Write-Output "EVIDENCE T1070.001: usn_journal=$usnPresent prefetch=$prefetchPresent srum=$srumPresent sysmon_running=$sysmonRunning audit_policy_change_success_audited=$securityAudited security_log_max_kb=$maxKb. This is a read-only posture check; it cannot prove the host resists an attacker deleting these sources. [BAS-SIM-AKIRA-S9B]"
      if ($usnPresent -and $prefetchPresent -and $srumPresent -and $sysmonRunning -and $securityAudited) {
        Write-Output "PASS: forensic telemetry sources (USN, Prefetch, SRUM), Sysmon and audit-policy auditing are present (posture only). Anti-forensics write paths remain the residual risk: alert on 'fsutil usn deletejournal' and Prefetch/SRUM mass-delete. [BAS-SIM-AKIRA-S9B]"
      } else {
        Write-Output "FAIL: one or more forensic or telemetry sources are missing - USN=$usnPresent Prefetch=$prefetchPresent SRUM=$srumPresent Sysmon=$sysmonRunning AuditPolicyChange=$securityAudited. Attacker anti-forensics may already have run, or hardening removed them. [BAS-SIM-AKIRA-S9B]"
      }
    cleanup: ""


