  # ===========================================================================
  # Stage 6 — Ransomware Impact Simulation (T1486)
  # ===========================================================================
  - id: akira-s6-ransom-sim
    name: "Akira Stage 6 — Ransomware Payload Simulation (T1486)"
    technique_id: T1486
    detection_profiles:
      - windows_ransomware_encryption
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    severity: critical
    confidence: high
    reversible: true
    depends_on: [akira-s5c-smb-fanout]
    blast_radius: "Creates a dedicated, freshly named workspace under %TEMP% (bas_akira_ws_<runId>) containing one synthetic plaintext file, an XOR-encoded copy (simulating encryption) and a benign ransom note ([BAS-SIM-AKIRA] only). Existing files cannot be overwritten: an existing workspace is refused. Only that workspace is removed, in a finally block, including after errors. No user data is touched; all content is synthetic. Generates Sysmon EID 11 (file create) and EID 23 (file delete)."
    preconditions: ["Stage 5c executed."]
    postconditions: ["Encryption simulation attempted; PASS/FAIL emitted; artifacts deleted."]
    abort_on: []
    telemetry:
      - "Sysmon EID 11: bas_akira_<id>.txt created in %TEMP%"
      - "Sysmon EID 11: bas_akira_<id>.akira (encrypted simulation) created"
      - "Sysmon EID 11: bas_ransom_<id>.txt (ransom note) created"
      - "Sysmon EID 23: all files deleted in cleanup"
    detection:
      - "EDR: high-frequency file create + rename + delete in short window  -  Sigma rule win_security_susp_file_modifications.yml"
      - "Defender: ransom-pattern file creation heuristic (many .akira extension files)"
      - "EDR: PowerShell creating and immediately deleting files with suspicious extension"
    expected_telemetry_count: 4
    false_positive_notes: "Text editors/temp tooling create+delete files — heuristics must weigh extension + burst rate."
    mitigations:
      - "Controlled Folder Access on user-data folders."
      - "Defender ransomware behavior monitoring + attack surface reduction rules."
      - "Alert on .akira/.lockbit/etc extension bursts."
    references: ["MITRE T1486", "CISA AA24-109A"]
    evidence: ["Emit created/cleaned booleans."]
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $runId = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0,[Math]::Min(8,$env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 0x7FFFFFFF) }
      # Dedicated workspace, created fresh for this run. Only this workspace is written or removed.
      $ws        = Join-Path $env:TEMP "bas_akira_ws_$runId"
      $plainFile = Join-Path $ws "bas_akira_$runId.txt"
      $encFile   = Join-Path $ws "bas_akira_$runId.akira"
      $noteFile  = Join-Path $ws "bas_ransom_$runId.txt"
      $plainContent = '[BAS-SIM-AKIRA] T1486 ransomware simulation target file'
      $ownWs = $false
      try {
        # Refuse to reuse an existing directory, so no existing file can be overwritten.
        if (Test-Path -LiteralPath $ws) {
          Write-Output "SKIP: dedicated simulation workspace already exists; refusing to reuse it. Not scored. [BAS-SIM-AKIRA-S6]"
          return
        }
        New-Item -ItemType Directory -Path $ws -ErrorAction Stop | Out-Null
        $ownWs = $true
        [System.IO.File]::WriteAllText($plainFile, $plainContent, [System.Text.Encoding]::UTF8)
        # Simulate XOR encryption (key=0x41 = 'A' for Akira)
        $key = 0x41
        $bytes = [System.Text.Encoding]::UTF8.GetBytes($plainContent)
        $enc   = $bytes | ForEach-Object { $_ -bxor $key }
        [System.IO.File]::WriteAllBytes($encFile, [byte[]]$enc)
        $note = '[BAS-SIM-AKIRA] Akira Ransomware Simulation Note' + [char]13 + [char]10 +
                'This is a BAS simulation. No real files were encrypted.' + [char]13 + [char]10 +
                'Run ID: ' + $runId
        [System.IO.File]::WriteAllText($noteFile, $note, [System.Text.Encoding]::UTF8)
        $created = (Test-Path -LiteralPath $plainFile) -and (Test-Path -LiteralPath $encFile) -and (Test-Path -LiteralPath $noteFile)
        if ($created) {
          Write-Output "FAIL: ransomware simulation files were written to the dedicated workspace without a block. Defender ransomware protection and controlled folder access should have flagged this pattern. [BAS-SIM-AKIRA-S6]"
        } else {
          Write-Output "SKIP: simulation files were not all present after writing; outcome not scored. [BAS-SIM-AKIRA-S6]"
        }
      } catch {
        $msg = $_.Exception.Message
        if ($msg -match 'Access to the path|Access is denied|UnauthorizedAccess') {
          Write-Output "PASS: file write explicitly denied (access denied) by a control. [BAS-SIM-AKIRA-S6]"
        } else {
          Write-Output "SKIP: unexpected error during the simulation; outcome unverifiable, not scored. [BAS-SIM-AKIRA-S6]"
        }
      } finally {
        if ($ownWs) { Remove-Item -LiteralPath $ws -Recurse -Force -ErrorAction SilentlyContinue }
      }
    cleanup: |
      Remove-Item (Join-Path $env:TEMP 'bas_akira_ws_*') -Recurse -Force -ErrorAction SilentlyContinue
      Remove-Item (Join-Path $env:TEMP 'bas_akira_*') -Force -ErrorAction SilentlyContinue
      Remove-Item (Join-Path $env:TEMP 'bas_ransom_*') -Force -ErrorAction SilentlyContinue

  # ===========================================================================
  # Stage 6b — Impact (supp.): Mass-Rename Fan-Out Simulation (T1486)
  # ===========================================================================
  - id: akira-s6b-mass-rename
    name: "Akira Stage 6b — Mass-Rename Fan-Out Simulation (T1486)"
    technique_id: T1486
    detection_profiles:
      - windows_ransomware_encryption
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    severity: critical
    confidence: high
    reversible: true
    depends_on: [akira-s6-ransom-sim]
    blast_radius: "Creates N (default 20, capped 50) BAS-owned plaintext files in a single %TEMP% subdir, renames each to .akira extension in a burst (mimicking mass-encryption fan-out), then deletes the entire subdir. No user data touched. Generates a burst of Sysmon EID 11 (create+rename) and EID 23 (delete)."
    preconditions: ["Stage 6 executed.", "Free %TEMP% >= 16 MB."]
    postconditions: ["Fan-out burst attempted; subdir removed; PASS/FAIL emitted."]
    abort_on: ["Subdir creation fails."]
    telemetry:
      - "Sysmon EID 11: bas_akira_fan_<id>/file_*.txt created (N)"
      - "Sysmon EID 11: rename to *.akira (N)"
      - "Sysmon EID 23: files + subdir deleted"
      - "EDR: file write burst rate (files/sec)"
    detection:
      - "EDR: file-extension-change burst (mass rename) — ransomware fan-out signature"
      - "Defender: ransomware behavior monitoring triggers on .akira extension burst"
      - "SIEM: file rename rate anomaly per process/user"
    expected_telemetry_count: 3
    false_positive_notes: "Bulk-rename scripts (photo/archive tooling) can trigger — correlate extension and destination."
    mitigations:
      - "Controlled Folder Access + Defender ransomware behavior monitoring."
      - "Alert on extension-change burst > threshold within window."
      - "File-server canaries / honeyfiles."
    references: ["MITRE T1486", "CISA AA24-109A"]
    evidence: ["Emit files_created / renames_ok counts."]
    command: |
      $ErrorActionPreference = 'Continue'
      $runId = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0,[Math]::Min(8,$env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 0x7FFFFFFF) }
      $fanDir = Join-Path $env:TEMP "bas_akira_fan_$runId"
      $N = 20
      $created = 0; $renamed = 0; $denied = $false; $otherErr = $false
      $ownDir = $false
      try {
        # Fresh, uniquely named workspace only. An existing directory is refused, never reused.
        if (Test-Path -LiteralPath $fanDir) {
          Write-Output "SKIP: dedicated fan-out workspace already exists; refusing to reuse it. Not scored. [BAS-SIM-AKIRA-S6B]"
          return
        }
        New-Item -ItemType Directory -Path $fanDir -ErrorAction Stop | Out-Null
        $ownDir = $true
        for ($i=0; $i -lt $N; $i++) {
          $p = Join-Path $fanDir ("file_{0:D3}.txt" -f $i)
          try { [System.IO.File]::WriteAllText($p, "[BAS-SIM-AKIRA] fan-out file $i", [System.Text.Encoding]::UTF8); $created++ }
          catch { if ($_.Exception.Message -match 'Access to the path|Access is denied|UnauthorizedAccess') { $denied = $true } else { $otherErr = $true } }
        }
        foreach ($f in @(Get-ChildItem -LiteralPath $fanDir -Filter '*.txt' -ErrorAction Stop)) {
          try { Rename-Item -LiteralPath $f.FullName -NewName ($f.Name -replace '\.txt$','.akira') -ErrorAction Stop; $renamed++ }
          catch { if ($_.Exception.Message -match 'Access to the path|Access is denied|UnauthorizedAccess') { $denied = $true } else { $otherErr = $true } }
        }
        if ($created -ge 1 -or $renamed -ge 1) {
          Write-Output "FAIL: mass-rename burst executed unblocked (created=$created, renamed=$renamed of N=$N). Verify Defender ransomware behavior monitoring and CFA are armed and alerting on extension bursts. [BAS-SIM-AKIRA-S6B]"
        } elseif ($denied -and -not $otherErr) {
          Write-Output "PASS: mass-rename fan-out explicitly denied (access denied) by a control before any file was written or renamed. [BAS-SIM-AKIRA-S6B]"
        } else {
          Write-Output "SKIP: mass-rename outcome is ambiguous (created=$created, renamed=$renamed); not scored. [BAS-SIM-AKIRA-S6B]"
        }
      } catch {
        $msg = $_.Exception.Message
        if ($msg -match 'Access to the path|Access is denied|UnauthorizedAccess') {
          Write-Output "PASS: fan-out workspace creation explicitly denied (access denied) by a control. [BAS-SIM-AKIRA-S6B]"
        } else {
          Write-Output "SKIP: unexpected error during the fan-out simulation; not scored. [BAS-SIM-AKIRA-S6B]"
        }
      } finally {
        if ($ownDir) { Remove-Item -LiteralPath $fanDir -Recurse -Force -ErrorAction SilentlyContinue }
      }
    cleanup: |
      Get-ChildItem -Path $env:TEMP -Filter 'bas_akira_fan_*' -Directory -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

