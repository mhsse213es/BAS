    references: ["CISA AA24-109A", "MITRE T1490", "MITRE T1562.001"]
    evidence: ["Emit bcdedit_recovery_enabled + wbadmin_versions_visible booleans."]
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      # READ-ONLY: /enum, get versions, get status. Never /set, never delete catalog.
      $bcd = (& bcdedit.exe /enum '{default}' 2>&1) -join "`n"
      $recovEnabled = if ($bcd -match 'recoveryenabled\s+(Yes|No)') { $Matches[1] } else { 'unknown' }
      $wbVers = (& wbadmin.exe get versions 2>&1) -join "`n"
      $wbStatus = (& wbadmin.exe get status 2>&1) -join "`n"
      $wbVisible = ($wbVers -notmatch 'There are no backup|No backup versions') -and ($wbVers -notmatch 'Access is denied|not recognized|ERROR')
      Write-Output "EXEC T1490/T1562.001: recovery-config probe (read-only) — bcdedit.recoveryenabled=$recovEnabled, wbadmin versions visible=$wbVisible. Akira issues 'bcdedit /set {default} recoveryenabled No' and 'wbadmin delete catalog' to kill recovery. [BAS-SIM-AKIRA-S8C]"
      if ($recovEnabled -eq 'Yes' -and -not $wbVisible) {
        Write-Output "PASS: Windows Recovery Environment enabled AND no local backup catalog visible — reduces Akira's recovery-inhibition value."
      } elseif ($recovEnabled -eq 'No') {
        Write-Output "FAIL: recoveryenabled=No — Windows RE is disabled; Akira's recovery-inhibition goal is already satisfied on this host. Re-enable with 'bcdedit /set {default} recoveryenabled Yes'."
      } elseif ($wbVisible) {
        Write-Output "INFO: wbadmin backup catalog is visible from endpoint — Akira would attempt 'wbadmin delete catalog'. Ensure off-host immutable copies exist and alert on any write-variant invocation."
      } else {
        Write-Output "INFO: recovery posture inconclusive (output: $($bcd.Trim())). [BAS-SIM-AKIRA-S8C]"
      }
    cleanup: ""

  
