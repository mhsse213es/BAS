      New-Item -ItemType Directory -Path $dir -Force -ErrorAction SilentlyContinue | Out-Null
      $expected = 6
      $created = 0; $transformed = 0; $verified = 0
      $key = 0x41
      if (Test-Path $dir) {
        for ($i = 1; $i -le $expected; $i++) {
          $plain = Join-Path $dir "doc_$i.txt"
          $enc = Join-Path $dir "doc_$i.txt.akira"
