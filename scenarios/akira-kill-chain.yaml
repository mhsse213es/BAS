
# =============================================================================
# Akira Kill Chain — Ransomware Emulation (Extended / Production-Grade Edition)
# =============================================================================
id: akira-kill-chain
version: "2.0.0"
product_line: ransomware
name: Akira Kill Chain — Ransomware Emulation (Extended)
description: >
  Stage-based (16 executable steps; pre-flight gating and the closing scorecard are
  kept out of the step list because the engine requires every step to map to an ATT&CK technique) telemetry-safe emulation of the Akira
  ransomware kill chain targeting Windows endpoints. Reflects documented Akira
  tradecraft validated against CISA AA24-109A: RDP/VPN-without-MFA initial
  access, credential dumping (SAM/SYSTEM + LSASS probe), Defender tampering,
  SMB admin-share lateral movement, staged exfiltration, XOR "encryption"
  simulation, VSS deletion via WMI (Get-WmiObject Win32_ShadowCopy) rather than
  vssadmin, and log clearing. Extended with recovery-inhibition via bcdedit /
  wbadmin (Stage 8c) and anti-forensics via USN journal / prefetch / SRUM
  probes (Stage 9b), both telemetry-safe.

  KILL CHAIN STAGES:
    1.  Initial Access                 — RDP/NLA exposure posture check (T1021.001)
    2.  Discovery                      — network share discovery (T1135)
    3.  Credential Access              — SAM/SYSTEM hive theft via reg save (T1003.002)
    3b. Credential Access (supp.)      — LSASS access-mask probe (T1003.001, read-only)
    4.  Defense Evasion                — Defender exclusion invocation probe (T1562.001)
    5.  Lateral Movement               — SMB admin share reachability check (T1021.002)
    5b. Exfiltration (pre-encryption)  — synthetic record POST to own sink (T1567)
    5c. Discovery / Lateral (supp.)    — SMB share fan-out enumeration (T1135/T1021.002)
    6.  Ransomware Simulation          — XOR-encoded benign file + ransom note, .akira (T1486)
    6b. Impact (supp.)                 — mass-rename fan-out simulation (T1486)
    7.  Recovery Inhibition A          — VSS snapshot enumeration, vssadmin (T1490)
    8.  Recovery Inhibition B          — VSS deletion via WMI Win32_ShadowCopy.Delete() (T1490, lab-only)
    8b. Recovery Inhibition (verify)   — post-deletion VSS survival check (T1490)
    8c. Recovery Inhibition C          — bcdedit/wbadmin recovery-check probe (T1490/T1562.001)
    9.  Log Clearing Attempt           — wevtutil cl attempt, blocked or audit (T1070.001)
    9b. Indicator Removal (supp.)      — USN journal / prefetch / SRUM probe (T1070.001)

  SAFETY: No real encryption of user data. XOR is applied to a single BAS-
  created temp file with [BAS-SIM-AKIRA] content only. Ransom note is cleaned
  up immediately. Stage 8 is lab-only and default-disabled — it requires the
  operator to explicitly set BAS_CONFIRM_VSS_DELETE=true in an isolated lab;
  without it, the step SKIPs with no state change and deletes at most ONE (the
  oldest) real C: shadow copy when enabled. Stages 3b, 4b, 8c, 9b are strictly
  read-only probes (no state change) and are production-safe. All stages are
  production-safe unless explicitly marked. Windows only. [BAS-SIM] tagged
  throughout. Every step is idempotent and carries its own cleanup.

author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
severity: critical
estimated_duration_sec: 360
abort_conditions:
  - "BAS_RUN_ID missing AND BAS_ALLOW_UNTRACKED_RUN != 'true'"
  - "Host is a domain controller AND live_policy.block_on_domain_controller == true"
  - "Free disk in %TEMP% < 64 MB"
  - "PowerShell major version < 5"
tags:
  - akira
  - ransomware
  - bfsi
  - kill-chain
  - t1003
  - t1021
  - t1070
  - t1135
  - t1486
  - t1490
  - t1562
  - t1567
  - mitre
  - bas
  - extended
mitre_phases:
  - initial-access
  - discovery
  - credential-access
  - defense-evasion
  - lateral-movement
  - exfiltration
  - impact
attck_tactics:
  - TA0001  # Initial Access
  - TA0007  # Discovery
  - TA0006  # Credential Access
  - TA0005  # Defense Evasion
  - TA0008  # Lateral Movement
  - TA0010  # Exfiltration
  - TA0040  # Impact
references:
  - "CISA AA24-109A — #StopRansomware: Akira Ransomware"
  - "MITRE ATT&CK T1486, T1490, T1003.002, T1003.001, T1562.001, T1562.006, T1070.001, T1135, T1021.001, T1021.002, T1567"
  - "Sigma: proc_creation_win_reg_save_sam.yml, proc_creation_win_vssadmin_susp_commands.yml, proc_creation_win_net_admin_share_access.yml, proc_creation_win_wevtutil_clear_logs.yml"

live_policy:
  block_on_domain_controller: false
  require_dc_reachable: false
  max_spray_attempts: 0
  spray_account_allowlist: []
  execution_window: ""
  require_run_id: true
  require_temp_disk_mb: 64
  min_powershell_major: 5

# ---------------------------------------------------------------------------
# Run-scoped variables (resolved once, referenced by every step)
# ---------------------------------------------------------------------------
variables:
  run_id: "{{env.BAS_RUN_ID | default(random_hex8)}}"
  temp_dir: "{{env.TEMP}}"
  sim_prefix: "bas_akira_"
  sim_tag: "[BAS-SIM-AKIRA]"

steps:


  # ===========================================================================
  # Stage 1 — Initial Access: RDP / NLA Posture (T1021.001)
  # ===========================================================================
  - id: akira-s1-rdp-nla
    name: "Akira Stage 1 — RDP / NLA Exposure Posture Check (T1021.001)"
    technique_id: T1021.001
    detection_profiles:
      - windows_rdp_nla_posture
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 15
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    severity: medium
    confidence: high
    reversible: true
    depends_on: [akira-s0-preflight]
    blast_radius: "Reads two registry values (read-only): fDenyTSConnections under HKLM Terminal Server, and UserAuthentication under the RDP-Tcp WinStation. No state change. No connection attempted."
    preconditions: ["Stage 0 passed."]
    postconditions: ["RDP/NLA posture emitted as PASS/FAIL."]
    abort_on: ["Registry key access denied to the point both reads fail."]
    telemetry:
      - "Security EID 4657 (registry value queried, if SACL auditing enabled on the key)"
      - "PowerShell EID 4104 if ScriptBlock logging enabled"
    detection:
      - "SIEM: registry query of Terminal Server RDP/NLA configuration from a non-management process — RDP-exposure recon IOC"
    expected_telemetry_count: 1
    false_positive_notes: "Helpdesk/inventory tools also read these keys — correlate with process parent and user context."
    mitigations:
      - "Enforce NLA (UserAuthentication=1) on RDP-Tcp WinStation."
      - "Require MFA on all RDP-reachable endpoints; front RDP with a VPN/gateway."
      - "Alert on non-management-process registry queries of Terminal Server keys."
    references: ["CISA AA24-109A", "MITRE T1021.001"]
    evidence: ["Emit PASS/FAIL/INFO token for the scorecard."]
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $rdpEnabled = (Get-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -ErrorAction SilentlyContinue).fDenyTSConnections -eq 0
      $nlaEnforced = (Get-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -ErrorAction SilentlyContinue).UserAuthentication -eq 1
      Write-Output "EXEC T1021.001: RDP enabled=$rdpEnabled, NLA enforced=$nlaEnforced. Akira's documented initial-access pattern is RDP/VPN access without MFA -- this posture check surfaces the same exposure without attempting an actual logon. [BAS-SIM-AKIRA-S1]"
      if ($rdpEnabled -and -not $nlaEnforced) {
        Write-Output "FAIL: RDP is enabled without Network Level Authentication enforced -- a documented Akira initial-access precondition. Enforce NLA and require MFA on all RDP-reachable endpoints."
      } elseif (-not $rdpEnabled) {
        Write-Output "PASS: RDP is disabled on this endpoint -- Akira's RDP-based initial-access vector does not apply here."
      } else {
        Write-Output "PASS: RDP is enabled with NLA enforced -- reduces (does not eliminate) unauthenticated RDP exposure."
      }
    cleanup: ""

  # ===========================================================================
  # Stage 2 — Discovery: Network Share Discovery (T1135)
  # ===========================================================================
  - id: akira-s2-share-discovery
    name: "Akira Stage 2 — Network Share Discovery (T1135)"
    technique_id: T1135
    detection_profiles:
      - windows_network_share_discovery
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    severity: low
    confidence: high
    reversible: true
    depends_on: [akira-s0-preflight]
    blast_radius: "Enumerates local administrative shares via net view and WMI Win32_Share. No shares accessed, no files read."
    preconditions: ["Stage 0 passed."]
    postconditions: ["Share count emitted."]
    abort_on: []
    telemetry:
      - "Security EID 4688: net.exe and powershell.exe share enumeration"
      - "Security EID 5140: if SACL object access auditing enabled on shares"
    detection:
      - "SIEM: net view / Win32_Share query from non-admin process — ransomware lateral-spread staging signal"
    expected_telemetry_count: 2
    false_positive_notes: "IT inventory tooling also enumerates shares — baseline against known tooling."
    mitigations:
      - "Baseline and alert on net view / Win32_Share enumeration from non-admin user context."
      - "Disable AutoShareWks where policy allows."
    references: ["MITRE T1135"]
    evidence: ["Emit share count for scorecard."]
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $wmiShares = @(Get-WmiObject -Class Win32_Share -ErrorAction SilentlyContinue)
      $netOut = & net view \\$env:COMPUTERNAME 2>&1
      $shareCount = if ($wmiShares) { $wmiShares.Count } else { 0 }
      Write-Output "EXEC: network share discovery — $shareCount share(s) via Win32_Share. net view executed for cmdline telemetry. Akira maps shares before lateral spread and mass encryption. [BAS-SIM-AKIRA-S2]"
    cleanup: ""

  # ===========================================================================
  # Stage 3 — Credential Access: SAM/SYSTEM Hive Theft (T1003.002)
  # ===========================================================================
  - id: akira-s3-sam-theft
    name: "Akira Stage 3 — SAM & SYSTEM Hive Theft via reg save (T1003.002)"
    technique_id: T1003.002
    detection_profiles:
      - windows_sam_theft
    framework: custom
    executor: powershell
    requires_priv: admin
    timeout_sec: 40
    fidelity: lab-only
    production_safe: false
    risk: high
    severity: high
    confidence: high
    reversible: true
    depends_on: [akira-s0-preflight]
    blast_radius: "Attempts reg save HKLM\\SAM and HKLM\\SYSTEM to a temp file, then deletes both immediately. SAM and SYSTEM together provide the material needed for offline password-hash extraction (the bootkey is held in SYSTEM), so this is a genuine credential-exposure risk, not a harmless enumeration. Deleting the copied files does NOT undo the exposure: the hives were readable for the duration of the copy. Generates Sysmon EID 1 (reg.exe save) + EID 11 (file create) + immediate delete. Lab-only; requires explicit lab authorization."
    preconditions: ["Admin privilege.", "Stage 0 passed."]
    postconditions: ["PASS (blocked) or FAIL (unblocked) verdict; temp hives removed regardless."]
    abort_on: ["reg.exe not present AND no alternate hive-save path available."]
    telemetry:
      - "Sysmon EID 1: reg.exe save HKLM\\SAM / HKLM\\SYSTEM"
      - "Sysmon EID 11: hive file written to %TEMP% then deleted"
      - "Security EID 4688: reg.exe with 'save' argument targeting SAM/SYSTEM"
    detection:
      - "EDR: reg.exe save hklm\\sam — Sigma proc_creation_win_reg_save_sam.yml (offline hash-theft IOC)"
      - "SIEM: reg SAVE targeting SAM or SYSTEM hive — page immediately, extremely rare in normal ops"
    expected_telemetry_count: 4
    false_positive_notes: "Backup/imaging software may reg save hives — whitelist known backup agents by signer."
    mitigations:
      - "Block reg.exe save of SAM/SYSTEM via WDAC/AppLocker."
      - "Alert (page) on 'reg save hklm\\sam'."
      - "Deploy LAPS; enable Credential Guard where applicable."
    references: ["MITRE T1003.002", "Sigma proc_creation_win_reg_save_sam.yml"]
    evidence: ["Emit sam_saved/system_saved booleans for scorecard."]
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $runId = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0,[Math]::Min(8,$env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 0x7FFFFFFF) }
      $samOut = Join-Path $env:TEMP "bas_akira_sam_$runId.hive"
      $sysOut = Join-Path $env:TEMP "bas_akira_sys_$runId.hive"
      & reg.exe save HKLM\SAM $samOut /y 2>&1 | Out-Null
      & reg.exe save HKLM\SYSTEM $sysOut /y 2>&1 | Out-Null
      $samSaved = Test-Path $samOut
      $sysSaved = Test-Path $sysOut
      Remove-Item $samOut,$sysOut -Force -ErrorAction SilentlyContinue
      if ($samSaved -or $sysSaved) {
        Write-Output "EXEC T1003.002: reg save of SAM=$samSaved SYSTEM=$sysSaved to %TEMP% then deleted. Akira steals these hives for OFFLINE hash extraction and LSASS-adjacent credential dumping. reg.exe SAVE telemetry (Sysmon EID 1) expected. [BAS-SIM-AKIRA-S3]"
        Write-Output "FAIL: reg.exe was able to SAVE the SAM/SYSTEM hive unblocked — local password hashes can be exfiltrated for offline cracking. 'reg save hklm\\sam' should be a paging alert. Verify EDR blocked or at least alerted."
      } else {
        Write-Output "PASS: reg save of SAM/SYSTEM was blocked or denied — EDR/WDAC prevented offline hive theft. [BAS-SIM-AKIRA-S3]"
      }
    cleanup: |
      Remove-Item (Join-Path $env:TEMP 'bas_akira_sam_*') -Force -ErrorAction SilentlyContinue
      Remove-Item (Join-Path $env:TEMP 'bas_akira_sys_*') -Force -ErrorAction SilentlyContinue

  # ===========================================================================
  # Stage 3b — Credential Access (supp.): LSASS Access-Mask Probe (T1003.001)
  # ===========================================================================
  - id: akira-s3b-lsass-probe
    name: "Akira Stage 3b — LSASS Access-Mask Probe (read-only) (T1003.001)"
    technique_id: T1003.001
    detection_profiles:
      - windows_lsass_access
    framework: custom
    executor: powershell
    requires_priv: admin
    timeout_sec: 20
    fidelity: lab-only
    production_safe: false
    risk: medium
    severity: high
    confidence: medium
    reversible: true
    depends_on: [akira-s3-sam-theft]
    blast_radius: "Requests a PROCESS_VM_READ (0x10) handle to lsass.exe, then closes it immediately. No memory is read, nothing is dumped or copied, and no credentials are extracted. A granted handle is recorded as FAIL and a denied handle as PASS. This tests handle-access permission only: it does NOT demonstrate that credential dumping is possible. Opening this handle triggers EDR alerts by design. Lab-only; requires explicit lab authorization."
    preconditions: ["Admin privilege.", "Stage 3 executed."]
    postconditions: ["Access-mask verdict emitted (granted / denied / PPL-protected)."]
    abort_on: ["LSASS process not found."]
    telemetry:
      - "Sysmon EID 10: ProcessAccess targeting lsass.exe (GrantedAccess logged)"
      - "EDR: LSASS handle-open from powershell.exe — high-fidelity credential-theft signal"
    detection:
      - "EDR: ProcessAccess to lsass.exe from non-allowlisted process — Sigma rule on LSASS access (GrantedAccess 0x1010/0x1410 etc.)"
      - "SIEM: EID 10 LSASS access with suspicious GrantedAccess"
    expected_telemetry_count: 1
    false_positive_notes: "AV/EDR themselves open LSASS — correlate by signer and known security processes."
    mitigations:
      - "Enable LSA Protection (RunAsPPL) and Credential Guard."
      - "Alert on non-allowlisted PROCESS_VM_READ of lsass.exe."
      - "WDAC block of unsigned PowerShell interpreters performing process access."
    references: ["MITRE T1003.001"]
    evidence: ["Emit granted_access mask + ppl_enabled boolean."]
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $lsassSig = @(
        '[DllImport("kernel32.dll", SetLastError=true)] public static extern IntPtr OpenProcess(uint a, bool i, int p);',
        '[DllImport("kernel32.dll", SetLastError=true)] public static extern bool CloseHandle(IntPtr h);'
      ) -join "`n"
      if (-not ('BAS.LsassProbe' -as [type])) {
        try { Add-Type -Namespace BAS -Name LsassProbe -MemberDefinition $lsassSig -ErrorAction Stop }
        catch { Write-Output "SKIP T1003.001: could not compile the access-check helper; outcome unverifiable, step not scored. [BAS-SIM-AKIRA-S3B]"; return }
      }
      $lsass = Get-Process -Name lsass -ErrorAction SilentlyContinue | Select-Object -First 1
      if (-not $lsass) { Write-Output "SKIP T1003.001: lsass.exe not found; step not scored. [BAS-SIM-AKIRA-S3B]"; return }
      # 0x0010 = PROCESS_VM_READ. The handle is opened and closed at once; no memory is read.
      $h = [BAS.LsassProbe]::OpenProcess(0x0010, $false, $lsass.Id)
      if ($h -ne [IntPtr]::Zero) {
        [void][BAS.LsassProbe]::CloseHandle($h)
        Write-Output "FAIL: a PROCESS_VM_READ handle to lsass.exe was granted to this process. Handle-access permission is open. This is a precondition for credential dumping, not a demonstration of it. [BAS-SIM-AKIRA-S3B]"
      } else {
        $err = [Runtime.InteropServices.Marshal]::GetLastWin32Error()
        Write-Output "PASS: a PROCESS_VM_READ handle to lsass.exe was denied (Win32Error=$err). Handle-access control is in effect. [BAS-SIM-AKIRA-S3B]"
      }
    cleanup: ""

  # ===========================================================================
  # Stage 4 — Defense Evasion: Defender Exclusion Invocation (T1562.001)
  # ===========================================================================
  - id: akira-s4-defender-exclusion
    name: "Akira Stage 4 — Defender Exclusion Configuration Check (read-only, no state change) (T1562.001)"
    technique_id: T1562.001
    detection_profiles:
      - windows_defender_tampering
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 20
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    severity: high
    confidence: high
    reversible: true
    depends_on: [akira-s0-preflight]
    blast_radius: "Reads Defender exclusion preferences with Get-MpPreference. Read-only; changes nothing. This is a configuration-state check, not a telemetry test: it does not verify whether Defender logs an exclusion modification, and it never runs Add-MpPreference."
    preconditions: ["Stage 0 passed."]
    postconditions: ["Defender exclusion state verdict emitted (TEMP excluded / not excluded / unreadable)."]
    abort_on: []
    telemetry:
      - "Expected: none. A read-only Get-MpPreference query generates no exclusion-change telemetry."
    detection:
      - "Configuration exposure: $env:TEMP excluded from Defender scanning (FAIL)"
    expected_telemetry_count: 0
    false_positive_notes: "Legit management tooling adds exclusions — whitelist by signer/known management host."
    mitigations:
      - "Enable Tamper Protection on Defender."
      - "Alert on Add-MpPreference from non-management process/user."
      - "Use managed Defender exclusions only."
    references: ["MITRE T1562.001", "CISA AA24-109A"]
    evidence: ["Emit Defender exclusion state for TEMP (excluded / not excluded / unreadable)."]
    command: |
      $ErrorActionPreference = "Stop"
      try {
        $prefs = Get-MpPreference -ErrorAction Stop
        $excl = @($prefs.ExclusionPath) | Where-Object { $_ }
        $tmp = $env:TEMP.TrimEnd("\")
        $tempExcluded = @($excl | Where-Object { $tmp.StartsWith($_.TrimEnd("\"), [StringComparison]::OrdinalIgnoreCase) }).Count -gt 0
        if ($tempExcluded) {
          Write-Output "FAIL: $env:TEMP is excluded from Defender scanning. Read-only configuration check; Security state NOT changed. [BAS-SIM-AKIRA-S4]"
        } else {
          Write-Output "PASS: $env:TEMP is not excluded from Defender scanning. Read-only configuration check. [BAS-SIM-AKIRA-S4]"
        }
      } catch {
        Write-Output "SKIP: Defender preferences could not be read ($($_.Exception.Message)); configuration state unknown, step not scored. [BAS-SIM-AKIRA-S4]"
      }
    cleanup: ""


  # ===========================================================================
  # Stage 5 — Lateral Movement: SMB Admin Share Probe (T1021.002)
  # ===========================================================================
  - id: akira-s5-smb-admin
    name: "Akira Stage 5 — SMB Admin Share Lateral Movement Probe (T1021.002)"
    technique_id: T1021.002
    detection_profiles:
      - windows_smb_lateral_probe
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 20
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    severity: medium
    confidence: high
    reversible: true
    depends_on: [akira-s2-share-discovery]
    blast_radius: "Tests whether \\\\127.0.0.1\\ADMIN$ is accessible with the current user token via net use (loopback). Disconnects immediately. Generates Security EID 4624 Type 3 + Sysmon EID 3 loopback."
    preconditions: ["Stage 2 executed."]
    postconditions: ["Reachability verdict emitted; any loopback mount removed."]
    abort_on: []
    telemetry:
      - "Sysmon EID 1: net.exe with use \\\\127.0.0.1\\ADMIN$ argument"
      - "Security EID 4624: Logon Type 3 (network) from 127.0.0.1 to ADMIN$"
      - "Security EID 5140: network share ADMIN$ accessed"
    detection:
      - "EDR: net use to ADMIN$ from PowerShell  -  Sigma rule proc_creation_win_net_admin_share_access.yml"
      - "SIEM: EID 5140 access to ADMIN$ outside of IT provisioning window — lateral movement IOC"
    expected_telemetry_count: 3
    false_positive_notes: "IT provisioning legitimately maps ADMIN$ — correlate with change window and user."
    mitigations:
      - "Set AutoShareWks=0 via GPO; enforce SMB signing + LAPS."
      - "Alert on net use ADMIN$ from user context."
    references: ["MITRE T1021.002", "Sigma proc_creation_win_net_admin_share_access.yml"]
    evidence: ["Emit accessible/authFailed tokens."]
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $netOut = & net use '\\127.0.0.1\ADMIN$' 2>&1 | Out-String
      & net use '\\127.0.0.1\ADMIN$' /delete 2>&1 | Out-Null
      $accessible = $netOut -match 'command completed successfully'
      $authFailed = $netOut -match 'System error 5|Access is denied|System error 1326|logon failure'
      if ($accessible) {
        Write-Output "EXEC T1021.002: \\\\127.0.0.1\\ADMIN$ accessible with current token (disconnected). Akira would use harvested creds here to push its encryptor laterally. Security EID 5140 logged. [BAS-SIM-AKIRA-S5]"
        Write-Output "FAIL: ADMIN$ share accessible from user context — disable admin shares via GPO (AutoShareWks=0) or ensure SMB signing + LAPS is enforced."
      } elseif ($authFailed) {
        Write-Output "PASS: ADMIN$ access denied (auth failure or disabled)  -  lateral movement via admin share blocked. [BAS-SIM-AKIRA-S5]"
      } else {
        Write-Output "INFO: ADMIN$ probe result inconclusive: $($netOut.Trim()). [BAS-SIM-AKIRA-S5]"
      }
    cleanup: |
      & net use '\\127.0.0.1\ADMIN$' /delete 2>&1 | Out-Null

  # ===========================================================================
  # Stage 5b — Pre-Encryption Data Staging & Exfiltration (T1567)
  # ===========================================================================
  - id: akira-s5b-exfil-staging
    name: "Akira Stage 5b — Pre-Encryption Data Staging Exfiltration (T1567)"
    technique_id: T1567
    detection_profiles:
      - windows_dlp_exfiltration
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: lab-only
    production_safe: false
    risk: low
    severity: high
    confidence: medium
    reversible: true
    depends_on: [akira-s5-smb-admin]
    blast_radius: "POSTs one synthetic, regulated-format customer record over HTTPS to an explicitly configured sink. It is sent ONLY if the sink host is listed in the BAS_SINK_ALLOWED_HOSTS environment variable; otherwise nothing is sent and the step SKIPs. Never sent to an arbitrary destination. Lab-only; requires explicit lab authorization. The reachability probe has been removed: it added a second send with no verdict."
    preconditions: ["Stage 5 executed."]
    postconditions: ["Staging POST attempted; outcome emitted."]
    abort_on: ["SINK_URL/SINK_TOKEN unresolved — stage SKIPs rather than POST to an unknown host."]
    telemetry:
      - "Sysmon EID 3: network connection to the orchestrator's own HTTPS port"
      - "Sysmon EID 22: DNS query for sink host (if name-based)"
    detection:
      - "DLP: outbound HTTPS POST body matching regulated-data patterns (PAN/Aadhaar/credit-card regex)"
      - "Proxy/SWG: POST to non-baselined destination carrying regulated-data shapes"
    expected_telemetry_count: 2
    false_positive_notes: "Business apps legitimately POST customer records — DLP must scope to the sink/unknown destinations and correlate with process context."
    mitigations:
      - "DLP with regulated-data patterns (PAN, Aadhaar, credit-card) on egress HTTPS."
      - "Egress allow-listing; alert on POST to non-baselined destinations."
      - "CASB/SWG inspection of TLS where lawful."
    references: ["MITRE T1567", "CISA AA24-109A (double extortion)"]
    evidence: ["Emit staging_ok boolean and the sink HTTP status, if any."]
    command: |
      $ErrorActionPreference = 'Continue'
      # Placeholders are filled by the orchestrator only for sink-wired runs.
      $sinkUrl   = '{{SINK_URL}}'
      $sinkToken = '{{SINK_TOKEN}}'
      if ($sinkUrl -match '^\{\{' -or $sinkToken -match '^\{\{') {
        Write-Output "SKIP: sink URL/token placeholder is not filled in; nothing was sent. [BAS-SIM-AKIRA-S5B]"
        return
      }
      # Explicit allow-list. Nothing is sent unless the sink host is listed in BAS_SINK_ALLOWED_HOSTS.
      $allowed = @($env:BAS_SINK_ALLOWED_HOSTS -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
      $uri = $null
      try { $uri = [Uri]$sinkUrl } catch { $uri = $null }
      if (-not $uri -or @('http','https') -notcontains $uri.Scheme -or $allowed -notcontains $uri.Host) {
        Write-Output "SKIP: sink destination is not in the explicitly configured allow-list (BAS_SINK_ALLOWED_HOSTS); nothing was sent. [BAS-SIM-AKIRA-S5B]"
        return
      }
      $staged = "[BAS-SIM-AKIRA-S5B] CustomerID,PAN,Aadhaar,CreditCard`nBAS-SIM-SINK,ABCDE1234F,123456789012,4111111111111111"
      try {
        Invoke-RestMethod -Uri $uri -Method Post -Body (@{token=$sinkToken; payload=$staged; channel='https-post'} | ConvertTo-Json) -ContentType 'application/json' -TimeoutSec 10 | Out-Null
        Write-Output "FAIL: synthetic regulated-data record reached the allow-listed sink over HTTPS without a block. DLP did not match PAN/Aadhaar/card patterns on egress. [BAS-SIM-AKIRA-S5B]"
      } catch {
        $resp = $_.Exception.Response
        $status = if ($resp) { [int]$resp.StatusCode } else { 0 }
        if ($status -eq 403) {
          Write-Output "PASS: egress HTTPS POST explicitly denied with HTTP 403 by a control. [BAS-SIM-AKIRA-S5B]"
        } else {
          Write-Output "SKIP: POST outcome is ambiguous (status=$status, $($_.Exception.Message)). Cannot tell a block from a failure; not scored. [BAS-SIM-AKIRA-S5B]"
        }
      }
    cleanup: ""

