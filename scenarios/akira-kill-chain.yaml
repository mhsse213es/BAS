    risk: low
    severity: critical
    confidence: high
    reversible: true
    depends_on: [akira-s6-ransom-sim]
    blast_radius: "Creates N (default 20, capped 50) BAS-owned plaintext files in a single %TEMP% subdir, renames each to .akira extension in a burst (mimicking mass-encryption fan-out), then deletes the entire subdir. No user data touched. Generates a burst of Sysmon EID 11 (create+rename) and EID 23 (delete)."
    preconditions: ["Stage 6 executed.", "Free %TEMP% >= 16 MB."]
    postconditions: ["Fan-out burst attempted; subdir removed; PASS/FAIL emitted."]
    abort_on: ["Subdir creation fails."]
    telemetry:
      - "Sysmon EID 11: bas_akira_fan_<id>/file_*.txt created (N)"
      - "Sysmon EID 11: rename to *.akira (N)"
      - "Sysmon EID 23: files + subdir deleted"
      - "EDR: file write burst rate (files/sec)"
    detection:
      - "EDR: file-extension-change burst (mass rename) — ransomware fan-out signature"
      - "Defender: ransomware behavior monitoring triggers on .akira extension burst"
      - "SIEM: file rename rate anomaly per process/user"
    expected_telemetry_count: 3
    false_positive_notes: "Bulk-rename scripts (photo/archive tooling) can trigger — correlate extension and destination."
    mitigations:
      - "Controlled Folder Access + Defender ransomware behavior monitoring."
      - "Alert on extension-change burst > threshold within window."
      - "File-server canaries / honeyfiles."
    references: ["MITRE T1486", "CISA AA24-109A"]
    evidence: ["Emit files_created / renames_ok counts."]
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $runId = if ($env:BAS_RUN_ID) { $env:BAS_RUN_ID.Substring(0,[Math]::Min(8,$env:BAS_RUN_ID.Length)) } else { '{0:x8}' -f (Get-Random -Maximum 0x7FFFFFFF) }
      $fanDir = Join-Path $env:TEMP "bas_akira_fan_$runId"
      New-Item -ItemType Directory -Path $fanDir -Force -ErrorAction SilentlyContinue | Out-Null
      $N = 20
      $created = 0; $renamed = 0
      for ($i=0; $i -lt $N; $i++) {
        $p = Join-Path $fanDir ("file_{0:D3}.txt" -f $i)
        try { [System.IO.File]::WriteAllText($p, "[BAS-SIM-AKIRA] fan-out file $i", [System.Text.Encoding]::UTF8); $created++ } catch {}
      }
      Get-ChildItem -Path $fanDir -Filter '*.txt' -ErrorAction SilentlyContinue | ForEach-Object {
        try { Rename-Item -Path $_.FullName -NewName ($_.Name -replace '\.txt$','.akira') -Force -ErrorAction SilentlyContinue; $renamed++ } catch {}
      }
      Remove-Item $fanDir -Recurse -Force -ErrorAction SilentlyContinue
      $cleaned = -not (Test-Path $fanDir)
      Write-Output "EXEC T1486: mass-rename fan-out — created=$created renamed=$renamed (N=$N), cleaned=$cleaned. Sysmon EID 11 burst expected. Akira renames every reachable file to .akira before locking. [BAS-SIM-AKIRA-S6B]"
