id: credential-keys-certs-discovery
product_line: dlp
name: Private Key and Certificate Discovery Probe
description: >
  Telemetry-safe emulation of an adversary surveying for private keys and
  certificates they could use to authenticate or decrypt: key and certificate files
  in the user's profile, SSH keys, and certificates with a private key in the
  current user's certificate store. Only counts are recorded. No key or certificate
  is opened, exported, or read, and no private key is accessed.

  KILL CHAIN STAGES:
    1. Key and Certificate Survey — count key-material files and private-key certificates (T1552.004)

  SAFETY: Read-only. Files are matched by name and extension and counted. The
  certificate store is queried for count and HasPrivateKey only; nothing is exported
  and no key is accessed. Windows only. Telemetry mode.
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - credentials
  - private-keys
  - certificates
  - detection
  - t1552
  - mitre
mitre_phases:
  - credential-access

live_policy:
  block_on_domain_controller: true
  require_dc_reachable: false
  max_spray_attempts: 0
  spray_account_allowlist: []
  execution_window: ""

steps:

  # ---------------------------------------------------------------------------
  # Stage 1 — Key and Certificate Survey (T1552.004)
  # ---------------------------------------------------------------------------
  - name: "Keys and Certs 1 — Key-Material File and Private-Key Certificate Count (T1552.004)"
    technique_id: T1552.004
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Counts files with key-material extensions (.pfx, .p12, .pem, .key, .ppk) and SSH key names (id_rsa, id_ed25519) in the profile's .ssh, Documents and Desktop folders, and counts certificates in Cert:\\CurrentUser\\My that have a private key. No file is opened, and no key or certificate is exported or accessed."
    telemetry:
      - "Sysmon EID 1: powershell.exe with a recursive key-file search"
      - "PowerShell EID 4104: Get-ChildItem on Cert:\\CurrentUser\\My"
    detection:
      - "EDR/DLP: enumeration of private keys and certificates from a user context — credential-theft precursor"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $exts = @('.pfx','.p12','.pem','.key','.ppk')
      $names = @('id_rsa','id_ed25519','id_ecdsa')
      $roots = @((Join-Path $env:USERPROFILE '.ssh'), (Join-Path $env:USERPROFILE 'Documents'), (Join-Path $env:USERPROFILE 'Desktop')) | Where-Object { Test-Path $_ }
      $files = @()
      foreach ($r in $roots) {
        $files += Get-ChildItem -Path $r -File -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 2000 | Where-Object { ($exts -contains $_.Extension.ToLower()) -or ($names -contains $_.Name) }
      }
      $certs = @(Get-ChildItem -Path Cert:\CurrentUser\My -ErrorAction SilentlyContinue | Where-Object { $_.HasPrivateKey })
      Write-Output "EXEC T1552.004: found $(@($files).Count) key-material file(s) and $($certs.Count) certificate(s) with a private key. No key was opened or exported. Keys Stage 1. [BAS-SIM-KEY-S1]"
      if ((@($files).Count + $certs.Count) -gt 0) {
        Write-Output "FAIL: Private keys and private-key certificates were enumerated from a user context with no alert. Key-material discovery precedes authentication abuse and should be detected."
      } else {
        Write-Output "PASS: No key-material files or private-key certificates were present."
      }
    cleanup: ""
