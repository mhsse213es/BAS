id: appcontrol-efficacy
name: "Application Control Efficacy — Behavioral Validation"
description: >
  Controlled, benign behavioral tests of whether application control blocks
  execution along the paths it claims to cover. Each step captures the
  effective enforcement coverage immediately before its attempt, runs one
  benign [BAS-SIM] marker through the path under test, and resolves the result
  with an enforcement oracle. blocked_as_expected requires BOTH the marker to
  be absent AND exactly one correlated control block event naming the attempted
  binary, file, or parent, with the controlling collection enforced. Anything
  unreadable, ambiguous, or unattributable is inconclusive, never a pass.

  Families: indirect_execution (cmd.exe parent), alternate_binary (renamed
  powershell.exe), script_host_proxy (cscript running a benign .vbs),
  alternate_ps_host (pwsh.exe, only where installed), parent_child_asr (a
  renamed cmd.exe spoofing an Office parent, against the Office child-process
  ASR rule).

  Each step also reports telemetry visibility separately (APPCTL_DETECTION):
  whether Sysmon process-creation telemetry recorded the attempt. Visibility is
  not an EDR verdict and does not change the prevention outcome.

  Results hold only for the tested Windows build and policy version. In-process
  PowerShell hosting is not included; see the feasibility record.

  Run only in an authorized test context. Each step is self-cleaning.
author: Audspect Research
executable: true
supported_os: [windows]
tags:
  - application-control
  - appcontrol-efficacy
  - behavioral
mitre_phases:
  - execution
  - defense-evasion

steps:
  - name: "Application control indirect execution via cmd.exe parent (T1202)"
    technique_id: T1202
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: telemetry-safe
    production_safe: false
    risk: medium
    reversible: true
    blast_radius: "Launches one benign cmd.exe -> powershell.exe marker command; writes one temp output file, deleted in cleanup. Changes no policy."
    telemetry:
      - "AppLocker EXE and DLL event 8004 (block) naming powershell.exe, if enforced"
      - "Sysmon EID 1: cmd.exe with powershell.exe child"
    detection:
      - "AppLocker block event correlated to this test's window and binary"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $expected = 'blocked'
      $tid = [guid]::NewGuid().ToString('N')
      $marker = "BAS-SIM-APPCTL-$tid"
      $exe = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
      $needle = Split-Path $exe -Leaf
      $tmp = Join-Path $env:TEMP "bas-appctl-$tid.txt"

      function Get-AppCtlModes {
        $modes = @{}
        # __readable is False when the AppLocker policy cannot be read at all,
        # as on editions without AppLocker. That is not the same as a policy
        # with no collections.
        $modes['__readable'] = $false
        try {
          $pol = Get-AppLockerPolicy -Effective -ErrorAction Stop
          $modes['__readable'] = $true
          foreach ($rc in @($pol.RuleCollections)) { $modes[[string]$rc.RuleCollectionType] = [string]$rc.EnforcementMode }
        } catch {}
        foreach ($t in 'Exe','Script','Dll','Msi','Appx') { if (-not $modes.ContainsKey($t)) { $modes[$t] = 'NotConfigured' } }
        return $modes
      }

      # Pure decision: no I/O. Every input is observed by the caller.
      function Resolve-AppCtlOutcome {
        param([string]$Expected, [string]$Coverage, [bool]$Ran, [int]$AttrCount, [bool]$LogReadable, [bool]$ControlAvailable)
        if (-not $ControlAvailable) { return @{ Outcome = 'not_applicable'; Reason = 'the tested mechanism or its enforcement control is unavailable on this host (service not running, not installed, or not readable)' } }
        if (-not $LogReadable) { return @{ Outcome = 'inconclusive'; Reason = 'the enforcement event log is unreadable; execution cannot be attributed' } }
        if ($Ran) {
          if ($Expected -eq 'blocked') {
            if ($Coverage -eq 'Enabled') { return @{ Outcome = 'allowed_unexpectedly'; Reason = 'executed although the controlling collection is Enabled' } }
            return @{ Outcome = 'not_enforced'; Reason = "executed; controlling collection mode is $Coverage" }
          }
          return @{ Outcome = 'allowed_by_policy'; Reason = 'executed; the contract expects this path to be allowed' }
        }
        if ($Expected -eq 'allowed') { return @{ Outcome = 'inconclusive'; Reason = 'not executed although the contract expects it allowed' } }
        if ($AttrCount -ne 1) { return @{ Outcome = 'inconclusive'; Reason = "not executed; $AttrCount matching block events (exactly 1 required for attribution)" } }
        if ($Coverage -ne 'Enabled') { return @{ Outcome = 'inconclusive'; Reason = "block event present but controlling collection mode is $Coverage" } }
        return @{ Outcome = 'blocked_as_expected'; Reason = 'not executed; one matching control block event for this binary' }
      }

      $modes = Get-AppCtlModes
      $coverage = $modes['Exe']
      $control = ((Get-Service -Name AppIDSvc -ErrorAction SilentlyContinue).Status -eq 'Running') -and $modes['__readable']
      $start = Get-Date
      $p = Start-Process -FilePath cmd.exe -ArgumentList "/d /s /c `"`"$exe`" -NoProfile -NonInteractive -Command Write-Output $marker`"" -WindowStyle Hidden -PassThru -Wait -RedirectStandardOutput $tmp
      $exit = $p.ExitCode
      $out = Get-Content -Path $tmp -ErrorAction SilentlyContinue
      $ran = [bool](($out -join "`n") -like "*$marker*")
      $logReadable = $true
      $attr = 0
      try {
        $ev = @(Get-WinEvent -FilterHashtable @{ LogName = 'Microsoft-Windows-AppLocker/EXE and DLL'; Id = 8004; StartTime = $start } -ErrorAction Stop)
        $attr = @($ev | Where-Object { $_.Message -like "*$needle*" }).Count
      } catch { $logReadable = $false }
      $r = Resolve-AppCtlOutcome -Expected $expected -Coverage $coverage -Ran $ran -AttrCount $attr -LogReadable $logReadable -ControlAvailable $control
      Remove-Item $tmp -Force -ErrorAction SilentlyContinue

      Write-Output "APPCTL_FAMILY: indirect_execution"
      Write-Output "APPCTL_COVERAGE: Exe=$coverage"
      Write-Output "APPCTL_EVIDENCE: test_id=$tid expected=$expected ran=$ran exit=$exit attributed=$attr log_readable=$logReadable capture=$((Get-Date).ToString('o'))"
      $det = 'unknown'
      try {
        $sy = @(Get-WinEvent -FilterHashtable @{ LogName = 'Microsoft-Windows-Sysmon/Operational'; Id = 1; StartTime = $start } -ErrorAction Stop)
        $det = if (@($sy | Where-Object { $_.Message -like "*$tid*" }).Count -gt 0) { 'visible' } else { 'not_visible' }
      } catch {}
      Write-Output "APPCTL_DETECTION: source=sysmon_process_create result=$det"
      Write-Output "APPCTL_OUTCOME: $($r.Outcome)"
      switch ($r.Outcome) {
        'blocked_as_expected' { Write-Output "PASS: $($r.Reason). [BAS-SIM]" }
        'allowed_by_policy'   { Write-Output "PASS: $($r.Reason). [BAS-SIM]" }
        'allowed_unexpectedly' { Write-Output "FAIL: $($r.Reason). [BAS-SIM]" }
        'not_enforced'        { Write-Output "FAIL: $($r.Reason). [BAS-SIM]" }
        default               { Write-Output "SKIP: $($r.Reason). [BAS-SIM]" }
      }
    cleanup: |
      Remove-Item (Join-Path $env:TEMP 'bas-appctl-*.txt') -Force -ErrorAction SilentlyContinue

  - name: "Application control alternate binary: renamed powershell.exe copy (T1036)"
    technique_id: T1036
