  - name: "Application control script host proxy: cscript runs a benign .vbs (T1059.005)"
    technique_id: T1059.005
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: telemetry-safe
    production_safe: false
    risk: medium
    reversible: true
    blast_radius: "Writes one benign .vbs that echoes a marker, runs it under cscript.exe, deletes it. Changes no policy."
    telemetry:
      - "AppLocker MSI and Script event 8006 (block) naming the unique .vbs, if enforced"
      - "Sysmon EID 1: cscript.exe with the unique .vbs argument"
    detection:
      - "AppLocker script block event for this test's unique .vbs file"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $expected = 'blocked'
      $tid = [guid]::NewGuid().ToString('N')
      $marker = "BAS-SIM-APPCTL-$tid"
      $vbs = Join-Path $env:TEMP "bas-appctl-$tid.vbs"
      $tmp = Join-Path $env:TEMP "bas-appctl-$tid.txt"

      function Get-AppCtlModes {
        $modes = @{}
        # __readable is False when the AppLocker policy cannot be read at all,
        # as on editions without AppLocker. That is not the same as a policy
        # with no collections.
        $modes['__readable'] = $false
        try {
          $pol = Get-AppLockerPolicy -Effective -ErrorAction Stop
          $modes['__readable'] = $true
          foreach ($rc in @($pol.RuleCollections)) { $modes[[string]$rc.RuleCollectionType] = [string]$rc.EnforcementMode }
        } catch {}
        foreach ($t in 'Exe','Script','Dll','Msi','Appx') { if (-not $modes.ContainsKey($t)) { $modes[$t] = 'NotConfigured' } }
        return $modes
      }

      function Resolve-AppCtlOutcome {
        param([string]$Expected, [string]$Coverage, [bool]$Ran, [int]$AttrCount, [bool]$LogReadable, [bool]$ControlAvailable)
        if (-not $ControlAvailable) { return @{ Outcome = 'not_applicable'; Reason = 'the tested mechanism or its enforcement control is unavailable on this host (service not running, not installed, or not readable)' } }
        if (-not $LogReadable) { return @{ Outcome = 'inconclusive'; Reason = 'the enforcement event log is unreadable; execution cannot be attributed' } }
        if ($Ran) {
          if ($Expected -eq 'blocked') {
            if ($Coverage -eq 'Enabled') { return @{ Outcome = 'allowed_unexpectedly'; Reason = 'script executed although the Script collection is Enabled' } }
            return @{ Outcome = 'not_enforced'; Reason = "script executed; Script collection mode is $Coverage" }
          }
          return @{ Outcome = 'allowed_by_policy'; Reason = 'script executed; the contract expects it allowed' }
        }
        if ($Expected -eq 'allowed') { return @{ Outcome = 'inconclusive'; Reason = 'not executed although the contract expects it allowed' } }
        if ($AttrCount -ne 1) { return @{ Outcome = 'inconclusive'; Reason = "not executed; $AttrCount matching script block events (exactly 1 required for attribution)" } }
        if ($Coverage -ne 'Enabled') { return @{ Outcome = 'inconclusive'; Reason = "block event present but Script collection mode is $Coverage" } }
        return @{ Outcome = 'blocked_as_expected'; Reason = 'script not executed; one matching AppLocker script block event' }
      }

      $modes = Get-AppCtlModes
      $coverage = $modes['Script']
      $control = ((Get-Service -Name AppIDSvc -ErrorAction SilentlyContinue).Status -eq 'Running') -and $modes['__readable']
      $needle = Split-Path $vbs -Leaf
      Set-Content -Path $vbs -Value "WScript.Echo `"$marker`""
      $start = Get-Date
      $p = Start-Process -FilePath cscript.exe -ArgumentList "//nologo `"$vbs`"" -WindowStyle Hidden -PassThru -Wait -RedirectStandardOutput $tmp
      $exit = $p.ExitCode
      $out = Get-Content -Path $tmp -ErrorAction SilentlyContinue
      $ran = [bool](($out -join "`n") -like "*$marker*")
      $logReadable = $true
      $attr = 0
      try {
        $ev = @(Get-WinEvent -FilterHashtable @{ LogName = 'Microsoft-Windows-AppLocker/MSI and Script'; Id = 8006; StartTime = $start } -ErrorAction Stop)
