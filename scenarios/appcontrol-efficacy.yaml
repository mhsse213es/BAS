            return @{ Outcome = 'not_enforced'; Reason = "renamed copy executed; Exe collection mode is $Coverage" }
          }
          return @{ Outcome = 'allowed_by_policy'; Reason = 'renamed copy executed; the contract expects it allowed' }
        }
        if ($Expected -eq 'allowed') { return @{ Outcome = 'inconclusive'; Reason = 'not executed although the contract expects it allowed' } }
        if ($AttrCount -ne 1) { return @{ Outcome = 'inconclusive'; Reason = "not executed; $AttrCount matching block events (exactly 1 required for attribution)" } }
        if ($Coverage -ne 'Enabled') { return @{ Outcome = 'inconclusive'; Reason = "block event present but Exe collection mode is $Coverage" } }
        return @{ Outcome = 'blocked_as_expected'; Reason = 'renamed copy not executed; one matching AppLocker block event' }
      }

      $modes = Get-AppCtlModes
      $coverage = $modes['Exe']
      $control = ((Get-Service -Name AppIDSvc -ErrorAction SilentlyContinue).Status -eq 'Running') -and $modes['__readable'] -and ([Environment]::OSVersion.Version.Build -ge 17763)
      $needle = Split-Path $exe -Leaf
      Copy-Item -Path $src -Destination $exe -Force
      $start = Get-Date
      $p = Start-Process -FilePath cmd.exe -ArgumentList "/d /s /c `"`"$exe`" -NoProfile -NonInteractive -Command Write-Output $marker`"" -WindowStyle Hidden -PassThru -Wait -RedirectStandardOutput $tmp
      $exit = $p.ExitCode
      $out = Get-Content -Path $tmp -ErrorAction SilentlyContinue
      $ran = [bool](($out -join "`n") -like "*$marker*")
      $logReadable = $true
      $attr = 0
      try {
        $ev = @(Get-WinEvent -FilterHashtable @{ LogName = 'Microsoft-Windows-AppLocker/EXE and DLL'; Id = 8004; StartTime = $start } -ErrorAction Stop)
        $attr = @($ev | Where-Object { $_.Message -like "*$needle*" }).Count
      } catch { $logReadable = $false }
      $r = Resolve-AppCtlOutcome -Expected $expected -Coverage $coverage -Ran $ran -AttrCount $attr -LogReadable $logReadable -ControlAvailable $control
      Remove-Item $tmp -Force -ErrorAction SilentlyContinue
      Remove-Item $exe -Force -ErrorAction SilentlyContinue

      Write-Output "APPCTL_FAMILY: alternate_binary"
      Write-Output "APPCTL_HOST: os_build=$([Environment]::OSVersion.Version.Build)"
      Write-Output "APPCTL_COVERAGE: Exe=$coverage"
      Write-Output "APPCTL_EVIDENCE: test_id=$tid expected=$expected ran=$ran exit=$exit attributed=$attr log_readable=$logReadable capture=$((Get-Date).ToString('o'))"
      $det = 'unknown'
      try {
        $sy = @(Get-WinEvent -FilterHashtable @{ LogName = 'Microsoft-Windows-Sysmon/Operational'; Id = 1; StartTime = $start } -ErrorAction Stop)
        $det = if (@($sy | Where-Object { $_.Message -like "*$tid*" }).Count -gt 0) { 'visible' } else { 'not_visible' }
      } catch {}
