        } catch {}
        foreach ($t in 'Exe','Script','Dll','Msi','Appx') { if (-not $modes.ContainsKey($t)) { $modes[$t] = 'NotConfigured' } }
        return $modes
      }

      function Resolve-AppCtlOutcome {
        param([string]$Expected, [string]$Coverage, [bool]$Ran, [int]$AttrCount, [bool]$LogReadable, [bool]$ControlAvailable)
        if (-not $ControlAvailable) { return @{ Outcome = 'not_applicable'; Reason = 'the tested mechanism or its enforcement control is unavailable on this host (service not running, not installed, not readable, or Windows build below 17763)' } }
        if (-not $LogReadable) { return @{ Outcome = 'inconclusive'; Reason = 'the enforcement event log is unreadable; execution cannot be attributed' } }
        if ($Ran) {
          if ($Expected -eq 'blocked') {
            if ($Coverage -eq 'Enabled') { return @{ Outcome = 'allowed_unexpectedly'; Reason = 'script executed although the Script collection is Enabled' } }
            return @{ Outcome = 'not_enforced'; Reason = "script executed; Script collection mode is $Coverage" }
          }
          return @{ Outcome = 'allowed_by_policy'; Reason = 'script executed; the contract expects it allowed' }
        }
        if ($Expected -eq 'allowed') { return @{ Outcome = 'inconclusive'; Reason = 'not executed although the contract expects it allowed' } }
        if ($AttrCount -ne 1) { return @{ Outcome = 'inconclusive'; Reason = "not executed; $AttrCount matching script block events (exactly 1 required for attribution)" } }
        if ($Coverage -ne 'Enabled') { return @{ Outcome = 'inconclusive'; Reason = "block event present but Script collection mode is $Coverage" } }
        return @{ Outcome = 'blocked_as_expected'; Reason = 'script not executed; one matching AppLocker script block event' }
      }

      $modes = Get-AppCtlModes
      $coverage = $modes['Script']
      $control = ((Get-Service -Name AppIDSvc -ErrorAction SilentlyContinue).Status -eq 'Running') -and $modes['__readable'] -and ([Environment]::OSVersion.Version.Build -ge 17763)
      $needle = Split-Path $vbs -Leaf
      Set-Content -Path $vbs -Value "WScript.Echo `"$marker`""
      $start = Get-Date
      $p = Start-Process -FilePath cscript.exe -ArgumentList "//nologo `"$vbs`"" -WindowStyle Hidden -PassThru -Wait -RedirectStandardOutput $tmp
      $exit = $p.ExitCode
