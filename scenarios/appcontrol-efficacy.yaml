    requires_priv: admin
    timeout_sec: 60
    fidelity: telemetry-safe
    production_safe: false
    risk: medium
    reversible: true
    blast_radius: "Copies cmd.exe into a uniquely named temp directory as winword.exe, runs one benign marker child, deletes the copy. Changes no policy."
    telemetry:
      - "Defender Operational event 1121 (ASR block) naming the spoofed parent, if enforced"
      - "Sysmon EID 1: powershell.exe with the spoofed parent image"
    detection:
      - "ASR block event for an Office child-process rule violation"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $expected = 'blocked'
      $tid = [guid]::NewGuid().ToString('N')
      $marker = "BAS-SIM-APPCTL-$tid"
      $asrRule = 'D4F940AB-401B-4EFC-AADC-AD5F3C50688A'
      $dir = Join-Path $env:TEMP "bas-appctl-$tid"
      $wordExe = Join-Path $dir 'winword.exe'
      $tmp = Join-Path $env:TEMP "bas-appctl-$tid.txt"

      # Pure decision: no I/O. Every input is observed by the caller.
      function Resolve-AppCtlOutcome {
        param([string]$Expected, [string]$Coverage, [bool]$Ran, [int]$AttrCount, [bool]$LogReadable, [bool]$ControlAvailable)
        if (-not $ControlAvailable) { return @{ Outcome = 'not_applicable'; Reason = 'Defender preferences are unavailable or the Windows build is below 17763, so the ASR rule state cannot be established' } }
        if (-not $LogReadable) { return @{ Outcome = 'inconclusive'; Reason = 'the Defender Operational log is unreadable; execution cannot be attributed' } }
        if ($Ran) {
          if ($Expected -eq 'blocked') {
            if ($Coverage -eq 'Enabled') { return @{ Outcome = 'allowed_unexpectedly'; Reason = 'spoofed-parent child executed although the ASR rule is in Block mode' } }
            return @{ Outcome = 'not_enforced'; Reason = "spoofed-parent child executed; ASR rule mode is $Coverage" }
          }
          return @{ Outcome = 'allowed_by_policy'; Reason = 'spoofed-parent child executed; the contract expects it allowed' }
        }
        if ($Expected -eq 'allowed') { return @{ Outcome = 'inconclusive'; Reason = 'not executed although the contract expects it allowed' } }
        if ($AttrCount -ne 1) { return @{ Outcome = 'inconclusive'; Reason = "not executed; $AttrCount matching ASR block events (exactly 1 required for attribution)" } }
        if ($Coverage -ne 'Enabled') { return @{ Outcome = 'inconclusive'; Reason = "ASR block event present but rule mode is $Coverage" } }
        return @{ Outcome = 'blocked_as_expected'; Reason = 'spoofed-parent child not executed; one matching ASR block event for this parent' }
      }

      $pref = Get-MpPreference -ErrorAction SilentlyContinue
      $control = ($null -ne $pref) -and ([Environment]::OSVersion.Version.Build -ge 17763)
      $ids = @()
      $acts = @()
      if ($control) {
        $ids = @($pref.AttackSurfaceReductionRules_Ids | ForEach-Object { ([string]$_).ToUpper() })
        $acts = @($pref.AttackSurfaceReductionRules_Actions)
      }
      $i = [array]::IndexOf($ids, $asrRule)
      $coverage = if ($i -lt 0) { 'NotConfigured' } elseif ($acts[$i] -eq 1) { 'Enabled' } else { 'AuditOnly' }

      $ran = $false
      $exit = -1
      $attr = 0
      $logReadable = $true
      $start = Get-Date
      if ($control) {
        New-Item -ItemType Directory -Path $dir -Force | Out-Null
        Copy-Item -Path (Join-Path $env:SystemRoot 'System32\cmd.exe') -Destination $wordExe -Force
        $p = Start-Process -FilePath $wordExe -ArgumentList "/d /s /c `"powershell -NoProfile -NonInteractive -Command Write-Output $marker`"" -WindowStyle Hidden -PassThru -Wait -RedirectStandardOutput $tmp
        $exit = $p.ExitCode
        $out = Get-Content -Path $tmp -ErrorAction SilentlyContinue
        $ran = [bool](($out -join "`n") -like "*$marker*")
        try {
          $ev = @(Get-WinEvent -FilterHashtable @{ LogName = 'Microsoft-Windows-Windows Defender/Operational'; Id = 1121; StartTime = $start } -ErrorAction Stop)
          $attr = @($ev | Where-Object { $_.Message -like "*$tid*" }).Count
        } catch { $logReadable = $false }
      }
      $r = Resolve-AppCtlOutcome -Expected $expected -Coverage $coverage -Ran $ran -AttrCount $attr -LogReadable $logReadable -ControlAvailable $control
      Remove-Item $tmp -Force -ErrorAction SilentlyContinue

      Write-Output "APPCTL_FAMILY: parent_child_asr"
      Write-Output "APPCTL_HOST: os_build=$([Environment]::OSVersion.Version.Build)"
      Write-Output "APPCTL_COVERAGE: AsrOfficeChild=$coverage"
      Write-Output "APPCTL_EVIDENCE: test_id=$tid expected=$expected ran=$ran exit=$exit attributed=$attr log_readable=$logReadable capture=$((Get-Date).ToString('o'))"
      $det = 'unknown'
      if ($control) {
        try {
          $sy = @(Get-WinEvent -FilterHashtable @{ LogName = 'Microsoft-Windows-Sysmon/Operational'; Id = 1; StartTime = $start } -ErrorAction Stop)
          $det = if (@($sy | Where-Object { $_.Message -like "*$tid*" }).Count -gt 0) { 'visible' } else { 'not_visible' }
        } catch {}
      }
      Write-Output "APPCTL_DETECTION: source=sysmon_process_create result=$det"
      Write-Output "APPCTL_OUTCOME: $($r.Outcome)"
      switch ($r.Outcome) {
        'blocked_as_expected' { Write-Output "PASS: $($r.Reason). [BAS-SIM]" }
        'allowed_by_policy'   { Write-Output "PASS: $($r.Reason). [BAS-SIM]" }
        'allowed_unexpectedly' { Write-Output "FAIL: $($r.Reason). [BAS-SIM]" }
        'not_enforced'        { Write-Output "FAIL: $($r.Reason). [BAS-SIM]" }
        default               { Write-Output "SKIP: $($r.Reason). [BAS-SIM]" }
      }
    cleanup: |
      Remove-Item (Join-Path $env:TEMP 'bas-appctl-*') -Recurse -Force -ErrorAction SilentlyContinue

  - name: "Application control in-process PowerShell host: language mode and Add-Type under a custom host (T1059.001)"
    technique_id: T1059.001
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: telemetry-safe
    production_safe: false
    risk: medium
    reversible: true
    blast_radius: "Runs one benign custom PowerShell host (tools/inprocess-host/bas-pshost.exe, built from source) that reports its language mode and whether Add-Type succeeds. Writes one temp output file, deleted in cleanup. Changes no policy."
    telemetry:
      - "PowerShell ScriptBlock logging (event 4104, Microsoft-Windows-PowerShell/Operational) records this host's script text when logging is enabled by policy."
    detection:
      - "Visibility is visible or not_visible only when ScriptBlock logging is enabled by policy and the event log is readable. Otherwise it is unknown. AMSI coverage is not measured."
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      # Test contract: the verdict depends on the customer's intended policy for
      # custom PowerShell hosts, supplied as BAS_INPROC_POLICY. The host is not
      # assumed to need restriction. Without a stated policy the result is
      # UNVERIFIED, never a FAIL.
      #   restricted   - the host must run ConstrainedLanguage and block Add-Type
      #   unrestricted - the host may run FullLanguage; the exposure is documented
      $policy = ([string]$env:BAS_INPROC_POLICY).Trim().ToLower()
      $expected = switch ($policy) { 'restricted' { 'blocked' } 'unrestricted' { 'allowed' } default { 'unknown' } }
      $tid = [guid]::NewGuid().ToString('N')
      $marker = "BAS-SIM-INPROC-$tid"
      $det = 'unknown'
      $helper = $env:BAS_INPROC_HOST
      $tmp = Join-Path $env:TEMP "bas-inproc-$tid.txt"

      Write-Output "APPCTL_FAMILY: inprocess_hosting"
      Write-Output "APPCTL_HOST: os_build=$([Environment]::OSVersion.Version.Build)"
      if ([Environment]::OSVersion.Version.Build -lt 17763 -or [string]::IsNullOrEmpty($helper) -or -not (Test-Path -LiteralPath $helper)) {
        Write-Output "APPCTL_COVERAGE: HostLanguageMode=unknown"
        Write-Output "APPCTL_EVIDENCE: test_id=$tid expected=$expected helper_present=false"
        Write-Output "APPCTL_DETECTION: source=powershell_scriptblock_4104 result=unknown"
        Write-Output "APPCTL_OUTCOME: not_applicable"
        Write-Output "SKIP: not applicable here: no custom PowerShell host is configured (set BAS_INPROC_HOST to a bas-pshost.exe built from tools/inprocess-host), or the Windows build is below 17763. [BAS-SIM]"
        return
      }

      $start = Get-Date
      $p = Start-Process -FilePath $helper -ArgumentList $marker -WindowStyle Hidden -PassThru -Wait -RedirectStandardOutput $tmp
      $exit = $p.ExitCode
      $text = (Get-Content -Path $tmp -ErrorAction SilentlyContinue) -join "`n"
      Remove-Item $tmp -Force -ErrorAction SilentlyContinue

      $mode = if ($text -match 'HOST_LANGUAGE_MODE: (\S+)') { $Matches[1] } else { 'unknown' }
      $add = if ($text -match 'HOST_ADDTYPE: (\S+)') { $Matches[1] } else { 'unknown' }
      $ran = $text -like "*$marker*"

      # Visibility: did ScriptBlock logging (event 4104) record this host's
      # script text? Only meaningful when logging is enabled by policy. When it
      # is not enabled, the result stays unknown, never not_visible.
      $sbPolicy = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging' -Name EnableScriptBlockLogging -ErrorAction SilentlyContinue).EnableScriptBlockLogging
      $sbState = if ($sbPolicy -eq 1) { 'enabled' } else { 'not_enabled' }
      if ($sbPolicy -eq 1) {
        try {
          $sb = @(Get-WinEvent -FilterHashtable @{ LogName = 'Microsoft-Windows-PowerShell/Operational'; Id = 4104; StartTime = $start } -ErrorAction Stop)
          $det = if (@($sb | Where-Object { $_.Message -like "*$marker*" }).Count -gt 0) { 'visible' } else { 'not_visible' }
        } catch { $det = 'unknown' }
      }

      if (-not $ran -or $mode -eq 'unknown' -or $add -eq 'unknown') {
        $outcome = 'inconclusive'; $reason = 'the custom host did not report a complete result; nothing can be concluded'
      } elseif ($policy -eq 'restricted') {
        if ($add -eq 'allowed') {
          $outcome = 'allowed_unexpectedly'; $reason = "the custom host allowed Add-Type under $mode, but the stated policy requires a restricted host"
        } elseif ($mode -eq 'ConstrainedLanguage') {
          $outcome = 'blocked_as_expected'; $reason = 'the custom host runs ConstrainedLanguage and blocked Add-Type, as the stated policy requires'
        } else {
          $outcome = 'inconclusive'; $reason = "Add-Type was blocked under $mode, which is not language-mode enforcement; cannot attribute the block"
        }
      } elseif ($policy -eq 'unrestricted') {
        if ($add -eq 'allowed') {
          $outcome = 'allowed_by_policy'; $reason = "the custom host runs $mode and allowed Add-Type, as the stated policy permits; exposure is documented, not a finding"
        } else {
          $outcome = 'inconclusive'; $reason = "the custom host blocked Add-Type under $mode, which is stricter than the stated policy; this is not a finding"
        }
      } else {
        $outcome = 'inconclusive'; $reason = "UNVERIFIED: the intended policy for custom PowerShell hosts is not stated (set BAS_INPROC_POLICY to restricted or unrestricted); observed $mode with Add-Type $add"
      }

      Write-Output "APPCTL_COVERAGE: HostLanguageMode=$mode"
      Write-Output "APPCTL_EVIDENCE: test_id=$tid policy=$policy expected=$expected ran=$ran exit=$exit host_addtype=$add scriptblock_logging=$sbState capture=$((Get-Date).ToString('o'))"
      Write-Output "APPCTL_DETECTION: source=powershell_scriptblock_4104 result=$det"
      Write-Output "APPCTL_OUTCOME: $outcome"
      switch ($outcome) {
        'blocked_as_expected'  { Write-Output "PASS: $reason. [BAS-SIM]" }
        'allowed_by_policy'    { Write-Output "PASS: $reason. [BAS-SIM]" }
        'allowed_unexpectedly' { Write-Output "FAIL: $reason. [BAS-SIM]" }
        default                { Write-Output "SKIP: $reason. [BAS-SIM]" }
      }
    cleanup: |
      Remove-Item (Join-Path $env:TEMP 'bas-inproc-*.txt') -Force -ErrorAction SilentlyContinue
