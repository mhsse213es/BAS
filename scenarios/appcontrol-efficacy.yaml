        'allowed_by_policy'   { Write-Output "PASS: $($r.Reason). [BAS-SIM]" }
        'allowed_unexpectedly' { Write-Output "FAIL: $($r.Reason). [BAS-SIM]" }
        'not_enforced'        { Write-Output "FAIL: $($r.Reason). [BAS-SIM]" }
