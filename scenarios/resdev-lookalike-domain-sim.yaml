id: resdev-lookalike-domain-sim
product_line: killchain
name: Resource Development -- Lookalike Domain Candidate List Simulation (T1583.001)
description: >
  Simulates an operator generating lookalike domain candidates for a target brand. The step
  writes a candidate list to a local file. It does NOT check availability, register anything,
  or contact any registrar. The brand is synthetic.

  SAFETY: local file only. The brand is the synthetic label "examplebank" under .invalid. No
  registrar, DNS, or WHOIS request is made.

  Grounded in MITRE ATT&CK T1583.001 (Acquire Infrastructure: Domains).
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - resource-development
  - t1583
mitre_phases:
  - resource-development
live_policy:
  block_on_domain_controller: false
  require_dc_reachable: false
  max_spray_attempts: 0
  spray_account_allowlist: []
  execution_window: ""
steps:
  - name: "Resource Development -- Lookalike Domain Candidates (T1583.001)"
    technique_id: T1583.001
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: lab-only
    production_safe: true
    risk: low
    blast_radius: "Writes one local text file under %TEMP%. No network access and no registration."
    reversible: true
    telemetry:
      - "Sysmon EID 11 for the candidate file"
    detection:
      - "File-content analytics: list of brand-variant domains written by a non-user process"
    last_reviewed: "2026-11-23"
    command: |
      $ErrorActionPreference = 'Stop'
      $brand = 'examplebank'
      $tld = '.invalid'
      $variants = @(
        "$brand$tld", "$($brand)s$tld", "$($brand)-secure$tld", "$($brand)-login$tld",
        "$($brand)online$tld", "$($brand.Replace('a','4'))$tld", "$($brand.Replace('o','0'))$tld"
      )
      $out = Join-Path $env:TEMP 'bas_resdev_candidates.txt'
      Set-Content -LiteralPath $out -Value $variants
      Write-Output "EXEC resdev T1583.001: $($variants.Count) lookalike candidate(s) written locally, none registered. [BAS-SIM-RESDEV-DOMAIN]"
    cleanup: |
      Remove-Item -LiteralPath (Join-Path $env:TEMP 'bas_resdev_candidates.txt') -Force -ErrorAction SilentlyContinue
