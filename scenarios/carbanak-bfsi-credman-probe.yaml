id: carbanak-bfsi-credman-probe
product_line: killchain
name: Carbanak BFSI Windows Credential Manager Existence Probe (Item 14)
description: >
  Checks only whether the Credential Manager storage folders EXIST for the
  current user. No vault file is opened, read, copied or decrypted, and no
  credential is enumerated. [BAS-SIM-CARBANAK-S14] tagged. Grounded in MITRE
  ATT&CK T1555.004 (Credentials from Password Stores: Windows Credential
  Manager).
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - carbanak
  - bfsi
  - discovery
  - t1555
mitre_phases:
  - credential-access

live_policy:
  block_on_domain_controller: false
  require_dc_reachable: false
  max_spray_attempts: 0
  spray_account_allowlist: []
  execution_window: ""

steps:
  - name: "Carbanak Item 14 -- Windows Credential Manager Existence Probe (T1555.004)"
    technique_id: T1555.004
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 30
    fidelity: lab-only
    production_safe: true
    risk: low
    blast_radius: "Tests whether two folders exist. Reads nothing inside them."
    reversible: true
    telemetry:
      - "Sysmon EID 11 is NOT expected: the probe checks folder existence only"
    detection:
      - "EDR: existence checks of Credential Manager folders by a non-administrative process"
    threat_intel_sources:
      - reference: "MITRE ATT&CK -- T1555.004"
        url: "https://attack.mitre.org/techniques/T1555/004/"
    last_reviewed: "2026-11-21"
    family_attribution_confidence: reported
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $roots = @("$env:LOCALAPPDATA\Microsoft\Credentials", "$env:APPDATA\Microsoft\Credentials")
      $present = @($roots | Where-Object { Test-Path -LiteralPath $_ })
      Write-Output "EXEC 14: Credential Manager folder(s) present: $($present.Count) of 2. Existence check only; no contents read. [BAS-SIM-CARBANAK-S14]"
    cleanup: ""
