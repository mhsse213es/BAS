id: carbanak-bfsi-winrm-exec
product_line: killchain
name: Carbanak BFSI WinRM Remote Execution Simulation (Item 20)
description: >
  Opens one WinRM session to the lab target and runs a single benign echo
  command. No payload is staged. Skips without a configured second host. [BAS-
  SIM-CARBANAK-S20] tagged. Grounded in MITRE ATT&CK T1021.006 (Remote
  Services: Windows Remote Management).
author: Audspect Research
executable: true
local_check: false
supported_os: [windows]
tags:
  - carbanak
  - bfsi
  - lateral-movement
  - t1021
mitre_phases:
  - lateral-movement

live_policy:
  block_on_domain_controller: false
  require_dc_reachable: false
  max_spray_attempts: 0
  spray_account_allowlist: []
  execution_window: ""

steps:
  - name: "Carbanak Item 20 -- WinRM Remote Execution Simulation (T1021.006)"
    technique_id: T1021.006
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: lab-only
    production_safe: true
    risk: low
    blast_radius: "One WinRM session to a single lab host, running an echo command only."
    reversible: true
    telemetry:
      - "Sysmon EID 1 for the WinRM session on the target"
    detection:
      - "SIEM: remote PowerShell session to a lab host from a non-administrative account"
    threat_intel_sources:
      - reference: "MITRE ATT&CK -- T1021.006"
        url: "https://attack.mitre.org/techniques/T1021/006/"
    last_reviewed: "2026-11-21"
    family_attribution_confidence: reported
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $target = $env:BAS_CARBANAK_TARGET_HOST
      if (-not $target) { Write-Output "SKIP: Carbanak Item 20 not run -- BAS_CARBANAK_TARGET_HOST unset. This step needs a second lab host."; exit 0 }
      if ($target -notmatch '\.(lab|test)$') { Write-Output "REFUSED: target must be a .lab or .test host label."; exit 1 }
      $out = Invoke-Command -ComputerName $target -ScriptBlock { 'bas-probe-ok' }
      Write-Output "EXEC 20: WinRM echo from lab target returned: $out. Benign echo only. [BAS-SIM-CARBANAK-S20]"
    cleanup: ""
