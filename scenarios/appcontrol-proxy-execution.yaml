      } catch {}
      Write-Output "APPCTL_DETECTION: source=sysmon_process_create result=$det"
      Write-Output "APPCTL_OUTCOME: $($r.Outcome)"
      $reason = $r.Reason; if ($att.NotApplicable -and -not $Direct) { $reason = $att.NotApplicable }
      switch ($r.Outcome) {
      'blocked_as_expected'  { Write-Output "PASS: $reason. [BAS-SIM]" }
      'allowed_by_policy'    { Write-Output "PASS: $reason. [BAS-SIM]" }
      'allowed_unexpectedly' { Write-Output "FAIL: $reason. [BAS-SIM]" }
      'not_enforced'         { Write-Output "FAIL: $reason. [BAS-SIM]" }
      'audited_only'         { Write-Output "FAIL: $reason. [BAS-SIM]" }
      default                { Write-Output "SKIP: $reason. [BAS-SIM]" }
      }
      }
      Invoke-AppCtlTest -Family 'msbuild_proxy' -Collection 'Exe' -Needle 'msbuild.exe' -Technique 'T1127.001' -Attempt {
      $msb = Join-Path $env:SystemRoot 'Microsoft.NET\Framework64\v4.0.30319\MSBuild.exe'
      if (-not (Test-Path $msb)) { return @{ Ran = $false; Exit = -1; Note = 'msbuild_absent'; NotApplicable = 'MSBuild.exe is not present on this host, so the path cannot be tested' } }
      $mk = Join-Path $script:AppCtlWork 'msbuild-marker.txt'
      $proj = Join-Path $script:AppCtlWork 'proxy.proj'
      $body = "<Project ToolsVersion=`"4.0`" xmlns=`"http://schemas.microsoft.com/developer/msbuild/2003`"><Target Name=`"Go`"><BasTask/></Target><UsingTask TaskName=`"BasTask`" TaskFactory=`"CodeTaskFactory`" AssemblyFile=`"`$(MSBuildToolsPath)\Microsoft.Build.Tasks.v4.0.dll`"><Task><Code Type=`"Fragment`" Language=`"cs`"><![CDATA[System.IO.File.WriteAllText(@`"$mk`", `"$($script:AppCtlMarker)`");]]></Code></Task></UsingTask></Project>"
      Set-Content -Path $proj -Value $body -Encoding ASCII
      $p = Invoke-AppCtlProc -File $msb -ArgLine "/nologo `"$proj`"" -TimeoutSec 60
      return @{ Ran = (Test-AppCtlMarker $mk); Exit = $p.Exit; Note = "timed_out=$($p.TimedOut)"; NotApplicable = '' }
      }
    cleanup: |
      foreach ($root in @($env:TEMP, $env:APPDATA, (Join-Path $env:USERPROFILE 'Downloads'))) {
        Get-ChildItem -Path $root -Filter 'bas-appctl-*' -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
      }
      Get-ChildItem -Path $env:TEMP -Filter 'bas_????????.exe*' -Force -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
      Get-ChildItem Cert:\CurrentUser\My -ErrorAction SilentlyContinue | Where-Object { $_.Subject -like 'CN=BAS-SIM-UNTRUSTED-*' } | Remove-Item -Force -ErrorAction SilentlyContinue
