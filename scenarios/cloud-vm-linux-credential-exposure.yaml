      printf '%s' "$data" > "$p" 2>/dev/null || return 1
      return 0
      }
      cv_undo_read() { # id -> prints JSON contents, or nothing if unreadable
      local id="$1"
      local p
      p=$(cv_undo_path "$id")
      [ -f "$p" ] || return 0
      cat "$p" 2>/dev/null || return 0
      }
      cv_undo_remove() { # id -> removes record
      local id="$1"
      local p
      p=$(cv_undo_path "$id")
      rm -f "$p" 2>/dev/null || true
      return 0
      }
      present=""
      for n in AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AZURE_CLIENT_SECRET; do [ -n "$(cv_env $n)" ] && present="$present $n"; done
      g=$(cv_env GOOGLE_APPLICATION_CREDENTIALS); [ -n "$g" ] && [ -f "$g" ] && present="$present GOOGLE_APPLICATION_CREDENTIALS(file-exists)"
