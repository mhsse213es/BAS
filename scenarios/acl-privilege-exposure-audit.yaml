      $s.Filter = "(&(objectClass=$Kind)(lDAPDisplayName=$Name))"
      [void]$s.PropertiesToLoad.Add('schemaIDGUID')
      $r = $s.FindOne()
      if ($r) { $g = [guid]([byte[]]$r.Properties['schemaidguid'][0]) }
