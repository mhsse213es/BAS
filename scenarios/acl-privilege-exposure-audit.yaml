  - name: "ACL Stage 4 — Password-Reset Extended-Right Exposure (ForceChangePassword)"
    technique_id: T1098
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 120
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    reversible: true
    blast_radius: "Reads DACLs of tier-0 objects and the domain head, checking the User-Force-Change-Password extended right only."
    # ATT&CK note: User-Force-Change-Password lets a principal reset a victim's password without knowing it (T1098 Account Manipulation); the audit itself is discovery.
    telemetry:
      - "Sysmon EID 1: powershell.exe reading tier-0 object ACLs via DirectoryServices"
      - "DC Directory Service EID 1644 (expensive/inefficient LDAP search, if enabled): paged security-descriptor reads"
    detection:
      - "SIEM: non-tier-0 ExtendedRight with User-Force-Change-Password GUID on a tier-0 object or the domain head"
      - "SIEM: Security EID 4724 (password reset attempt) against a tier-0 account by a non-admin principal"
