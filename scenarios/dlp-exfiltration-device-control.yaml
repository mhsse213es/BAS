id: dlp-exfiltration-device-control
name: DLP Exfiltration Validation — Device Control (Removable Storage Write Policy)
description: >
  Attempts to write the synthetic multi-type sensitive record to a removable
  storage device and records the removable-storage write policy in force for
  the device class under test. This is the device-control counterpart to the
  USB step in dlp-exfiltration-validation.yaml. That step records whether a copy
  succeeded. This one also records the policy state the copy ran under, so a
  result can be read against it.

  Policy state is read, never changed. The step reads the Deny_Write value
  under the removable-storage policy key for a device class GUID the operator
  supplies in BAS_DLP_DEVICE_CLASS_GUID:

    HKLM\SOFTWARE\Policies\Microsoft\Windows\RemovableStorageDevices\<GUID>

  The GUID is not hard-coded. Public sources give conflicting GUIDs for the
  removable-disk class, so the operator must confirm the correct one for the
  device under test. If the variable is not set, the policy state is recorded
  as not supplied.

  The step is skipped, and records no observation, when no removable volume is
  present. It is graded Untested in that case, never as a block.

  Evidence level: L1 only. A write failure is recorded as blocked only when the
  error is an access refusal, and as unknown otherwise. Attribution is still
  not possible: a refusal could come from device policy, from file permissions,
  or from an endpoint DLP product. Only product evidence can attribute it.

  Not covered, and recorded as Unsupported in this environment: device
  exceptions for specific devices, allow and deny lists by hardware ID,
  user and group exceptions, and read-only versus blocked distinctions. Those
  need a device policy and several accounts to test against.

  Safety: all synthetic data is fabricated and tagged [BAS-SIM-DLP]. The
  policy key is read with Get-ItemProperty and never written. The copied file
  is removed when the copy succeeds. Windows only.
author: Audspect Research
executable: true
supported_os: [windows]
tags:
  - dlp
  - data-protection-validation
  - exfiltration
  - device-control
  - windows
  - mitre-attack
mitre_phases:
  - collection
  - exfiltration

steps:
  - name: "DLP Validation — Removable Media Write Under Recorded Device Policy (T1052.001)"
    technique_id: T1052.001
    detection_profiles:
      - windows_dlp_exfiltration
    framework: custom
    executor: powershell
    requires_priv: user
    timeout_sec: 60
    fidelity: telemetry-safe
    production_safe: true
    risk: low
    blast_radius: "Reads one registry value under the removable-storage policy key (read only). Writes one small synthetic CSV to a removable volume if one is present, then removes it. No change to policy."
    reversible: true
    telemetry:
      - "Sysmon EID 13 or 12: registry read of the removable-storage policy key (read only)"
      - "Sysmon EID 11: file created on a removable volume"
    detection:
      - "Device control: write to a removable device outside the device-class allow list"
    command: |
      $ErrorActionPreference = 'SilentlyContinue'
      $csvContent = "[BAS-SIM-DLP] CustomerID,PAN,Aadhaar,SWIFT,UPI,CreditCard`nBAS-SIM-SINK,ABCDE1234F,123456789012,SBININBBXXX,fake.user@upi,4111111111111111"
      $guid = $env:BAS_DLP_DEVICE_CLASS_GUID
      if ($guid) {
        $policyKey = "HKLM:\SOFTWARE\Policies\Microsoft\Windows\RemovableStorageDevices\$guid"
        $pol = Get-ItemProperty -Path $policyKey -Name Deny_Write -ErrorAction SilentlyContinue
        if ($pol) { Write-Output "POLICY: Deny_Write=$($pol.Deny_Write) for class $guid (read only, not changed)" }
        else { Write-Output "POLICY: Deny_Write not set for class $guid (read only, not changed)" }
      } else {
        Write-Output "POLICY: no device class GUID supplied in BAS_DLP_DEVICE_CLASS_GUID; policy state not recorded."
      }
      $usbDrive = Get-Volume | Where-Object { $_.DriveType -eq 'Removable' -and $_.DriveLetter } | Select-Object -First 1
      if (-not $usbDrive) {
        Write-Output "SKIP: no removable volume present on this host -- device-control validation requires removable media."
      } else {
        $srcFile = Join-Path $env:TEMP ("bas_sim_devctl_" + [guid]::NewGuid().ToString('N') + ".csv")
        $dest = "$($usbDrive.DriveLetter):\bas_sim_devctl_" + [guid]::NewGuid().ToString('N') + ".csv"
        Set-Content -Path $srcFile -Value $csvContent -Encoding utf8
        if ($env:BAS_TASK_ID) { Write-Output "DLP_EVENT_START: $env:BAS_TASK_ID $((Get-Date).ToUniversalTime().ToString('o'))" }
        Copy-Item -Path $srcFile -Destination $dest -ErrorAction SilentlyContinue
        if (Test-Path -LiteralPath $dest) {
          Write-Output "EXEC T1052.001: sensitive record file written to removable volume $($usbDrive.DriveLetter): unimpeded. [BAS-SIM-DLP-DEVCTL]"
          Write-Output "FAIL: sensitive record file written to a removable device without being blocked."
          Write-Output "DLP_OBSERVATION: OperationSucceeded"
          Remove-Item -LiteralPath $dest -Force -ErrorAction SilentlyContinue
        } else {
          $reason = if ($Error.Count -gt 0) { $Error[0].Exception.Message } else { '' }
          Write-Output "EXEC T1052.001: write to removable volume $($usbDrive.DriveLetter): failed ($reason). [BAS-SIM-DLP-DEVCTL]"
          # Only an access refusal is a block. Any other failure is unknown.
          if ($reason -match 'Access|denied|Unauthorized|read-only|refused') { Write-Output "DLP_OBSERVATION: OperationBlocked" } else { Write-Output "DLP_OBSERVATION: OperationUnknown" }
        }
        Remove-Item -LiteralPath $srcFile -Force -ErrorAction SilentlyContinue
      }
    cleanup: ""
