version: "3.9"

# BAS Platform — Docker Compose (single-server / BFSI tier)
# Generated .env required — run: sudo bash install.sh --install --config setup.conf

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: audspect-postgres
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-bas_platform}
      POSTGRES_USER:     ${POSTGRES_USER:-bas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - audspect-postgres-data:/var/lib/postgresql/data
    networks:
      - bas-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bas_user} -d ${POSTGRES_DB:-bas_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Caldera (MITRE ATT&CK simulation engine) ─────────────────────────────────
  caldera:
    image: ${REGISTRY:-}bas-caldera:${BAS_VERSION:-latest}
    container_name: audspect-caldera
    environment:
      API_KEY_RED:  ${CALDERA_API_KEY:-BASPlatform2024}
      API_KEY_BLUE: ${CALDERA_API_KEY_BLUE:-BASBlue2024}
    expose:
      - "8888"
    networks:
      - bas-internal
    restart: unless-stopped
    # The MITRE Caldera image is Python-based and ships no wget/curl, so the old
    # wget probe always failed → the container flapped "unhealthy" even though the
    # API was fine. Use python3 (the container's own runtime) against the auth-free
    # root page. start_period is generous because Caldera loads its plugin/ability
    # library on boot and isn't ready to serve until that finishes.
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8888/').read()\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # ── Headless Chromium (renders the styled HTML report to PDF) ────────────────
  # The orchestrator runs in a hardened distroless image that can't host Chrome,
  # so PDF generation prints the report HTML via this sidecar over CDP. If this
  # service is absent the orchestrator falls back to its built-in PDF renderer.
  chrome:
    image: chromedp/headless-shell:latest
    container_name: audspect-chrome
    command:
      - "--no-sandbox"
      - "--disable-gpu"
      - "--disable-dev-shm-usage"
      - "--remote-debugging-address=0.0.0.0"
      - "--remote-debugging-port=9222"
      - "--remote-allow-origins=*"
    shm_size: "512m"
    networks:
      - bas-internal
    restart: unless-stopped
    # chromedp/headless-shell has no wget/curl/python3; use socat (present
    # in this image) to verify the CDP port accepts connections.
    healthcheck:
      test: ["CMD", "/usr/bin/socat", "/dev/null", "TCP:127.0.0.1:9222,connect-timeout=2"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── BAS Orchestrator ─────────────────────────────────────────────────────────
  orchestrator:
    image: ${REGISTRY:-}bas-orchestrator:${BAS_VERSION:-latest}
    container_name: audspect-orchestrator
    # NET_BIND_SERVICE (not root) lets the orchestrator bind privileged ports
    # directly: UDP/53 for the DNS-tunneling exfiltration listener
    # (internal/dnssink) and container-internal TCP/22 for the SFTP
    # exfiltration listener (internal/sftpsink) -- real traffic on the
    # standard ports is what makes each channel a meaningful test of
    # network-layer inspection.
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      postgres:
        condition: service_healthy
      caldera:
        # service_healthy, not service_started -- Caldera's healthcheck has a
        # 180s start_period specifically because it loads its plugin/ability
        # library on boot and isn't ready to serve /api/v2/abilities until
        # that finishes. service_started only waits for the process to exist,
        # which let the orchestrator's one-shot startup fetch
        # (scenario.NewCalderaStore, main.go) race ahead of Caldera and load
        # permanently empty on a cold rebuild -- confirmed in production
        # 2026-08-19 ("connection refused" at orchestrator boot, Caldera
        # itself healthy ~90s later, CalderaStore never recovered without a
        # manual orchestrator restart since there's no retry).
        condition: service_healthy
      chrome:
        condition: service_started  # orchestrator falls back to built-in PDF if chrome unhealthy
    environment:
      # sslmode=prefer encrypts when Postgres offers TLS (default in official image).
      # Production deployments with a certificate chain should use sslmode=require
      # or sslmode=verify-full with PGSSLROOTCERT set.
      DATABASE_URL:     "postgres://${POSTGRES_USER:-bas_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bas_platform}?sslmode=prefer"
      JWT_SECRET:       ${JWT_SECRET}
      AGENT_SECRET:     ${AGENT_SECRET:-}
      # DB role hardening (opt-in): set to a strong password to demote the
      # orchestrator's Postgres role to NOSUPERUSER/NOBYPASSRLS at startup and
      # create a `bas_breakglass` recovery superuser with this password. Blank =
      # inactive (role unchanged).
      BAS_DB_BREAKGLASS_PASSWORD: ${BAS_DB_BREAKGLASS_PASSWORD:-}
      HTTP_PORT:        "9443"
      SCENARIOS_DIR:    /scenarios
      BAS_LICENSE_PATH: /etc/bas/${LICENSE_FILE:-bas.lic}
      DNS_SINK_ENABLED: ${DNS_SINK_ENABLED:-true}
      SFTP_SINK_ENABLED: ${SFTP_SINK_ENABLED:-true}
      SINK_SFTP_HOST:   ${SINK_SFTP_HOST:-}
      SINK_SFTP_PORT:   ${SINK_SFTP_PORT:-2222}
      SMTP_SINK_ENABLED: ${SMTP_SINK_ENABLED:-true}
      SINK_SMTP_HOST:   ${SINK_SMTP_HOST:-}
      SINK_SMTP_PORT:   ${SINK_SMTP_PORT:-587}
      CALDERA_URL:      "${CALDERA_URL:-http://caldera:8888}"
      CALDERA_API_KEY:  ${CALDERA_API_KEY:-BASPlatform2024}
      BAS_ADMIN_EMAIL:    ${BAS_ADMIN_EMAIL:-}
      BAS_ADMIN_PASSWORD: ${BAS_ADMIN_PASSWORD:-}
      # Headless-Chromium sidecar for HTML→PDF report rendering (CDP). Falls back
      # to the built-in PDF renderer if unset/unreachable.
      CHROME_WS_URL:    "${CHROME_WS_URL:-http://chrome:9222}"
      # ── Threat-Intel Connector (optional — leave blank to disable) ──
      MISP_URL:                ${MISP_URL:-}
      MISP_API_KEY:            ${MISP_API_KEY:-}
      OPENCTI_URL:             ${OPENCTI_URL:-}
      OPENCTI_API_KEY:         ${OPENCTI_API_KEY:-}
      THREAT_INTEL_POLL_HOURS: ${THREAT_INTEL_POLL_HOURS:-24}
      # ── OTX IOC Enrichment (optional — leave blank to disable) ───────────────
      # Distinct from the MISP/OpenCTI connector above — enriches run_iocs
      # (extracted indicators) against LevelBLUE OTX. See internal/ioc.
      OTX_API_KEY: ${OTX_API_KEY:-}
      # ── Exercise comm injectors (optional — leave blank to disable) ──────────
      SMS_GATEWAY_URL:   ${SMS_GATEWAY_URL:-}
      SMS_GATEWAY_TOKEN: ${SMS_GATEWAY_TOKEN:-}
      SMS_GATEWAY_FROM:  ${SMS_GATEWAY_FROM:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      # ── Air-gapped threat-intel bundle (optional — signed ti-bundle.json) ────
      TI_BUNDLE_DIR:     ${TI_BUNDLE_DIR:-/intel-bundles}
      # ── SharpHound AD collector (optional — see volumes above) ──────────────
      BAS_SHARPHOUND_PATH:     ${BAS_SHARPHOUND_PATH:-}
    volumes:
      # scenarios is read-write: the threat-intel connector writes generated
      # YAMLs into scenarios/intel/. Keep writable even if connector is unused.
      - ./scenarios:/scenarios
      # NOTE: wwwroot is intentionally NOT bind-mounted. The dashboard SPA is baked
      # into the image (Dockerfile `COPY orchestrator/wwwroot /wwwroot`) and its
      # SHA-256 is compiled into the binary (expectedWWWRootHash) from the SAME file
      # in the SAME build. Mounting a host ./wwwroot over it lets the served file
      # drift from the compiled hash (different release, git pull, CRLF/BOM bytes),
      # which trips the startup integrity check and crash-loops the container.
      # UI updates ship via a new image only — that is what keeps tamper-detection
      # meaningful. Do NOT re-add a wwwroot bind-mount.
      # Filename is kept exactly as issued (e.g. hdfc-prod-001.lic) -- never
      # renamed to a generic bas.lic. LICENSE_FILE is written into .env by
      # install.sh (see _resolve_license_file); bas.lic is only the default
      # for deployments from before this existed.
      - ./${LICENSE_FILE:-bas.lic}:/etc/bas/${LICENSE_FILE:-bas.lic}:ro
      # ART external payloads (gsecdump, etc.) — drop binaries in ./art-payloads
      # on the host to enable payload-dependent atomics; empty by default.
      - ./art-payloads:/art-payloads:ro
      # Air-gapped threat-intel bundle (OPTIONAL) — drop a signed ti-bundle.json
      # in ./intel-bundles on the host to seed threat actors without internet.
      # The connector only activates the bundle source when the file is present.
      - ${TI_BUNDLE_DIR_HOST:-./intel-bundles}:/intel-bundles:ro
      # SharpHound (OPTIONAL) — drop SharpHound.exe in ./sharphound/ on the host
      # and set BAS_SHARPHOUND_PATH=/sharphound/SharpHound.exe in .env to enable
      # AD graph collection from domain-joined agents. Volume is safe to omit when
      # SharpHound is not used.
      - ${SHARPHOUND_DIR:-./sharphound}:/sharphound:ro
    ports:
      - "${BAS_PORT:-9443}:9443"
      # Bound to a specific host IP, never the 0.0.0.0 wildcard: most Linux
      # hosts run systemd-resolved's stub listener on 127.0.0.53/.54:53, and
      # a wildcard bind on the same port conflicts with that at the kernel
      # level (a wildcard and a specific-address bind can't coexist on one
      # port) -- Docker then fails to attach this container's network
      # endpoint AT ALL, which crash-loops the orchestrator on a "postgres"
      # DNS-resolution failure that looks unrelated to port 53. install.sh
      # resolves DNS_SINK_BIND_IP (see setup.conf.template) before writing
      # .env; there is no safe wildcard default here on purpose.
      - "${DNS_SINK_BIND_IP}:53:53/udp"
      # SFTP sink (internal/sftpsink): container-internal listener binds
      # standard :22 (genuine SSH/SFTP wire protocol), but the host-published
      # port is this separate, configurable, non-22 default -- every
      # deployment target's host almost certainly already runs its own real
      # sshd on port 22, so publishing straight to host 22 would either fail
      # to bind or collide with that (see install.sh's SINK_SFTP_PORT=22
      # rejection). No wildcard-bind conflict risk here the way DNS/53 has,
      # since nothing else claims 2222 by default.
      - "${SINK_SFTP_PORT:-2222}:22/tcp"
      # SMTP sink (internal/smtpsink): container-internal and
      # host-published are the SAME port (unlike SFTP's 22-vs-2222 split)
      # -- port 587 carries much lower collision risk than 22 or 53, since
      # a host's local MTA (if any) conventionally listens on 25, not 587.
      - "${SINK_SMTP_PORT:-587}:587/tcp"
    networks:
      - bas-internal
    restart: unless-stopped
    healthcheck:
      # No CMD-SHELL: this image (gcr.io/distroless/static-debian12) has no
      # shell and no wget/curl, so a shell-wrapped check can never actually
      # run -- confirmed in production 2026-08-20, container was silently
      # "unhealthy" forever regardless of real app health. Array-form CMD
      # invokes the orchestrator binary's own --healthcheck flag directly
      # (see cmd/server/main.go's runHealthcheck), no shell involved.
      test: ["CMD", "/orchestrator", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  bas-internal:
    driver: bridge

volumes:
  audspect-postgres-data:
    driver: local
