version: "3.9"

# BAS Platform — Docker Compose (single-server / SMB tier)
# Generated .env required — run setup.sh to create it.

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: bas-postgres
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-bas_platform}
      POSTGRES_USER:     ${POSTGRES_USER:-bas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - bas-postgres-data:/var/lib/postgresql/data
    networks:
      - bas-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bas_user} -d ${POSTGRES_DB:-bas_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Caldera (MITRE ATT&CK simulation engine) ─────────────────────────────────
  caldera:
    image: ${REGISTRY:-}bas-caldera:${BAS_VERSION:-latest}
    container_name: bas-caldera
    environment:
      API_KEY_RED:  ${CALDERA_API_KEY:-BASPlatform2024}
      API_KEY_BLUE: ${CALDERA_API_KEY_BLUE:-BASBlue2024}
    ports:
      - "8888:8888"
    networks:
      - bas-internal
    restart: unless-stopped
    # The MITRE Caldera image is Python-based and ships no wget/curl, so the old
    # wget probe always failed → the container flapped "unhealthy" even though the
    # API was fine. Use python3 (the container's own runtime) against the auth-free
    # root page. start_period is generous because Caldera loads its plugin/ability
    # library on boot and isn't ready to serve until that finishes.
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8888/').read()\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # ── BAS Orchestrator ─────────────────────────────────────────────────────────
  orchestrator:
    image: ${REGISTRY:-}bas-orchestrator:${BAS_VERSION:-latest}
    container_name: bas-orchestrator
    depends_on:
      postgres:
        condition: service_healthy
      caldera:
        condition: service_started
    environment:
      DATABASE_URL:     "postgres://${POSTGRES_USER:-bas_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bas_platform}?sslmode=disable"
      JWT_SECRET:       ${JWT_SECRET}
      AGENT_SECRET:     ${AGENT_SECRET:-}
      HTTP_PORT:        "9000"
      SCENARIOS_DIR:    /scenarios
      BAS_LICENSE_PATH: /etc/bas/bas.lic
      CALDERA_URL:      "${CALDERA_URL:-http://caldera:8888}"
      CALDERA_API_KEY:  ${CALDERA_API_KEY:-BASPlatform2024}
      BAS_ADMIN_PASSWORD: ${BAS_ADMIN_PASSWORD:-}
      # ── Threat-Intel Connector (optional — leave blank to disable) ──
      MISP_URL:                ${MISP_URL:-}
      MISP_API_KEY:            ${MISP_API_KEY:-}
      OPENCTI_URL:             ${OPENCTI_URL:-}
      OPENCTI_API_KEY:         ${OPENCTI_API_KEY:-}
      THREAT_INTEL_POLL_HOURS: ${THREAT_INTEL_POLL_HOURS:-24}
    volumes:
      # scenarios is read-write: the threat-intel connector writes generated
      # YAMLs into scenarios/intel/. Keep writable even if connector is unused.
      - ./scenarios:/scenarios
      - ./wwwroot:/wwwroot:ro
      - ./bas.lic:/etc/bas/bas.lic:ro
      # ART external payloads (gsecdump, etc.) — drop binaries in ./art-payloads
      # on the host to enable payload-dependent atomics; empty by default.
      - ./art-payloads:/art-payloads:ro
    ports:
      - "${DASHBOARD_PORT:-9000}:9000"
    networks:
      - bas-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  bas-internal:
    driver: bridge

volumes:
  bas-postgres-data:
    driver: local
