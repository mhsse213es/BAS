# BAS Platform Setup Configuration
# Fill all values then run: sudo bash setup.sh --offline
# Leave blank to launch the browser-based setup wizard automatically.

INSTALL_DIR=/opt/bas-platform
DASHBOARD_PORT=9000
LIC_PATH=
DB_PASSWORD=
ADMIN_PASSWORD=

# ── install.sh overrides (staging: zain@audspecterver 192.168.10.78) ───────────
# install.sh's own defaults (BAS_ENROLL_PORT=9444, BAS_LEGACY_PORT=9000) conflict
# on this host with apache2 (9444) and docker-proxy (9000) -- preflight FAILs on
# both. Overridden here so `install.sh --check|--install|--upgrade --config
# setup.conf` picks these up instead. Not a global default change -- other
# install.sh keys (BAS_PORT, BAS_DASHBOARD_PORT, BAS_SERVER_SANS, etc.) still
# fall back to their normal defaults unless added here too.
BAS_ENROLL_PORT=9441
BAS_LEGACY_PORT=9005
