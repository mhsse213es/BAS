version: "3.9"

# Production overrides — applied on top of docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:

  postgres:
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file:  "3"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus:   "1.0"

  chrome:
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file:  "2"
    deploy:
      resources:
        limits:
          memory: 768M
          cpus:   "1.0"

  orchestrator:
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file:  "5"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus:   "1.0"
    # For air-gap deployments: set network to internal so orchestrator
    # cannot reach internet after initial setup.
    # networks:
    #   bas-internal:
    #     aliases: [bas-orchestrator]
