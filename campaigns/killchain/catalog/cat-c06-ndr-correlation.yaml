id: cat-c06-ndr-correlation
name: Network detection correlation of a prohibited lateral flow
campaign: fk-c06-segmentation-controls
status: cataloged
executable: false
mitre: [T1021, T1571]
contract:
  objective: >
    Verify that a network detection and response platform observes the prohibited flow
    tested in the east-west check, raises a correlated detection, and that the detection
    reaches the case workflow. This scenario reads the detection result of that flow;
    it does not generate new traffic.
  prerequisites:
    os: not applicable (network sensor and analytics platform)
    product: client NDR or network sensor with the test zones covered by mirrored or tapped traffic
    permissions: read access to detections and cases; the flow from cat-c06-east-west-segmentation must have run
    telemetry: sensor coverage map for the test zones, sensor health status
  variants:
    baseline: prohibited flow observed on a covered segment
    variation: prohibited flow on a segment with no sensor coverage
    negative_controls: permitted flow on the covered segment, to confirm the sensor does not alert on normal traffic
  expected_prevention:
    control: not applicable; this scenario measures detection, not prevention
    authoritative_proof: not applicable
  expected_detection:
    observables: lateral connection between tiers, correlated with the denied attempt
    telemetry_sources: NDR detections, sensor health, case records
  response_validation:
    alert_to_incident: the detection creates a case assigned to the network team
    containment_check: the case records a containment action with a timestamp, verified in the case system
  evidence_contract:
    required: sensor coverage map, sensor health at test time, detection identifier, case identifier, flow identifiers
    identifiers: detection ID, case ID, flow 5-tuple, sensor ID
    missing_data_is: no sensor coverage on a segment makes detection NOT_TESTED for that segment; a sensor that was unhealthy during the test makes the result INCONCLUSIVE
  cleanup_recovery:
    artifacts_removed: none created by this scenario
    access_revocation_verified: not applicable
  remediation_retest:
    change: client adds sensor coverage or tunes the correlation rule
    retest: the uncovered-segment variant must now produce a detection
  limitations:
    - depends on the flow generated by the east-west scenario
    - does not measure encrypted lateral traffic inside permitted ports
    - detection latency is recorded but not scored against a service level in this version
