name: Secret scan

# Group A (AUDSPECT_ASSESSMENT_REPORT.md) root-cause fix #3: a CI gate that
# fails the build on any secret committed to the working tree, so the
# keys.txt/tenantID.txt/setting.json leak never recurs. Deliberately scans
# only the current tree (--no-git), not full history: the repo's git history
# still contains the original leaked secrets (purging it was an explicitly
# accepted risk -- see project memory), and a history scan would flag that
# every run forever. This gate's job is recurrence prevention, not
# retroactive detection.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, not @latest -- same reasoning as garble's pin in
      # packaging/build.sh: a tool version bump should be a deliberate,
      # reviewed change, not something that silently lands on the next CI run.
      - name: Install gitleaks v8.21.2
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tar.gz gitleaks
          gitleaks version

      - name: Scan working tree for secrets
        run: gitleaks detect --source . --no-git --redact -v --config .gitleaks.toml
