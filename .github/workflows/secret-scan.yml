name: Secret Scan

# Fails the build if a secret is detected — the recurrence guard for the
# 2026-09 committed-credentials incident. Runs on every push/PR to main and
# staging, and scans the full history on a schedule so a secret introduced in
# a feature branch cannot merge unnoticed.
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  schedule:
    - cron: "0 3 * * 1" # weekly full-history sweep, Mondays 03:00 UTC

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the scan sees every commit
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
