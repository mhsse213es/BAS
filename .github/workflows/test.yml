name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4

      - name: G1 XSS sink regression guard
        working-directory: .
        run: |
          python3 scripts/g1-innerhtml-sink-classifier.py
          python3 scripts/g1-trace-indirect-sinks.py
          python3 scripts/g1-merge-classification.py
          git diff --exit-code Assessment/G1_INNERHTML_SINK_INVENTORY.csv Assessment/G1_INNERHTML_SINK_INVENTORY.json Assessment/G1_INDIRECT_SINK_TRACE.csv Assessment/G1_FINAL_CLASSIFICATION.json Assessment/G1_FINAL_CLASSIFICATION.csv || \
            (echo "::error::Assessment/G1_FINAL_CLASSIFICATION.{json,csv} is stale -- run 'python3 scripts/g1-merge-classification.py' and commit the result." && exit 1)
          git fetch origin main --depth=1 2>/dev/null || true
          git show origin/main:Assessment/G1_FINAL_CLASSIFICATION.json > /tmp/g1_main_baseline.json 2>/dev/null || echo "{}" > /tmp/g1_main_baseline.json
          python3 scripts/g1-check-no-regression.py --against /tmp/g1_main_baseline.json
          cd scripts && python3 -m unittest test_g1_merge_classification test_g1_check_no_regression -v

      - uses: actions/setup-go@v5
        with:
          go-version-file: orchestrator/go.mod

      - name: gofmt check
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: staticcheck
        run: staticcheck ./...

      - name: go build
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      - name: go test (race + coverage)
        run: go test ./... -race -coverprofile=coverage.out

      - name: coverage HTML report
        run: go tool cover -html=coverage.out -o coverage.html

      - name: coverage package summary
        run: go run ./scripts/coveragesummary -profile=coverage.out | tee coverage-summary.txt

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            orchestrator/coverage.out
            orchestrator/coverage.html
            orchestrator/coverage-summary.txt
