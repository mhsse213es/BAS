# SWIFT Customer Security Controls Framework v2027 (published 10 July 2026).
# Control IDs, titles and Mandatory/Advisory types are taken from the SWIFT PDF (CSCF_v2027_20260710.pdf).
# The ATT&CK technique links are an analyst mapping by this project, not published by SWIFT. Review them
# before using the mapping in an attestation. No control is marked testable until a scenario covers it.
