# RBI (Commercial Banks -- Cybersecurity, Technology: Risk, Resilience and Assurance Framework) Directions, 2026,
# RBI/DoS/2026-27/410, DoS.CO.CSITEG.4/31.01.015/2026-27, dated 31 July 2026 (web version updated 1 October 2026).
#
# REVIEWED 2026-11-16 against the text of the Directions. Each control's `reference` cites the paragraph that states the
# requirement. The text was read from a copy of the RBI document (lexsite.com/eDocs/RBI-DoS-410.pdf): the PDF on
# rbidocs.rbi.org.in sits behind a CAPTCHA, which was not bypassed. Its title, reference, date and the paragraphs that
# RBI's own notification page reproduces (1-52) agree with the copy. See docs/regulatory/rbi-2026-mapping-review.md.
#
# What the review changed: figures a control name asserted but the Directions do not state were removed (patch windows
# of 30/7 days, 180-day log retention, AES-256, TLS 1.2, SAST/DAST, immutable backups, session recording, a WAF, network
# segmentation as such). The Directions ask for timely patching, logging with scope and storage agreed with
# stakeholders, strong non-deprecated cryptography, application security testing, and so on.
#
# What it did NOT do: the link from each control to ATT&CK techniques is Audspect's own judgement. RBI does not publish
# one. Results show how a control resisted the techniques executed, not whether the bank meets a paragraph.
#
# Repeal: para 230 repeals the earlier cybersecurity framework and IT governance directions for commercial banks, "as
# communicated vide circular no. DoS.CO.PPG.66/11.01.005/2026-27 dated July 31, 2026". The 2016 circular
# (RBI/2015-16/418) is not named in the Directions; that circular's list was not read.
#
# Applies to commercial banks. Small finance banks, payments banks and local area banks are excluded (paras 3-4).
#
# Not yet represented as controls: third-party arrangements (126-139), customer authentication (115-116), removable media
# (121-125), secure configuration (66-67), source-code and vendor certification (90-92), straight-through processing
# (141-142), anti-phishing services (148), VA/PT governance (149-161), and the governance, CSOC and audit chapters. There
# is no dedicated cloud section in the Directions.
id: RBI_CSF
name: RBI Cybersecurity, Technology Risk, Resilience and Assurance Framework (Commercial Banks)
version: "2026 (RBI/DoS/2026-27/410, DoS.CO.CSITEG.4/31.01.015/2026-27)"
regulator: RBI
published_year: "2026"
mapping_warning: "Control statements were reviewed against the text of the 2026 directions, and each control cites its paragraph. The links from controls to ATT&CK techniques are Audspect's own judgement, not published by RBI. Not yet covered: third-party arrangements, customer authentication, removable media, secure configuration, vendor source-code and certification, VA/PT governance and the governance chapters. The directions apply to commercial banks, not small finance banks, payments banks or local area banks."
controls:
  # ── Identity & Access Management ─────────────────────────────────────────
  - id: IAM-01
    name: Privileged access — administrative access to critical systems is controlled, logged and monitored
    reference: "¶105, ¶111"
    domain: Identity & Access Management
    category: Privileged Access
    techniques: [T1134, T1548, T1078]

  - id: IAM-02
    name: Multi-factor authentication — mandatory for privileged users of critical systems and for teleworking access to them
    reference: "¶110, ¶114"
    domain: Identity & Access Management
    category: Authentication
    techniques: [T1078, T1110, T1556]

  - id: IAM-03
    name: Access control — need-based access, no administrative rights on end-user devices, elevated access supervised and reviewed
    reference: "¶104-105, ¶108-109"
    domain: Identity & Access Management
    category: Access Control
    techniques: [T1068, T1087, T1134]

  - id: IAM-04
    name: Credential protection — logon credentials, authentication information and tokens protected against leakage and attack
    reference: "¶107"
    domain: Identity & Access Management
    category: Credential Management
    techniques: [T1003, T1555, T1558]

  # ── Network Security ─────────────────────────────────────────────────────
  - id: NET-01
    name: Network access control — only authorised access and devices on the network, unauthorised connections detected and blocked
    reference: "¶68, ¶73-74, ¶103"
    domain: Network Security
    category: Segmentation
    techniques: [T1021, T1550, T1571]

  - id: NET-02
    name: Boundary defence — multi-layered firewalls, proxies, DMZ perimeter networks and network IPS/IDS
    reference: "¶77"
    domain: Network Security
    category: Perimeter Security
    techniques: [T1562.004, T1071, T1095]

  - id: NET-03
    name: Secure remote access — access from outside the network protected (VPN or other secure protocols), MFA for teleworking access to critical systems
    reference: "¶106, ¶114"
    domain: Network Security
    category: Remote Access
    techniques: [T1133, T1021.001]

  - id: NET-04
    name: Network monitoring — unusual activity in systems, servers, network devices and endpoints detected and remedied
    reference: "¶75, ¶77"
    domain: Network Security
    category: Monitoring
    techniques: [T1071, T1095, T1572, T1219]

  # ── Endpoint Protection ───────────────────────────────────────────────────
  - id: EPT-01
    name: Anti-malware — protection with behavioural detection across endpoints, servers and gateways
    reference: "¶144-145"
    domain: Endpoint Protection
    category: Anti-Malware
    techniques: [T1059, T1047, T1562.001]

  - id: EPT-02
    name: Patch management — security patches identified, tracked and applied in a timely, risk-based way
    reference: "¶58, ¶98-100"
    domain: Endpoint Protection
    category: Vulnerability Management
    techniques: [T1190, T1203, T1068]

  - id: EPT-03
    name: Malicious code and phishing defence — email filtering, attachment controls and gateway protection
    reference: "¶117-119, ¶144"
    domain: Endpoint Protection
    category: Anti-Malware
    techniques: [T1566, T1059, T1204]

  - id: EPT-04
    name: Software control — inventory of authorised software, central control of installation, whitelisting where adopted
    reference: "¶56-57"
    domain: Endpoint Protection
    category: Execution Control
    techniques: [T1218, T1027, T1543]

  # ── Data Security ─────────────────────────────────────────────────────────
  - id: DAT-01
    name: Data protection at rest — sensitive data protected with strong, non-deprecated cryptography
    reference: "¶50, ¶106, ¶140"
    domain: Data Security
    category: Encryption
    techniques: [T1005, T1039, T1025]
    testable: false

  - id: DAT-02
    name: Data protection in transit — secure protocols and strong, non-deprecated ciphers
    reference: "¶106, ¶140"
    domain: Data Security
    category: Encryption
    techniques: [T1041, T1048]
    testable: false

  - id: DAT-03
    name: Data leak prevention — a strategy covering endpoints, data in transit and stored data, extended to vendor-managed facilities
    reference: "¶51-52"
    domain: Data Security
    category: Data Leakage Prevention
    techniques: [T1041, T1048, T1560]

  - id: DAT-04
    name: Data classification — information classified by its sensitivity
    reference: "¶48"
    domain: Data Security
    category: Data Classification
    techniques: [T1005, T1114, T1213]
    testable: false

  # ── Security Monitoring ───────────────────────────────────────────────────
  - id: MON-01
    name: SIEM and continuous surveillance — logs collected, correlated and monitored through a cyber security operations centre
    reference: "¶143, ¶215"
    domain: Security Monitoring
    category: SIEM
    techniques: [T1070, T1562.002, T1562]

  - id: MON-02
    name: Intrusion detection — IDS/IPS in the boundary defences
    reference: "¶77"
    domain: Security Monitoring
    category: Intrusion Detection
    techniques: [T1003, T1055, T1036, T1134]

  - id: MON-03
    name: Audit logs — audit trails on critical systems, regularly monitored; scope, frequency and storage set with stakeholders
    reference: "¶93-97"
    domain: Security Monitoring
    category: Log Management
    techniques: [T1070.001, T1562.002]

  # ── Incident Management ───────────────────────────────────────────────────
  - id: INC-01
    name: Incident detection — unusual activity detected and alerts escalated from the operations centre
    reference: "¶75, ¶215"
    domain: Incident Management
    category: Detection
    techniques: [T1003, T1558, T1486]

  - id: INC-02
    name: Incident response — documented policy, drills and crisis plan; incidents reported to RBI within six hours and CERT-In notified
    reference: "¶175, ¶182, ¶188-193"
    domain: Incident Management
    category: Response
    techniques: [T1486, T1490, T1485]
    testable: false

  # ── Business Continuity ───────────────────────────────────────────────────
  - id: BCP-01
    name: Backup and recovery — data backed up and periodically restored to test usability, integrity preserved, RTO/RPO met
    reference: "¶169-171"
    domain: Business Continuity
    category: Backup
    techniques: [T1490, T1486]

  - id: BCP-02
    name: Disaster recovery — DR drills at least half-yearly for critical systems, with a switchover to the alternate site for a full working day
    reference: "¶165-167"
    domain: Business Continuity
    category: Disaster Recovery
    techniques: [T1485, T1489, T1529]
    testable: false

  # ── Application Security ──────────────────────────────────────────────────
  - id: APP-01
    name: Secure development — secure coding, threat modelling and security testing across the application life cycle
    reference: "¶79-86"
    domain: Application Security
    category: Secure Development
    techniques: [T1190, T1505]
    testable: false

  - id: APP-02
    name: Internet-facing application protection — application security assessment and vulnerability management for web applications
    reference: "¶84-86, ¶150"
    domain: Application Security
    category: Application Protection
    techniques: [T1190, T1059.007]
