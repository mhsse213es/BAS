id: "API-BAS-BIZ-006"
name: "Order status moved past approval"
category: BIZ
claim: property_level
attack_objective: "The customer moves a pending order straight to shipped, skipping approval."
threat_model:
  attacker: "authenticated customer who owns the order"
  identity: customer-b
  access_level: "standard customer, valid token, owner of the order"
  objective: "skip the approval step of an order"
preconditions:
  fixture: orders-two-tenant
  identities: [customer-b]
  object: ORD-2001
steps:
  - id: "baseline-owner-read"
    role: baseline
    identity: customer-b
    auth: valid
    method: GET
    path: "/api/orders/{object}"
    hypothesis: "The owner can read their order. If this fails, the scenario is not testable."
  - id: "attack-skip-approval"
    role: attack
    identity: customer-b
    auth: valid
    method: PATCH
    path: "/api/biz/orders/{object}/status"
    body: "{\"status\":\"shipped\"}"
    hypothesis: "Only the next status is allowed, so a skip is refused with 409 and the order is unchanged."
denied_statuses: [409]
expected_control: "A status change that skips a step is refused with 409 and the order status is unchanged."
ground_truth:
  adapters: ["state", "response"]
  check: "The order status is identical before and after the attack."
detection_assertion:
  status: not_evaluated
  reason: "Detection validation is Phase 4; this scenario makes no detection claim."
evidence:
  - sanitized_request
  - sanitized_response
  - state_diff
side_effect_class: STATE_CHANGE_SANDBOX
cleanup:
  - "reset the lab to its fixture seed after the run"
industry_mapping:
  - "BFSI: business-logic validation of payment and order workflows"
regulatory_mapping: []
negative_tests:
  - "API-BAS-BIZ-006 against the fixed build must PASS"
