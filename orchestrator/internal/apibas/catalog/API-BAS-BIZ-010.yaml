id: "API-BAS-BIZ-010"
name: "Coupon redeemed more than once"
category: BIZ
claim: function_level
attack_objective: "The customer redeems one coupon repeatedly."
threat_model:
  attacker: "authenticated customer who owns the order"
  identity: customer-b
  access_level: "standard customer, valid token, owner of the order"
  objective: "redeem a single-use coupon more than once"
preconditions:
  fixture: orders-two-tenant
  identities: [customer-b]
  object: ORD-2001
steps:
  - id: "baseline-owner-read"
    role: baseline
    identity: customer-b
    auth: valid
    method: GET
    path: "/api/orders/{object}"
    hypothesis: "The owner can read their order. If this fails, the scenario is not testable."
  - id: "attack-coupon-repeat"
    role: attack
    identity: customer-b
    auth: valid
    method: POST
    path: "/api/biz/coupons/redeem"
    body: "{\"code\":\"BAS-COUPON-1\"}"
    repeat: 2
    hypothesis: "A coupon is redeemed once per caller and run; the second redemption is refused with 409."
max_accepted_attempts: 1
denied_statuses: [409]
expected_control: "A coupon is redeemed at most once per caller and run. Further redemptions are refused with 409."
ground_truth:
  adapters: ["state", "response"]
  check: "The number of redemptions accepted for one coupon and caller does not exceed one per run."
detection_assertion:
  status: not_evaluated
  reason: "Detection validation is Phase 4; this scenario makes no detection claim."
evidence:
  - sanitized_request
  - sanitized_response
  - state_diff
side_effect_class: STATE_CHANGE_SANDBOX
cleanup:
  - "reset the lab to its fixture seed after the run"
industry_mapping:
  - "BFSI: business-logic validation of payment and order workflows"
regulatory_mapping: []
negative_tests:
  - "API-BAS-BIZ-010 against the fixed build must PASS"
