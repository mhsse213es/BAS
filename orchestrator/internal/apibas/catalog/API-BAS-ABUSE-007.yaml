id: API-BAS-ABUSE-007
name: OTP send consumes paid SMS units without limit
category: ABUSE
claim: function_level
attack_objective: >
  An authenticated customer requests one-time codes in a loop. Each send consumes a paid SMS unit at the
  provider, so the operator pays for every request.
threat_model:
  attacker: authenticated customer who can request one-time codes
  identity: customer-b
  access_level: standard customer, valid token
  objective: consume paid SMS units without limit
preconditions:
  fixture: orders-two-tenant
  identities: [customer-b]
  object: ORD-2001
steps:
  - id: baseline-owner-read
    role: baseline
    identity: customer-b
    auth: valid
    method: GET
    path: /api/orders/{object}
    hypothesis: The owner can read their own order. If this fails, the scenario is not testable.
  - id: attack-unbounded-otp-send
    role: attack
    identity: customer-b
    auth: valid
    method: POST
    path: /api/auth/otp/send
    body: '{"phone": "+15550100"}'
    repeat: 10
    hypothesis: One-time code sends are limited per run, so the sends beyond the limit are refused before any paid unit is consumed.
max_accepted_attempts: 3
denied_statuses: [429]
expected_control: >
  Sends beyond the declared limit return 429, and no more than the declared number of paid sends are accepted
  in one run.
ground_truth:
  adapters: [state, response]
  check: >
    The number of accepted sends stays within the declared limit, and the state is unchanged by the attack
    beyond the sandbox reset.
detection_assertion:
  status: fixture_validated
  reason: "Ten OTP sends in one run reach the burst threshold. Paid-unit abuse is a volume the rule sees. Fixture-validated, not validated against a live SIEM."
detection:
  source: elastic-security
  expect_rule: APIBAS-REL-005
  min_severity: medium
evidence:
  - sanitized_request
  - sanitized_response
  - state_diff
side_effect_class: STATE_CHANGE_SANDBOX
cleanup:
  - reset the lab to its fixture seed after the run
industry_mapping:
  - "BFSI: one-time code endpoints that consume paid SMS without limit"
regulatory_mapping: []
negative_tests:
  - API-BAS-ABUSE-007 against the fixed build must PASS
  - API-BAS-ABUSE-007 with a single legitimate send against the fixed build must return 202
