id: API-BAS-ABUSE-002
name: Expensive report request runs without a period limit
category: ABUSE
claim: property_level
attack_objective: >
  The owner of orders requests a report over an extreme number of periods, to tie
  up service capacity with one cheap-to-send, expensive-to-serve request.
threat_model:
  attacker: authenticated customer who can request reports
  identity: customer-b
  access_level: standard customer, valid token, owner of the order
  objective: make single requests expensive enough to degrade the service for others
preconditions:
  fixture: orders-two-tenant
  identities: [customer-b]
  object: ORD-2001
steps:
  - id: baseline-owner-status
    role: baseline
    identity: customer-b
    auth: valid
    method: GET
    path: /api/orders/{object}/status
    hypothesis: The owner's cheap status request is the timing baseline. If this fails, the scenario is not testable.
  - id: attack-unbounded-report
    role: attack
    identity: customer-b
    auth: valid
    method: GET
    path: /api/orders/report?periods=200
    hypothesis: Reports above 12 periods are refused with 400 before any work is done, so the attack is denied quickly.
denied_statuses: [400]
latency:
  ceiling_ms: 250
  min_ratio: 5
  max_cv: 0.5
  warmup: 3
  trials: 10
  rounds: 3
max_work_units: 24000
calibration:
  version: 2
  baseline_ms: 0.14
  tolerance: 4
  attack_max_ms: 5000
  noise_floor_ms: 1
expected_control: >
  A report above 12 periods is refused with 400 before any work is done, so the
  cost of one request stays within the declared budget and the work units stay
  within the declared limit.
ground_truth:
  adapters: [state, response]
  check: >
    The timing and work units of the attack stay within the frozen budget for
    every round, and the attack is denied.
detection_assertion:
  status: not_evaluated
  reason: Detection validation is Phase 4; this scenario makes no detection claim.
evidence:
  - sanitized_request
  - sanitized_response
  - latency_rounds
  - work_units
side_effect_class: READ_ONLY
cleanup:
  - none; the scenario creates no records
industry_mapping:
  - "BFSI: unbounded reporting queries consuming shared capacity"
regulatory_mapping: []
negative_tests:
  - API-BAS-ABUSE-002 against the fixed build must PASS
