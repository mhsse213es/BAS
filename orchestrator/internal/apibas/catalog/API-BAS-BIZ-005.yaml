id: "API-BAS-BIZ-005"
name: "Concurrent withdrawals exceed the balance"
category: BIZ
claim: function_level
attack_objective: "The customer sends concurrent withdrawals so that each one passes the balance check before any is applied."
threat_model:
  attacker: "authenticated customer who owns the order"
  identity: customer-b
  access_level: "standard customer, valid token, owner of the order"
  objective: "withdraw more than the balance allows by racing the check"
preconditions:
  fixture: orders-two-tenant
  identities: [customer-b]
  object: ORD-2001
steps:
  - id: "baseline-owner-read"
    role: baseline
    identity: customer-b
    auth: valid
    method: GET
    path: "/api/orders/{object}"
    hypothesis: "The owner can read their order. If this fails, the scenario is not testable."
  - id: "attack-concurrent-withdraw"
    role: attack
    identity: customer-b
    auth: valid
    method: POST
    path: "/api/biz/orders/{object}/withdraw"
    body: "{}"
    repeat: 5
    parallel: true
    hypothesis: "The balance is checked and taken atomically. Only one concurrent withdrawal is accepted; the rest are refused with 409."
max_accepted_attempts: 1
denied_statuses: [409]
expected_control: "Concurrent withdrawals in one run are accepted no more than the balance allows, and the rest are refused with 409."
ground_truth:
  adapters: ["state", "response"]
  check: "The number of withdrawals accepted from concurrent requests does not exceed one per run."
detection_assertion:
  status: not_evaluated
  reason: "Detection validation is Phase 4; this scenario makes no detection claim."
evidence:
  - sanitized_request
  - sanitized_response
  - state_diff
side_effect_class: STATE_CHANGE_SANDBOX
cleanup:
  - "reset the lab to its fixture seed after the run"
industry_mapping:
  - "BFSI: business-logic validation of payment and order workflows"
regulatory_mapping: []
negative_tests:
  - "API-BAS-BIZ-005 against the fixed build must PASS"
