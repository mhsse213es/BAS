id: "API-BAS-INTEG-006"
name: "Proxy acts as another identity named in a header"
category: INTEG
claim: function_level
attack_objective: "The customer asks the proxy to read an order as a different customer named in X-Act-As."
threat_model:
  attacker: "authenticated customer who owns the order"
  identity: customer-b
  access_level: "standard customer, valid token, owner of the order"
  objective: "read another tenant's protected values through a confused-deputy proxy"
preconditions:
  fixture: orders-two-tenant
  identities: [customer-b]
  object: ORD-2001
steps:
  - id: "baseline-own-proxy"
    role: baseline
    identity: customer-b
    auth: valid
    method: GET
    path: "/api/proxy/orders/ORD-2001"
    hypothesis: "The customer reads their own order through the proxy. If this fails, the scenario is not testable."
  - id: "attack-act-as"
    role: attack
    identity: customer-b
    auth: valid
    method: GET
    path: "/api/proxy/orders/ORD-1001"
    headers: {"X-Act-As": "cust-a"}
    hypothesis: "The proxy acts only as the caller. Acting as another identity is refused with 403."
forbidden_values: ["BAS-SIM-ACC-A", "BAS-SIM-1001"]
denied_statuses: [403]
expected_control: "Acting as another identity through the proxy is refused with 403, and no other tenant's value is returned."
ground_truth:
  adapters: ["state", "response"]
  check: "No protected value of another tenant appears in the proxy response."
detection_assertion:
  status: fixture_validated
  reason: "The proxy request names an order owned by another customer. The access event names that owner. Fixture-validated, not validated against a live SIEM."
detection:
  source: elastic-security
  expect_rule: APIBAS-REL-004
  min_severity: high
evidence:
  - sanitized_request
  - sanitized_response
  - state_diff
side_effect_class: READ_ONLY
cleanup:
  - "reset the lab to its fixture seed after the run"
industry_mapping:
  - "BFSI / service integrations: a service may act only for the identity the caller proves"
regulatory_mapping: []
negative_tests:
  - "API-BAS-INTEG-006 against the fixed build must PASS"
