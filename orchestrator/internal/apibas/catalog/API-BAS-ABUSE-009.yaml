id: API-BAS-ABUSE-009
name: Per-session throttle is reset by rotating a client-supplied session identifier
category: ABUSE
claim: function_level
attack_objective: >
  A customer rotates a client-supplied session identifier, so a throttle keyed on that session
  never reaches its limit.
threat_model:
  attacker: authenticated customer who can set request headers
  identity: customer-b
  access_level: standard customer, valid token
  objective: exceed the per-caller request limit by rotating a session identifier
preconditions:
  fixture: orders-two-tenant
  identities: [customer-b]
  object: ORD-2001
steps:
  - id: baseline-quote
    role: baseline
    identity: customer-b
    auth: valid
    method: GET
    path: /api/abuse/quote
    hypothesis: A single quote request is within the limit. If this fails, the scenario is not testable.
  - id: attack-rotating-session
    role: attack
    identity: customer-b
    auth: valid
    method: GET
    path: /api/abuse/quote
    headers:
      X-Session-Id: s{n}
    repeat: 10
    hypothesis: The throttle is keyed on the authenticated caller, so rotating a session identifier does not reset it.
max_accepted_attempts: 5
denied_statuses: [429]
expected_control: >
  Requests beyond the per-caller limit return 429, whatever session identifier is sent.
ground_truth:
  adapters: [state, response]
  check: >
    The number of accepted requests stays within the declared limit, and the state is
    unchanged by the attack.
detection_assertion:
  status: fixture_validated
  reason: "Ten quote requests in one run reach the burst threshold. Rotating the session identifier does not change the run volume the rule counts. Fixture-validated, not validated against a live SIEM."
detection:
  source: elastic-security
  expect_rule: APIBAS-REL-005
  min_severity: medium
evidence:
  - sanitized_request
  - sanitized_response
  - state_diff
side_effect_class: READ_ONLY
cleanup:
  - no cleanup required for a read-only scenario
industry_mapping:
  - "BFSI: throttles keyed on client-controlled session identifiers"
regulatory_mapping: []
negative_tests:
  - API-BAS-ABUSE-009 with a single quote request against the fixed build must return a price
