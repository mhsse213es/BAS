id: "API-BAS-BIZ-011"
name: "Limited stock oversold by repeated reservations"
category: BIZ
claim: function_level
attack_objective: "The customer reserves a limited item repeatedly so that stock is oversold."
threat_model:
  attacker: "authenticated customer who owns the order"
  identity: customer-b
  access_level: "standard customer, valid token, owner of the order"
  objective: "reserve more units of a limited item than stock allows"
preconditions:
  fixture: orders-two-tenant
  identities: [customer-b]
  object: ORD-2001
steps:
  - id: "baseline-owner-read"
    role: baseline
    identity: customer-b
    auth: valid
    method: GET
    path: "/api/orders/{object}"
    hypothesis: "The owner can read their order. If this fails, the scenario is not testable."
  - id: "attack-oversell"
    role: attack
    identity: customer-b
    auth: valid
    method: POST
    path: "/api/biz/reservations"
    body: "{\"sku\":\"SKU-2001\"}"
    repeat: 2
    hypothesis: "A limited item has one unit per run; the second reservation is refused with 409."
max_accepted_attempts: 1
denied_statuses: [409]
expected_control: "A limited item can be reserved no more times than its stock allows; further reservations are refused with 409."
ground_truth:
  adapters: ["state", "response"]
  check: "The number of reservations accepted for one limited item does not exceed its stock per run."
detection_assertion:
  status: not_evaluated
  reason: "two reservations are below the volume threshold. No detection claim is made."
evidence:
  - sanitized_request
  - sanitized_response
  - state_diff
side_effect_class: STATE_CHANGE_SANDBOX
cleanup:
  - "reset the lab to its fixture seed after the run"
industry_mapping:
  - "BFSI: business-logic validation of payment and order workflows"
regulatory_mapping: []
negative_tests:
  - "API-BAS-BIZ-011 against the fixed build must PASS"
