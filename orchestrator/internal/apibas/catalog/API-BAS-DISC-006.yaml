id: "API-BAS-DISC-006"
name: "Staging environment skips authentication"
category: DISC
claim: function_level
attack_objective: "The customer calls the staging variant of the order details endpoint with no credential."
threat_model:
  attacker: "authenticated customer who owns the order"
  identity: customer-b
  access_level: "standard customer, valid token, owner of the order"
  objective: "read an order's protected values anonymously through the staging environment"
preconditions:
  fixture: orders-two-tenant
  identities: [customer-b]
  object: ORD-2001
steps:
  - id: "baseline-owner-read"
    role: baseline
    identity: customer-b
    auth: valid
    method: GET
    path: "/api/orders/{object}"
    hypothesis: "The owner can read their order. If this fails, the scenario is not testable."
  - id: "attack-staging-anonymous"
    role: attack
    identity: anonymous
    auth: none
    method: GET
    path: "/api/orders/{object}/details"
    headers: {"X-Environment": "staging"}
    hypothesis: "Staging requires authentication like production. An anonymous request is refused with 401."
forbidden_values: ["BAS-SIM-ACC-B", "BAS-SIM-2001"]
denied_statuses: [401]
expected_control: "An anonymous request to the staging environment is refused with 401, and no protected value is returned."
ground_truth:
  adapters: ["state", "response"]
  check: "No protected value appears in the staging response."
detection_assertion:
  status: fixture_validated
  reason: "The anonymous request to staging reaches an owned order and is served by the vulnerable build. REL-011 fires on it. Fixture-validated, not validated against a live SIEM."
detection:
  source: elastic-security
  expect_rule: APIBAS-REL-011
  min_severity: high
evidence:
  - sanitized_request
  - sanitized_response
  - state_diff
side_effect_class: READ_ONLY
cleanup:
  - "reset the lab to its fixture seed after the run"
industry_mapping:
  - "BFSI / cloud: every environment enforces the same authentication"
regulatory_mapping: []
negative_tests:
  - "API-BAS-DISC-006 against the fixed build must PASS"
