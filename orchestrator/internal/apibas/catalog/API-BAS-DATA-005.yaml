id: "API-BAS-DATA-005"
name: "Filter on a protected field exposes other tenants' values"
category: DATA
claim: property_level
attack_objective: "The customer filters orders on a protected field to reach another tenant's protected value."
threat_model:
  attacker: "authenticated customer who owns the order"
  identity: customer-b
  access_level: "standard customer, valid token, owner of the order"
  objective: "learn or read another tenant's protected reference through a filter"
preconditions:
  fixture: orders-two-tenant
  identities: [customer-b]
  object: ORD-2001
steps:
  - id: "baseline-owner-read"
    role: baseline
    identity: customer-b
    auth: valid
    method: GET
    path: "/api/orders/{object}"
    hypothesis: "The owner can read their order. If this fails, the scenario is not testable."
  - id: "attack-filter-protected"
    role: attack
    identity: customer-b
    auth: valid
    method: GET
    path: "/api/search/orders/filter?field=account_ref&value=BAS-SIM-ACC-A"
    hypothesis: "Filters run on public fields over the caller's own orders. A filter on a protected field is refused with 400."
forbidden_values: ["BAS-SIM-1001", "BAS-SIM-WHSEC-1001"]
denied_statuses: [400]
expected_control: "A filter on a protected field is refused with 400, and no other tenant's protected value appears."
ground_truth:
  adapters: ["state", "response"]
  check: "No protected value of another tenant appears in the filter response."
detection_assertion:
  status: fixture_validated
  reason: "The filter names the protected account value of an order owned by another customer. The lab attributes a query that names a protected value to that value owner, so the access event names that owner. Fixture-validated, not validated against a live SIEM."
detection:
  source: elastic-security
  expect_rule: APIBAS-REL-004
  min_severity: high
evidence:
  - sanitized_request
  - sanitized_response
  - state_diff
side_effect_class: READ_ONLY
cleanup:
  - "reset the lab to its fixture seed after the run"
industry_mapping:
  - "BFSI: search and filter must not disclose protected references across tenants"
regulatory_mapping: []
negative_tests:
  - "API-BAS-DATA-005 against the fixed build must PASS"
