id: API-BAS-INTEG-008
name: Integration webhook secret readable by a non-owner
category: INTEG
claim: cross_identity
attack_objective: >
  A customer reads the webhook configuration of another customer's order and
  obtains its webhook secret, which lets them forge webhook deliveries.
threat_model:
  attacker: authenticated customer in tenant A
  identity: customer-a
  access_level: standard customer, valid token, not the order owner
  objective: obtain another customer's webhook secret
preconditions:
  fixture: orders-two-tenant
  identities: [customer-b, customer-a]
  object: ORD-2001
steps:
  - id: baseline-owner-integration-read
    role: baseline
    identity: customer-b
    auth: valid
    method: GET
    path: /api/orders/{object}/integration
    hypothesis: The owner can read their integration configuration. If this fails, the scenario is not testable.
  - id: attack-foreign-integration-read
    role: attack
    identity: customer-a
    auth: valid
    method: GET
    path: /api/orders/{object}/integration
    hypothesis: Integration configuration is owner-only, so a non-owner is refused with 403 and sees no secret.
denied_statuses: [403]
expected_control: >
  The integration configuration of an order is returned only to its owner; a
  non-owner is refused with 403 and receives no webhook secret.
ground_truth:
  adapters: [state, response]
  check: >
    The state is unchanged by the attack and the attack response contains none
    of the owner's protected values.
detection_assertion:
  status: not_evaluated
  reason: Detection validation is Phase 4; this scenario makes no detection claim.
evidence:
  - sanitized_request
  - sanitized_response
  - state_diff
side_effect_class: READ_ONLY
cleanup:
  - none; the scenario creates no records
industry_mapping:
  - "BFSI: exposure of integration credentials to non-owning tenants"
regulatory_mapping: []
negative_tests:
  - API-BAS-INTEG-008 against the fixed build must PASS
