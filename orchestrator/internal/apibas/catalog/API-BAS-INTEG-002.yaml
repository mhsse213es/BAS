id: "API-BAS-INTEG-002"
name: "Signed webhook event replayed"
category: INTEG
claim: function_level
attack_objective: "A genuine signed event is delivered again. The signature still verifies."
threat_model:
  attacker: "authenticated customer who owns the order"
  identity: customer-b
  access_level: "standard customer, valid token, owner of the order"
  objective: "have the same signed event accepted more than once"
preconditions:
  fixture: orders-two-tenant
  identities: [customer-b]
  object: ORD-2001
steps:
  - id: "baseline-first-delivery"
    role: baseline
    identity: customer-b
    auth: valid
    method: POST
    path: "/api/webhooks/events"
    body: "{\"event_id\":\"EVT-2001-1\",\"type\":\"order.updated\",\"order\":\"ORD-2001\"}"
    headers: {"X-BAS-Timestamp": "1700000000", "X-BAS-Signature": "2a711f956c744855da1bbc8a193195c38fc427eca611237b9b5d606610fbb3eb"}
    hypothesis: "The first signed delivery is accepted. If it fails, the signature or body is wrong and the scenario is not testable."
  - id: "attack-replay-event"
    role: attack
    identity: anonymous
    auth: none
    method: POST
    path: "/api/webhooks/events"
    body: "{\"event_id\":\"EVT-2001-1\",\"type\":\"order.updated\",\"order\":\"ORD-2001\"}"
    headers: {"X-BAS-Timestamp": "1700000000", "X-BAS-Signature": "2a711f956c744855da1bbc8a193195c38fc427eca611237b9b5d606610fbb3eb"}
    repeat: 2
    hypothesis: "An event ID is accepted once per run. The replay is refused with 409."
max_accepted_attempts: 1
denied_statuses: [409]
expected_control: "A replayed signed event is refused with 409, and the event is accepted once per run."
ground_truth:
  adapters: ["state", "response"]
  check: "The number of deliveries accepted for one event ID does not exceed one per run."
detection_assertion:
  status: not_evaluated
  reason: "the anonymous webhook replay names no owned object; REL-011 needs an owned object, so no rule applies. No detection claim is made."
evidence:
  - sanitized_request
  - sanitized_response
  - state_diff
side_effect_class: STATE_CHANGE_SANDBOX
cleanup:
  - "reset the lab to its fixture seed after the run"
industry_mapping:
  - "BFSI / payments: webhook events are verified and replay-protected"
regulatory_mapping: []
negative_tests:
  - "API-BAS-INTEG-002 against the fixed build must PASS"
