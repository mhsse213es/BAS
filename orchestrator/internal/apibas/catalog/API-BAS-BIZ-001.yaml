id: "API-BAS-BIZ-001"
name: "Customer refund of an order without a support role"
category: BIZ
claim: property_level
attack_objective: "A customer who owns an order refunds it, although refunds are a support function."
threat_model:
  attacker: "authenticated customer who owns the order"
  identity: customer-b
  access_level: "standard customer, valid token, owner of the order"
  objective: "refund an order the customer does not have authority to refund"
preconditions:
  fixture: orders-two-tenant
  identities: [customer-b]
  object: ORD-2001
steps:
  - id: "baseline-owner-read"
    role: baseline
    identity: customer-b
    auth: valid
    method: GET
    path: "/api/orders/{object}"
    hypothesis: "The owner can read their order. If this fails, the scenario is not testable."
  - id: "attack-customer-refund"
    role: attack
    identity: customer-b
    auth: valid
    method: POST
    path: "/api/biz/orders/{object}/refund"
    body: "{}"
    hypothesis: "Refunds need a support role, so a customer is refused with 403 and the order is unchanged."
denied_statuses: [403]
expected_control: "A refund requested by a customer without a support role is refused with 403 and the order status is unchanged."
ground_truth:
  adapters: ["state", "response"]
  check: "The order status is identical before and after the attack."
detection_assertion:
  status: not_evaluated
  reason: "refund on the attacker own order; no foreign owner. No detection claim is made."
evidence:
  - sanitized_request
  - sanitized_response
  - state_diff
side_effect_class: STATE_CHANGE_SANDBOX
cleanup:
  - "reset the lab to its fixture seed after the run"
industry_mapping:
  - "BFSI: business-logic validation of payment and order workflows"
regulatory_mapping: []
negative_tests:
  - "API-BAS-BIZ-001 against the fixed build must PASS"
