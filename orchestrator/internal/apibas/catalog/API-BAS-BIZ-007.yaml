id: "API-BAS-BIZ-007"
name: "Maker approves their own payout"
category: BIZ
claim: property_level
attack_objective: "The customer who created the payout approves it themselves."
threat_model:
  attacker: "authenticated customer who owns the order"
  identity: customer-b
  access_level: "standard customer, valid token, owner of the order"
  objective: "approve a payout as its own maker"
preconditions:
  fixture: orders-two-tenant
  identities: [customer-b]
  object: ORD-2001
steps:
  - id: "baseline-owner-read"
    role: baseline
    identity: customer-b
    auth: valid
    method: GET
    path: "/api/orders/{object}"
    hypothesis: "The owner can read their order. If this fails, the scenario is not testable."
  - id: "attack-self-approve"
    role: attack
    identity: customer-b
    auth: valid
    method: POST
    path: "/api/biz/orders/{object}/approve-payout"
    body: "{}"
    hypothesis: "The maker cannot approve their own payout, so the request is refused with 403."
denied_statuses: [403]
expected_control: "A maker approving their own payout is refused with 403 and the order status is unchanged."
ground_truth:
  adapters: ["state", "response"]
  check: "The order status is identical before and after the attack."
detection_assertion:
  status: not_evaluated
  reason: "Detection validation is Phase 4; this scenario makes no detection claim."
evidence:
  - sanitized_request
  - sanitized_response
  - state_diff
side_effect_class: STATE_CHANGE_SANDBOX
cleanup:
  - "reset the lab to its fixture seed after the run"
industry_mapping:
  - "BFSI: business-logic validation of payment and order workflows"
regulatory_mapping: []
negative_tests:
  - "API-BAS-BIZ-007 against the fixed build must PASS"
