id: "API-BAS-BIZ-008"
name: "Transfer velocity has no limit"
category: BIZ
claim: function_level
attack_objective: "The customer sends transfers faster than any limit allows."
threat_model:
  attacker: "authenticated customer who owns the order"
  identity: customer-b
  access_level: "standard customer, valid token, owner of the order"
  objective: "send more transfers in a run than the velocity limit allows"
preconditions:
  fixture: orders-two-tenant
  identities: [customer-b]
  object: ORD-2001
steps:
  - id: "baseline-owner-read"
    role: baseline
    identity: customer-b
    auth: valid
    method: GET
    path: "/api/orders/{object}"
    hypothesis: "The owner can read their order. If this fails, the scenario is not testable."
  - id: "attack-transfer-burst"
    role: attack
    identity: customer-b
    auth: valid
    method: POST
    path: "/api/biz/transfers"
    body: "{\"amount\":1}"
    repeat: 6
    hypothesis: "At most three transfers per run and caller are accepted; the rest are refused with 429."
max_accepted_attempts: 3
denied_statuses: [429]
expected_control: "Transfers per run and caller are limited to three; further transfers are refused with 429."
ground_truth:
  adapters: ["state", "response"]
  check: "The number of transfers accepted for one caller does not exceed three per run."
detection_assertion:
  status: not_evaluated
  reason: "six transfers are below the volume threshold of ten. No detection claim is made."
evidence:
  - sanitized_request
  - sanitized_response
  - state_diff
side_effect_class: STATE_CHANGE_SANDBOX
cleanup:
  - "reset the lab to its fixture seed after the run"
industry_mapping:
  - "BFSI: business-logic validation of payment and order workflows"
regulatory_mapping: []
negative_tests:
  - "API-BAS-BIZ-008 against the fixed build must PASS"
