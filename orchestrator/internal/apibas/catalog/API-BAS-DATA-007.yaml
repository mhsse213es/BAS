id: "API-BAS-DATA-007"
name: "Export carries protected fields"
category: DATA
claim: property_level
attack_objective: "The customer downloads an export of their own order and looks for protected fields the export must not carry."
threat_model:
  attacker: "authenticated customer who owns the order"
  identity: customer-b
  access_level: "standard customer, valid token, owner of the order"
  objective: "obtain protected card and account references through the export"
preconditions:
  fixture: orders-two-tenant
  identities: [customer-b]
  object: ORD-2001
steps:
  - id: "baseline-owner-read"
    role: baseline
    identity: customer-b
    auth: valid
    method: GET
    path: "/api/orders/{object}"
    hypothesis: "The owner can read their order. If this fails, the scenario is not testable."
  - id: "attack-export"
    role: attack
    identity: customer-b
    auth: valid
    method: GET
    path: "/api/orders/{object}/export"
    hypothesis: "The export carries public fields only. Protected fields are absent, so the response is clean."
clean_is_enforcement: true
denied_statuses: [403]
expected_control: "The export returns public fields only. A response that carries a protected value is a disclosure."
ground_truth:
  adapters: ["state", "response"]
  check: "The protected values of the order are absent from the export response."
detection_assertion:
  status: not_evaluated
  reason: "export of the attacker own order; protected fields are a response property, not a rule class. No detection claim is made."
evidence:
  - sanitized_request
  - sanitized_response
  - state_diff
side_effect_class: READ_ONLY
cleanup:
  - "reset the lab to its fixture seed after the run"
industry_mapping:
  - "PCI DSS / BFSI: protected cardholder and account references never leave the system in an export"
regulatory_mapping: []
negative_tests:
  - "API-BAS-DATA-007 against the fixed build must PASS"
