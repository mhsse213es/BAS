id: "API-BAS-AUTHZ-104"
name: "NBFC-005: loan officer approves their own prepared decision"
category: AUTHZ
claim: cross_identity
attack_objective: "The loan officer prepares and then approves a decision on LOAN-A-001."
threat_model:
  attacker: "authenticated loan officer"
  identity: loan-officer
  access_level: "loan officer, valid token, assigned LOAN-A-001"
  objective: "The loan officer prepares and then approves a decision on LOAN-A-001."
preconditions:
  fixture: nbfc-two-borrower
  identities: [borrower-a, borrower-b, loan-officer]
  object: LOAN-A-001
steps:
  - id: "baseline-owner-loan"
    role: baseline
    identity: borrower-a
    auth: valid
    method: GET
    path: "/api/nbfc/loans/LOAN-A-001"
    hypothesis: "Borrower A, the owner, reads their own loan. If this fails, the scenario is not testable."
  - id: "setup-prepare-decision"
    role: setup
    identity: loan-officer
    auth: valid
    method: POST
    path: "/api/nbfc/loans/LOAN-A-001/prepare"
    body: '{}'
    hypothesis: "The officer prepares the decision on their own assignment, so the approval reaches the self-approval question."
  - id: "attack-approve-own-decision"
    role: attack
    identity: loan-officer
    auth: valid
    method: POST
    path: "/api/nbfc/loans/LOAN-A-001/decision"
    body: '{"decision":"approved"}'
    hypothesis: "The officer cannot approve the decision they prepared. The approval is refused and the loan status is unchanged."
denied_statuses: [403]
expected_control: "An officer cannot approve a decision they prepared. The approval is refused and the loan status is unchanged."
ground_truth:
  adapters: ["state", "response"]
  check: >
    The state shows LOAN-A-001's status unchanged after the officer approves their own prepared decision.
detection:
  source: elastic-security
  expect_rule: APIBAS-REL-007
  min_severity: high
additional_detections:
  - source: elastic-security
    expect_rule: APIBAS-REL-004
    min_severity: high
detection_assertion:
  status: fixture_validated
  reason: "The self-approval is a financial-approval call (REL-007) on a loan owned by another identity (REL-004). Graded against the access event by the named rule. Fixture-validated, not live-SIEM-validated."
side_effect_class: STATE_CHANGE_SANDBOX
cleanup:
  - "reset the lab to its fixture seed after the run"
evidence:
  - sanitized_request
  - sanitized_response
  - state_diff
industry_mapping:
  - "NBFC: a decision needs a second, independent approver (segregation of duties)"
regulatory_mapping: []
negative_tests:
  - "API-BAS-AUTHZ-104 against the fixed build must PASS"
  - "API-BAS-AUTHZ-104 against the vulnerable build must FAIL (exploited)"
