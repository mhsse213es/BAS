id: API-BAS-GWAY-009
name: Rate limit keyed on a client-supplied source address is bypassed by varying that address
category: GWAY
claim: function_level
attack_objective: >
  A customer repeats an order read while varying the X-Forwarded-For header, so a rate limit
  keyed on that header never reaches its threshold.
threat_model:
  attacker: authenticated customer who can set request headers
  identity: customer-b
  access_level: standard customer, valid token
  objective: exceed the per-caller request limit by rotating a client-supplied source address
preconditions:
  fixture: orders-two-tenant
  identities: [customer-b]
  object: ORD-2001
steps:
  - id: baseline-owner-read
    role: baseline
    identity: customer-b
    auth: valid
    method: GET
    path: /api/gw/orders/{object}
    hypothesis: The owner can read their own order within the limit. If this fails, the scenario is not testable.
  - id: attack-rotating-source-address
    role: attack
    identity: customer-b
    auth: valid
    method: GET
    path: /api/gw/orders/{object}
    headers:
      X-Forwarded-For: 10.0.0.{n}
    repeat: 10
    hypothesis: The limit is keyed on the authenticated caller, so rotating a header does not reset it.
max_accepted_attempts: 5
denied_statuses: [429]
expected_control: >
  The gateway refuses requests past the per-caller limit with 429, whatever source address
  header is sent.
ground_truth:
  adapters: [state, response]
  check: >
    The number of accepted requests stays within the declared limit, and the state is
    unchanged by the attack.
detection_assertion:
  status: fixture_validated
  reason: "Ten requests in one run reach the burst threshold. Varying the forwarded address does not change the run volume the rule counts. Fixture-validated, not validated against a live SIEM."
detection:
  source: elastic-security
  expect_rule: APIBAS-REL-005
  min_severity: medium
evidence:
  - sanitized_request
  - sanitized_response
  - state_diff
side_effect_class: READ_ONLY
cleanup:
  - no cleanup required for a read-only scenario
industry_mapping:
  - "BFSI: rate limits keyed on client-controlled headers"
regulatory_mapping: []
negative_tests:
  - API-BAS-GWAY-009 with a single legitimate read against the fixed build must PASS and return the owner's order
