id: API-BAS-ABUSE-005
name: Attachment upload accepts an unbounded body
category: ABUSE
claim: property_level
attack_objective: >
  The owner of an order uploads an attachment far larger than the API allows, to
  exhaust storage or memory on the service.
threat_model:
  attacker: authenticated customer who owns an order and can upload attachments
  identity: customer-b
  access_level: standard customer, valid token, owner of the order
  objective: send an oversized body that the service reads and keeps without a bound
preconditions:
  fixture: orders-two-tenant
  identities: [customer-b]
  object: ORD-2001
steps:
  - id: baseline-owner-read
    role: baseline
    identity: customer-b
    auth: valid
    method: GET
    path: /api/orders/{object}
    hypothesis: The owner can read their order. If this fails, the scenario is not testable.
  - id: attack-oversized-attachment
    role: attack
    identity: customer-b
    auth: valid
    method: POST
    path: /api/orders/{object}/attachments
    body: '{"name": "statement.pdf", "data": "{filler:2097152}"}'
    hypothesis: Bodies above 1 MiB are refused with 413, so the 2 MiB attachment is not accepted.
denied_statuses: [413]
max_accepted_bytes: 1048576
expected_control: >
  An attachment above 1 MiB is refused with 413, and no response reports accepting
  more than 1 MiB.
ground_truth:
  adapters: [state, response]
  check: >
    The state is unchanged by the attack, and no response reports accepting more
    than 1 MiB.
detection_assertion:
  status: fixture_validated
  reason: "The attack uploads a 2 MiB attachment. REL-015 fires on the request body size whatever the outcome: the vulnerable build accepts it, and the fixed build refuses it with 413. Fixture-validated, not validated against a live SIEM."
detection:
  source: elastic-security
  expect_rule: APIBAS-REL-015
  min_severity: medium
evidence:
  - sanitized_request
  - sanitized_response
  - accepted_bytes
  - state_diff
side_effect_class: STATE_CHANGE_SANDBOX
cleanup:
  - reset the lab to its fixture seed after the run
industry_mapping:
  - "BFSI: unbounded uploads exhausting service memory and storage"
regulatory_mapping: []
negative_tests:
  - API-BAS-ABUSE-005 against the fixed build must PASS
