id: API-BAS-DISC-005
name: Permissive CORS reflects an untrusted origin
category: DISC
claim: authentication
attack_objective: >
  A page served from an untrusted origin asks the API for a response, and the API
  grants that origin cross-origin read access by reflecting it back.
threat_model:
  attacker: web page on an untrusted origin that a signed-in customer visits
  identity: anonymous
  access_level: no credentials of its own; relies on the browser sending the victim's request
  objective: have the browser grant an untrusted origin cross-origin read access to API responses
preconditions:
  fixture: orders-two-tenant
  identities: [customer-b]
  object: ORD-2001
steps:
  - id: baseline-owner-read
    role: baseline
    identity: customer-b
    auth: valid
    method: GET
    path: /api/orders/{object}
    hypothesis: The owner can read their order. If this fails, the scenario is not testable.
  - id: attack-untrusted-origin-request
    role: attack
    identity: anonymous
    auth: none
    method: GET
    path: /api/public/status
    headers:
      Origin: https://attacker.example
    hypothesis: The API sends CORS grants only to trusted origins, so the untrusted origin receives no Access-Control-Allow-Origin.
denied_statuses: [403]
forbidden_response_headers:
  - name: Access-Control-Allow-Origin
    value: https://attacker.example
expected_control: >
  The API refuses cross-origin requests from untrusted origins with 403, and no
  response names an untrusted origin in Access-Control-Allow-Origin.
ground_truth:
  adapters: [state, response]
  check: >
    The state is unchanged by the attack, and the attack response does not grant the
    untrusted origin read access.
detection_assertion:
  status: not_evaluated
  reason: "anonymous CORS request; origin is not a rule class. No detection claim is made."
evidence:
  - sanitized_request
  - sanitized_response
  - response_headers
  - state_diff
side_effect_class: READ_ONLY
cleanup:
  - none; the scenario creates no records
industry_mapping:
  - "BFSI: browser-based exposure of API responses to untrusted sites"
regulatory_mapping: []
negative_tests:
  - API-BAS-DISC-005 against the fixed build must PASS
