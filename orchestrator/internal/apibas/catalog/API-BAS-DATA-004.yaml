id: API-BAS-DATA-004
name: Unbounded collection endpoint returns other customers' records
category: DATA
claim: cross_identity
clean_is_enforcement: true
attack_objective: >
  A customer calls the collection endpoint and receives every customer's order
  in full, because the list is neither filtered to the caller nor capped.
threat_model:
  attacker: authenticated customer in tenant A
  identity: customer-a
  access_level: standard customer, valid token
  objective: enumerate other customers' orders and their protected fields through the list endpoint
preconditions:
  fixture: orders-two-tenant
  identities: [customer-b, customer-a]
  object: ORD-2001
steps:
  - id: baseline-owner-read
    role: baseline
    identity: customer-b
    auth: valid
    method: GET
    path: /api/orders/{object}
    hypothesis: The owner can read their order. If this fails, the scenario is not testable.
  - id: attack-unbounded-list
    role: attack
    identity: customer-a
    auth: valid
    method: GET
    path: /api/orders?limit=1000
    hypothesis: The list is filtered to the caller and capped, so it returns no other customer's protected values.
denied_statuses: [403]
expected_control: >
  The list returns only the caller's public projection, capped, and contains no
  protected value of another customer's order.
ground_truth:
  adapters: [state, response]
  check: >
    The state is unchanged by the attack and the attack response contains none
    of the other customer's protected values. A 200 with only the caller's own
    public projection is the correct behaviour for this control.
detection_assertion:
  status: not_evaluated
  reason: Detection validation is Phase 4; this scenario makes no detection claim.
evidence:
  - sanitized_request
  - sanitized_response
  - state_diff
side_effect_class: READ_ONLY
cleanup:
  - none; the scenario creates no records
industry_mapping:
  - "BFSI: bulk enumeration of customer orders and account references"
regulatory_mapping: []
negative_tests:
  - API-BAS-DATA-004 against the fixed build must PASS
