id: API-BAS-DISC-002
name: Retired API version still serves records without credentials
category: DISC
claim: authentication
attack_objective: >
  An anonymous client calls a retired API version that was never decommissioned
  and receives full customer records.
threat_model:
  attacker: unauthenticated client who finds a legacy route in documentation or a crawl
  identity: anonymous
  access_level: none; no token of any kind
  objective: read a customer's order through a retired API version
preconditions:
  fixture: orders-two-tenant
  identities: [customer-b]
  object: ORD-2001
steps:
  - id: baseline-owner-read-current-version
    role: baseline
    identity: customer-b
    auth: valid
    method: GET
    path: /api/orders/{object}
    hypothesis: The owner can read their order on the current version. If this fails, the scenario is not testable.
  - id: attack-retired-version-anonymous
    role: attack
    identity: anonymous
    auth: none
    method: GET
    path: /api/v0/orders/{object}
    hypothesis: The retired version is decommissioned, so the route is not mounted and returns 404.
denied_statuses: [404]
expected_control: >
  The retired version returns 404 and discloses no order data.
ground_truth:
  adapters: [state, response]
  check: >
    The state is unchanged by the attack and the attack response contains none
    of the owner's protected values.
detection_assertion:
  status: not_evaluated
  reason: "anonymous request to a retired version; no identity to attribute. No detection claim is made."
evidence:
  - sanitized_request
  - sanitized_response
  - state_diff
side_effect_class: READ_ONLY
cleanup:
  - none; the scenario creates no records
industry_mapping:
  - "BFSI: exposure of customer data through decommissioned API versions"
regulatory_mapping: []
negative_tests:
  - API-BAS-DISC-002 against the fixed build must PASS
