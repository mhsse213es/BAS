id: "API-BAS-INTEG-009"
name: "Partner trusted to name any customer"
category: INTEG
claim: function_level
attack_objective: "An integration partner asks for another tenant's order by naming that customer."
threat_model:
  attacker: "authenticated customer who owns the order"
  identity: customer-b
  access_level: "standard customer, valid token, owner of the order"
  objective: "read another tenant's protected values through a partner that is not authorized for them"
preconditions:
  fixture: orders-two-tenant
  identities: [customer-b]
  object: ORD-2001
steps:
  - id: "baseline-partner-own"
    role: baseline
    identity: customer-b
    auth: valid
    method: GET
    path: "/api/partner/orders/ORD-2001"
    headers: {"X-Partner-Token": "BAS-PARTNER-ACME", "X-Partner-Customer": "cust-b"}
    hypothesis: "The partner reads an order of a customer it is authorized for. If this fails, the scenario is not testable."
  - id: "attack-partner-other-tenant"
    role: attack
    identity: anonymous
    auth: none
    method: GET
    path: "/api/partner/orders/ORD-1001"
    headers: {"X-Partner-Token": "BAS-PARTNER-ACME", "X-Partner-Customer": "cust-a"}
    hypothesis: "The partner is authorized only for cust-b. A request for cust-a is refused with 403."
forbidden_values: ["BAS-SIM-ACC-A", "BAS-SIM-1001"]
denied_statuses: [403]
expected_control: "A partner request naming a customer it is not authorized for is refused with 403, and no other tenant's value is returned."
ground_truth:
  adapters: ["state", "response"]
  check: "No protected value of another tenant appears in the partner response."
detection_assertion:
  status: fixture_validated
  reason: "The anonymous partner request names an owned order. REL-011 fires when the vulnerable build serves it. Fixture-validated, not validated against a live SIEM."
detection:
  source: elastic-security
  expect_rule: APIBAS-REL-011
  min_severity: high
evidence:
  - sanitized_request
  - sanitized_response
  - state_diff
side_effect_class: READ_ONLY
cleanup:
  - "reset the lab to its fixture seed after the run"
industry_mapping:
  - "BFSI / open banking: partner access is scoped to the customers the partner is authorized for"
regulatory_mapping: []
negative_tests:
  - "API-BAS-INTEG-009 against the fixed build must PASS"
