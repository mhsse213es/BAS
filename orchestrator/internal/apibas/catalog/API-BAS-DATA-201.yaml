id: "API-BAS-DATA-201"
name: "MFG-005: planner reads another plant's bill of materials and CAD reference"
category: DATA
claim: cross_identity
attack_objective: "Planner A reads plant B's bill of materials and receives its CAD reference and supplier cost."
threat_model:
  attacker: "authenticated planner at plant A"
  identity: planner-a
  access_level: "planner, valid token, owns BOM-A-001 only"
  objective: "Planner A reads plant B's bill of materials and receives its CAD reference and supplier cost."
preconditions:
  fixture: manufacturing-two-plant
  identities: [planner-a, planner-b]
  object: BOM-B-001
steps:
  - id: "baseline-owner"
    role: baseline
    identity: planner-b
    auth: valid
    method: GET
    path: "/api/mfg/bom/BOM-B-001"
    hypothesis: "Planner B, the owner, reads their own bill of materials. If this fails, the scenario is not testable."
  - id: "attack-data-201"
    role: attack
    identity: planner-a
    auth: valid
    method: GET
    path: "/api/mfg/bom/BOM-B-001"
    hypothesis: "Planner A's read of BOM-B-001 is refused, and no CAD reference or supplier cost comes back."
denied_statuses: [403, 404]
forbidden_values: ["BAS-SIM-CAD-B", "BAS-SIM-COST-B"]
expected_control: "A planner cannot read another plant's bill of materials. The read is refused and no CAD reference or cost is returned."
ground_truth:
  adapters: ["state", "response"]
  check: >
    The response to planner A's read of BOM-B-001 carries no CAD reference or supplier cost.
detection:
  source: elastic-security
  expect_rule: APIBAS-REL-004
  min_severity: high
detection_assertion:
  status: fixture_validated
  reason: "The read names BOM-B-001, owned by planner B, from planner A. Graded against the access event by APIBAS-REL-004. Fixture-validated, not live-SIEM-validated."
side_effect_class: READ_ONLY
evidence:
  - sanitized_request
  - sanitized_response
industry_mapping:
  - "Manufacturing: bill of materials and CAD data leakage"
regulatory_mapping: []
negative_tests:
  - "API-BAS-DATA-201 against the fixed build must PASS"
  - "API-BAS-DATA-201 against the vulnerable build must FAIL (exploited)"
