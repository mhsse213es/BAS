id: "API-BAS-AUTHN-004"
name: "Authorization code sent to an unregistered redirect URI"
category: AUTHN
claim: property_level
attack_objective: "The customer asks for an authorization code to be sent to an attacker host."
threat_model:
  attacker: "authenticated customer who owns the order"
  identity: customer-b
  access_level: "standard customer, valid token, owner of the order"
  objective: "receive an authorization code at an unregistered redirect URI"
preconditions:
  fixture: orders-two-tenant
  identities: [customer-b]
  object: ORD-2001
steps:
  - id: "baseline-authorize"
    role: baseline
    identity: customer-b
    auth: valid
    method: GET
    path: "/api/oauth/authorize?client_id=bas-app&redirect_uri=https%3A%2F%2Fapp.example%2Fcallback&code_challenge=957S3L5qTd-cieBzKYF4XUuLub-X40jC7vrrxut4bEc&code_challenge_method=S256&response_type=code"
    hypothesis: "The registered redirect with a PKCE challenge succeeds. If it fails, the scenario is not testable."
  - id: "attack-attacker-redirect"
    role: attack
    identity: customer-b
    auth: valid
    method: GET
    path: "/api/oauth/authorize?client_id=bas-app&redirect_uri=https%3A%2F%2Fattacker.example%2Fsteal&code_challenge=957S3L5qTd-cieBzKYF4XUuLub-X40jC7vrrxut4bEc&code_challenge_method=S256&response_type=code"
    hypothesis: "Only the registered redirect URI is accepted. An unregistered one is refused with 400 and no Location to it is issued."
denied_statuses: [400]
forbidden_response_headers:
  - name: Location
    value: attacker.example
    match: contains
expected_control: "An authorization request with an unregistered redirect URI is refused with 400; no Location points at another host."
ground_truth:
  adapters: ["state", "response"]
  check: "No response Location header points at the attacker host."
detection_assertion:
  status: fixture_validated
  reason: "The attack authorizes with an unregistered redirect_uri. REL-012 fires on the attempt whatever the outcome: the vulnerable build redirects to the attacker host, and the fixed build refuses the request with 400. Fixture-validated, not validated against a live SIEM."
detection:
  source: elastic-security
  expect_rule: APIBAS-REL-012
  min_severity: high
evidence:
  - sanitized_request
  - sanitized_response
  - state_diff
side_effect_class: READ_ONLY
cleanup:
  - "reset the lab to its fixture seed after the run"
industry_mapping:
  - "BFSI / open banking: authorization codes only go to registered redirect URIs"
regulatory_mapping: []
negative_tests:
  - "API-BAS-AUTHN-004 against the fixed build must PASS"
