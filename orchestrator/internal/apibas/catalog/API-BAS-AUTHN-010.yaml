id: "API-BAS-AUTHN-010"
name: "Sensitive action without step-up verification"
category: AUTHN
claim: property_level
attack_objective: "The customer closes an order, a sensitive action, without the step-up verification."
threat_model:
  attacker: "authenticated customer who owns the order"
  identity: customer-b
  access_level: "standard customer, valid token, owner of the order"
  objective: "perform a sensitive action without the step-up proof"
preconditions:
  fixture: orders-two-tenant
  identities: [customer-b]
  object: ORD-2001
steps:
  - id: "baseline-owner-read"
    role: baseline
    identity: customer-b
    auth: valid
    method: GET
    path: "/api/orders/{object}"
    hypothesis: "The owner can read their order. If this fails, the scenario is not testable."
  - id: "attack-close-no-stepup"
    role: attack
    identity: customer-b
    auth: valid
    method: POST
    path: "/api/orders/{object}/close"
    body: "{}"
    hypothesis: "A sensitive action needs step-up verification; without it the request is refused with 403 and the order is unchanged."
denied_statuses: [403]
expected_control: "A sensitive action without the step-up verification is refused with 403 and the order status is unchanged."
ground_truth:
  adapters: ["state", "response"]
  check: "The order status is identical before and after the attack."
detection_assertion:
  status: not_evaluated
  reason: "Detection validation is Phase 4; this scenario makes no detection claim."
evidence:
  - sanitized_request
  - sanitized_response
  - state_diff
side_effect_class: STATE_CHANGE_SANDBOX
cleanup:
  - "reset the lab to its fixture seed after the run"
industry_mapping:
  - "BFSI: step-up authentication for account-closing and other sensitive actions"
regulatory_mapping: []
negative_tests:
  - "API-BAS-AUTHN-010 against the fixed build must PASS"
