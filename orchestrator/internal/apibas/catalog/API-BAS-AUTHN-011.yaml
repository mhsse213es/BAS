id: API-BAS-AUTHN-011
name: WebSocket handshake accepts a foreign origin and no credential
category: AUTHN
claim: authentication
protocol: websocket
baseline_status: 101
prerequisites:
  - WebSocket handshake and frame adapter, not yet implemented
  - lab WebSocket endpoint that checks the Origin header and the bearer token at the handshake
  - "owner decision recorded: kept under AUTHN as WebSocket handshake authentication (not session validation or a generic bypass)"
attack_objective: >
  An unauthenticated client on a foreign origin completes a WebSocket handshake to the order event
  stream and receives order events, so authentication at the handshake is bypassed.
threat_model:
  attacker: unauthenticated client on a foreign origin, able to make a victim's browser open a WebSocket
  identity: anonymous
  access_level: no credential; can make the victim's browser open a WebSocket
  objective: receive the order events of the victim's session by bypassing handshake authentication
preconditions:
  fixture: orders-two-tenant
  identities: [customer-b, anonymous]
  object: ORD-2001
steps:
  - id: baseline-owner-handshake
    role: baseline
    identity: customer-b
    auth: valid
    method: GET
    path: /ws/orders
    headers:
      Upgrade: websocket
      Connection: Upgrade
      Sec-WebSocket-Version: "13"
      Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==
      Origin: https://app.audspect.example
    hypothesis: The owner can open the order stream from an allowed origin with a valid token. If this fails, the scenario is not testable.
  - id: attack-foreign-origin-handshake
    role: attack
    identity: anonymous
    auth: none
    method: GET
    path: /ws/orders
    headers:
      Upgrade: websocket
      Connection: Upgrade
      Sec-WebSocket-Version: "13"
      Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==
      Origin: https://attacker.example
    hypothesis: The handshake checks the origin and requires a credential, so a foreign origin with no credential is refused.
denied_statuses: [403]
expected_control: >
  The handshake is refused with 403 when the Origin is not allowed or when no valid bearer token is
  presented. No order event frame is delivered to the client.
ground_truth:
  adapters: [state, response]
  check: >
    The handshake opens no order stream for the attacker, and the state is unchanged by the attack.
detection_assertion:
  status: not_evaluated
  reason: "WebSocket handshake only; origin validation is not a rule class and frame behaviour is not built. No detection claim is made."
evidence:
  - sanitized_request
  - sanitized_response
  - state_diff
side_effect_class: READ_ONLY
cleanup:
  - no cleanup required for a read-only scenario
industry_mapping:
  - "BFSI: real-time order streams that accept cross-origin handshakes without authentication"
regulatory_mapping: []
negative_tests:
  - API-BAS-AUTHN-011 with the owner's handshake from the allowed origin against the fixed build must be accepted
