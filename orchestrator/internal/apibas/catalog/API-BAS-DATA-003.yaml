id: API-BAS-DATA-003
name: Error response for a malformed body discloses another customer's record
category: DATA
claim: cross_identity
attack_objective: >
  A customer sends a malformed update to another customer's order, and the error
  response includes that order's full record.
threat_model:
  attacker: authenticated customer in tenant A
  identity: customer-a
  access_level: standard customer, valid token
  objective: read another customer's record through a verbose error response
preconditions:
  fixture: orders-two-tenant
  identities: [customer-b, customer-a]
  object: ORD-2001
steps:
  - id: baseline-owner-read
    role: baseline
    identity: customer-b
    auth: valid
    method: GET
    path: /api/orders/{object}
    hypothesis: The owner can read their order. If this fails, the scenario is not testable.
  - id: attack-malformed-update
    role: attack
    identity: customer-a
    auth: valid
    method: PATCH
    path: /api/orders/{object}
    body: '{"status": '
    hypothesis: Errors are generic and carry no record data, so a malformed body reveals nothing about the order.
denied_statuses: [400]
expected_control: >
  A malformed update returns a generic 400 with no order data and changes nothing.
ground_truth:
  adapters: [state, response]
  check: >
    The state is unchanged by the attack and the error response contains none
    of the owner's protected values.
detection_assertion:
  status: not_evaluated
  reason: Detection validation is Phase 4; this scenario makes no detection claim.
evidence:
  - sanitized_request
  - sanitized_response
  - state_diff
side_effect_class: STATE_CHANGE_SANDBOX
cleanup:
  - reset the lab to its fixture seed after the run
industry_mapping:
  - "BFSI: verbose error messages that expose customer records"
regulatory_mapping: []
negative_tests:
  - API-BAS-DATA-003 against the fixed build must PASS
