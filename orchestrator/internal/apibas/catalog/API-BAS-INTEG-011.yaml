id: "API-BAS-INTEG-011"
name: "Callback registered to an unallowlisted host"
category: INTEG
claim: function_level
attack_objective: "The customer registers a webhook callback to a host outside the allowlist, twice."
threat_model:
  attacker: "authenticated customer who owns the order"
  identity: customer-b
  access_level: "standard customer, valid token, owner of the order"
  objective: "register callbacks to an attacker host more than once"
preconditions:
  fixture: orders-two-tenant
  identities: [customer-b]
  object: ORD-2001
steps:
  - id: "baseline-allowlisted"
    role: baseline
    identity: customer-b
    auth: valid
    method: POST
    path: "/api/integrations/callbacks"
    body: "{\"url\":\"https://hooks.partner.example/bas\"}"
    hypothesis: "A callback to the allowlisted host is registered. If this fails, the scenario is not testable."
  - id: "attack-register-attacker"
    role: attack
    identity: customer-b
    auth: valid
    method: POST
    path: "/api/integrations/callbacks"
    body: "{\"url\":\"https://attacker.example/steal\"}"
    repeat: 2
    hypothesis: "Only allowlisted hosts are registered. A callback to another host is refused with 400."
max_accepted_attempts: 1
denied_statuses: [400]
expected_control: "A callback to a host outside the allowlist is refused with 400."
ground_truth:
  adapters: ["state", "response"]
  check: "The number of callbacks registered to a non-allowlisted host does not exceed the declared maximum of zero per run."
detection_assertion:
  status: not_evaluated
  reason: "callback registration has no object; no allowlist rule. No detection claim is made."
evidence:
  - sanitized_request
  - sanitized_response
  - state_diff
side_effect_class: STATE_CHANGE_SANDBOX
cleanup:
  - "reset the lab to its fixture seed after the run"
industry_mapping:
  - "BFSI / open banking: callbacks go only to allowlisted partner hosts"
regulatory_mapping: []
negative_tests:
  - "API-BAS-INTEG-011 against the fixed build must PASS"
