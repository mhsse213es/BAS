id: API-BAS-INJ-012
name: Form-encoded status update skips the validation that the JSON path enforces
category: INJ
claim: property_level
attack_objective: >
  A customer sends a refused status as a form-encoded body, which the handler applies
  without the validation its JSON path performs.
threat_model:
  attacker: authenticated customer who owns the order
  identity: customer-b
  access_level: standard customer, valid token, owner of the object
  objective: set an unvalidated status on their own order through an alternate content type
preconditions:
  fixture: orders-two-tenant
  identities: [customer-b]
  object: ORD-2001
steps:
  - id: baseline-owner-transition-json
    role: baseline
    identity: customer-b
    auth: valid
    method: POST
    path: /api/orders/{object}/transition
    body: '{"status": "shipped"}'
    hypothesis: The owner can transition their own order with a permitted status over JSON. If this fails, the scenario is not testable.
  - id: attack-form-status
    role: attack
    identity: customer-b
    auth: valid
    method: POST
    path: /api/orders/{object}/transition
    headers:
      Content-Type: application/x-www-form-urlencoded
    body: 'status=refunded'
    hypothesis: Validation applies to every content type, so a refused status is rejected in the form path as well.
denied_statuses: [400]
expected_control: >
  The form-encoded transition refuses the unvalidated status with 400, and the order
  status is unchanged.
ground_truth:
  adapters: [state, response]
  check: >
    The order status is identical before and after the attack, and the response
    discloses no protected values.
detection_assertion:
  status: not_evaluated
  reason: "a form-encoded status that skips validation is a validation bypass, not an injection pattern; no injection class is set. No detection claim is made."
evidence:
  - sanitized_request
  - sanitized_response
  - state_diff
side_effect_class: STATE_CHANGE_SANDBOX
cleanup:
  - reset the lab to its fixture seed after the run
industry_mapping:
  - "BFSI: validation applied on one content type but not another"
regulatory_mapping: []
negative_tests:
  - API-BAS-INJ-012 with a permitted status over form encoding against the fixed build must PASS on the legitimate update
