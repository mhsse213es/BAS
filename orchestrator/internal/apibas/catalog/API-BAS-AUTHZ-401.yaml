id: "API-BAS-AUTHZ-401"
name: "RET-001: shopper tracks another shopper's shipment"
category: AUTHZ
claim: cross_identity
attack_objective: "Shopper A reads shopper B's shipment and receives its delivery address."
threat_model:
  attacker: "authenticated shopper A"
  identity: shopper-a
  access_level: "shopper, valid token, owns SHIP-A-001 only"
  objective: "Shopper A reads shopper B's shipment and receives its delivery address."
preconditions:
  fixture: commerce-telecom-two-tenant
  identities: [shopper-a, shopper-b]
  object: SHIP-B-001
steps:
  - id: "baseline-owner"
    role: baseline
    identity: shopper-b
    auth: valid
    method: GET
    path: "/api/retail/shipments/SHIP-B-001"
    hypothesis: "Shopper B, the owner, reads their own shipment. If this fails, the scenario is not testable."
  - id: "attack-authz-401"
    role: attack
    identity: shopper-a
    auth: valid
    method: GET
    path: "/api/retail/shipments/SHIP-B-001"
    hypothesis: "Shopper A's read of SHIP-B-001 is refused, and no delivery address comes back."
denied_statuses: [403, 404]
forbidden_values: ["BAS-SIM-ADDR-B"]
expected_control: "A shopper cannot read another shopper's shipment. The read is refused and no delivery address is returned."
ground_truth:
  adapters: ["state", "response"]
  check: >
    The response to shopper A's read of SHIP-B-001 carries no delivery address of shopper B.
detection:
  source: elastic-security
  expect_rule: APIBAS-REL-004
  min_severity: high
detection_assertion:
  status: fixture_validated
  reason: "The read names SHIP-B-001, owned by shopper B, from shopper A. Graded against the access event by APIBAS-REL-004. Fixture-validated, not live-SIEM-validated."
side_effect_class: READ_ONLY
evidence:
  - sanitized_request
  - sanitized_response
industry_mapping:
  - "Retail and logistics: order and shipment ownership bypass"
regulatory_mapping: []
negative_tests:
  - "API-BAS-AUTHZ-401 against the fixed build must PASS"
  - "API-BAS-AUTHZ-401 against the vulnerable build must FAIL (exploited)"
