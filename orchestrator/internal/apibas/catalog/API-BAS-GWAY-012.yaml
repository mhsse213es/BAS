id: "API-BAS-GWAY-012"
name: "Upstream TLS certificate not verified and content relayed"
category: GWAY
claim: function_level
attack_objective: "The customer asks the gateway to fetch from an upstream whose TLS certificate is not trusted."
threat_model:
  attacker: "authenticated customer who owns the order"
  identity: customer-b
  access_level: "standard customer, valid token, owner of the order"
  objective: "have the gateway relay content from an upstream with an untrusted certificate"
preconditions:
  fixture: orders-two-tenant
  identities: [customer-b]
  object: ORD-2001
steps:
  - id: "baseline-trusted-upstream"
    role: baseline
    identity: customer-b
    auth: valid
    method: POST
    path: "/api/gateway/upstream-fetch"
    body: "{\"url\":\"{lab_url}/api/tls-probe\"}"
    hypothesis: "The upstream with a trusted certificate is fetched. If this fails, the scenario is not testable."
  - id: "attack-untrusted-upstream"
    role: attack
    identity: customer-b
    auth: valid
    method: POST
    path: "/api/gateway/upstream-fetch"
    body: "{\"url\":\"{rogue_url}/api/tls-probe\"}"
    hypothesis: "The upstream certificate must verify. An untrusted upstream is refused with 422 and nothing is relayed."
forbidden_values: ["BAS-UPSTREAM-PROBE"]
denied_statuses: [422]
expected_control: "An upstream whose TLS certificate does not verify is refused with 422, and its content is not relayed."
ground_truth:
  adapters: ["state", "response"]
  check: "The relayed upstream content does not contain the upstream's probe value."
detection_assertion:
  status: not_evaluated
  reason: "Detection validation is Phase 4; this scenario makes no detection claim."
evidence:
  - sanitized_request
  - sanitized_response
  - state_diff
side_effect_class: STATE_CHANGE_SANDBOX
cleanup:
  - "reset the lab to its fixture seed after the run"
industry_mapping:
  - "BFSI / payments: outbound TLS must verify the upstream certificate"
regulatory_mapping: []
negative_tests:
  - "API-BAS-GWAY-012 against the fixed build must PASS"
