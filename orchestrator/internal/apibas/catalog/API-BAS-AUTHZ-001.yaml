id: API-BAS-AUTHZ-001
name: BOLA on an order-detail endpoint
category: AUTHZ
claim: cross_identity
attack_objective: >
  An authenticated customer reads another customer's order by substituting the
  order identifier into their own request.
threat_model:
  attacker: authenticated customer in tenant A
  identity: customer-a
  access_level: standard customer, valid token, no elevated role
  objective: read customer-b's order, including protected card and account fields
preconditions:
  fixture: orders-two-tenant
  identities: [customer-a, customer-b]
  object: ORD-2001
steps:
  - id: baseline-owner-read
    role: baseline
    identity: customer-b
    method: GET
    path: /api/orders/{object}
    hypothesis: The owner can read their own order. If this fails, the scenario is not testable.
  - id: attack-cross-identity-read
    role: attack
    identity: customer-a
    method: GET
    path: /api/orders/{object}
    hypothesis: The order-detail endpoint verifies that the caller owns the order before returning it.
denied_statuses: [401, 403, 404]
expected_control: >
  The endpoint returns 403 (or 404) to a non-owner and discloses no protected
  values of the owner's order.
ground_truth:
  adapters: [state, response]
  check: >
    The state snapshot is identical before and after the attack, and the attack
    response contains none of the owner's protected values.
detection_assertion:
  status: fixture_validated
  reason: Access events feed the elastic-security fixture. The result is fixture-validated, not live-SIEM-validated.
evidence:
  - sanitized_request
  - sanitized_response
  - state_diff
side_effect_class: READ_ONLY
cleanup:
  - none; the scenario creates no records. Run-tagged cleanup is still available for runs that seed data.
industry_mapping:
  - "BFSI: cross-customer order and statement access"
regulatory_mapping: []
negative_tests:
  - API-BAS-AUTHZ-001 against the fixed build must PASS
  - API-BAS-AUTHZ-001 with the attacker identical to the owner must be SKIPPED NOT_CROSS_IDENTITY
detection:
  source: elastic-security
  expect_rule: APIBAS-REL-001
  min_severity: high
