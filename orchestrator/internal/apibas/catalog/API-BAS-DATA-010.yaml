id: "API-BAS-DATA-010"
name: "Signed file URL not bound to its key"
category: DATA
claim: property_level
attack_objective: "The customer uses the signature for their own statement to open another tenant's statement."
threat_model:
  attacker: "authenticated customer who owns the order"
  identity: customer-b
  access_level: "standard customer, valid token, owner of the order"
  objective: "open another tenant's file with a signature issued for a different key"
preconditions:
  fixture: orders-two-tenant
  identities: [customer-b]
  object: ORD-2001
steps:
  - id: "baseline-own-file"
    role: baseline
    identity: customer-b
    auth: valid
    method: GET
    path: "/api/files/ORD-2001-statement?sig=28cd5822696fd34e"
    hypothesis: "The customer opens their own statement with the matching signature. If it fails, the scenario is not testable."
  - id: "attack-other-tenant-file"
    role: attack
    identity: customer-b
    auth: valid
    method: GET
    path: "/api/files/ORD-1001-statement?sig=28cd5822696fd34e"
    hypothesis: "A signature is bound to its key and owner. The signature for another key is refused with 403."
forbidden_values: ["BAS-SIM-ACC-A", "BAS-SIM-1001"]
denied_statuses: [403]
expected_control: "A signature issued for another key is refused with 403, and no other tenant's file content is returned."
ground_truth:
  adapters: ["state", "response"]
  check: "No protected value of another tenant appears in the file response."
detection_assertion:
  status: fixture_validated
  reason: "The signed file path names an order owned by another customer. The lab now attributes an order ID embedded in a path segment to its owner, so the access event names that owner. Fixture-validated, not validated against a live SIEM."
detection:
  source: elastic-security
  expect_rule: APIBAS-REL-004
  min_severity: high
evidence:
  - sanitized_request
  - sanitized_response
  - state_diff
side_effect_class: READ_ONLY
cleanup:
  - "reset the lab to its fixture seed after the run"
industry_mapping:
  - "BFSI / GDPR: signed storage URLs must be bound to the object they authorise"
regulatory_mapping: []
negative_tests:
  - "API-BAS-DATA-010 against the fixed build must PASS"
