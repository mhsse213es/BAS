id: API-BAS-GWAY-005
name: Duplicate Content-Type headers make the gateway and the handler parse the body differently
category: GWAY
claim: property_level
attack_objective: >
  A customer sends two Content-Type headers. The gateway validates the body as JSON, and the
  handler reads the last header and applies a form-encoded status field the schema refuses.
threat_model:
  attacker: authenticated customer who owns the order
  identity: customer-b
  access_level: standard customer, valid token, owner of the object
  objective: change order status through a field the gateway's schema refuses, using header ambiguity
preconditions:
  fixture: orders-two-tenant
  identities: [customer-b]
  object: ORD-2001
steps:
  - id: baseline-owner-quantity
    role: baseline
    identity: customer-b
    auth: valid
    method: POST
    path: /api/gw/orders/{object}/quantity
    body: '{"quantity": "2"}'
    hypothesis: The owner can update quantity through the gateway. If this fails, the scenario is not testable.
  - id: attack-duplicate-content-type
    role: attack
    identity: customer-b
    auth: valid
    method: POST
    path: /api/gw/orders/{object}/quantity
    body: 'quantity=1&status=cancelled'
    extra_headers:
      - name: Content-Type
        value: application/x-www-form-urlencoded
    hypothesis: Ambiguous Content-Type headers are refused, so the body is not parsed under either type.
denied_statuses: [400]
expected_control: >
  The gateway refuses a request with two Content-Type headers with 400, and the order status
  is unchanged.
ground_truth:
  adapters: [state, response]
  check: >
    The order status is identical before and after the attack, and the response
    discloses no protected values.
detection_assertion:
  status: not_evaluated
  reason: "duplicate content-type on the attacker own order; body parsing differential is not a rule class. No detection claim is made."
evidence:
  - sanitized_request
  - sanitized_response
  - state_diff
side_effect_class: STATE_CHANGE_SANDBOX
cleanup:
  - reset the lab to its fixture seed after the run
industry_mapping:
  - "BFSI: gateways and backends that parse one request body differently"
regulatory_mapping: []
negative_tests:
  - API-BAS-GWAY-005 with a single JSON Content-Type and a permitted quantity against the fixed build must PASS
