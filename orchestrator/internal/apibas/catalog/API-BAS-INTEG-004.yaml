id: API-BAS-INTEG-004
name: Return page redirects the browser to an external host
category: INTEG
claim: authentication
attack_objective: >
  A customer crafts a return link that sends the browser to an external host.
threat_model:
  attacker: authenticated customer who can craft a return link
  identity: customer-a
  access_level: standard customer, valid token
  objective: send a victim to an external site through the application's return page
preconditions:
  fixture: orders-two-tenant
  identities: [customer-b, customer-a]
  object: ORD-2001
steps:
  - id: baseline-relative-return
    role: baseline
    identity: customer-b
    auth: valid
    method: GET
    path: /api/integrations/return?next=%2Forders%2FORD-2001
    hypothesis: A relative return target is allowed. If this fails, the scenario is not testable.
  - id: attack-external-return
    role: attack
    identity: customer-a
    auth: valid
    method: GET
    path: /api/integrations/return?next=https%3A%2F%2Fattacker.example%2Fphish
    hypothesis: Return targets must be relative paths on this host, so an external target is refused.
forbidden_response_headers:
  - name: Refresh
    value: attacker.example
    match: contains
denied_statuses: [400]
expected_control: >
  An external return target is refused with 400, and no page sends the browser to another host.
ground_truth:
  adapters: [state, response]
  check: >
    The response carries no Refresh header naming an external host, and the state is unchanged
    by the attack.
detection_assertion:
  status: fixture_validated
  reason: "The return page is asked to redirect off this origin. The lab records the destination and its verdict, and REL-012 fires on the attempt whatever the outcome. Fixture-validated, not validated against a live SIEM."
detection:
  source: elastic-security
  expect_rule: APIBAS-REL-012
  min_severity: high
evidence:
  - sanitized_request
  - sanitized_response
  - state_diff
side_effect_class: READ_ONLY
cleanup:
  - no cleanup required for a read-only scenario
industry_mapping:
  - "BFSI: post-login return links that redirect to external hosts"
regulatory_mapping: []
negative_tests:
  - API-BAS-INTEG-004 with a relative return target against the fixed build must return 200
