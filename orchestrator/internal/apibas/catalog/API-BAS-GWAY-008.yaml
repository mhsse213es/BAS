id: API-BAS-GWAY-008
name: Missing request schema lets a customer set an unexpected status on their own order
category: GWAY
claim: property_level
attack_objective: >
  A customer sends an extra status field to a quantity route that has no request schema, and
  the gateway passes the field through to the handler.
threat_model:
  attacker: authenticated customer who owns the order
  identity: customer-b
  access_level: standard customer, valid token, owner of the object
  objective: change order status through a route whose request schema is not enforced
preconditions:
  fixture: orders-two-tenant
  identities: [customer-b]
  object: ORD-2001
steps:
  - id: baseline-owner-quantity
    role: baseline
    identity: customer-b
    auth: valid
    method: POST
    path: /api/gw/orders/{object}/quantity
    body: '{"quantity": "2"}'
    hypothesis: The owner can update quantity through the gateway. If this fails, the scenario is not testable.
  - id: attack-unexpected-status-field
    role: attack
    identity: customer-b
    auth: valid
    method: POST
    path: /api/gw/orders/{object}/quantity
    body: '{"quantity": "1", "status": "cancelled"}'
    hypothesis: The gateway's request schema refuses fields other than quantity, so the status field is refused.
denied_statuses: [400]
expected_control: >
  The gateway refuses a body with an unexpected field with 400, and the order status is
  unchanged.
ground_truth:
  adapters: [state, response]
  check: >
    The order status is identical before and after the attack, and the response
    discloses no protected values.
detection_assertion:
  status: not_evaluated
  reason: "the unexpected status is a write (class write). Whether the gateway accepted it is a state property, not in the access event. No detection claim is made."
evidence:
  - sanitized_request
  - sanitized_response
  - state_diff
side_effect_class: STATE_CHANGE_SANDBOX
cleanup:
  - reset the lab to its fixture seed after the run
industry_mapping:
  - "BFSI: API routes that accept unschematised fields and bind them to records"
regulatory_mapping: []
negative_tests:
  - API-BAS-GWAY-008 with only the quantity field against the fixed build must PASS on the legitimate update
