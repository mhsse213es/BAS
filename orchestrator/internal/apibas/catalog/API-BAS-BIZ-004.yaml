id: "API-BAS-BIZ-004"
name: "Idempotency key reused with a different payment body"
category: BIZ
claim: function_level
attack_objective: "The customer reuses an idempotency key with a different payment body so the second payment is processed."
threat_model:
  attacker: "authenticated customer who owns the order"
  identity: customer-b
  access_level: "standard customer, valid token, owner of the order"
  objective: "process a second payment under a key already used for a different body"
preconditions:
  fixture: orders-two-tenant
  identities: [customer-b]
  object: ORD-2001
steps:
  - id: "baseline-first-payment"
    role: baseline
    identity: customer-b
    auth: valid
    method: POST
    path: "/api/biz/payments"
    body: "{\"amount\":10}"
    headers: {"Idempotency-Key": "BAS-IDEM-1"}
    hypothesis: "The first payment with the key succeeds. If it fails, the scenario is not testable."
  - id: "attack-key-reuse"
    role: attack
    identity: customer-b
    auth: valid
    method: POST
    path: "/api/biz/payments"
    body: "{\"amount\":20}"
    headers: {"Idempotency-Key": "BAS-IDEM-1"}
    repeat: 2
    hypothesis: "A key reused with a different body is refused with 422. Nothing is processed twice."
max_accepted_attempts: 1
denied_statuses: [422]
expected_control: "An idempotency key used with a different body is refused with 422. Only the first body is processed."
ground_truth:
  adapters: ["state", "response"]
  check: "The number of payments accepted for one idempotency key does not exceed one per run."
detection_assertion:
  status: not_evaluated
  reason: "two payment requests are below the volume threshold; no owner signal. No detection claim is made."
evidence:
  - sanitized_request
  - sanitized_response
  - state_diff
side_effect_class: STATE_CHANGE_SANDBOX
cleanup:
  - "reset the lab to its fixture seed after the run"
industry_mapping:
  - "BFSI: business-logic validation of payment and order workflows"
regulatory_mapping: []
negative_tests:
  - "API-BAS-BIZ-004 against the fixed build must PASS"
