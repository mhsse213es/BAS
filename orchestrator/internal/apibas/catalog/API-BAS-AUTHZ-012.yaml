id: API-BAS-AUTHZ-012
name: Export job of another customer fetched by ID
category: AUTHZ
claim: cross_identity
attack_objective: >
  A customer fetches an export job that belongs to another customer's order, by
  guessing or enumerating its ID.
threat_model:
  attacker: authenticated customer in tenant A
  identity: customer-a
  access_level: standard customer, valid token, no relation to the export
  objective: read another customer's exported order data
preconditions:
  fixture: orders-two-tenant
  identities: [customer-b, customer-a]
  object: ORD-2001
steps:
  - id: baseline-owner-export-read
    role: baseline
    identity: customer-b
    auth: valid
    method: GET
    path: /api/exports/EXP-2001
    hypothesis: The owner can fetch the export of their order. If this fails, the scenario is not testable.
  - id: attack-foreign-export-read
    role: attack
    identity: customer-a
    auth: valid
    method: GET
    path: /api/exports/EXP-2001
    hypothesis: The export lookup checks ownership, so a non-owner receives 404 and no order data.
denied_statuses: [403, 404]
expected_control: >
  An export is returned only to the owner of its order; anyone else receives 404
  and no protected values.
ground_truth:
  adapters: [state, response]
  check: >
    The state is unchanged by the attack and the attack response contains none
    of the owner's protected values.
detection_assertion:
  status: fixture_validated
  reason: Access events feed the elastic-security fixture. The result is fixture-validated, not live-SIEM-validated.
evidence:
  - sanitized_request
  - sanitized_response
  - state_diff
side_effect_class: READ_ONLY
cleanup:
  - none; the scenario creates no records
industry_mapping:
  - "BFSI: insecure direct object reference on exported statements"
regulatory_mapping: []
negative_tests:
  - API-BAS-AUTHZ-012 against the fixed build must PASS
detection:
  source: elastic-security
  expect_rule: APIBAS-REL-004
  min_severity: high
