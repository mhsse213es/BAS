# Adds one read permission to the discovery identity: get and list NetworkPolicies. It is a separate role, so the
# existing bas-discovery-readonly role is unchanged. Bound to the existing kube-system/bas-discovery service account.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bas-discovery-netpol-readonly
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bas-discovery-netpol-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bas-discovery-netpol-readonly
subjects:
  - kind: ServiceAccount
    name: bas-discovery
    namespace: kube-system
