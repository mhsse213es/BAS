# Mounted into the waf container at /etc/nginx/templates/conf.d/00-limit-req-zone.conf.template
# so the image's own entrypoint (the same docker-entrypoint.sh /
# 20-envsubst-on-templates.sh scripts the official nginx image uses --
# confirmed by this image's own documented templating mechanism) renders
# it into /etc/nginx/conf.d/00-limit-req-zone.conf at container start.
#
# limit_req_zone must live in the http {} context -- nginx.conf's own
# `include /etc/nginx/conf.d/*.conf;` sits directly inside http {}, so a
# bare directive in any conf.d file lands at that level. The "00-" prefix
# is cosmetic only: nginx builds the whole config into a tree before
# validating zone references, so a zone defined in this file is visible
# to a `limit_req` directive in any other conf.d file regardless of glob
# order.
#
# $binary_remote_addr -- not an environment variable, left untouched by
# the restricted envsubst substitution the image's entrypoint performs
# (it only substitutes names that are actually set as env vars; this
# lab's docker-compose.yml sets no var by this name).
#
# rate=2r/s burst=3 nodelay: deliberately strict so a short, bounded
# burst of real requests (RATE-001's own test shape) reliably trips
# enforcement within a handful of requests, for a fast, deterministic
# live test -- not a claim about any real client's actual traffic
# pattern.
limit_req_zone $binary_remote_addr zone=wafmodsec_perclient:10m rate=2r/s;
