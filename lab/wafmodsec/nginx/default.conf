# Mounted into the waf container at
# /etc/nginx/templates/conf.d/default.conf.template, replacing the
# image's own shipped conf.d/default.conf -- the documented template
# mechanism is whole-file replacement, not a merge, so this is a byte-for-
# byte copy of the image's own default.conf (dumped via `docker exec
# wafmodsec-lab-waf-1 cat /etc/nginx/conf.d/default.conf` before any
# change was made) plus one added `location = /api/quote` block in the
# port-8080 server, enforcing the zone defined in 00-limit-req-zone.conf,
# and one added `location = /legacy-search` block (origin-resilience's
# WAFORIGIN-001, routing-coverage-gap) with `modsecurity off;` -- a real,
# undocumented secondary route that proxies to the same backend as
# `/search` but was never registered with ModSecurity (confirmed via
# `conf.d/modsecurity.conf` setting `modsecurity on;` at the http
# context, which this location deliberately overrides).
# The 8443 TLS server block is left completely unmodified -- this lab's
# live tests only ever go through port 8080 (mapped to host 8888).
#
# Scoped to exactly /api/quote (nginx's `=` exact-match location, matched
# before the generic prefix `location /` below) -- an EARLIER version put
# `limit_req` directly in `location /`, which matches every path. That
# rate-limited every OTHER live test too (SQLI-001's /search, FILEUP's
# /upload, etc.), since they all share this one container across a test
# run from the same client IP and zone -- caught as a real regression:
# legitimate-traffic's XSS-001/PATHTRAV-001/RATE-001 benign legs started
# failing as false "incorrectly_blocked" results that were really this
# rate limiter catching unrelated requests, not CRS. Automated-abuse's
# own RATE-001 burst is deliberately the only thing this zone ever sees.
#
# Nginx variables below ($http_upgrade, $connection_upgrade,
# $always_redirect, $host, $request_uri) are nginx runtime variables, not
# environment variables, and are left untouched by the image's restricted
# envsubst substitution for the same reason noted in
# 00-limit-req-zone.conf.

server_tokens off;

more_set_headers 'Server: nginx';

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080 default_server;

    server_name localhost;
    set $always_redirect off;

    location = /api/quote {
        client_max_body_size 0;

        if ($always_redirect = on) {
            return 301 https://$host$request_uri;
        }

        limit_req zone=wafmodsec_perclient burst=3 nodelay;

        include includes/cors.conf;
        include includes/proxy_backend.conf;
    }

    location / {
        client_max_body_size 0;

        if ($always_redirect = on) {
            return 301 https://$host$request_uri;
        }

        include includes/cors.conf;
        include includes/proxy_backend.conf;

        index index.html index.htm;
        root /usr/share/nginx/html;
    }

    location = /legacy-search {
        modsecurity off;
        client_max_body_size 0;

        include includes/cors.conf;
        include includes/proxy_backend.conf;
    }

    include includes/location_common.conf;

}

server {
    listen 8443 ssl;

    server_name localhost;

    ssl_certificate /etc/nginx/conf/server.crt;
    ssl_certificate_key /etc/nginx/conf/server.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    ssl_dhparam /etc/ssl/certs/dhparam-2048.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    ssl_stapling on;
    ssl_stapling_verify on;

    ssl_verify_client off;
    ssl_verify_depth 1;

    location / {
        client_max_body_size 0;

        include includes/cors.conf;
        include includes/proxy_backend.conf;

        index index.html index.htm;
        root /usr/share/nginx/html;
    }

    include includes/location_common.conf;
}
